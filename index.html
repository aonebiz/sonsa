<style>
  html{color-scheme:light}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f7f7f5;color:#141413;-webkit-text-size-adjust:100%}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>

<body>
<div id="gateOverlay" style="position:fixed;inset:0;z-index:99999;background:#f7f7f5;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font:14px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;">
  <div style="width:100%;max-width:320px;text-align:center;">
    <div style="width:64px;height:64px;margin:0 auto 18px;border-radius:16px;background:#1f5fa8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:800;letter-spacing:-0.03em;">신체</div>
    <h1 style="margin:0 0 6px;font-size:1.05rem;font-weight:800;color:#141413;letter-spacing:-0.02em;">신체손해사정사 학습노트</h1>
    <p style="margin:0 0 22px;font-size:0.8rem;color:#6b6a66;line-height:1.5;">비공개 자료입니다.<br>4자리 비밀번호를 입력하세요.</p>
    <input id="gatePin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:14px 12px;font-size:1.5rem;text-align:center;letter-spacing:0.5em;text-indent:0.5em;border:1.5px solid #dcdbd6;border-radius:12px;background:#fff;color:#141413;outline:none;-webkit-appearance:none;">
    <div id="gateMsg" style="min-height:18px;margin-top:10px;font-size:0.75rem;font-weight:700;color:#c0392b;"></div>
    <button id="gateBtn" style="margin-top:6px;width:100%;padding:12px;font-size:0.9rem;font-weight:700;color:#fff;background:#1f5fa8;border:none;border-radius:12px;cursor:pointer;font-family:inherit;">열기</button>
  </div>
</div>
<script>
(function(){
  var K="shsjs-gate-v1", H=221893399;
  function hash(s){var x=5381;for(var i=0;i<s.length;i++){x=((x*33)^s.charCodeAt(i))>>>0;}return x;}
  var ov=document.getElementById("gateOverlay"),
      pin=document.getElementById("gatePin"),
      msg=document.getElementById("gateMsg"),
      btn=document.getElementById("gateBtn");
  function open(){ try{localStorage.setItem(K,"1");}catch(e){} ov.parentNode.removeChild(ov); document.documentElement.style.overflow=""; }
  var ok=false; try{ ok = localStorage.getItem(K)==="1"; }catch(e){}
  if(ok){ open(); return; }
  document.documentElement.style.overflow="hidden";
  function tryPin(){
    var v=(pin.value||"").trim();
    if(hash("shsjs::"+v)===H){ open(); }
    else { msg.textContent="비밀번호가 맞지 않습니다."; pin.value=""; pin.focus(); }
  }
  pin.addEventListener("input",function(){ msg.textContent=""; if(pin.value.length===4) tryPin(); });
  pin.addEventListener("keydown",function(e){ if(e.key==="Enter") tryPin(); });
  btn.addEventListener("click",tryPin);
  setTimeout(function(){ try{pin.focus();}catch(e){} },100);
})();
</script>

<title>신체손해사정사 학습노트</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  :root{
    color-scheme: light;
    --page:#f7f7f5; --surface:#ffffff; --sunk:#f0efec;
    --ink:#141413; --ink2:#54534e; --muted:#8a8880;
    --line:#e3e2dc; --border:rgba(20,20,19,0.10);
    --accent:#1f5fa8; --accent-soft:#e4eefb; --accent-ink:#144a86;
    --hot:#c0492c; --hot-soft:#fbe8e2;
    --ok:#1a7f4b; --ok-soft:#e2f2e9;
    --amber:#a97400; --amber-soft:#fbf0d8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#111110; --surface:#1b1b1a; --sunk:#232322;
      --ink:#f2f1ec; --ink2:#c0bfb8; --muted:#8a8880;
      --line:#2f2f2d; --border:rgba(255,255,255,0.11);
      --accent:#5c9ce6; --accent-soft:#17304d; --accent-ink:#9cc4f0;
      --hot:#e37a5c; --hot-soft:#3a201a;
      --ok:#4cb87c; --ok-soft:#16301f;
      --amber:#d9a63c; --amber-soft:#332705;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#111110; --surface:#1b1b1a; --sunk:#232322;
    --ink:#f2f1ec; --ink2:#c0bfb8; --muted:#8a8880;
    --line:#2f2f2d; --border:rgba(255,255,255,0.11);
    --accent:#5c9ce6; --accent-soft:#17304d; --accent-ink:#9cc4f0;
    --hot:#e37a5c; --hot-soft:#3a201a;
    --ok:#4cb87c; --ok-soft:#16301f;
    --amber:#d9a63c; --amber-soft:#332705;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--page); color:var(--ink);
    font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    line-height:1.6; font-size:15px;
  }
  .wrap{max-width:860px; margin:0 auto; padding-block:0 64px; padding-left:16px; padding-right:16px;}

  header.top{position:sticky; top:0; z-index:30; background:var(--page); padding-block:12px 0; border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  h1{font-size:1.15rem; font-weight:800; letter-spacing:-0.02em; margin:0;}
  .brand .tag{font-size:0.72rem; color:var(--muted); font-weight:500;}
  .brand .guidelink{font-size:0.72rem; font-weight:700; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft); padding-bottom:1px;}
  .brand .guidelink:hover{border-bottom-color:var(--accent);}
  nav.tabs{display:flex; gap:4px; overflow-x:auto; margin-top:10px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto; padding:8px 13px; border:none; background:none; cursor:pointer;
    font-family:inherit; font-size:0.83rem; font-weight:700; color:var(--muted);
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink); border-bottom-color:var(--accent);}
  nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}

  section.panel{display:none;}
  section.panel.active{display:block;}

  .toolbar{display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 4px;}
  .toolbar button{
    padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink2); font-family:inherit; font-size:0.78rem; font-weight:700; cursor:pointer;
  }
  .toolbar button.active{background:var(--ink); color:var(--page); border-color:var(--ink);}
  .toolbar button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .unitlist{display:flex; flex-direction:column; gap:2px; margin:14px 0 18px;}
  .unitlist button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:10px 12px; border:1px solid transparent; border-radius:8px; background:none;
    font-family:inherit; font-size:0.86rem; color:var(--ink2); cursor:pointer; font-weight:500;
  }
  .unitlist button:hover{background:var(--sunk);}
  .unitlist button.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:700; border-color:var(--border);}
  .unitlist .n{font-size:0.72rem; color:var(--muted); font-variant-numeric:tabular-nums; min-width:1.4em;}
  .unitlist button.active .n{color:var(--accent-ink);}

  .freq{
    display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:5px;
    font-size:0.7rem; font-weight:700; white-space:nowrap; letter-spacing:0.02em;
  }
  .freq.f3{background:var(--hot-soft); color:var(--hot);}
  .freq.f2{background:var(--amber-soft); color:var(--amber);}
  .freq.f1{background:var(--sunk); color:var(--muted);}

  article.book h2{
    font-size:1.05rem; font-weight:800; margin:28px 0 2px; letter-spacing:-0.01em;
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; text-wrap:balance;
  }
  article.book h2:first-child{margin-top:4px;}
  article.book p{margin:8px 0; color:var(--ink2);}
  article.book ul,article.book ol{margin:8px 0; padding-left:20px; color:var(--ink2);}
  article.book li{margin:5px 0;}
  article.book b{color:var(--ink);}
  .lead{border-left:3px solid var(--accent); padding:2px 0 2px 13px; margin:12px 0; color:var(--ink2); font-size:0.92rem;}
  .lawbox{
    background:var(--sunk); border-radius:8px; padding:12px 14px; margin:12px 0;
    font-size:0.86rem; color:var(--ink2); border:1px solid var(--border);
  }
  .lawbox .src{display:block; font-size:0.72rem; font-weight:700; color:var(--muted); margin-bottom:5px; letter-spacing:0.03em;}
  table.mini{width:100%; border-collapse:collapse; margin:12px 0; font-size:0.84rem;}
  table.mini th,table.mini td{border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top;}
  table.mini th{background:var(--sunk); font-weight:700; font-size:0.79rem;}
  table.mini td{color:var(--ink2); font-variant-numeric:tabular-nums;}
  .scroller{overflow-x:auto;}

  .mnemo{
    background:var(--ok-soft); border:1px solid var(--border); border-left:3px solid var(--ok);
    border-radius:0 8px 8px 0; padding:11px 14px; margin:14px 0; font-size:0.87rem; color:var(--ink2);
  }
  .mnemo .h{font-size:0.71rem; font-weight:800; color:var(--ok); letter-spacing:0.05em; display:block; margin-bottom:4px;}
  .mnemo .key{font-size:1.05rem; font-weight:800; color:var(--ink); letter-spacing:0.06em;}

  .endquiz{
    margin:30px 0 10px; padding:14px 16px; border:1px dashed var(--border); border-radius:10px;
    background:var(--surface); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .endquiz b{font-size:0.9rem;}
  .endquiz span{font-size:0.8rem; color:var(--muted);}
  .btn{
    padding:8px 15px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff;
    font-family:inherit; font-size:0.82rem; font-weight:700; cursor:pointer;
  }
  .btn.ghost{background:var(--surface); color:var(--accent-ink); }
  .btn:disabled{opacity:0.5; cursor:default;}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .deck{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px; margin-top:14px;}
  .cardslot{display:flex; flex-direction:column; gap:6px;}
  .flip{position:relative; min-height:128px; cursor:pointer; perspective:900px;}
  .flip-inner{position:relative; width:100%; min-height:128px; transition:transform .45s; transform-style:preserve-3d;}
  @media (prefers-reduced-motion: reduce){ .flip-inner{transition:none;} }
  .flip.on .flip-inner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:10px; border:1px solid var(--border);
    padding:13px; display:flex; align-items:center; justify-content:center; text-align:center; overflow:auto;
  }
  .face.front{background:var(--surface); color:var(--ink); font-weight:700; font-size:0.87rem;}
  .face.back{background:var(--accent-soft); color:var(--accent-ink); transform:rotateY(180deg); font-size:0.8rem; line-height:1.55; font-weight:500;}
  .marks{display:flex; gap:5px;}
  .marks button{
    flex:1; border:1px solid var(--border); background:var(--surface); border-radius:6px;
    font-family:inherit; font-size:0.72rem; font-weight:700; color:var(--muted); padding:5px; cursor:pointer;
  }
  .marks button.on-know{background:var(--ok); color:#fff; border-color:var(--ok);}
  .marks button.on-unk{background:var(--hot); color:#fff; border-color:var(--hot);}

  .qcard{margin:12px 0; padding:15px 16px; border:1px solid var(--border); border-radius:10px; background:var(--surface);}
  .qhead{display:flex; justify-content:space-between; gap:8px; align-items:center; font-size:0.72rem; color:var(--muted); font-weight:700; margin-bottom:7px; font-variant-numeric:tabular-nums;}
  .qtext{font-weight:700; font-size:0.93rem; margin-bottom:10px; line-height:1.6;}
  .ans{display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:0.87rem; color:var(--ink2); white-space:pre-wrap;}
  .qcard.open .ans{display:block;}
  .pq.open .ans{display:block;}
  .pq .ans{border-top:1px solid var(--line);}
  .selfcheck{display:flex; gap:6px; margin-top:12px;}
  .selfcheck button{border:1px solid var(--border); background:var(--surface); border-radius:6px; font-family:inherit; font-size:0.75rem; font-weight:700; color:var(--muted); padding:5px 12px; cursor:pointer;}
  .selfcheck button.on-ok{background:var(--ok); color:#fff; border-color:var(--ok);}
  .selfcheck button.on-no{background:var(--hot); color:#fff; border-color:var(--hot);}
  .gen{font-size:0.7rem; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); padding:2px 7px; border-radius:4px;}

  .pq{border-left:3px solid var(--accent); padding:9px 13px; margin:9px 0; background:var(--surface); border-radius:0 8px 8px 0; font-size:0.87rem; color:var(--ink2);}
  .pq .meta{font-size:0.71rem; color:var(--muted); font-weight:700; margin-bottom:3px; letter-spacing:0.03em;}

  .chatwrap{display:flex; flex-direction:column; height:min(64vh,560px); border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden; margin-top:14px;}
  .chatlog{flex:1; overflow-y:auto; padding:16px; font-size:0.88rem;}
  .bubble{max-width:90%; padding:10px 14px; border-radius:12px; margin:8px 0; white-space:pre-wrap; line-height:1.65;}
  .bubble.user{background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:4px;}
  .bubble.bot{background:var(--sunk); color:var(--ink); border-bottom-left-radius:4px;}
  .chatform{display:flex; gap:8px; padding:10px; border-top:1px solid var(--line);}
  .chatform textarea{flex:1; resize:none; height:46px; border:1px solid var(--border); border-radius:9px; padding:11px 12px; font-size:0.88rem; font-family:inherit; background:var(--page); color:var(--ink);}
  .chatform textarea:focus-visible{outline:2px solid var(--accent); outline-offset:-1px;}
  .chips{padding:0 14px 10px; display:flex; gap:6px; flex-wrap:wrap;}
  .chip{padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:var(--page); color:var(--ink2); font-family:inherit; font-size:0.75rem; cursor:pointer;}

  .stat{display:flex; justify-content:space-between; align-items:baseline; font-size:0.82rem; margin-bottom:5px;}
  .stat b{font-weight:700;}
  .stat span{color:var(--muted); font-size:0.76rem; font-variant-numeric:tabular-nums;}
  .bar{height:7px; background:var(--sunk); border-radius:4px; overflow:hidden;}
  .bar>div{height:100%; background:var(--accent); border-radius:4px;}
  .statblock{margin:16px 0;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; margin:14px 0;}
  .card h3{margin:0 0 10px; font-size:0.98rem; font-weight:800;}
  .card ul{margin:6px 0; padding-left:19px; font-size:0.87rem; color:var(--ink2);}
  .card li{margin:5px 0;}
  .note{font-size:0.8rem; color:var(--muted); margin:10px 0;}
  .empty{color:var(--muted); font-size:0.86rem; padding:28px 0; text-align:center;}
  .warn{background:var(--amber-soft); border:1px solid var(--border); border-radius:9px; padding:11px 14px; font-size:0.82rem; color:var(--ink2); margin:14px 0;}

  /* ---- 초보자 안내 / 용어 ---- */
  .why{background:var(--accent-soft); border-radius:9px; padding:12px 15px; margin:12px 0; font-size:0.88rem; color:var(--accent-ink);}
  .why .h{display:block; font-size:0.71rem; font-weight:800; letter-spacing:0.05em; margin-bottom:4px; opacity:0.8;}
  .terms{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-top:12px;}
  .term{background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px 14px;}
  .term b{display:block; font-size:0.9rem; margin-bottom:3px;}
  .term span{font-size:0.83rem; color:var(--ink2);}
  .term .en{font-size:0.72rem; color:var(--muted); font-weight:500;}

  /* ---- 계산 ---- */
  .calc{border:1px solid var(--border); border-radius:12px; background:var(--surface); margin:16px 0; overflow:hidden;}
  .calc>h3{margin:0; padding:14px 16px; font-size:0.96rem; font-weight:800; background:var(--sunk); display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .calc .setup{padding:14px 16px; font-size:0.87rem; color:var(--ink2); border-bottom:1px solid var(--line);}
  .calc .setup b{color:var(--ink);}
  .calc .setup ul{margin:6px 0; padding-left:19px;}
  .steps{padding:6px 16px 16px;}
  .step{border-left:2px solid var(--line); padding:0 0 4px 16px; margin-left:6px; position:relative;}
  .step:last-child{border-left-color:transparent;}
  .step .dot{position:absolute; left:-9px; top:12px; width:16px; height:16px; border-radius:50%; background:var(--accent); color:#fff; font-size:0.65rem; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .step .st{font-weight:700; font-size:0.89rem; margin:10px 0 4px;}
  .step .sb{font-size:0.86rem; color:var(--ink2); white-space:pre-wrap;}
  .step .sb .num{font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink);}
  .calc .final{margin:12px 16px 16px; padding:12px 15px; background:var(--ok-soft); border-radius:9px; font-size:0.9rem; font-weight:700; color:var(--ink);}
  .calc .trap{margin:0 16px 16px; padding:11px 15px; background:var(--hot-soft); border-radius:9px; font-size:0.85rem; color:var(--ink2);}
  .calc .trap b{color:var(--hot);}
  .peek{display:block; width:100%; margin:10px 0; padding:9px; border:1px dashed var(--border); border-radius:8px; background:var(--page); color:var(--ink2); font-family:inherit; font-size:0.82rem; font-weight:700; cursor:pointer;}
  .steps.hidden .step{display:none;}
  .final.hidden,.trap.hidden{display:none;}
  .lik{display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:5px; font-size:0.68rem; font-weight:800; letter-spacing:0.02em; margin-left:6px;}
  .lik.l3{background:var(--hot-soft); color:var(--hot);}
  .lik.l2{background:var(--amber-soft); color:var(--amber);}
  .lik.l1{background:var(--sunk); color:var(--muted);}
  .qhead{flex-wrap:wrap;}


  /* ---- 답안 템플릿 ---- */
  .tmpl{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin:12px 0; font-size:0.86rem; color:var(--ink2); white-space:pre-wrap; line-height:1.75;}
  .tmpl b{color:var(--ink);}

.dg{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;}
.dg .dgt{font-weight:800;font-size:0.86rem;margin-bottom:8px;}
.dg svg,.qfig svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto;font-family:inherit;}
.dg figcaption{font-size:0.74rem;color:var(--muted);margin-top:8px;line-height:1.65;}
.qfig{margin:16px 0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;}
.qfig .qrd{display:inline-block;font-size:0.66rem;font-weight:800;color:#a8412a;background:#fdece7;border:1px solid #e0b3a4;border-radius:9px;padding:2px 8px;}
.qfig .qt{font-weight:800;font-size:0.92rem;margin:8px 0 6px;}
.qfig .qq{font-size:0.8rem;line-height:1.8;background:var(--page);border-left:3px solid var(--accent);padding:9px 12px;border-radius:3px;margin-bottom:10px;}

      {h:"답안은 이렇게 생겼다",

Ⅲ. 사례의 적용

       <div class="why"><span class="h">강사들이 반복해서 하는 말</span>

       <div class="why"><span class="h">분량 감각</span>

      {h:"먼저 익혀야 할 용어",

        {t:"보유자", en:"保有者", d:"자동차의 소유자나 사용할 권리가 있는 자로서 자기를 위하여 운행하는 자. 실무에서 운행자와 거의 같은 뜻으로 쓴다."},

        {t:"대인배상Ⅰ", en:"", d:"법으로 반드시 가입해야 하는 책임보험. 한도가 정해져 있다(사망 1.5억 등). '책임보험'이라고도 부른다."},

    cards:[
      {f:"4교시 시험의 3단계 사고틀은?", b:"① 누가 책임지는가(책임) → ② 얼마인가(손해액) → ③ 보험사가 얼마 내는가(지급보험금). 모든 문제가 이 순서다."},
      {f:"약술형(10~15점) 답안의 뼈대는?", b:"Ⅰ. 의의 → Ⅱ. 요건/유형/내용(번호) → Ⅲ. 결론."},
      {f:"사례형(20~30점) 답안의 뼈대는?", b:"Ⅰ. 쟁점 → Ⅱ. 법리·약관규정(판단기준) → Ⅲ. 사례의 적용 → Ⅳ. 결론."},
      {f:"사례문제에서 결론이 틀리면?", b:"결론이 달라도 논리구성이 정확하면 점수가 있다. 판단기준과 사례의 적용 틀을 지키는 것이 우선."},

      {f:"배점별 답안 분량 기준은?", b:"10점=A4 반 장, 20점=한 장, 30점=한 장 반. 1점당 약 50초."},

    quiz:[
      {q:"자동차보험 4교시 사례형 문제를 푸는 표준 순서를 6단계로 제시하고, 각 단계에서 확인할 사항을 약술하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 책임 — 누가 배상책임을 지는가\n운행자성(운행지배·운행이익), 타인성, 면책 3요건을 확인한다.\n\nⅡ. 담보 — 어느 담보에서 보상하는가\n대인배상Ⅰ·Ⅱ, 자기신체사고, 무보험차상해별로 피보험자 지위와 면책조항, 특약 위반 여부를 확인한다.\n\nⅢ. 손해액 — 적극손해·소극손해·위자료로 나누어 항목별로 산정한다.\n\nⅣ. 조정 — 기왕증 공제, 동승자 감액, 과실상계, 손익상계를 순서대로 적용한다.\n\nⅤ. 한도 — 대인배상Ⅰ 한도를 적용하고 초과분을 대인배상Ⅱ로 넘긴다.\n\nⅥ. 배분 — 상속분에 따라 유족별로 나누며 혼동·대습상속을 확인한다.`},
      {q:"논문형 답안 작성에서 '판단기준과 사례의 적용' 구조가 갖는 의미를 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 의의\n사례형 문제에서 먼저 일반적 판단기준(법리·약관규정·판례의 태도)을 제시하고, 그 기준을 사실관계에 대입하여 결론을 도출하는 답안 구조를 말한다.\n\nⅡ. 채점상의 의미\n1. 채점은 키워드와 목차 단위로 이루어지므로, 판단기준을 정확히 제시하면 결론이 달라도 상당한 점수를 얻는다.\n2. 기준 없이 결론만 쓰면 논리가 없어 점수를 받기 어렵다.\n\nⅢ. 실무상의 의미\n손해사정 실무도 동일한 구조를 따른다. 약관과 법리라는 기준을 먼저 확정하고 개별 사안에 적용하는 것이 손해사정서의 기본 형식이다.\n\nⅣ. 결론\n답안의 신뢰성은 결론이 아니라 기준의 정확성에서 나온다.`},
      {q:"자동차보험 대인배상에서 '운행자'와 '운전자'의 개념을 구별하고, 그 구별의 실익을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 개념\n1. 운행자 — 자기를 위하여 자동차를 운행하는 자로서, 운행지배와 운행이익을 가진 자를 말한다.\n2. 운전자 — 자동차를 현실적으로 조작하는 자로서 운전보조자를 포함한다.\n\nⅡ. 구별의 실익\n1. 책임의 주체 — 자배법 제3조의 배상책임을 지는 자는 운행자이지 운전자가 아니다. 운전자는 민법 제750조의 불법행위책임을 진다.\n2. 타인성 — 운행자와 운전자는 모두 자배법상 '다른 사람'에서 제외되므로 자배법의 보호를 받지 못한다.\n3. 피보험자 지위 — 약관은 운전피보험자를 별도로 두어 담보하므로, 운전자도 보험의 보호를 받을 수 있다.\n\nⅢ. 결론\n운행자는 지배와 이익의 귀속 주체, 운전자는 현실적 조작자라는 점에서 구별되며, 배상책임의 근거 법조가 달라진다.`},
      {q:"자동차보험 대인배상 담보체계를 대인배상Ⅰ·대인배상Ⅱ·자기신체사고·무보험자동차에 의한 상해로 나누어 그 성격과 보상대상을 비교하시오. (15점)", pts:15, lik:2,
       a:`Ⅰ. 대인배상Ⅰ\n1. 성격 — 자배법상 가입이 강제되는 의무보험(책임보험)\n2. 보상대상 — 타인의 인적손해\n3. 특징 — 보상한도가 법정되어 있고, 피해자에게 직접청구권이 인정된다.\n\nⅡ. 대인배상Ⅱ\n1. 성격 — 임의보험\n2. 보상대상 — 대인배상Ⅰ의 지급액을 초과하는 타인의 인적손해\n3. 특징 — 보통 무한으로 가입하며, 가족면책·유상운송 면책 등 면책조항이 적용된다.\n\nⅢ. 자기신체사고\n1. 성격 — 임의·정액 담보\n2. 보상대상 — 피보험자 본인과 그 가족의 상해\n3. 특징 — 배상책임과 무관하므로 과실상계를 하지 않고, 약관상 급별 가입금액을 지급한다.\n\nⅣ. 무보험자동차에 의한 상해\n1. 성격 — 임의 담보\n2. 보상대상 — 무보험자동차에 의하여 피보험자가 입은 손해\n3. 특징 — 실제 손해액 기준으로 보상하며, 보험자는 지급 후 가해자에게 보험자대위를 행사한다.\n\nⅤ. 결론\n대인배상Ⅰ·Ⅱ는 타인에 대한 배상책임 담보, 자기신체사고와 무보험차상해는 피보험자 자신을 위한 담보라는 점에서 성격이 구별된다.`},
      {q:"손해배상에서 손해를 적극손해·소극손해·위자료로 3분하는 이유와 각 항목의 내용을 부상과 사망으로 나누어 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 3분설의 의의와 이유\n손해를 성질별로 구분하여 산정하면 항목의 누락을 방지하고 손익상계 시 동일 성질의 항목끼리 대응시킬 수 있어 산정의 정확성과 공평이 확보된다.\n\nⅡ. 적극손해 — 실제 지출한 비용\n1. 부상 — 치료관계비, 간병비\n2. 사망 — 장례비\n\nⅢ. 소극손해 — 얻지 못한 이익\n1. 부상 — 휴업손해\n2. 사망 — 상실수익액\n\nⅣ. 위자료 — 정신적 고통에 대한 배상\n1. 부상 — 상해급별 부상위자료\n2. 사망 — 사망위자료\n\nⅤ. 결론\n손익상계는 항목 대응 원칙에 따르므로 3분설은 단순한 분류가 아니라 산정의 전제가 된다.`},
      {q:"자동차보험 약관상 '피보험자'의 종류를 열거하고, 피보험자 지위 확정이 실무에서 중요한 이유를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 피보험자의 종류\n1. 기명피보험자 — 보험증권에 기재된 피보험자\n2. 친족피보험자 — 기명피보험자와 같이 살거나 살림을 같이하는 친족으로서 자동차를 사용·관리 중인 자\n3. 승낙피보험자 — 기명피보험자의 승낙을 얻어 사용·관리 중인 자\n4. 사용피보험자 — 기명피보험자의 사용자\n5. 운전피보험자 — 위 피보험자를 위하여 운전 중인 자\n\nⅡ. 지위 확정이 중요한 이유\n1. 보상 여부의 결정 — 피보험자가 아니면 애초에 담보 대상이 아니다. 무단운전자는 승낙이 없어 피보험자가 되지 못한다.\n2. 면책사유의 귀속 — 피보험자 개별적용 원칙에 따라 면책사유는 피보험자별로 판단한다.\n3. 타인성의 판단 — 피보험자가 곧 타인이 아닌 것은 아니므로 자배법상 타인성과 구별하여야 한다.\n4. 구상권의 행사 — 보험금청구권을 상실한 피보험자에 대한 구상 여부가 달라진다.\n\nⅢ. 결론\n사례형 문제는 등장인물마다 피보험자 지위를 확정하는 것에서 출발한다.`},
      {q:"자동차보험 실무에서 '약관 중심의 학습'이 강조되는 이유를 손해사정 업무의 특성과 관련하여 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 손해사정 업무의 특성\n손해사정은 보험계약에 따른 보상책임의 존부와 범위를 확정하는 업무이므로, 그 판단기준은 일차적으로 보험계약의 내용인 약관이다.\n\nⅡ. 약관 중심 학습이 필요한 이유\n1. 지급기준의 구체성 — 위자료·장례비·상실수익액 등 금액 산정은 법률이 아니라 약관 지급기준이 정한다.\n2. 면책사유의 근거 — 가족면책, 유상운송 면책, 한정운전 특약 위반 등은 모두 약관 조항이다.\n3. 절차의 규율 — 직접청구권의 행사, 청구권 경합의 처리, 보험금 지급기일 등이 약관에 규정되어 있다.\n\nⅢ. 법률과의 관계\n자배법과 민법은 배상책임의 성립을 규율하고, 약관은 그 책임을 보험으로 어떻게 처리할지를 규율한다. 따라서 법률은 책임 단계에서, 약관은 보상 단계에서 각각 필요하다.\n\nⅣ. 결론\n답안에서도 법조문과 약관조항을 함께 인용하되, 보상 여부와 금액은 약관을 근거로 서술하여야 한다.`},
      {q:"자동차사고 손해사정에서 '판단기준'을 먼저 세우고 사례에 적용하는 방식의 장점을 설명하고, 그 절차를 예시하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 장점\n1. 일관성 — 유사 사안에서 동일한 기준이 적용되어 처리의 일관성이 확보된다.\n2. 설명가능성 — 피해자와 피보험자에게 결론의 근거를 제시할 수 있다.\n3. 분쟁 대응 — 소송이나 분쟁조정에서 판단 과정을 입증할 수 있다.\n\nⅡ. 절차의 예시 — 무단운전 사안\n1. 판단기준의 제시 — 운행자성은 운행지배와 운행이익으로 판단하며, 무단운전의 경우 평소 관계, 차량·열쇠 관리상태, 예견가능성, 운행의 일시성 등을 종합한다.\n2. 사실의 확인 — 열쇠 보관 장소, 운전자와 보유자의 관계, 평소 차량 사용 실태를 조사한다.\n3. 적용과 결론 — 확인된 사실을 기준에 대입하여 운행자성 유지 여부를 결정한다.\n\nⅢ. 결론\n기준 없는 결론은 설득력이 없으므로, 실무와 답안 모두 기준 제시가 선행되어야 한다.`},
      {q:"자동차보험에서 '배상책임 담보'와 '자기를 위한 담보'의 차이를 과실상계·가족면책·혼동의 세 가지 측면에서 비교하시오. (15점)", pts:15, lik:2,
       a:`Ⅰ. 구분\n1. 배상책임 담보 — 대인배상Ⅰ·Ⅱ. 타인에 대한 법률상 손해배상책임을 담보한다.\n2. 자기를 위한 담보 — 자기신체사고, 무보험차상해. 피보험자 자신의 손해를 보상한다.\n\nⅡ. 과실상계\n1. 배상책임 담보 — 손해배상액 산정 과정이므로 피해자의 과실을 상계한다.\n2. 자기신체사고 — 약관상 정액급부이므로 과실상계를 하지 않는다.\n\nⅢ. 가족면책\n1. 대인배상Ⅱ — 피보험자 또는 그 부모·배우자·자녀의 사상은 면책된다. 가족 간 배상에서 생기는 도덕적 위험을 차단하기 위함이다.\n2. 자기신체사고 — 오히려 가족이 보상대상이다.\n\nⅣ. 혼동\n1. 대인배상Ⅰ — 손해배상채권이므로 가해자가 상속인이 되면 그 상속분은 혼동으로 소멸한다.\n2. 자기신체사고 — 보험계약상 급부청구권이므로 혼동이 발생하지 않아 가해자도 수령한다.\n\nⅤ. 결론\n세 가지 차이는 모두 '배상책임인가, 자기를 위한 급부인가'라는 성질 차이에서 도출된다.`},
      {q:"자동차보험 시험에서 계산문제의 비중과 대비방법을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 출제 비중\n41~49회 9개년 기준으로 사례형 계산문제가 매년 15~55점을 차지한다. 특히 44·47·49회는 30점 내외의 종합 사례가 출제되었다.\n\nⅡ. 계산문제의 구조\n손해액 산정 → 기왕증 공제 → 동승자 감액 → 과실상계 → 손익상계 → 담보별 한도 적용 → 유족별 배분의 순서로 진행된다.\n\nⅢ. 대비방법\n1. 기준표의 암기 — 대인배상Ⅰ 한도, 위자료, 장례비, 생계비 공제율, 동승자 감액비율, 상속분\n2. 순서의 체화 — 순서를 바꾸면 금액이 달라지므로 반복 연습이 필요하다.\n3. 손계산 훈련 — 신체손해사정사 시험은 전 과목 계산기 사용이 불가하다.\n4. 산출과정의 서술 — 답만 쓰면 부분점수가 없으므로 산식과 단계를 반드시 남긴다.\n\nⅣ. 결론\n계산문제는 창의력이 아니라 순서와 기준표의 숙달로 해결되므로, 가장 확실하게 점수를 올릴 수 있는 영역이다.`}

       <tr><td>피해자 보호</td><td>직접청구권, 의무보험, 정부보장사업</td><td>별도 제도 없음</td></tr>
       </table></div>
       <p>43회는 이 비교를 <b>25점</b>짜리 단독 문제로 냈다. 표의 6개 항목이 그대로 목차가 된다.</p>`,
       mnemo:{key:"주 · 대 · 입 · 성 · 순 · 보", how:"비교 목차 6개 — 배상책임의 <b>주</b>체 · 적용<b>대</b>상 · <b>입</b>증책임 · 책임의 <b>성</b>질 · 적용<b>순</b>서 · 피해자<b>보</b>호.<br>25점짜리 비교문제는 이 여섯 칸을 채우면 끝난다."}},

      {h:"운행자책임의 성립요건 (제3조 본문)", freq:F(3,[45,48,49]),
       body:`<div class="lawbox"><span class="src">자배법 제3조 본문</span>자기를 위하여 자동차를 운행하는 자는 그 운행으로 다른 사람을 사망하게 하거나 부상하게 한 경우에는 그 손해를 배상할 책임을 진다.</div>
       <ol><li><b>자기를 위하여 자동차를 운행하는 자</b>(운행자) — 운행지배 + 운행이익</li>
       <li><b>자동차</b> — 자동차관리법상 자동차 및 건설기계관리법상 일부 건설기계. 고소작업차(스카이차) 같은 <b>특수자동차도 포함</b>된다(41회). 전동킥보드(PM)는 해당하지 않는다.</li>
       <li><b>운행으로</b> — 자동차를 <b>그 용법에 따라 사용</b>하는 것과 사고 사이의 인과관계. 주행 중이 아니어도 문 개폐·적재장치·작업대 조작 등 <b>고유장치의 사용</b>이면 운행이다.</li>
       <li><b>다른 사람(타인)</b>을 사망·부상하게 할 것</li></ol>
       <div class="why"><span class="h">41회가 물은 것</span>
       정차한 고소작업차의 <b>작업대(바스켓)를 조종하다</b> 작업자가 추락한 사고였다. 주행 중이 아니어도 <b>고유장치의 사용</b>이므로 '운행'에 해당한다는 것이 출제 포인트였다.</div>`,
       mnemo:{key:"운 · 자 · 운 · 타", how:"<b>운</b>행자가 · <b>자</b>동차를 · <b>운</b>행으로 · <b>타</b>인을 다치게 했는가.<br>'운행'은 주행이 아니라 <b>용법에 따른 사용</b>. 크레인·작업대·문 개폐도 운행이다."}},

      {h:"운행자성 — 운행지배와 운행이익", freq:F(3,[41,45,46,49]),
       body:`<p><b>운행지배</b>는 "그 차를 내 마음대로 할 수 있는가", <b>운행이익</b>은 "그 차가 굴러서 내가 덕을 보는가"이다. 둘 다 있어야 운행자다. 판례는 직접적·현실적 지배뿐 아니라 <b>간접적·관념적 지배</b>도 인정한다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>유형</th><th>결론</th><th>판단 포인트</th></tr>
       <tr><td><b>무단운전</b></td><td>유지되는 경우가 많음</td><td>평소 관계, 열쇠·차량 관리상태, 예견가능성, 운행거리·시간, 반환의사</td></tr>
       <tr><td><b>절취운전</b></td><td>원칙적으로 상실</td><td>열쇠 방치 등 관리과실이 크면 예외적으로 인정</td></tr>
       <tr><td>명의잔존(매도 후 미이전)</td><td>매도인 부정</td><td>실질적 처분권이 매수인에게 넘어갔는지</td></tr>
       <tr><td><b>임대(고소작업차 등)</b></td><td>임대인 <b>유지</b></td><td>고용운전자가 조종, 임대인이 관리권 보유 → 임차인은 <b>타인</b>이 될 수 있다(41회)</td></tr>
       <tr><td>단기 렌터카</td><td>대여업자 유지</td><td>단기간·반환예정, 업자의 관리권 잔존</td></tr>
       <tr><td>장기 리스</td><td>이용자에게 이전</td><td>사실상 소유에 준하는 지배</td></tr>
       <tr><td>정비·주차 위탁</td><td>수탁자에게 이전</td><td>위탁 목적·범위를 벗어난 운행이면 재검토</td></tr>
       </table></div>`,
       mnemo:{key:"관계 · 관리 · 예견", how:"무단운전 사례는 이 셋만 검토하면 빠짐없다 — 평소 <b>관계</b>, 열쇠 <b>관리</b>, 무단운전 <b>예견</b>가능성.<br>셋 다 '그렇다'면 차주 책임은 살아 있다."}},

      {h:"'다른 사람(타인)'의 개념", freq:F(3,[41,46,49]),
       body:`<p>타인이란 <b>운행자와 운전자(운전보조자 포함)를 제외한 자</b>다. 자기 자신은 타인이 될 수 없다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>지위</th><th>타인성</th><th>비고</th></tr>
       <tr><td>운전자·운전보조자</td><td>부정</td><td>운전 종료 후 별개 지위에서 다쳤다면 달리 볼 여지</td></tr>
       <tr><td>공동운행자</td><td>상대적 판단</td><td>사고 당시 구체적·직접적 지배가 상대방에게 있고 피해자 지배가 간접적·잠재적이면 인정 (49회)</td></tr>
       <tr><td><b>임차인</b></td><td>사안별 — <b>인정될 수 있음</b></td><td>임대인의 고용운전자가 조종하고 임차인은 작업만 한 경우 타인성 인정 (41회)</td></tr>
       <tr><td>무상동승자</td><td>인정</td><td>손해액 단계에서 <b>동승자 감액</b>으로 조정</td></tr>
       <tr><td>가족</td><td>인정</td><td>대인배상Ⅱ에서 <b>가족면책</b>으로 처리 — 층위가 다르다</td></tr>
       </table></div>
       <div class="lead">답안 팁 — 41회 해설은 <b>"설명이 긴 등장인물은 타인성을 의심하라"</b>고 했다. 문제에서 어떤 사람의 지위를 길게 설명하면 그 사람의 타인성이 쟁점이다.</div>
       <div class="why"><span class="h">헷갈리기 쉬운 지점</span>
       "타인이 아니다"와 "면책된다"는 <b>완전히 다른 층위</b>다. 타인성은 <b>책임이 생기는가</b>(자배법), 가족면책·동승자감액은 <b>보상을 얼마나 하는가</b>(약관)의 문제다.</div>`},

      {h:"면책 3요건 (제3조 단서)", freq:F(3,[48]),
       body:`<div class="lawbox"><span class="src">승객이 아닌 자가 사망·부상한 경우</span>① 자기와 운전자가 자동차의 운행에 주의를 게을리하지 아니하였고, ② 피해자 또는 자기 및 운전자 외의 제3자에게 고의 또는 과실이 있으며, ③ 자동차의 구조상 결함이나 기능상 장해가 없었다는 것을 증명한 경우</div>
       <div class="lawbox"><span class="src">승객이 사망·부상한 경우</span>승객의 고의나 자살행위로 인한 것임을 증명한 경우</div>
       <div class="why"><span class="h">왜 승객만 다르게 보는가</span>
       길 가던 사람은 스스로 위험에 들어간 게 아니지만, 승객은 운행자의 지배 아래 몸을 맡긴 상태다. 그래서 승객은 훨씬 두텁게 보호하고 면책을 <b>고의와 자살 두 가지로만</b> 좁혔다.</div>`,
       mnemo:{key:"주 · 삼 · 구", how:"승객 아닌 자 면책 3요건 — <b>주</b>의를 게을리하지 않았고 / 제<b>삼</b>자(또는 피해자)에게 고의·과실이 있고 / <b>구</b>조상 결함·기능장해가 없을 것.<br>승객은 <b>\"고의 아니면 자살\"</b> 두 개뿐."}},

      {h:"자배법과 약관상 피해자 보호제도", freq:F(2,[41,43]),
       body:`<p>41회가 <b>15점</b>으로 단독 출제했다. 자배법과 약관을 나누어 쓰는 것이 목차다.</p>
       <p><b>Ⅰ. 자배법상 피해자 보호</b></p>
       <ol><li><b>배상책임 주체의 확대</b> — 민법상 불법행위자 외에 운행지배·운행이익을 가진 운행자까지 책임 주체가 되어 민법보다 확대되었다.</li>
       <li><b>입증책임의 전환</b> — 운행자가 면책 3요건을 스스로 입증해야 한다.</li>
       <li><b>의무보험 가입 강제</b> — 대인배상Ⅰ 가입을 강제하여 배상자력을 확보한다.</li>
       <li><b>직접청구권</b> — 피해자가 보험자에게 직접 청구할 수 있다(제10조). <b>압류·양도가 금지</b>되어 피해자에게 확실히 귀속된다.</li>
       <li><b>정부보장사업</b> — 뺑소니·무보험차 사고에서 정부가 대인배상Ⅰ 한도 내에서 보상한다.</li>
       <li><b>가불금 제도</b> — 치료비 등을 우선 지급받을 수 있다.</li>
       <li><b>진료수가 기준</b> — 의료기관이 보험회사에 직접 청구하는 제도로 피해자의 치료 접근성을 보장한다.</li></ol>
       <p><b>Ⅱ. 약관상 피해자 보호</b></p>
       <ol><li><b>직접청구권 우선 규정</b> — 피보험자의 보험금청구와 경합하면 손해배상청구권자에게 우선 지급한다.</li>
       <li><b>고의사고의 대인배상Ⅰ 지급</b> — 피보험자의 고의라도 피해자 보호를 위해 지급하고 가해자에게 구상한다.</li>
       <li><b>음주·무면허 사고의 지급</b> — 면책하지 않고 지급한 뒤 사고부담금으로 회수한다.</li>
       <li><b>피보험자 개별적용</b> — 한 피보험자의 면책사유가 다른 피보험자와 피해자에게 미치지 않도록 한다.</li>
       <li><b>가지급금 제도</b> — 손해액 확정 전에도 일정액을 미리 지급한다.</li></ol>`,
       mnemo:{key:"확 · 전 · 의 · 직 · 정 · 가", how:"자배법상 피해자 보호 — 주체 <b>확</b>대 · 입증책임 <b>전</b>환 · <b>의</b>무보험 · <b>직</b>접청구권 · <b>정</b>부보장사업 · <b>가</b>불금.<br>약관 쪽은 <b>\"고의도 대인Ⅰ은 준다\"</b>를 중심으로 묶으면 기억하기 쉽다."}},

      {h:"운행자성이 문제되는 8가지 유형", freq:F(3,[44,46,47,49]),
       body:`<p>운행지배·운행이익의 <b>총론</b>은 앞에서 봤다. 실제 시험은 <b>"이 사람이 운행자냐"</b>를 유형으로 묻는다. 아래 8개가 전부다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>유형</th><th>판단</th></tr>
       <tr><td><b>① 명의대여자</b></td><td>등록원부상 소유자는 <b>운행자로 추정</b>. 다만 소유·사용·처분의 실권이 전혀 없으면 부정될 수 있다.</td></tr>
       <tr><td><b>② 명의잔존자</b></td><td>차를 팔았지만 이전등록 전. <b>인도 + 대금 완납 + 서류 교부</b>가 모두 끝난 시점에 운행지배를 상실한다. 하나라도 남아 있으면 여전히 운행자.</td></tr>
       <tr><td><b>③ 자동차취급업자와 의뢰자</b></td><td>정비·세차·주차대행에 맡긴 동안은 <b>취급업자가 운행자</b>. 다만 공중접객업소의 주차대행은 업소가 운행자라는 판례가 있다.</td></tr>
       <tr><td><b>④ 대리운전</b></td><td><b>의뢰자·대리운전업체·대리운전기사 셋 다 운행자</b>다. 다만 <b>내부관계에서 의뢰인은 대리운전자에 대하여 타인</b>이 된다. 대리운전 중 의뢰인이 다친 사안이 이 논리로 풀린다.</td></tr>
       <tr><td><b>⑤ 임차인의 타인성</b></td><td>차만 빌리면 임차인이 운행자여서 타인이 아니다. 그러나 <b>운전기사까지 함께 딸린 임대</b>라면 운행지배가 임대인에게 남아 있어 <b>임차인은 타인</b>이 된다.</td></tr>
       <tr><td><b>⑥ 경비분담자</b></td><td>여행 경비를 같이 냈다는 사정만으로 타인성이 부정되지 않는다. 운행에 대한 지배·이익이 있어야 공동운행자다.</td></tr>
       <tr><td><b>⑦ 일시적 운전보조자</b></td><td>자기 업무와 무관하고 대가도 없이 잠깐 도운 사람은 운전보조자가 아니다 → <b>타인성 인정</b>.</td></tr>
       <tr><td><b>⑧ 절취운전</b></td><td>원칙적으로 보유자의 운행지배가 단절된다. 다만 <b>보유자가 절취를 용인했다고 볼 사정</b>(열쇠 방치 등)이 있으면 운행자성이 유지된다(용인설).</td></tr>
       </table></div>
       <div class="why"><span class="h">답안에서 쓰는 법</span>
       사례에 등장인물이 3~4명이면 <b>각자에 대해 이 표를 한 줄씩 돌린다</b>. "① A는 등록명의자로서 운행자로 추정된다 → ② B는 인도·대금·서류가 모두 끝났으므로 운행지배를 상실했다 → ③ C는 대리운전기사로서 운행자이나 의뢰인 D에 대하여는…". 이 형식이 곧 배점이다.</div>`,
       mnemo:{key:"대 · 잔 · 취 · 리 / 임 · 경 · 보 · 절", how:"운행자성 8유형 — 명의<b>대</b>여 · 명의<b>잔</b>존 · <b>취</b>급업자 · 대<b>리</b>운전 / <b>임</b>차인 · <b>경</b>비분담 · 운전<b>보</b>조자 · <b>절</b>취.<br>앞 넷은 <b>소유·관리</b> 쪽, 뒤 넷은 <b>타인성</b> 쪽이다."}}
    ],
    cards:[
      {f:"자배법이 민법과 다른 결정적 차이는?", b:"입증책임의 전환. 민법은 피해자가 과실을 입증하지만, 자배법은 운행자가 면책 3요건을 입증해야 한다."},
      {f:"자배법과 민법 비교의 6개 목차는?", b:"배상책임의 주체 · 적용대상 · 입증책임 · 책임의 성질 · 적용순서 · 피해자 보호. (주·대·입·성·순·보)"},
      {f:"자배법의 적용범위는?", b:"인적손해에만 적용. 대물손해는 민법 제750조."},

    quiz:[
      {q:"자동차사고의 손해배상책임과 관련하여, 자동차손해배상보장법상의 책임과 민법상의 책임을 비교·설명하시오. (25점)", pts:25, lik:3,
       a:`Ⅰ. 서론\n자동차사고로 인한 손해배상은 민법상 불법행위책임이 원칙이나, 피해자 보호를 위하여 자배법이 특별법으로 제정되어 인사사고에 우선 적용된다.\n\nⅡ. 배상책임의 주체\n1. 민법 — 제750조의 불법행위자, 제756조의 사용자\n2. 자배법 — 자기를 위하여 자동차를 운행하는 자(운행자). 운행지배와 운행이익을 가진 자를 포함하므로 민법보다 책임주체가 확대되었다.\n\nⅢ. 적용대상\n1. 민법 — 인적손해와 물적손해 모두\n2. 자배법 — 인적손해에 한하며, 대물손해는 민법에 의한다.\n\nⅣ. 입증책임\n1. 민법 — 피해자가 가해자의 고의·과실을 입증하여야 한다.\n2. 자배법 — 운행자가 제3조 단서의 면책 3요건을 입증하여야 하므로 입증책임이 전환되어 있다.\n\nⅤ. 책임의 성질\n1. 민법 — 과실책임\n2. 자배법 — 면책 입증이 사실상 어려워 무과실책임에 가깝다.\n\nⅥ. 적용순서\n인사사고에서는 자배법이 민법에 우선하며, 자배법의 요건이 충족되지 않는 경우 민법 제750조·제756조로 보충 검토한다. 양 청구권은 경합한다.\n\nⅦ. 피해자 보호제도\n자배법은 의무보험 가입 강제, 직접청구권, 정부보장사업, 가불금 제도 등을 두어 민법에 없는 보호장치를 마련하고 있다.\n\nⅧ. 결론\n자배법은 배상책임의 주체를 확대하고 입증책임을 전환하여 피해자 보호를 강화한 특별법이며, 실무에서는 자배법을 먼저 검토하고 민법으로 보충하는 순서로 접근한다.`},
      {q:"자동차손해배상보장법 제3조 본문의 손해배상책임 발생요건에 대하여 서술하시오. (5점)", pts:5, lik:3,
       a:`Ⅰ. 의의\n자배법 제3조는 운행자에게 사실상 무과실책임을 지우고 입증책임을 전환한 특별규정이다.\n\nⅡ. 성립요건\n1. 자기를 위하여 자동차를 운행하는 자(운행자) — 운행지배와 운행이익을 모두 갖춘 자\n2. 자동차 — 자동차관리법상 자동차 및 건설기계관리법상 일정 건설기계\n3. 운행으로 인하여 — 자동차를 그 용법에 따라 사용하는 것과 사고 사이의 상당인과관계\n4. 다른 사람(타인)의 사망 또는 부상\n\nⅢ. 결론\n네 요건이 충족되면 배상책임이 성립하고, 면책되려면 제3조 단서의 요건을 스스로 입증하여야 한다.`},
      {q:"자배법상 '운행'의 개념을 설명하고, 정차 중인 고소작업차의 작업대를 조종하다 작업자가 추락한 경우 운행에 해당하는지 논하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. '운행'의 개념\n자배법상 운행이란 사람 또는 물건의 운송 여부와 관계없이 자동차를 그 용법에 따라 사용하거나 관리하는 것을 말한다.\n\nⅡ. 판단기준\n1. 고유장치설 — 자동차에 고유하게 부착된 각종 장치를 그 용법에 따라 사용하면 운행에 해당한다.\n2. 주행 여부와의 관계 — 반드시 주행 중일 필요가 없으며, 정차 상태에서 문 개폐, 적재장치 조작, 작업대 조종 등도 운행에 포함된다.\n3. 특수자동차 — 고소작업차는 자동차관리법상 특수자동차에 해당하고, 작업대는 그 차의 고유장치이다.\n\nⅢ. 사례의 적용\n정차 상태였더라도 고용운전자가 작업대를 조종하던 중 발생한 사고이므로, 자동차의 고유장치를 그 용법에 따라 사용하던 중의 사고에 해당하여 '운행'으로 인정된다.\n\nⅣ. 결론\n운행성이 인정되므로 자배법 제3조가 적용되며, 이어서 피해자의 타인성과 운행자의 확정을 검토하여야 한다.`},
      {q:"자배법 제3조 단서의 면책요건을 승객인 경우와 승객이 아닌 경우로 나누어 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 승객이 아닌 자가 사망·부상한 경우\n운행자가 다음을 모두 증명하여야 면책된다.\n1. 자기와 운전자가 자동차 운행에 주의를 게을리하지 아니하였을 것\n2. 피해자 또는 자기 및 운전자 외의 제3자에게 고의 또는 과실이 있을 것\n3. 자동차의 구조상 결함이나 기능상 장해가 없었을 것\n\nⅡ. 승객이 사망·부상한 경우\n승객의 고의 또는 자살행위로 인한 것임을 증명한 경우에만 면책된다.\n\nⅢ. 구별의 취지\n승객은 운행자의 지배영역 안에서 스스로 위험을 인수하였다고 보기 어려우므로 면책 범위를 고의·자살로 한정하여 두텁게 보호한 것이다.`},
      {q:"자동차손해배상보장법상 '다른 사람(타인)'에 관하여 설명하시오. (20점)", pts:20, lik:3,
       a:`Ⅰ. 의의\n자배법 제3조의 '다른 사람'이란 운행자 및 당해 자동차의 운전자(운전보조자 포함)를 제외한 자를 말한다. 자기 자신은 타인이 될 수 없다.\n\nⅡ. 유형별 검토\n1. 운전자·운전보조자 — 타인성이 부정된다. 다만 운전을 종료하고 별개의 지위에서 피해를 입은 경우에는 달리 볼 여지가 있다.\n2. 공동운행자 — 사고 당시 각자의 운행지배를 비교하여, 피해자 측의 지배가 상대적으로 간접적·잠재적이고 상대방의 지배가 구체적·직접적이면 타인성을 인정한다.\n3. 임차인 — 임대인의 고용운전자가 조종하고 임차인은 작업만 수행한 경우 등 실질적 지배가 임대인에게 있으면 임차인의 타인성이 인정될 수 있다.\n4. 무상동승자 — 타인에 해당한다. 다만 손해액 산정 단계에서 동승자 감액으로 조정한다.\n5. 가족 — 타인성은 인정되나 대인배상Ⅱ의 가족면책조항으로 보상이 제한된다.\n\nⅢ. 판단의 기준\n형식적 명의가 아니라 사고 당시의 실질적 운행지배 관계로 판단한다.\n\nⅣ. 결론\n타인성은 책임의 성립 단계 문제이고, 동승자 감액·가족면책은 보상의 범위 문제이므로 층위를 구별하여 서술하여야 한다.`},
      {q:"갑의 아들 A가 아버지 주머니에서 열쇠를 몰래 꺼내 차를 반출하였고, 무면허인 친구 B가 이를 운전하다 사고를 냈다. 갑의 운행자책임 인정 여부를 논하시오. (20점)", pts:20, lik:3,
       a:`Ⅰ. 쟁점\n무단운전 및 제3자의 운전으로 갑의 운행지배·운행이익이 상실되었는지 여부이다.\n\nⅡ. 판단기준\n1. 운행자성은 운행지배와 운행이익으로 판단하며, 직접적·현실적 지배뿐 아니라 간접적·관념적 지배도 포함한다.\n2. 무단운전의 고려요소\n  ① 소유자와 무단운전자의 평소 관계\n  ② 차량과 열쇠의 관리상태\n  ③ 무단운전의 예견가능성\n  ④ 운행 거리·시간의 일시성과 반환의사\n\nⅢ. 사례의 적용\nA는 갑과 동거하는 아들로 차량 접근이 용이하였고, 갑이 열쇠를 별도로 시정·보관하지 않은 이상 운행지배가 완전히 배제되었다고 보기 어렵다. 실제 운전자가 제3자 B라는 사정은 갑의 운행자성 자체를 소멸시키지 않으며, 이는 담보별 보상 여부(한정운전 특약 위반 등)에서 별도로 검토할 문제이다.\n\nⅣ. 결론\n갑은 자배법 제3조의 운행자로서 피해자에 대하여 손해배상책임을 진다.`},
      {q:"현행 자동차손해배상보장법 및 자동차보험 약관상 피해자의 보호에 관한 사항들을 설명하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 자배법상 피해자 보호제도\n1. 배상책임 주체의 확대 — 민법상 불법행위자 외에 운행지배·운행이익을 가진 운행자까지 책임주체로 하여 배상자력을 넓혔다.\n2. 입증책임의 전환 — 운행자가 면책 3요건을 입증하도록 하여 피해자의 입증부담을 덜었다.\n3. 의무보험 가입의 강제 — 대인배상Ⅰ 가입을 강제하여 배상자력을 확보하였다.\n4. 직접청구권 — 피해자가 보험자에게 직접 청구할 수 있고, 그 권리의 압류·양도를 금지하여 피해자에게 확실히 귀속시켰다.\n5. 정부보장사업 — 뺑소니·무보험차 사고에서 정부가 대인배상Ⅰ 한도 내에서 보상한다.\n6. 가불금 제도 — 손해배상액 확정 전에도 치료비 등을 우선 지급받을 수 있다.\n7. 자동차보험진료수가 제도 — 의료기관이 보험회사에 직접 청구하도록 하여 치료 접근성을 보장한다.\n\nⅡ. 약관상 피해자 보호\n1. 직접청구권 우선 — 피보험자의 보험금청구와 경합하는 경우 손해배상청구권자에게 우선하여 지급한다.\n2. 고의사고의 대인배상Ⅰ 지급 — 피보험자의 고의라도 피해자 보호를 위해 지급하고 가해자에게 구상한다.\n3. 음주·무면허 사고의 지급 — 면책하지 않고 지급한 후 사고부담금으로 회수한다.\n4. 피보험자 개별적용 — 한 피보험자의 면책사유가 다른 피보험자와 피해자에게 미치지 않도록 한다.\n5. 가지급금 제도 — 손해액 확정 전 일정액을 미리 지급한다.\n\nⅢ. 결론\n자배법은 책임의 성립과 배상자력의 확보를, 약관은 지급 단계의 실효성을 각각 담당하여 피해자 보호를 이중으로 도모하고 있다.`},
      {q:"자배법상 '운행자'와 민법상 '사용자'의 책임을 비교하고, 양자가 경합하는 경우의 처리를 설명하시오. (15점)", pts:15, lik:2,

      {r:48,u:"a1",t:"자동차손해배상보장법 제3조 본문의 손해배상책임 발생요건에 대하여 서술하시오. (5점) / 승객·승객 아닌 자의 면책요건 (10점) / 고의 자살행위의 판단 (15점)",ref:"a1#1"},
      {r:46,u:"a1",t:"자동차손해배상보장법상 '다른 사람(타인)'에 관하여 설명하시오. (20점) — 운전보조자·가족·무상동승자·임차인",ref:"a1#4"},
      {r:46,u:"a1",t:"무단운전 시 보유자의 운행자책임 — 손해사정사가 착안할 사항과 조사방법 (25점 중)",a:`Ⅰ. 착안사항
1. 운전자가 보유자의 허락 없이 운전한 무단운전인지 여부
2. 무단운전이라면 보유자의 운행지배와 운행이익이 잔존하는지 여부
3. 무단운전이 인정되어도 대인배상Ⅰ은 의무보험으로서 보상되므로, 담보별로 결론이 달라진다는 점

Ⅱ. 조사방법
1. 차량과 열쇠의 관리상태 — 보관 장소, 시정 여부, 평소 관리 실태
2. 보유자와 운전자의 평소 관계 — 동거 여부, 고용관계, 차량 사용 허용 이력
3. 무단운전의 예견가능성 — 과거에도 유사한 무단운전이 있었는지
4. 운행의 경위와 목적, 운행거리·시간의 일시성, 반환의사의 존부
5. 자료 — 주민등록·가족관계등록부, 관계인 진술, 차량 사용일지, 블랙박스, 경찰 조사기록

Ⅲ. 보상처리 시 유의할 점
1. 무단운전이라도 보유자의 운행지배가 완전히 배제되지 않으면 운행자책임이 유지되므로, 관리상태에 관한 객관적 자료를 확보하여야 한다.
2. 한정운전 특약이 있는 경우 도난 예외의 적용 여부를 청구 주체별로 검토한다.
3. 무단운전자는 승낙피보험자가 아니므로 그 자신의 손해는 담보되지 않으며, 자배법 제29조와 보험자대위에 따른 구상 가능성을 검토한다.`},
      {r:45,u:"a1",t:"자배법 제3조와 판례의 입장, 민법 제750조·제756조를 사례에 적용하시오. (20점)",a:`Ⅰ. 검토의 순서
인사사고이므로 자배법 제3조를 먼저 검토하고, 요건이 충족되지 않거나 대물손해가 있는 경우 민법 제750조·제756조로 보충 검토한다. 양 청구권은 경합한다.

Ⅱ. 자배법 제3조에 따른 책임
1. 운행자성 — 운행지배와 운행이익의 존부를 판단한다.
2. 운행 — 자동차를 용법에 따라 사용하던 중의 사고인지 확인한다.
3. 타인성 — 피해자가 운행자·운전자가 아닌지 확인한다.
4. 면책 — 승객인지 승객이 아닌지에 따라 면책요건이 달라진다.

Ⅲ. 민법 제750조 불법행위책임
운전자에게 고의 또는 과실이 있고 위법성과 인과관계가 인정되면 성립한다. 피해자가 이를 입증하여야 한다.

Ⅳ. 민법 제756조 사용자책임
1. 요건 — 사용관계의 존재, 사무집행 관련성, 피용자의 불법행위
2. 사용자가 선임·감독에 상당한 주의를 하였음을 입증하면 면책되나 실무상 거의 인정되지 않는다.

Ⅴ. 결론
자배법상 운행자책임이 성립하면 그에 따르고, 성립하지 않는 부분은 민법상 책임으로 처리한다. 판례의 입장은 실질적 지배관계를 중시하여 배상자력을 확보하는 방향이다.`},
      {r:43,u:"a1",t:"자동차사고의 손해배상책임과 관련하여, 자배법상의 책임과 민법상의 책임을 비교·설명하시오. (25점)",ref:"a1#0"},
      {r:41,u:"a1",t:"고소작업차 임차인의 타인성 — A에 대한 손해배상책임의 주체와 그 법률상 근거를 약술하시오. (10점)",ref:"a9#0"},
      {r:41,u:"a1",t:"현행 자동차손해배상보장법 및 자동차보험 약관상 피해자의 보호에 관한 사항들을 설명하시오. (15점)",ref:"a1#6"}
    ]

  {
    id:"a2", name:"2. 담보 구조와 면책", freq:F(3,[41,42,43,44,46,47,49]),
    sections:[
      {h:"담보 지도 — 어디서 나가는 돈인가",

       자동차보험은 하나의 주머니가 아니라 <b>여러 개의 주머니</b>다. 사고가 나면 "누구의 손해를 어느 주머니에서 내는가"를 먼저 정해야 한다. 계산문제의 첫 단계가 항상 이것이다.</div>

       <tr><td><b>대인배상Ⅰ</b></td><td>타인</td><td>의무보험</td><td>약관 지급기준 · 한도 있음</td><td>O</td></tr>
       <tr><td><b>대인배상Ⅱ</b></td><td>타인 (Ⅰ 초과분)</td><td>임의</td><td>지급기준 또는 판결액</td><td>O</td></tr>
       <tr><td><b>자기신체사고</b></td><td>내 쪽 사람</td><td>임의 · 정액</td><td>급별 가입금액표</td><td><b>X</b></td></tr>
       <tr><td>자동차상해</td><td>내 쪽 사람</td><td>임의 · 실손형</td><td>실제 손해액</td><td>X</td></tr>
       <tr><td><b>무보험차상해</b></td><td>내 쪽 사람</td><td>임의</td><td>실제 손해액</td><td>O(가해자 기준)</td></tr>
       </table></div>
       <div class="lead">핵심 감각 — <b>대인배상은 "남에게 물어주는 돈"</b>, <b>자기신체사고는 "내가 받는 돈"</b>이다. 여기서 과실상계·가족면책·혼동의 차이가 전부 갈린다.</div>`,

      {h:"대인배상Ⅰ — 한도가 있다", freq:F(3,[41,44,47,49]),
       body:`<p>자배법이 강제하는 <b>책임보험</b>이다. 피해자는 <b>직접청구권</b>을 가진다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>구분</th><th>1인당 보상한도</th></tr>
       <tr><td>사망</td><td>최고 <b>1억 5,000만원</b></td></tr>
       <tr><td>후유장해</td><td>최고 <b>1억 5,000만원</b> (장해급별 차등, 1급 1.5억)</td></tr>
       <tr><td>부상</td><td>최고 <b>3,000만원</b> (상해급별 차등, 1급 3,000만원)</td></tr>
       </table></div>

       <div class="warn">한도 금액은 자배법 시행령 개정으로 바뀔 수 있다. 위 수치는 41~49회 기출 답안에서 실제 적용된 값이다. 문제에서 급별 표를 제시하면 <b>제시된 표를 그대로</b> 쓴다.</div>`,
       mnemo:{key:"1.5억 + 3천 = 1.8억", how:"사망·후유장해 <b>1억 5천</b>, 부상 <b>3천</b>.<br>부상 후 사망하면 <b>합산 1억 8천</b>. 계산문제에서 \"대인Ⅰ에서만 끝나는가\"를 가르는 기준선이다."}},

      {h:"대인배상Ⅱ — 피보험자가 누구인가", freq:F(2,[44,47]),
       body:`<ol><li><b>기명피보험자</b> — 보험증권에 이름이 적힌 사람</li>
       <li><b>친족피보험자</b> — 기명피보험자와 같이 살거나 살림을 같이하는 친족으로서 그 차를 사용·관리 중인 자</li>
       <li><b>승낙피보험자</b> — 기명피보험자의 승낙을 얻어 사용·관리 중인 자 (명시적·묵시적 모두 가능하나 승낙 범위를 벗어나면 부정)</li>
       <li><b>사용피보험자</b> — 기명피보험자의 사용자. 기명피보험자가 사용자의 업무에 차를 사용하는 경우에 한한다.</li>
       <li><b>운전피보험자</b> — 위 피보험자를 위하여 운전 중인 자(운전보조자 포함)</li></ol>
       <div class="why"><span class="h">무단운전자는?</span>
       기명피보험자의 승낙이 없으므로 <b>승낙피보험자가 아니다</b>. 즉 피보험자가 아니다. 49회에서 무단운전자 B에 대해 "피보험자가 되지 못한다"고 판단한 것이 이 논리다.</div>`,
       mnemo:{key:"기 · 친 · 승 · 사 · 운", how:"<b>기</b>명 · <b>친</b>족 · <b>승</b>낙 · <b>사</b>용 · <b>운</b>전.<br>사례에 등장하는 사람마다 이 다섯 중 어디인지 붙여보라. 어디에도 없으면 피보험자가 아니다."}},

      {h:"면책조항 — 담보별 비교", freq:F(3,[42,43,47,49]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>면책사유</th><th>대인Ⅰ</th><th>대인Ⅱ</th><th>자기신체사고</th></tr>
       <tr><td>고의사고</td><td>지급 후 <b>구상</b></td><td>면책</td><td>면책</td></tr>

       <tr><td><b>가족면책</b></td><td>적용 없음</td><td><b>면책</b></td><td>적용 없음(보상대상)</td></tr>

       <tr><td><b>유상운송</b></td><td>적용 없음</td><td><b>면책</b></td><td><b>면책</b></td></tr>
       <tr><td>한정운전 특약 위반</td><td>적용 없음</td><td><b>면책</b></td><td><b>면책</b></td></tr>
       </table></div>
       <div class="lead">한 줄로 요약하면 — <b>대인배상Ⅰ은 웬만하면 다 나간다.</b> 의무보험이고 피해자 보호가 목적이기 때문이다. 나머지 담보에서 면책을 따진다.</div>
       <div class="why"><span class="h">가족면책이 왜 있는가</span>

       mnemo:{key:"대인Ⅰ은 웬만하면 나간다", how:"고의든 음주든 무면허든 <b>대인배상Ⅰ은 지급</b>하고 나중에 구상하거나 사고부담금으로 회수한다.<br>가족면책·유상운송 면책·한정특약 위반은 <b>대인Ⅱ와 자손</b>의 문제다."}},

      {h:"유상운송 면책", freq:F(2,[43]),
       body:`<div class="lawbox"><span class="src">약관</span>대인배상Ⅰ을 제외한 전 담보에서, <b>영리를 목적으로 요금이나 대가를 받고</b> 피보험자동차를 <b>반복적으로</b> 사용하거나 빌려준 때에 생긴 손해는 보상하지 않는다.</div>
       <p>유상운송 중 사고는 <b>피보험자 개별적용을 하지 않는다</b>는 점도 함께 기억한다.</p>
       <p><b>Ⅰ. 요건 미충족으로 부책되는 경우</b></p>
       <ul><li>요금·대가를 받았어도 <b>소액이고 실비변상적</b> 성격이어서 영리 목적으로 보기 어려운 경우</li>
       <li><b>반복적이 아닌</b> 경우. 다만 <b>무보험차상해와 다른자동차운전담보 특약에서는 1회의 유상운송도 면책</b>된다.</li></ul>
       <p><b>Ⅱ. 개인용자동차보험의 예외</b></p>
       <ul><li>장기임대차계약(계약기간 <b>30일 초과</b>)에 따라 임차인이 전속적으로 사용하는 경우</li>
       <li><b>카풀</b> — 토·일·공휴일을 제외한 날의 출퇴근 시간대(오전 7~9시, 오후 6~8시)에 실제 출퇴근 용도로 자택과 직장 사이를 이동하며 승용차 함께타기를 실시한 경우</li>
       <li>유상운송위험담보 특약에 가입한 경우</li></ul>
       <p><b>Ⅲ. 업무용자동차보험의 예외</b></p>
       <ul><li>피보험자동차가 승용자동차 또는 승합자동차(버스)가 <b>아닌</b> 경우(예: 화물자동차)</li>
       <li>승용·승합자동차가 유상운송위험담보 특약에 가입한 경우</li></ul>
       <p><b>Ⅳ. 영업용자동차보험</b></p>
       <ul><li>사업 목적의 자동차이므로 <b>유상운송을 이유로 면책할 수 없다.</b> 다만 대여사업용자동차(렌터카)에서 임차인이 영리 목적으로 반복적으로 사용하는 경우에는 보상하지 않는다.</li></ul>`,
       mnemo:{key:"영리 · 대가 · 반복", how:"유상운송 3요건 — <b>영</b>리 목적 · <b>대</b>가 수령 · <b>반</b>복성. 하나라도 빠지면 면책이 안 된다.<br>예외는 보험 종류별로 — 개인용은 <b>장기임대·카풀·특약</b>, 업무용은 <b>화물차·특약</b>, 영업용은 <b>원칙 부책</b>."}},

      {h:"피보험자동차의 양도", freq:F(2,[43]),
       body:`<p>43회가 <b>15점</b>으로 출제했다. 의의·시점·효과가 목차다.</p>
       <ul><li><b>의의</b> — 보험기간 중 피보험자동차의 소유권이 이전되는 것. 보험계약상 권리·의무는 <b>원칙적으로 승계되지 않는다</b>(상법 제726조의4).</li>
       <li><b>양도의 시점</b> — 등록명의 이전 시점이 아니라 <b>실질적인 소유권 이전 시점</b>(대금 지급, 차량 인도 등)을 기준으로 판단한다.</li>
       <li><b>효과</b>
       <ul><li>양수인이 보험자의 <b>승인</b>을 받은 경우에 한하여 보험계약상 권리·의무가 승계된다.</li>
       <li>승인 전 발생한 사고는 <b>양수인에게 보험의 효력이 미치지 않는다.</b> 다만 대인배상Ⅰ은 의무보험이므로 피해자 보호를 위해 별도로 취급된다.</li>
       <li>양도인은 보험료 반환을 청구할 수 있다.</li></ul></li>
       <li><b>실무상 유의</b> — 양도 사실을 알리지 않은 채 사고가 나면 담보 공백이 생기므로, 손해사정 시 매매계약서·이전등록일·대금 지급 내역을 확인해야 한다.</li></ul>`},

      {h:"다른자동차 운전담보 특약과 무보험차상해", freq:F(2,[41,42,46]),
       body:`<p><b>Ⅰ. 다른자동차 운전담보 특약</b></p>
       <ul><li>기명피보험자와 그 배우자가 <b>다른 자동차</b>를 <b>일시적으로</b> 운전하던 중 생긴 사고를 자기 보험으로 담보한다.</li>
       <li><b>'다른 자동차'의 요건</b> — ① 기명피보험자와 그 배우자가 <b>소유하지 않은</b> 자동차 ② 통상적으로 사용하는 자동차가 <b>아닐 것</b> ③ 피보험자동차와 <b>동일한 차종</b>일 것</li>
       <li>1회의 유상운송도 면책된다.</li></ul>
       <p><b>Ⅱ. 무보험자동차에 의한 상해</b></p>
       <ul><li><b>'무보험자동차'</b> — ① 대인배상Ⅱ에 가입하지 않은 자동차 ② 대인배상Ⅱ가 적용되지 않거나 보상하지 않는 자동차 ③ <b>보유자를 알 수 없는</b> 자동차(뺑소니) ④ 피보험자를 죽거나 다치게 한 무보험 오토바이 등</li>
       <li><b>보상방식</b> — 실제 손해액 기준으로 산정하며, 보험자는 지급 후 <b>가해자에게 보험자대위</b>를 행사한다.</li>
       <li><b>자기신체사고와의 관계</b> — 영업용 약관 등에서는 자기신체사고 지급보험금 계산 시 무보험차상해로 지급될 수 있는 금액을 <b>공제</b>하도록 하되, 그 특약 보험금의 <b>청구를 포기하면 공제하지 않는다</b>. 41회가 이 규정을 사례로 물었다.</li></ul>`,
       mnemo:{key:"안 갖고 · 안 쓰고 · 같은 차종", how:"'다른 자동차' 3요건 — 내가 <b>소유하지 않고</b> · <b>통상 사용하지 않고</b> · <b>동일 차종</b>일 것.<br>무보험차상해는 <b>\"대인Ⅱ가 없는 차\"</b>가 핵심이며 뺑소니도 포함된다."}},

      {h:"운전자 한정운전 특약과 피보험자 개별적용", freq:F(2,[42,44,49]),
       body:`<p><b>Ⅰ. 운전자 한정운전 특약</b></p>
       <ul><li>운전할 사람을 제한하는 특약(가족한정, 1인한정, 26세 이상 한정 등). 조건에 맞지 않는 사람이 운전하면 <b>대인배상Ⅰ을 제외한 모든 담보가 면책</b>된다.</li>
       <li><b>도난 예외</b> — 피보험자동차를 <b>도난당한 경우</b>에는 특약 위반을 따지지 않는다. 판례는 도난에 <b>무단운전도 포함</b>된다고 본다.</li>
       <li>다만 누구의 입장에서 보느냐에 따라 결론이 갈린다. 차주에게는 '도난당한 것'이지만 무단반출한 본인에게는 '도난한 것'이므로 예외가 적용되지 않는다(49회).</li></ul>
       <p><b>Ⅱ. 피보험자 개별적용의 원칙</b></p>
       <ul><li><b>의의</b> — 면책사유와 보상책임을 각 피보험자별로 개별 판단한다.</li>
       <li><b>근거</b> — 약관은 피보험자 각자를 독립한 계약주체로 취급하며, 한 사람의 잘못으로 다른 피보험자와 피해자가 불이익을 받는 것은 피해자 보호에 반한다.</li>
       <li><b>한계</b> — 기명피보험자 본인에게 면책사유가 있으면 그로부터 파생된 승낙·운전피보험자에게도 영향이 미친다. <b>유상운송 중 사고는 개별적용을 하지 않는다.</b></li>
       <li><b>구상</b> — 보험금청구권을 상실한 피보험자에 대해서는 구상권을 행사할 수 있다.</li></ul>`},

      {h:"다른자동차 운전담보 특약 — 고유면책 6가지", freq:F(3,[44,47,49]),
       body:`<p><b>담보 방식이 먼저다.</b> 이 특약은 운전한 다른 자동차를 <b>피보험자동차로 간주</b>하여 <b>대인배상Ⅱ와 자기신체사고</b>로 보상한다. 대인배상Ⅰ이 아니다. 이것을 틀리면 그 뒤 계산이 전부 무너진다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>#</th><th>고유면책</th><th>내용</th></tr>
       <tr><td>①</td><td>다른자동차 소유자의 상해</td><td>다른 자동차의 소유자가 다쳤다면 <b>자기신체사고의 피보험자로 간주</b>되어 대인배상Ⅱ로는 보상하지 않는다.</td></tr>
       <tr><td>②</td><td>주차·정차 중 사고</td><td><b>운전 중</b>의 사고를 담보하는 특약이므로 주·정차 중 사고는 면책.</td></tr>
       <tr><td>③</td><td>요금·대가의 지불 또는 수령</td><td>대가를 받고 운전하거나, 대가를 주고 빌린 차는 면책. <b>1회의 유상운송도 면책</b>이다.</td></tr>
       <tr><td>④</td><td>취급업무상 수탁차</td><td>자동차 취급업무(정비·주차·판매 등)로 맡은 차는 면책. 그쪽은 취급업자보험의 영역이다.</td></tr>
       <tr><td>⑤</td><td>다른 보험에서 지급될 수 있는 금액</td><td>그 차의 보험에서 지급될 수 있는 금액을 <b>초과하는 부분만</b> 보상한다. 즉 <b>초과담보</b>다.</td></tr>
       <tr><td>⑥</td><td>대체자동차</td><td>피보험자동차를 대체한 차량은 그 자체가 피보험자동차이므로 이 특약의 대상이 아니다.</td></tr>
       </table></div>
       <div class="why"><span class="h">'다른 자동차'의 요건 — 다시 한 번</span>
       ① 기명피보험자와 그 <b>배우자가 소유하지 않은</b> 차<br>
       ② <b>통상적으로 사용하는</b> 차가 아닐 것 — 부모·자녀가 소유하거나 늘 쓰는 차는 제외<br>
       ③ 피보험자동차와 <b>동일한 차종</b>일 것<br>
       업무용자동차보험에서는 <b>기명피보험자가 개인인 경우에만</b> 이 특약에 가입할 수 있다.</div>
       <div class="warn">2001·2003·2012·2019년에 반복 출제됐다. <b>담보 방식(대인Ⅱ+자손) → 다른자동차 3요건 → 고유면책 6개</b> 순서로 쓰면 그대로 10점 답안이다.</div>`,
       mnemo:{key:"소 · 주 · 요 · 수 · 초 · 대", how:"다른자동차 고유면책 6 — <b>소</b>유자 상해 · <b>주</b>정차 · <b>요</b>금 · <b>수</b>탁차 · <b>초</b>과분만 · <b>대</b>체자동차."}},

      {h:"의무보험 일시담보 특별약관 — 15일", freq:F(2,[46]),
       body:`<p>차를 팔았는데 양수인이 아직 자기 보험에 들지 않았다면 피해자가 무보험 상태에 놓인다. 이를 막는 장치다.</p>

       <li><b>연쇄 양도</b> — 양수인이 다시 제3자에게 팔았더라도 <b>최초 양도일부터 15일 이내</b>라면 이 특약이 적용된다.</li></ul>

      {f:"자기신체사고에 과실상계를 하지 않는 이유는?", b:"배상책임 담보가 아니라 약관이 정한 정액급부이기 때문이다."},

      {f:"다른자동차 운전담보 특약은 어느 담보로 보상하는가?", b:"운전한 다른 자동차를 피보험자동차로 간주하여 대인배상Ⅱ와 자기신체사고로 보상한다. 대인배상Ⅰ이 아니다."},

      {f:"'다른 자동차'의 3요건은?", b:"① 기명피보험자와 배우자가 소유하지 않을 것 ② 통상적으로 사용하는 차가 아닐 것 ③ 피보험자동차와 동일 차종일 것."},

    quiz:[
      {q:"현행 자동차보험 약관상 유상운송 면책에 대하여 설명하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 유상운송의 의미와 면책 규정\n대인배상Ⅰ을 제외한 전 담보에서, 영리를 목적으로 요금이나 대가를 받고 피보험자동차를 반복적으로 사용하거나 빌려준 때에 생긴 손해는 보상하지 않는다. 유상운송 중 사고에 대하여는 피보험자 개별적용을 하지 않는다.\n\nⅡ. 요건 미충족으로 부책되는 경우\n1. 요금이나 대가를 받았더라도 소액이고 실비변상적 성격이어서 영리 목적이라고 보기 어려운 경우\n2. 반복적이 아닌 경우. 다만 무보험자동차에 의한 상해 및 다른자동차 운전담보 특약에서는 1회의 유상운송도 면책된다.\n\nⅢ. 개인용자동차보험의 예외\n1. 장기임대차계약(계약기간 30일 초과)에 따라 임차인이 피보험자동차를 전속적으로 사용하는 경우\n2. 여객자동차운수사업법에 따른 토요일·일요일 및 공휴일을 제외한 날의 출퇴근 시간대(오전 7~9시, 오후 6~8시)에 실제 출퇴근 용도로 자택과 직장 사이를 이동하며 승용차 함께타기를 실시한 경우\n3. 유상운송위험담보 특약에 가입한 경우\n\nⅣ. 업무용자동차보험의 예외\n1. 피보험자동차가 승용자동차 또는 승합자동차가 아닌 경우(예: 화물자동차)\n2. 승용·승합자동차가 유상운송위험담보 특약에 가입한 경우\n\nⅤ. 영업용자동차보험\n사업 목적의 자동차이므로 유상운송을 이유로 면책할 수 없다. 다만 대여사업용자동차의 임차인이 영리를 목적으로 요금을 받고 반복적으로 사용하는 경우에는 보상하지 않는다.\n\nⅥ. 결론\n유상운송 면책은 영리성·대가성·반복성을 요건으로 하며, 보험 종류에 따라 예외의 범위가 달라지므로 가입 종목을 먼저 확인하여야 한다.`},
      {q:"자동차보험에서 '피보험자동차의 양도'의 의의와 시점 및 효과에 대하여 설명하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 의의\n보험기간 중 피보험자동차의 소유권이 제3자에게 이전되는 것을 말한다. 보험계약은 특정 자동차와 피보험자를 전제로 위험을 인수한 것이므로, 양도가 있으면 보험계약상 권리·의무는 원칙적으로 승계되지 않는다(상법 제726조의4).\n\nⅡ. 양도의 시점\n1. 등록명의의 이전 시점이 아니라 실질적인 소유권 이전 시점을 기준으로 한다.\n2. 판단요소 — 매매대금의 지급, 자동차의 현실적 인도, 열쇠와 등록서류의 교부, 사용·수익권의 이전\n3. 실질적 지배가 이전되었다면 이전등록 전이라도 양도가 있은 것으로 본다.\n\nⅢ. 효과\n1. 원칙 — 양수인은 보험계약상 권리·의무를 승계하지 못하므로 양수인이 운행 중 발생한 사고는 담보되지 않는다.\n2. 예외 — 양수인이 보험자의 승인을 받은 경우 승계된다. 승인을 청구한 때부터 일정 기간 내에 보험자가 낙부통지를 하지 않으면 승인한 것으로 보는 규정을 두고 있다.\n3. 대인배상Ⅰ — 의무보험이므로 피해자 보호를 위하여 별도로 취급된다.\n4. 보험료 — 양도인은 미경과 보험료의 반환을 청구할 수 있다.\n\nⅣ. 실무상 유의사항\n양도 사실이 통지되지 않은 상태에서 사고가 발생하면 담보 공백이 생기므로, 손해사정 시 매매계약서, 대금 지급 내역, 이전등록일, 실제 인도일을 확인하여야 한다.\n\nⅤ. 결론\n양도는 형식이 아니라 실질적 지배의 이전으로 판단하며, 승인 여부가 담보의 존부를 좌우한다.`},
      {q:"대인배상Ⅱ의 피보험자 범위를 열거하고 각각의 요건을 설명하시오. (15점)", pts:15, lik:3,
       a:`1. 기명피보험자 — 보험증권에 피보험자로 기재된 자\n2. 친족피보험자 — 기명피보험자와 같이 살거나 살림을 같이하는 친족으로서 피보험자동차를 사용하거나 관리 중인 자. 동거 또는 생계 동일이라는 실질을 갖추어야 한다.\n3. 승낙피보험자 — 기명피보험자의 승낙을 얻어 피보험자동차를 사용하거나 관리 중인 자. 승낙은 명시적·묵시적 모두 가능하나 승낙의 범위를 벗어난 사용은 제외된다.\n4. 사용피보험자 — 기명피보험자의 사용자. 다만 기명피보험자가 피보험자동차를 사용자의 업무에 사용하는 경우에 한한다.\n5. 운전피보험자 — 위 피보험자를 위하여 피보험자동차를 운전 중인 자로서 운전보조자를 포함한다.\n\n※ 무단운전자는 기명피보험자의 승낙이 없으므로 승낙피보험자가 되지 못하여 피보험자에 해당하지 않는다. 따라서 무단운전자 본인의 손해는 담보되지 않는다.`},
      {q:"기명피보험자 A가 아내 B를 태우고 운행하던 중 운전부주의로 사고를 내어 B가 사망하였다. 대인배상Ⅰ·Ⅱ 및 자기신체사고의 보상 여부를 각각 검토하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 대인배상Ⅰ\n1. A는 운행지배와 운행이익을 가진 운행자로서 자배법 제3조의 책임을 진다.\n2. B는 운행자·운전자가 아니므로 '타인'에 해당한다.\n3. 따라서 대인배상Ⅰ에서 보상한다.\n\nⅡ. 대인배상Ⅱ\n약관은 피보험자 또는 그 부모·배우자·자녀가 죽거나 다친 경우를 면책사유로 정하고 있다. B는 기명피보험자 A의 배우자이므로 가족면책조항에 해당하여 면책된다.\n\nⅢ. 자기신체사고\n피보험자가 피보험자동차의 사고로 상해를 입은 때 보상하며, B는 기명피보험자의 배우자로서 피보험자에 해당한다. 별도의 면책사유가 없으므로 보상한다.\n\nⅣ. 결론\n대인배상Ⅰ과 자기신체사고에서 보상하고 대인배상Ⅱ는 면책된다. 이는 가족 간 배상에서 발생하는 도덕적 위험을 차단하되 자기신체사고로 실질적 보호를 도모하는 약관의 설계에 따른 것이다.`},
      {q:"자동차보험의 <무보험자동차에 의한 상해>에서의 '무보험자동차'와 <다른자동차 운전담보 특별약관>에서의 '다른 자동차'를 각각 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 무보험자동차\n1. 의의 — 피보험자를 죽거나 다치게 한 자동차로서 배상자력이 없는 자동차를 말한다.\n2. 범위\n  ① 대인배상Ⅱ 또는 공제계약에 가입하지 않은 자동차\n  ② 대인배상Ⅱ가 적용되지 않거나 보상하지 않는 자동차\n  ③ 보유자를 알 수 없는 자동차(뺑소니)\n  ④ 피보험자를 죽거나 다치게 한 무보험 오토바이 등\n3. 보상방식 — 실제 손해액을 기준으로 산정하며 보험자는 지급 후 가해자에게 보험자대위를 행사한다.\n\nⅡ. 다른 자동차\n1. 의의 — 기명피보험자와 그 배우자가 일시적으로 운전하는 자동차로서 자기 보험으로 담보되는 차를 말한다.\n2. 요건\n  ① 기명피보험자와 그 배우자가 소유하지 아니한 자동차\n  ② 통상적으로 사용하는 자동차가 아닐 것\n  ③ 피보험자동차와 동일한 차종일 것\n3. 유의 — 1회의 유상운송도 면책된다.\n\nⅢ. 결론\n무보험자동차는 '가해차량의 배상자력 없음'을, 다른 자동차는 '내가 일시적으로 운전하는 남의 차'를 의미하는 것으로 개념의 방향이 다르다.`},
      {q:"자동차보험 '대인배상'에서 피보험자개별적용에 관하여 설명하시오. (20점)", pts:20, lik:3,
       a:`Ⅰ. 의의\n하나의 보험계약에 복수의 피보험자가 있는 경우, 면책사유의 존부와 보상책임을 각 피보험자별로 개별적으로 판단하는 원칙이다.\n\nⅡ. 인정근거\n1. 약관은 피보험자 각자를 독립한 보험계약의 주체로 취급한다.\n2. 한 피보험자의 사정으로 다른 피보험자와 피해자가 불이익을 받는 것은 피해자 보호 취지에 반한다.\n\nⅢ. 적용범위와 효과\n1. 운전피보험자에게 고의·무면허 등 면책사유가 있더라도 기명피보험자에 대해서는 별도로 보상책임을 판단한다.\n2. 사례 — 승낙피보험자의 무면허운전 사실을 기명피보험자가 알지 못한 경우, 기명피보험자에 대해서는 보상책임이 성립할 수 있다.\n\nⅣ. 한계\n1. 기명피보험자 본인에게 면책사유가 있는 경우에는 그로부터 파생된 승낙피보험자·운전피보험자에게도 영향이 미친다.\n2. 유상운송 중 사고에 대하여는 개별적용을 하지 않는다.\n\nⅤ. 구상\n보험금청구권을 상실한 피보험자에 대하여는 보험자가 지급한 보험금을 구상할 수 있다.\n\nⅥ. 결론\n개별적용은 피해자 보호와 피보험자 간 형평을 조화시키는 원칙으로, 사례에서는 각 피보험자의 지위를 먼저 확정하고 면책사유의 귀속주체를 가려야 한다.`},
      {q:"운전자 한정운전 특약의 내용과 위반의 효과를 설명하고, 무단운전이 '도난'에 해당하는지 논하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 한정운전 특약의 의의\n피보험자동차를 운전할 자의 범위를 가족, 1인, 일정 연령 이상 등으로 한정하는 대신 보험료를 할인받는 특약이다.\n\nⅡ. 위반의 효과\n1. 한정 조건에 해당하지 않는 자가 운전하던 중 생긴 사고는 대인배상Ⅰ을 제외한 모든 담보에서 면책된다.\n2. 대인배상Ⅰ은 의무보험이므로 피해자 보호를 위하여 보상한다.\n\nⅢ. 도난 예외\n1. 약관은 피보험자동차를 도난당하였을 경우를 특약 위반의 예외로 정하고 있다.\n2. 판례는 여기의 도난에 무단운전의 경우도 포함된다고 본다. 보유자의 의사에 반하여 차량이 사용된 점에서 실질이 같기 때문이다.\n\nⅣ. 누구의 입장에서 보는가\n예외의 적용은 청구 주체에 따라 달라진다. 보유자의 입장에서는 '도난당한 것'이므로 예외가 적용되나, 차량을 무단반출한 자 본인의 입장에서는 '도난한 것'이므로 예외가 적용되지 않는다.\n\nⅤ. 결론\n한정운전 특약 위반 사안에서는 담보별로 나누어 판단하고, 도난 예외의 적용 여부를 청구 주체별로 검토하여야 한다.`},
      {q:"자동차보험 담보 중 대인배상Ⅰ만 웬만한 면책사유에도 보상되는 이유를 설명하고, 그 경우 보험자의 회수 수단을 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 대인배상Ⅰ의 성격\n자배법이 가입을 강제하는 의무보험으로서, 피해자에게 최소한의 배상자력을 확보해 주는 것이 목적이다. 따라서 피보험자 측의 사정으로 피해자가 보상을 받지 못하는 결과를 최대한 배제한다.\n\nⅡ. 면책사유별 처리\n1. 고의사고 — 대인배상Ⅱ와 자기신체사고는 면책되나, 대인배상Ⅰ은 피해자에게 지급한다.\n2. 음주·무면허운전 — 지급을 거절하지 않고 보험금을 지급한다.\n3. 한정운전 특약 위반·유상운송 — 대인배상Ⅰ에는 적용되지 않는다.\n\nⅢ. 보험자의 회수 수단\n1. 구상권 — 고의사고의 경우 지급 후 가해자에게 구상한다.\n2. 사고부담금 — 음주·무면허·뺑소니·마약운전의 경우 피보험자에게 사고부담금을 부과한다. 개정 후 대인배상Ⅰ은 지급보험금 전액이다.\n3. 보험자대위 — 자배법 제29조에 따라 '법률상 손해배상책임이 있는 자'에게 구상할 수 있으며, 상법 제682조의 청구권대위도 가능하다.\n\nⅣ. 결론\n대인배상Ⅰ은 '먼저 지급하고 나중에 회수한다'는 구조로 피해자 보호와 가해자 책임을 동시에 달성한다.`},
      {q:"자기신체사고와 자동차상해, 무보험자동차에 의한 상해를 보상방식과 과실상계 측면에서 비교하시오. (15점)", pts:15, lik:2,
       a:`Ⅰ. 자기신체사고\n1. 보상대상 — 피보험자 본인과 그 가족이 피보험자동차의 사고로 입은 상해\n2. 보상방식 — 약관이 정한 사망·후유장해·부상 급별 가입금액표에 따른 정액 지급\n3. 과실상계 — 하지 않는다.\n4. 공제 — 배상의무자 이외의 제3자로부터 보상받은 금액을 공제하며, 공제액이 없으면 비용을 지급하지 않고 가입금액을 지급한다.\n\nⅡ. 자동차상해\n1. 보상대상 — 자기신체사고의 확장형\n2. 보상방식 — 대인배상 지급기준을 준용한 실제 손해액 기준\n3. 과실상계 — 본인 과실이 있어도 공제하지 않는 방식이 일반적이다.\n\nⅢ. 무보험자동차에 의한 상해\n1. 보상대상 — 무보험자동차에 의하여 피보험자가 입은 손해\n2. 보상방식 — 실제 손해액 기준\n3. 과실상계 — 가해자에 대한 손해배상청구권을 전제로 하므로 피해자 과실을 반영한다.\n4. 보험자대위 — 지급 후 가해자에게 구상한다.\n\nⅣ. 결론\n자기신체사고는 정액, 자동차상해와 무보험차상해는 실손 기준이라는 점에서 산정방식이 다르고, 배상책임과의 연결 여부에 따라 과실상계의 적용이 달라진다.`},
      {q:"영업용 자동차보험 약관이 자기신체사고 지급보험금 계산에서 무보험자동차에 의한 상해 특약으로 지급될 금액을 공제하도록 하면서, 그 청구를 포기하면 공제하지 않는다고 규정하는 취지를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 규정의 내용\n자기신체사고의 지급보험금을 계산할 때 무보험자동차에 의한 상해 담보 특별약관에 따라 지급될 수 있는 금액을 공제하되, 피보험자가 그 특별약관 보험금의 청구를 포기하는 경우에는 공제하지 않는다.\n\nⅡ. 취지\n1. 중복보상의 방지 — 동일한 손해에 대하여 두 담보에서 이중으로 지급되는 것을 막기 위함이다.\n2. 선택권의 보장 — 피보험자가 어느 담보로 보상받을지 선택할 수 있도록 하되, 두 담보를 동시에 받지는 못하게 한 것이다.\n3. 실익 — 무보험차상해는 실손 기준이고 자기신체사고는 정액이므로, 손해의 성격과 금액에 따라 피보험자에게 유리한 담보를 고를 수 있다.\n\nⅢ. 실무상 판단\n피보험자가 무보험차상해를 청구하지 않겠다는 의사를 명확히 하면 자기신체사고 보험금이 공제 없이 지급된다. 따라서 손해사정 시 어느 담보가 피보험자에게 유리한지 비교하여 안내할 필요가 있다.\n\nⅣ. 결론\n이 규정은 중복보상 방지와 피보험자의 선택권 보장을 조화시킨 것으로, 청구 포기의 의사표시가 공제 여부를 좌우한다.`},

      {q:"다른자동차 운전담보 특별약관의 담보내용과 고유면책사유를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n기명피보험자와 그 배우자가 다른 자동차를 일시적으로 운전하던 중 생긴 사고에 대하여, 운전한 다른 자동차를 피보험자동차로 간주하여 담보하는 특별약관이다.\n\nⅡ. 담보의 방식\n대인배상Ⅱ와 자기신체사고로 보상한다. 대인배상Ⅰ은 그 자동차의 의무보험이 담당하므로 이 특약의 대상이 아니다.\n\nⅢ. '다른 자동차'의 요건\n1. 기명피보험자와 그 배우자가 소유하지 아니한 자동차일 것\n2. 통상적으로 사용하는 자동차가 아닐 것\n3. 피보험자동차와 동일한 차종일 것\n\nⅣ. 고유면책사유\n1. 다른 자동차의 소유자가 상해를 입은 경우 자기신체사고의 피보험자로 간주된다.\n2. 주차 또는 정차 중에 생긴 사고\n3. 요금이나 대가를 지불하거나 수령한 경우\n4. 자동차 취급업무상 수탁받은 자동차\n5. 다른 자동차의 보험계약에서 지급될 수 있는 금액을 초과하는 부분만 보상한다.\n6. 피보험자동차를 대체한 자동차\n\nⅤ. 결론\n이 특약은 초과담보의 성격을 가지므로, 사안에서는 먼저 그 자동차 자체의 보험으로 처리되는 범위를 확정한 후 초과분을 산정하여야 한다.`},
      {q:"운전자한정운전 특별약관의 효과와 그 예외를 설명하고, 무단운전자에 대한 적용을 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n운전할 사람의 범위를 가족, 1인, 일정 연령 이상 등으로 제한하고 보험료를 할인받는 특별약관이다.\n\nⅡ. 효과\n한정 조건에 해당하지 아니하는 자가 운전 중 생긴 사고는 대인배상Ⅰ을 제외한 모든 담보에서 보상하지 아니한다. 대인배상Ⅰ은 의무보험이므로 피해자 보호를 위하여 보상한다.\n\nⅢ. 예외\n1. 피보험자동차를 도난당하였을 때\n2. 자동차 취급업자가 업무상 수탁받아 운전하던 중일 때\n판례는 도난에 무단운전의 경우도 포함된다고 본다.\n\nⅣ. 무단운전자에 대한 적용\n1. 차주의 입장에서는 도난당한 것이므로 예외가 적용되어 담보가 유지될 수 있다.\n2. 그러나 무단운전자 본인의 입장에서는 스스로 도난한 것이므로 예외를 주장할 수 없고, 자기신체사고 등에서 보상을 받을 수 없다.\n3. 취급업자 예외가 적용되는 경우에도 부활하는 것은 대인배상Ⅱ이며 자기신체사고와 무보험차상해는 여전히 면책되는 것이 일반적이다.\n\nⅤ. 결론\n같은 사실관계라도 누구의 입장에서 보느냐에 따라 결론이 달라지므로, 답안에서는 관계인별로 나누어 서술하여야 한다.`},
      {q:"의무보험 일시담보 특별약관의 담보기간과 효과, 종료사유를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 취지\n자동차를 양도한 후 양수인이 자기 명의의 의무보험에 가입하기 전까지 발생하는 담보 공백으로부터 피해자를 보호하기 위한 제도이다.\n\nⅡ. 담보기간\n양도일부터 15일째 되는 날 24시까지이다.\n\nⅢ. 효과\n그 기간 동안 양수인을 보험계약자 및 기명피보험자로 보아 대인배상Ⅰ 등 의무보험을 보상한다. 대인배상Ⅱ와 자기신체사고는 담보되지 아니한다.\n\nⅣ. 종료사유\n1. 양수인 명의로 이전등록을 마친 때\n2. 양수인이 자기 명의로 대인배상Ⅰ에 가입한 때\n3. 보험기간의 마지막 날 24시가 지난 때\n\nⅤ. 연쇄 양도\n양수인이 다시 제3자에게 양도한 경우에도 최초 양도일부터 15일 이내라면 이 특약이 적용된다.\n\nⅥ. 결론\n이 특약은 의무보험에 한정된 잠정적 담보이므로, 사안에서는 양도일자와 15일의 기산을 정확히 확인하는 것이 핵심이다.`}

Ⅱ. 피보험자 지위의 확정
1. 기명피보험자 — 보험증권에 기재된 자
2. 친족피보험자 — 기명피보험자와 동거하거나 생계를 같이하는 친족으로서 차를 사용·관리 중인 자
3. 무단운전자 — 승낙이 없으므로 피보험자가 아니다.

Ⅲ. 담보별 보상책임
1. 대인배상Ⅰ — 의무보험이므로 타인인 피해자에게는 보상한다.
2. 대인배상Ⅱ — 한정운전 특약 위반으로 면책되나, 무단운전이 도난에 해당하여 예외가 적용되면 보상한다.
3. 자기신체사고 — 무단반출한 본인에게는 도난 예외가 적용되지 않아 면책된다.

Ⅳ. 결론
피해자마다 지위를 확정하고 담보별로 나누어 검토하여야 하며, 도난 예외의 적용은 청구 주체별로 결론이 갈린다.`},
      {r:47,u:"a2",t:"현행 자동차보험 약관상 보험회사의 담보별 보상책임을 설명하고, 유족별 지급보험금을 계산하시오. (25점)",a:`Ⅰ. 보상책임의 검토
1. 대인배상Ⅰ — 운행자책임이 성립하고 피해자가 타인이면 보상한다.
2. 대인배상Ⅱ — 피해자가 피보험자의 부모·배우자·자녀이면 가족면책으로 면책된다.
3. 자기신체사고 — 피보험자 본인과 그 가족이 상해를 입은 때 보상하며, 면책사유가 없어야 한다.

Ⅱ. 손해액의 조정
1. 무상동승이면 동승자 감액을 적용한다.
2. 피해자 과실이 있으면 과실상계한다.
3. 기왕증이 있으면 관여도를 반영한다.

Ⅲ. 담보별 지급보험금
1. 대인배상Ⅰ — 조정된 손해액에 대하여 사망 한도 1억 5,000만원(부상 후 사망은 1억 8,000만원)을 적용한다.
2. 자기신체사고 — 실제손해액에서 대인배상으로 수령한 금액을 공제하고 가입금액 한도로 지급한다.

Ⅳ. 유족별 배분
1. 법정상속분(배우자 1.5 : 자녀 각 1)에 따라 배분한다.
2. 가해자가 상속인이면 대인배상Ⅰ의 그 상속분은 혼동으로 소멸한다.
3. 자기신체사고는 배상책임이 아니므로 혼동이 발생하지 않아 가해자도 수령한다.
4. 상속인이 될 자가 상속개시 전 사망하였다면 대습상속을 적용한다.

Ⅴ. 결론
담보별 보상 여부를 먼저 확정하고, 조정 → 한도 → 배분의 순서로 산출한다.`},
      {r:46,u:"a2",t:"무보험자동차에 의한 상해의 '무보험자동차'와 다른자동차 운전담보 특약의 '다른 자동차'를 각각 설명하시오. (10점)",ref:"a2#4"},
      {r:44,u:"a2",t:"자동차보험 '대인배상'에서 피보험자개별적용에 관하여 설명하시오. (20점)",ref:"a2#5"},
      {r:43,u:"a2",t:"현행 자동차보험 약관상 유상운송 면책에 대하여 설명하시오. (15점)",ref:"a2#0"},
      {r:43,u:"a2",t:"자동차보험에서 '피보험자동차의 양도'의 의의와 시점 및 효과에 대하여 설명하시오. (15점)",ref:"a2#1"},
      {r:42,u:"a2",t:"다른자동차운전담보 특약·기명피보험자 1인한정운전 특약 관련 담보별 보상책임 (15점)",a:`Ⅰ. 다른자동차 운전담보 특별약관
1. 의의 — 기명피보험자와 그 배우자가 다른 자동차를 일시적으로 운전하던 중 생긴 사고를 자기 보험으로 담보한다.
2. '다른 자동차'의 요건 — ① 기명피보험자와 배우자가 소유하지 않은 자동차 ② 통상적으로 사용하는 자동차가 아닐 것 ③ 피보험자동차와 동일 차종일 것
3. 1회의 유상운송도 면책된다.

Ⅱ. 기명피보험자 1인한정운전 특약
1. 의의 — 운전자를 기명피보험자 1인으로 한정하는 대신 보험료를 할인받는 특약이다.
2. 위반의 효과 — 기명피보험자 외의 자가 운전하던 중 생긴 사고는 대인배상Ⅰ을 제외한 모든 담보에서 면책된다.
3. 도난 예외 — 피보험자동차를 도난당한 경우는 예외이며 판례는 무단운전도 포함한다.

Ⅲ. 담보별 보상책임의 검토
1. 피해자별로 타인성과 피보험자 지위를 확정한다.
2. 대인배상Ⅰ — 의무보험이므로 특약 위반에도 보상한다.
3. 대인배상Ⅱ·자기신체사고 — 특약 위반 여부와 예외 적용 여부에 따라 결론이 갈린다.
4. 다른자동차 운전담보가 적용되는 경우, 운전한 차량의 보험과 자기 보험의 관계(중복보험·초과전보)를 검토한다.

Ⅳ. 결론
두 특약은 모두 '누가 운전했는가'를 기준으로 담보 여부를 가르므로, 운전자와 차량의 소유·사용관계를 먼저 확정하여야 한다.`},
      {r:41,u:"a2",t:"A에 대한 갑·을 보험사의 담보별 보상책임을 설명하시오. (10점) — 자기신체사고와 무보험차상해의 공제관계",a:`Ⅰ. 갑 보험사(임대인 측 영업용 자동차보험)
1. 대인배상Ⅰ·Ⅱ — 임대인이 운행자이고 피해자가 타인에 해당하면 보상한다.
2. 자기신체사고 — 피보험자에 해당하는지 확인한다.
3. 무보험자동차에 의한 상해 — 가해차량이 무보험자동차에 해당하는지 검토한다.

Ⅱ. 을 보험사(피해자 본인의 개인용 자동차보험)
1. 자기신체사고 — 피해자가 기명피보험자이므로 보상 대상이다.
2. 무보험자동차에 의한 상해 — 가해차량이 대인배상Ⅱ에 가입하지 않았거나 보상하지 않는 경우 적용된다.

Ⅲ. 자기신체사고와 무보험차상해의 공제관계
1. 영업용 약관 등은 자기신체사고 지급보험금 계산에서 무보험자동차에 의한 상해 특별약관으로 지급될 수 있는 금액을 공제하도록 한다.
2. 다만 피보험자가 그 특별약관 보험금의 청구를 포기하는 경우에는 공제하지 않는다.
3. 취지 — 중복보상을 방지하면서도 피보험자에게 유리한 담보를 선택할 권리를 보장한다.

Ⅳ. 결론
피해자는 자기신체사고와 무보험차상해 중 유리한 담보를 선택할 수 있으며, 손해사정 시 두 담보의 산정 결과를 비교하여 안내하여야 한다.`}
    ]

      {h:"지급보험금의 기본 산식", freq:F(3,[48]),
       body:`<div class="lawbox"><span class="src">표준약관 지급보험금 산식</span>지급보험금 = <b>「보험금 지급기준에 의해 산출한 금액」 또는 「법원의 확정판결 등에 따라 피보험자가 배상하여야 할 금액」 + 비용 − 공제액</b></div>
       <ul><li><b>비용</b> — 손해방지·경감을 위해 지출한 비용, 권리보전 비용 등</li>
       <li><b>공제액</b> — 손익상계 대상 이익(산재보험금 등)과 과실상계에 따른 감액</li></ul>

      {h:"상실수익액과 중간이자공제", freq:F(2,[47,48]),
       body:`<div class="why"><span class="h">왜 이자를 빼는가</span>

       <div class="scroller"><table class="mini">

      {h:"동승자 감액 — 비율표까지 외운다", freq:F(3,[47,48]),
       body:`<p>공짜로 얻어탄 사람이 다쳤을 때 배상액을 깎는 제도다. <b>책임을 부정하는 게 아니라 액수를 조정</b>하는 것이라는 점이 핵심이다.</p>
       <p><b>이론적 근거</b> — 학설로는 <b>수정책임상대설</b>이 통설적 위치에 있다. 비율적책임설에 운행자성조각설을 가미한 것으로, 무상동승자가 운행자성을 일부 취득하면 그만큼 운행자에 대한 손해배상청구권을 제한하되, 보행자 등 제3의 피해자에 대해서는 동승자에게 운행자책임을 지우지 않고 보유자만 책임지게 하는 견해다.</p>
       <p><b>판례</b> — 가해자에게 일반 교통사고와 동일한 책임을 지우는 것이 신의칙이나 형평의 원칙상 매우 불합리하다고 인정될 때 배상액을 경감할 수 있으나, <b>단순히 호의로 동승했다는 사실만으로는</b> 경감사유가 되지 않는다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>동승의 유형 및 운행목적</th><th>감액비율</th></tr>
       <tr><td>동승자의 강요 및 무단 동승</td><td><b>100%</b></td></tr>
       <tr><td>음주운전자의 차량 동승</td><td><b>40%</b></td></tr>
       <tr><td>동승자의 요청 동승</td><td><b>30%</b></td></tr>
       <tr><td>상호 의논·합의 동승</td><td><b>20%</b></td></tr>
       <tr><td>운전자의 권유 동승</td><td><b>10%</b></td></tr>
       <tr><td>운전자의 강요 동승</td><td><b>0%</b></td></tr>
       </table></div>
       <ul><li><b>수정요소</b> — 동승자에게 동승 과정의 과실이 있으면 <b>10~20% 가산</b>한다.</li>
       <li><b>카풀 예외</b> — 토·일·공휴일을 제외한 날의 출퇴근 시간대(오전 7~9시, 오후 6~8시)에 실제 출퇴근 용도로 자택과 직장 사이를 이동하며 승용차 함께타기를 한 경우에는 <b>감액을 적용하지 않는다</b>.</li>
       <li><b>개정 방향</b> — 마약·약물운전, 무면허, 뺑소니 차량 동승자에게도 음주운전 차량 동승자와 같이 40% 감액하는 개정이 추진되었다(2025.2. 금융감독원 보도자료 기준). 시험 전 최신 약관 확인 필요.</li></ul>`,
       mnemo:{key:"강100 · 음40 · 요30 · 합20 · 권10 · 강요0", how:"동승자가 <b>적극적일수록 많이 깎이고</b>, 운전자가 적극적일수록 적게 깎인다.<br><b>무단·강요 100 → 음주 40 → 요청 30 → 합의 20 → 권유 10 → 운전자 강요 0</b>.<br>순서대로 <b>100·40·30·20·10·0</b>. 동승자 과실 있으면 10~20% 더."}},

      {h:"기왕증과 노동능력상실률", freq:F(2,[47,48]),
       body:`<p><b>후유장해(노동능력상실률)</b>란 치료를 마친 후 더 이상 치료효과를 기대할 수 없고 증상이 고정된 상태에서, 그 부상이 원인이 되어 신체에 장애가 남은 경우를 말한다.</p>
       <ul><li><b>평가방법</b> — 자동차보험 지급기준은 <b>맥브라이드식 후유장애 평가방법</b>에 따라 <b>일반의 옥내 또는 옥외 근로자</b>를 기준으로, 실제로 부상 치료·진단을 실시한 의사 또는 해당 과목 전문의가 판정한 노동능력상실률을 적용한다.</li>
       <li><b>다툼이 있는 경우</b> — 보험금청구권자와 보험회사가 협의하여 정한 <b>제3의 전문의료기관</b> 전문의에게 판정을 의뢰할 수 있다.</li>
       <li><b>기왕증</b> — 사고 전부터 가지고 있던 증상(특이체질·병적 소인 등). <b>기왕장애</b>는 사고와 무관하게 이미 있던 장애.</li>
       <li><b>한시장애</b> — 일정 기간이 지나면 회복되는 장애. 영구장애와 구분하여 그 기간만 인정한다.</li></ul>`},
      {h:"현실소득액의 산정 — 신분별로 다르다", freq:F(3,[43]),
       body:`<p>상실수익액 = <b>현실소득액</b> × 노동능력상실률 × 취업가능월수. 여기서 현실소득액을 어떻게 정하느냐가 첫 단추다. 43회가 <b>15점</b>으로 물었다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>신분</th><th>산정방법</th></tr>
       <tr><td><b>유직자</b></td><td>사고 발생 직전 또는 사고 당시 기준 과거 3개월 이상 종사한 경우 그 기간의 소득을 평균. 입증 곤란 시 통계소득 적용</td></tr>
       <tr><td><b>기술직 종사자</b></td><td>해당 직종 종사 사실이 증빙되면 실제 소득. 입증 곤란 시 <b>정부 노임단가</b> 또는 <b>직종별 임금 실태조사 보고서</b>상 해당 직종 임금</td></tr>
       <tr><td>사업소득자</td><td>본인의 노무 기여분만 인정. 자본적 수익은 제외</td></tr>
       <tr><td><b>현역병 등 군복무해당자</b></td><td>소득이 없거나 미미하므로 <b>일용근로자 임금</b> 적용. 군복무 예정자도 같다</td></tr>
       <tr><td>무직자·학생·가사종사자</td><td>일용근로자 임금 적용</td></tr>
       </table></div>
       <p><b>취업가능월수</b> — 피해자의 나이와 직종별 <b>가동연한</b>까지의 월수. 중간이자공제를 위해 호프만계수를 적용하되 계수는 <b>240 한도</b>. 군복무해당자는 복무기간을 취업가능기간에서 제외하지 않고 일용근로자 임금을 적용한다.</p>
       <div class="warn">가동연한과 일용노임 단가는 변동된다. 문제에서 제시되면 제시된 값을 쓰고, 아니면 최신 약관 지급기준을 확인하라.</div>`,
       mnemo:{key:"입증되면 실소득 · 안 되면 통계", how:"현실소득액의 대원칙 — <b>입증되면 실제 소득, 입증이 안 되면 통계소득(노임단가)</b>.<br>기술직은 <b>자격증·경력증명</b>이 있으면 실소득, 없으면 <b>직종별 임금 실태조사</b>.<br>군복무자는 <b>일용근로자 임금</b>."}},

      {h:"별표 지급기준 — 항목을 빠뜨리면 점수가 없다", freq:F(3,[44,45,46,47,48,49]),
       body:`<p>계산문제는 <b>항목을 다 적었는가</b>로 갈린다. 세 가지 두문자를 먼저 외운다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>구분</th><th>지급항목</th><th>두문자</th></tr>
       <tr><td><b>부상</b></td><td>적극손해 · 위자료 · 휴업손해 · 간병비 · 그 밖의 손해배상금</td><td><b>적위휴간그</b></td></tr>
       <tr><td><b>후유장해</b></td><td>장해로 인한 위자료 · 상실수익액 (+ 가정간호비)</td><td><b>장위상</b></td></tr>
       <tr><td><b>사망</b></td><td>위자료 · 상실수익액 · 장례비</td><td><b>위상가</b></td></tr>
       </table></div>
       <p><b>자주 나오는 개별 기준</b></p>
       <ul><li><b>간병비</b> — 상해등급별 인정일수 한도 내에서 <b>일용근로자 임금</b>으로 산정한다. 예: 5급은 15일 한도 → 100,000원 × 15일 = 150만원</li>
       <li><b>그 밖의 손해배상금</b> — 통원 1일당 <b>8,000원</b> × 통원일수</li>
       <li><b>치과 보철</b> — 임플란트는 <b>1치당 100만원</b> 한도로 인정한다</li>
       <li><b>위자료의 택일</b> — 부상위자료와 장해위자료가 모두 나오면 <b>큰 금액 하나만</b> 지급한다</li>
       <li><b>기지급 치료비</b> — 산출된 치료관계비에서 이미 병원에 지급한 금액을 <b>차감</b>하고 남은 금액만 피해자에게 지급한다</li></ul>
       <div class="warn"><b>대인배상Ⅰ의 한도 구조</b> — 사망 1억 5천만원(손해액이 2천만원 미만이면 <b>최저 2천만원</b>), 부상 [별표1] 1~14급, 후유장해 [별표2] 1~14급.<br>
       <b>부상과 사망이 함께 발생</b>하면 각각의 한도를 적용한 뒤 합산하되 <b>총 1억 8천만원</b>을 넘지 못한다.<br>
       <b>부상과 후유장해</b>가 함께면 각각 계산하여 합산한다.<br>
       <b>후유장해와 사망</b>이 함께면 사망보험금에서 장해보험금 중 사망일 이후 기간분을 조정한다.</div>`,
       mnemo:{key:"적위휴간그 / 장위상 / 위상가", how:"부상 <b>적</b>극손해·<b>위</b>자료·<b>휴</b>업손해·<b>간</b>병비·<b>그</b> 밖의 손해배상금<br>장해 <b>장</b>해위자료·<b>상</b>실수익액<br>사망 <b>위</b>자료·<b>상</b>실수익액·장례<b>가</b>(비)<br>계산문제를 펼치자마자 답안 여백에 이 세 줄부터 쓴다."}},

      {h:"자기신체사고 지급보험금 산정", freq:F(3,[41,45,48]),
       body:`<div class="calcbox"><b>자기신체사고 지급보험금 = 실제손해액 + 비용 − 공제액</b></div>
       <p><b>공제액</b>은 다음과 같다.</p>
       <ul><li>대인배상Ⅰ·Ⅱ에서 <b>보상받을 수 있는 금액</b></li>
       <li><b>무보험차상해</b>에서 지급될 수 있는 금액 — 다만 그 특약 보험금의 <b>청구를 포기하면 공제하지 않는다</b></li>
       <li><b>배상의무자 이외의 제3자</b>로부터 보상받은 금액 — <b>산재보험금은 여기서 제외</b>한다는 점이 자기신체사고의 특징이다</li></ul>
       <div class="why"><span class="h">공제액이 없을 때 — 단독사고나 자기과실 100%</span>
       공제할 것이 없으면 <b>가입금액</b> 기준으로 지급한다.<br>
       · 사망 — 증권에 기재된 <b>사망 가입금액</b><br>
       · 부상 — 상해등급별 한도 내의 <b>실제 치료비</b><br>
       · 후유장해 — 장해등급별 <b>가입금액</b></div>
       <div class="warn">무보험차상해와 헷갈리면 안 된다. <b>자기신체사고는 산재보험금을 공제하지 않고, 무보험차상해는 공제한다.</b> 이 대비가 그대로 시험 포인트다.</div>`},

      {h:"무보험자동차에 의한 상해 지급보험금 산정", freq:F(3,[41,46,49]),
       body:`<div class="calcbox"><b>무보험차상해 지급보험금 = 보험금지급기준에 따라 산출한 금액 + 비용 − 공제액</b></div>
       <ul><li><b>산정 기준</b> — 약관의 <b>보험금지급기준</b>(별표)에 따른다. <b>소송에서 인정된 판결금액은 그대로 인정하지 않는다</b>. 이 점이 대인배상Ⅱ와 다르다.</li>
       <li><b>보상한도</b> — 통상 1인당 <b>2억원</b></li>
       <li><b>공제액</b> — 대인배상Ⅰ·Ⅱ에서 보상받을 수 있는 금액, 배상의무자가 가입한 보험, 배상의무자 이외의 제3자로부터 받은 금액, <b>산재보험금(포함)</b>, 자기신체사고 지급액 등</li>
       <li><b>개인형이동장치(PM)</b>로 인한 손해는 자동차손해배상보장법 시행령 제3조의 금액을 한도로 한다.</li>
       <li><b>대위</b> — 지급 후 가해자에게 보험자대위를 행사한다.</li></ul>
       <div class="scroller"><table class="mini">
       <tr><th>비교</th><th>자기신체사고</th><th>무보험차상해</th></tr>
       <tr><td>산정 기준</td><td>실제손해액</td><td>약관 보험금지급기준(판결금액 불인정)</td></tr>
       <tr><td>산재보험금</td><td>공제 <b>안 함</b></td><td>공제 <b>함</b></td></tr>
       <tr><td>상대방 책임</td><td>불문(단독사고도 지급)</td><td>배상의무자가 있어야 한다</td></tr>
       <tr><td>대위</td><td>원칙적으로 없음</td><td>지급 후 가해자에게 구상</td></tr>
       </table></div>`,
       mnemo:{key:"자손은 실손해·산재 안 뺀다 / 무상은 기준금액·산재 뺀다", how:"두 담보를 가르는 축은 <b>산정기준</b>과 <b>산재 공제</b> 둘뿐이다. 이 한 줄이면 비교 문제 10점이 나온다."}},

      {h:"가정간호비", freq:F(2,[45]),
       body:`<p>약관은 후유장해가 남은 피해자에게 별도로 <b>가정간호비</b>를 인정한다. 요건이 매우 좁으므로 그대로 외운다.</p>
       <ul><li><b>요건</b> — 노동능력상실률 <b>100%</b>의 후유장해가 있고, <b>식물인간 상태</b> 또는 <b>척수손상으로 인한 사지완전마비</b>일 것</li>
       <li><b>인정 범위</b> — <b>1일 1인</b>, <b>일용근로자 임금</b> 기준</li>
       <li><b>지급 방법</b> — <b>일시금</b> 또는 퇴원일부터 <b>생존기간 동안 매월 정기금</b>. <b>수령권자가 선택</b>한다.</li></ul>
       <div class="warn">개호비(손해배상 이론상의 개호비)와 <b>가정간호비</b>(약관상 항목)는 다르다. 문제가 "약관에 따라"라고 하면 가정간호비 요건을 써야 한다.</div>`}
    ],
    cards:[
      {f:"손해 3분설의 구성은?", b:"적극손해 · 소극손해 · 위자료. (적·소·위)"},

    quiz:[
 {q:"손해배상제도에 있어서 위자료에 대하여 설명하고, 현행 자동차보험약관상 위자료 지급기준에 관하여 기술하시오. (20점)", pts:20, lik:3,
  a:`Ⅰ. 위자료의 의의\n가해자의 불법행위로 피해자가 입은 정신적 고통에 대한 손해배상을 말한다. 재산적 손해와 달리 액수를 객관적으로 산정하기 어려우므로 법원과 약관이 정형화된 기준을 두고 있다.\n\nⅡ. 법적 성질\n1. 손해전보 기능이 본질이나 제재적·만족적 기능도 논의된다.\n2. 위자료청구권은 상속의 대상이 되며, 피해자 본인 외에 근친자도 고유의 위자료를 청구할 수 있다.\n3. 위자료는 손익상계의 대상이 되지 않는다.\n\nⅢ. 약관상 사망 위자료\n1. 사망 당시 피해자의 나이가 65세 미만인 경우 8,000만원\n2. 사망 당시 피해자의 나이가 65세 이상인 경우 5,000만원\n3. 청구권자의 범위와 청구권자별 지급기준에 따라 배분한다.\n\nⅣ. 부상·후유장해 위자료\n1. 부상 위자료는 상해급별에 따라 정액으로 지급한다.\n2. 후유장해 위자료는 노동능력상실률과 연령을 반영하여 산정한다.\n3. 부상 위자료와 후유장해 위자료가 함께 발생하는 경우 약관이 정한 방법으로 조정한다.\n\nⅤ. 결론\n위자료는 정형화된 기준에 따르되 사고의 경위, 과실 정도, 피해자의 사정 등이 참작될 수 있다는 점에서 재산적 손해와 구별된다. 구체적 금액표는 최신 표준약관 별표로 확인하여야 한다.`},
 {q:"자동차보험 표준약관 '대인배상'에서 동승자 감액의 이론적 근거와 동승자 유형별 감액비율에 대하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 의의\n무상으로 동승한 자에 대한 운행자의 책임을 정할 때 동승의 목적, 인적관계, 동승의 경위 등에 비추어 운행자에게 100% 책임을 묻는 것이 손해의 공평한 분담 원칙에 어긋날 때 손해배상액을 일정 부분 감액하는 것을 말한다.\n\nⅡ. 인정 이유와 이론적 근거\n1. 인정 이유 — 무상동승자도 운행이익의 일부를 가지므로 이를 참작하는 것이 손해의 공평한 분담에 부합한다.\n2. 학설 — 수정책임상대설이 타당하다. 비율적책임설에 운행자성조각설을 가미한 것으로, 무상동승자가 운행자성을 일부 취득하면 그만큼 운행자에 대한 청구권을 제한하되, 보행자 등 제3의 피해자에 대해서는 동승자에게 운행자책임을 지우지 않고 보유자만 책임지게 하는 견해이다.\n3. 판례 — 가해자에게 일반 교통사고와 동일한 책임을 지우는 것이 신의칙이나 형평의 원칙상 매우 불합리하다고 인정될 때 경감할 수 있으나, 단순히 호의로 동승하였다는 사실만으로는 경감사유로 삼을 수 없다.\n\nⅢ. 약관상 유형별 감액비율\n1. 동승자의 강요 및 무단 동승 100%\n2. 음주운전자의 차량 동승 40%\n3. 동승자의 요청 동승 30%\n4. 상호 의논·합의 동승 20%\n5. 운전자의 권유 동승 10%\n6. 운전자의 강요 동승 0%\n\nⅣ. 수정요소 및 예외\n1. 동승자가 동승 과정에서 과실이 있는 경우 10~20%를 가산한다.\n2. 평일 출퇴근 시간대의 승용차 함께타기(카풀)에는 감액비율을 적용하지 않는다.\n3. 마약·약물운전, 무면허, 뺑소니 차량 동승자에 대해서도 음주운전 차량 동승자와 같이 40% 감액하는 개정이 추진되었다.`},
 {q:"자동차사고 손해배상금 산정 시 적용하는 중간이자공제의 개념 및 적용대상을 기술하고, 호프만식 계산법의 적용한계를 설명하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 중간이자공제의 개념\n장래에 발생할 손해배상금을 현 시점에서 일시금으로 지급하는 경우 그 사이의 이자 상당액을 미리 공제하는 것을 말한다. 이득금지 원칙에 근거한다.\n\nⅡ. 계산방법\n1. 호프만식 — 단리로 계산하며 공제액이 적어 피해자에게 유리하다. 자동차보험약관이 채택하고 있다.\n2. 라이프니츠식 — 복리로 계산하며 공제액이 크다. 법원 실무에서 주로 사용된다.\n\nⅢ. 적용대상\n1. 사망 및 후유장해 상실수익액의 산정\n2. 가정간호비를 일시금으로 지급하는 경우\n3. 향후 계속되는 치료비를 일시금으로 지급하는 경우\n\nⅣ. 호프만식의 적용한계\n호프만계수가 월 누계 240(연 누계 20)을 초과하면 전체 손해배상금에 대한 이자가 월 또는 연 순수입을 초과하게 되어 일시금이 영원히 소멸하지 않는 모순이 발생한다. 따라서 계수를 240으로 제한하여 적용한다.\n\nⅤ. 결론\n호프만식은 인플레이션 하에서 화폐가치 하락분을 일부 보전하는 장점이 있으나 계수의 상한 제한이 불가피하다.`},
 {q:"현행 자동차보험 약관 지급기준상 '기술직 종사자'와 '현역병 등 군복무해당자'의 현실소득액 산정방법과 취업가능월수에 대하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 현실소득액의 의의\n상실수익액 산정의 기초가 되는 소득으로서, 피해자의 신분과 소득 입증 가능 여부에 따라 산정방법이 달라진다.\n\nⅡ. 기술직 종사자\n1. 산정방법 — 사고 발생 직전 또는 사고 당시를 기준으로 과거 3개월 이상 해당 직종에 종사한 경우, 그 기간의 소득을 평균한 금액을 현실소득액으로 한다.\n2. 입증이 곤란한 경우 — 정부 노임단가 또는 통계법에 따른 조사기관의 통계에 의한 직종별 임금 실태조사 보고서상 해당 직종 임금을 적용한다.\n3. 인정기준 — 해당 직종에 종사한 사실이 증빙서류(자격증, 경력증명서, 재직증명서, 소득 신고자료 등)로 확인되어야 한다.\n\nⅢ. 현역병 등 군복무해당자\n1. 산정방법 — 병역법에 따른 현역병, 사회복무요원 등은 소득이 없거나 미미하므로 일용근로자 임금을 적용한다.\n2. 군복무 예정자 — 장래 군복무 기간에 대하여도 동일하게 처리한다.\n\nⅣ. 취업가능월수\n1. 원칙 — 피해자의 나이와 직종에 따른 가동연한까지의 월수로 한다.\n2. 군복무해당자 — 복무기간을 취업가능기간에서 제외하지 않고 일용근로자 임금을 적용하여 산정한다.\n3. 중간이자공제 — 취업가능월수에 대응하는 호프만계수를 적용하되 계수는 240을 한도로 한다.\n\nⅤ. 결론\n현실소득액은 신분별로 산정 근거가 다르므로, 손해사정 시 직종·경력·소득 입증자료를 먼저 확인하여야 한다. 구체적 금액과 가동연한은 최신 약관 지급기준으로 확인한다.`},
 {q:"자동차보험 대인배상에서 사망자의 손해배상액 산정 방법에 대하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 지급보험금 산식\n지급보험금 = 보험금 지급기준에 의해 산출한 금액(또는 법원 확정판결액) + 비용 − 공제액\n\nⅡ. 손해액의 구성\n1. 적극손해 — 장례비 500만원\n2. 소극손해 — 상실수익액 = (월평균 현실소득액 − 생계비) × 노동능력상실률 × 취업가능월수 호프만계수. 사망의 경우 생계비로 소득의 3분의 1을 공제한다.\n3. 위자료 — 사망 당시 65세 미만 8,000만원, 65세 이상 5,000만원\n\nⅢ. 조정\n1. 기왕증이 있으면 관여도를 반영하여 실제손해액을 확정한다.\n2. 무상동승이면 동승자 감액을 적용한다.\n3. 피해자 과실이 있으면 과실상계한다.\n4. 산재보험급여 등 손해전보 목적의 급부가 있으면 손익상계한다.\n\nⅣ. 유족별 배분\n법정상속분(배우자 1.5 : 자녀 각 1)에 따라 상속시키고, 가해자가 상속인인 경우 혼동으로 그 상속분이 소멸하는지, 대습상속이 발생하는지를 확인한다.\n\nⅤ. 담보별 배분\n대인배상Ⅰ의 사망 한도 1억 5,000만원을 먼저 충당하고 초과분을 대인배상Ⅱ에서 지급한다.`},
 {q:"상실수익액 산정의 3요소를 설명하고, 사망과 후유장해의 경우 산정방법의 차이를 기술하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 상실수익액의 의의\n피해자가 사고로 인하여 장래 얻을 수 있었던 소득을 상실한 손해로서 소극손해의 핵심 항목이다.\n\nⅡ. 산정의 3요소\n1. 현실소득액 — 피해자의 신분과 소득 입증에 따라 유직자·무직자·기술직·군복무자 등으로 나누어 산정한다.\n2. 노동능력상실률 — 맥브라이드식 평가방법에 따라 일반의 옥내 또는 옥외 근로자를 기준으로 전문의가 판정한 비율을 적용한다.\n3. 취업가능월수 — 피해자의 나이와 직종별 가동연한까지의 월수로 하며, 중간이자공제를 위한 호프만계수를 적용한다.\n\nⅢ. 사망과 후유장해의 차이\n1. 생계비 공제 — 사망의 경우 본인의 생활비가 들지 않으므로 소득의 3분의 1을 공제하나, 후유장해의 경우에는 생계비를 공제하지 않는다.\n2. 노동능력상실률 — 사망은 100%로 보나, 후유장해는 판정된 상실률을 적용한다.\n3. 기간 — 사망은 가동연한까지 전 기간이나, 후유장해는 한시장애인 경우 인정기간만 산정한다.\n\nⅣ. 결론\n두 경우 모두 소득 × 상실률 × 기간의 구조는 같으나, 생계비 공제 여부가 결정적 차이이다.`},
 {q:"자동차보험 지급기준상 부상보험금의 구성항목을 설명하고, 각 항목의 산정 시 유의사항을 기술하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 부상보험금의 구성\n1. 적극손해 — 치료관계비, 간병비\n2. 소극손해 — 휴업손해\n3. 위자료 — 상해급별 부상 위자료\n\nⅡ. 치료관계비\n1. 자동차보험진료수가에 관한 기준에 따른 진료비를 인정한다.\n2. 입원료는 기준병실 사용료가 원칙이며 상급병실은 의학적 필요성이 인정되는 경우 등에 한한다.\n3. 향후치료비를 일시금으로 지급할 때에는 중간이자를 공제한다.\n4. 유의 — 사고와 상해의 인과관계, 기왕증 관여도, 과잉진료 여부, 치료의 필요성과 상당성을 확인한다.\n\nⅢ. 휴업손해\n1. 부상으로 실제 수입의 감소가 있는 경우 그 감소액을 인정한다.\n2. 유의 — 소득 입증자료의 진정성, 실제 휴업 기간과 입원·통원 기간의 일치 여부를 확인한다.\n\nⅣ. 간병비\n1. 의사가 인정한 범위에서 지급한다.\n2. 유의 — 간병의 필요성에 관한 의학적 소견과 실제 간병 사실을 확인한다.\n\nⅤ. 부상 위자료\n상해급별에 따라 정액으로 지급하며, 후유장해가 함께 발생한 경우 약관이 정한 방법으로 조정한다.`},
 {q:"자동차보험 지급기준에서 '생계비 공제'의 의미와 적용범위를 설명하시오. (10점)", pts:10, lik:2,
  a:`Ⅰ. 의의\n사망사고에서 상실수익액을 산정할 때, 피해자가 생존하였더라면 지출하였을 본인의 생활비를 소득에서 공제하는 것을 말한다.\n\nⅡ. 근거\n손해배상은 피해자가 입은 순손실을 전보하는 것이므로, 사망으로 지출을 면하게 된 생활비는 손해에서 제외하는 것이 손익상계의 법리에 부합한다.\n\nⅢ. 공제율\n자동차보험 약관 지급기준은 현실소득액의 3분의 1을 생계비로 공제하고 3분의 2를 인정한다.\n\nⅣ. 적용범위\n1. 사망사고에만 적용한다.\n2. 부상 및 후유장해의 경우에는 피해자가 생존하여 계속 생활비를 지출하므로 공제하지 않는다.\n\nⅤ. 결론\n생계비 공제는 사망사고에 고유한 조정으로, 부상·후유장해 사안에서 이를 적용하면 과소 산정이 되므로 주의하여야 한다.`},
 {q:"자동차보험에서 '기왕증'과 '기왕장애'를 구별하고, 약관상 기왕증 공제의 내용을 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 개념의 구별\n1. 기왕증 — 당해 자동차사고가 있기 전에 이미 가지고 있던 증상으로서 특이체질 및 병적 소인 등을 말한다.\n2. 기왕장애 — 당해 자동차사고와 무관하게 이미 전부터 가지고 있던 장애를 말한다.\n\nⅡ. 공제의 근거\n사고로 통상 발생하는 손해만을 가해자 측에게 부담시키고, 사고와 무관한 피해자의 기왕증으로 생긴 손해는 피해자가 부담하는 것이 손해의 공평한 분담 원칙에 부합한다.\n\nⅢ. 판례의 태도\n피해자의 전손해 중 기왕증이 기여한 정도에 상응하는 손해액을 감한 나머지 손해액만을 가해자에게 부담시키는 것이 타당하다고 본다. 따라서 기왕증이 관계된 모든 손해에 대하여 참작하여야 한다.\n\nⅣ. 약관 규정\n1. 기왕증으로 인한 손해는 보상하지 않는다. 다만 당해 자동차사고로 기왕증이 악화된 경우에는 기왕증이 손해에 관여한 정도(기왕증 관여도)를 반영하여 보상한다.\n2. 기왕증은 해당 과목 전문의가 판정한 비율에 따라 공제한다. 그 판정에 다툼이 있는 경우 보험금청구권자와 보험회사가 협의하여 정한 제3의 전문의료기관 전문의에게 판정을 의뢰할 수 있다.\n\nⅤ. 결론\n기왕증 공제는 손해액 확정 단계에서 가장 먼저 적용되는 조정으로, 의학적 판정이 선행되어야 한다.`},
 {q:"자동차보험 대인배상에서 '비용'의 의미와 지급요건을 설명하시오. (10점)", pts:10, lik:1,
  a:`Ⅰ. 지급보험금 산식에서의 비용\n지급보험금은 '보험금 지급기준에 의해 산출한 금액 또는 법원의 확정판결 등에 따라 피보험자가 배상하여야 할 금액 + 비용 − 공제액'으로 계산되며, 비용은 손해액과 별도로 가산되는 항목이다.\n\nⅡ. 비용의 종류\n1. 손해방지·경감비용 — 손해의 방지 또는 경감을 위하여 피보험자가 지출한 필요·유익한 비용\n2. 권리보전·행사비용 — 제3자로부터 손해배상을 받을 수 있는 권리를 지키거나 행사하기 위하여 지출한 비용\n3. 소송비용·변호사비용 — 보험회사의 동의를 얻어 지출한 경우\n4. 공탁보증보험료 등\n\nⅢ. 지급요건\n1. 보험회사의 동의를 얻어 지출하였거나 필요·유익한 비용일 것\n2. 보상한도액을 초과하는 경우에도 지급될 수 있다는 점에서 손해액과 구별된다.\n\nⅣ. 자기신체사고의 특칙\n자기신체사고에서는 공제액이 발생하지 않는 경우 비용을 지급하지 않고 보험증권에 기재된 가입금액을 지급한다. 44회가 이 규칙을 사례로 물었다.\n\nⅤ. 결론\n비용은 손해액과 별개의 항목이므로 계산문제에서 산식의 위치를 정확히 지켜야 한다.`},

      {q:"자기신체사고와 무보험자동차에 의한 상해의 지급보험금 산정방법을 비교하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 자기신체사고\n1. 산식 — 실제손해액 + 비용 − 공제액\n2. 공제액 — 대인배상Ⅰ·Ⅱ에서 보상받을 수 있는 금액, 무보험차상해에서 지급될 수 있는 금액, 배상의무자 이외의 제3자로부터 보상받은 금액\n3. 산재보험금은 위 제3자 보상액에서 제외되므로 공제하지 아니한다.\n4. 공제액이 없는 단독사고 등에서는 사망은 증권상 가입금액, 부상은 등급별 한도 내 실제 치료비, 후유장해는 등급별 가입금액을 지급한다.\n\nⅡ. 무보험자동차에 의한 상해\n1. 산식 — 약관의 보험금지급기준에 따라 산출한 금액 + 비용 − 공제액\n2. 소송에서 인정된 판결금액을 그대로 인정하지 아니한다.\n3. 보상한도는 통상 1인당 2억원이다.\n4. 공제액에는 산재보험금이 포함된다.\n5. 지급 후 배상의무자에 대하여 보험자대위를 행사한다.\n\nⅢ. 비교의 핵심\n1. 산정기준 — 실제손해액 대 약관 지급기준\n2. 산재보험금 — 공제하지 아니함 대 공제함\n3. 배상의무자의 존재 — 불요 대 필요\n4. 대위 — 원칙적으로 없음 대 있음\n\nⅣ. 결론\n두 담보는 모두 피보험자 자신의 손해를 담보하나 산정기준과 공제의 구조가 다르므로, 사안에서는 어느 담보가 적용되는지를 먼저 특정하여야 한다.`},
      {q:"대인배상Ⅰ의 보상한도 구조를 설명하고, 부상과 사망이 함께 발생한 경우의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 보상한도의 구조\n1. 사망 — 1인당 1억 5천만원. 다만 손해액이 2천만원에 미달하는 경우에도 2천만원을 지급한다.\n2. 부상 — 상해등급별 한도표에 따라 1급부터 14급까지 정해진 금액\n3. 후유장해 — 장해등급별 한도표에 따른 금액\n\nⅡ. 부상과 사망이 함께 발생한 경우\n1. 부상보험금과 사망보험금을 각각의 한도 내에서 산정한다.\n2. 그 합산액을 지급하되 총액은 1억 8천만원을 넘지 못한다.\n\nⅢ. 부상과 후유장해가 함께 발생한 경우\n각각 산정하여 합산한다.\n\nⅣ. 후유장해와 사망이 함께 발생한 경우\n사망보험금에서 후유장해보험금 중 사망일 이후 기간에 해당하는 부분을 조정한다.\n\nⅤ. 치료관계비가 한도에 미달하는 경우\n과실상계 후의 금액이 치료관계비에 미달하더라도 부상 등급별 한도액의 범위에서 치료관계비를 지급한다.\n\nⅥ. 결론\n대인배상Ⅰ은 한도가 항목별로 정해져 있으므로, 손해액 산정과 별도로 한도 적용 단계를 반드시 거쳐야 한다.`},
      {q:"자동차보험 약관상 가정간호비의 인정요건과 지급방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n중대한 후유장해가 남은 피해자가 가정에서 간호를 받아야 하는 경우에 인정되는 약관상의 지급항목이다.\n\nⅡ. 인정요건\n1. 노동능력상실률 100퍼센트의 후유장해가 있을 것\n2. 식물인간 상태이거나 척수손상으로 인한 사지완전마비에 해당할 것\n\nⅢ. 인정 범위\n1일 1인을 기준으로 하며, 일용근로자 임금을 적용한다.\n\nⅣ. 지급방법\n일시금으로 지급하거나 퇴원일부터 생존기간 동안 매월 정기금으로 지급하며, 수령권자가 선택한다.\n\nⅤ. 개호비와의 구별\n손해배상 이론상의 개호비는 필요성과 개호인 수를 개별적으로 판단하나, 가정간호비는 약관이 요건과 범위를 정형화한 항목이다. 문제가 약관을 전제로 하면 위 요건에 따라 판단하여야 한다.\n\nⅥ. 결론\n요건이 좁으므로 사안이 식물인간 또는 사지완전마비에 해당하는지를 먼저 확인하여야 한다.`}
