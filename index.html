    quiz:[
      {q:"회전근개를 이루는 근육을 열거하고, 회전근개 파열과 어깨충돌증후군을 비교하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 회전근개의 구성\n1. 견갑하근(subscapularis)\n2. 극상근(supraspinatus)\n3. 극하근(infraspinatus)\n4. 소원근(teres minor)\n네 근육의 건이 상완골두를 관절와 쪽으로 압박하여 견관절의 안정성을 유지한다.\n\nⅡ. 회전근개 파열\n1. 가장 많이 손상되는 근육은 극상근이다.\n2. 증상은 40세 이후에 시작되는 어깨 전방의 통증으로, 특히 120도에서 160도 사이에서 팔을 올리기 어렵고 근력이 약화되며 야간통이 있다.\n3. 진단은 Jobe 검사와 자기공명영상, 초음파를 사용하며 관절내시경이 가장 정확하다.\n4. 치료는 부분파열은 보존적, 전층파열은 건봉합술과 견봉성형술, 고령의 광범위 파열은 인공관절 치환술을 시행한다.\n\nⅢ. 어깨충돌증후군\n1. 견봉과 상완골두 사이의 간격이 좁아져 극상근건이 견봉에 충돌하여 염증이 생긴 상태이다.\n2. 팔을 드는 중간에는 통증이 없다가 완전히 올라갈 때 통증이 발생한다.\n3. 팔을 위로 사용하는 직업에서 흔하다.\n\nⅣ. 감별의 실익\n회전근개 파열은 근력 약화를 동반하나 충돌증후군은 통증만 있는 것이 원칙이다. 40세 이후의 회전근개 파열은 퇴행성 변화를 바탕으로 하는 경우가 많아 기왕증 기여도 판단에서 이 구별이 중요하다.\n\nⅤ. 결론\n두 질환은 병변의 위치와 근력 약화의 유무로 구별되며, 그 구별이 상해와 질병의 구분으로 이어진다.`},
      {q:"견관절 전방탈구의 손상기전과 동반병변, 합병증을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 견관절의 특성\n상완골두와 관절와가 이루는 구상관절로 운동범위가 가장 넓은 반면 골성 안정성이 낮아 탈구가 쉽고 재발이 잦다.\n\nⅡ. 손상기전\n외전과 외회전이 강제되는 상황에서 발생하며, 럭비, 테니스, 투구 동작이나 그 자세에서의 전도가 대표적이다.\n\nⅢ. 동반병변\n1. 방카르트 병변 — 전하방 관절와순의 파열\n2. 힐삭스 병변 — 상완골두 후측의 피질골 함몰. 탈구 시 상완골두가 관절와 전하방 가장자리에 충돌하여 발생한다.\n\nⅣ. 치료\n액와신경 손상을 방지하기 위하여 가능한 한 빨리 정복한다.\n\nⅤ. 합병증\n1. 액와동맥 손상\n2. 액와신경 손상 — 삼각근 부위의 감각저하와 삼각근 마비로 외전 제한이 남는다.\n3. 재발성 탈구\n4. 방카르트 병변과 힐삭스 병변의 잔존\n5. 회전근개 파열\n\nⅥ. 결론\n전방탈구는 기전과 동반병변이 정형화되어 있으므로, 사안에서 외전·외회전의 기전이 확인되는지를 먼저 검토하여야 한다.`},
      {q:"상완골 간부 골절에 동반되는 신경손상의 증상과 예후를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 손상되는 신경\n요골신경이다. 요골신경은 상완골 간부의 요골신경구를 따라 주행하므로 간부 골절, 특히 중하 1/3 부위의 횡골절이나 나선골절에서 손상되기 쉽다.\n\nⅡ. 원인\n1. 상완골 간부 골절 및 과상부 골절\n2. 목발 등에 의한 장기간의 압박\n3. 허니문 마비, 토요일밤 마비와 같은 압박성 마비\n\nⅢ. 증상\n1. 수근하수 — 손목과 손가락의 신전이 되지 아니한다.\n2. 제1물갈퀴 공간 배측의 감각소실\n3. 파악력의 저하\n\nⅣ. 예후\n1. 신경이 끊어지지 아니하고 눌리거나 늘어난 정도의 손상은 대부분 자연 회복된다.\n2. 회복은 수주에서 수개월에 걸쳐 근위부에서 원위부로 진행한다.\n3. 개방성 골절이거나 정복 후 새로 발생한 마비는 신경의 감입이나 열상을 의심하여 수술적 탐색을 고려한다.\n\nⅤ. 손해사정에서의 의의\n신경손상의 회복 여부가 확정되기 전에는 장해를 평가할 수 없으므로 충분한 경과관찰이 필요하며, 근전도와 신경전도 검사로 회복의 정도를 확인한다.\n\nⅥ. 결론\n상완골 간부 골절에서 요골신경 손상은 흔하나 대부분 회복되므로, 장해 평가의 시점이 실무의 쟁점이 된다.`},
      {q:"원위 요골 골절의 종류를 열거하고 각각의 특징을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 개요\n원위 요골 골절은 신체에서 가장 흔한 골절로 전체 골절의 15퍼센트에서 20퍼센트를 차지한다. 고령의 여성에서 골다공증을 바탕으로 한 저에너지 손상으로, 젊은 층에서는 고에너지 손상으로 발생한다.\n\nⅡ. 종류\n1. 콜레스 골절 — 원위 골편이 후방으로 전위되어 만찬 포크 변형을 보이며 후방 분쇄와 요골 단축이 동반된다.\n2. 스미스 골절 — 원위 골편이 전방으로 전위되어 정원삽 변형을 보이며 전방 분쇄가 동반된다.\n3. 바톤 골절 — 관절 변연부의 골절과 수근골의 탈구 또는 아탈구가 동반된 관절내 골절이다.\n4. 운전기사 골절 — 요골 경상돌기의 견열골절로 수근골의 전위를 동반하는 관절내 골절이다.\n5. 월상골 부하 골절 — 월상골와 후방측이 함몰되는 관절내 골절이다.\n\nⅢ. 합병증\n완관절과 수부의 강직, 외상성 관절염, 정중신경 손상과 수근관 증후군, 복합부위 통증 증후군, 부정유합\n\nⅣ. 손해사정에서의 의의\n관절내 골절인지 여부가 외상성 관절염과 강직장해의 발생 가능성을 좌우하므로 골절의 명칭과 관절면 침범 여부를 확인하여야 한다.\n\nⅤ. 결론\n콜레스와 스미스는 전위 방향으로, 나머지 셋은 관절내 골절이라는 점으로 정리하면 된다.`},
      {q:"수근관 증후군의 원인, 증상, 진단 및 수술적응증을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n손목의 수근관 내에서 정중신경이 압박되어 발생하는 질환으로 상지에서 가장 흔한 신경압박 질환이다.\n\nⅡ. 원인\n1. 특발성이 대부분이며 40대에서 60대의 중년 여성에게 호발한다.\n2. 비만, 당뇨병, 갑상선 기능저하증, 혈액투석\n3. 수근부의 골절과 탈구, 외상으로 인한 부종, 감염, 종양\n4. 임신\n\nⅢ. 증상\n1. 손이 저리고 쑤시며 특히 밤에 심해진다.\n2. 제1, 2, 3수지와 제4수지 요측의 감각이상 또는 무감각\n3. 장기간 지속되면 단무지외전근과 무지대립근의 약화 및 위축이 나타난다.\n\nⅣ. 진단\n1. 팔렌 검사와 티넬 징후\n2. 근전도 검사와 신경전도 검사로 확진한다.\n\nⅤ. 치료\n보존적으로 부목 고정, 소염제, 스테로이드 국소주사를 시행하고, 수술은 굴곡건지대를 절개한다.\n\nⅥ. 수술적응증\n무지구근의 위축이 있는 경우, 50세 이상인 경우, 수지의 무감각이 지속되는 경우, 증상이 심하거나 10개월 이상 지속되는 경우, 팔렌 검사에서 30초 이내에 양성이 나오는 경우\n\nⅦ. 결론\n증상과 신경생리검사가 일치하는지를 확인하여야 하며, 외상과의 인과관계는 수상 부위와 발현 시점을 함께 검토하여 판단한다.`},
      {q:"복합부위 통증 증후군의 분류, 증상 및 진단기준을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n손상의 정도에 비하여 훨씬 심한 통증이 손상이 회복된 후에도 지속되는 만성 신경병성 통증 상태를 말한다.\n\nⅡ. 분류\n1. 제1형 — 과거 반사성 교감신경 이영양증이라 불렸으며 명백한 신경손상의 증거가 없다.\n2. 제2형 — 과거 작열통이라 불렸으며 총상, 교통사고, 자상 등으로 증명 가능한 신경손상이 있다.\n\nⅢ. 호발\n40세에서 60세 사이에 가장 흔하고 소아에게는 드물며, 여성이 남성보다 많고 상지가 하지보다 많다.\n\nⅣ. 증상\n1. 감각의 이상 — 감각과민, 통각과민, 이질통\n2. 자율신경의 이상 — 체온과 발한의 이상, 피부색의 변화\n3. 부종\n4. 운동의 이상 — 근력 약화, 관절운동 제한, 진전\n5. 영양의 변화 — 피부, 모발, 조갑의 변화와 골다공증\n6. 신경의 해부학적 분포와 무관한 통증\n\nⅤ. 진단기준\nBudapest criteria에 따라 세 범주 이상에서 각각 1개 이상의 증상이 있고, 두 범주에서 각각 1개 이상의 징후가 확인되어야 한다. 증상은 환자의 주관적 호소이고 징후는 진찰로 확인되는 객관적 소견이다.\n\nⅥ. 치료\n약물치료, 신경차단술과 척수자극기 등 중재적 통증치료, 물리치료와 심리치료를 병행한다.\n\nⅦ. 결론\n주관적 호소만으로는 진단되지 아니하고 객관적 징후가 요구되므로, 손해사정에서는 징후의 기록 여부를 반드시 확인하여야 한다.`},
      {q:"드퀘르벵 병에서 침범되는 건과 임상증상, 대표적인 신체검사를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n손목 신전건 제1구획의 협착성 건막염으로, 건초가 두꺼워져 건의 활주가 제한되는 질환이다.\n\nⅡ. 침범되는 건\n1. 장무지외전건\n2. 단무지신전건\n\nⅢ. 호발\n30대에서 60대의 여성에게 많고 임신 말기와 수유기에 호발한다. 손목과 엄지를 반복적으로 사용하는 경우에 발생한다.\n\nⅣ. 임상증상\n1. 요골 경상돌기 부위의 통증과 압통\n2. 엄지를 움직이거나 손목을 척측으로 편위시킬 때 통증이 심해진다.\n3. 국소 부종과 마찰음\n\nⅤ. 신체검사\n핑켈스테인 검사가 대표적이다. 엄지를 손바닥 안에 넣고 주먹을 쥔 상태에서 손목을 척측으로 편위시키면 요골 경상돌기 부위의 통증이 증가한다.\n\nⅥ. 치료\n부목 고정, 소염제, 스테로이드 국소주사 등 보존적 치료를 시행하고, 6개월이 경과한 후에도 증상이 심하거나 재발하면 제1구획을 절개하는 수술을 시행한다. 수술의 합병증으로 표재 요골신경의 손상이 있다.\n\nⅦ. 결론\n침범 건 두 가지와 핑켈스테인 검사를 함께 기재하여야 완결된 답안이 된다.`},
      {q:"주상골 골절의 진단상 특징과 합병증을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 해부학적 특성\n주상골은 근위 수근열과 원위 수근열을 연결하는 위치에 있어 수부의 힘을 전완부로 전달하므로 골절의 가능성이 높다. 영양혈관이 원위부에서 들어와 근위부로 역행하므로 근위 골편의 혈류가 취약하다.\n\nⅡ. 진단상 특징\n1. 수상 직후에는 손목 염좌로 오인되어 방치되는 경우가 많다.\n2. 초기 단순방사선에서 골절선이 보이지 아니하는 경우가 있어 보통 2주 후에 재촬영한다.\n3. 전산화단층촬영과 자기공명영상이 정확하다.\n4. 해부학적 코담배갑 부위의 압통이 중요한 소견이다.\n\nⅢ. 합병증\n1. 무혈성 괴사 — 특히 근위 골편\n2. 불유합\n3. 장기 방치 시 중수근 관절염으로 진행하고, 주상골 불유합 진행성 붕괴에 이른다.\n4. 완관절의 운동제한과 만성 통증\n\nⅣ. 손해사정에서의 의의\n초기에 진단되지 못한 경우 사고와의 인과관계가 다투어지므로, 초기 진료기록의 압통 부위와 재촬영 경과를 확인하여야 한다.\n\nⅤ. 결론\n주상골 골절은 놓치기 쉬운 골절의 대표이며 무혈성 괴사와 불유합이 예후를 결정한다.`},
      {q:"쇄골 골절의 특징과 수술적 치료가 필요한 경우를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 특징\n1. 쇄골은 인체에서 가장 흔하게 골절되는 뼈이다.\n2. 견봉쇄골관절과 흉쇄관절을 이루며 상완신경총과 쇄골하 동정맥이 인접하여 주행한다.\n3. 중간 3분의 1 부위의 골절이 가장 흔하다.\n4. 대부분 보존적 치료로 골유합을 얻을 수 있으며 팔걸이나 8자형 보조기를 사용한다.\n\nⅡ. 수술적 치료가 필요한 경우\n1. 개방성 골절\n2. 불유합 또는 지연유합\n3. 신경이나 혈관의 손상이 동반된 경우\n4. 골절편이 피부를 뚫을 정도로 심하게 전위된 경우\n5. 쇄골과 견갑골 경부가 함께 골절되어 견관절이 불안정한 경우\n6. 다발성 손상으로 조기 거동이 필요한 경우\n7. 단축이 심하여 기능장해가 예상되는 경우\n8. 외측 3분의 1 골절에서 오구쇄골인대가 파열되어 불안정한 경우\n\nⅢ. 합병증\n지연유합, 부정유합, 불유합, 상완신경총과 쇄골하 동정맥의 손상, 견쇄관절과 흉쇄관절의 외상성 관절염, 늑쇄증후군\n\nⅣ. 결론\n쇄골 골절은 보존적 치료가 원칙이므로, 수술이 시행된 경우에는 위 적응에 해당하는지를 검토하여 치료의 적정성을 판단한다.`},
      {q:"견봉쇄골관절 탈구에서 손상 여부를 확인하여야 할 주요 인대를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 견봉쇄골관절의 안정성\n견봉쇄골관절의 안정성은 두 계통의 인대에 의하여 유지된다.\n\nⅡ. 확인하여야 할 인대\n1. 견봉쇄골인대 — 관절을 직접 둘러싸며 수평면에서의 안정성, 즉 전후방 안정성을 담당한다.\n2. 오구쇄골인대 — 원추인대와 능형인대로 이루어지며 수직면에서의 안정성, 즉 상하방 안정성을 담당한다.\n\nⅢ. 손상의 단계\n1. 경도의 손상에서는 견봉쇄골인대만 늘어나거나 부분 파열된다.\n2. 손상이 진행하면 견봉쇄골인대가 완전 파열되고 오구쇄골인대가 늘어난다.\n3. 중증에서는 두 인대가 모두 파열되어 쇄골 원위부가 상방으로 전위되며 계단 변형이 나타난다.\n\nⅣ. 진단\n양측을 비교하는 단순방사선 촬영과 부하 촬영으로 쇄골의 상방 전위 정도를 측정하고, 자기공명영상으로 인대 손상을 확인한다.\n\nⅤ. 치료\n경도는 보존적으로 치료하고, 오구쇄골인대가 완전 파열되어 전위가 심한 경우에는 수술적 정복과 인대 재건을 시행한다.\n\nⅥ. 결론\n견봉쇄골인대는 수평 안정성을, 오구쇄골인대는 수직 안정성을 담당하므로 두 인대를 모두 평가하여야 손상의 정도를 정확히 판단할 수 있다.`}
    ],
    past:[
      {r:49,u:"m2",t:"드퀘르벵 병에서 침범되는 대표적인 건 2가지를 기술하고(4점), 특징적인 임상 증상 1가지와(3점) 진단에 이용되는 가장 대표적인 신체검사의 명칭을(3점) 기술하시오.", ref:"m2#6"},
      {r:49,u:"m2",t:"낙상 후 어깨를 바닥에 부딪힌 환자에서 견봉쇄골관절 탈구가 의심된다. 견봉쇄골관절의 안정성을 평가하기 위해 손상 여부를 확인해야 하는 주요 인대를 2가지 기술하시오. (10점)", ref:"m2#9"},
      {r:49,u:"m2",t:"소아 골절 중 가장 흔한 골절 중 하나인 상완골 과상부 골절. (1) X-선상 전위가 없는 경우 시행할 수 있는 치료 1가지 (2) 혈관 손상으로 인해 발생할 수 있는 대표적인 후기 합병증 1가지 (각 5점)",
       a:`Ⅰ. 전위가 없는 경우의 치료\n도수정복이 필요하지 아니하므로 장상지 석고고정 또는 부목고정을 시행한다. 주관절을 약 90도 굴곡한 상태에서 3주에서 4주간 고정하고 이후 능동운동을 시작한다.\n\nⅡ. 혈관 손상으로 인한 대표적 후기 합병증\n볼크만 허혈성 구축이다.\n\nⅢ. 발생 기전\n1. 상완골 과상부 골절에서 상완동맥이 압박되거나 손상되면 전완부의 혈액공급이 차단된다.\n2. 전완부 구획의 내압이 상승하여 근육과 신경이 허혈에 빠진다.\n3. 괴사된 근육이 반흔조직으로 대체되면서 구축이 일어나 손목과 손가락이 굴곡된 갈퀴손 변형이 남는다.\n\nⅣ. 임상 소견\n통증, 창백, 감각이상, 마비, 무맥에 부풀음을 더한 여섯 가지 징후가 나타나며, 정중신경과 척골신경이 주로 손상된다.\n\nⅤ. 예방과 치료\n조기 정복과 구획압의 관찰이 중요하며, 구획증후군이 의심되면 즉시 근막절개술을 시행한다. 구축이 완성된 후에는 반흔 절제술, 유착박리술, 신경박리술, 전완골 단축술, 근육전이술을 시행한다.\n\nⅥ. 결론\n소아 상완골 과상부 골절에서는 혈관 손상의 조기 발견이 예후를 결정한다.`},
      {r:44,u:"m2",t:"다음은 상지의 구조를 표시한 그림이다. 뼈와 관절의 이름을 작성하고, 삼각섬유연골 복합체 병변(TFCC)이 발생하는 관절을 쓰시오. (10점)",
       a:`Ⅰ. 상지를 이루는 뼈\n쇄골, 견갑골, 상완골, 요골, 척골, 그리고 8개의 수근골과 중수골, 수지골로 이루어진다.\n\nⅡ. 상지의 주요 관절\n1. 견관절 부위 — 흉쇄관절, 견봉쇄골관절, 상완와관절\n2. 주관절 부위 — 상완척골관절, 상완요골관절, 근위요척관절\n3. 완관절 부위 — 원위요척관절, 요수근관절, 수근간관절\n\nⅢ. 삼각섬유연골 복합체 병변\n원위 요척관절에서 발생한다. 삼각섬유연골 복합체는 요골과 척골의 원위부 사이에 위치하여 원위 요척관절의 안정성을 담당하고 척측의 하중을 전달한다.\n\nⅣ. 임상적 의의\n1. 손목 척측의 통증과 회내·회외 시 마찰음이 나타난다.\n2. 원위 요골 골절이나 손목의 염전 손상에 동반되는 경우가 많다.\n3. 자기공명영상과 관절내시경으로 진단한다.\n\nⅤ. 결론\n관절의 명칭은 견관절·완관절과 같은 통칭이 아니라 상완와관절, 요수근관절과 같이 구체적 명칭으로 기재하여야 한다.`},
      {r:43,u:"m2",t:"회전근개 파열 — (1) 회전근개를 이루는 근육 (2) 가장 손상이 많은 근육 (3) 진단 시 영상검사 2가지 (4) 주요 치료 3가지", ref:"m2#0"},
      {r:42,u:"m2",t:"75세의 여자환자가 자동차 사고로 인해 우측 상완골 근위부에 사분 골절 및 탈구가 생겼다. 치료방법(5점)과 그 이유(5점)는?",
       a:`Ⅰ. 치료방법\n인공관절 치환술, 구체적으로는 상완골두 치환술 또는 역형 견관절 전치환술을 시행한다.\n\nⅡ. 그 이유\n1. 75세의 고령 여성으로 심한 골다공증이 예상되어 내고정물의 고정력이 유지되기 어렵다.\n2. 사분 골절은 상완골두로 가는 혈행이 대부분 차단되어 무혈성 괴사의 가능성이 매우 높다.\n3. 탈구가 동반되어 잔존 혈행이 더욱 손상된다.\n4. 내고정을 시행하더라도 부정유합, 불유합, 고정 실패의 위험이 높아 재수술의 가능성이 크다.\n5. 고령에서는 조기에 관절운동을 시작하여 강직을 예방하는 것이 기능 회복에 유리하다.\n\nⅢ. 대안의 검토\n젊은 환자이거나 골질이 양호하고 골편의 혈행이 보존되어 있다면 관혈적 정복 및 내고정술을 우선 고려한다.\n\nⅣ. 예후\n인공관절 치환술 후에도 외전과 외회전의 제한이 남는 경우가 많아 견관절 운동장해가 잔존할 수 있다.\n\nⅤ. 결론\n고령, 골다공증, 사분 골절, 탈구 동반이라는 네 가지 조건이 모이면 인공관절 치환술이 선택된다.`},
      {r:41,u:"m2",t:"대부분의 쇄골골절은 보존적 치료로 골유합을 얻을 수 있다. 그러나 수술이 필요한 경우는? (10점)", ref:"m2#8"}
    ]
  },

       body:`<p><b>구조</b> — 좌우 <b>무명골(관골)</b>과 <b>천골·미골</b>로 이루어진 <b>고리(골반환)</b>. 무명골은 <b>장골·좌골·치골</b> 세 뼈가 융합한 것이다. 후방에서 무명골과 천골이 <b>천장관절</b>을, 전방에서 양측 무명골이 <b>치골결합</b>을 이룬다.</p>

      {h:"심부정맥혈전증과 폐색전증", freq:F(3,[48]),
       body:`<p><b>DVT</b> — 하지 심부정맥에 혈전이 생기는 것. 골반·대퇴골 골절의 주요 합병증이다.</p>
       <ul><li><b>위험인자</b> — 고령, 장시간·반복 수술, 긴 고정기간, 활동력 감소, 골절 정도가 큰 경우, 심한 전신질환, 비만, 악성종양, 경구피임약</li>
       <li><b>증상</b> — 비특이적이다. 하지의 <b>통증·부종·압통·온감</b>, 호만 징후</li>
       <li><b>진단</b> — <b>도플러 초음파</b>, 정맥조영술, D-dimer</li>
       <li><b>치료</b> — 항응고제(헤파린 → 경구 항응고제), 혈전용해술, 압박스타킹</li>
       <li><b>예방이 최선</b> — 조기 보행, 발목 굴신운동, 간헐적 공기압박, 예방적 항응고요법</li></ul>
       <p><b>폐색전증</b> — 심부정맥의 혈전이 떨어져 나가 폐동맥을 막는 것. <b>확진 전에 사망하는 경우가 많다.</b></p>
       <ul><li>증상 — 갑작스러운 <b>호흡곤란</b>, 빈맥, 흉막성 흉통, 객혈, 혈압하강, 실신, 청색증, 배변 의욕</li>
       <li>치료 — <b>입원 후 24~48시간 침상안정</b>, 산소, 항응고·혈전용해, 재발 위험이 높으면 <b>하대정맥 필터</b></li></ul>
       <div class="warn"><b>지방색전과 구별한다.</b> 지방색전은 장관골 골절 <b>직후 2~3일</b>에 점상출혈을 동반하고, 폐색전은 <b>장기 침상안정 후</b> 갑자기 온다.</div>`,
       mnemo:{key:"통 · 부 · 압 · 온", how:"DVT의 증상 — <b>통</b>증 · <b>부</b>종 · <b>압</b>통 · <b>온</b>감. 비특이적이라 <b>도플러 초음파</b>로 확인한다. 최선은 <b>예방</b>."}},

      {h:"고관절 — 비구 골절과 후방탈구", freq:F(3,[41,46]),
       body:`<p>고관절은 비구와 대퇴골두의 <b>구상관절</b>로 <b>견관절 다음으로 운동범위가 넓고</b>, 관절강 내 대퇴골두인대와 관절낭 밖 여러 인대로 <b>인체에서 가장 튼튼한 관절</b>이다.</p>
       <p><b>비구 골절</b> — 고에너지 손상(교통사고·추락), 젊은 남성에 많다. <b>대퇴골두가 해머처럼 작용</b>해 비구를 깬다. 전벽·전주·후벽·후주·횡단·T자 골절로 나누며 대부분 수술한다(목표는 <b>해부학적 정복과 매끄러운 관절면 복원</b>).</p>
       <div class="why"><span class="h">이소성 골화증</span>
       정상적으로 뼈가 없어야 할 연부조직에 뼈가 생기는 것. 외상 후 <b>1~4개월</b>에 발생하며 <b>고관절·주관절·견관절</b>에 호발한다. 예방은 <b>조기 능동운동과 부드러운 수동운동</b>. 결과는 <b>관절운동 제한</b>이다.</div>
       <p><b>고관절 후방탈구</b> — 전체 고관절 탈구의 <b>약 90%</b></p>
       <ul><li>기전 — <b>교통사고의 계기판 손상</b>(고관절·슬관절 굴곡 상태에서 무릎 앞에 충격), 추락</li>
       <li>징후 — <b>하지 단축, 내전 및 내회전 변형</b></li>
       <li>신경 — 좌골신경 손상, 특히 <b>비골신경 손상이 더 흔하다</b> → 족하수</li>
       <li>치료 — <b>24시간 내 정복</b> + 외전·신전 견인 약 2주 후 체중부하</li>
       <li>후기 합병증 — <b>무혈성 괴사 8~20%</b>, <b>이소성 골화증 8~15%</b>, 외상성 관절염, 재탈구</li></ul>`,
       mnemo:{key:"후방 90% · 단축 내전 내회전 · 24시간", how:"고관절 탈구는 <b>90%가 후방</b>. 다리가 <b>짧아지고 안으로 모이고 안으로 돌아간다</b>. <b>24시간</b> 안에 맞춰야 한다."}},

      {h:"대퇴골 근위부 골절 세 가지", freq:F(3,[46]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>부위</th><th>특징</th><th>합병증</th></tr>
       <tr><td><b>대퇴 경부</b></td><td>골다공증 있는 노령, 대전자 측면 충돌(외반감입), 자연골절, 피로골절(장거리 주자·군인)</td><td><b>무혈성 괴사</b>, 불유합</td></tr>
       <tr><td><b>전자간</b></td><td>더 고령·더 강한 외력·더 심한 골다공증·여성</td><td><b>혈류가 풍부해 지연유합·불유합·무혈성 괴사는 드물다.</b> 대신 <b>내반변형·외회전 변형</b>이 남는다</td></tr>
       <tr><td><b>전자하</b></td><td>다발성 외상, 교통사고·오토바이·산업재해. <b>병적골절</b>(원발암·전이암)도 원인</td><td>DVT·폐색전증·폐렴·비뇨기 감염</td></tr>
       </table></div>
       <div class="warn">공통 치료 원칙 — <b>수상 후 신속한 수술과 조기 운동</b>. 고령에서 오래 누워 있으면 폐렴·욕창·혈전으로 사망한다. 이것이 대퇴골 골절 수술을 서두르는 이유다.</div>
       <p><b>대퇴골두 무혈성 괴사</b>는 1단원에서 본 그대로다. <b>30~50대</b>, 남성에 많고, 외상성(탈구·경부골절)과 비외상성(음주·스테로이드·흡연·잠수병 등)으로 나뉜다. <b>Patrick 검사 양성</b>, <b>외전·내회전 제한</b>, 초기 <b>Crescent 징후</b>, MRI <b>이중선 징후</b>. 치료는 코어감압술·골이식·인공관절 치환술.</p><div class="qfig"><div class="qrd">기출 예상</div><div class="qt">대퇴골 근위부 — 부위 명칭과 골절 유형</div><div class="qq">(1) ①~④ 각 부위의 명칭을 쓰시오.<br>
    (2) Ⓐ·Ⓑ·Ⓒ 각 골절선에 해당하는 골절의 이름을 쓰시오.<br>
    (3) 위 골절 중 <b>무혈성 괴사와 불유합</b>이 가장 잘 생기는 것은 무엇이며 그 이유를 쓰시오.</div><svg viewBox="0 0 620 290" role="img" aria-label="대퇴골 근위부 문제 그림">

      {h:"슬관절 — 골절과 반월상 연골", freq:F(3,[45,46]),
       body:`<p>슬관절은 <b>신체에서 가장 큰 무게를 지탱하는 관절</b>로 대퇴골·경골·슬개골로 구성된다.</p>
       <ul><li><b>슬개골</b>은 <b>인체에서 가장 큰 종자골</b>. 직접 손상(계기판·낙상)과 간접 손상(대퇴사두근의 갑작스런 수축 → 견열·횡골절)으로 부러진다.<br>
       치료 — <b>비전위 또는 1~2mm 이내 전위는 부목·석고 고정 후 6~8주부터 체중부하</b>, <b>3mm 이상 전위나 분쇄는 8자형 강선 결박술·나사 고정술</b>, 심한 분쇄는 슬개골 적출.</li>
       <li><b>경골 근위부(경골 고평부)</b> — <b>관절내 골절</b>이므로 정확한 정복이 필요해 관혈적 정복·내고정을 한다. <b>비골신경</b> 손상에 주의(비골 경부를 돌아가므로) → <b>족하수, 족배부 감각소실</b>.</li>
       <li><b>경골 간부</b> — <b>외상성 장골골절 중 가장 흔하다.</b> 전내측이 피하에 있어 연부조직·골막이 얇고 혈류가 나빠 <b>개방성 골절이 흔하다</b>. 합병증은 구획증후군, 골 결손, 골수염, 혈전. <b>단축 2cm 이상</b>이면 장해가 문제된다.</li></ul>
       <p><b>반월상 연골</b> — 두 개의 쐐기 모양 연골로 대퇴골과 경골 사이의 <b>충격 흡수</b>를 담당한다.</p>
       <div class="why"><span class="h">기능 5가지 (46회 출제)</span>
       ① <b>체중부하의 분산과 충격 흡수</b> — 직립 시 슬관절 부하의 <b>40~60%</b>, 90도 이상 굴곡 시 <b>85%</b>가 반월상 연골로 전달된다<br>
       ② <b>관절의 안정성</b> 증가<br>
       ③ <b>관절면의 적합성</b> 유지(대퇴골 원형과 경골 평면을 맞춰 준다)<br>
       ④ <b>관절연골의 보호</b>와 윤활<br>
       ⑤ 관절액의 <b>분포</b>와 고유수용감각</div>
       <div class="scroller"><table class="mini">
       <tr><th>구분</th><th>외상성 파열</th><th>퇴행성 파열</th></tr>
       <tr><td>연령</td><td><b>20대 전후</b></td><td><b>40~50대 이후</b></td></tr>
       <tr><td>기전</td><td>굴곡위에서 회전력(스키·축구·태클), 1/3에서 ACL 동반손상</td><td>반복적 하중, 사소한 동작(의자에서 일어나며 비트는 정도)</td></tr>
       <tr><td>증상</td><td>급성 동통과 부종</td><td>만성 관절부종과 통증</td></tr>
       </table></div>
       <p><b>혈행 구역</b> — 바깥 1/3은 <b>적-적 영역</b>으로 혈액공급이 좋아 <b>봉합술</b>, 안쪽 2/3는 <b>백색 영역</b>으로 자가치유가 되지 않아 <b>부분절제술</b>을 한다.</p>
       <p><b>검사</b> — <b>맥머레이 검사</b>(앙와위 최대 굴곡 후 외회전 시 후내측, 내회전 시 후외측에서 클릭), <b>Apley 검사</b>(복와위 90도 굴곡, <b>압박</b>은 반월상연골, <b>신연</b>은 측부인대). 공통 증상은 <b>관절 잠김과 덜컹거림</b>.</p>`,
       mnemo:{key:"적적은 꿰매고 백색은 자른다", how:"바깥 <b>1/3 적-적</b>은 피가 통하니 <b>봉합</b>, 안쪽 <b>2/3 백색</b>은 피가 없으니 <b>절제</b>.<br>부하는 <b>서면 40~60%, 쪼그리면 85%</b>."}},

      {h:"슬관절 인대 — 사례형 단골", freq:F(3,[43,49]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>인대</th><th>기능</th><th>손상 기전</th><th>검사</th></tr>
       <tr><td><b>ACL</b> 전방십자인대</td><td>경골이 앞으로 밀리는 것을 막고 회전 안정성 제공</td><td>급정지·방향전환·<b>점프 후 착지</b>·태클. <b>여성이 남성의 4~8배</b></td><td><b>Lachman 검사</b>(20~30도 굴곡), 전방전위 검사(고관절 45도·슬관절 80~90도), <b>축이동 검사</b>(10~40도)</td></tr>
       <tr><td><b>PCL</b> 후방십자인대</td><td>경골이 뒤로 빠지는 것을 제한. <b>새끼손가락 굵기</b></td><td>근위 경골 앞쪽 <b>직접 타격</b>(계기판 충돌)</td><td>후방전위 검사(90도 굴곡), 후방 처짐 징후, 대퇴사두근 활성검사</td></tr>
       <tr><td><b>MCL</b> 내측측부인대</td><td>대퇴골–경골 연결</td><td><b>외반 + 외회전</b>. <b>슬관절 인대 중 가장 흔히 손상</b></td><td>외반부하 검사</td></tr>
       <tr><td><b>LCL</b> 외측측부인대</td><td>대퇴골–비골 연결</td><td><b>내반 + 내회전</b>. 단독손상은 거의 없다</td><td>내반부하 검사</td></tr>
       </table></div>
       <div class="warn">부하검사는 <b>0도와 30도 굴곡</b>에서 시행하고 <b>반드시 건측과 비교</b>한다.</div>
       <p><b>ACL 손상의 전형</b> — 점프 후 착지하며 무릎이 안쪽으로 꺾이고 <b>'뚝' 하는 파열음(popping sound)</b>, 이어 통증·부종·<b>불안정감</b>. 동반손상은 MCL과 반월상연골(<b>급성은 외측, 만성은 내측</b> 반월상연골).</p>
       <div class="calcbox"><b>Lachman 검사 — 답안 작성 요령</b><br>
       "환자를 앙와위로 눕히고 <b>슬관절을 20~30도 굴곡</b>시킨 상태에서, 한 손으로 대퇴골 원위부를 고정하고 다른 손으로 <b>경골 근위부를 전방으로 당겨</b> 전방 전위의 정도와 종점의 경도를 건측과 비교한다."<br>
       ※ 모범답안이 명시했다 — <b>"20~30도 굴곡"과 "경골을 전방으로 당긴다"는 반드시 써야 한다.</b></div>
       <p><b>인대손상 등급</b> — Grade Ⅰ 경미(안정성 유지), Grade Ⅱ 부분파열(느슨해짐), Grade Ⅲ 완전파열(불안정).<br>
       <b>전방전위 정도</b> — Grade 0: 2mm 이하 / 1: 3~5mm / 2: 6~10mm / 3: 11mm 이상.</p>
       <p>가장 정확한 확인은 <b>관절내시경</b>이며, MRI와 <b>Arthrometer(KT-2000)·Telos 부하촬영</b>이 사용된다.</p><div class="qfig"><div class="qrd">기출 예상</div><div class="qt">슬관절 — 네 인대와 연골</div><div class="qq">(1) ①~④ 인대의 명칭을 쓰시오.<br>
    (2) ⑤의 명칭과, 손상 여부를 보는 <b>이학적 검사</b> 이름을 쓰시오.<br>
    (3) <b>전방전위검사(anterior drawer test)</b>가 양성일 때 손상된 인대의 번호와 이름을 쓰시오.</div><svg viewBox="0 0 560 300" role="img" aria-label="슬관절 문제 그림">

</svg><details class="ansbox"><summary>정답 보기</summary><div class="ansb"><b>(1)</b> ① 전십자인대(ACL) ② 후십자인대(PCL) ③ 내측측부인대(MCL) ④ 외측측부인대(LCL)<br>
 <b>(2)</b> ⑤ <b>반월상연골</b>(내측·외측) — <b>McMurray 검사</b> (그 외 Apley 압박검사)<br>
 <b>(3)</b> ① <b>전십자인대(ACL)</b> — 경골이 앞으로 밀리는 것을 막는 인대이므로, 앞으로 밀리면 ACL 손상이다.</div><div class="qtip"><span class="h">여기서 갈린다</span><b>전방</b>으로 밀리면 <b>전</b>십자, <b>후방</b>으로 밀리면 <b>후</b>십자 — 이름 그대로다. 옆으로 벌어지면(내반·외반) 옆인대(MCL·LCL)를 본다. 동요관절 장해평가는 이 스트레스 검사의 <b>건측 대비 차이(mm)</b>로 등급을 매긴다.</div></details></div>`,
       mnemo:{key:"뚝 소리 나면 ACL", how:"점프 착지 + <b>'뚝'</b> + 불안정감 = <b>ACL</b>. 검사는 <b>라크만</b>.<br>계기판에 무릎 찧었으면 <b>PCL</b>. 옆에서 밀렸으면 <b>MCL(외반)</b>."}},

      {h:"족관절과 족부", freq:F(3,[44,45]),
       body:`<p>족관절은 <b>경골·비골·거골</b>로 이루어지며 원위경비관절(인대결합), 거퇴관절, 거골하관절이 있다. <b>체중을 받는 관절이라 관절내 손상 시 외상성 관절염이 빈번</b>하므로 해부학적 정복이 필요하다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>명칭</th><th>부러진 곳</th></tr>
       <tr><td>내과 골절</td><td>경골 내측 과</td></tr>
       <tr><td>외과 골절</td><td>비골 원위단</td></tr>
       <tr><td>후과 골절</td><td>경골 후방 과</td></tr>
       <tr><td>양과 골절</td><td>내과 + 외과</td></tr>
       <tr><td><b>삼과 골절</b></td><td><b>내과 + 외과 + 후과</b> — 불안정하므로 <b>관혈적 정복 및 내고정</b></td></tr>
       <tr><td>Pilon(Plafond) 골절</td><td>족관절면까지 침범한 원위 경골 관절내 골절, 분쇄가 많다</td></tr>
       </table></div>
       <p><b>외측 인대 손상</b> — <b>내반력</b>(발목이 안쪽으로 꺾임)이 기전이며 <b>전거비인대 → 종비인대</b> 순으로 손상된다. 44회가 이것을 물었다. 치료는 <b>PRICE</b>(보호·안정·냉찜질·압박·거상). 급성의 <b>10~30%가 만성 불안정증</b>으로 진행하고, <b>6주 이상</b> 치료에도 증상이 지속되면 Brostrom 수술을 고려한다.</p>
       <p><b>거골</b> — 표면의 <b>60%가 관절연골</b>이라 혈류가 나빠 <b>무혈성 괴사가 호발</b>한다. 경부 골절이 가장 흔하고, <b>체부 골절은 예후가 훨씬 나쁘며 탈구가 동반되면 100% 괴사</b>한다.</p>
       <p><b>종골</b> — <b>족근골 중 가장 큰 뼈이자 가장 흔한 골절</b>. <b>추락 손상</b>이 원인이고 <b>약 10%에서 척추 압박골절을 동반</b>한다. 관절외·경미한 전위는 고정 6~8주, 관절내 골절은 해부학적 복원과 조기 관절운동. 급성 합병증은 구획증후군·피부괴사·감염·비복신경 손상, 만성 합병증은 관절강직·<b>거골하관절의 외상성 관절염</b>·checkrein 변형(갈퀴족지).</p>
       <div class="warn">45회가 종골 골절 사례에서 <b>"종골과 (거골)이 이루는 (거골하관절)에 외상성 관절염"</b>을 빈칸으로 물었고, 심한 경우의 수술로 <b>거골하관절 유합술</b>을 답하게 했다. 추가 영상검사는 <b>CT</b>다.</div>
       <p><b>피로골절</b> — 과사용·반복활동으로 중족골·주상골·종골·거골경부·대퇴경부·경골 내측에 발생한다. <b>휴식하면 줄고 활동하면 심해지는</b> 통증이 특징이다.</p><div class="qfig"><div class="qrd">기출 44회 2번 (10점)</div><div class="qt">발목 — 외측 인대와 주변 구조</div><div class="qq">(1) 외측 발목의 안정성과 관련이 높은 주요 인대 ①·②·③을 쓰시오. (3점)<br>
    (2) ④의 명칭을 쓰시오. (1점)<br>
    (3) ⑤·⑥에 해당하는 뼈의 이름을 쓰시오. (2점)<br>
    (4) 발목 외상 시 가장 많이 손상되는 <b>동작</b>(2점)과 가장 많이 손상되는 <b>인대</b>(2점)를 쓰시오.</div><svg viewBox="0 0 560 340" role="img" aria-label="발목 외측 문제 그림">

</svg><details class="ansbox"><summary>정답 보기</summary><div class="ansb"><b>(1)</b> ① 후거비인대(posterior talofibular lig.) ② 종비인대(calcaneofibular lig.) ③ 전거비인대(anterior talofibular lig.)<br>
 <b>(2)</b> ④ 아킬레스건(achilles tendon)<br>
 <b>(3)</b> ⑤ 종골(calcaneus) ⑥ 거골(talus)<br>
 <b>(4)</b> 동작 — <b>족저굴곡 + 내번</b>(발이 안으로 휘는 내반력) / 인대 — <b>전거비인대</b></div><div class="qtip"><span class="h">여기서 갈린다</span>외측 인대 3개는 <b>앞에서 뒤로 전거비 → 종비 → 후거비</b>. 가장 잘 다치는 것은 맨 앞의 <b>전거비인대</b>다. 이름 자체가 붙는 곳을 말해준다 — 종<b>비</b>인대는 종골과 비골, 거<b>비</b>인대는 거골과 비골.</div></details></div><div class="qfig"><div class="qrd">기출 45회 9번 (10점)</div><div class="qt">삼과 골절 — 어느 뼈가 부러진 것인가</div><div class="qq">(1) '삼과 골절'에서 골절이 발생한 뼈의 <b>번호 두 개</b>를 찾고 그 이름을 함께 쓰시오. (각 2점, 총 8점)<br>
    (2) 삼과 골절에 가장 적합한 <b>치료방법</b>을 간단히 쓰시오. (2점)</div><svg viewBox="0 0 560 320" role="img" aria-label="발목관절 정면 문제 그림">

</svg><details class="ansbox"><summary>정답 보기</summary><div class="ansb"><b>(1)</b> ① <b>비골</b>(fibula) — 외과 / ② <b>경골</b>(tibia) — 내과·후과<br>
 <span class="sub">삼과 골절 = 경골의 <b>내과 + 후과</b>, 비골의 <b>외과</b> 세 곳이 부러진 것. (③ 거골, ④ 종골은 정답이 아니다)</span><br>
 <b>(2)</b> 전위가 크고 도수정복이 어려워 <b>수술적 치료</b> — 관혈적 정복 및 내고정술(나사못·금속판)</div><div class="qtip"><span class="h">여기서 갈린다</span>'과(踝)'는 복사뼈다. 경골이 두 개(내과·후과), 비골이 하나(외과) — <b>2+1=3</b>이라 삼과. 뼈는 두 개인데 과는 셋이라는 점이 함정이다.</div></details></div>`,
       mnemo:{key:"전거비 → 종비", how:"발목 삐면 <b>전거비인대</b>부터, 다음이 <b>종비인대</b>. 기전은 <b>내반</b>.<br>추락해서 발뒤꿈치로 착지 → <b>종골 골절 + 척추 압박골절 10%</b>를 반드시 함께 본다."}}
    ],

      {f:"골반 골절에서 지연유합·불유합이 드문 이유는?", b:"혈행이 풍부하기 때문이다. 대신 부정유합과 내부장기 손상이 문제된다."},

    quiz:[
      {q:"슬관절 반월상 연골판의 기능을 5가지 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 해부\n내측과 외측에 각각 하나씩 있는 쐐기 모양의 섬유연골로, 대퇴골과 경골 사이에 위치한다.\n\nⅡ. 기능\n1. 체중부하의 분산과 충격의 흡수 — 직립 시 슬관절에 부하되는 체중의 약 40퍼센트에서 60퍼센트, 90도 이상 굴곡 시에는 약 85퍼센트가 반월상 연골판을 통하여 전달된다.\n2. 관절의 안정성 증가 — 오목한 형태로 대퇴골두의 이동을 제한한다.\n3. 관절면의 적합성 유지 — 둥근 대퇴골 과와 평평한 경골 고평부 사이의 부조화를 메운다.\n4. 관절연골의 보호 — 접촉면적을 넓혀 단위면적당 압력을 낮춘다.\n5. 관절액의 분포와 윤활 작용\n6. 고유수용감각의 제공\n\nⅢ. 손상 시의 결과\n기능이 소실되면 관절연골에 가해지는 압력이 증가하여 퇴행성 관절염이 촉진된다. 따라서 가능하면 절제보다 봉합을 시행한다.\n\nⅣ. 결론\n반월상 연골판은 충격 흡수와 관절 보호가 본질적 기능이므로, 절제의 범위가 장래의 퇴행성 변화와 직결된다.`},
      {q:"전방십자인대 손상의 진단을 위한 신체검사를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 손상의 전형\n점프 후 착지하거나 급정지, 방향전환 시 무릎이 안쪽으로 꺾이며 파열음이 들리고 통증, 부종, 불안정감이 나타난다.\n\nⅡ. 신체검사\n1. Lachman 검사\n환자를 앙와위로 눕히고 슬관절을 20도에서 30도 굴곡시킨 상태에서, 한 손으로 대퇴골 원위부를 고정하고 다른 손으로 경골 근위부를 전방으로 당겨 전방 전위의 정도와 종점의 경도를 건측과 비교한다. 가장 예민한 검사이다.\n2. 전방전위 검사\n고관절을 45도, 슬관절을 80도에서 90도 굴곡시키고 발을 고정한 후 경골 근위부를 전방으로 당긴다. 전위가 2밀리미터 이하이면 정상, 3에서 5밀리미터는 1도, 6에서 10밀리미터는 2도, 11밀리미터 이상은 3도로 평가한다.\n3. 축이동 검사\n슬관절을 신전 상태에서 외반과 내회전을 가하며 10도에서 40도로 굴곡시키면 아탈구되었던 경골이 갑자기 정복되는 현상을 확인한다.\n\nⅢ. 보조검사\n자기공명영상, 기기를 이용한 전방전위 계측(KT-2000), Telos 부하촬영, 그리고 가장 정확한 관절내시경\n\nⅣ. 손해사정에서의 의의\n동요관절의 장해평가는 스트레스 방사선촬영에서 건측과 비교한 증가 수치를 기준으로 하므로, 검사의 자세와 부하 조건이 기록되어야 한다.\n\nⅤ. 결론\n검사의 명칭만이 아니라 자세와 조작 방법을 함께 기재하여야 점수가 인정된다.`},
      {q:"고관절 후방탈구의 기전, 임상소견 및 합병증을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 빈도\n고관절 탈구의 약 90퍼센트가 후방탈구이다.\n\nⅡ. 기전\n고관절과 슬관절이 굴곡된 상태에서 슬관절 전방에 강한 외력이 가해질 때 발생한다. 교통사고에서 계기판에 무릎을 부딪히는 손상이 대표적이며 추락도 원인이 된다.\n\nⅢ. 임상소견\n1. 하지의 단축\n2. 내전 및 내회전 변형\n3. 심한 통증과 운동 불능\n4. 좌골신경 손상이 동반되면 발과 발목의 감각소실과 근력저하가 나타나며, 특히 비골신경 부분의 손상이 흔하여 족하수를 보인다.\n\nⅣ. 치료\n24시간 이내에 정복하여야 무혈성 괴사의 위험을 줄일 수 있다. 정복 후 외전·신전 상태로 약 2주간 견인한 뒤 체중부하를 시작한다. 비구 골절이나 관절내 유리체가 동반되면 수술적 치료를 시행한다.\n\nⅤ. 합병증\n1. 대퇴골두 무혈성 괴사 8퍼센트에서 20퍼센트\n2. 이소성 골화증 8퍼센트에서 15퍼센트\n3. 외상성 관절염\n4. 재발성 탈구\n5. 좌골신경 손상\n\nⅥ. 결론\n정복까지의 시간이 예후를 결정하므로, 손해사정에서는 내원 시각과 정복 시각을 확인하여야 한다.`},
      {q:"종골 골절의 손상기전, 동반손상 및 합병증을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 해부\n종골은 족근골 중 가장 큰 뼈이며 거골과 함께 거골하관절을 이룬다.\n\nⅡ. 손상기전\n높은 곳에서 떨어져 발꿈치로 착지하는 추락 손상이 대표적이며 축성 압박력이 작용한다.\n\nⅢ. 동반손상\n약 10퍼센트에서 척추의 압박골절을 동반하므로 척추 촬영을 함께 시행하여야 한다. 반대측 종골 골절, 골반 골절도 확인한다.\n\nⅣ. 진단\n단순방사선과 함께 전산화단층촬영으로 관절면의 침범과 분쇄 정도를 확인한다.\n\nⅤ. 치료\n관절외 골절이거나 전위가 심하지 아니하면 부목이나 석고로 6주에서 8주간 고정한다. 관절내 골절은 해부학적 복원과 조기 관절운동을 목표로 관혈적 정복 및 내고정을 시행한다.\n\nⅥ. 합병증\n1. 급성 — 구획증후군, 피부 괴사, 감염, 비복신경 손상\n2. 만성 — 관절강직, 거골하관절의 외상성 관절염, 갈퀴족지 변형\n3. 외상성 관절염이 심하면 거골하관절 유합술을 시행한다.\n\nⅦ. 결론\n종골 골절은 관절내 침범 여부가 예후를 결정하며, 추락 기전에서는 척추 손상의 동반을 반드시 확인하여야 한다.`},
      {q:"족관절 외측 인대의 구성과 손상의 기전, 치료를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 외측 인대의 구성\n1. 전거비인대\n2. 종비인대\n3. 후거비인대\n\nⅡ. 손상기전\n발목이 내번되면서 저굴되는 동작에서 발생하며, 내반력이 작용한다. 손상은 전거비인대에서 먼저 일어나고 이어서 종비인대가 손상된다.\n\nⅢ. 진단\n1. 전방전위 검사와 내반부하 검사로 불안정성을 확인한다.\n2. 부하 방사선촬영으로 거골의 경사각과 전방전위를 건측과 비교한다.\n3. 초음파와 자기공명영상으로 인대 손상을 확인한다.\n\nⅣ. 치료\n급성기에는 보호, 안정, 냉찜질, 압박, 거상의 원칙에 따라 보존적으로 치료한다. 급성 손상의 10퍼센트에서 30퍼센트가 만성 불안정증으로 진행하며, 6주 이상 치료하여도 증상이 지속되면 Brostrom 술식 또는 변형 Brostrom 술식을 고려한다.\n\nⅤ. 손해사정에서의 의의\n족관절의 동요는 부하 방사선으로 계측하며, 반복 염좌의 기왕력이 있으면 기여도를 검토하여야 한다.\n\nⅥ. 결론\n전거비인대가 가장 먼저 손상된다는 점과 만성 불안정증으로의 이행 가능성이 핵심이다.`},
      {q:"골반 골절의 합병증을 설명하고, 심부정맥혈전증의 진단과 예방을 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 골반 골절의 합병증\n1. 혈관 손상에 의한 과다출혈과 출혈성 쇼크 — 사망의 주된 원인이다.\n2. 방광과 요도 등 비뇨생식기 손상\n3. 직장과 S결장의 손상\n4. 좌골신경총의 손상\n5. 부정유합과 하지 부동\n6. 심부정맥혈전증과 폐색전증\n혈행이 풍부하여 지연유합이나 불유합은 잘 발생하지 아니한다.\n\nⅡ. 심부정맥혈전증의 위험인자\n고령, 장시간 또는 반복된 수술, 긴 고정기간, 활동력의 감소, 골절의 정도가 큰 경우, 비만, 악성종양, 심한 전신질환\n\nⅢ. 증상과 진단\n증상은 비특이적이어서 하지의 통증, 부종, 압통, 온감이 나타난다. 진단은 도플러 초음파가 일차적이며 정맥조영술과 혈액검사를 병행한다.\n\nⅣ. 예방\n1. 조기 보행과 발목의 굴신운동\n2. 압박스타킹과 간헐적 공기압박장치\n3. 예방적 항응고요법\n\nⅤ. 폐색전증\n혈전이 유리되어 폐동맥을 폐색하면 갑작스러운 호흡곤란, 흉통, 빈맥, 실신이 나타나며 확진 전에 사망하는 경우가 많다. 입원 후 24시간에서 48시간의 침상안정과 항응고 치료를 하고 재발 위험이 높으면 하대정맥 필터를 고려한다.\n\nⅥ. 결론\n골반 골절의 사망 원인은 출혈이고 후기의 위험은 혈전이므로, 초기에는 출혈을 후기에는 혈전을 관리하여야 한다.`},
      {q:"퇴행성 관절염의 단순 방사선 소견을 5가지 기술하고, 위험인자와 수술적 치료를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 단순 방사선 소견\n1. 관절 간격의 협소\n2. 연골하골의 경화\n3. 골극의 형성\n4. 연골하 낭종\n5. 관절면의 변형과 관절의 아탈구\n6. 내반 또는 외반 변형\n\nⅡ. 위험인자\n1. 고령\n2. 여성\n3. 비만\n4. 관절에 부담을 주는 직업이나 반복적 하중\n5. 관절내 골절이나 반월상 연골 절제 등 외상의 기왕력\n6. 유전적 소인\n7. 하지 정렬의 이상\n\nⅢ. 수술적 치료\n1. 관절경적 변연절제술과 세척\n2. 근위 경골 절골술 — 하중선을 이동시켜 내측 구획의 부하를 줄인다.\n3. 인공관절 부분치환술\n4. 인공관절 전치환술\n5. 관절 유합술 — 통증은 해소되나 운동이 소실된다.\n\nⅣ. 손해사정에서의 의의\n방사선에서 위 소견이 확인되면 퇴행성 변화가 기왕에 존재한 것이므로, 사고의 기여도를 별도로 판단하여야 한다.\n\nⅤ. 결론\n관절 간격 협소, 연골하골 경화, 골극, 낭종의 네 가지가 진단의 핵심 소견이다.`},
      {q:"대퇴골 근위부 골절을 부위별로 나누어 특징과 합병증을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 대퇴 경부 골절\n1. 특징 — 골다공증이 있는 노령에서 대전자 부위의 측면 충돌로 발생하며, 자연골절이나 장거리 주자와 군인의 피로골절로도 발생한다.\n2. 합병증 — 관절낭 내 골절이므로 혈행이 차단되어 무혈성 괴사와 불유합이 문제된다.\n3. 치료 — 젊은 환자는 응급으로 내고정하고, 고령이거나 전위가 심하면 인공관절 치환술을 시행한다.\n\nⅡ. 전자간 골절\n1. 특징 — 경부 골절보다 더 고령이고 골다공증이 심한 여성에게 많으며 더 강한 외력이 필요하다.\n2. 합병증 — 혈행이 풍부하여 지연유합, 불유합, 무혈성 괴사는 드물다. 대신 내반 변형과 하지의 외회전 변형이 남는다.\n3. 치료 — 골수강 내 금속정이나 압박고 나사로 내고정한다.\n\nⅢ. 전자하 골절\n1. 특징 — 다발성 외상 환자에게 흔하고 교통사고와 산업재해가 원인이며, 원발암이나 전이암에 의한 병적골절도 고려한다.\n2. 합병증 — 심부정맥혈전증, 폐색전증, 폐렴, 비뇨기계 감염\n\nⅣ. 공통 치료원칙\n수상 후 신속히 수술하고 조기에 운동을 시작하여 와상으로 인한 합병증을 예방한다.\n\nⅤ. 결론\n경부는 무혈성 괴사, 전자간은 변형, 전자하는 전신 합병증이 각각의 초점이다.`},
      {q:"슬개골 골절의 손상기전과 치료방침을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 해부\n슬개골은 인체에서 가장 큰 종자골로 대퇴사두근의 힘을 경골로 전달하는 도르래 역할을 한다.\n\nⅡ. 손상기전\n1. 직접 손상 — 계기판 충돌이나 낙상으로 무릎 앞부분을 직접 부딪히는 경우로 분쇄골절이 많다.\n2. 간접 손상 — 대퇴사두근의 갑작스러운 수축으로 견열되어 횡골절이 발생한다.\n\nⅢ. 치료\n1. 비전위 골절이거나 골편의 전위가 1밀리미터에서 2밀리미터 이내이고 신전기전이 보존된 경우에는 부목이나 석고로 고정하고 6주에서 8주 후부터 체중부하를 시작한다.\n2. 전위가 3밀리미터 이상이거나 관절면의 단차가 있는 경우에는 8자형 강선 결박술이나 나사 고정술을 시행한다.\n3. 심한 분쇄로 재건이 불가능하면 슬개골 부분 또는 전 적출술을 시행한다.\n\nⅣ. 합병증\n슬개대퇴관절의 외상성 관절염, 대퇴사두근의 위약, 슬관절 운동제한, 신전 지연\n\nⅤ. 결론\n신전기전의 보존 여부와 전위의 정도가 치료방침을 결정하며, 적출술을 시행한 경우에는 신전력 저하가 장해로 남는다.`},
      {q:"경골 간부 골절의 특징과 합병증을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 특징\n1. 외상에 의한 장골 골절 중 가장 흔한 골절이다.\n2. 경골의 전내측은 피하에 위치하여 연부조직과 골막이 얇고 혈액공급이 좋지 아니하다.\n3. 그 결과 개방성 골절이 흔하고 치유가 지연되기 쉽다.\n\nⅡ. 골절의 유형\n횡골절, 사선골절, 나선골절, 분쇄골절, 개방성 골절로 나뉜다. 나선골절은 염전력에 의하며 골절선이 길고 끝이 예각이며 접촉면이 넓다.\n\nⅢ. 합병증\n1. 구획증후군 — 하퇴부에 호발한다.\n2. 개방성 골절에 따른 감염과 골수염\n3. 지연유합과 불유합\n4. 골 결손에 의한 단축\n5. 부정유합에 의한 각변형과 회전변형\n6. 심부정맥혈전증\n\nⅣ. 손해사정에서의 의의\n단축이 2센티미터 이상이면 기능장해가 문제되며, 계측은 스캐노그램으로 건측과 비교하여 전상장골극에서 경골 내과 끝까지의 극과간격을 측정한다.\n\nⅤ. 결론\n경골 간부 골절은 연부조직의 상태가 예후를 결정하므로 개방성 여부와 감염의 경과를 확인하여야 한다.`}

       a:`Ⅰ. 삼과 골절의 의의\n족관절을 이루는 세 개의 과가 모두 골절된 것을 말한다.\n\nⅡ. 골절이 발생한 뼈\n1. 내과 — 경골의 내측 과\n2. 외과 — 비골의 원위단\n3. 후과 — 경골의 후방 과\n따라서 골절된 뼈는 경골과 비골이며, 경골에서 내과와 후과가, 비골에서 외과가 골절된 것이다.\n\nⅢ. 치료방법\n삼과 골절은 족관절의 안정성을 담당하는 구조가 모두 파괴되어 매우 불안정하고 관절면을 침범하므로, 관혈적 정복 및 내고정술을 시행한다. 내과와 외과는 나사와 금속판으로 고정하고 후과는 골편의 크기가 관절면의 일정 비율을 넘으면 고정한다. 원위 경비인대 결합이 파열되면 결합 나사를 추가한다.\n\nⅣ. 합병증\n외상성 관절염, 관절강직, 부정유합\n\nⅤ. 결론\n삼과 골절은 해부학적 정복이 필수이며, 관절면의 정복 정도가 외상성 관절염의 발생을 결정한다.`},

       a:`Ⅰ. 관절의 이름\n1. ① 천장관절(sacroiliac joint) — 후방에서 두 개의 무명골이 천골과 이루는 관절\n2. ② 치골결합(pubic symphysis) — 전방에서 양측 무명골이 이루는 결합\n\nⅡ. 무명골을 이루는 세 개의 뼈\n3. ③ 장골(ilium)\n4. ④ 좌골(ischium)\n5. ⑤ 치골(pubis)\n\nⅢ. 임상적 의의\n1. 골반은 고리 모양의 구조이므로 한 부분이 골절되면 다른 지점에서도 골절이나 인대 손상이 발생한다.\n2. 천장관절이나 치골결합이 분리된 상태로 치유되면 골반뼈의 뚜렷한 기형으로 평가된다.\n3. 좌골이 2.5센티미터 이상 분리된 부정유합도 뚜렷한 기형에 해당한다.\n\nⅣ. 결론\n골반의 해부는 장해평가의 기준과 직결되므로 관절의 명칭과 뼈의 명칭을 정확히 기재하여야 한다.`},

      {r:47,u:"m3",t:"퇴행성 관절염의 단순 방사선 소견을 5가지 기술하시오. (10점)", ref:"m3#6"},
      {r:47,u:"m3",t:"파행(limping gait)이란 비대칭적 보행을 말한다. 원인을 5가지 열거하시오. (10점)",
       a:`Ⅰ. 의의\n파행은 좌우 하지의 보행 주기가 비대칭적으로 나타나는 보행 이상을 말한다.\n\nⅡ. 원인\n1. 동통성 파행 — 통증이 있는 쪽의 입각기를 짧게 하는 보행으로, 관절염, 골절, 감염, 종양이 원인이다.\n2. 하지 부동에 의한 파행 — 골절 후 단축, 성장판 손상에 따른 성장장애\n3. 근력 약화에 의한 파행 — 중둔근 약화에 의한 트렌델렌버그 보행, 대퇴사두근 약화에 의한 무릎 꺾임\n4. 관절 강직과 구축에 의한 파행 — 고관절, 슬관절, 족관절의 운동제한\n5. 신경학적 원인에 의한 파행 — 비골신경 마비에 의한 계상 보행, 척수 손상에 의한 경직성 보행, 소아마비\n6. 선천성 또는 소아기 질환 — 발달성 고관절 이형성증, 대퇴골두 골단분리증, 페르테스병\n7. 강직성 파행 — 관절 유합술 후\n\nⅢ. 손해사정에서의 의의\n파행의 원인에 따라 장해의 평가 항목이 달라지며, 하지 단축은 계측으로, 근력 약화는 도수근력검사로, 관절 구축은 운동범위 측정으로 평가한다.\n\nⅣ. 결론\n통증, 길이, 근력, 관절, 신경의 다섯 축으로 나누어 답하면 요구 개수를 안정적으로 채울 수 있다.`},
      {r:41,u:"m3",t:"유아 및 소아에서 발생하는 고관절 이상의 질병적 원인에 대하여 기술하시오. (10점)",
       a:`Ⅰ. 개요\n유아와 소아의 고관절 이상은 일시적인 것도 있으나 질환에 따라 영구적인 후유증을 남기므로 원인의 감별이 중요하다.\n\nⅡ. 질병적 원인\n1. 발달성 고관절 이형성증 — 출생 전후에 비구와 대퇴골두의 관계가 정상적으로 형성되지 못한 상태로, 조기 진단과 치료가 예후를 좌우한다.\n2. 일과성 고관절 활액막염 — 소아기에 가장 흔한 고관절 통증의 원인으로 바이러스 감염 후에 발생하며 대개 자연 호전된다.\n3. 화농성 고관절염 — 응급질환으로 발열과 심한 통증을 동반하며 즉시 배농하지 아니하면 관절이 파괴된다.\n4. 레그-칼베-페르테스병 — 대퇴골두의 특발성 무혈성 괴사로 4세에서 8세 남아에게 호발한다.\n5. 대퇴골두 골단분리증 — 사춘기의 비만한 남아에서 성장판을 따라 골두가 미끄러지는 질환이다.\n6. 결핵성 고관절염\n7. 소아 류마티스 관절염\n8. 신경근육성 질환에 따른 고관절 아탈구 — 뇌성마비 등\n\nⅢ. 감별의 방법\n연령, 발열의 유무, 혈액검사의 염증 수치, 단순방사선과 초음파, 자기공명영상을 종합한다.\n\nⅣ. 결론\n일과성 활액막염과 화농성 관절염의 감별이 가장 중요하며, 페르테스병과 골단분리증은 영구적 변형을 남길 수 있다.`}
    ]
  },

      {h:"척추의 해부 — 먼저 숫자부터", freq:F(3,[43,45]),
       body:`<ul><li><b>경추 7개</b> — 굴곡·<b>신전</b>·외측굴곡·<b>회전</b>이 가능하다. <b>제1경추는 환추(atlas)</b>로 추체와 극돌기가 없는 고리 모양, <b>제2경추는 축추(axis)</b>로 <b>치돌기</b>가 있다.</li>
       <li><b>흉추 12개</b> — 늑골과 관절하여 <b>흉곽</b>을 이룬다. 운동범위가 가장 작다.</li>
       <li><b>요추 5개</b> — 가장 크고 하중을 받는다.</li>
       <li><b>천추 5개(융합), 미추 3~5개(융합)</b></li>
       <li><b>신경근 31쌍</b> — 경추 8쌍, 흉추 12쌍, 요추 5쌍, 천추 5쌍, 미추 1쌍</li>
       <li><b>척수</b>는 <b>후두공에서 제1~2요추 추간판 사이</b>까지. 그 아래는 <b>마미신경총</b>이다.</li></ul>
       <div class="why"><span class="h">체간골이란 (43회 출제)</span>
       <b>흉곽과 척추체</b>로 이루어진다. 흉곽은 <b>흉골 + 늑골 12쌍 + 흉추 12개</b>, 척추체는 경추·흉추·요추·천추·미추.<br>
       기능은 ① <b>내부 장기의 보호</b> ② <b>몸의 지지와 자세 유지</b> ③ <b>조혈</b>과 무기질 저장 ④ 호흡운동에의 관여.</div><div class="qfig"><div class="qrd">기출 예상 (45회 9번 빈칸형 변형)</div><div class="qt">척추의 분절 — 부위·개수·척수의 끝</div><div class="qq">(1) ①~⑤ 각 부위의 <b>명칭과 뼈의 개수</b>를 쓰시오.<br>

    (3) 압박골절이 가장 흔히 발생하는 부위(이행부)를 쓰시오.</div><svg viewBox="0 0 560 430" role="img" aria-label="척추 분절 문제 그림">

      {h:"Denis 삼주론 — 불안정성을 가르는 기준", freq:F(3,[43,44]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>주</th><th>포함 구조</th></tr>
       <tr><td><b>전주</b></td><td>전종인대, 추체의 <b>전방 2/3</b>, 추간판의 전방부</td></tr>
       <tr><td><b>중주</b></td><td>추체의 <b>후방 1/3</b>, 추간판의 후방부, <b>후종인대</b></td></tr>
       <tr><td><b>후주</b></td><td>후방 골성 구조(추궁, 관절돌기, 극돌기)와 후방 인대복합체(황색인대, 극간인대, 극상인대, 관절낭)</td></tr>
       </table></div>
       <div class="warn"><b>두 개 이상의 주가 손상되면 불안정</b>하다고 본다. <b>중주</b>가 손상되었는지가 가장 중요한 판단 기준이다.</div>
       <p><b>흉·요추 골절의 4유형</b></p>
       <ul><li><b>쐐기 압박골절</b> — <b>전주만</b> 손상. <b>척추골절 중 가장 흔하다.</b> 신경학적 이상은 거의 없다.</li>
       <li><b>방출성 골절</b> — 전주 + 중주. 안정형은 후방구조가 유지된 것, <b>불안정형</b>은 후주까지 파열되어 후만변형과 진행성 신경증상이 온다.</li>
       <li><b>Chance 골절(굴곡신연 손상)</b> — <b>안전띠 손상</b>. 전방 추체에서 후방 극돌기까지 <b>수평으로 찢어진다</b>.</li>
       <li><b>전이성(골절-탈구)</b> — <b>삼주 모두</b> 손상. 신경학적 손상 빈도가 가장 높다.</li></ul>
       <p><b>경추 손상</b></p>
       <ul><li><b>상위 경추(C1·C2)</b> — 후두골-환추 탈구(경추손상의 0.1%, <b>사망률 80%</b>, 척수손상 동반 시 100%), 환추 골절(제퍼슨 골절; 수직 압박, <b>약 50%에서 다른 경추 손상 동반</b>, <b>개구 촬영</b>으로 진단), <b>교수형 골절</b>(축추 양측 척추궁 협부 골절), <b>치돌기 골절</b>(제1형 상부, 제2형 경계부, 제3형 추체)</li>
       <li><b>하위 경추(C3~C7)</b> — 6가지 손상기전 중 <b>신연굴곡 손상이 가장 흔하다</b>(C5~6, C6~7의 전방탈구). <b>신연신전 손상</b>은 고령에서 안면부터 넘어질 때 발생하고 <b>중심성 척수증후군</b>이 호발한다(상지가 하지보다 더 약해진다).</li></ul><figure class="dg"><div class="dgt">Denis 삼주론 — 척추를 세 기둥으로 나눈다</div><svg viewBox="0 0 520 250" role="img" aria-label="Denis 삼주론">

       mnemo:{key:"전 · 중 · 후 / 쐐 · 방 · 챈 · 전이", how:"삼주론 — 추체를 <b>앞 2/3(전주)</b>와 <b>뒤 1/3(중주)</b>로 자르고, 뒤쪽 구조가 <b>후주</b>.<br>흉요추 골절 4종 — <b>쐐</b>기 · <b>방</b>출성 · <b>챈</b>스 · <b>전이</b>성. 손상되는 주가 1 → 2 → 2 → 3으로 늘어난다."}},

      {h:"압박골절 — 진단과 계측", freq:F(3,[43,44]),
       body:`<ul><li><b>1차 진단 영상 2가지 — X-ray와 CT</b></li>
       <li><b>급성과 만성(진구성)을 감별하는 영상 2가지 — MRI와 Bone Scan</b></li>
       <li><b>가장 호발하는 부위 — 흉요추 이행부(T11~L2)</b>. 그 밖에 중부 흉추, 하부 요추</li></ul>
       <div class="why"><span class="h">왜 흉요추 이행부인가</span>
       고정된 흉추(늑골이 붙어 있다)와 움직이는 요추가 만나는 지점이라 <b>응력이 집중</b>된다. 종골 골절이나 추락 사고에서 함께 확인해야 하는 이유다.</div>
       <p><b>변형각 측정 2가지 (44회 출제)</b></p>
       <div class="scroller"><table class="mini">

      {h:"추간판탈출증과 신경근병증", freq:F(3,[47]),
       body:`<ul><li><b>방향별 빈도 — 후측방 &gt; 중앙 &gt; 내측 &gt; 측방</b></li>
       <li><b>부위별 빈도 — 요추 &gt; 경추 &gt; 흉추</b></li></ul>
       <p><b>요추 신경근병증</b> — 허리를 구부릴 때·앉아 있을 때 악화되고 <b>기침·재채기에 악화</b>된다. 방사통, 하지 위약, 파행.</p>
       <p><b>경추 신경근병증</b> — 견갑골 내측으로 방사되고 두통으로 퍼진다. <b>경부 통증 없이 방사통만</b> 있는 경우도 많다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>신경근</th><th>근력 약화</th><th>감각 이상</th><th>반사</th></tr>
       <tr><td><b>L4</b></td><td>전경골근(족배굴곡)</td><td>하퇴 내측</td><td>슬개건반사 감소</td></tr>
       <tr><td><b>L5</b></td><td><b>장족무지신근</b>(엄지 들기)</td><td><b>제1족지 배부</b>·족배부</td><td>정상</td></tr>
       <tr><td><b>S1</b></td><td>비복근(까치발)</td><td>족부 외측·발바닥</td><td>아킬레스건반사 감소</td></tr>
       </table></div>
       <div class="warn">47회가 <b>"장족무지신근 약화 + 제1족지 배부 감각이상"</b>을 주고 이환 부위와 압박 신경근을 물었다. 답은 <b>제4-5요추간 추간판탈출증, 제5요추 신경근 압박</b>이다. 이 표 한 줄이 그대로 10점이다.</div>
       <p><b>신경학적 검사</b></p>
       <ul><li><b>하지직거상검사(SLRT)</b> — 정상은 <b>70도 이상</b>, 추간판탈출증은 <b>35~70도</b>에서 방사통. 하부 요추(L4·L5·S1) 병변을 시사</li>
       <li><b>라세그 징후</b> — SLRT 양성 각도에서 족배굴곡을 더하면 통증이 심해진다</li>
       <li><b>활시위 징후</b>, <b>Spurling 검사</b>·<b>Jackson 검사</b>(경추: 머리를 신전·측굴·압박하면 방사통)</li></ul>
       <p><b>마미증후군</b> — 요천추 신경근의 다발성 압박. 편측성 심한 신경근 통증, <b>회음부·항문 주위 통증</b>, 비대칭적 하지마비와 감각소실, <b>배뇨·배변 장애는 비교적 나중에</b> 나타난다. <b>응급수술을 요하는 대표 질환</b>이다.</p>`,
       mnemo:{key:"L5는 엄지", how:"<b>L5</b>가 눌리면 <b>엄지발가락</b>이 안 들리고 <b>엄지 등쪽</b>이 저리다.<br>L4는 <b>무릎반사</b>, S1은 <b>아킬레스반사</b>. 반사가 없는 쪽이 L4·S1, 반사가 멀쩡하면 L5."}},

      {h:"척수 손상과 평가", freq:F(2,[48]),
       body:`<p><b>완전손상과 불완전손상</b> — 손상부위 이하의 운동·감각이 <b>완전히</b> 소실되면 완전손상이다.</p>
       <div class="warn"><b>항문 검사가 결정적이다.</b> 다른 모든 소견이 완전마비라도 <b>제4·5천수 분절의 감각(항문 주위 감각)이 보존</b>되어 있으면 <b>불완전 손상</b>으로 분류한다. 항문 주위 감각(항문반사), 직장 괄약근의 수의수축(구해면체반사), 모지 굴곡(족저반사)을 확인한다.</div>
       <p><b>척수 원추 증후군</b> — <b>제12흉추~제2요추</b> 사이의 손상. <b>하지 운동장애는 없으면서</b> 항문반사 감소, 회음부 이완성 마비, 배뇨·배변 및 성기능 장애가 나타난다.</p>
       <p><b>중심성 척수증후군</b> — 고령의 신연신전 손상에서 호발. <b>상지가 하지보다 더 약해진다.</b></p>
       <p><b>평가도구</b></p>
       <ul><li><b>ASIA scale</b> — 신경학적 검사, 운동 근력 평가, 호흡운동 관찰</li>
       <li><b>도수근력검사(MMT)</b> — 6단원에서 자세히 본다</li>
       <li><b>지각 평가</b> — Pin prick test(통각), Light touch test(촉각)</li></ul>
       <p><b>후종인대 골화증(OPLL)</b> — <b>40세 이후</b>, 주로 경추(<b>90% 이상</b>)에 발생하며 <b>C5에 가장 많고</b> C4·C6 순이다. 서서히 진행하여 척추관의 <b>50~60%까지 협착되어도</b> 신경증상 없이 지낼 수 있다. 질병성 병변이므로 <b>기왕증 기여도</b>의 대표 논점이다.</p>`,
       mnemo:{key:"항문이 살아 있으면 불완전", how:"척수손상 평가의 한 줄. 팔다리가 다 마비여도 <b>항문 주위 감각</b>이 남아 있으면 <b>불완전 손상</b>이고 회복 가능성이 있다."}}
    ],
    cards:[

    quiz:[
      {q:"Denis의 삼주론을 설명하고, 흉요추부 골절의 유형과 안정성 판단을 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 삼주론\n척추를 시상면에서 세 개의 주로 나누어 안정성을 판단하는 이론이다.\n1. 전주 — 전종인대, 추체의 전방 3분의 2, 추간판의 전방부\n2. 중주 — 추체의 후방 3분의 1, 추간판의 후방부, 후종인대\n3. 후주 — 추궁, 관절돌기, 극돌기 등 후방 골성 구조와 황색인대, 극간인대, 극상인대, 관절낭으로 이루어진 후방 인대복합체\n\nⅡ. 안정성의 판단\n두 개 이상의 주가 손상되면 불안정한 것으로 보며, 특히 중주의 손상 여부가 핵심적인 기준이 된다.\n\nⅢ. 흉요추부 골절의 유형\n1. 쐐기 압박골절 — 전주만 손상되며 척추골절 중 가장 흔하고 신경학적 이상은 거의 없다.\n2. 방출성 골절 — 전주와 중주가 손상된다. 후방구조가 유지되면 안정형이고, 후주까지 파열되면 불안정형으로 후만변형과 진행성 신경증상을 보인다.\n3. 굴곡신연 손상 — 안전띠 손상이라고도 하며 전방 추체에서 후방 극돌기까지 수평으로 견열된다.\n4. 골절-탈구 — 삼주가 모두 손상되며 신경학적 손상의 빈도가 가장 높다.\n\nⅣ. 임상적 의의\n불안정 골절은 수술적 고정이 필요하며, 유합한 척추체의 개수가 척추 운동장해의 평가기준이 된다.\n\nⅤ. 결론\n손상된 주의 수가 곧 불안정성이며, 그것이 치료방침과 장해의 정도를 결정한다.`},
      {q:"척추 압박골절의 진단에 사용하는 영상검사와 호발 부위를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 일차적 진단 영상\n1. 단순방사선촬영 — 추체 높이의 감소와 후만변형을 확인한다.\n2. 전산화단층촬영 — 후방 피질골의 침범 여부와 골편의 척추관 내 전위를 확인한다.\n\nⅡ. 급성과 진구성 골절의 감별\n1. 자기공명영상 — 골수 부종의 유무로 급성 여부를 판단하며 신경조직의 압박도 함께 본다.\n2. 골스캔 — 섭취 증가로 급성 병변을 확인한다.\n이 감별은 사고와의 인과관계 판단에 직결된다.\n\nⅢ. 호발 부위\n1. 가장 호발하는 부위는 흉요추 이행부로 제11흉추부터 제2요추 사이이다. 고정된 흉추와 가동성이 큰 요추가 만나 응력이 집중되기 때문이다.\n2. 그 밖에 중부 흉추와 하부 요추에도 흔히 발생한다.\n\nⅣ. 변형의 계측\n1. Cobb's angle은 인접 추체를 포함하여 측정하며 측정자 간과 측정자 내의 일치도가 가장 우수하다.\n2. 국소 후만각은 골절된 추체만 측정하며 자세에 따른 차이가 적으나 관찰자 간 변이가 크다.\n3. 압박률은 손상 추체의 높이를 인접 정상 추체와 비교하여 산출한다.\n\nⅤ. 결론\n압박골절은 급성 여부의 감별과 변형의 계측이 손해사정의 핵심이므로 MRI와 계측방법의 선택을 확인하여야 한다.`},
      {q:"요추 추간판탈출증에서 신경근별 임상소견을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 개요\n탈출된 추간판이 신경근을 압박하면 해당 신경근이 지배하는 근력, 감각, 반사에 이상이 나타난다. 방향별로는 후측방 탈출이 가장 흔하다.\n\nⅡ. 신경근별 소견\n1. 제4요추 신경근 — 전경골근의 약화로 족배굴곡이 약해지고, 하퇴 내측의 감각이상이 있으며 슬개건반사가 감소한다. 제3-4요추간 병변에서 흔하다.\n2. 제5요추 신경근 — 장족무지신근의 약화로 엄지발가락을 들어올리기 어렵고, 제1족지 배부와 족배부의 감각이상이 있으며 심부건반사는 정상이다. 제4-5요추간 병변에서 흔하다.\n3. 제1천추 신경근 — 비복근의 약화로 까치발이 어렵고, 족부 외측과 발바닥의 감각이상이 있으며 아킬레스건반사가 감소한다. 제5요추-제1천추간 병변에서 흔하다.\n\nⅢ. 신경학적 검사\n하지직거상검사는 정상이 70도 이상이며 35도에서 70도 사이에서 방사통이 유발되면 하부 요추 신경근의 압박을 시사한다. 라세그 징후와 활시위 징후를 함께 확인한다.\n\nⅣ. 마미증후군\n다발성 신경근이 압박되면 회음부 감각소실과 배뇨·배변 장애가 나타나며 응급수술의 대상이 된다.\n\nⅤ. 결론\n근력, 감각, 반사의 세 축을 신경근별로 대응시키는 것이 이 문제의 답이다.`},
      {q:"경추 골절 중 상위 경추 손상의 유형을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 상위 경추의 범위\n제1경추인 환추와 제2경추인 축추를 말하며, 해부학적 특성과 손상 양상이 하위 경추와 다르다.\n\nⅡ. 손상의 유형\n1. 후두골-환추 탈구 — 경추손상의 0.1퍼센트에 불과하나 사망률이 80퍼센트에 이르고 척수손상이 동반되면 거의 전부가 사망한다. 대부분 보행자 교통사고이다.\n2. 환추 골절 — 두부에 수직 압박이 가해질 때 고리가 여러 곳에서 파열되며 제퍼슨 골절이라 한다. 약 50퍼센트에서 다른 경추의 손상을 동반한다. 개구 촬영이나 전산화단층촬영으로 진단한다.\n3. 교수형 골절 — 축추의 양측 척추궁 협부가 골절되어 척추궁과 추체부가 분리되는 손상으로 축추 외상성 전위증이라고도 한다. 최근에는 고속 추돌, 추락, 다이빙 사고가 원인이다.\n4. 치돌기 골절 — 대부분 교통사고로 발생하며 제1형은 치상돌기 상부, 제2형은 치상돌기와 추체의 경계부, 제3형은 추체를 침범한다. 제2형은 불유합이 많다.\n\nⅢ. 치료\n전위가 경미하면 경추보조기나 할로베스트로 외고정하고, 불안정하거나 유합이 되지 아니하면 환축추 유합술을 시행한다.\n\nⅣ. 결론\n상위 경추 손상은 생명과 직결되므로 초기 영상검사의 범위와 고정의 적정성이 검토 대상이 된다.`},
      {q:"척수손상에서 완전손상과 불완전손상을 구별하는 방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 구별의 실익\n불완전손상은 회복의 가능성이 있으나 완전손상은 그러하지 아니하므로, 예후와 장해의 평가가 달라진다.\n\nⅡ. 구별의 기준\n손상 부위 이하의 운동기능과 감각기능이 완전히 소실되었으면 완전손상이고, 일부라도 보존되어 있으면 불완전손상이다.\n\nⅢ. 항문 검사의 중요성\n1. 제4천수와 제5천수 분절의 감각이 보존되어 있는지를 확인한다.\n2. 다른 모든 소견이 완전마비를 시사하더라도 항문 주위의 감각이 보존되어 있으면 불완전손상으로 분류한다.\n3. 구체적으로 항문 주위 감각의 보존, 직장 괄약근의 수의수축, 모지의 굴곡을 확인한다.\n\nⅣ. 불완전손상의 유형\n중심성 척수증후군은 상지가 하지보다 더 심하게 마비되며 고령의 신연신전 손상에서 호발한다. 척수 원추 증후군은 제12흉추와 제2요추 사이의 손상으로 하지 운동장애 없이 회음부의 이완성 마비와 배뇨·배변 장애를 보인다.\n\nⅤ. 평가도구\nASIA scale에 따른 신경학적 검사, 도수근력검사, 통각과 촉각의 지각 평가를 사용한다.\n\nⅥ. 결론\n항문 주위 감각의 보존 여부가 완전과 불완전을 가르는 결정적 소견이다.`},
      {q:"척추 변형각의 측정방법 두 가지를 비교하여 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. Cobb's angle\n1. 측정방법 — 골절된 추체의 상방 인접 추체의 상연과 하방 인접 추체의 하연을 잇는 선을 긋고 각각에 수직선을 그어 만나는 각을 측정한다.\n2. 임상적 의의 — 척추체 골절에 의한 후만변형을 인접 분절을 포함하여 평가하므로 실제의 전체 만곡을 잘 반영한다.\n3. 장점 — 측정자 간과 측정자 내의 일치도가 가장 우수하고 기준선의 설정이 용이하다.\n\nⅡ. 국소 후만각\n1. 측정방법 — 골절된 추체의 상연과 하연만을 기준으로 각을 측정한다.\n2. 임상적 의의 — 골절된 추체 자체의 변형을 반영한다.\n3. 특징 — 누워서 촬영한 것과 서서 촬영한 것의 차이가 가장 적으나 관찰자 간 변이가 크다.\n\nⅢ. 압박률\n손상 추체의 전방 높이를 인접한 정상 추체의 전방 높이와 비교하여 감소한 비율로 산출하며, 상하 인접 추체의 평균과 비교하는 방법이 가장 일반적이고 합리적이어서 권장된다.\n\nⅣ. 손해사정에서의 의의\n기형장해의 지급률은 만곡의 각도 또는 압박률을 기준으로 하므로, 어느 방법으로 측정하였는지를 명시하여야 한다.\n\nⅤ. 결론\n두 방법은 측정 범위가 다르므로 결과가 달라질 수 있으며, 기준의 선택이 곧 장해의 정도를 좌우한다.`},
      {q:"체간골을 구성하는 뼈와 그 기능을 설명하시오. (10점)", pts:10, lik:2,

      {q:"척추전방전위증의 정의, 원인, 호발부위 및 수술적응을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 정의\n상위 척추체가 하위 척추체에 대하여 전방으로 전위된 상태를 말한다.\n\nⅡ. 가장 흔한 원인\n1. 협부형 — 척추 협부의 결손 또는 피로골절에 의한 것\n2. 퇴행성 — 추간판과 후관절의 퇴행성 변화로 분절이 불안정해져 발생하는 것\n그 밖에 선천성, 외상성, 병적 원인이 있다.\n\nⅢ. 호발부위\n제4요추와 제5요추 사이, 제5요추와 제1천추 사이에 주로 발생한다.\n\nⅣ. 증상\n요통과 하지 방사통, 보행 시 악화되는 신경인성 파행, 심한 경우 마미증후군\n\nⅤ. 수술을 고려하는 경우\n1. 보존적 치료에도 증상이 지속되는 경우\n2. 신경학적 결손이 진행하는 경우\n3. 마미증후군이 동반된 경우\n4. 소아에서 전위가 100분의 33을 넘어 진행하는 경우\n5. 소아에서 처음 진단 시 전위가 100분의 50을 넘는 경우\n\nⅥ. 결론\n전위의 정도와 진행 여부, 신경증상의 유무가 수술 여부를 결정하며, 퇴행성 원인이 확인되면 기왕증 기여도를 검토하여야 한다.`},
      {q:"후종인대 골화증에 관하여 설명하고, 손해사정에서의 쟁점을 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n척추체의 후방을 지나는 후종인대가 골화되어 척추관을 좁히고 척수를 압박하는 질환이다.\n\nⅡ. 역학\n1. 40세 이후에 주로 발생한다.\n2. 경추에 발생하는 경우가 전체의 90퍼센트 이상이며 제5경추에 가장 많고 제4경추와 제6경추가 그 다음이다.\n\nⅢ. 임상 경과\n서서히 진행하여 척추관이 50퍼센트에서 60퍼센트까지 좁아져도 신경증상 없이 지내는 경우가 있다. 따라서 경미한 외상으로도 갑자기 척수증이 발현할 수 있다.\n\nⅣ. 증상\n사지의 저림과 위약, 보행장애, 세밀한 손동작의 장애, 진행하면 사지마비와 배뇨장애\n\nⅤ. 손해사정에서의 쟁점\n1. 기왕의 질병성 병변이므로 사고와의 인과관계와 기여도가 문제된다.\n2. 경미한 외력으로 척수증이 발현한 경우 사고는 유발요인에 그치고 기왕증의 기여도가 크게 평가될 수 있다.\n3. 판단 자료는 영상에서의 골화 범위와 척추관 협착률, 사고의 기전과 외력의 정도, 사고 전 증상의 존부이다.\n\nⅥ. 결론\n후종인대 골화증은 사고 전부터 존재하던 병변이므로 관여도 산정이 핵심 쟁점이 된다.`},
      {q:"경추의 해부학적 특징을 설명하고, 제1경추와 제2경추의 구조를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 경추의 일반적 특징\n1. 일곱 개의 경추골로 이루어진다.\n2. 굴곡, 신전, 외측굴곡, 회전의 네 가지 운동이 가능하며 척추 중 운동범위가 가장 크다.\n3. 횡돌기에 횡돌공이 있어 추골동맥이 지나간다.\n4. 척추관 안에 척수가 있어 손상 시 사지마비가 발생할 수 있다.\n5. 신경근은 여덟 쌍으로 척추골의 개수보다 하나가 많다.\n\nⅡ. 제1경추 환추\n추체와 극돌기가 없는 고리 모양의 구조로, 전방궁과 후방궁, 좌우의 외측괴로 이루어진다. 후두골과 관절하여 굴곡과 신전을 담당한다.\n\nⅢ. 제2경추 축추\n추체의 상방으로 치돌기가 돌출되어 있으며, 환추가 이 치돌기를 축으로 회전한다. 경추 회전운동의 대부분이 환축추관절에서 일어난다.\n\nⅣ. 임상적 의의\n환추 골절은 수직 압박으로, 치돌기 골절은 교통사고로 발생하며, 후두골-환추 탈구는 드물지만 사망률이 매우 높다.\n\nⅤ. 결론\n환추는 고리, 축추는 축이라는 구조적 특징이 손상 기전과 치료를 결정한다.`}

       <tr><td>실질 손상</td><td><b>없다</b></td><td><b>있다</b>(뇌 실질 출혈)</td></tr>
       <tr><td>영상</td><td>CT·MRI <b>정상</b></td><td>CT·MRI에 <b>이상 소견</b></td></tr>
       <tr><td>증상</td><td>일시적 기억상실, 수분간의 의식소실, 일시적 혼돈</td><td>신경학적 증상과 기능장애가 잔존할 수 있다</td></tr>
       <tr><td>예후</td><td>합병증 없이 회복</td><td>후유증이 남을 수 있다</td></tr>
       </table></div>
       <p><b>글라스고우 혼수척도(GCS)</b> — 눈뜨기(E), 언어반응(V), 운동반응(M) 세 항목의 합.</p>
       <div class="scroller"><table class="mini">
       <tr><th>항목</th><th>점수</th><th>내용</th></tr>
       <tr><td rowspan="4"><b>눈뜨기 E (4)</b></td><td>4</td><td>자발적으로 눈을 뜬다</td></tr>
       <tr><td>3</td><td>부르면 눈을 뜬다</td></tr>
       <tr><td>2</td><td>통증 자극에 눈을 뜬다</td></tr>
       <tr><td>1</td><td>전혀 눈을 뜨지 않는다</td></tr>
       <tr><td rowspan="5"><b>언어반응 V (5)</b></td><td>5</td><td>지남력이 있다</td></tr>
       <tr><td>4</td><td>혼돈된 대화</td></tr>
       <tr><td>3</td><td>부적절한 단어</td></tr>
       <tr><td>2</td><td>이해할 수 없는 소리</td></tr>
       <tr><td>1</td><td>전혀 반응이 없다</td></tr>
       <tr><td rowspan="6"><b>운동반응 M (6)</b></td><td>6</td><td>명령에 따른다</td></tr>
       <tr><td>5</td><td>통증 부위를 찾아낸다</td></tr>
       <tr><td>4</td><td>통증에서 회피한다</td></tr>
       <tr><td>3</td><td>이상 굴곡(제피질 자세)</td></tr>
       <tr><td>2</td><td>이상 신전(제뇌 자세)</td></tr>
       <tr><td>1</td><td>전혀 움직이지 않는다</td></tr>
       </table></div>
       <div class="warn"><b>총점 15점, 최저 3점. 0점은 없다.</b> 각 항목은 <b>2~3회 반복</b>하여 <b>가장 좋은 반응</b>을 채점한다.<br>
       48회는 "어떤 자극에도 눈을 뜨지 않고, 언어 반응이 전혀 없으며, 통증 자극에도 전혀 움직이지 않는다"를 주고 답하게 했다. <b>E1 + V1 + M1 = GCS 3점, 혼수(coma)</b>.</div>
       <p><b>의식 수준(LOC) 5단계</b> — 청명(Alert) <b>15</b> / 기면(Drowsy) <b>13~14</b> / 혼미(Stupor) <b>8~12</b> / 반혼수(Semicoma) <b>4~7</b> / 혼수(Coma) <b>3</b></p>`,
       mnemo:{key:"E4 · V5 · M6 = 15", how:"눈 <b>4</b>, 말 <b>5</b>, 움직임 <b>6</b> → 합 <b>15</b>, 최저 <b>3</b>.<br>LOC는 <b>15 / 13~14 / 8~12 / 4~7 / 3</b> 다섯 구간."}},

      {h:"뇌사와 식물인간, 병적 반사", freq:F(3,[48]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>구분</th><th>뇌사</th><th>식물인간</th></tr>
       <tr><td>손상 부위</td><td>대뇌 + <b>뇌간</b> 전체</td><td>대뇌(뇌간은 <b>보존</b>)</td></tr>
       <tr><td>자발호흡</td><td><b>없다</b></td><td><b>있다</b></td></tr>
       <tr><td>뇌간반사</td><td>모두 소실</td><td>보존</td></tr>
       <tr><td>수면·각성 주기</td><td>없다</td><td>있다(눈을 뜬다)</td></tr>
       <tr><td>회복</td><td>불가능</td><td>드물게 가능</td></tr>
       </table></div>
       <p><b>뇌사 판정 기준</b></p>
       <ol><li>깊은 혼수 상태로 <b>자발호흡이 없을 것</b></li>
       <li><b>두 눈의 동공이 확대·고정</b>되어 있을 것</li>
       <li>뇌간반사(광반사, 각막반사, 안구두부반사, 전정안반사, 모양체척수반사, 구역반사, 기침반사)가 <b>모두 소실</b>될 것</li>
       <li>자발운동, 제뇌강직, 제피질강직, 경련이 <b>없을 것</b></li>
       <li><b>무호흡 검사</b>에서 자발호흡이 유발되지 않을 것</li>
       <li><b>뇌파검사에서 평탄뇌파가 30분 이상</b> 지속될 것</li>
       <li>위 항목을 <b>일정 시간이 지난 후 재확인</b>하여도 같을 것</li></ol>
       <p><b>병적 반사</b> — 건강한 성인에게는 나타나지 않고 <b>병적인 경우에만</b> 양성인 반사. 상위운동신경원(추체로) 병변을 시사한다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>반사</th><th>양성 소견</th></tr>
       <tr><td><b>바빈스키 징후</b></td><td>발바닥 외측을 긁으면 <b>엄지발가락이 배굴</b>되고 나머지 발가락이 부챗살처럼 벌어진다</td></tr>
       <tr><td><b>호프만 징후</b></td><td>중지 끝을 튕기면 <b>엄지와 검지가 굴곡</b>된다</td></tr>
       <tr><td>척수간대성경련(clonus)</td><td>발목을 갑자기 배굴시키면 <b>율동적인 반복 수축</b>이 지속된다</td></tr>
       <tr><td>Chaddock 징후</td><td>외측 복사 아래를 긁으면 바빈스키와 같은 반응</td></tr>
       </table></div>
       <div class="warn">항문반사와 구해면체반사는 <b>병적 반사가 아니다.</b> 모범답안이 직접 경고한 오답이다.</div>`,
       mnemo:{key:"뇌사는 숨이 없다", how:"뇌사와 식물인간을 가르는 한 줄 — <b>자발호흡</b>. 뇌간이 죽으면 숨이 멎는다.<br>병적 반사는 <b>바빈스키·호프만</b> 둘만 확실히."}},

      {h:"말초신경 손상 — 부위 매칭 (3회 출제)", freq:F(3,[41,42,47]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>손상·질환</th><th>손상되는 신경</th><th>증상</th></tr>
       <tr><td><b>상완골두 탈구(견관절 탈구)</b></td><td><b>액와신경</b></td><td>삼각근 마비 → 외전 제한, 견관절 외측 감각소실</td></tr>
       <tr><td><b>상완골 간부 골절</b></td><td><b>요골신경</b></td><td>수근하수, 제1물갈퀴 배측 감각소실</td></tr>
       <tr><td><b>상완골 내과 골절·주관절 탈구</b></td><td><b>척골신경</b></td><td>갈퀴손, 손가락 벌리기 제한, 제5지·제4지 내측 감각소실</td></tr>
       <tr><td><b>비골 근위부(경부) 골절</b></td><td><b>비골신경</b></td><td><b>족하수</b>, 족배부 감각소실</td></tr>
       <tr><td><b>고관절 탈구</b></td><td><b>좌골신경</b>(특히 비골신경 부분)</td><td>족하수, 발·발목 감각소실</td></tr>
       <tr><td><b>수근관 증후군</b></td><td><b>정중신경</b></td><td>1~3수지·4수지 요측 저림, 무지구근 위축</td></tr>
       <tr><td><b>주관 증후군</b></td><td><b>척골신경</b></td><td>주관절 굴곡 시 악화, 갈퀴손</td></tr>
       <tr><td><b>지각이상대퇴신경통</b></td><td><b>외측대퇴피신경</b></td><td>대퇴 외측의 저림과 작열감</td></tr>
       </table></div>
       <div class="why"><span class="h">말초신경 손상 후 회복이 잘 되는 경우 (42회 출제)</span>
       ① <b>신경실행증(neurapraxia)</b>처럼 축삭이 끊기지 않고 <b>탈수초만</b> 일어난 경우<br>
       ② 손상이 <b>압박·견인</b>에 의한 것이고 <b>절단이 아닌</b> 경우<br>
       ③ <b>신경내막이 보존</b>된 경우(축삭절단증)<br>
       ④ 손상 부위가 <b>지배 근육에 가까운</b> 경우(재생 거리가 짧다)<br>
       ⑤ <b>젊은</b> 환자<br>
       ⑥ 감염·반흔·혈종 등 <b>재생을 방해하는 요인이 없는</b> 경우<br>
       ⑦ <b>조기에 적절히 봉합</b>된 경우</div>`,
       mnemo:{key:"간요 · 내척 · 비비 · 탈액", how:"<b>간</b>부→<b>요</b>골 / <b>내</b>과→<b>척</b>골 / <b>비</b>골경부→<b>비</b>골신경 / 견관절<b>탈</b>구→<b>액</b>와신경.<br>이 네 쌍만 외우면 매칭 문제 절반은 맞는다."}},

      {h:"치매 — 4회 출제된 단골", freq:F(3,[41,45,47,49]),
       body:`<p><b>정의</b> — 후천적으로 뇌의 기질적 장애에 의해 인지기능이 손상되어 일상생활 수행이 불가능해진 상태.</p>
       <p><b>대표적 원인질환</b></p>
       <ol><li><b>알츠하이머병</b> — 가장 흔하다</li>
       <li><b>혈관성 치매</b> — 뇌경색·뇌출혈의 누적</li>
       <li><b>루이체 치매</b> — 환시, 파킨슨 증상, 인지기능의 변동</li>
       <li><b>전두측두엽 치매</b> — 성격 변화와 언어장애가 먼저</li>
       <li>파킨슨병 치매</li>
       <li>알코올성 치매(베르니케-코르사코프)</li>
       <li>외상성 뇌손상 후 치매</li>
       <li>크로이츠펠트-야콥병 등 감염성</li></ol>
       <p><b>감별해야 할 가역적 원인</b> — <b>정상압 수두증</b>(보행장애·요실금·인지저하 3징), <b>만성 경막하 혈종</b>, <b>갑상선 기능저하증</b>, <b>비타민 B12·엽산 결핍</b>, <b>신경매독</b>, <b>우울증(가성치매)</b>, 뇌종양, 약물</p>
       <div class="warn">치매 문제에서 <b>가역적 원인의 감별</b>을 빠뜨리면 안 된다. 41회가 "원인 및 감별질환"을 함께 물었다.</div>
       <p><b>평가 척도</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>척도</th><th>내용</th></tr>
       <tr><td><b>CDR</b></td><td><b>6개 영역</b> — <b>기억력 · 지남력 · 판단력과 문제해결능력 · 사회활동 · 집안생활과 취미 · 위생과 몸치장</b>. 0 / 0.5 / 1 / 2 / 3(/4/5)로 평가한다. <b>치매보험의 경도·중등도·중증</b> 판정에 쓰인다</td></tr>
       <tr><td><b>MMSE-K</b></td><td><b>30점 만점</b> — 지남력 시간 5, 장소 5, 기억등록 3, 주의집중·계산 5, 기억회상 3, 언어·시공간 구성 9.<br><b>26~21 경도 / 20~10 중등도 / 9점 이하 중증</b></td></tr>
       <tr><td><b>GDS</b></td><td>전반적 퇴화 척도. 1~7단계</td></tr>
       </table></div>
       <p><b>치매 예방을 위한 보호 행동 (49회 출제)</b> — 절주·금연·혈당관리·규칙적 운동 외에 ① <b>고혈압 관리</b> ② <b>이상지질혈증 관리</b> ③ <b>비만 관리</b> ④ <b>청력 저하의 교정</b>(보청기) ⑤ <b>시력 저하의 교정</b> ⑥ <b>우울증의 치료</b> ⑦ <b>사회적 고립의 해소</b>와 활발한 대인관계 ⑧ <b>인지활동</b>(교육·독서·학습) ⑨ <b>두부 외상의 예방</b>(안전모·안전벨트) ⑩ <b>대기오염 노출의 감소</b> ⑪ 충분하고 규칙적인 <b>수면</b> ⑫ 균형 잡힌 <b>식사</b></p>`,
       mnemo:{key:"기 · 지 · 판 / 사 · 집 · 위", how:"CDR 6영역 — <b>기</b>억력 · <b>지</b>남력 · <b>판</b>단력 / <b>사</b>회활동 · <b>집</b>안생활 · <b>위</b>생.<br>앞 셋은 <b>머리</b>, 뒤 셋은 <b>생활</b>이다."}}
    ],
    cards:[
      {f:"봉합선 이개 골절의 기준은?", b:"봉합선이 2mm 이상 분리된 상태."},
      {f:"두개저부 골절의 호발 순서는?", b:"전두와의 안와면 > 측두골 추체부(중두와) > 후두골 기저부(후두와)."},
      {f:"뇌척수액 비루·이루의 치료는?", b:"대부분 항생제 투여와 절대안정으로 자연치유된다."},
      {f:"경막외 출혈의 출혈원과 CT 모양은?", b:"동맥(중경막동맥) 출혈, 볼록렌즈 모양. 약 90%에서 두개골 선상골절을 동반한다."},
      {f:"경막외 출혈의 수술 기준은?", b:"혼수 상태이거나 혈종이 40mL 이상이면 응급 개두술."},
      {f:"경막하 출혈의 출혈원과 CT 모양은?", b:"교정맥 출혈, 초승달 모양. 급성은 고음영, 만성은 저음영."},
      {f:"경막하 출혈의 시기 분류는?", b:"급성 3일(72시간) 이내, 아급성 3~21일, 만성 3주 이상."},
      {f:"급성 경막하 출혈의 사망률과 특별 처치는?", b:"사망률 50% 이상. 외상성 간질 가능성이 높아 항경련제를 최소 1년 이상 투여한다."},
      {f:"만성 경막하 출혈의 특징과 치료는?", b:"노년층·알코올 중독·출혈 경향에서 외상을 기억하지 못하는 경우가 많다. 천공 배액술로 치료."},
      {f:"지주막하 출혈의 주원인과 증상은?", b:"뇌동맥류 파열. 망치로 맞은 듯한 극심한 두통, 분출성 구토, 뇌막자극증상."},
      {f:"지주막하 출혈의 3대 합병증은?", b:"재출혈, 뇌혈관 연축, 뇌수두증."},
      {f:"지주막하 출혈의 예후는?", b:"1/3 즉사, 1/3 이송 중·도착 후 사망, 1/3만 치료 가능."},
      {f:"외상성 뇌실질내 출혈의 특징은?", b:"모양이 불규칙, 밀도 불균일, 다발성, 전두엽·측두엽 전방에 호발."},
      {f:"자발성 뇌실질내 출혈의 특징은?", b:"경계가 분명한 고밀도, 1~3개 이내, 기저핵이 가장 흔한 호발부위, 고혈압 병력."},
      {f:"뇌진탕과 뇌좌상의 차이는?", b:"뇌진탕은 실질 손상이 없고 영상이 정상이며 완전 회복, 뇌좌상은 실질 출혈이 있고 영상 이상과 후유증이 남을 수 있다."},

    quiz:[
      {q:"두개강 내 출혈의 종류를 열거하고 각각의 특징을 비교하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 경막외 출혈\n1. 위치 — 두개골과 경막 사이\n2. 출혈원 — 주로 중경막동맥의 동맥 출혈이므로 단시간에 대량 출혈이 일어나 뇌압이 급속히 상승한다.\n3. 특징 — 약 90퍼센트에서 두개골 선상골절을 동반하며 전체 두부 손상의 2퍼센트 이내이다. 의식이 회복되었다가 다시 나빠지는 명료기가 나타날 수 있다.\n4. 영상 — 전산화단층촬영에서 볼록렌즈 모양의 고음영\n5. 치료 — 혼수 상태이거나 혈종이 40밀리리터 이상이면 응급 개두술\n\nⅡ. 경막하 출혈\n1. 위치 — 경막과 지주막 사이\n2. 출혈원 — 주로 교정맥의 파열로 출혈 속도가 느려 뇌압이 서서히 증가한다.\n3. 분류 — 급성은 72시간 이내, 아급성은 3일에서 21일, 만성은 3주 이상 경과한 것\n4. 영상 — 초승달 모양으로 급성은 고음영, 만성은 저음영\n5. 특징 — 급성은 뇌부종을 동반하여 사망률이 50퍼센트를 넘고 외상성 간질의 가능성이 높아 항경련제를 최소 1년 이상 투여한다. 만성은 노년층과 알코올 중독자에서 외상을 기억하지 못하는 경우가 많고 천공 배액술로 치료하며 예후가 좋다.\n\nⅢ. 지주막하 출혈\n1. 주원인은 뇌동맥류의 파열이다.\n2. 망치로 맞은 듯한 극심한 두통, 분출성 구토, 목 강직 등 뇌막자극증상을 보인다.\n3. 전산화단층촬영과 요추천자로 진단하고 뇌혈관조영술로 확진한다.\n4. 3대 합병증은 재출혈, 뇌혈관 연축, 뇌수두증이다.\n\nⅣ. 뇌실질내 출혈\n뇌 실질 내 세혈관의 파열로 고혈압이 가장 흔한 원인이며, 뇌혈관 기형이나 종양도 원인이 된다.\n\nⅤ. 결론\n출혈의 위치, 출혈원, 영상 모양의 세 가지로 구별하면 혼동하지 아니한다.`},
      {q:"뇌실질내 출혈에서 외상성과 자발성을 감별하기 위한 고려사항을 서술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 감별의 필요성\n뇌실질내 출혈이 외상에 의한 것인지 기왕의 질병에 의한 것인지에 따라 보험사고의 해당 여부와 기여도가 달라지므로 감별이 필수적이다.\n\nⅡ. 영상소견상의 차이\n1. 외상성 — 출혈의 모양이 매우 불규칙하고 밀도가 불균일하며 다발성인 경우가 많다. 전두엽과 측두엽의 전방에 호발하며 그 비율이 80퍼센트에서 90퍼센트에 이른다.\n2. 자발성 — 경계가 비교적 분명한 고밀도 병소로 나타나며 대개 1개에서 3개 이내이고 기저핵이 가장 흔한 호발부위이다.\n\nⅢ. 동반소견\n1. 외상성은 두개골 골절, 두피 열상과 혈종, 경막외·경막하 출혈, 지주막하 출혈, 대측 충격 손상이 동반된다.\n2. 자발성은 고혈압, 항응고제 복용, 뇌혈관 기형, 뇌종양, 아밀로이드 혈관병증의 병력이 있다.\n\nⅣ. 임상경과\n1. 외상성은 사고 직후 의식저하가 나타나고 시간 경과에 따라 혈종이 커질 수 있다.\n2. 자발성은 활동 중 갑작스러운 두통과 편마비로 발현하며 사고와 시간적 선후가 역전되는 경우가 있다.\n\nⅤ. 확인할 자료\n사고의 기전과 외력의 정도, 초기 활력징후와 의식상태, 최초 촬영과 추적 촬영의 비교, 고혈압 등 기왕력, 복용 약물\n\nⅥ. 결론\n위치와 모양, 동반 손상, 병력의 세 축을 종합하여 판단하여야 하며, 어느 하나만으로 단정하여서는 아니 된다.`},
      {q:"글라스고우 혼수척도의 구성과 평가방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n두부 손상 환자의 의식상태를 객관적으로 평가하기 위한 척도로, 눈뜨기, 언어반응, 운동반응의 세 항목을 합산한다.\n\nⅡ. 구성\n1. 눈뜨기 — 4점 자발적으로 뜸, 3점 부르면 뜸, 2점 통증 자극에 뜸, 1점 뜨지 아니함\n2. 언어반응 — 5점 지남력 있음, 4점 혼돈된 대화, 3점 부적절한 단어, 2점 이해할 수 없는 소리, 1점 반응 없음\n3. 운동반응 — 6점 명령에 따름, 5점 통증 부위를 찾음, 4점 통증에서 회피, 3점 이상 굴곡, 2점 이상 신전, 1점 반응 없음\n\nⅢ. 총점\n최고 15점, 최저 3점이며 0점은 존재하지 아니한다.\n\nⅣ. 평가방법\n각 항목을 두세 차례 반복하여 가장 좋은 반응을 채점하며, 기관삽관이나 안검부종 등으로 평가가 불가능한 항목은 그 사유를 기재한다.\n\nⅤ. 의식 수준과의 대응\n청명은 15점, 기면은 13점에서 14점, 혼미는 8점에서 12점, 반혼수는 4점에서 7점, 혼수는 3점에 해당한다.\n\nⅥ. 손해사정에서의 의의\n초기 GCS는 손상의 중증도와 예후를 추정하는 지표이며, 의식장해의 지속 여부는 노동능력상실률과 간병의 필요성 판단에 사용된다.\n\nⅦ. 결론\n세 항목의 배점과 총점의 범위를 정확히 기재하는 것이 이 문제의 핵심이다.`},
      {q:"뇌사의 판정기준을 기술하고, 식물인간과 비교하여 설명하시오. (10점)", pts:10, lik:3,

       a:`Ⅰ. 의의\n건강한 성인에게는 나타나지 아니하고 병적인 경우에만 양성으로 나타나는 반사로, 상위운동신경원 즉 추체로의 병변을 시사한다.\n\nⅡ. 종류와 양성 소견\n1. 바빈스키 징후 — 발바닥의 외측을 뒤꿈치에서 발가락 쪽으로 긁으면 엄지발가락이 배굴되고 나머지 발가락이 부챗살 모양으로 벌어진다.\n2. 호프만 징후 — 중지의 끝을 아래로 튕기면 엄지와 검지가 굴곡된다. 경추 병변에서 확인한다.\n3. 척수간대성경련 — 발목을 갑자기 배굴시킨 상태로 유지하면 율동적인 반복 수축이 지속된다.\n4. Chaddock 징후 — 외측 복사의 아래를 긁으면 바빈스키 징후와 같은 반응이 나타난다.\n5. Oppenheim 징후 — 경골의 전내측을 아래로 문지르면 같은 반응이 나타난다.\n\nⅢ. 주의사항\n항문반사와 구해면체반사는 병적 반사가 아니라 정상적으로 존재하는 반사이므로 혼동하여서는 아니 된다. 또한 생후 2년 이내의 영아에서는 바빈스키 징후가 정상적으로 나타날 수 있다.\n\nⅣ. 손해사정에서의 의의\n병적 반사의 존재는 척수병증이나 뇌 병변을 시사하므로 신경학적 장해의 객관적 근거가 된다.\n\nⅤ. 결론\n바빈스키와 호프만이 대표적이며, 각 반사의 자극 부위와 반응을 함께 기재하여야 한다.`},
      {q:"다음 골절 또는 탈구에 동반되는 신경손상을 기술하시오. (1) 상완골두 탈구 (2) 상완골 간부 골절 (3) 비골 근위부 골절 (4) 고관절 탈구 (10점)", pts:10, lik:3,
       a:`Ⅰ. 상완골두 탈구\n액와신경이 손상된다. 삼각근의 마비로 견관절의 외전이 제한되고 견관절 외측 상부의 감각이 소실된다.\n\nⅡ. 상완골 간부 골절\n요골신경이 손상된다. 요골신경은 상완골 간부의 요골신경구를 따라 주행하므로 특히 중하 3분의 1 부위의 골절에서 손상되며, 손목과 손가락의 신전이 되지 아니하는 수근하수와 제1물갈퀴 공간 배측의 감각소실이 나타난다.\n\nⅢ. 비골 근위부 골절\n비골신경이 손상된다. 비골신경은 비골 경부를 돌아 주행하므로 이 부위의 골절이나 석고 압박으로 손상되며, 족배굴곡이 되지 아니하는 족하수와 족배부의 감각소실이 나타난다.\n\nⅣ. 고관절 탈구\n좌골신경이 손상된다. 특히 비골신경 부분이 더 흔하게 손상되어 족하수와 발 및 발목의 감각소실이 나타난다.\n\nⅤ. 그 밖의 대표적 조합\n상완골 내과 골절과 주관절 탈구는 척골신경, 수근관 증후군은 정중신경, 주관 증후군은 척골신경, 지각이상대퇴신경통은 외측대퇴피신경의 문제이다.\n\nⅥ. 결론\n손상 부위와 그 부위를 지나는 신경을 대응시키는 것이 이 유형의 답이며, 증상까지 함께 적어야 배점이 채워진다.`},
      {q:"말초신경 손상 후 회복이 잘 되는 경우를 열거하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 손상의 정도에 따른 분류\n1. 신경실행증 — 축삭은 보존되고 국소적인 탈수초만 일어난 상태로 수주 내에 완전히 회복된다.\n2. 축삭절단증 — 축삭은 끊어졌으나 신경내막이 보존된 상태로 축삭이 재생하여 회복될 수 있다.\n3. 신경절단증 — 신경 전체가 절단된 상태로 자연 회복을 기대하기 어렵고 수술적 봉합이 필요하다.\n\nⅡ. 회복이 잘 되는 경우\n1. 축삭이 끊기지 아니하고 탈수초만 일어난 경우\n2. 압박이나 견인에 의한 손상으로 절단이 아닌 경우\n3. 신경내막 등 지지구조가 보존된 경우\n4. 손상 부위가 지배 근육에 가까워 재생 거리가 짧은 경우\n5. 환자의 연령이 젊은 경우\n6. 감염, 반흔, 혈종 등 재생을 방해하는 요인이 없는 경우\n7. 절단된 경우에도 조기에 적절히 봉합된 경우\n8. 압박의 원인이 제거된 경우\n\nⅢ. 회복의 양상\n축삭은 하루에 약 1밀리미터 정도 재생하며 근위부에서 원위부로 회복이 진행한다. 티넬 징후의 이동으로 재생을 확인할 수 있다.\n\nⅣ. 손해사정에서의 의의\n회복 가능성이 있는 동안에는 장해를 확정할 수 없으므로 충분한 경과관찰 후 근전도와 신경전도 검사로 확인하여야 한다.\n\nⅤ. 결론\n손상의 정도와 재생을 방해하는 요인의 유무가 회복 여부를 결정한다.`},
      {q:"치매의 원인질환과 감별하여야 할 질환을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 치매의 정의\n후천적으로 뇌의 기질적 장애에 의하여 기억력을 포함한 인지기능이 손상되어 일상생활의 수행이 불가능해진 상태를 말한다.\n\nⅡ. 대표적 원인질환\n1. 알츠하이머병 — 가장 흔한 원인이다.\n2. 혈관성 치매 — 뇌경색과 뇌출혈의 누적으로 발생하며 계단식으로 악화된다.\n3. 루이체 치매 — 환시, 파킨슨 증상, 인지기능의 변동이 특징이다.\n4. 전두측두엽 치매 — 성격 변화와 언어장애가 기억장애보다 먼저 나타난다.\n5. 파킨슨병 치매\n6. 알코올성 치매\n7. 외상성 뇌손상 후 치매\n8. 크로이츠펠트-야콥병 등 감염성 원인\n\nⅢ. 감별하여야 할 가역적 원인\n1. 정상압 수두증 — 보행장애, 요실금, 인지저하의 세 징후\n2. 만성 경막하 혈종\n3. 갑상선 기능저하증\n4. 비타민 B12와 엽산의 결핍\n5. 신경매독 등 감염\n6. 우울증에 의한 가성치매\n7. 뇌종양\n8. 약물 부작용\n\nⅣ. 감별의 실익\n가역적 원인은 치료로 호전될 수 있으므로 반드시 배제하여야 하며, 손해사정에서는 외상과의 인과관계 판단에도 직결된다.\n\nⅤ. 결론\n원인질환의 열거와 가역적 원인의 감별을 함께 서술하여야 완결된 답안이 된다.`},
      {q:"치매 평가에 사용하는 CDR 척도의 6개 세부 영역을 쓰고, 그 밖의 평가도구를 설명하시오. (10점)", pts:10, lik:3,

      {q:"치매의 발생 위험을 낮추기 위한 보호 행동을 10가지 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 개요\n치매는 조절 가능한 위험인자를 관리함으로써 발생을 예방하거나 지연시킬 수 있다.\n\nⅡ. 보호 행동\n1. 고혈압의 관리\n2. 당뇨병과 혈당의 관리\n3. 이상지질혈증의 관리\n4. 비만의 관리와 적정 체중의 유지\n5. 금연\n6. 절주\n7. 규칙적인 유산소 운동\n8. 청력 저하의 조기 교정 — 보청기의 사용\n9. 시력 저하의 교정\n10. 우울증의 조기 치료\n11. 사회적 고립의 해소와 활발한 대인관계의 유지\n12. 교육과 독서 등 지속적인 인지활동\n13. 두부 외상의 예방 — 안전모와 안전벨트의 착용, 낙상의 예방\n14. 대기오염 노출의 감소\n15. 충분하고 규칙적인 수면\n16. 균형 잡힌 식사\n\nⅢ. 의의\n위 인자들은 혈관성 위험인자, 감각기능의 저하, 사회적·인지적 활동, 외상의 네 범주로 묶을 수 있다.\n\nⅣ. 결론\n조절 가능한 위험인자의 관리가 치매 예방의 핵심이며, 범주별로 나누어 기술하면 요구 개수를 안정적으로 채울 수 있다.`}

       · <b>하지</b> — 힘을 주어도 <b>근육의 수축만 약간</b> 있고 능동적 관절운동 불가 → <b>MMT 1등급(Trace)</b></div>`,
       mnemo:{key:"5 저항 · 4 약저항 · 3 중력 · 2 무중력 · 1 수축 · 0 무", how:"위에서부터 <b>저항 → 중력 → 수축 → 없음</b>으로 한 칸씩 내려간다.<br><b>3과 2 사이</b>가 중력의 경계다. 이것만 확실히."}},

      {h:"관절운동 제한의 원인 — 두 갈래로 나눈다", freq:F(3,[42,43,44]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>구분</th><th>원인</th></tr>
       <tr><td><b>관절내 원인</b></td><td>관절면의 부정합(관절내 골절의 부정유합), 관절연골의 손상, 관절내 유착과 반흔, 관절내 유리체, 활액막의 증식, 관절 강직, 관절내 골절 후 외상성 관절염</td></tr>
       <tr><td><b>관절외 원인</b></td><td>관절 주위 연부조직의 반흔과 유착, 근육의 구축, 건과 인대의 단축·유착, <b>이소성 골화</b>, 피부의 반흔 구축, 신경손상에 의한 근마비, 통증에 의한 회피, 골성 차단(골극)</td></tr>
       </table></div>
       <div class="why"><span class="h">능동 &lt; 수동일 때 (42회 출제)</span>
       정상 관절은 능동 운동범위와 수동 운동범위가 <b>일치</b>한다. <b>수동이 능동보다 큰 경우</b>는 관절 자체는 움직일 수 있는데 <b>움직일 힘이 없다</b>는 뜻이다.<br>
       ① <b>근력 약화</b> — 신경손상에 의한 마비, 근육 자체의 질환<br>
       ② <b>건의 파열</b> — 회전근개 전층파열, 아킬레스건 파열, 신전건 파열<br>
       ③ <b>통증</b>으로 인한 능동운동의 회피<br>
       ④ <b>꾀병 또는 협조 부족</b><br>
       손해사정에서는 ④의 가능성 때문에 <b>능동과 수동을 반드시 함께 측정</b>하고 건측과 비교한다.</div>
       <p><b>외상 후 관절염과 관련이 높은 손상</b> — <b>관절내 골절</b>, 관절연골의 직접 손상, 반월상 연골의 절제, 인대 손상으로 인한 <b>만성 불안정성</b>, 탈구, 무혈성 괴사</p>`,
       mnemo:{key:"안쪽이냐 바깥쪽이냐", how:"관절운동 제한은 <b>관절 안(연골·유착·강직)</b>과 <b>관절 밖(근육·건·피부·신경)</b> 두 갈래로만 나누면 된다.<br>능동 &lt; 수동이면 <b>힘의 문제</b>다."}},

      {h:"척추 장해의 3분류 — 실무 핵심", freq:F(3,[44]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>장해</th><th>평가 대상</th><th>지급률(제3보험 기준)</th></tr>
       <tr><td><b>운동장해</b></td><td>척추체의 골절·탈구로 <b>유합 또는 고정한 척추체의 개수</b>. 횡돌기·극돌기는 제외</td><td>심한 <b>40</b> / 뚜렷한 <b>30</b> / 약간의 <b>10</b></td></tr>
       <tr><td><b>기형장해</b></td><td><b>압박률</b> 또는 <b>Cobb's angle</b>에 의한 만곡</td><td>심한 <b>50</b> / 뚜렷한 <b>30</b> / 약간의 <b>15</b></td></tr>
       <tr><td><b>신경장해</b></td><td>추간판탈출증에 의한 신경장해</td><td>심한 <b>20</b> / 뚜렷한 <b>15</b> / 약간의 <b>10</b></td></tr>
       </table></div>
       <p><b>운동장해의 판정</b> — 심한 장해는 <b>4개 이상</b>, 뚜렷한 장해는 <b>3개</b>, 약간의 장해는 <b>2개</b>의 척추체를 유합 또는 고정한 경우</p>
       <p><b>기형장해의 판정</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>구분</th><th>전·후만증</th><th>측만증</th><th>추체 1개 압박률</th><th>한 운동단위 2개 이상 압박률 합</th></tr>
       <tr><td><b>심한 기형</b></td><td>35° 이상</td><td>20° 이상</td><td>60% 이상</td><td>90% 이상</td></tr>
       <tr><td><b>뚜렷한 기형</b></td><td>15° 이상</td><td>10° 이상</td><td>40% 이상</td><td>60% 이상</td></tr>
       <tr><td><b>약간의 기형</b></td><td>경도</td><td>경도</td><td>20% 이상</td><td>40% 이상</td></tr>
       </table></div>
       <div class="warn"><b>운동단위 합산의 원칙</b> — 경추부·흉추부·요추부를 <b>각각 하나의 운동단위</b>로 본다. <b>한 운동단위 안</b>의 여러 척추체 압박률은 <b>합산</b>하고, <b>두 개 이상의 운동단위</b>에 장해가 있으면 <b>가장 높은 지급률 하나만</b> 적용한다.</div>
       <p><b>추간판탈출증 신경장해의 요건</b></p>
       <ul><li><b>심한 장해(20%)</b> — 추간판을 <b>2마디 이상</b>(또는 1개 추간판을 2회 이상) 수술 + 마미신경증후군으로 현저한 마비 또는 대소변 장해</li>
       <li><b>뚜렷한 장해(15%)</b> — <b>1마디</b> 수술 + 신경생리검사에서 명확한 신경근병증 소견 지속 + 척추신경근의 불완전 마비</li>
       <li><b>약간의 장해(10%)</b> — 추간판탈출증이 확인되고 신경생리검사에서 명확한 신경근병증 소견이 지속되는 경우</li></ul>
       <div class="warn"><b>추간판탈출증은 수술 여부와 관계없이 운동장해·기형장해로 평가하지 않는다.</b> 그리고 수술 또는 시술 후 <b>6개월 이상</b> 지난 후에 평가한다.</div>`,
       mnemo:{key:"운 40 · 기 50 · 신 20", how:"척추 장해 3분류의 최고 지급률 — <b>운</b>동 40, <b>기</b>형 50, <b>신</b>경 20.<br>운동장해는 <b>4·3·2개</b> 고정, 기형장해는 <b>35·15도 / 60·40% / 90·60%</b>."}},

      {h:"동요관절과 맥브라이드", freq:F(2,[43]),
       body:`<div class="calcbox"><b>동요의 계측</b><br>
       스트레스 방사선촬영에서 <b>환측 − 건측</b>의 <b>증가된 수치</b>로 평가한다.</div>
       <div class="scroller"><table class="mini">
       <tr><th>동요 정도</th><th>맥브라이드(십자인대 파열, 수술하지 않은 경우 옥외 29% 기준)</th><th>제3보험 다리의 장해</th></tr>
       <tr><td>3~5mm</td><td>29%의 <b>1/3</b></td><td>5mm 이상 — <b>약간의 장해 5%</b></td></tr>
       <tr><td>6~10mm</td><td>29%의 <b>1/2</b></td><td>10mm 이상 — <b>뚜렷한 장해 10%</b></td></tr>
       <tr><td>11mm 이상</td><td><b>29%</b> 전부</td><td>15mm 이상 — <b>심한 장해 20%</b></td></tr>
       </table></div>
       <div class="warn"><b>측부인대 파열만</b> 있는 경우에는 십자인대 파열의 <b>1/2</b>을 적용한다.</div>
       <div class="calcbox"><b>계산 예 1</b><br>
       환측 11.8mm, 건측 2.6mm → 차이 <b>9.2mm</b><br>
       맥브라이드 — 6~10mm 구간이므로 <b>29% × 1/2 = 14.5%</b><br>
       제3보험 — 5mm 이상 10mm 미만이므로 <b>약간의 장해 5%</b><br><br>
       <b>계산 예 2</b><br>
       환측 17.99mm, 건측 3.68mm → 차이 <b>14.31mm</b><br>
       맥브라이드 — 11mm 이상이므로 <b>29%</b><br>
       제3보험 — 10mm 이상 15mm 미만이므로 <b>뚜렷한 장해 10%</b></div>`,
       mnemo:{key:"3·5 → 1/3 / 6·10 → 1/2 / 11 → 전부", how:"맥브라이드 동요 3구간은 <b>1/3 · 1/2 · 전부</b>.<br>제3보험은 <b>5 · 10 · 15mm</b>에 <b>5 · 10 · 20%</b>. 숫자가 예쁘게 맞는다."}},

      {h:"하지 단축과 체간골 기형", freq:F(2,[45]),
       body:`<p><b>하지 단축</b></p>
       <ul><li>계측은 <b>스캐노그램</b>으로 환측과 건측을 비교한다</li>
       <li>측정 방법 — <b>전상장골극에서 경골 내과 끝까지</b>(극과간격)</li>
       <li>제3보험 후유장해 지급률 — <b>1cm 이상 5%</b>, <b>3cm 이상 15%</b>, <b>5cm 이상 30%</b></li>
       <li>임상적으로 <b>2cm 이상</b>이면 보행 이상을 유발한다</li></ul>
       <p><b>체간골의 기형장해</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>부위</th><th>지급률</th></tr>
       <tr><td>어깨뼈(견갑골) 또는 골반뼈에 뚜렷한 기형</td><td><b>15%</b></td></tr>
       <tr><td>빗장뼈(쇄골)·가슴뼈(흉골)·갈비뼈(늑골)에 뚜렷한 기형</td><td><b>10%</b></td></tr>
       </table></div>
       <div class="warn"><b>체간골은 모두 동일 부위로 본다.</b> 골반뼈의 뚜렷한 기형이란 <b>천장관절 또는 치골결합이 분리된 상태로 치유</b>되거나 <b>좌골이 2.5cm 이상 분리된 부정유합</b>을 말한다.</div>`},

      {h:"기왕증 관여도 — 척추를 예로", freq:F(3,[]),
       body:`<div class="why"><span class="h">원칙</span>
       "척추의 장해는 <b>퇴행성 기왕증 병변</b>과 사고가 그 증상을 <b>악화시킨 부분만큼</b>, 즉 이 사고와의 <b>관여도</b>를 산정하여 평가한다."</div>
       <p><b>관여도 산정의 근거 4가지</b></p>
       <ol><li><b>골밀도 검사</b>(BMD, T-score) — 골다공증의 정도</li>
       <li><b>주치의 소견</b></li>
       <li><b>사고의 내용과 정도</b> — 외력의 크기가 그 손상을 일으킬 만한가</li>
       <li><b>척추의 퇴행성 여부</b> — 골극, 퇴행성 추간판, 골다공증, 기타 척추질환, 기왕 사고력</li></ol>
       <div class="calcbox"><b>사례</b><br>
       75세 여성, 요추 4번 압박골절, 척추 후만변형 <b>26도</b>, 압박률 약 <b>62%</b>, 골밀도 <b>T-score −3.7</b>, 주치의 소견상 사고 관여도 <b>50%</b><br><br>
       → 기형장해는 압박률 60% 이상이므로 <b>심한 기형 50%</b><br>
       → 사고 관여도 50%를 적용하면 <b>50% × 50% = 25%</b><br>
       → 나머지 25%는 골다공증이라는 기왕증의 몫이다</div>
       <div class="warn"><b>T-score −2.5 이하</b>가 골다공증의 진단 기준이다. −3.7이면 심한 골다공증이므로 경미한 외력으로도 압박골절이 생길 수 있다. 이것이 관여도를 낮추는 근거가 된다.</div>`,
       mnemo:{key:"골 · 의 · 사 · 퇴", how:"관여도의 근거 4 — <b>골</b>밀도 · 주치<b>의</b> 소견 · <b>사</b>고의 내용 · <b>퇴</b>행성 소견.<br>답안에는 반드시 네 가지를 모두 적고 결론을 낸다."}}
    ],
    cards:[
      {f:"MMT 5등급의 내용은?", b:"Normal(N). 최대 저항을 이기고 완전한 관절운동이 가능하다."},

      {f:"관절운동 제한의 관절외 원인은?", b:"연부조직 반흔·유착, 근육 구축, 건·인대 단축, 이소성 골화, 피부 반흔 구축, 신경손상에 의한 마비, 통증."},

      {f:"척추 기형장해의 압박률 기준은?", b:"추체 1개 기준으로 60% 이상 심한, 40% 이상 뚜렷한, 20% 이상 약간의 기형."},
      {f:"척추 기형장해의 각도 기준은?", b:"전·후만증 35°/15° 이상, 측만증 20°/10° 이상."},

      {f:"동요관절의 계측 방법은?", b:"스트레스 방사선촬영에서 환측 − 건측의 증가된 수치로 평가한다."},

      {f:"제3보험 다리 동요관절의 지급률은?", b:"5mm 이상 약간의 장해 5%, 10mm 이상 뚜렷한 장해 10%, 15mm 이상 심한 장해 20%."},
      {f:"측부인대 파열만 있는 경우의 평가는?", b:"십자인대 파열의 1/2을 적용한다."},

       a:`Ⅰ. 도수근력검사의 의의\n검사자가 저항을 가하거나 중력의 조건을 조절하여 근력을 6단계로 평가하는 방법이다.\n\nⅡ. 등급\n1. 5등급 Normal(N) — 최대의 저항을 이기고 완전한 관절운동이 가능하다.\n2. 4등급 Good(G) — 어느 정도의 저항을 이기고 완전한 관절운동이 가능하다.\n3. 3등급 Fair(F) — 저항 없이 중력을 이기고 완전한 관절운동이 가능하다.\n4. 2등급 Poor(P) — 중력을 제거한 상태에서 완전한 관절운동이 가능하다.\n5. 1등급 Trace(T) — 근육의 수축만 촉지되고 관절운동은 일어나지 아니한다.\n6. 0등급 Zero(Z) — 근수축이 전혀 없다.\n\nⅢ. 중력의 제거 유무로 구분되는 단계\n3등급과 2등급이다. 3등급은 중력을 이기고 운동이 가능한 상태이며, 2등급은 중력을 제거하여야만 운동이 가능한 상태이다.\n\nⅣ. 실무상 유의점\n1. 반드시 건측과 비교하여 평가한다.\n2. 통증이나 협조 부족으로 실제보다 낮게 평가될 수 있으므로 반복 측정하고 근전도 등 객관적 검사와 대조한다.\n\nⅤ. 결론\n등급의 경계는 저항, 중력, 수축의 세 기준으로 정해지며 3등급과 2등급 사이가 중력의 경계이다.`},

       a:`Ⅰ. 원칙\n정상적인 관절에서는 능동적 운동범위와 수동적 운동범위가 일치한다.\n\nⅡ. 수동적 운동범위가 더 큰 경우\n관절 자체는 움직일 수 있으나 스스로 움직일 힘이 부족한 경우로 다음과 같은 원인이 있다.\n1. 근력의 약화 — 말초신경 손상이나 척수 손상에 의한 마비, 근육 자체의 질환, 폐용성 위축\n2. 건의 파열 — 회전근개 전층파열, 아킬레스건 파열, 신전건 파열\n3. 통증으로 인한 능동운동의 회피\n4. 협조의 부족 또는 의도적인 과장\n\nⅢ. 능동적 운동범위가 더 큰 경우\n측정의 오류이거나 검사자의 부적절한 고정에 의한 경우이며 병적 상태로 보기 어렵다.\n\nⅣ. 손해사정에서의 의의\n1. 능동과 수동을 반드시 함께 측정하고 건측과 비교한다.\n2. 두 값의 차이가 크면 근력 약화나 건 파열의 객관적 근거가 있는지를 확인하고, 근거가 없으면 협조 부족이나 과장의 가능성을 검토한다.\n3. 근전도, 신경전도, 자기공명영상 등 객관적 검사와 대조한다.\n\nⅤ. 결론\n능동과 수동의 차이는 힘의 문제이며, 그 원인의 객관적 확인이 장해 인정의 관건이다.`},

       a:`Ⅰ. 원칙\n척추의 장해는 기왕의 퇴행성 병변과 사고가 그 증상을 악화시킨 부분을 구분하여, 사고의 관여도를 산정한 후 그 비율만큼 장해를 인정한다.\n\nⅡ. 판단의 근거\n1. 골밀도 검사 — T-score가 마이너스 2.5 이하이면 골다공증이며, 수치가 낮을수록 경미한 외력으로도 골절이 발생할 수 있다.\n2. 주치의의 소견\n3. 사고의 내용과 정도 — 외력의 크기가 그 정도의 손상을 일으킬 만한 것인지\n4. 척추의 퇴행성 여부 — 골극, 퇴행성 추간판, 기타 척추질환, 기왕의 사고력\n\nⅢ. 적용의 예\n75세 여성이 요추 4번 압박골절로 후만변형 26도, 압박률 62퍼센트를 보이고 골밀도가 T-score 마이너스 3.7이며 주치의가 사고 관여도를 50퍼센트로 판단한 경우, 압박률 60퍼센트 이상이므로 심한 기형에 해당하여 지급률 50퍼센트를 인정하되 관여도 50퍼센트를 적용하여 최종 25퍼센트로 평가한다.\n\nⅣ. 유의사항\n1. 관여도는 의학적 판단이므로 주치의 또는 자문의의 소견을 근거로 하여야 한다.\n2. 기왕증이 있다는 사정만으로 일률적으로 감액하여서는 아니 되고 구체적 자료로 뒷받침되어야 한다.\n\nⅤ. 결론\n골밀도, 주치의 소견, 사고의 정도, 퇴행성 소견의 네 가지를 종합하여 관여도를 정하고 그 비율만큼 장해를 인정한다.`},
      {q:"체간골의 범위와 기형장해의 평가기준을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 체간골의 범위\n어깨뼈인 견갑골, 빗장뼈인 쇄골, 가슴뼈인 흉골, 갈비뼈인 늑골, 골반뼈를 말하며 이들은 모두 동일한 신체 부위로 취급한다.\n\nⅡ. 기형장해의 지급률\n1. 어깨뼈나 골반뼈에 뚜렷한 기형이 남은 때 — 15퍼센트\n2. 빗장뼈, 가슴뼈, 갈비뼈에 뚜렷한 기형이 남은 때 — 10퍼센트\n\nⅢ. 골반뼈의 뚜렷한 기형\n1. 천장관절 또는 치골결합이 분리된 상태로 치유된 경우\n2. 좌골이 2.5센티미터 이상 분리된 부정유합\n\nⅣ. 평가의 방법\n단순방사선과 전산화단층촬영으로 변형의 정도를 계측하고 건측과 비교한다.\n\nⅤ. 유의사항\n1. 체간골은 동일 부위이므로 여러 곳에 기형이 있어도 가장 높은 지급률 하나만 적용한다.\n2. 기능장해와는 별개의 항목이므로 중복 평가되지 아니하도록 한다.\n\nⅥ. 결론\n체간골의 범위와 동일 부위 원칙을 정확히 적용하는 것이 평가의 핵심이다.`},
      {q:"후유장해를 평가하는 시점의 결정에 관하여 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 원칙\n후유장해는 치료가 종결되어 증상이 고정된 때에 평가한다. 증상의 고정이란 더 이상의 치료로도 호전을 기대하기 어려운 상태를 말한다.\n\nⅡ. 부위별 기준\n1. 추간판탈출증 — 수술 또는 시술 후 6개월 이상 경과한 후\n2. 신경손상 — 재생과 회복이 진행되므로 충분한 경과관찰 후 근전도와 신경전도 검사로 확인\n3. 무혈성 괴사 — 골절 당시가 아니라 수개월에서 수년 후에 발현하므로 발현 후 평가\n4. 소아의 성장판 손상 — 성장이 종료된 후 재평가\n5. 관절 강직 — 재활치료가 충분히 시행된 후\n\nⅢ. 조기 평가의 문제\n증상이 고정되기 전에 평가하면 장해가 과대 또는 과소 평가되어 분쟁의 원인이 된다.\n\nⅣ. 한시장해의 처리\n회복이 예상되는 장해는 한시장해로 평가하고 그 기간을 명시하며, 영구장해로 환산할 경우에는 장해기간을 잔여 가동기간으로 나누는 방법이나 2분의 1을 적용하는 방법을 사용한다.\n\nⅤ. 결론\n장해 평가의 시점은 장해의 성질에 따라 다르므로, 상병별로 고정 시점을 판단하여야 한다.`},
      {q:"노동능력상실률의 평가에서 고려하여야 할 요소를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n노동능력상실률은 장해로 인하여 종전의 노동능력을 상실한 비율을 말하며 일실수익 산정의 기초가 된다.\n\nⅡ. 의학적 요소\n1. 장해평가표에 따른 신체장해의 정도. 맥브라이드표나 국가배상법 시행령의 기준이 사용된다.\n2. 관절운동 범위, 근력, 신경학적 결손 등 객관적 검사 결과\n3. 영구장해인지 한시장해인지 여부\n\nⅢ. 사회적·경제적 요소\n1. 피해자의 연령\n2. 교육 정도\n3. 직업의 성질과 경력\n4. 기능의 숙련 정도\n5. 직종의 전환 가능성\n\nⅣ. 복합장해의 처리\n여러 부위에 장해가 있으면 단순 합산하지 아니하고 상실률이 큰 것부터 순차적으로 적용한다. 조합상실률은 A에 1에서 A를 뺀 값과 B를 곱한 값을 더하여 산출하며 100퍼센트를 넘지 아니한다.\n\nⅤ. 기왕증의 반영\n기왕증이 있는 경우에는 기여도를 판단하여 그 부분을 공제한다. 동일 부위의 기왕장해가 있으면 신규 상실률에서 기존 상실률을 공제하거나 잔존 능력에만 적용한다.\n\nⅥ. 결론\n노동능력상실률은 의학적 평가와 사회적 조건의 종합판단이며, 복합장해와 기왕증의 처리가 실무의 핵심이다.`}

      {h:"만성 폐쇄성 폐질환(COPD)", freq:F(3,[46,48]),
       body:`<p>만성 기관지염, 폐기종, 만성 천식 등 <b>기도 폐쇄</b>로 인한 질환군.</p>
       <ul><li><b>3대 주요 증상</b> — <b>만성 기침, 가래(객담), 호흡곤란(운동 시 악화)</b></li>
       <li><b>가장 흔한 원인 — 흡연(약 80~90%)</b>. 그 밖에 대기오염, 직업성 분진, 알파1-항트립신 결핍</li></ul>
       <div class="why"><span class="h">FEV1이란</span>
       <b>1초간 노력성 호기량</b>. 최대한 들이마신 뒤 힘껏 내쉴 때 <b>첫 1초 동안 내뱉은 공기의 양</b>이다.<br>
       <b>FVC</b>는 노력성 폐활량(전부 내쉰 총량).<br>
       <b>FEV1/FVC</b>가 낮으면 <b>내쉬는 것이 막혀 있다</b>는 뜻이므로 폐쇄성 질환이다. COPD의 진단은 <b>기관지확장제 투여 후 FEV1/FVC &lt; 70%</b>.</div>

       </table></div>
       <div class="calcbox"><b>48회 사례</b> — 흡연력 30갑년, <b>FEV1/FVC 63%</b>, <b>FEV1 45%</b><br>

       → FEV1이 30~49% 구간이므로 <b>제3기(중증 COPD)</b></div>
       <p><b>수면 무호흡증</b> — ① <b>폐쇄성</b>(상기도 폐쇄, 가장 흔함) ② <b>중추성</b>(호흡 노력 자체가 사라짐) ③ <b>혼합형</b>. 진단 검사는 <b>수면다원검사</b>(polysomnography)다.</p>`,
       mnemo:{key:"70 미만이면 막힌 것", how:"<b>FEV1/FVC &lt; 70%</b> = 폐쇄성. 그 다음 <b>FEV1 수치</b>로 1~4기를 나눈다.<br>경계는 <b>80 · 50 · 30</b>."}},

      {h:"그 밖의 심혈관·호흡기 문제", freq:F(2,[45,48]),
       body:`<p><b>가와사키병 (45회 출제)</b> — 원인 불명의 <b>소아 혈관염</b>. <b>38.5℃ 이상의 고열이 5일 이상</b> 지속되면서 다음 5가지 임상기준 중 4가지 이상을 만족하면 진단한다.</p>
       <ol><li><b>양측 결막 충혈</b>(삼출물 없음)</li>
       <li><b>구강·입술의 변화</b> — 딸기혀, 입술의 홍조와 균열</li>

       <li><b>경부 림프절 비대</b>(<b>1.5cm 이상</b>, 대개 편측)</li></ol>

       <p><b>급성 흉통의 감별 (42회 출제)</b> — 심근경색을 제외한 원인</p>

       <tr><td>호흡기</td><td><b>폐색전증</b>, <b>기흉</b>, 폐렴, 흉막염</td></tr>
       <tr><td>소화기</td><td><b>위식도역류질환</b>, 식도경련, 식도파열, 소화성 궤양, 담도·췌장질환</td></tr>
       <tr><td>근골격·기타</td><td>늑연골염, 늑골 골절, <b>대상포진</b>, 공황장애</td></tr>
       </table></div>
       <p><b>심부정맥혈전증</b>은 3단원에서 다루었다. <b>증상</b>(하지의 통증·부종·압통·온감), <b>진단</b>(도플러 초음파·D-dimer), <b>치료</b>(항응고제), <b>예방</b>(조기 보행·압박스타킹·예방적 항응고요법)을 한 세트로 외운다.</p>`,
       mnemo:{key:"결 · 구 · 발 · 사 · 림", how:"가와사키 5기준 — <b>결</b>막충혈 · <b>구</b>강변화 · <b>발</b>진 · <b>사</b>지말단 변화 · <b>림</b>프절 비대. 열은 <b>38.5℃ · 5일</b>, 림프절은 <b>1.5cm</b>."}}

    cards:[
      {f:"협심증의 종류는?", b:"안정형, 불안정형, 변이형(이형성, 관상동맥 연축), 미세혈관 협심증."},
      {f:"불안정형 협심증의 특징적 흉통은?", b:"하루 3번 이상의 심한 흉통이 최근 2개월 이내 발생, 안정 시 흉통이 주로 20분 이상 지속."},

      {f:"가와사키병의 심장 합병증은?", b:"관상동맥류. 심근경색과 돌연사로 이어질 수 있어 면역글로불린을 정주한다."},
      {f:"급성 흉통에서 심근경색 외의 원인은?", b:"대동맥 박리, 폐색전증, 기흉, 심낭염, 위식도역류질환, 식도경련, 늑연골염, 대상포진, 공황장애."}

    quiz:[
      {q:"협심증의 종류를 쓰고, 심근경색증의 진단방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 협심증의 종류\n1. 안정형 협심증 — 관상동맥의 고정된 협착으로 노작 시 흉통이 발생하고 안정하면 수분 내에 소실된다.\n2. 불안정형 협심증 — 안정 시에도 발생하고 빈도와 강도가 증가하며 급성 관동맥증후군에 속한다.\n3. 변이형 협심증 — 관상동맥의 연축에 의하여 발생하며 주로 새벽이나 안정 시에 나타난다.\n4. 미세혈관 협심증 — 관상동맥 조영술에서 유의한 협착이 없이 미세혈관의 기능장애로 발생한다.\n\nⅡ. 심근경색증의 진단\n1. 임상 증상 — 20분 이상 지속되는 심한 흉통, 방사통, 식은땀, 오심\n2. 심전도 — ST분절의 상승, T파의 역전, 비정상적 Q파의 출현이 시간 순서로 나타난다.\n3. 심근효소 — 크레아틴키나아제와 그 동종효소인 CK-MB가 2일에서 3일간 상승하고, 트로포닌은 약 2시간 내에 신속히 상승하여 2주간 지속되며, 마이오글로빈은 가장 빨리 상승하여 약 5일간 지속된다.\n4. 심초음파 — 국소 벽운동의 이상\n5. 관상동맥 조영술 — 확진과 동시에 치료가 가능하다.\n6. 심근 관류 스캔\n\nⅢ. 진단의 기준\n심근 손상의 표지자인 트로포닌의 상승과 함께 허혈의 증거인 증상, 심전도 변화, 영상소견 중 하나가 있으면 심근경색으로 진단한다.\n\nⅣ. 결론\n트로포닌과 심전도가 진단의 두 축이며, 심전도 변화의 시간적 순서를 함께 기재하여야 한다.`},
      {q:"급성 관동맥증후군에 관하여 (1) 불안정형 협심증의 특징적인 흉통 (2) 전형적인 Q파 심근경색의 심전도 소견을 시간 순서대로 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 불안정형 협심증의 특징적 흉통\n1. 하루에 3회 이상 나타나는 심한 흉통이 최근 2개월 이내에 새로 발생한 경우\n2. 안정 시에 발생하는 흉통으로 주로 20분 이상 지속되는 경우\n3. 기존의 협심증이 빈도, 강도, 지속시간에서 점차 악화되는 경우\n4. 경미한 노작에도 유발되는 경우\n5. 니트로글리세린에 대한 반응이 저하된 경우\n\nⅡ. 전형적인 Q파 심근경색의 심전도 소견\n1. 초급성기 — T파가 크고 뾰족해지며 이어서 ST분절이 상승한다.\n2. 급성기 — ST분절 상승이 지속되면서 T파가 역전되기 시작한다.\n3. 아급성기 이후 — ST분절이 서서히 기저선으로 회복되고 비정상적 Q파가 출현한다. Q파는 심근의 괴사를 의미하며 영구적으로 남는다.\n\nⅢ. 임상적 의의\n1. ST분절 상승 심근경색은 즉시 재관류 치료가 필요하다.\n2. Q파의 출현은 관통성 경색을 시사하며 예후와 좌심실 기능 저하의 지표가 된다.\n\nⅣ. 결론\nST분절 상승, T파 역전, Q파 출현의 순서를 시간 축으로 서술하는 것이 이 문제의 답이다.`},
      {q:"만성 폐쇄성 폐질환의 주요 증상과 폐기능검사의 해석을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n만성 기관지염, 폐기종, 만성 천식 등 기도의 폐쇄로 인한 질환군으로 비가역적인 기류제한을 특징으로 한다.\n\nⅡ. 3대 주요 증상\n1. 만성적인 기침\n2. 가래\n3. 운동 시 악화되는 호흡곤란\n\nⅢ. 원인\n흡연이 약 80퍼센트에서 90퍼센트를 차지하며, 그 밖에 대기오염, 직업성 분진, 알파1-항트립신 결핍이 있다.\n\nⅣ. 폐기능검사의 해석\n1. FEV1은 1초간 노력성 호기량으로, 최대한 흡기한 후 힘껏 내쉴 때 첫 1초 동안 배출되는 공기의 양이다.\n2. FVC는 노력성 폐활량으로 전부 내쉰 총량이다.\n3. FEV1을 FVC로 나눈 비가 기관지확장제 투여 후에도 70퍼센트 미만이면 비가역적 기류제한으로 만성 폐쇄성 폐질환으로 진단한다.\n4. 중증도는 정상 예측치에 대한 FEV1의 비율로 나누어 80퍼센트 이상은 경증, 50퍼센트에서 79퍼센트는 중등증, 30퍼센트에서 49퍼센트는 중증, 30퍼센트 미만은 매우 심함으로 분류한다.\n\nⅤ. 적용의 예\nFEV1을 FVC로 나눈 값이 63퍼센트이고 FEV1이 정상 예측치의 45퍼센트이면 만성 폐쇄성 폐질환에 해당하며 제3기 중증에 속한다.\n\nⅥ. 결론\n먼저 비율로 폐쇄성 여부를 판단하고 다음으로 FEV1의 절대 비율로 중증도를 나누는 두 단계가 해석의 핵심이다.`},
      {q:"심장 판막의 역할과 4개 판막의 명칭 및 위치를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 판막의 역할\n1. 혈액이 한 방향으로만 흐르도록 하여 역류를 방지한다.\n2. 심장의 수축기와 이완기에 맞추어 개폐됨으로써 효율적인 펌프 기능을 가능하게 한다.\n3. 심방과 심실, 심실과 대혈관 사이의 압력 차를 유지한다.\n\nⅡ. 4개 판막의 명칭과 위치\n1. 삼첨판 — 우심방과 우심실 사이\n2. 폐동맥판 — 우심실과 폐동맥 사이\n3. 승모판(이첨판) — 좌심방과 좌심실 사이\n4. 대동맥판 — 좌심실과 대동맥 사이\n\nⅢ. 판막질환\n1. 협착 — 판막이 충분히 열리지 아니하여 혈류가 방해된다.\n2. 폐쇄부전 — 판막이 완전히 닫히지 아니하여 역류가 발생한다.\n\nⅣ. 진단\n청진에서 심잡음이 들리고 심초음파로 협착의 정도와 역류량을 정량적으로 평가한다.\n\nⅤ. 결론\n판막은 혈류의 방향을 지키는 문이며, 우심계와 좌심계에 각각 두 개씩 존재한다.`},
      {q:"뉴욕심장학회(NYHA) 기능분류의 정의와 등급별 기준을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 정의\n심부전 환자의 기능적 상태를 증상이 유발되는 신체 활동의 정도에 따라 네 등급으로 분류한 것으로, 중증도의 평가와 치료방침의 결정, 예후의 판단에 사용된다.\n\nⅡ. 등급과 기준\n1. Class Ⅰ — 신체 활동에 제한이 없다. 일상적인 신체 활동으로 과도한 피로, 심계항진, 호흡곤란이 발생하지 아니한다.\n2. Class Ⅱ — 신체 활동에 약간의 제한이 있다. 안정 시에는 편안하나 일상적인 신체 활동으로 피로, 심계항진, 호흡곤란이 발생한다.\n3. Class Ⅲ — 신체 활동에 현저한 제한이 있다. 안정 시에는 편안하나 일상적인 활동보다 적은 활동으로도 증상이 발생한다.\n4. Class Ⅳ — 어떠한 신체 활동도 불편함 없이 수행할 수 없다. 안정 시에도 심부전의 증상이 있고 활동하면 증상이 심해진다.\n\nⅢ. 특징과 한계\n증상에 기초한 주관적 분류이므로 관찰자에 따라 차이가 있을 수 있고, 심초음파의 좌심실 구혈률 등 객관적 지표와 함께 평가하여야 한다.\n\nⅣ. 손해사정에서의 의의\n심장 기능 장해의 평가에서 NYHA 분류와 객관적 검사 결과의 일치 여부를 확인하여야 한다.\n\nⅤ. 결론\n제한 없음, 일상 활동, 일상보다 적은 활동, 안정 시의 네 단계로 기억하면 된다.`},
      {q:"가와사키병의 임상기준과 심장 합병증을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n원인이 밝혀지지 아니한 급성 전신성 혈관염으로 주로 5세 이하의 소아에게 발생한다.\n\nⅡ. 진단기준\n섭씨 38.5도 이상의 원인 불명의 발열이 5일 이상 지속되면서 다음 다섯 가지 임상양상 중 네 가지 이상을 만족하는 경우 진단한다.\n1. 양측 결막의 충혈로 삼출물은 없다.\n2. 구강과 입술의 변화 — 딸기혀, 입술의 홍조와 균열, 구강점막의 발적\n3. 부정형 발진\n4. 사지 말단의 변화 — 급성기에는 손발의 부종과 홍조, 회복기에는 손발톱 주위의 막양 낙설\n5. 경부 림프절의 비대로 대개 편측성이며 직경 1.5센티미터 이상이다.\n\nⅢ. 심장 합병증\n1. 관상동맥의 확장과 관상동맥류가 대표적이다.\n2. 관상동맥류에서 혈전이 형성되면 심근경색과 돌연사가 발생할 수 있다.\n3. 그 밖에 심근염, 심낭염, 판막 역류, 부정맥\n\nⅣ. 치료\n발병 10일 이내에 면역글로불린을 정주하고 아스피린을 투여하여 관상동맥 합병증을 예방한다. 이후 심초음파로 관상동맥을 추적 관찰한다.\n\nⅤ. 결론\n발열과 다섯 가지 임상기준이 진단의 축이고, 관상동맥류가 예후를 결정한다.`},
      {q:"급성 흉통을 일으킬 수 있는 질환 중 심근경색을 제외한 원인을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 심혈관계 원인\n1. 협심증 — 안정형, 불안정형, 변이형\n2. 대동맥 박리 — 찢어지는 듯한 통증이 등으로 방사되며 응급질환이다.\n3. 심낭염 — 누우면 악화되고 앞으로 숙이면 완화된다.\n4. 심근염, 판막질환, 부정맥\n\nⅡ. 호흡기계 원인\n1. 폐색전증 — 갑작스러운 호흡곤란과 흉막성 통증\n2. 기흉 — 갑작스러운 흉통과 호흡곤란, 환측 호흡음 감소\n3. 폐렴과 흉막염\n4. 폐고혈압\n\nⅢ. 소화기계 원인\n1. 위식도역류질환 — 흉골 뒤 작열감\n2. 식도경련, 식도염, 식도파열\n3. 소화성 궤양, 담석증, 췌장염\n\nⅣ. 근골격계 및 기타\n1. 늑연골염, 늑골 골절, 근육통\n2. 대상포진 — 피부 분절을 따른 통증과 수포\n3. 공황장애 등 정신적 원인\n\nⅤ. 감별의 요령\n생명을 위협하는 원인인 심근경색, 대동맥 박리, 폐색전증, 긴장성 기흉, 식도파열을 먼저 배제한 후 나머지를 감별한다.\n\nⅥ. 결론\n계통별로 나누어 열거하고 치명적 원인을 먼저 배제한다는 원칙을 밝히는 것이 좋은 답안이다.`},
      {q:"심부정맥 혈전증의 증상, 진단, 치료 및 예방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n하지 등의 심부정맥에 혈전이 형성되어 혈류가 폐색되는 질환으로, 골반과 하지의 골절, 장기간의 부동, 수술 후에 호발한다.\n\nⅡ. 증상\n1. 이환된 하지의 통증, 부종, 압통, 발적과 온감\n2. 종아리를 배굴시킬 때 통증이 유발되는 호만 징후\n3. 증상이 비특이적이어서 무증상인 경우도 많다.\n\nⅢ. 진단\n1. 도플러 초음파가 일차적인 검사이다.\n2. D-dimer 검사는 음성이면 배제에 유용하다.\n3. 정맥조영술과 전산화단층 정맥조영술\n\nⅣ. 치료\n1. 항응고요법 — 헤파린으로 시작하여 경구 항응고제를 유지한다.\n2. 광범위한 혈전에는 혈전용해술이나 혈전제거술\n3. 압박스타킹의 착용\n4. 항응고가 금기이거나 재발하는 경우 하대정맥 필터의 삽입\n\nⅤ. 예방\n1. 조기 보행과 발목의 굴신운동\n2. 간헐적 공기압박장치와 압박스타킹\n3. 고위험군에 대한 예방적 항응고요법\n4. 충분한 수분 공급\n\nⅥ. 합병증\n혈전이 유리되어 폐동맥을 폐색하면 폐색전증이 되어 생명을 위협한다.\n\nⅦ. 결론\n증상이 비특이적이므로 위험군에서는 적극적으로 의심하여 초음파를 시행하고, 무엇보다 예방이 중요하다.`},
      {q:"동맥 죽상경화증의 주요 위험인자를 5가지 이상 열거하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 조절할 수 없는 위험인자\n1. 연령 — 남성은 45세 이상, 여성은 55세 이상\n2. 성별 — 남성이 더 높다.\n3. 조기 관상동맥질환의 가족력\n\nⅡ. 조절할 수 있는 위험인자\n4. 흡연\n5. 고혈압\n6. 당뇨병과 인슐린 저항성\n7. 이상지질혈증 — LDL 콜레스테롤의 상승과 HDL 콜레스테롤 40밀리그램퍼데시리터 미만\n8. 비만과 복부비만\n9. 신체활동의 부족\n10. 만성 신질환\n11. 스트레스와 A형 행동유형\n12. 만성 염증 상태\n\nⅢ. 발생 기전\n혈관 내피세포의 손상에 지질과 염증세포가 축적되어 경화반이 형성되고, 이것이 진행하거나 파열되면 혈전이 생겨 혈관을 폐색한다.\n\nⅣ. 손해사정에서의 의의\n위험인자가 다수 존재하면 사고와 무관한 기왕의 혈관질환일 가능성이 높으므로 인과관계 판단에 고려한다.\n\nⅤ. 결론\n조절 가능한 것과 불가능한 것으로 나누어 기술하면 요구 개수를 안정적으로 채울 수 있다.`},
      {q:"수면 무호흡증의 유형과 진단검사를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n수면 중에 호흡이 반복적으로 멈추거나 얕아져 저산소증과 수면의 분절이 일어나는 질환이다.\n\nⅡ. 유형\n1. 폐쇄성 수면 무호흡 — 상기도가 폐쇄되어 호흡 노력은 있으나 기류가 차단된다. 가장 흔하며 비만, 편도 비대, 좁은 상기도와 관련된다.\n2. 중추성 수면 무호흡 — 호흡중추의 이상으로 호흡 노력 자체가 소실된다. 심부전이나 뇌병변과 관련된다.\n3. 혼합형 — 중추성으로 시작하여 폐쇄성으로 이행한다.\n\nⅢ. 증상\n코골이, 수면 중 무호흡의 목격, 주간 졸림, 아침 두통, 집중력 저하\n\nⅣ. 진단검사\n수면다원검사를 시행하여 뇌파, 안구운동, 근전도, 심전도, 호흡기류, 호흡노력, 산소포화도를 동시에 기록하고 무호흡-저호흡 지수를 산출한다.\n\nⅤ. 치료\n체중 감량과 수면자세의 교정, 지속적 양압호흡기, 구강내 장치, 상기도 수술\n\nⅥ. 합병증\n고혈압, 부정맥, 허혈성 심질환, 뇌졸중, 주간 졸림으로 인한 교통사고\n\nⅦ. 결론\n세 가지 유형과 수면다원검사가 답의 핵심이며, 주간 졸림이 사고와 연결될 수 있다는 점도 실무상 의미가 있다.`}
