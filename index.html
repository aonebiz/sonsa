       <tr><td>정상</td><td>5.7% 미만</td><td>100mg/dL 미만</td><td>140mg/dL 미만</td></tr>
       <tr><td><b>당뇨병 전단계</b></td><td><b>5.7~6.4%</b></td><td><b>100~125mg/dL</b></td><td><b>140~199mg/dL</b></td></tr>
       <tr><td><b>당뇨병</b></td><td><b>6.5% 이상</b></td><td><b>126mg/dL 이상</b></td><td><b>200mg/dL 이상</b></td></tr>
       </table></div>
       <p><b>2형 당뇨병의 위험인자 (48회 10가지)</b> — ① <b>BMI 23 이상</b>의 과체중 ② 직계가족의 당뇨병 ③ 공복혈당장애 또는 내당능장애의 기왕력 ④ <b>임신성 당뇨병</b> 또는 <b>4kg 이상 거대아</b> 출산력 ⑤ 고혈압(140/90 이상 또는 약물 치료 중) ⑥ <b>HDL 35mg/dL 미만</b> 또는 <b>중성지방 250mg/dL 이상</b> ⑦ 다낭난소증후군 ⑧ 심혈관질환의 기왕력 ⑨ 신체활동 부족 ⑩ 흑색극세포증 등 인슐린 저항성 관련 상태 ⑪ 45세 이상의 연령 ⑫ 스테로이드 등 약물</p>
       <p><b>만성 합병증</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>구분</th><th>합병증</th></tr>
       <tr><td><b>미세혈관</b></td><td><b>망막병증 · 신병증 · 신경병증</b> (45회가 이 셋을 물었다)</td></tr>
       <tr><td>대혈관</td><td>관상동맥질환, 뇌혈관질환, 말초동맥질환</td></tr>
       </table></div>
       <div class="warn"><b>당뇨망막병증의 2분류</b> — <b>비증식성</b>(미세혈관류·출혈·경성삼출물이 망막 내에 국한)과 <b>증식성</b>(<b>신생혈관</b>이 생겨 유리체 출혈·견인성 망막박리를 일으킨다). 차이는 <b>신생혈관의 유무</b>다.</div>
       <p><b>임신성 당뇨병 (49회 출제)</b></p>
       <ul><li><b>선별검사 시기</b> — 고위험 임산부는 <b>첫 산전 방문 시</b> 즉시, 일반적으로는 임신 <b>24~28주</b></li>
       <li><b>2단계 접근법</b> — 1단계 <b>50g 경구 당부하</b> 후 1시간 혈장포도당 <b>130~140mg/dL 이상</b>이면 2단계로. 2단계 <b>100g 경구 당부하</b> 후 ① 공복 <b>95</b> ② 1시간 <b>180</b> ③ 2시간 <b>155</b> ④ 3시간 <b>140mg/dL</b> 이상 중 <b>2개 이상</b> 충족 시 진단</li></ul>
       <p><b>대사증후군 (46회 출제)</b> — 다음 5가지 중 <b>3가지 이상</b>이면 진단</p>
       <ol><li><b>복부비만</b> — 허리둘레 남자 <b>90cm</b>, 여자 <b>85cm</b> 이상</li>
       <li><b>고중성지방혈증</b> — <b>150mg/dL 이상</b></li>
       <li><b>낮은 HDL</b> — 남자 <b>40</b>, 여자 <b>50mg/dL 미만</b></li>
       <li><b>높은 혈압</b> — <b>130/85mmHg 이상</b> 또는 치료 중</li>
       <li><b>공복혈당</b> — <b>100mg/dL 이상</b> 또는 치료 중</li></ol>`,
       mnemo:{key:"6.5 · 126 · 200 / 90 · 85 · 150 · 130/85 · 100", how:"당뇨 진단은 <b>6.5 · 126 · 200</b> 세 숫자.<br>대사증후군은 <b>허리 90/85 · TG 150 · HDL 40/50 · 혈압 130/85 · 혈당 100</b> 다섯 중 셋."}},

      {h:"소화기 · 비뇨기", freq:F(3,[44,48,49]),
       body:`<p><b>Child-Pugh 분류 (44회 출제)</b> — 만성 간질환의 중증도를 5가지 항목으로 점수화해 A·B·C 등급을 산정한다.</p>
       <ol><li><b>총 빌리루빈</b></li>
       <li><b>혈청 알부민</b></li>
       <li><b>혈액응고검사(프로트롬빈 시간 또는 INR)</b></li>
       <li><b>복수</b></li>
       <li><b>간성 뇌증</b></li></ol>
       <p><b>선종성 용종의 악성화 위험인자 (44회 출제)</b> — ① 선종의 <b>개수가 3개 이상</b> ② 선종의 <b>크기가 10mm 이상</b> ③ <b>관융모선종 또는 융모선종</b>의 조직형 ④ <b>고도의 이형성</b> ⑤ <b>톱니 모양의 선종</b> ⑥ 가족력</p>
       <p><b>만성 신부전 (48회 출제)</b> — 신장 손상이나 기능 저하가 <b>3개월 이상</b> 지속되는 상태.</p>
       <div class="scroller"><table class="mini">
       <tr><th>단계</th><th>사구체여과율(mL/분/1.73㎡)</th></tr>
       <tr><td>1단계</td><td><b>90 이상</b>(신손상의 증거는 있음)</td></tr>
       <tr><td>2단계</td><td><b>60~89</b></td></tr>
       <tr><td>3단계</td><td><b>30~59</b></td></tr>
       <tr><td>4단계</td><td><b>15~29</b></td></tr>
       <tr><td><b>5단계</b></td><td><b>15 미만</b> — 말기 신부전, <b>신대체요법 시작</b></td></tr>
       </table></div>
       <p><b>신대체요법 3가지</b> — <b>혈액투석, 복막투석, 신장이식</b></p>`,
       mnemo:{key:"빌 · 알 · INR · 복 · 뇌", how:"Child-Pugh 5항목 — <b>빌</b>리루빈 · <b>알</b>부민 · <b>INR</b> · <b>복</b>수 · 간성 <b>뇌</b>증.<br>GFR은 <b>90 · 60 · 30 · 15</b>로 끊는다."}},

      {h:"종양 — 8문항이 나왔다", freq:F(3,[42,43,44,45,46,47,49]),
       body:`<p><b>양성종양과 악성종양의 차이 (43회 출제)</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>특성</th><th>양성종양</th><th>악성종양</th></tr>
       <tr><td>성장 속도</td><td>느리다</td><td>빠르다</td></tr>
       <tr><td>성장 양상</td><td><b>팽창성</b>(밀어낸다)</td><td><b>침윤성</b>(파고든다)</td></tr>
       <tr><td>피막</td><td><b>있다</b> — 경계가 명확</td><td><b>없다</b> — 경계가 불분명</td></tr>
       <tr><td>전이</td><td><b>없다</b></td><td><b>있다</b></td></tr>
       <tr><td>재발</td><td>드물다</td><td>흔하다</td></tr>
       <tr><td>세포의 분화</td><td>잘 분화되어 정상세포와 유사</td><td>미분화, 역형성, 핵의 이상</td></tr>
       <tr><td>세포분열</td><td>적다</td><td>많고 비정상 분열상</td></tr>
       <tr><td>전신 영향</td><td>드물다</td><td>악액질, 빈혈, 전신 쇠약</td></tr>
       <tr><td>예후</td><td>양호</td><td>불량</td></tr>
       </table></div>
       <p><b>병기 결정(staging) — TNM (42회 출제)</b></p>
       <ul><li><b>T (Tumor)</b> — 원발종양의 <b>크기와 침윤 깊이</b></li>
       <li><b>N (Node)</b> — <b>국소 림프절</b> 전이의 유무와 범위</li>
       <li><b>M (Metastasis)</b> — <b>원격 전이</b>의 유무</li>
       <li><b>임상적 병기</b> — 수술 전 진찰·영상·내시경 소견으로 결정</li>
       <li><b>병리학적 병기</b> — 수술로 절제한 조직의 현미경 검사로 결정. 더 정확하다</li></ul>
       <p><b>행태코드 (45회 출제)</b> — 국제질병분류 종양편에서 사선 뒤 다섯째 자리</p>
       <div class="scroller"><table class="mini">
       <tr><th>코드</th><th>의미</th></tr>
       <tr><td>/0</td><td>양성 신생물</td></tr>
       <tr><td>/1</td><td>양성·악성 여부가 불확실한 <b>경계성 종양</b></td></tr>
       <tr><td>/2</td><td><b>제자리 신생물(상피내암)</b></td></tr>
       <tr><td>/3</td><td><b>일차성 악성 신생물</b></td></tr>
       <tr><td>/6</td><td><b>이차성(전이된) 악성 신생물</b></td></tr>
       <tr><td>/9</td><td>일차성·이차성 여부가 불확실한 악성 신생물</td></tr>
       </table></div>
       <div class="warn">행태코드는 <b>암 진단비 지급</b>과 직결된다. <b>/3만 일반암</b>이고 <b>/2는 상피내암</b>, <b>/1은 경계성 종양</b>으로 지급률이 다르다. 제3보험의 핵심 논점이기도 하다.</div>
       <p><b>종양표지자 (44회 출제)</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>암</th><th>표지자</th></tr>
       <tr><td>간세포암</td><td><b>AFP</b> (알파태아단백)</td></tr>
       <tr><td>갑상선 수질암</td><td><b>Calcitonin</b></td></tr>
       <tr><td>대장암·폐암</td><td><b>CEA</b></td></tr>
       <tr><td>전립선암</td><td><b>PSA</b></td></tr>
       <tr><td>난소암</td><td><b>CA 125</b></td></tr>
       <tr><td>췌장암·담도암</td><td>CA 19-9</td></tr>
       <tr><td>유방암</td><td>CA 15-3</td></tr>
       </table></div>
       <p><b>국가 암 검진 6종 (43회 출제)</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>암</th><th>검진 방법</th></tr>
       <tr><td>위암</td><td>위내시경(또는 위장조영검사)</td></tr>
       <tr><td>대장암</td><td>분변잠혈검사, 양성 시 대장내시경</td></tr>
       <tr><td>간암</td><td>간초음파 + 혈청 AFP</td></tr>
       <tr><td>유방암</td><td>유방촬영술</td></tr>
       <tr><td>자궁경부암</td><td>자궁경부세포검사</td></tr>
       <tr><td>폐암</td><td>저선량 흉부 CT</td></tr>
       </table></div>
       <p><b>간세포암 감시검사 (49회 출제)</b> — <b>대상</b>은 ① <b>B형 간염</b> 바이러스 보유자 ② <b>C형 간염</b> 바이러스 보유자 ③ <b>간경변증</b> 환자. <b>방법</b>은 <b>간초음파와 혈청 AFP</b>를 <b>6개월마다</b> 시행한다.</p>
       <p><b>갑상선암의 조직학적 분류 (47회 출제)</b> — ① <b>유두암</b>(가장 흔함) ② <b>여포암</b> ③ <b>수질암</b> ④ <b>미분화(역형성)암</b> ⑤ 림프종 ⑥ 저분화암</p>
       <p><b>유방암의 고위험군 (46회 출제)</b> — ① 유방암의 <b>가족력</b>(특히 1촌) ② <b>BRCA1/2 변이</b> ③ <b>이른 초경(12세 이전)과 늦은 폐경(55세 이후)</b> ④ <b>출산 경험이 없거나 30세 이후 첫 출산</b> ⑤ 모유수유를 하지 않은 경우 ⑥ <b>장기간의 호르몬 대체요법</b> ⑦ 비만(특히 폐경 후) ⑧ 음주 ⑨ 이전의 유방암·비정형 증식증 병력 ⑩ 흉부 방사선 조사력</p>`,
       mnemo:{key:"0 양 · 1 경계 · 2 상피내 · 3 악성 · 6 전이", how:"행태코드는 <b>숫자가 커질수록 나쁘다</b>고 외운다. <b>/2는 상피내암, /3부터 일반암</b>.<br>표지자는 <b>간 AFP · 대장폐 CEA · 전립선 PSA · 난소 CA125 · 갑상선수질 칼시토닌</b>."}},

      {h:"안·이비인후, 정신, 그 밖의 단발 출제", freq:F(2,[41,42,43,46]),
       body:`<p><b>백내장 (46회 출제)</b> — 수정체의 혼탁.</p>
       <ul><li><b>후천성의 종류</b> — <b>노인성</b>(가장 흔함), <b>당뇨병성</b>(대사성), <b>외상성</b>, <b>병발성</b>(포도막염 등 안질환에 동반), <b>약물성</b>(스테로이드), 방사선성, <b>후발성</b>(백내장 수술 후 후낭 혼탁)</li>
       <li><b>검사</b> — <b>세극등현미경검사</b>(혼탁의 정도와 위치 파악), 시력검사, 안저검사, 초음파</li></ul>
       <p><b>현훈 (42회 출제)</b> — <b>내이의 구조물</b>은 ① <b>달팽이관(와우)</b> ② <b>전정기관(난형낭·구형낭)</b> ③ <b>반고리관(세반고리관)</b>.<br>
       <b>말초성 현훈의 원인</b> — <b>양성 발작성 체위성 현훈(이석증)</b>, <b>메니에르병</b>, <b>전정신경염</b>, 미로염, 이독성 약물, 외림프 누공</p>
       <div class="warn"><b>중추성과의 감별</b> — 말초성은 어지럼이 심하고 자율신경 증상이 뚜렷하나 신경학적 결손이 없다. 중추성은 어지럼은 덜해도 <b>복시·구음장애·보행실조·안면마비</b> 등 <b>동반 신경증상</b>이 있다.</div>
       <p><b>자살 고위험군 (43회 출제)</b> — ① <b>자살 시도의 기왕력</b>(가장 강력한 예측인자) ② <b>우울증 등 정신질환</b> ③ 알코올·약물 남용 ④ 만성·중증 신체질환과 만성 통증 ⑤ <b>사회적 고립</b>과 독거 ⑥ 최근의 <b>상실 경험</b>(사별·이혼·실직·경제적 파탄) ⑦ 가족의 자살력 ⑧ 고령 남성 ⑨ 자살 수단에의 접근성 ⑩ 충동성·공격성의 성향 ⑪ 수감·법적 문제 ⑫ 학대 피해력</p>
       <div class="warn">자살은 손해사정에서 <b>고의사고 면책</b>과 <b>심신상실 중 자해</b>의 판단으로 이어진다. 정신질환의 병력과 자유로운 의사결정 능력의 유무가 쟁점이다.</div>
       <p><b>아프가 점수 (42회 출제)</b> — 신생아의 상태를 출생 직후 평가하는 5가지 항목: <b>심박수, 호흡 노력, 근긴장도, 자극에 대한 반응(반사 과민성), 피부색</b>. 각 0~2점으로 총 10점.</p>
       <p><b>류마티스 관절염 (47회 출제)</b> — 2010년 ACR/EULAR 기준은 4가지 분류 항목의 점수를 합산한다: ① <b>침범 관절의 수와 크기</b> ② <b>혈청학적 검사</b>(류마티스인자, 항CCP항체) ③ <b>급성기 반응물질</b>(ESR, CRP) ④ <b>증상의 지속기간(6주 기준)</b>. 합산 점수가 <b>6점 이상</b>이면 류마티스 관절염으로 진단한다.</p>`,
       mnemo:{key:"관 · 혈 · 급 · 기", how:"류마티스 ACR/EULAR 4항목 — <b>관</b>절 수 · <b>혈</b>청검사 · <b>급</b>성기 반응물질 · 지속<b>기</b>간(6주). <b>6점 이상</b>이면 진단."}}
    ],
    cards:[

    quiz:[
      {q:"당뇨병의 진단기준과 당뇨병 전단계의 기준을 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 당뇨병의 진단기준\n다음 중 어느 하나에 해당하면 당뇨병으로 진단하며, 명백한 고혈당의 증상이 없는 경우에는 다른 날 반복 검사하여 확인한다.\n1. 당화혈색소가 6.5퍼센트 이상인 경우\n2. 8시간 이상 금식한 상태에서 공복 혈장 혈당이 126밀리그램퍼데시리터 이상인 경우\n3. 75그램 경구 당부하 후 2시간 혈장 혈당이 200밀리그램퍼데시리터 이상인 경우\n4. 다뇨, 다음, 다식, 원인 불명의 체중감소 등 전형적인 증상이 있으면서 무작위 혈장 혈당이 200밀리그램퍼데시리터 이상인 경우\n\nⅡ. 당뇨병 전단계의 기준\n1. 당화혈색소 5.7퍼센트에서 6.4퍼센트\n2. 공복 혈장 혈당 100밀리그램퍼데시리터에서 125밀리그램퍼데시리터, 즉 공복혈당장애\n3. 75그램 경구 당부하 후 2시간 혈장 혈당 140밀리그램퍼데시리터에서 199밀리그램퍼데시리터, 즉 내당능장애\n\nⅢ. 정상의 기준\n공복 혈장 혈당 100밀리그램퍼데시리터 미만, 75그램 경구 당부하 후 2시간 혈장 혈당 140밀리그램퍼데시리터 미만\n\nⅣ. 손해사정에서의 의의\n당뇨병은 계약 전 알릴 의무의 대상이며, 기왕증으로서 상처의 치유 지연, 감염, 무혈성 괴사 등에 영향을 미치므로 진단 시점과 관리 상태를 확인하여야 한다.\n\nⅤ. 결론\n세 가지 수치인 6.5퍼센트, 126, 200을 정확히 기재하는 것이 이 문제의 전부이다.`},
      {q:"당뇨병의 만성 합병증을 분류하고, 당뇨망막병증의 두 가지 종류와 차이를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 만성 합병증의 분류\n1. 미세혈관 합병증 — 당뇨망막병증, 당뇨신병증, 당뇨신경병증\n2. 대혈관 합병증 — 관상동맥질환, 뇌혈관질환, 말초동맥질환\n3. 그 밖에 당뇨발, 감염에 대한 취약성\n\nⅡ. 당뇨신병증\n사구체의 손상으로 미세알부민뇨에서 시작하여 단백뇨와 신기능 저하로 진행하며 말기 신부전의 주요 원인이 된다.\n\nⅢ. 당뇨신경병증\n말초 다발성 신경병증이 가장 흔하며 양측 하지 원위부의 감각이상과 저림으로 시작한다. 자율신경병증도 나타난다.\n\nⅣ. 당뇨망막병증의 두 종류\n1. 비증식성 당뇨망막병증 — 미세혈관류, 망막내 출혈, 경성 삼출물, 면화반이 망막 내에 국한되어 나타나며 신생혈관은 없다.\n2. 증식성 당뇨망막병증 — 망막의 허혈에 반응하여 신생혈관이 생긴다. 신생혈관은 약하여 쉽게 터지므로 유리체 출혈을 일으키고 섬유증식으로 견인성 망막박리와 실명을 초래한다.\n\nⅤ. 차이점\n두 유형을 가르는 결정적 기준은 신생혈관의 유무이며, 증식성은 시력을 위협하므로 범망막 광응고술이나 유리체 절제술이 필요하다.\n\nⅥ. 결론\n미세혈관 합병증 세 가지를 먼저 열거하고 신생혈관의 유무로 망막병증을 나누는 것이 답의 뼈대이다.`},
      {q:"대사증후군의 구성요소와 각 구성요소별 진단기준을 서술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n복부비만과 인슐린 저항성을 바탕으로 여러 대사 이상이 함께 나타나는 상태로, 심혈관질환과 제2형 당뇨병의 위험을 높인다.\n\nⅡ. 구성요소와 진단기준\n1. 복부비만 — 허리둘레가 남자 90센티미터, 여자 85센티미터 이상\n2. 고중성지방혈증 — 중성지방이 150밀리그램퍼데시리터 이상이거나 이에 대한 약물치료 중\n3. 낮은 고밀도지단백 콜레스테롤 — 남자 40밀리그램퍼데시리터 미만, 여자 50밀리그램퍼데시리터 미만이거나 약물치료 중\n4. 높은 혈압 — 수축기 130밀리미터수은주 이상 또는 이완기 85밀리미터수은주 이상이거나 약물치료 중\n5. 공복혈당장애 — 공복혈당이 100밀리그램퍼데시리터 이상이거나 약물치료 중\n\nⅢ. 진단\n위 다섯 가지 중 세 가지 이상을 만족하면 대사증후군으로 진단한다.\n\nⅣ. 임상적 의의\n각 요소가 단독으로는 경미하여도 함께 있으면 위험이 상승적으로 증가하므로 생활습관의 교정이 우선된다.\n\nⅤ. 결론\n다섯 개 항목과 각 기준 수치를 정확히 적고 세 가지 이상이라는 진단 요건을 밝혀야 한다.`},
      {q:"양성종양과 악성종양의 차이점을 5가지 이상 서술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 성장 속도\n양성종양은 대체로 느리게 자라고 악성종양은 빠르게 자란다.\n\nⅡ. 성장 양상\n양성종양은 주위 조직을 밀어내며 팽창성으로 자라고, 악성종양은 주위 조직을 파고들며 침윤성으로 자란다.\n\nⅢ. 피막의 유무\n양성종양은 피막이 있어 경계가 명확하고 절제가 용이하나, 악성종양은 피막이 없어 경계가 불분명하다.\n\nⅣ. 전이\n양성종양은 전이하지 아니하나 악성종양은 림프관과 혈관을 통하여 전이한다.\n\nⅤ. 세포의 분화\n양성종양의 세포는 잘 분화되어 정상세포와 유사하나, 악성종양의 세포는 미분화되고 역형성을 보이며 핵의 크기와 모양이 불규칙하고 핵대세포질 비가 증가한다.\n\nⅥ. 세포분열\n양성종양은 분열상이 적으나 악성종양은 분열상이 많고 비정상적 분열상이 관찰된다.\n\nⅦ. 재발과 전신 영향\n양성종양은 완전 절제하면 재발이 드물고 전신에 미치는 영향이 적으나, 악성종양은 재발이 흔하고 악액질과 빈혈 등 전신 쇠약을 초래한다.\n\nⅧ. 결론\n피막의 유무, 성장 양상, 전이의 유무가 가장 본질적인 차이이다.`},
      {q:"국제 종양 분류의 행태코드 6가지와 그 의미를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n국제질병분류 종양편에서 형태코드의 사선 뒤 다섯째 자리에 표시되는 숫자로, 종양의 생물학적 행태를 나타낸다.\n\nⅡ. 여섯 가지 코드\n1. 사선 영(/0) — 양성 신생물\n2. 사선 일(/1) — 양성인지 악성인지 불확실한 신생물, 즉 경계성 종양\n3. 사선 이(/2) — 제자리 신생물로 상피내암을 말한다. 기저막을 침범하지 아니한 상태이다.\n4. 사선 삼(/3) — 일차성 악성 신생물\n5. 사선 육(/6) — 이차성 악성 신생물로 전이된 암을 말한다.\n6. 사선 구(/9) — 일차성인지 이차성인지 불확실한 악성 신생물\n\nⅢ. 보험실무상의 의의\n1. 암 진단비의 지급 여부와 지급률이 행태코드에 따라 달라진다.\n2. 일반적으로 사선 삼에 해당하는 악성신생물만 일반암으로 취급하고, 사선 이의 제자리암과 사선 일의 경계성 종양은 소액암으로 분류하여 지급률을 달리 정한다.\n3. 따라서 조직검사 결과지의 형태코드를 반드시 확인하여야 한다.\n\nⅣ. 결론\n행태코드는 의학적 분류인 동시에 보험금 산정의 기준이므로 각 숫자의 의미를 정확히 기재하여야 한다.`},
      {q:"암의 병기 결정 방법과 TNM 체계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 병기 결정의 의의\n암의 진행 범위를 체계적으로 기술하는 것으로, 치료방침의 결정과 예후의 예측, 치료 결과의 비교에 사용된다.\n\nⅡ. 임상적 병기와 병리학적 병기\n1. 임상적 병기는 수술 전 신체 진찰, 영상검사, 내시경, 조직검사 등의 소견을 종합하여 결정한다.\n2. 병리학적 병기는 수술로 절제한 조직과 림프절을 현미경으로 검사하여 결정하며 임상적 병기보다 정확하다.\n\nⅢ. TNM 체계\n1. T는 원발종양으로 종양의 크기와 인접 조직으로의 침윤 깊이를 나타낸다.\n2. N은 국소 림프절로 전이된 림프절의 유무, 개수, 위치를 나타낸다.\n3. M은 원격 전이로 다른 장기로의 전이 유무를 나타낸다.\n\nⅣ. 병기의 산정\nT, N, M의 조합에 따라 제1기부터 제4기까지 병기를 부여하며, 원격 전이가 있으면 대개 제4기가 된다.\n\nⅤ. 손해사정에서의 의의\n병기는 암의 중증도와 예후를 나타내는 객관적 지표로서 진단의 확정 시점과 함께 보험금 지급의 근거자료가 된다.\n\nⅥ. 결론\nT는 크기와 깊이, N은 림프절, M은 원격 전이이며 병기는 이 셋의 조합이다.`},
      {q:"주요 암의 종양표지자를 쓰고, 종양표지자의 임상적 활용과 한계를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 주요 종양표지자\n1. 간세포암 — 알파태아단백(AFP)\n2. 갑상선 수질암 — 칼시토닌\n3. 대장암과 폐암 — 암태아성항원(CEA)\n4. 전립선암 — 전립선특이항원(PSA)\n5. 난소암 — CA 125\n6. 췌장암과 담도암 — CA 19-9\n7. 유방암 — CA 15-3\n\nⅡ. 임상적 활용\n1. 고위험군의 선별검사 — 간세포암에서 초음파와 함께 AFP를 사용한다.\n2. 진단의 보조\n3. 치료 반응의 평가와 추적관찰\n4. 재발의 조기 발견\n\nⅢ. 한계\n1. 민감도와 특이도가 충분하지 아니하여 단독으로 진단할 수 없다.\n2. 양성질환이나 염증에서도 상승할 수 있다. 예컨대 CA 125는 자궁내막증과 복막염에서도 상승한다.\n3. 암이 있어도 정상인 경우가 있다.\n\nⅣ. 손해사정에서의 의의\n종양표지자의 상승만으로는 암의 진단이 확정되지 아니하며 조직검사에 의한 병리학적 진단이 원칙이다.\n\nⅤ. 결론\n표지자는 보조적 지표이며 확진은 조직검사라는 원칙을 함께 기재하여야 한다.`},
      {q:"만성 신부전의 단계 구분과 신대체요법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 정의\n신장의 손상 또는 사구체여과율의 감소가 3개월 이상 지속되는 상태를 말한다.\n\nⅡ. 사구체여과율에 따른 5단계\n단위는 밀리리터 매 분 매 1.73제곱미터이다.\n1. 1단계 — 90 이상이면서 신손상의 증거가 있는 경우\n2. 2단계 — 60에서 89\n3. 3단계 — 30에서 59\n4. 4단계 — 15에서 29\n5. 5단계 — 15 미만으로 말기 신부전에 해당한다.\n\nⅢ. 신대체요법을 시작하는 단계\n제5단계에서 시작한다. 요독증의 증상, 조절되지 아니하는 고칼륨혈증, 대사성 산증, 체액 과다가 있으면 앞당길 수 있다.\n\nⅣ. 신대체요법의 종류\n1. 혈액투석\n2. 복막투석\n3. 신장이식\n\nⅤ. 손해사정에서의 의의\n만성 신부전은 장해의 평가 대상이며, 투석의 시작 시점과 이식 여부가 중요한 자료가 된다. 또한 당뇨병과 고혈압이 주된 원인이므로 기왕증의 검토가 필요하다.\n\nⅥ. 결론\n90, 60, 30, 15의 네 경계와 5단계에서의 신대체요법 시작을 기억하면 된다.`},
      {q:"후천성 백내장의 종류와 진단에 필요한 검사를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n수정체가 혼탁해져 시력이 저하되는 질환으로 선천성과 후천성으로 나뉜다.\n\nⅡ. 후천성 백내장의 종류\n1. 노인성 백내장 — 가장 흔하며 연령에 따른 퇴행성 변화이다.\n2. 당뇨병성 백내장 — 대사성 원인에 의한다.\n3. 외상성 백내장 — 안구의 타박이나 관통상, 전기 손상, 방사선에 의한다.\n4. 병발성 백내장 — 포도막염, 녹내장, 망막색소변성 등 다른 안질환에 동반된다.\n5. 약물성 백내장 — 스테로이드의 장기 사용이 대표적이다.\n6. 후발성 백내장 — 백내장 수술 후 남은 후낭이 혼탁해지는 것으로 야그 레이저 후낭절개술로 치료한다.\n\nⅢ. 진단에 필요한 검사\n1. 세극등현미경검사 — 수정체 혼탁의 정도와 위치를 직접 관찰하는 대표적 검사이다.\n2. 시력검사와 굴절검사\n3. 안저검사 — 망막의 상태를 확인한다.\n4. 안압검사\n5. 초음파검사와 각막곡률·안축장 측정 — 인공수정체의 도수 결정에 사용한다.\n\nⅣ. 손해사정에서의 의의\n외상성 백내장은 사고와의 인과관계가 문제되며, 노인성 변화나 당뇨병성 변화가 함께 있으면 기여도를 검토하여야 한다.\n\nⅤ. 결론\n원인별 분류와 세극등현미경검사가 이 문제의 핵심이다.`},
      {q:"자살의 고위험군을 10개 이상 서술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 정신건강 관련 요인\n1. 과거의 자살 시도력 — 가장 강력한 예측인자이다.\n2. 우울증, 조울증 등 기분장애\n3. 조현병 등 정신병적 장애\n4. 알코올 및 약물 남용과 의존\n5. 불안장애와 외상후 스트레스장애\n6. 충동성과 공격성이 높은 성격\n\nⅡ. 신체적 요인\n7. 만성적이고 중증인 신체질환\n8. 만성 통증\n9. 말기 질환의 진단\n\nⅢ. 사회적·환경적 요인\n10. 사회적 고립과 독거\n11. 최근의 상실 경험 — 사별, 이혼, 실직, 경제적 파탄\n12. 가족의 자살력\n13. 자살 수단에 대한 접근이 용이한 환경\n14. 수감 중이거나 법적 문제가 있는 경우\n15. 아동기의 학대 피해력\n16. 고령의 남성\n\nⅣ. 손해사정에서의 의의\n자살은 원칙적으로 고의사고로서 면책이나, 심신상실 등으로 자유로운 의사결정을 할 수 없는 상태에서 자신을 해친 경우에는 보상된다. 따라서 정신질환의 병력, 치료 경과, 사고 당시의 상태를 확인하여야 한다.\n\nⅤ. 결론\n정신건강, 신체질환, 사회적 요인의 세 범주로 나누어 기술하면 요구 개수를 안정적으로 채울 수 있다.\n\n※ 이 주제는 민감한 영역이므로, 실제 사안에서는 유가족의 상황을 배려하여 조사와 면담을 진행하여야 한다.`}

      {r:44,u:"m8",t:"Child-Pugh 분류법의 5가지 평가 항목에 대해서 쓰시오. (10점)",
       a:`Ⅰ. 의의\n만성 간질환 특히 간경변증의 중증도를 평가하여 A, B, C 세 등급으로 분류하는 방법으로, 예후의 예측과 치료방침의 결정, 수술 위험도의 평가에 사용된다.\n\nⅡ. 5가지 평가 항목\n1. 총 빌리루빈 — 간의 배설 기능을 반영한다.\n2. 혈청 알부민 — 간의 합성 기능을 반영한다.\n3. 혈액응고검사(프로트롬빈 시간 또는 INR) — 응고인자의 합성 기능을 반영한다.\n4. 복수 — 없음, 경도, 중등도 이상으로 나눈다.\n5. 간성 뇌증 — 없음, 1~2등급, 3~4등급으로 나눈다.\n\nⅢ. 점수의 산정\n각 항목을 1점에서 3점으로 평가하여 합산하며, 합계 5~6점은 A등급, 7~9점은 B등급, 10~15점은 C등급으로 분류한다.\n\nⅣ. 임상적 의의\n등급이 높을수록 생존율이 낮고 수술의 위험이 크며, 간이식의 적응을 판단하는 자료가 된다.\n\nⅤ. 결론\n배설 기능 하나, 합성 기능 둘, 임상 소견 둘로 구성된다고 기억하면 빠뜨리지 아니한다.`},
      {r:44,u:"m8",t:"선종성 용종(adenomatous polyp)에 있어 악성화 가능성이 높은 위험인자 5개를 쓰시오. (10점)",
       a:`Ⅰ. 선종성 용종의 의의\n대장의 상피에서 기원한 종양성 용종으로 시간이 지나면 대장암으로 진행할 수 있는 전암병변이다.\n\nⅡ. 악성화 위험인자\n1. 선종의 개수가 3개 이상인 경우\n2. 선종의 크기가 10밀리미터 이상인 경우\n3. 조직형이 관융모선종 또는 융모선종인 경우\n4. 고도의 이형성이 관찰되는 경우\n5. 톱니 모양의 선종인 경우\n6. 대장암이나 선종의 가족력이 있는 경우\n7. 절제 후 잔존 병변이 있는 경우\n\nⅢ. 추적관찰\n위험인자가 있는 경우에는 추적 대장내시경의 간격을 짧게 하며, 없는 경우보다 자주 시행한다.\n\nⅣ. 보험실무상의 의의\n선종성 용종은 행태코드 사선 영에 해당하는 양성 신생물이나, 고도 이형성이 동반되면 제자리암으로 분류될 수 있으므로 조직검사 결과지의 기재를 확인하여야 한다.\n\nⅤ. 결론\n개수, 크기, 조직형, 이형성의 정도가 악성화 위험을 결정한다.`},

      {r:44,u:"m8",t:"제시된 암의 진단에 도움이 되는 가장 중요한 종양 표지자를 하나씩 쓰시오. (간세포암/갑상선 수질암/대장암·폐암/전립선암/난소암)", ref:"m8#6"},
      {r:43,u:"m8",t:"국가 암 검진 6개 항목의 이름과 검진 방법에 대해서 서술하시오. (10점)",
       a:`Ⅰ. 국가 암 검진의 6개 항목과 검진 방법\n1. 위암 — 위내시경검사를 원칙으로 하며 필요한 경우 위장조영검사를 시행한다.\n2. 대장암 — 분변잠혈검사를 시행하고 양성인 경우 대장내시경검사를 시행한다.\n3. 간암 — 간초음파검사와 혈청 알파태아단백 검사를 함께 시행한다.\n4. 유방암 — 유방촬영술을 시행한다.\n5. 자궁경부암 — 자궁경부세포검사를 시행한다.\n6. 폐암 — 저선량 흉부 전산화단층촬영을 시행한다.\n\nⅡ. 대상과 주기\n각 암종별로 연령과 위험도에 따라 대상과 검진 주기가 정해져 있으며, 간암은 고위험군을 대상으로 하고 폐암은 흡연력이 많은 고위험군을 대상으로 한다.\n\nⅢ. 의의\n조기 발견을 통하여 사망률을 낮추는 것이 목적이며, 검진 결과는 보험 실무에서 계약 전 알릴 의무와 진단 시점의 판단 자료가 된다.\n\nⅣ. 결론\n여섯 개 암종과 각각의 대표 검사를 짝지어 기재하여야 한다.`},
      {r:49,u:"m8",t:"간세포암종 감시검사 — (1) 대상 환자군 3가지(3점) (2) 검사 방법과 권장 감시 간격(7점)",
       a:`Ⅰ. 감시검사의 의의\n간세포암의 고위험군에서 증상이 나타나기 전에 종양을 조기에 발견하여 근치적 치료의 기회를 확보하기 위한 검사이다.\n\nⅡ. 대상 환자군\n1. B형 간염 바이러스 보유자\n2. C형 간염 바이러스 보유자\n3. 원인을 불문한 간경변증 환자\n\nⅢ. 검사 방법과 감시 간격\n1. 검사 방법 — 간 초음파검사와 혈청 알파태아단백 검사를 병행한다.\n2. 감시 간격 — 6개월마다 시행한다.\n3. 초음파에서 결절이 발견되거나 알파태아단백이 상승하면 역동적 전산화단층촬영이나 자기공명영상으로 정밀검사를 시행한다.\n\nⅣ. 의의\n간세포암은 초기에 증상이 없어 감시검사에 의하여만 조기 발견이 가능하며, 조기 발견 시 절제술이나 국소치료로 근치를 기대할 수 있다.\n\nⅤ. 결론\n대상 세 군과 초음파·AFP·6개월이라는 세 요소가 답의 전부이다.`},
      {r:47,u:"m8",t:"갑상선암의 종류를 조직학적 형태에 따라 5가지 이상 열거하시오. (10점)",
       a:`Ⅰ. 갑상선암의 조직학적 분류\n1. 유두암 — 갑상선암의 대부분을 차지하며 가장 흔하다. 림프절 전이가 흔하나 예후가 좋다.\n2. 여포암 — 혈행성 전이를 하며 뼈와 폐로 전이한다.\n3. 수질암 — 부여포세포에서 기원하며 칼시토닌을 분비한다. 유전성인 경우가 있어 다발성 내분비종양증과 관련된다.\n4. 미분화암(역형성암) — 고령에서 급격히 진행하며 예후가 매우 나쁘다.\n5. 갑상선 림프종\n6. 저분화암\n7. 전이성 갑상선암\n\nⅡ. 분류의 의의\n조직형에 따라 치료방침과 예후가 크게 다르다. 유두암과 여포암은 분화암으로 방사성요오드 치료가 가능하나, 미분화암은 수술과 항암·방사선치료에도 예후가 불량하다.\n\nⅢ. 보험실무상의 의의\n갑상선암은 소액암으로 분류되어 지급률이 달리 정해지는 경우가 많으므로 약관의 규정을 확인하여야 한다.\n\nⅣ. 결론\n유두암, 여포암, 수질암, 미분화암의 네 가지를 축으로 열거하면 된다.`},
      {r:46,u:"m8",t:"유방암의 고위험군에 해당하는 경우를 5가지 이상 열거하시오. (10점)",
       a:`Ⅰ. 유전적 요인\n1. 유방암의 가족력, 특히 1촌 이내의 직계가족\n2. BRCA1 또는 BRCA2 유전자 변이의 보유\n\nⅡ. 호르몬 노출 관련 요인\n3. 이른 초경 — 만 12세 이전\n4. 늦은 폐경 — 만 55세 이후\n5. 출산 경험이 없거나 만 30세 이후의 첫 출산\n6. 모유수유를 하지 아니한 경우\n7. 장기간의 폐경 후 호르몬 대체요법\n8. 경구피임약의 장기 복용\n\nⅢ. 병력 및 생활습관 요인\n9. 이전의 유방암 병력\n10. 비정형 증식증 등 유방의 양성질환 병력\n11. 폐경 후의 비만\n12. 음주\n13. 어린 나이에 받은 흉부 방사선 조사\n14. 치밀유방\n\nⅣ. 선별검사\n고위험군은 일반 권고보다 이른 나이에 더 자주 유방촬영술과 유방 자기공명영상을 시행한다.\n\nⅤ. 결론\n유전, 호르몬 노출, 병력과 생활습관의 세 범주로 나누어 열거하면 개수를 안정적으로 채울 수 있다.`},
      {r:46,u:"m8",t:"백내장 — (1) 후천성으로 발생하는 백내장의 종류 (2) 수정체 혼탁의 정도 및 위치 파악에 필요한 검사 방법 (5점)", ref:"m8#8"},
      {r:42,u:"m8",t:"현훈 — (1) 내이를 이루는 구조물(4점) (2) 내이와 관련된 말초신경성 현훈을 일으키는 질병(6점)",
       a:`Ⅰ. 내이를 이루는 구조물\n1. 달팽이관(와우) — 청각을 담당한다.\n2. 전정기관 — 난형낭과 구형낭으로 이루어지며 직선가속도와 중력을 감지한다.\n3. 반고리관(세반고리관) — 전반고리관, 후반고리관, 외반고리관으로 이루어지며 회전가속도를 감지한다.\n\nⅡ. 말초성 현훈을 일으키는 질병\n1. 양성 발작성 체위성 현훈 — 이석이 반고리관으로 이동하여 발생하며 머리의 위치 변화에 따라 수초에서 1분 이내의 짧은 현훈이 발생한다. 가장 흔하다.\n2. 메니에르병 — 내림프 수종에 의하며 현훈, 변동성 난청, 이명, 이충만감이 반복된다.\n3. 전정신경염 — 바이러스 감염 후 발생하며 수일간 지속되는 심한 현훈이 있으나 청력은 정상이다.\n4. 미로염 — 중이염의 파급으로 현훈과 난청이 함께 나타난다.\n5. 이독성 약물에 의한 전정기능 저하\n6. 외림프 누공 — 외상이나 기압 변화 후 발생한다.\n\nⅢ. 중추성 현훈과의 감별\n말초성은 어지럼이 심하고 자율신경 증상이 뚜렷하나 신경학적 결손이 없다. 중추성은 어지럼의 정도는 덜하여도 복시, 구음장애, 보행실조, 안면마비 등의 신경증상이 동반된다.\n\nⅣ. 결론\n내이의 세 구조물과 대표적 말초성 질환 네 가지를 정확히 기재하고 중추성과의 감별을 덧붙이면 완결된다.`},
      {r:43,u:"m8",t:"자살의 고위험군에 대해서 10개 이상 서술하시오. (10점)", ref:"m8#9"},
      {r:42,u:"m8",t:"아프가점수(APGAR score)를 구성하는 구성요소 5가지에 대해 기술하시오. (10점)",
       a:`Ⅰ. 의의\n출생 직후 신생아의 상태를 신속히 평가하여 소생술의 필요 여부를 판단하기 위한 방법으로, 출생 후 1분과 5분에 시행한다.\n\nⅡ. 구성요소 5가지\n1. 심박수 — 없으면 0점, 분당 100회 미만이면 1점, 100회 이상이면 2점\n2. 호흡 노력 — 없으면 0점, 느리고 불규칙하면 1점, 힘차게 울면 2점\n3. 근긴장도 — 늘어져 있으면 0점, 사지를 약간 굴곡하면 1점, 활발히 움직이면 2점\n4. 자극에 대한 반응(반사 과민성) — 반응이 없으면 0점, 찡그리면 1점, 기침이나 재채기를 하며 울면 2점\n5. 피부색 — 전신이 창백하거나 청색이면 0점, 몸통은 분홍색이나 사지는 청색이면 1점, 전신이 분홍색이면 2점\n\nⅢ. 총점과 해석\n총점은 10점이며 7점 이상은 양호, 4점에서 6점은 중등도의 곤란, 3점 이하는 심한 곤란으로 즉각적인 소생술이 필요하다.\n\nⅣ. 결론\n다섯 항목을 각 0점에서 2점으로 평가하여 합산한다는 구조와 각 항목의 명칭을 정확히 기재하여야 한다.`},
      {r:41,u:"m8",t:"42세 여성의 유즙분비 — (1) 유방검사에 이상이 없을 때 생각할 수 있는 유즙분비의 원인(6점) (2) 유즙분비와 함께 시야장애·두통이 있다면 생각할 수 있는 질병(4점)",
       a:`Ⅰ. 유방에 이상이 없는 경우의 유즙분비 원인\n1. 고프로락틴혈증 — 프로락틴 분비의 증가가 가장 흔한 원인이다.\n2. 약물 — 도파민 길항제인 항정신병약물, 위장관 운동촉진제, 항우울제, 일부 항고혈압제, 에스트로겐\n3. 갑상선 기능저하증 — 갑상선자극호르몬 방출호르몬의 증가가 프로락틴 분비를 자극한다.\n4. 만성 신부전과 간경변 — 프로락틴의 배설 저하\n5. 임신과 수유, 산후 상태\n6. 흉벽의 자극이나 대상포진 등 신경학적 자극\n7. 시상하부 병변으로 도파민의 억제가 소실된 경우\n8. 특발성\n\nⅡ. 유즙분비와 함께 시야장애 및 두통이 있는 경우\n뇌하수체 종양, 특히 프로락틴을 분비하는 뇌하수체 선종(프로락틴종)을 생각하여야 한다.\n\nⅢ. 시야장애가 생기는 이유\n뇌하수체는 시신경교차의 바로 아래에 위치하므로 종양이 커지면 시신경교차를 압박하여 양측 이측 반맹이 발생한다.\n\nⅣ. 진단\n혈청 프로락틴 측정, 갑상선기능검사, 임신검사, 약물 복용력의 확인, 뇌하수체 자기공명영상\n\nⅤ. 결론\n유즙분비의 원인은 고프로락틴혈증이 핵심이며, 시야장애와 두통이 동반되면 뇌하수체 선종을 의심한다.`},
      {r:47,u:"m8",t:"2010년 ACR/EULAR의 류마티스 관절염 진단기준 — (1) 4가지 분류 항목(8점) (2) 진단 가능한 합산 점수(2점)",
       a:`Ⅰ. 진단기준의 구조\n2010년 미국류마티스학회와 유럽류마티스학회가 제시한 기준은 네 가지 분류 항목의 점수를 합산하여 진단한다. 적어도 하나의 관절에 명확한 활막염이 있고 다른 질환으로 설명되지 아니하는 경우에 적용한다.\n\nⅡ. 4가지 분류 항목\n1. 침범된 관절의 수와 크기 — 큰 관절과 작은 관절을 구분하여 개수에 따라 0점에서 5점을 부여한다.\n2. 혈청학적 검사 — 류마티스인자와 항CCP항체의 역가에 따라 0점에서 3점을 부여한다.\n3. 급성기 반응물질 — 적혈구침강속도와 C반응단백의 정상 여부에 따라 0점 또는 1점을 부여한다.\n4. 증상의 지속기간 — 6주를 기준으로 미만이면 0점, 6주 이상이면 1점을 부여한다.\n\nⅢ. 진단 점수\n네 항목의 합산 점수가 6점 이상이면 류마티스 관절염으로 진단한다.\n\nⅣ. 의의\n조기 진단과 조기 치료를 가능하게 하기 위하여 마련된 기준으로, 과거 기준보다 초기 환자의 진단에 유리하다.\n\nⅤ. 결론\n관절, 혈청, 급성기 반응물질, 기간의 네 항목과 6점이라는 기준을 함께 기재하여야 한다.`}
    ]

       a:`Ⅰ. 원칙\n검사의 명칭만으로는 충분한 점수를 받을 수 없고 시행 자세와 조작 방법, 양성 소견을 함께 기재하여야 한다.\n\nⅡ. 기재의 3요소\n1. 검사의 명칭\n2. 시행 자세와 조작 — 환자의 체위, 관절의 각도, 검사자의 손 위치와 가하는 힘의 방향\n3. 양성 소견 — 무엇이 확인되면 양성인지\n\nⅢ. 예시\n1. Lachman 검사 — 앙와위에서 슬관절을 20도에서 30도 굴곡시키고 한 손으로 대퇴골 원위부를 고정한 후 다른 손으로 경골 근위부를 전방으로 당겨 전위의 정도와 종점의 경도를 건측과 비교한다.\n2. 핑켈스테인 검사 — 엄지를 손바닥 안에 넣고 주먹을 쥔 상태에서 손목을 척측으로 편위시키면 요골 경상돌기 부위의 통증이 증가한다.\n3. 맥머레이 검사 — 앙와위에서 슬관절을 최대 굴곡한 후 외회전시키며 신전하면 후내측 관절면에서, 내회전시키며 신전하면 후외측 관절면에서 클릭이 촉지된다.\n4. 팔렌 검사 — 양 손목을 최대한 굴곡하여 마주 댄 상태로 유지하면 정중신경 지배 영역의 저림이 유발된다.\n\nⅣ. 유의사항\n좌우를 비교하는 검사는 반드시 건측과의 비교를 언급하여야 한다.\n\nⅤ. 결론\n명칭, 자세와 조작, 양성 소견의 세 가지를 갖추어야 완결된 답안이 된다.`},
      {q:"손해사정 실무에서 진단서와 영상판독지를 검토할 때 확인하여야 할 사항을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 진단서에서 확인할 사항\n1. 상병명과 질병분류코드 — 상해인지 질병인지, 종양의 경우 행태코드\n2. 발병일 또는 수상일과 진단일\n3. 치료의 내용과 기간, 입원과 통원의 구분\n4. 수술명과 수술일\n5. 향후 치료의 필요성과 예상 기간\n6. 후유장해의 예상 여부와 평가 시점\n\nⅡ. 영상판독지에서 확인할 사항\n1. 촬영일과 촬영 부위, 검사의 종류\n2. 골절선의 유무와 주행, 전위의 정도, 관절면 침범 여부\n3. 급성과 진구성의 감별 소견 — 골수 부종, 골스캔 섭취\n4. 퇴행성 변화의 존부 — 관절 간격 협소, 골극, 연골하골 경화, 추간판의 퇴행\n5. 기왕 병변의 존부 — 오래된 골절, 후종인대 골화증, 골다공증\n6. 건측과의 비교 촬영 여부\n\nⅢ. 상호 대조\n1. 진단서의 상병명이 영상소견과 일치하는지\n2. 호소하는 증상이 영상의 병변과 해부학적으로 대응하는지\n3. 사고의 기전이 그 손상을 일으킬 만한 것인지\n\nⅣ. 판단의 결론\n이상의 검토를 통하여 인과관계의 유무, 기왕증의 기여도, 치료의 적정성, 후유장해의 평가 시점을 결정한다.\n\nⅤ. 결론\n서류의 형식적 확인에 그치지 아니하고 증상, 영상, 사고 기전의 정합성을 검토하는 것이 실무의 핵심이다.`},
      {q:"외상과 질병의 구분이 문제되는 상병을 열거하고 판단방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 문제되는 상병\n1. 회전근개 파열 — 40세 이후 퇴행성 변화가 흔하다.\n2. 반월상 연골 파열 — 외상성은 20대 전후, 퇴행성은 40대 이후에 많다.\n3. 추간판탈출증 — 퇴행성 변화를 바탕으로 한다.\n4. 후종인대 골화증 — 40세 이후의 질병성 병변이다.\n5. 골다공증성 압박골절 — 경미한 외력으로도 발생한다.\n6. 대퇴골두 무혈성 괴사 — 음주와 스테로이드 등 비외상성 원인이 있다.\n7. 아킬레스건 파열과 이두건 파열 — 퇴행성 변화가 선행하는 경우가 많다.\n\nⅡ. 판단방법\n1. 사고의 기전과 외력의 정도 — 그 정도의 힘으로 그 손상이 생길 수 있는가\n2. 영상소견 — 퇴행성 변화의 정도, 급성 병변을 시사하는 골수 부종과 혈종의 유무\n3. 반대측과의 비교 — 양측에 유사한 변화가 있으면 퇴행성을 시사한다.\n4. 사고 전의 증상과 치료 이력\n5. 연령과 직업, 기왕의 위험인자\n6. 주치의의 소견\n\nⅢ. 기여도의 산정\n사고와 기왕증이 함께 작용한 경우에는 의학적 자료를 근거로 사고의 관여도를 산정하고 그 비율만큼 인정한다.\n\nⅣ. 유의사항\n기왕증이 있다는 사정만으로 일률적으로 감액하여서는 아니 되며 구체적 자료로 뒷받침되어야 한다.\n\nⅤ. 결론\n기전, 영상, 병력의 세 축을 종합하여 판단하고 그 근거를 조사보고서에 명시하여야 한다.`},
      {q:"복합장해율의 산정방법을 설명하고, 기왕장해가 있는 경우의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 복합장해율의 산정\n1. 여러 부위에 장해가 있는 경우 각 상실률을 단순 합산하지 아니한다.\n2. 상실률이 큰 장해부터 순차적으로 적용한다.\n3. 산식은 A 더하기 100에서 A를 뺀 값에 B를 곱한 값이며, 장해가 셋 이상이면 같은 방식을 반복한다.\n4. 합계가 100퍼센트를 넘지 아니하도록 한다.\n\nⅡ. 계산의 예\n노동능력상실률이 50퍼센트인 장해와 20퍼센트인 장해가 있는 경우, 50 더하기 100 빼기 50에 20퍼센트를 곱한 10을 더하여 60퍼센트가 된다.\n\nⅢ. 기왕장해가 있는 경우\n1. 다른 부위의 기왕장해 — 잔존 노동능력에만 신규 장해를 적용한다. 즉 100에서 기왕장해율을 뺀 값에 신규 상실률을 곱한다.\n2. 동일 부위의 기왕장해 — 신규 상실률에서 기존 상실률을 공제하는 방법과, 합산한 후 기왕분을 차감하는 방법이 있으며 판례도 두 방식을 인정한 예가 있다.\n\nⅣ. 기왕증 기여도의 적용\n기왕 질환이 현재의 장해에 기여한 부분이 있으면 최종 상실률에 1에서 기여도를 뺀 값을 곱한다.\n\nⅤ. 결론\n순차 적용이 원칙이고, 기왕장해는 부위가 같은지 다른지에 따라 처리가 달라진다는 점을 밝혀야 한다.`},
      {q:"한시장해의 의의와 영구장해로의 환산방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 한시장해의 의의\n일정 기간이 지나면 회복이 예상되는 장해로, 그 기간에 한하여 노동능력의 상실을 인정한다.\n\nⅡ. 판단의 근거\n1. 상병의 성질과 치료 경과\n2. 주치의와 자문의의 소견\n3. 객관적 검사 소견의 추이\n\nⅢ. 영구장해로의 환산\n1. 비례 환산 — 장해기간을 잔여 가동기간으로 나눈 비율을 상실률에 곱한다. 잔여 가동기간은 장해 평가 시점부터 산정한다.\n2. 관행적 방법 — 한시장해율에 2분의 1을 적용하는 방법이 실무에서 사용되기도 한다.\n\nⅣ. 계산의 예\n노동능력상실률 20퍼센트의 장해가 48개월간 지속되고 잔여 가동기간이 120개월이라면, 20퍼센트에 48을 120으로 나눈 값을 곱하여 8퍼센트로 환산한다.\n\nⅤ. 유의사항\n1. 잔여 가동기간의 기산점을 사고일이 아니라 장해 평가 시점으로 하여야 한다.\n2. 한시장해인지 영구장해인지는 의학적 판단이므로 소견의 근거를 확인하여야 한다.\n\nⅥ. 결론\n환산방법에 따라 결과가 달라지므로 적용한 방법과 기산점을 답안에 명시하여야 한다.`},
      {q:"영상검사별 특징과 손해사정에서의 활용을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 단순 방사선검사\n골절과 탈구의 일차 진단, 퇴행성 변화의 확인, 정렬과 변형의 계측에 사용한다. 연부조직 병변과 초기 미세골절은 확인하기 어렵다.\n\nⅡ. 전산화단층촬영\n골절선의 주행, 분쇄의 정도, 관절면의 침범, 척추관 내 골편의 전위를 정확히 본다. 두부 외상의 출혈 감별에 필수적이다.\n\nⅢ. 자기공명영상\n인대, 건, 연골, 추간판, 척수 등 연부조직 병변을 본다. 골수 부종의 유무로 급성 골절과 진구성 골절을 감별하고 초기 무혈성 괴사를 확인한다.\n\nⅣ. 초음파\n건과 인대의 손상, 관절액의 저류, 심부정맥혈전을 실시간으로 확인한다. 검사자의 숙련도에 따라 결과가 달라질 수 있다.\n\nⅤ. 골스캔\n미세골절과 골 대사의 증가를 확인하며 급성 여부의 감별에 유용하다.\n\nⅥ. 부하 방사선촬영과 스캐노그램\n동요관절의 계측과 하지 길이의 계측에 사용하며 반드시 건측과 비교한다.\n\nⅦ. 손해사정에서의 활용\n상병에 대응하는 검사가 시행되었는지, 촬영 시점이 사고와 얼마나 근접한지, 건측 비교가 이루어졌는지를 확인하여 인과관계와 장해를 판단한다.\n\nⅧ. 결론\n골은 X선과 CT, 연부조직은 초음파와 MRI라는 원칙 위에서 검사의 적정성을 검토한다.`},
      {q:"의학적 소견이 상충하는 경우 손해사정사가 취할 조치를 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 상충이 발생하는 상황\n1. 주치의와 보험회사 자문의의 소견이 다른 경우\n2. 장해율의 평가기준이나 적용 항목이 다른 경우\n3. 기왕증 기여도에 관한 판단이 다른 경우\n\nⅡ. 취할 조치\n1. 자료의 보완 — 진료기록 일체, 영상자료 원본, 검사 결과를 확보하여 근거를 대조한다.\n2. 평가기준의 확인 — 어느 장해평가표를 적용하였는지, 평가 시점이 적절한지를 확인한다.\n3. 객관적 검사와의 정합성 검토 — 근전도, 부하 촬영, 영상소견이 소견을 뒷받침하는지 확인한다.\n4. 제3의 의료기관에 의한 신체감정 또는 공동 감정의 실시\n5. 필요한 경우 분쟁조정 또는 소송절차에서의 신체감정\n\nⅢ. 유의사항\n1. 어느 한쪽 소견만을 근거로 결론을 내려서는 아니 되며 판단의 근거를 문서로 남긴다.\n2. 피보험자에게 절차와 결과를 충분히 설명한다.\n3. 감정의 선정과 절차의 공정성을 확보한다.\n\nⅣ. 결론\n상충하는 소견은 자료의 보완과 객관적 검사와의 대조를 통하여 좁히고, 그래도 해소되지 아니하면 중립적 감정절차를 거치는 것이 원칙이다.`},
      {q:"골다공증의 진단기준과 골다공증성 골절의 특징을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 골다공증의 의의\n골량이 감소하고 골의 미세구조가 나빠져 골절의 위험이 증가하는 질환이다.\n\nⅡ. 진단기준\n1. 검사방법 — 이중에너지 X선 흡수계측법(DXA)이 가장 널리 사용된다.\n2. 기준 — T-score가 마이너스 2.5 이하이면 골다공증, 마이너스 1.0에서 마이너스 2.5 사이이면 골감소증, 마이너스 1.0 이상이면 정상으로 판정한다.\n3. 골다공증성 골절이 이미 발생하였다면 골밀도와 무관하게 골다공증으로 진단한다.\n\nⅢ. 골다공증성 골절의 특징\n1. 경미한 외상, 즉 서 있는 높이 이하에서 넘어지는 정도의 힘으로도 발생한다.\n2. 호발 부위는 척추, 대퇴 경부 및 전자부, 요골 원위부, 상완골 근위부이다.\n3. 고령의 여성에게 많으며 재골절의 위험이 높다.\n4. 내고정물의 고정력이 유지되기 어려워 치료가 까다롭다.\n\nⅣ. 손해사정에서의 의의\n1. 경미한 외력으로 골절이 발생한 경우 골다공증의 기여도를 검토한다.\n2. 골밀도 검사 결과는 기왕증 관여도 산정의 핵심 근거가 된다.\n\nⅤ. 결론\nDXA와 T-score 마이너스 2.5라는 기준, 그리고 네 곳의 호발 부위를 함께 기재하여야 한다.`},
      {q:"노동능력상실률 평가에 사용되는 장해평가표의 종류와 특징을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 맥브라이드 장해평가표\n1. 직업별 계수를 사용하여 옥내와 옥외 노동을 구분하는 것이 특징이다.\n2. 손해배상 실무에서 오랫동안 사용되어 왔으며 판례도 이를 널리 인용한다.\n3. 한계 — 오래된 기준이어서 현대의 직업 분류와 의학 수준을 반영하지 못하는 부분이 있다.\n\nⅡ. 국가배상법 시행령의 신체장해 등급표\n1. 등급별로 노동능력상실률을 정하고 있다.\n2. 국가배상 사건에서 적용된다.\n\nⅢ. 산업재해보상보험법의 장해등급\n1. 제1급부터 제14급까지 구분하고 등급별 급여일수를 정한다.\n2. 재해보상의 산정에 사용된다.\n\nⅣ. 보험약관의 장해분류표\n1. 제3보험 등 인보험에서 신체 부위별로 지급률을 정한다.\n2. 손해배상의 노동능력상실률과는 별개의 기준이므로 혼용하여서는 아니 된다.\n\nⅤ. 적용상의 유의점\n1. 사안의 성격에 맞는 기준을 선택하고 답안에 그 근거를 밝힌다.\n2. 같은 장해라도 기준에 따라 수치가 다르므로 혼합하여 적용하지 아니한다.\n3. 의학적 평가에 더하여 연령, 교육, 직업, 경력 등 사회적 조건을 참작한다.\n\nⅥ. 결론\n손해배상은 맥브라이드 등 노동능력상실률 기준을, 보험금 지급은 약관의 장해분류표를 적용한다는 구분이 가장 중요하다.`},

       a:`Ⅰ. 출제의 경향\n1. 9개년 91문항을 분석하면 근골격계가 약 43퍼센트, 신경계가 약 13퍼센트, 심혈관·호흡기가 약 12퍼센트를 차지한다.\n2. 나열형 문제가 가장 많고 수치 기준을 묻는 문제가 그 다음이다.\n\nⅡ. 학습전략\n1. 근골격계를 골절의 기초, 상지, 하지, 척추로 나누어 우선 학습한다.\n2. 손상 부위마다 위치, 이루는 관절, 손상 유형, 주변 신경과 혈관, 증상과 치료, 합병증의 순서로 정리한다.\n3. 신경계와 심혈관·호흡기를 보완적으로 학습하여 출제 편중에 대비한다.\n4. 내과계는 진단기준의 수치를 중심으로 정리한다.\n\nⅢ. 답안 작성의 원칙\n1. 소문항의 번호를 그대로 옮겨 적는다.\n2. 나열은 번호를 붙여 명칭과 한 줄 설명의 형태로 기재한다.\n3. 요구한 개수를 정확히 채운다.\n4. 검사를 묻는 경우 자세와 조작, 양성 소견을 함께 적는다.\n5. 수치 기준이 있는 항목은 반드시 숫자를 적는다.\n6. 해부학적 명칭은 구체적 명칭으로 국문과 영문을 병기한다.\n\nⅣ. 시간 배분\n10문항 100점에 대하여 문항당 평균 9분을 배정하고, 아는 문제부터 풀어 확실한 점수를 먼저 확보한다.\n\nⅤ. 결론\n의학이론은 이해보다 정리와 암기가 점수를 만드는 과목이며, 빈출 영역에 시간을 집중하는 것이 합격의 지름길이다.`}

    quiz:[
      {q:"제3보험의 의의와 특성을 설명하고, 생명보험 및 손해보험과 비교하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n제3보험은 사람의 질병, 상해 또는 이로 인한 간병에 관하여 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 보험으로, 생명보험과 손해보험의 성격을 겸유한다.\n\nⅡ. 종류\n1. 상해보험\n2. 질병보험\n3. 간병보험\n\nⅢ. 특성\n1. 보상방식의 이중성 — 후유장해보험금이나 진단비와 같이 약정한 금액을 지급하는 정액보상과, 실손의료보험과 같이 실제로 부담한 의료비를 보상하는 실손보상이 함께 존재한다.\n2. 피보험이익 — 정액보상 부분은 피보험이익의 개념이 적용되지 아니하나 실손보상 부분은 이득금지의 원칙이 적용된다.\n3. 중복보험 — 정액보상은 각 계약에서 전액 지급되나 실손보상은 다수보험 비례분담이 적용된다.\n4. 대위 — 정액보상에는 보험자대위가 인정되지 아니하나 실손의료비에는 인정될 수 있다.\n\nⅣ. 겸영\n생명보험회사와 손해보험회사가 모두 영위할 수 있다.\n\nⅤ. 결론\n제3보험은 하나의 증권 안에 정액보상과 실손보상이 혼재하므로, 사안에서 어느 성질의 담보인지를 먼저 가려 처리방법을 결정하여야 한다.`},
      {q:"실손의료보험의 세대별 보장구조를 비교하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 구세대(제1·2세대)\n1. 입원은 급여와 비급여를 합산하여 80퍼센트를 보상하고, 자기부담금이 연간 200만원을 초과하는 부분은 보험가입금액을 한도로 전액 보상한다.\n2. 통원은 정액공제와 정률공제 중 큰 금액을 공제하며 회당 한도가 있다.\n\nⅡ. 제3세대(2017년 4월 이후)\n1. 기본형은 급여와 비급여를 합산하여 보상하고, 도수치료·체외충격파·증식치료, 비급여 주사료, 비급여 자기공명영상진단은 특별약관으로 분리하였다.\n2. 특약의 공제는 2만원과 30퍼센트 중 큰 금액이다.\n3. 특약별로 연간 한도와 횟수가 정해져 있다.\n\nⅢ. 제4세대(2021년 7월 이후)\n1. 급여는 80퍼센트, 비급여는 70퍼센트를 보상한다.\n2. 비급여 전체를 특별약관으로 분리하였다.\n3. 3대 비급여 특약의 공제는 3만원과 30퍼센트 중 큰 금액이다.\n4. 비급여 이용량에 따라 보험료가 할인·할증된다.\n\nⅣ. 제5세대\n1. 급여의 공제에 건강보험 본인부담률이 추가되어 1만원, 20퍼센트, 본인부담률 중 큰 금액을 공제한다.\n2. 비급여를 중증과 비중증으로 구분하여 비중증 질병비급여는 5만원과 50퍼센트 중 큰 금액을 공제한다.\n3. 비중증 질환의 증식치료 등은 보상하지 아니한다.\n\nⅤ. 실무상 유의점\n같은 사고라도 계약의 세대에 따라 보험금이 전혀 달라지므로, 계약일자를 먼저 확인하여 적용 약관을 특정하여야 한다.\n\nⅥ. 결론\n세대 구분은 제3보험 실무의 출발점이며, 공제방식과 보상비율의 차이가 그 핵심이다.`},
      {q:"실손의료보험 표준약관상 '입원'의 정의를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 정의\n입원이란 의사가 피보험자의 질병 또는 상해로 인하여 치료가 필요하다고 인정한 경우로서, 자택 등에서 치료가 곤란하여 병원, 의원 또는 요양원 등에 입실하여 계속하여 6시간 이상 체류하면서 의사의 관찰 및 관리 하에 치료를 받는 것을 말한다.\n\nⅡ. 요건\n1. 의사의 치료 필요성 인정\n2. 자택 등에서의 치료가 곤란할 것\n3. 의료기관에 입실할 것\n4. 계속하여 6시간 이상 체류할 것\n5. 의사의 관찰과 관리 하에 치료를 받을 것\n\nⅢ. 구별의 실익\n1. 입원의료비와 통원의료비는 보상한도와 공제방식이 다르다.\n2. 입원일당 등 정액담보의 지급 여부가 달라진다.\n3. 6시간 미만의 체류는 통원으로 처리된다.\n\nⅣ. 실무상 쟁점\n1. 낮병동에서의 치료가 입원에 해당하는지\n2. 입원의 필요성이 없음에도 이루어진 이른바 과잉입원의 처리\n3. 동일한 질병으로 여러 차례 입원한 경우 입원기간의 합산 여부\n\nⅤ. 결론\n6시간 이상의 체류와 의사의 관찰·관리라는 두 요건이 입원 여부를 가르는 기준이다.`},
      {q:"제3보험에서 정액보상과 실손보상의 차이를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 정액보상\n1. 의의 — 실제 손해액과 관계없이 약정한 금액을 지급한다.\n2. 해당 담보 — 후유장해보험금, 진단비, 수술비, 입원일당, 사망보험금\n3. 특성 — 피보험이익의 개념이 적용되지 아니하고, 여러 계약이 있으면 각 계약에서 전액이 지급되며, 보험자대위가 인정되지 아니한다.\n\nⅡ. 실손보상\n1. 의의 — 피보험자가 실제로 부담한 의료비를 기준으로 보상한다.\n2. 해당 담보 — 실손의료보험의 입원의료비와 통원의료비\n3. 특성 — 이득금지의 원칙이 적용되어 실제 부담액을 초과하여 보상하지 아니하고, 다수보험이 있으면 비례분담하며, 제3자로부터 배상받은 부분은 보상하지 아니한다.\n\nⅢ. 실무상 차이\n1. 다수계약의 처리 — 정액은 합산 지급, 실손은 안분\n2. 자동차보험이나 산재보험에서 지급받은 부분 — 정액은 영향이 없으나 실손은 공제된다.\n3. 본인부담상한제 환급금 — 실손에서는 보상하지 아니한다.\n\nⅣ. 결론\n하나의 증권 안에 두 성질의 담보가 공존하므로, 담보별로 성질을 가려 처리하여야 한다.`},

      {q:"실손의료보험에서 실제 본인이 부담한 의료비를 기준으로 보상하는 원칙의 예외를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n제4세대 기본형 실손의료보험 표준약관은 피보험자가 실제로 본인이 부담한 의료비를 기준으로 보상한다. 따라서 감면받은 의료비는 보상하지 아니한다.\n\nⅡ. 예외적인 경우\n다음의 경우에는 감면 전의 의료비를 기준으로 보상한다.\n1. 국민건강보험법에서 정한 요양급여 중 본인부담금이 근로소득에 포함되어 처리되는 경우\n2. 「국가유공자 등 예우 및 지원에 관한 법률」에 따라 의료비를 감면받은 경우\n3. 「독립유공자 예우에 관한 법률」에 따라 의료비를 감면받은 경우\n\nⅢ. 취지\n위 경우는 법률에 따른 정책적 감면이거나 이미 소득으로 과세되는 등 피보험자가 실질적으로 부담한 것과 다를 바 없으므로, 감면을 이유로 보상을 배제하면 형평에 반하기 때문이다.\n\nⅣ. 유의사항\n1. 의료기관이 임의로 할인하거나 감면한 금액은 이 예외에 해당하지 아니한다.\n2. 본인부담상한제로 환급받는 금액은 보상하지 아니하는 금액이다.\n\nⅤ. 결론\n원칙은 실제 부담액이나, 법령에 근거한 감면 세 가지는 감면 전 금액을 기준으로 한다.`},
      {q:"제3보험 계산문제의 답안 작성 요령을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 공통 원칙\n계산의 각 단계마다 식을 쓰고 금액을 낸 후 그 근거를 한 줄로 붙인다. 최종 금액만 적으면 부분점수를 받을 수 없다.\n\nⅡ. 후유장해 계산\n1. 신체부위별로 항목을 나눈다.\n2. 각 부위마다 지급률을 적용한 이유를 간략히 기재한다.\n3. 동일부위 원칙, 파생장해, 기왕장해 공제의 적용 여부를 명시한다.\n4. 담보별로 보험금을 산출하고 합산한다.\n\nⅢ. 실손의료비 계산\n1. 계약의 세대를 먼저 특정한다.\n2. 일자별 또는 입원기간별로 나누어 면부책과 금액을 표시한다.\n3. 급여와 비급여, 기본형과 특약을 구분하여 계산한다.\n4. 연간 한도와 횟수 한도의 누적을 별도로 표시한다.\n5. 한도를 초과하면 초과 사실과 실제 지급액을 함께 적는다.\n\nⅣ. 면책 항목의 처리\n지급액이 없는 항목도 생략하지 아니하고 면책의 근거를 기재한다.\n\nⅤ. 다수보험의 처리\n각 계약의 보장책임액을 먼저 산출한 후 안분한다.\n\nⅥ. 결론\n식과 근거를 빠짐없이 적는 것이 이 과목의 득점 방법이며, 면책 사유의 기재도 배점의 일부이다.`},
      {q:"실손의료보험에서 보상하지 않는 대표적인 질병과 그 처리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 전부 면책되는 경우\n1. 치료를 목적으로 하지 아니하는 비만 관련 비용\n2. 외모 개선을 목적으로 한 성형수술\n3. 영양제, 종합비타민제 등 치료와 무관한 투약\n4. 진료와 무관한 제증명료\n5. 인공유산 등 약관이 정한 비용\n6. 식사장애 등 약관이 정한 정신질환 중 보상하지 아니하는 것\n\nⅡ. 급여 부분만 보상하는 경우\n정신 및 행동장애의 상당 부분은 급여에 해당하는 부분만 보상한다. 예컨대 섬망이나 기질성 정신장애 등이 이에 해당한다.\n\nⅢ. 기간의 제한이 있는 경우\n불임 관련 진료와 같이 일정 기간이 지난 후부터 보상하는 항목이 있다.\n\nⅣ. 비급여만 면책되는 경우\n제4세대에서는 비만 관련 비급여는 면책되나 급여에 해당하는 부분은 보상될 수 있다.\n\nⅤ. 계산에서의 처리\n면책 항목은 보험금을 산출하지 아니하되 답안에는 면책의 근거를 반드시 기재하여야 한다. 일부만 보상되는 경우에는 보상되는 부분만 계산한다.\n\nⅥ. 결론\n면책의 범위는 전부 면책, 급여만 보상, 기간 제한의 세 유형으로 나누어 정리하는 것이 효율적이다.`},
      {q:"실손의료보험에서 상급병실료 차액의 보상방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n피보험자가 기준병실이 아닌 상급병실을 사용한 경우 그 차액에 대한 보상을 말한다.\n\nⅡ. 보상방법\n비급여 병실료의 100분의 50을 보상한다. 다만 1일 평균금액 10만원을 한도로 한다.\n\nⅢ. 1일 평균금액의 산출\n입원기간 동안의 비급여 병실료 전체를 총 입원일수로 나누어 산출한다.\n\nⅣ. 계산식\n상급병실료 보상액은 비급여 병실료에 100분의 50을 곱한 금액과 10만원에 입원일수를 곱한 금액 중 작은 금액이다.\n\nⅤ. 계산의 예\n비급여 병실료가 600만원이고 입원일수가 25일이면, 600만원의 50퍼센트인 300만원과 10만원에 25일을 곱한 250만원 중 작은 금액인 250만원을 보상한다.\n\nⅥ. 유의사항\n1. 상급병실료 차액은 비급여 항목이므로 제4세대에서는 비급여 보상 한도와 별도로 위 산식을 적용한다.\n2. 병원의 사정으로 부득이 상급병실을 사용한 경우의 처리는 약관에 따른다.\n\nⅦ. 결론\n50퍼센트와 1일 10만원이라는 두 기준 중 작은 금액을 적용한다는 점이 핵심이다.`},
      {q:"실손의료보험의 다수보험 비례분담 방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 적용요건\n동일한 피보험자가 실손의료보험을 둘 이상 가입하고 있고, 각 계약의 보장책임액을 합한 금액이 보장대상의료비 중 최고액에서 피보험자 부담 공제금액 중 최소액을 차감한 금액을 초과하는 경우에 적용한다.\n\nⅡ. 산식\n각 계약의 보상책임액은 다음과 같이 산출한다.\n(각 계약의 보장대상의료비 중 최고액 − 각 계약의 피보험자 부담 공제금액 중 최소액) × 각 계약별 보장책임액 ÷ 각 계약별 보장책임액을 합한 금액\n\nⅢ. 산출의 순서\n1. 각 계약별로 단독으로 존재하였다면 지급하였을 금액, 즉 보장책임액을 산출한다.\n2. 보장대상의료비 중 최고액과 공제금액 중 최소액을 확인한다.\n3. 위 산식에 따라 각 계약의 부담액을 산출한다.\n4. 각 계약의 보상한도를 적용한다.\n\nⅣ. 계산의 예\n통원의료비 30만원에 대하여 A계약과 B계약의 보장책임액이 각각 10만원이고 공제금액 중 최소액이 6만원이라면, 각 계약은 30만원에서 6만원을 뺀 24만원에 10만원을 20만원으로 나눈 비율을 곱한 12만원을 부담하되 각자의 한도인 10만원을 지급한다.\n\nⅤ. 유의사항\n정액보상 담보에는 비례분담이 적용되지 아니하고 각 계약에서 전액이 지급된다.\n\nⅥ. 결론\n보장책임액의 산출이 선행되어야 하며, 세대가 다르면 보장책임액도 달라진다는 점에 유의하여야 한다.`}
    ],

       <div class="why"><span class="h">약관과 상법 제652조의 차이 (49회 출제)</span>

      {h:"부활과 보험료 납입", freq:F(3,[42,44,46]),
       body:`<p><b>부활(효력회복)</b> — 보험료 미납으로 해지된 계약을 다시 살리는 것.</p>
       <ul><li><b>요건</b> — <b>해지환급금을 받지 않았을 것</b>, <b>해지된 날부터 3년 이내</b>에 청구할 것</li>
       <li><b>납입할 금액</b> — 연체된 보험료 + 이자(<b>평균공시이율 + 1%</b> 범위 내)</li>
       <li><b>준용조항</b> — 부활은 <b>새로운 계약의 체결에 준한다</b>. 따라서 <b>계약 전 알릴의무, 청약철회, 승낙 전 보험사고, 보장개시일(암 90일·감액기간)</b>의 규정이 다시 적용된다</li></ul>
       <div class="warn"><b>부활의 함정</b> — 부활하면 암보험의 <b>90일 보장개시일과 1년 이내 50% 감액</b>이 <b>다시 시작</b>된다. 44회가 이것을 물었다. 부활일을 기준으로 다시 세야 한다.</div>
       <p><b>보험료 납입 최고 (42회 출제)</b></p>
       <ul><li>제2회 이후 보험료가 연체되면 회사는 <b>14일(보험기간이 1년 미만이면 7일) 이상의 기간</b>을 정하여 최고한다</li>
       <li><b>알려야 할 사항</b> — ① 납입최고기간 내에 보험료를 내지 않으면 <b>계약이 해지된다는 내용</b> ② 납입최고기간이 끝나는 날의 <b>다음 날에 해지된다는 내용</b> ③ 납입최고기간 중 보험사고가 발생하면 <b>보장을 받는다는 내용</b></li>
       <li>최고는 <b>계약자(타인을 위한 계약은 그 타인 포함)</b>에게 서면·전화·전자문서 등으로 한다</li></ul>`,
       mnemo:{key:"3년 · 공시+1 · 새계약", how:"부활 3요소 — 해지 후 <b>3년</b> 이내, 이자는 <b>평균공시이율 + 1%</b>, 효과는 <b>새 계약에 준한다</b>(90일·감액 리셋)."}},

      {h:"약관해석의 원칙과 계약의 무효·취소", freq:F(3,[41,46,49]),
       body:`<p><b>약관해석의 3원칙 (41·46회 출제)</b></p>
       <ol><li><b>신의성실의 원칙</b> — 회사는 신의성실의 원칙에 따라 공정하게 해석하여야 하며 계약자에 따라 다르게 해석하지 않는다</li>
       <li><b>작성자 불이익의 원칙</b> — 약관의 뜻이 <b>명백하지 않은 경우</b>에는 <b>계약자에게 유리하게</b> 해석한다</li>
       <li><b>확대해석 금지의 원칙</b> — 보상하지 않는 손해 등 <b>계약자·피보험자에게 불리한 내용</b>은 <b>확대하여 해석하지 않는다</b></li></ol>
       <div class="why"><span class="h">추가로 알아둘 원칙</span>
       <b>개별약정 우선의 원칙</b>(약관과 다른 개별합의가 있으면 그것이 우선), <b>객관적·통일적 해석의 원칙</b>(평균적 고객의 이해가능성을 기준으로 하되 계약자마다 다르게 해석하지 않는다).</div>
       <p><b>계약의 무효 (49회 출제 — 실손 표준약관 제19조)</b></p>
       <ol><li><b>타인의 사망</b>을 보험금 지급사유로 하는 계약에서 <b>피보험자의 서면 동의</b>를 얻지 않은 경우</li>
       <li><b>만 15세 미만자, 심신상실자, 심신박약자</b>를 피보험자로 하여 사망을 보험금 지급사유로 한 경우(심신박약자가 계약 체결 시 의사능력이 있는 경우는 제외)</li>
       <li>계약 체결 시 <b>이미 보험금 지급사유가 발생</b>한 경우(다만 회사가 그 사실을 알고 체결한 경우는 제외)</li>
       <li><b>다수의 계약</b>이 체결되어 있는 등 실제 부담한 의료비를 초과하여 보상받을 목적으로 체결된 경우 등 약관이 정한 사유</li></ol>
       <p><b>사기에 의한 계약 (43회 출제)</b> — 계약자 또는 피보험자가 대리진단, 약물 복용을 수단으로 진단절차를 통과하거나 진단서를 위·변조하는 등 <b>사기에 의하여 계약을 체결한 경우</b>, 회사는 <b>보장개시일부터 5년 이내(사기 사실을 안 날부터 1개월 이내)</b>에 계약을 <b>취소</b>할 수 있다.</p>
       <p><b>위법계약의 해지 (44회 출제)</b> — 금융소비자보호법에 따라, 판매업자가 <b>적합성·적정성 원칙, 설명의무, 불공정영업행위 금지, 부당권유 금지</b>를 위반한 경우, 소비자는 계약 체결일부터 <b>5년 이내</b>이고 위반사실을 안 날부터 <b>1년 이내</b>에 해지를 요구할 수 있다. 회사는 요구를 받은 날부터 <b>10일 이내</b>에 수락 여부를 통지해야 하고, 해지되면 <b>해약환급금이 아니라 이미 납입한 보험료</b>를 돌려준다.</p>`,
       mnemo:{key:"신 · 작 · 확", how:"약관해석 3원칙 — <b>신</b>의성실 · <b>작</b>성자 불이익 · <b>확</b>대해석 금지.<br>위법계약 해지는 <b>5년 · 1년 · 10일</b> 세 숫자."}},

      {h:"보험나이와 서면동의", freq:F(2,[44,45]),
       body:`<p><b>보험나이 (45회 출제)</b></p>
       <div class="calcbox"><b>계산방법</b><br>
       계약일 현재의 실제 만 나이를 기준으로, <b>1년 미만의 단수는 6개월 미만이면 버리고 6개월 이상이면 1년으로 한다.</b> 이후 매년 계약해당일에 1세씩 더한다.<br><br>
       <b>예 (45회)</b> — 생년월일 2001.1.1, 계약일 2022.7.10<br>
       2022년 7월 10일 − 2001년 1월 1일 = <b>21년 6월 9일</b> → 6개월 이상이므로 <b>22세</b><br>
       보험료 = 18만원 + [(22세 − 18세) × 1만원] = <b>22만원</b></div>
       <div class="warn"><b>단서조항의 예외</b> — 계약이 <b>보험나이가 아니라 실제 만 나이</b>를 기준으로 하는 담보(예: 일부 어린이보험, 연금 개시 등)는 예외로 한다. 또한 나이가 잘못 기재된 경우에는 <b>정정</b>하고 그에 따라 보험료를 정산한다.</div>
       <p><b>서면동의와 그 철회 (44회 출제)</b></p>
       <ul><li><b>타인의 사망</b>을 보험금 지급사유로 하는 계약은 계약 체결 시 그 <b>타인의 서면 동의</b>를 얻어야 한다(상법 제731조). 없으면 <b>무효</b>다</li>
       <li><b>철회권</b> — 피보험자는 서면동의를 <b>장래에 향하여 철회</b>할 수 있다. 취지는 <b>피보험자의 인격권·생명 보호</b>와 도덕적 위험의 방지에 있다</li>
       <li><b>효과</b> — 철회하면 그 <b>때부터 계약의 효력이 상실</b>된다. 철회 전에 발생한 사고에는 영향이 없다</li></ul>`,
       mnemo:{key:"6개월이 기준", how:"보험나이 — 만 나이에서 <b>6개월 미만은 버리고 6개월 이상은 올린다</b>. 이후 계약해당일마다 +1세."}}
    ],

    quiz:[
      {q:"계약 전 알릴의무 위반의 요건과 회사가 계약을 해지할 수 없는 경우를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n계약자 또는 피보험자는 청약할 때 청약서에서 질문한 중요한 사항을 사실대로 알려야 하며, 이를 위반하면 회사는 계약을 해지할 수 있다.\n\nⅡ. 중요한 사항\n보험자가 그 사실을 알았더라면 계약을 체결하지 아니하였거나 적어도 같은 조건으로는 체결하지 아니하였을 사항을 말하며, 청약서 질문표에 기재된 사항은 중요한 사항으로 추정된다.\n\nⅢ. 위반의 요건\n1. 계약자 또는 피보험자가 고의 또는 중대한 과실로\n2. 중요한 사항을 알리지 아니하거나 사실과 다르게 알렸을 것\n\nⅣ. 해지할 수 없는 경우\n1. 회사가 계약 당시에 그 사실을 알았거나 과실로 알지 못한 경우\n2. 회사가 그 사실을 안 날부터 1개월이 지났거나, 보장개시일부터 보험금 지급사유가 발생하지 아니하고 2년이 지난 경우. 진단계약에서 질병에 관한 사항은 1년이다.\n3. 계약을 체결한 날부터 3년이 지난 경우\n4. 회사가 보험설계사 등에게 알렸거나, 보험설계사 등이 부실고지를 권유하였거나 고지를 방해한 경우\n5. 진단계약에서 회사가 건강진단을 받게 하고도 알지 못한 경우\n\nⅤ. 인과관계\n해지가 가능한 경우에도 알리지 아니한 사실과 보험사고 사이에 인과관계가 인정되지 아니하면 보험금은 지급하여야 한다.\n\nⅥ. 결론\n사례에서는 위반 여부, 해지 제한사유의 존부, 인과관계의 순서로 검토하여 해지 가능 여부와 보험금 지급 여부를 나누어 결론을 내려야 한다.`},
      {q:"계약 후 알릴의무의 내용과 위반의 효과를 설명하고, 상법 제652조와의 차이를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 약관상 계약 후 알릴의무\n1. 대상 — 직업 또는 직무의 변경, 이륜자동차의 계속적 사용, 위험이 뚜렷이 증가하거나 감소하는 사실\n2. 방법 — 지체 없이 회사에 알리고 보험증권에 확인을 받는다.\n3. 효과 — 회사는 보험료의 증액 또는 감액을 청구하거나 계약을 해지할 수 있다.\n\nⅡ. 위반의 효과\n통지하지 아니한 상태에서 보험사고가 발생하면, 변경 전 요율을 변경 후 요율로 나눈 비율에 따라 보험금을 삭감하여 지급한다.\n\nⅢ. 상법 제652조\n1. 보험기간 중에 사고 발생의 위험이 현저하게 변경 또는 증가된 사실을 안 때에는 지체 없이 보험자에게 통지하여야 한다.\n2. 보험자는 통지를 받은 때부터 1개월 내에 보험료의 증액을 청구하거나 계약을 해지할 수 있다.\n3. 통지의무를 해태한 때에는 보험자는 그 사실을 안 날부터 1개월 내에 계약을 해지할 수 있다.\n\nⅣ. 차이점\n1. 대상의 구체성 — 약관은 직업·직무의 변경 등으로 구체화하였다.\n2. 효과 — 상법은 해지를 정하나 약관은 비례 삭감이라는 완화된 효과를 정한다.\n3. 증명의 정도 — 약관은 정형화된 요율표에 의하나 상법은 위험의 현저한 변경·증가를 개별적으로 증명하여야 한다.\n\nⅤ. 설명의무와의 관계\n약관 조항을 설명하지 아니하였다면 이를 계약의 내용으로 주장할 수 없다. 다만 약관이 상법의 내용을 그대로 반영한 것에 불과한 경우에는 설명의무의 대상이 아니라는 것이 판례의 태도이므로, 상법 제652조에 의한 해지의 가부는 별도로 검토하여야 한다.\n\nⅥ. 결론\n약관과 상법은 요건과 효과가 다르므로 사안에서 어느 근거를 적용하는지에 따라 결론이 달라진다.`},
      {q:"승낙 전 보험사고에서 보장하지 않는 경우를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n회사가 청약을 승낙하기 전에 보험금 지급사유가 발생하였을 때에도, 청약을 승낙하고 제1회 보험료를 받은 경우와 동일하게 보장한다.\n\nⅡ. 취지\n보험료를 이미 수령하였음에도 승낙의 지연이라는 보험자의 사정으로 보장을 배제하는 것은 부당하므로 계약자를 보호하기 위한 규정이다.\n\nⅢ. 보장하지 않는 경우\n1. 계약자 또는 피보험자가 계약 전 알릴의무를 위반하여 회사가 계약을 해지할 수 있는 경우\n2. 진단계약에서 피보험자가 건강진단을 받지 아니한 경우\n3. 약관에서 정한 보장개시일이 도래하지 아니한 경우. 암보험의 보장개시일 90일이 대표적이다.\n4. 회사가 정한 인수기준에 따라 청약을 거절할 사유가 있는 경우\n5. 보험료를 받은 기간 중에 발생한 사고가 아닌 경우\n\nⅣ. 청약을 거절할 사유\n회사의 인수지침상 인수가 불가능한 건강상태나 직업 등을 말하며, 그 존재는 회사가 증명하여야 한다.\n\nⅤ. 결론\n승낙 전 사고는 보장이 원칙이고 위 사유는 예외이므로, 예외에 해당한다는 점은 회사가 증명하여야 한다.`},
      {q:"보험계약의 부활에 관하여 요건과 효과를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n보험료의 납입 연체로 해지된 계약에 대하여 계약자가 청구하고 회사가 승낙함으로써 계약의 효력을 회복시키는 제도이다.\n\nⅡ. 요건\n1. 보험료 미납으로 계약이 해지되었을 것\n2. 계약자가 해지환급금을 받지 아니하였을 것\n3. 해지된 날부터 3년 이내에 부활을 청구할 것\n4. 연체된 보험료와 평균공시이율에 100분의 1을 더한 범위 내의 이자를 납입할 것\n5. 회사의 승낙이 있을 것\n\nⅢ. 효과와 준용조항\n부활은 새로운 계약의 체결에 준하므로 다음 규정이 준용된다.\n1. 계약 전 알릴의무 — 부활 청약 시를 기준으로 다시 부담한다.\n2. 청약철회\n3. 승낙 전 보험사고의 보장\n4. 보장개시일과 감액기간 — 암보험의 90일 보장개시일과 1년 이내 50퍼센트 감액이 부활일을 기준으로 다시 진행된다.\n5. 계약의 무효와 취소에 관한 규정\n\nⅣ. 실무상 유의점\n부활 전 기간에 발생한 사고는 보장되지 아니하며, 부활일부터 보장이 재개된다는 점에서 계속계약과 구별된다.\n\nⅤ. 결론\n부활은 형식상 효력의 회복이나 실질은 새로운 계약이므로, 보장개시일의 재기산이 실무의 핵심 쟁점이다.`},
      {q:"약관해석의 원칙을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 신의성실의 원칙\n회사는 신의성실의 원칙에 따라 공정하게 약관을 해석하여야 하며 계약자에 따라 다르게 해석하지 아니한다.\n\nⅡ. 작성자 불이익의 원칙\n약관의 뜻이 명백하지 아니한 경우에는 계약자에게 유리하게 해석한다. 약관은 보험자가 일방적으로 작성한 것이므로 불명확의 위험을 작성자가 부담하여야 하기 때문이다.\n\nⅢ. 확대해석 금지의 원칙\n회사는 보상하지 아니하는 손해 등 계약자나 피보험자에게 불리한 내용을 확대하여 해석하지 아니한다.\n\nⅣ. 그 밖의 원칙\n1. 개별약정 우선의 원칙 — 약관과 다른 개별적 합의가 있으면 그 합의가 약관에 우선한다.\n2. 객관적·통일적 해석의 원칙 — 평균적 고객의 이해가능성을 기준으로 하되 계약자마다 다르게 해석하지 아니한다.\n3. 수기문언 우선의 원칙\n\nⅤ. 적용의 순서\n먼저 개별약정의 존부를 확인하고, 다음으로 객관적 해석을 시도하며, 그래도 뜻이 명백하지 아니하면 작성자 불이익의 원칙을 적용한다.\n\nⅥ. 결론\n작성자 불이익의 원칙은 최후의 수단이며, 뜻이 명백한 조항에는 적용되지 아니한다는 점에 유의하여야 한다.`},
      {q:"보험계약이 무효가 되는 경우를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n무효란 계약이 성립한 것처럼 보이나 처음부터 법률상의 효력이 발생하지 아니하는 것을 말한다.\n\nⅡ. 무효사유\n1. 타인의 사망을 보험금 지급사유로 하는 계약에서 계약 체결 시까지 피보험자의 서면에 의한 동의를 얻지 아니한 경우\n2. 만 15세 미만자, 심신상실자 또는 심신박약자를 피보험자로 하여 사망을 보험금 지급사유로 한 계약. 다만 심신박약자가 계약을 체결하거나 단체보험의 피보험자가 될 때에 의사능력이 있는 경우에는 그러하지 아니하다.\n3. 계약을 체결할 때 이미 보험금 지급사유가 발생한 경우. 다만 회사가 그 사실을 알고 계약을 체결한 경우에는 그러하지 아니하다.\n4. 실손의료보험에서 다수의 계약을 체결하는 등 실제 부담한 의료비를 초과하여 보상받을 목적으로 계약이 체결된 경우\n\nⅢ. 효과\n1. 계약은 처음부터 효력이 없으므로 보험금 지급의무가 없다.\n2. 회사는 이미 납입한 보험료를 반환한다. 다만 계약자 또는 피보험자에게 고의나 중대한 과실이 있는 경우 등 약관이 정한 때에는 반환하지 아니할 수 있다.\n\nⅣ. 취소와의 구별\n무효는 처음부터 효력이 없으나, 사기에 의한 계약의 취소는 취소권의 행사로 소급하여 효력이 상실되며 보장개시일부터 5년 이내이고 사기 사실을 안 날부터 1개월 이내에 행사하여야 한다.\n\nⅤ. 결론\n무효사유는 주로 피보험자 보호와 도덕적 위험의 방지를 위한 것이며, 초과보상 목적의 다수계약이 실손에서 특히 문제된다.`},
      {q:"위법계약의 해지에 관하여 요건과 절차, 효과를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n금융소비자보호에 관한 법률에 따라 판매업자가 일정한 의무를 위반하여 계약이 체결된 경우 소비자가 그 계약의 해지를 요구할 수 있는 제도이다.\n\nⅡ. 요건\n1. 판매업자가 다음 중 어느 하나를 위반하였을 것\n가. 적합성 원칙\n나. 적정성 원칙\n다. 설명의무\n라. 불공정영업행위의 금지\n마. 부당권유행위의 금지\n2. 계약 체결일부터 5년 이내일 것\n3. 위반사실을 안 날부터 1년 이내일 것\n\nⅢ. 절차\n1. 소비자가 계약 해지를 서면 등으로 요구한다.\n2. 회사는 요구를 받은 날부터 10일 이내에 수락 여부를 통지하여야 하며, 거절하는 경우에는 그 사유를 함께 알려야 한다.\n3. 회사가 정당한 사유 없이 응하지 아니하면 소비자는 계약을 해지할 수 있다.\n\nⅣ. 효과\n1. 계약은 장래에 향하여 해지된다.\n2. 회사는 해약환급금이 아니라 이미 납입한 보험료를 반환한다.\n3. 수수료나 위약금 등 금전의 지급을 요구할 수 없다.\n\nⅤ. 결론\n5년, 1년, 10일의 세 기간과 납입보험료의 반환이라는 효과가 이 제도의 핵심이다.`},
      {q:"타인의 사망보험에서 서면동의와 그 철회권을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 서면동의의 요구\n상법 제731조에 따라 타인의 사망을 보험금 지급사유로 하는 계약에서는 계약 체결 시에 그 타인의 서면에 의한 동의를 얻어야 한다.\n\nⅡ. 취지\n1. 피보험자의 생명에 대한 도덕적 위험의 방지\n2. 피보험자의 인격권 보호\n3. 도박보험의 방지\n\nⅢ. 흠결의 효과\n서면동의를 얻지 아니한 계약은 무효이며, 사후에 동의를 받더라도 무효가 치유되지 아니한다는 것이 판례의 태도이다.\n\nⅣ. 동의의 철회권\n1. 의의 — 피보험자는 서면동의를 장래에 향하여 철회할 수 있다.\n2. 취지 — 동의 당시와 사정이 달라진 경우에도 계속 구속되는 것은 인격권의 보호에 반하기 때문이다.\n3. 요건 — 계약의 효력이 유지되는 동안 피보험자가 회사 또는 계약자에게 철회의 의사를 표시하면 된다.\n4. 효과 — 철회한 때부터 계약은 효력을 상실한다. 철회 전에 발생한 보험사고에는 영향이 없다.\n\nⅤ. 실무상 유의점\n계약자와 피보험자가 다른 계약에서는 동의의 존부와 철회의 유무를 반드시 확인하여야 하며, 철회 시 해약환급금의 처리를 안내하여야 한다.\n\nⅥ. 결론\n서면동의는 유효요건이고 철회는 장래효를 가지므로, 사고 시점과 철회 시점의 선후가 결론을 좌우한다.`},
      {q:"보험나이의 계산방법과 나이가 잘못 기재된 경우의 처리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 보험나이의 계산\n1. 계약일 현재의 실제 만 나이를 기준으로 한다.\n2. 1년 미만의 단수는 6개월 미만이면 버리고 6개월 이상이면 1년으로 한다.\n3. 이후 매년 계약해당일에 1세씩 더한다.\n\nⅡ. 계산의 예\n생년월일이 2001년 1월 1일이고 계약일이 2022년 7월 10일이면 21년 6월 9일이 되어 단수가 6개월 이상이므로 보험나이는 22세이다.\n\nⅢ. 예외\n계약이 실제 만 나이를 기준으로 하도록 정한 경우에는 보험나이를 적용하지 아니한다.\n\nⅣ. 나이가 잘못 기재된 경우\n1. 회사는 나이를 정정하고 그에 따라 보험료를 정산한다.\n2. 실제 나이가 계약 당시 인수 가능한 범위를 벗어난 경우에는 계약이 무효가 될 수 있으나, 무효사유에 해당하지 아니하는 범위에서는 정정으로 처리한다.\n3. 보험료가 과소 납입되었다면 부족분과 이자를 정산하고, 과다 납입되었다면 환급한다.\n\nⅤ. 계산의 예\n연령별 보험료가 18세 18만원에 1세마다 1만원이 가산되는 구조에서 보험나이가 23세에서 22세로 정정되면 보험료는 18만원에 4만원을 더한 22만원이 된다.\n\nⅥ. 결론\n6개월을 기준으로 한 단수 처리가 계산의 핵심이며, 정정 시에는 보험료의 정산이 따른다.`},
      {q:"보험료 납입지체 시의 최고 절차를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n제2회 이후의 보험료가 납입기일까지 납입되지 아니한 경우 회사가 계약을 해지하기 전에 거쳐야 하는 절차이다.\n\nⅡ. 최고기간\n회사는 14일 이상의 기간을 납입최고기간으로 정하여야 한다. 다만 보험기간이 1년 미만인 계약의 경우에는 7일 이상으로 한다.\n\nⅢ. 최고의 상대방\n계약자에게 하여야 하며, 타인을 위한 계약인 경우에는 그 타인에게도 하여야 한다.\n\nⅣ. 알려야 할 사항\n1. 납입최고기간 내에 연체보험료를 납입하지 아니하면 계약이 해지된다는 내용\n2. 납입최고기간이 끝나는 날의 다음 날에 계약이 해지된다는 내용\n3. 납입최고기간 중에 보험금 지급사유가 발생한 경우에는 보장을 받는다는 내용\n\nⅤ. 방법\n서면, 전화, 전자문서 등으로 하며 회사는 최고의 사실을 증명할 수 있어야 한다.\n\nⅥ. 절차 위반의 효과\n적법한 최고 없이 이루어진 해지는 효력이 없으므로 계약은 유지되고 보험금을 지급하여야 한다.\n\nⅦ. 결론\n기간, 상대방, 고지사항의 세 요소를 모두 갖추어야 적법한 최고가 되며, 하나라도 흠결되면 해지가 무효가 된다.`}

      {r:48,u:"t1",t:"설계사 자체제작 안내자료와 금융소비자보호법 제45조 — 심사결과의 적정성 검토",
       a:`Ⅰ. 문제의 소재\n보험설계사가 회사의 심의를 거치지 아니하고 자체 제작한 안내자료를 사용하여 계약이 체결된 경우, 그 효과와 회사의 책임이 문제된다.\n\nⅡ. 관련 규정\n1. 금융소비자보호에 관한 법률 제45조는 금융상품판매대리·중개업자 등이 업무를 수행하는 과정에서 금융소비자에게 손해를 발생시킨 경우 금융상품직접판매업자가 그 손해를 배상할 책임을 지도록 한다. 다만 선임과 업무 감독에 상당한 주의를 하였고 손해 방지를 위하여 노력한 경우에는 그러하지 아니하다.\n2. 보험업법은 보험안내자료의 기재사항과 회사의 심의 절차를 정한다.\n3. 상법 제638조의3과 약관규제법은 약관의 명시·설명의무를 정한다.\n\nⅢ. 사안에의 적용\n1. 설계사가 자체 제작한 안내자료로 실제와 다른 보장내용을 설명하였다면 설명의무 위반 또는 부당권유에 해당할 수 있다.\n2. 회사는 설계사의 사용자로서 금융소비자보호법 제45조에 따른 손해배상책임을 진다. 면책을 주장하려면 선임·감독상의 상당한 주의를 증명하여야 한다.\n3. 설명되지 아니한 약관 조항은 계약의 내용으로 주장할 수 없으므로, 그 조항을 근거로 한 면책이나 감액은 허용되지 아니한다.\n4. 소비자는 위법계약의 해지를 요구할 수도 있다.\n\nⅣ. 심사결과의 적정성\n회사가 설계사의 개인적 일탈이라는 이유만으로 책임을 부정하고 안내자료의 내용과 다른 약관을 그대로 적용하여 보험금을 삭감한 심사결과는 적정하지 아니하다. 설명되지 아니한 조항의 적용 배제와 회사의 사용자책임을 함께 검토하여야 한다.\n\nⅤ. 결론\n회사의 심의를 거치지 아니한 안내자료라 하더라도 회사가 그 책임을 면하는 것은 아니며, 설명의무 위반의 효과와 금융소비자보호법상의 손해배상책임을 모두 고려하여 처리하여야 한다.`},
      {r:47,u:"t1",t:"손해사정 처리결과의 적정성 판단 및 근거(계약 후 알릴의무 관련). (10점)", ref:"t1#1"},
      {r:47,u:"t1",t:"추가검사(재검사)의 의미. (6점)",
       a:`Ⅰ. 의의\n보험금 지급사유의 조사와 확인을 위하여 회사가 이미 제출된 의료자료 외에 별도의 검사를 요구하거나, 제3의 의료기관에서 다시 검사를 받도록 하는 것을 말한다.\n\nⅡ. 근거\n표준약관은 보험금 지급사유의 조사와 확인을 위하여 필요한 경우 계약자, 피보험자 또는 보험수익자의 동의를 얻어 의료기관 등에 대한 조사와 검사를 실시할 수 있도록 정하고 있다.\n\nⅢ. 요건\n1. 제출된 자료만으로는 지급사유나 장해상태의 확인이 곤란할 것\n2. 피보험자 또는 수익자의 동의를 얻을 것\n3. 의료기관의 선정에 관하여 당사자 간 협의를 거칠 것\n\nⅣ. 비용과 기간\n추가검사에 소요되는 비용은 회사가 부담하며, 그 기간은 보험금 지급기일의 계산에서 지급예정일을 통지하여야 하는 사유에 해당할 수 있다.\n\nⅤ. 한계\n1. 합리적 이유 없이 반복적으로 요구하는 것은 허용되지 아니한다.\n2. 피보험자가 정당한 사유 없이 동의하지 아니하면 회사는 그로 인하여 확인하지 못한 범위에서 책임을 지지 아니할 수 있다.\n\nⅥ. 결론\n추가검사는 지급사유의 확인을 위한 절차이며, 동의와 비용부담, 기간의 처리가 실무상 쟁점이 된다.`},

      {h:"지정대리청구서비스 특약", freq:F(2,[41]),

       <div class="warn">치매나 혼수상태처럼 본인이 청구 능력을 잃는 상황을 대비한 제도이므로, <b>사망보험금은 대상이 아니다</b>(수익자가 따로 있기 때문). 이 점이 함정으로 나온다.</div>`,

      {h:"중대사유 해지와 사기", freq:F(3,[46]),
       body:`<p><b>중대사유에 의한 해지</b> — 회사는 다음의 경우 그 사실을 안 날부터 <b>1개월 이내</b>에 계약을 해지할 수 있다.</p>
       <ol><li>계약자, 피보험자 또는 보험수익자가 <b>고의로 보험금 지급사유를 발생</b>시킨 경우</li>
       <li>계약자, 피보험자 또는 보험수익자가 보험금 청구에 관한 <b>서류에 고의로 사실과 다른 것을 기재</b>하였거나 그 서류 또는 증거를 <b>위조 또는 변조</b>한 경우</li></ol>
       <div class="warn"><b>46회의 논점</b> — 진단서를 위·변조한 경우다. 이때 <b>해지의 효력은 장래에 향하여</b> 발생하므로, <b>해지 이전에 이미 발생한 다른 보험사고</b>에 대한 보험금은 지급해야 한다. 다만 <b>위조된 청구 자체</b>는 지급하지 않는다.<br>

      {h:"보험수익자의 확정 — 상속과 대습상속", freq:F(3,[43,47,48,49]),
       body:`<p><b>수익자 지정이 없거나 '법정상속인'인 경우</b> — 민법의 상속순위와 상속분에 따른다.</p>

       a:`Ⅰ. 소멸시효의 기간\n보험금청구권은 3년간 행사하지 아니하면 시효로 소멸한다(상법 제662조).\n\nⅡ. 기산점의 원칙\n원칙적으로 보험사고가 발생한 때부터 진행한다. 다만 객관적으로 보험사고의 발생을 알 수 없었던 사정이 있는 경우에는 그 사실을 알았거나 알 수 있었던 때부터 진행한다는 것이 판례의 태도이다.\n\nⅢ. 지급사유별 기산점\n1. 사망보험금 — 피보험자가 사망한 날\n2. 진단비 — 해당 질병의 진단이 확정된 날\n3. 입원급여금 — 각 입원이 종료된 날. 계속 입원 중인 경우에는 각 지급사유가 발생한 날\n4. 수술급여금 — 수술을 받은 날\n5. 후유장해보험금 — 장해지급률이 확정된 날\n6. 실손의료비 — 의료비를 지출한 날 또는 퇴원한 날\n\nⅣ. 유의사항\n1. 후유장해는 사고일이 아니라 장해가 확정된 날이 기산점이 된다는 점이 중요하다.\n2. 회사가 보험금을 일부 지급하거나 지급을 약속한 경우에는 시효가 중단될 수 있다.\n\nⅤ. 결론\n각 담보의 지급사유가 완성된 날이 기산점이며, 담보별로 그 날이 다르다는 점을 정확히 기재하여야 한다.`},
      {q:"보험금 지급기일과 지연이자의 산정을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 지급기일\n1. 회사는 보험금 청구서류를 접수한 날부터 3영업일 이내에 보험금을 지급한다.\n2. 지급사유의 조사나 확인이 필요한 경우에는 접수 후 10영업일 이내에 지급하되 그 구체적 사유와 지급예정일을 통지한다.\n3. 지급예정일은 원칙적으로 접수일부터 30영업일을 초과할 수 없다.\n\nⅡ. 30영업일을 초과할 수 있는 경우\n1. 소송이 제기된 경우\n2. 분쟁조정이 신청된 경우\n3. 수사기관의 조사가 진행 중인 경우\n4. 해외에서 발생한 보험사고에 대한 조사가 필요한 경우\n5. 계약자 등이 회사의 조사 요청에 동의하지 아니한 경우\n6. 제3자의 의견에 따르기로 한 경우\n\nⅢ. 지연이자\n1. 지급기일의 다음 날부터 지급일까지의 기간에 대하여 이자를 더하여 지급한다.\n2. 지급기일의 다음 날부터 30일 이내의 기간은 보험계약대출이율을 적용한다.\n3. 31일 이후의 기간은 보험계약대출이율에 가산이율을 더하여 적용한다.\n\nⅣ. 지연이자를 지급하지 아니하는 경우\n계약자, 피보험자 또는 수익자의 책임 있는 사유로 지급이 지연된 기간은 제외한다.\n\nⅤ. 결론\n3영업일, 10영업일, 30영업일의 세 기준과 30일을 경계로 한 이율의 차이가 산정의 핵심이다.`},
      {q:"지정대리청구서비스 특약의 적용대상과 지정대리청구인의 자격을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n피보험자가 치매나 혼수상태 등으로 보험금을 직접 청구할 수 없는 사정에 대비하여 미리 대리청구인을 지정하여 두는 특약이다.\n\nⅡ. 적용대상 계약\n계약자와 피보험자 및 보험수익자가 모두 동일한 계약을 대상으로 한다. 다만 사망을 보험금 지급사유로 하는 계약은 제외한다. 사망보험금은 별도의 수익자가 존재하기 때문이다.\n\nⅢ. 지정대리청구인의 자격\n지정 당시 다음 중 어느 하나에 해당하여야 한다.\n1. 피보험자와 동거하거나 피보험자와 생계를 같이하는 피보험자의 가족관계등록부상 배우자\n2. 피보험자와 동거하거나 피보험자와 생계를 같이하는 피보험자의 3촌 이내의 친족\n\nⅣ. 효과\n지정대리청구인이 보험금을 청구하여 지급받은 경우 회사는 그 지급으로써 책임을 면한다.\n\nⅤ. 실무상 유의점\n1. 지정 이후 자격을 상실한 경우에는 변경 지정이 필요하다.\n2. 대리청구인이 여럿인 경우의 처리와 청구권의 남용 방지가 문제된다.\n\nⅥ. 결론\n계약자·피보험자·수익자의 동일성과 배우자 또는 3촌 이내 친족이라는 두 요건이 핵심이다.`},
      {q:"중대사유에 의한 계약 해지의 사유와 효과를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n계약의 기초가 되는 신뢰관계를 파괴하는 중대한 사유가 있는 경우 회사가 계약을 해지할 수 있도록 한 제도이다.\n\nⅡ. 사유\n1. 계약자, 피보험자 또는 보험수익자가 고의로 보험금 지급사유를 발생시킨 경우\n2. 계약자, 피보험자 또는 보험수익자가 보험금 청구에 관한 서류에 고의로 사실과 다른 것을 기재하였거나 그 서류 또는 증거를 위조 또는 변조한 경우\n\nⅢ. 행사\n회사는 그 사실을 안 날부터 1개월 이내에 계약을 해지할 수 있다.\n\nⅣ. 효과\n1. 해지의 효력은 장래에 향하여 발생한다.\n2. 위조 또는 변조된 서류로 청구한 보험금은 지급하지 아니한다.\n3. 해지 이전에 이미 지급사유가 확정된 다른 보험금은 지급하여야 한다.\n4. 해지 시 해약환급금을 지급한다.\n\nⅤ. 사기에 의한 계약의 취소와의 구별\n사기에 의한 계약의 취소는 계약의 체결 단계에서의 기망을 이유로 하며 보장개시일부터 5년 이내에 행사하고 소급하여 효력을 상실시킨다는 점에서, 계약 이후의 사정을 이유로 장래효를 가지는 중대사유 해지와 구별된다.\n\nⅥ. 결론\n답안에서는 해지의 가부, 해당 청구의 부지급, 기왕에 확정된 보험금의 지급이라는 세 갈래로 결론을 정리하여야 한다.`},
      {q:"보험수익자가 지정되지 않은 경우 보험금을 받을 자를 정하는 방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n사망보험금의 수익자를 지정하지 아니하였거나 법정상속인으로 지정한 경우에는 민법의 상속순위와 상속분에 따른다.\n\nⅡ. 상속의 순위\n1. 제1순위 — 피상속인의 직계비속과 배우자\n2. 제2순위 — 직계비속이 없는 경우 직계존속과 배우자\n3. 제3순위 — 위 상속인과 배우자가 없는 경우 형제자매\n4. 제4순위 — 4촌 이내의 방계혈족\n\nⅢ. 상속분\n같은 순위의 상속인이 여럿이면 균분하되, 배우자는 직계비속 또는 직계존속의 상속분에 5할을 가산한다.\n\nⅣ. 대습상속\n상속인이 될 직계비속이나 형제자매가 상속개시 전에 사망하거나 결격자가 된 경우에는 그 직계비속과 배우자가 대신 상속한다. 판례는 동시사망으로 추정되는 경우에도 대습상속을 인정한다.\n\nⅤ. 수익자의 고의\n보험수익자가 고의로 피보험자를 해친 경우에는 그 수익자에 대한 부분만 지급하지 아니하고 다른 수익자의 몫은 지급한다.\n\nⅥ. 수익자의 선사망\n수익자가 피보험자보다 먼저 사망하고 재지정이 없으면 수익자의 상속인이 수익자가 된다.\n\nⅦ. 결론\n순위와 상속분의 확정, 대습상속의 검토, 고의 면책의 개별적용이 배분 문제의 3단계이다.`},
      {q:"보험금 지급사유의 조사와 확인을 위한 회사의 권한과 그 한계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 회사의 권한\n1. 회사는 보험금 지급사유의 조사와 확인을 위하여 필요한 경우 계약자, 피보험자 또는 수익자의 동의를 얻어 의료기관, 국민건강보험공단, 경찰관서 등에 대하여 조사할 수 있다.\n2. 필요한 경우 추가검사나 제3의 의료기관에서의 재검사를 요청할 수 있다.\n\nⅡ. 절차\n1. 조사와 확인에 필요한 기간이 예상되면 지급예정일을 구체적 사유와 함께 통지하여야 한다.\n2. 조사에 소요되는 비용은 회사가 부담한다.\n\nⅢ. 한계\n1. 동의 없는 조사는 허용되지 아니한다.\n2. 합리적 이유 없이 반복적으로 검사를 요구하는 것은 신의칙에 반한다.\n3. 조사기간을 이유로 지급을 부당하게 지연하면 지연이자를 부담한다.\n\nⅣ. 계약자 등의 협조의무\n정당한 사유 없이 조사에 동의하지 아니하여 회사가 지급사유를 확인할 수 없게 된 경우에는 그로 인하여 확인하지 못한 범위에서 회사가 책임을 지지 아니할 수 있다.\n\nⅤ. 결론\n조사권은 동의를 전제로 하며 그 한계를 넘으면 지연이자와 손해배상의 문제가 발생한다.`},
      {q:"보험금 분쟁이 발생한 경우의 해결절차를 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 회사 내부 절차\n1. 민원의 접수와 처리\n2. 손해사정 결과에 대한 이의제기와 재심사\n3. 독립 손해사정사의 선임 요청\n\nⅡ. 금융분쟁조정\n1. 금융감독원에 분쟁조정을 신청할 수 있다.\n2. 조정안을 양 당사자가 수락하면 재판상 화해와 같은 효력이 있다.\n3. 조정 신청 중에는 보험금 지급예정일의 30영업일 한도가 적용되지 아니한다.\n\nⅢ. 소송\n1. 조정이 성립하지 아니하면 민사소송을 제기할 수 있다.\n2. 소송 중에는 신체감정 등 증거조사가 이루어진다.\n\nⅣ. 소멸시효의 관리\n보험금청구권의 소멸시효는 3년이므로 분쟁이 장기화되는 경우 시효의 중단 조치를 취하여야 한다.\n\nⅤ. 손해사정사의 역할\n1. 사실관계와 약관의 해석을 객관적으로 정리한다.\n2. 판단의 근거를 손해사정서에 명시한다.\n3. 계약자에게 절차와 결과를 충분히 설명한다.\n\nⅥ. 결론\n내부 재심사, 분쟁조정, 소송의 순서로 진행되며 각 단계에서 시효의 관리가 중요하다.`},
      {q:"실종선고와 사망보험금의 지급에 관하여 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 실종선고의 의의\n부재자의 생사가 일정 기간 분명하지 아니한 경우 법원이 실종을 선고하여 사망한 것으로 보는 제도이다.\n\nⅡ. 요건과 기간\n1. 보통실종은 부재자의 생사가 5년간 분명하지 아니한 때\n2. 특별실종은 전지에 임한 자, 침몰한 선박에 있던 자, 추락한 항공기에 있던 자, 그 밖에 사망의 원인이 될 위난을 당한 자의 생사가 그 위난이 종료한 후 1년간 분명하지 아니한 때\n\nⅢ. 사망으로 보는 시기\n실종선고를 받은 자는 실종기간이 만료한 때에 사망한 것으로 본다. 선고일이 아니라 기간 만료일이라는 점이 중요하다.\n\nⅣ. 보험금의 지급\n1. 사망으로 간주되는 시점이 보험기간 내이면 사망보험금을 지급한다.\n2. 수익자는 사망 간주 시점을 기준으로 확정한다.\n3. 약관은 관공서의 사고증명서에 의하여 사망이 확인되는 경우에도 지급할 수 있도록 정하는 경우가 있다.\n\nⅤ. 실종선고의 취소\n생존이 확인되어 실종선고가 취소되면 지급한 보험금은 부당이득으로 반환을 청구한다.\n\nⅥ. 결론\n실종기간의 만료일이 사망 간주일이라는 점과 그 시점이 보험기간 내인지가 판단의 핵심이다.`},
      {q:"보험사고가 계약자 또는 피보험자의 고의로 발생한 경우의 처리를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n보험계약자, 피보험자 또는 보험수익자의 고의로 인한 손해는 보상하지 아니한다.\n\nⅡ. 근거\n상법 제659조와 각 약관의 보상하지 아니하는 손해 조항에 따른다. 고의사고를 보상하면 보험의 우연성이 상실되고 도덕적 위험이 조장되기 때문이다.\n\nⅢ. 예외\n1. 피보험자가 심신상실 등으로 자유로운 의사결정을 할 수 없는 상태에서 자신을 해친 경우에는 사망보험금을 지급한다.\n2. 계약의 보장개시일부터 2년이 지난 후에 자살한 경우에는 약관에 따라 사망보험금을 지급한다.\n3. 수익자가 여럿인 경우 고의를 범한 수익자의 몫만 지급하지 아니한다.\n\nⅣ. 증명책임\n고의의 존재는 보험금의 지급을 거절하는 회사가 증명하여야 하며, 자살의 경우에도 자유로운 의사결정 능력의 유무가 쟁점이 된다.\n\nⅤ. 중과실과의 구별\n인보험에서는 중대한 과실로 인한 사고도 보상하는 것이 원칙이므로, 고의와 중과실의 구별이 실무상 중요하다.\n\nⅥ. 결론\n고의는 면책이나 심신상실 상태의 자해와 보장개시 2년 경과 후의 자살은 예외이며, 수익자별 개별적용이 적용된다.`},
      {q:"보험금 청구 서류의 위조·변조가 확인된 경우 손해사정사의 처리방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 사실의 확정\n1. 원본과 대조하여 위조 또는 변조의 사실을 객관적으로 확인한다.\n2. 발급 의료기관에 사실조회를 실시한다.\n3. 누가 어떤 의도로 작성하였는지를 확인한다.\n\nⅡ. 약관의 적용\n1. 보험금 청구에 관한 서류를 고의로 위조 또는 변조한 경우에는 중대사유에 의한 해지사유에 해당한다.\n2. 회사는 그 사실을 안 날부터 1개월 이내에 계약을 해지할 수 있다.\n\nⅢ. 보험금의 처리\n1. 위조된 서류로 청구한 부분은 지급하지 아니한다.\n2. 해지의 효력은 장래에 향하므로 해지 이전에 이미 지급사유가 확정된 다른 보험금은 지급한다.\n3. 이미 지급한 보험금이 위조에 기인한 것이라면 부당이득의 반환을 청구한다.\n\nⅣ. 유의사항\n1. 단순한 착오나 경미한 오기는 고의의 위조·변조와 구별하여야 한다.\n2. 위조의 주체가 계약자·피보험자·수익자가 아닌 제3자인 경우에는 달리 판단하여야 한다.\n3. 형사절차와 별개로 민사상 처리를 진행한다.\n\nⅤ. 결론\n고의성과 주체의 확인이 선행되어야 하며, 해지와 부지급, 기왕 확정된 보험금의 지급을 구분하여 처리하여야 한다.`}

      {h:"사망 직전의 장해 — 47회의 논점", freq:F(2,[47]),
       body:`<div class="why"><span class="h">문제의 구조</span>

       <div class="calcbox"><b>47회 사례</b><br>
       사망 직전 장해 — 60% + 30% = <b>90%</b><br>

    quiz:[
      {q:"상해의 정의와 그 요건을 설명하고, 증명책임의 분배를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 정의\n상해란 급격하고 우연한 외래의 사고로 신체에 입은 손상을 말한다.\n\nⅡ. 요건\n1. 급격성 — 사고가 돌발적으로 발생하여 피보험자가 이를 예측하거나 피할 수 없는 것을 말한다. 서서히 진행되는 질병이나 직업병은 제외된다.\n2. 우연성 — 피보험자가 예견하지 못한 사고일 것을 말한다. 원인이 우연하거나 결과가 우연하거나 그 둘 모두가 우연한 경우 중 어느 하나에 해당하면 인정된다. 고의로 인한 경우는 제외된다.\n3. 외래성 — 신체의 외부로부터 작용한 요인에 의한 것을 말한다. 신체 내부의 질병이 원인인 경우는 제외되나 외부적 요인이 개입한 경우에는 인정될 수 있다.\n\nⅢ. 증명책임의 분배\n1. 급격성, 우연성, 외래성의 세 요건은 보험금을 청구하는 자가 증명하여야 한다.\n2. 고의 등 면책사유는 보험자가 증명하여야 한다.\n3. 판례는 사망의 원인이 불명확한 경우 외래성과 인과관계의 증명 정도를 완화하기도 한다.\n\nⅣ. 실무상 쟁점\n1. 질병이 경합한 경우의 기여도\n2. 사망의 원인이 밝혀지지 아니한 경우의 처리\n3. 지병의 악화와 외부 사고의 구별\n\nⅤ. 결론\n세 요건과 증명책임의 분배가 상해보험 사례의 출발점이며, 요건의 충족과 면책의 존부를 나누어 검토하여야 한다.`},
      {q:"상해보험의 분류를 기준별로 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 보상방법에 따른 분류\n1. 정액보상 상해보험 — 사망보험금, 후유장해보험금, 입원일당과 같이 약정한 금액을 지급한다.\n2. 실손보상 상해보험 — 실제로 부담한 의료비를 보상한다.\n\nⅡ. 담보위험에 따른 분류\n1. 보통상해보험 — 일상생활 중의 모든 상해를 담보한다.\n2. 교통상해보험 — 교통사고로 인한 상해만 담보한다.\n3. 여행상해보험 — 국내 또는 해외 여행 중의 상해를 담보한다.\n4. 직업·직무별 상해보험 — 특정 직업이나 직무 수행 중의 상해를 담보한다.\n\nⅢ. 피보험자의 수에 따른 분류\n1. 개인상해보험\n2. 단체상해보험\n\nⅣ. 보험기간에 따른 분류\n1. 장기상해보험 — 통상 3년 이상으로 만기환급금이 있는 경우가 있다.\n2. 일반상해보험 — 통상 1년 이내의 소멸성 보험\n\nⅤ. 분류의 실익\n담보위험의 범위에 따라 사고가 담보에 해당하는지가 달라지고, 보상방법에 따라 다수보험의 처리와 대위의 인정 여부가 달라진다.\n\nⅥ. 결론\n사안에서는 먼저 가입한 담보의 종류를 특정하고 그 담보의 위험범위에 사고가 포함되는지를 검토하여야 한다.`},
      {q:"상해보험의 면책사유를 설명하고, 자살의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 면책사유\n1. 피보험자가 고의로 자신을 해친 경우\n2. 보험수익자가 고의로 피보험자를 해친 경우. 다만 그 수익자가 보험금의 일부를 받는 자인 경우에는 그 부분에 한한다.\n3. 계약자가 고의로 피보험자를 해친 경우\n4. 전쟁, 외국의 무력행사, 혁명, 내란, 사변, 폭동\n5. 피보험자의 임신, 출산, 산후기. 다만 회사가 보장하는 보험사고로 인한 경우는 제외한다.\n6. 전문등반, 글라이더 조종, 스카이다이빙, 스쿠버다이빙, 행글라이딩, 수상보트, 자동차나 오토바이의 경기 등 위험한 활동 중의 사고\n\nⅡ. 중과실의 처리\n인보험에서는 중대한 과실로 인한 사고도 보상하는 것이 원칙이므로, 중과실은 면책사유가 아니다.\n\nⅢ. 자살의 처리\n1. 원칙 — 고의로 자신을 해친 것이므로 면책된다.\n2. 예외 1 — 피보험자가 심신상실 등으로 자유로운 의사결정을 할 수 없는 상태에서 자신을 해친 경우에는 보상한다.\n3. 예외 2 — 계약의 보장개시일부터 2년이 지난 후에 자살한 경우에는 사망보험금을 지급한다.\n\nⅣ. 판단자료\n정신질환의 병력과 치료 경과, 사고 당시의 행태와 정황, 유서의 존부, 음주나 약물의 영향 등을 종합하여 자유로운 의사결정 능력의 유무를 판단한다.\n\nⅤ. 결론\n고의만이 면책이고 중과실은 보상되며, 자살에는 두 가지 예외가 있다는 점이 핵심이다.\n\n※ 자살은 민감한 주제이므로 실제 사안에서는 유가족의 상황을 배려하여 조사를 진행하여야 한다.`},
      {q:"사망 직전에 장해상태에 있었던 경우 후유장해보험금의 인정 여부를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 문제의 소재\n장해는 치유된 후 신체에 남아 있는 영구적인 훼손상태를 말하므로, 사망으로 치유에 이르지 못한 경우에도 후유장해보험금을 인정할 수 있는지가 문제된다.\n\nⅡ. 약관의 규정\n1. 장해지급률이 상해 발생일 또는 질병의 진단 확정일부터 180일 이내에 확정되지 아니하는 경우에는 그 180일이 되는 날의 의사 진단에 기초하여 고정될 것으로 인정되는 상태를 장해지급률로 결정한다.\n2. 따라서 사망 전에 이미 고정된 장해상태가 의학적으로 인정된다면 후유장해로 평가할 수 있다.\n\nⅢ. 사망보험금과의 관계\n상해사망보험금과 후유장해보험금은 별개의 담보이므로 각각의 지급요건을 충족하면 모두 지급한다.\n\nⅣ. 판단의 자료\n1. 사망 전의 진료기록과 영상자료\n2. 장해상태가 회복 가능성이 없이 고정된 것인지에 관한 의학적 소견\n3. 사망의 원인이 해당 상해인지 여부\n\nⅤ. 산정의 예\n사망 직전의 장해지급률이 60퍼센트와 30퍼센트로 합계 90퍼센트라면, 상해사망보험금과 함께 80퍼센트 이상 후유장해 담보의 보험금을 지급한다.\n\nⅥ. 결론\n장해의 고정 여부가 쟁점이며, 고정이 인정되면 사망보험금과 후유장해보험금이 병존한다.`},
      {q:"신체손해사정사의 업무와 손해사정서의 작성의무를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 손해사정사의 업무\n보험업법은 손해사정사의 업무를 다음과 같이 정한다.\n1. 손해 발생사실의 확인\n2. 보험약관 및 관계 법규 적용의 적정성 판단\n3. 손해액 및 보험금의 사정\n4. 위 업무와 관련된 서류의 작성과 제출의 대행\n5. 위 업무의 수행과 관련된 보험회사에 대한 의견의 진술\n\nⅡ. 신체손해사정사의 업무 범위\n사람의 생명과 신체에 관한 손해액의 사정을 담당한다. 제3보험의 상해·질병·간병 담보, 자동차보험의 대인배상, 근로자재해보상책임보험 등의 인적 손해가 이에 속한다.\n\nⅢ. 손해사정서의 작성과 교부\n1. 손해사정사는 손해사정업무를 수행한 후 지체 없이 손해사정서를 작성하여야 한다.\n2. 보험회사와 계약자, 피보험자, 보험수익자에게 내어 주어야 한다.\n3. 손해사정서에는 손해사정의 근거를 기재하여야 한다.\n\nⅣ. 금지행위\n고의로 진실을 숨기거나 거짓으로 손해사정하는 행위, 정당한 사유 없이 손해사정을 지연하는 행위, 보험금의 대리청구를 통하여 부당한 이익을 취하는 행위 등이 금지된다.\n\nⅤ. 결론\n손해사정사의 업무는 사실의 확인에서 시작하여 보험금의 사정으로 끝나며, 그 근거를 문서로 남기는 것이 법정 의무이다.`},
      {q:"상해보험에서 질병이 경합한 경우의 처리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 문제의 소재\n외래의 사고와 기왕의 질병이 함께 작용하여 사망이나 장해에 이른 경우 상해보험금의 지급 여부와 범위가 문제된다.\n\nⅡ. 약관의 규정\n다수의 약관은 피보험자가 이미 가지고 있던 신체장해 또는 질병의 영향으로 상해가 중하게 된 경우에는 그 영향이 없었을 때에 상당하는 금액을 결정하여 지급한다고 정한다.\n\nⅢ. 판단의 기준\n1. 외래의 사고가 사망이나 장해에 대하여 상당인과관계를 가지는지\n2. 기왕증이 결과의 발생이나 확대에 기여한 정도\n3. 기여도의 산정은 의학적 소견에 근거하여야 한다.\n\nⅣ. 처리\n1. 인과관계가 전혀 인정되지 아니하면 면책이다.\n2. 인과관계가 인정되나 기왕증이 기여한 경우에는 기여도를 공제한 금액을 지급한다.\n3. 기왕장해가 동일 부위에 있으면 장해지급률에서 기왕의 지급률을 공제한다.\n\nⅤ. 유의사항\n약관에 기왕증 감액 조항이 없거나 설명되지 아니한 경우에는 감액을 주장할 수 없다는 점에 유의하여야 한다.\n\nⅥ. 결론\n인과관계의 존부를 먼저 판단하고, 인정되면 기여도의 산정과 기왕장해의 공제를 순서대로 적용한다.`},
      {q:"교통상해와 일반상해의 구별 및 담보의 중복적용을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 일반상해\n일상생활 중에 발생하는 모든 급격하고 우연한 외래의 사고를 담보한다.\n\nⅡ. 교통상해\n1. 의의 — 교통사고로 인한 상해만을 담보한다.\n2. 교통사고의 범위 — 운행 중인 자동차에 탑승 중의 사고, 운행 중인 자동차에 의한 사고, 운행 중인 기타 교통수단에 탑승 중이거나 그에 의한 사고 등을 약관이 정한다.\n3. 도로 통행 중의 사고와 탑승 중의 사고를 구분하여 정하는 경우가 많다.\n\nⅢ. 중복적용\n교통사고로 인한 상해는 일반상해의 요건도 충족하므로, 일반상해 담보와 교통상해 담보에 모두 가입되어 있으면 두 담보에서 각각 보험금이 지급된다. 정액보상이므로 안분하지 아니한다.\n\nⅣ. 산정의 예\n동일한 후유장해에 대하여 일반상해후유장해 담보의 가입금액이 2억원이고 교통상해후유장해 담보의 가입금액이 1억원이라면, 각각의 가입금액에 장해지급률을 곱하여 합산한다.\n\nⅤ. 유의사항\n1. 교통상해의 정의에 해당하는지를 약관으로 확인하여야 한다.\n2. 이륜자동차 운전 중의 사고 등은 별도의 부담보 특약이 있는지 확인하여야 한다.\n\nⅥ. 결론\n교통상해는 일반상해의 하위 개념이므로 요건을 충족하면 두 담보가 함께 적용되며, 담보별로 가입금액을 곱하여 산출한다.`},
      {q:"단체보험의 특성과 보험수익자의 지정에 관하여 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 의의\n하나의 보험계약으로 다수의 피보험자를 일괄하여 담보하는 보험으로, 사업주가 계약자가 되고 근로자가 피보험자가 되는 형태가 일반적이다.\n\nⅡ. 특성\n1. 규약에 따라 체결되는 경우 피보험자 개개인의 서면동의를 요하지 아니한다.\n2. 보험료가 저렴하고 인수심사가 간소하다.\n3. 피보험자의 입사와 퇴사에 따라 구성원이 변동된다.\n\nⅢ. 서면동의의 예외\n단체가 규약에 따라 구성원의 전부 또는 일부를 피보험자로 하는 생명보험계약을 체결하는 경우에는 피보험자의 서면동의를 받지 아니할 수 있다. 다만 보험수익자를 단체 또는 그 대표자로 하는 경우에는 그 구성원의 서면동의를 받아야 한다.\n\nⅣ. 보험수익자의 지정\n1. 근로자 또는 그 유족을 수익자로 하는 것이 원칙적 취지에 부합한다.\n2. 사업주를 수익자로 지정하려면 구성원의 서면동의가 필요하다.\n3. 퇴직 후 발생한 사고는 원칙적으로 담보되지 아니한다.\n\nⅤ. 실무상 쟁점\n1. 규약의 존부와 내용\n2. 피보험자 명부의 관리와 퇴사자의 처리\n3. 수익자 지정의 적법성\n\nⅥ. 결론\n단체보험은 서면동의의 예외가 인정되나 수익자를 단체로 하는 경우에는 동의가 필요하다는 점이 핵심이다.`},
      {q:"상해보험에서 보험자대위가 인정되는지 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 원칙\n상법 제729조는 보험자는 보험사고로 인하여 생긴 보험계약자 또는 보험수익자의 제3자에 대한 권리를 대위하여 행사하지 못한다고 정한다. 인보험에서는 보험자대위가 원칙적으로 금지된다.\n\nⅡ. 취지\n인보험의 보험금은 사람의 생명과 신체에 관한 정액급부로서 손해의 전보가 아니므로, 제3자에 대한 손해배상청구권과 성질이 다르기 때문이다.\n\nⅢ. 예외\n상해보험계약의 경우에 당사자 간에 다른 약정이 있는 때에는 보험자는 피보험자의 권리를 해하지 아니하는 범위에서 그 권리를 대위하여 행사할 수 있다.\n\nⅣ. 실손의료보험에서의 적용\n실손의료비는 실손보상의 성질을 가지므로 약관에 대위에 관한 규정이 있는 경우 보험자대위가 인정될 수 있다. 또한 제3자로부터 배상받은 의료비는 보상하지 아니한다.\n\nⅤ. 한계\n피보험자의 권리를 해하지 아니하는 범위에서만 행사할 수 있으므로, 피보험자가 실제 손해를 전부 전보받기 전에는 대위할 수 없다.\n\nⅥ. 결론\n정액담보는 대위가 인정되지 아니하고 실손담보는 약정이 있으면 인정된다는 구분이 핵심이다.`},
      {q:"상해보험 사례에서 보상책임을 검토하는 순서를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 제1단계 — 계약의 확인\n계약일, 보험기간, 가입담보와 가입금액, 적용 약관의 판, 특약의 부가 여부를 확인한다.\n\nⅡ. 제2단계 — 상해의 성립\n급격성, 우연성, 외래성의 세 요건을 충족하는지 검토한다. 요건의 증명책임은 청구하는 자에게 있다.\n\nⅢ. 제3단계 — 담보의 해당 여부\n일반상해인지 교통상해인지, 약관이 정한 담보위험의 범위에 해당하는지를 확인한다.\n\nⅣ. 제4단계 — 면책사유의 검토\n고의, 위험한 활동, 전쟁 등 면책사유의 존부를 검토한다. 면책사유의 증명책임은 보험자에게 있다.\n\nⅤ. 제5단계 — 고지·통지의무의 검토\n계약 전 알릴의무와 계약 후 알릴의무의 위반 여부, 해지 가능 여부, 인과관계를 검토한다.\n\nⅥ. 제6단계 — 보험금의 산정\n담보별로 가입금액에 지급률을 곱하여 산출하고 기왕장해의 공제와 한도를 적용한다.\n\nⅦ. 제7단계 — 수익자의 확정\n사망보험금의 경우 수익자를 확정하고 상속분에 따라 배분한다.\n\nⅧ. 결론\n계약 확인, 상해의 성립, 담보 해당, 면책, 고지·통지, 산정, 배분의 순서를 지키면 어떤 사례든 누락 없이 처리할 수 있다.`}

      {q:"장해의 정의와 장해지급률의 확정시기를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 장해의 정의\n장해란 상해 또는 질병에 대하여 치유된 후 신체에 남아 있는 영구적인 정신 또는 육체의 훼손상태 및 기능상실 상태를 말한다. 질병과 부상의 주된 증상이 치유된 후에 남은 상태를 대상으로 하므로 치료 중인 상태는 장해에 해당하지 아니한다.\n\nⅡ. 영구성의 의미\n원칙적으로 회복의 가능성이 없이 신체에 고정된 상태를 말한다. 다만 5년 이상 지속될 것으로 인정되는 한시장해는 해당 지급률의 100분의 20을 적용한다.\n\nⅢ. 확정시기\n1. 원칙 — 치유되어 장해가 고정된 때에 확정한다.\n2. 180일 규정 — 장해지급률이 상해 발생일 또는 질병의 진단 확정일부터 180일 이내에 확정되지 아니하는 경우에는 180일이 되는 날의 의사 진단에 기초하여 고정될 것으로 인정되는 상태를 장해지급률로 결정한다.\n3. 부위별 유예 — 눈의 안구운동장해와 귀의 평형기능장해는 수상 후 1년, 코의 후각기능장해는 6개월, 정신행동장해와 치매는 18개월, 신경계 장해는 외상 후 12개월의 지속적 치료 후에 평가한다.\n\nⅣ. 악화된 장해\n180일이 되는 날 이후에 장해상태가 더 악화된 경우에는 악화된 상태를 기준으로 다시 평가한다. 다만 보험기간이 10년 이상인 계약은 상해 발생일부터 2년 이내, 10년 미만인 계약은 1년 이내로 제한된다.\n\nⅤ. 실무상 의의\n사고일과 장해진단일의 간격에 따라 평가 가능 여부가 달라지므로, 계산문제에서는 날짜를 먼저 확인하여야 한다.\n\nⅥ. 결론\n180일이 원칙이고 부위별 유예기간이 예외이며, 악화 시 재평가에는 기간의 제한이 있다.`},

       a:`Ⅰ. 파생장해의 의의\n하나의 장해로부터 통상적으로 따라오는 다른 장해를 말한다.\n\nⅡ. 처리원칙\n1. 하나의 장해가 관찰 방법에 따라 장해분류표상 2가지 이상의 신체부위에서 장해로 평가되는 경우에는 그 중 높은 지급률을 적용한다.\n2. 하나의 장해가 다른 장해와 통상 파생하는 관계에 있는 경우에는 그 중 높은 지급률만을 적용한다.\n3. 하나의 장해로 둘 이상의 파생장해가 발생하는 경우에는 각 파생장해의 지급률을 합산한 지급률과 최초 장해의 지급률을 비교하여 그 중 높은 지급률을 적용한다.\n\nⅢ. 취지\n동일한 원인에서 비롯된 기능상실을 중복하여 평가하면 실제 장해의 정도를 넘어 보상하게 되므로 이를 방지하기 위한 것이다.\n\nⅣ. 적용의 예\n경추척수증으로 일상생활기본동작의 제한이 53퍼센트로 평가되고, 그로부터 파생된 좌측 손가락 15퍼센트, 우측 손가락 30퍼센트, 우측 팔 45퍼센트의 장해가 있는 경우, 우측 상지는 60퍼센트를 한도로 하므로 파생장해의 합계는 좌측 15퍼센트와 우측 60퍼센트를 더한 75퍼센트가 된다. 최초 장해 53퍼센트와 비교하여 높은 75퍼센트를 적용한다.\n\nⅤ. 결론\n제3원칙의 비교가 실무의 핵심이며, 상지 60퍼센트 한도를 적용한 후에 비교하여야 한다는 점에 유의하여야 한다.`},
      {q:"기왕장해가 있는 경우 후유장해보험금의 산정방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n이미 장해가 있던 신체부위에 다시 장해가 발생한 경우에는, 이번에 평가된 장해지급률에서 기존 장해의 지급률을 공제한 지급률을 적용한다.\n\nⅡ. 동일부위의 범위\n1. 척추는 경추, 흉추, 요추 및 제1천추까지를 하나의 동일부위로 본다.\n2. 다리는 한쪽 다리를 하나의 동일부위로 본다.\n3. 팔은 한쪽 팔과 그 손가락을 하나의 부위로 본다.\n\nⅢ. 다른 부위의 기왕장해\n부위가 다르면 공제하지 아니하고 이번 장해를 그대로 인정한다.\n\nⅣ. 산정의 예\n1차 사고로 척추에 기형장해 30퍼센트가 있었고 2차 사고로 심한 기형 50퍼센트가 된 경우, 50퍼센트에서 30퍼센트를 공제한 20퍼센트를 인정한다.\n한쪽 다리에 1차 사고로 가관절 20퍼센트가 있었고 2차 사고로 무릎 10퍼센트와 발목 10퍼센트의 관절 기능장해가 생긴 경우, 합산 20퍼센트에서 기존 20퍼센트를 공제하여 0퍼센트가 된다.\n\nⅤ. 보험가입 전의 기왕장해\n보험가입 전부터 존재하던 장해도 같은 방법으로 공제한다.\n\nⅥ. 결론\n부위의 동일성 판단이 선행되어야 하며, 동일부위이면 공제하고 다른 부위이면 공제하지 아니한다.`},
      {q:"한시장해의 인정요건과 지급률의 적용을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n한시장해란 일정 기간이 지나면 회복될 것으로 예상되는 장해를 말한다.\n\nⅡ. 인정요건\n장해분류표는 원칙적으로 영구적인 장해만을 평가하나, 5년 이상 지속될 것으로 인정되는 한시장해는 장해로 평가한다.\n\nⅢ. 지급률의 적용\n해당 장해지급률의 100분의 20을 적용한다.\n\nⅣ. 산정의 예\n보험가입금액이 1억원이고 장해지급률이 10퍼센트인 5년 한시장해라면, 1억원에 10퍼센트를 곱하고 다시 20퍼센트를 곱한 200만원을 지급한다.\n\nⅤ. 판단자료\n1. 주치의 또는 자문의의 한시장해 여부와 기간에 관한 소견\n2. 치료 경과와 회복 가능성에 관한 의학적 자료\n\nⅥ. 유의사항\n1. 5년 미만의 한시장해는 장해로 평가하지 아니한다.\n2. 한시장해로 평가된 후 기간이 경과하여도 회복되지 아니하면 영구장해로 재평가할 수 있는지가 문제되며 약관의 악화 규정에 따른다.\n\nⅦ. 결론\n5년이라는 기간요건과 20퍼센트라는 지급률이 이 논점의 핵심이다.`},
      {q:"장해분류표상 장해진단을 담당하는 진료과목과 그 취지를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 원칙\n장해는 해당 장해를 진단할 수 있는 진료과목의 전문의가 진단하여야 한다.\n\nⅡ. 부위별 진료과목\n1. 눈의 장해 — 안과\n2. 귀, 코, 씹어먹거나 말하는 기능의 장해 — 이비인후과. 다만 치아의 장해는 치과이다.\n3. 외모의 추상장해 — 성형외과, 피부과 등\n4. 척추, 팔, 다리, 손가락, 발가락의 장해 — 정형외과, 신경외과, 재활의학과\n5. 흉복부 장기의 장해 — 해당 장기를 진료하는 내과, 외과, 비뇨의학과 등\n6. 신경계의 장해 — 신경과, 신경외과, 재활의학과\n7. 정신행동장해 — 정신건강의학과\n\nⅢ. 취지\n장해의 평가에는 해당 분야의 전문적 지식이 필요하므로, 진단 주체를 제한하여 평가의 객관성과 신뢰성을 확보하기 위한 것이다.\n\nⅣ. 실무상 의의\n1. 해당 진료과목이 아닌 의사의 진단서만으로는 장해를 확정하기 어렵다.\n2. 여러 부위의 장해가 있으면 각 부위별로 해당 과목의 진단이 필요하다.\n3. 진단서의 작성 과목을 확인하는 것이 손해사정의 기본 절차이다.\n\nⅤ. 결론\n진단 주체의 적격성은 장해 인정의 형식적 요건이므로 반드시 확인하여야 한다.`},
      {q:"정신행동장해의 능력장해 평가기준을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n정신행동장해는 정신질환으로 인하여 일상생활과 사회생활을 수행하는 능력이 제한된 정도를 평가한다.\n\nⅡ. 평가의 영역\n다음 여섯 가지 영역에서의 능력 제한 정도를 평가한다.\n1. 적절한 음식섭취\n2. 대소변관리, 세면, 목욕, 청소 등 청결 유지\n3. 적절한 대화기술 및 협조적 대인관계\n4. 규칙적인 통원과 약물 복용\n5. 소지품 및 금전관리나 적절한 구매행위\n6. 대중교통이나 일반 공공시설의 이용\n\nⅢ. 평가의 시기\n증상이 고착된 상태에서 평가하며 원칙적으로 치료 개시 후 18개월이 지난 후에 평가한다.\n\nⅣ. 진단의 주체\n정신건강의학과 전문의가 진단한다.\n\nⅤ. 유의사항\n1. 증상의 변동이 큰 질환이므로 충분한 관찰기간이 필요하다.\n2. 기왕의 정신질환이 있는 경우 기여도를 검토한다.\n3. 객관적 평가도구와 진료기록의 일관성을 확인한다.\n\nⅥ. 결론\n여섯 개 영역의 제한 정도가 평가의 기준이며, 18개월의 유예기간과 전문의 진단이 형식적 요건이다.`},
      {q:"후유장해보험금의 지급한도와 이미 지급한 보험금의 처리를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 지급한도\n회사가 지급하여야 할 하나의 상해로 인한 후유장해보험금은 보험가입금액을 한도로 한다. 따라서 장해지급률의 합계가 100퍼센트를 초과하더라도 보험가입금액을 넘어 지급하지 아니한다.\n\nⅡ. 이미 지급한 보험금의 공제\n동일한 상해로 이미 후유장해보험금을 지급한 경우에는 그 금액을 공제한 나머지를 지급한다.\n\nⅢ. 산정의 예\n1차 장해평가에서 53퍼센트로 5,300만원을 지급하였고, 이후 재평가에서 지급률의 합계가 105퍼센트가 되었다면, 보험가입금액 1억원을 한도로 하여 1억원에서 이미 지급한 5,300만원을 공제한 4,700만원을 지급한다.\n\nⅣ. 다른 상해로 인한 장해\n별개의 상해로 인한 장해는 각각 보험가입금액을 한도로 하므로 합산하여 한도를 적용하지 아니한다.\n\nⅤ. 담보별 처리\n일반상해후유장해와 교통상해후유장해 등 담보가 다르면 각 담보의 가입금액을 한도로 각각 산정한다.\n\nⅥ. 결론\n하나의 상해에 대하여 가입금액이 한도이고 기지급액을 공제한다는 두 규칙이 핵심이다.`},

      {h:"치아의 결손 — 48회가 두 번 물었다", freq:F(3,[48]),
       body:`<div class="why"><span class="h">치아의 결손이란</span>
       <b>치아의 상실 또는 치아의 크기·형태의 3분의 1 이상이 손상되어 치아로서의 기능을 잃은 상태</b>를 말한다. 발치된 경우뿐 아니라 치관의 상당 부분이 파괴된 경우도 포함한다.</div>
       <div class="scroller"><table class="mini">
       <tr><th>결손 개수</th><th>지급률</th></tr>
       <tr><td><b>14개 이상</b></td><td><b>20%</b></td></tr>
       <tr><td><b>7개 이상</b></td><td><b>10%</b></td></tr>
       <tr><td><b>5개 이상</b></td><td><b>5%</b></td></tr>
       </table></div>
       <p><b>산정의 규칙</b></p>
       <ul><li><b>영구치</b>에 한하여 인정한다(유치는 제외)</li>
       <li><b>보철치료를 한 경우</b> — 크라운(금관) 치료 등 <b>치아를 보존하면서 수복</b>한 경우는 <b>1개를 0.5개(1/2)</b>로 인정한다</li>
       <li>이미 상실되어 있던 치아(기왕의 결손)는 제외한다</li>
       <li><b>제3대구치(사랑니)</b>는 제외하는 것이 일반적이다</li></ul>
       <div class="calcbox"><b>48회 5번 계산</b><br>
       치아 결손 <b>6개</b> + 금관치료 <b>1개 × 1/2</b> = <b>6.5개</b> → <b>5개 이상</b>이므로 <b>5%</b><br>
       귀의 장해 25%와 합산 → 1억원 × (25% + 5%) = <b>3,000만원</b></div>`,
       mnemo:{key:"14 · 7 · 5 → 20 · 10 · 5", how:"치아 개수와 지급률이 <b>거의 반씩</b> 줄어든다. 금관치료는 <b>반 개</b>로 센다."}},

      {h:"척추의 세 가지 장해", freq:F(3,[41,43,45]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>구분</th><th>평가 대상</th><th>지급률</th></tr>
       <tr><td><b>운동장해</b></td><td>척추체를 유합·고정한 <b>개수</b>. 4개 이상 심한, 3개 뚜렷한, 2개 약간의</td><td>40 / 30 / 10</td></tr>
       <tr><td><b>기형장해</b></td><td><b>압박률</b> 또는 <b>만곡의 각도</b></td><td>50 / 30 / 15</td></tr>
       <tr><td><b>신경장해</b></td><td>추간판탈출증에 의한 신경근병증·마미증후군</td><td>20 / 15 / 10</td></tr>
       </table></div>
       <p><b>기형장해의 각도 기준</b></p>
       <ul><li><b>뚜렷한 기형</b> — <b>15° 이상</b>의 척추 전만증·후만증, 또는 <b>10° 이상</b>의 측만증</li>
       <li><b>심한 기형</b> — <b>20° 이상</b>의 측만증 등 약관이 정한 정도</li></ul>
       <div class="warn"><b>추간판탈출증의 세 가지 원칙</b><br>
       ① 수술 여부와 관계없이 <b>운동장해·기형장해로 평가하지 않는다</b>. 신경장해로만 평가한다.<br>
       ② 수술 또는 시술 후 <b>6개월 이상</b> 지난 후에 평가한다.<br>
       ③ <b>신경생리검사(근전도·신경전도)에서 명확한 신경근병증 소견</b>이 지속되어야 한다.</div>
       <p><b>신경장해의 요건</b></p>
       <ul><li><b>심한 장해 20%</b> — 추간판을 <b>2마디 이상</b>(또는 1개 추간판을 2회 이상) 수술 + <b>마미신경증후군</b>으로 현저한 마비 또는 대소변 장해</li>
       <li><b>뚜렷한 장해 15%</b> — <b>1마디</b> 수술 + 명확한 신경근병증 소견 지속 + 척추신경근의 <b>불완전 마비</b></li>
       <li><b>약간의 장해 10%</b> — 추간판탈출증이 확인되고 명확한 신경근병증 소견이 지속</li></ul>`,
       mnemo:{key:"운 40 · 기 50 · 신 20", how:"척추 3장해의 최고치. 운동은 <b>개수</b>(4·3·2), 기형은 <b>각도·압박률</b>, 신경은 <b>추간판</b>.<br>추간판은 운동·기형으로 평가하지 <b>않는다</b>."}},

      {h:"신경계 장해와 ADLs", freq:F(3,[45,49]),
       body:`<p><b>일상생활 기본동작(ADLs) 제한 장해</b> — 뇌·척수 손상으로 인한 신경계 장해는 다음 5개 동작의 제한 정도로 평가한다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>동작</th><th>평가 내용</th></tr>
       <tr><td><b>이동동작</b></td><td>보행, 실내 이동</td></tr>

       <div class="warn"><b>평가 시기 — 외상 후 12개월</b> 동안 지속적인 치료 후에 평가한다. 45회 7번에서 <b>ADLs 배변배뇨 20%가 인정되지 않은 이유</b>가 이것이다. 계산 전에 <b>날짜</b>를 확인한다.</div>
       <p><b>파생장해와의 관계 (49회)</b> — 신경계 장해(ADLs)와 그로부터 파생된 사지의 장해가 함께 있으면, <b>파생장해의 합산</b>과 <b>최초 장해(ADLs)</b>를 비교하여 높은 쪽을 적용한다.</p>`,
       mnemo:{key:"이 · 음 · 배 · 목 · 옷", how:"ADLs 5동작 — <b>이</b>동 · <b>음</b>식섭취 · <b>배</b>변배뇨 · <b>목</b>욕 · <b>옷</b> 입고 벗기.<br>평가는 <b>12개월</b> 후."}},

       <tr><td><b>안구조절기능장해</b></td><td><b>45세 이상</b> 제외</td><td><b>50세 이상</b> 제외</td></tr>

       a:`Ⅰ. 치아의 결손의 의미\n치아의 결손이란 치아가 상실되거나 치아의 크기 또는 형태의 3분의 1 이상이 손상되어 치아로서의 기능을 잃은 상태를 말한다. 발치된 경우뿐 아니라 치관의 상당 부분이 파괴된 경우도 포함한다.\n\nⅡ. 장해의 분류와 지급률\n1. 치아에 14개 이상의 결손이 생긴 때 — 20퍼센트\n2. 치아에 7개 이상의 결손이 생긴 때 — 10퍼센트\n3. 치아에 5개 이상의 결손이 생긴 때 — 5퍼센트\n\nⅢ. 산정의 규칙\n1. 영구치에 한하여 인정하며 유치는 제외한다.\n2. 치아를 보존하면서 수복한 보철치료, 즉 금관치료 등을 한 경우에는 1개를 2분의 1개로 인정한다.\n3. 이미 상실되어 있던 기왕의 결손은 제외한다.\n4. 제3대구치는 원칙적으로 산정에서 제외한다.\n\nⅣ. 산정의 예\n결손된 치아가 6개이고 금관치료를 한 치아가 1개이면 6개에 0.5개를 더한 6.5개가 되어 5개 이상에 해당하므로 지급률은 5퍼센트이다.\n\nⅤ. 평가의 주체와 시기\n치과 전문의가 진단하며 보철이 완료되어 상태가 고정된 후에 평가한다.\n\nⅥ. 결론\n14개, 7개, 5개의 기준과 보철치료의 2분의 1 인정이 산정의 핵심이다.`},
      {q:"척추의 후유장해를 세 가지로 나누어 각각의 판정기준과 지급률을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 운동장해\n1. 판정기준 — 척추체의 골절이나 탈구로 유합 또는 고정한 척추체의 개수를 기준으로 한다. 횡돌기와 극돌기는 제외한다.\n2. 4개 이상은 심한 장해, 3개는 뚜렷한 장해, 2개는 약간의 장해이다.\n3. 지급률 — 40퍼센트, 30퍼센트, 10퍼센트\n\nⅡ. 기형장해\n1. 판정기준 — 압박률 또는 만곡의 각도를 기준으로 한다. 뚜렷한 기형은 15도 이상의 척추 전만증이나 후만증 또는 10도 이상의 측만증에 해당한다.\n2. 지급률 — 심한 기형 50퍼센트, 뚜렷한 기형 30퍼센트, 약간의 기형 15퍼센트\n\nⅢ. 추간판탈출증에 의한 신경장해\n1. 심한 장해 20퍼센트 — 추간판을 2마디 이상 수술하고 마미신경증후군으로 현저한 마비나 대소변 장해가 있는 경우\n2. 뚜렷한 장해 15퍼센트 — 1마디를 수술하고 신경생리검사에서 명확한 신경근병증 소견이 지속되며 척추신경근의 불완전 마비가 있는 경우\n3. 약간의 장해 10퍼센트 — 추간판탈출증이 확인되고 명확한 신경근병증 소견이 지속되는 경우\n\nⅣ. 추간판탈출증의 특칙\n1. 수술 여부와 관계없이 운동장해나 기형장해로 평가하지 아니한다.\n2. 수술 또는 시술 후 6개월 이상 지난 후에 평가한다.\n\nⅤ. 동일부위의 처리\n척추는 경추, 흉추, 요추 및 제1천추까지를 하나의 동일부위로 보므로 기왕장해가 있으면 공제한다.\n\nⅥ. 결론\n운동은 개수, 기형은 각도와 압박률, 신경은 추간판이라는 기준의 차이를 명확히 구별하여야 한다.`},
      {q:"신경계 장해의 평가방법과 평가시기를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 평가의 대상\n뇌 손상이나 척수 손상 등으로 인하여 일상생활의 수행에 제한이 생긴 경우를 평가한다.\n\nⅡ. 평가방법\n일상생활 기본동작의 제한 정도를 다음 다섯 가지 동작에 대하여 평가한다.\n1. 이동동작\n2. 음식물 섭취\n3. 배변과 배뇨\n4. 목욕\n5. 의복의 착탈\n각 동작별로 제한의 정도를 점수화하여 합산한 후 장해지급률을 결정한다.\n\nⅢ. 평가시기\n외상 후 12개월 동안 지속적인 치료를 한 후에 평가한다. 12개월이 경과하지 아니한 상태에서 평가한 장해는 인정되지 아니한다.\n\nⅣ. 파생장해와의 관계\n신경계 장해로부터 사지의 마비 등 다른 장해가 파생된 경우에는, 파생장해의 지급률을 합산한 값과 최초의 신경계 장해 지급률을 비교하여 높은 쪽을 적용한다. 이때 한쪽 팔과 손가락의 합산은 60퍼센트를 한도로 한다.\n\nⅤ. 실무상 유의점\n1. 사고일과 장해진단일의 간격을 반드시 확인한다.\n2. 진단은 신경과, 신경외과 또는 재활의학과 전문의가 담당한다.\n3. 영상소견과 신경학적 검사가 일상생활 제한의 정도와 부합하는지 확인한다.\n\nⅥ. 결론\n12개월의 유예기간과 다섯 가지 동작의 평가, 파생장해와의 비교가 신경계 장해 평가의 세 축이다.`},
      {q:"2018년 4월 1일 개정 장해분류표에서 신체부위별 판정기준을 별도로 정한 경우를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n장해지급률은 상해 발생일 또는 질병의 진단 확정일부터 180일 이내에 확정된 장해상태를 기준으로 한다.\n\nⅡ. 별도로 정한 경우\n1. 눈의 안구운동장해 — 수상 후 1년이 지난 후에 판정한다.\n2. 코의 후각기능장해 — 수상 후 6개월이 지난 후에 판정한다.\n3. 귀의 평형기능장해 — 수상 후 1년이 지난 후에 판정한다.\n4. 정신행동장해 — 치료 개시 후 18개월이 지난 후에 판정한다.\n5. 치매 — 18개월이 지난 후에 판정한다.\n6. 신경계 장해 — 외상 후 12개월 동안 지속적인 치료를 한 후에 평가한다.\n7. 추간판탈출증에 의한 신경장해 — 수술 또는 시술 후 6개월이 지난 후에 평가한다.\n\nⅢ. 취지\n해당 장해는 상당 기간 경과 후에야 상태가 고정되므로, 조기 평가로 인한 과대 또는 과소 평가를 방지하기 위한 것이다.\n\nⅣ. 실무상 의의\n유예기간이 경과하지 아니한 상태에서 발급된 장해진단서는 그대로 인정할 수 없으며, 기간 경과 후 재평가가 필요하다.\n\nⅤ. 결론\n180일이 원칙이고 위 일곱 가지가 예외이므로, 장해의 부위를 확인한 즉시 해당 기간의 경과 여부를 검토하여야 한다.`},
      {q:"인공관절 삽입에 관한 장해분류표의 개정 전후를 비교하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 개정 전\n관절에 인공관절을 삽입한 경우에는 그 관절의 기능을 완전히 잃은 것으로 보아 30퍼센트의 지급률을 적용하였다.\n\nⅡ. 개정 후\n2018년 4월 1일 개정된 장해분류표는 인공관절을 삽입한 경우를 관절기능의 심한 장해로 보아 20퍼센트의 지급률을 적용한다.\n\nⅢ. 개정의 이유\n인공관절 수술의 기술이 발전하여 수술 후 상당한 정도의 관절 기능이 회복되는 사례가 많아졌으므로, 기능의 완전상실로 보는 것이 실제와 맞지 아니하게 되었기 때문이다.\n\nⅣ. 적용의 기준\n계약일을 기준으로 적용할 장해분류표의 판을 결정한다. 따라서 동일한 사고와 동일한 장해상태라 하더라도 개정 전 계약과 개정 후 계약의 지급률이 달라진다.\n\nⅤ. 산정의 예\n개정 전 계약인 A보험에서 15퍼센트, 15퍼센트, 30퍼센트로 합계 60퍼센트가 산정되고, 개정 후 계약인 B보험에서 5퍼센트, 10퍼센트, 30퍼센트, 20퍼센트로 합계 65퍼센트가 산정될 수 있다.\n\nⅥ. 그 밖의 개정사항\n안구조절기능장해의 제외 연령이 45세 이상에서 50세 이상으로 변경되었고, 부위별 판정 시기가 명시되었으며, 신경계 장해에 일상생활기본동작 제한 평가가 도입되었다.\n\nⅦ. 결론\n계약일에 따른 약관 판의 특정이 선행되어야 하며, 인공관절의 30퍼센트와 20퍼센트가 대표적 차이이다.`},
      {q:"흉복부 장기의 장해에 관하여 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 평가의 대상\n심장, 폐, 간, 신장, 소화기관, 비뇨생식기관 등 흉복부 장기의 기능에 장해가 남은 경우를 평가한다.\n\nⅡ. 주요 장해상태와 지급률\n1. 심장이식을 한 경우 등 장기의 기능을 완전히 잃은 중증 상태 — 100퍼센트\n2. 방광의 용량이 50시시 이하가 된 경우 — 15퍼센트\n3. 인공요도괄약근을 삽입한 경우 — 30퍼센트\n4. 장루 또는 인공항문을 설치한 경우 — 30퍼센트\n5. 그 밖에 각 장기의 기능 저하 정도에 따라 지급률이 정해진다.\n\nⅢ. 평가의 방법\n해당 장기를 진료하는 진료과목의 전문의가 객관적 검사에 기초하여 진단하며, 기능검사 수치가 근거가 된다.\n\nⅣ. 파생장해와 동일부위\n하나의 장기에 여러 장해가 있으면 높은 지급률을 적용하고, 서로 다른 장기이면 합산한다.\n\nⅤ. 실무상 유의점\n1. 기왕의 장기질환이 있는 경우 기여도를 검토한다.\n2. 인공장치의 삽입 여부와 시기를 확인한다.\n\nⅥ. 결론\n흉복부 장해는 기능검사에 의한 객관적 평가가 요구되며, 심장이식이 100퍼센트의 대표적 사례이다.`},
      {q:"귀의 청력장해와 눈의 시력·시야장해의 판정기준을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 귀의 청력장해\n1. 판정은 순음청력검사와 어음청취역치검사 등 객관적 검사에 의한다.\n2. 두 귀의 청력을 완전히 잃은 때는 80퍼센트이다.\n3. 한 귀의 청력을 완전히 잃은 때, 즉 평균 순음역치가 90데시벨 이상인 경우는 25퍼센트이다.\n4. 한 귀의 청력에 약간의 장해가 남은 때, 즉 평균 순음역치가 70데시벨 이상으로 50센티미터 이상의 거리에서 보통의 말소리를 알아듣기 어려운 경우는 5퍼센트이다.\n5. 평형기능장해는 수상 후 1년이 지난 후에 판정한다.\n\nⅡ. 눈의 시력장해\n1. 교정시력을 기준으로 판정한다.\n2. 두 눈이 멀었을 때는 100퍼센트, 한 눈이 멀었을 때는 50퍼센트이다.\n3. 안구운동장해는 수상 후 1년이 지난 후에 판정한다.\n\nⅢ. 시야장해\n뚜렷한 시야장해는 정상시야의 60퍼센트 이하로 제한된 경우로 5퍼센트를 적용한다.\n\nⅣ. 실무상 유의점\n1. 검사의 재현성을 확인하기 위하여 반복 검사를 요구할 수 있다.\n2. 기왕의 난청이나 시력저하가 있으면 공제한다.\n3. 진단은 각각 이비인후과와 안과 전문의가 담당한다.\n\nⅤ. 결론\n객관적 검사 수치가 기준이며 판정 시기와 기왕장해의 공제를 함께 확인하여야 한다.`},
      {q:"팔과 다리의 장해에 관하여 지급률 체계와 합산의 원칙을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 지급률 체계\n1. 한 팔 또는 한 다리의 기능을 완전히 잃었을 때 — 60퍼센트\n2. 3대 관절 중 어느 한 관절의 기능에 심한 장해가 남은 때 — 20퍼센트\n3. 뚜렷한 장해 — 10퍼센트\n4. 약간의 장해 — 5퍼센트\n5. 가관절이 남아 뚜렷한 장해가 있는 때 — 20퍼센트\n6. 뼈에 기형이 남은 때 — 별도의 지급률\n\nⅡ. 3대 관절\n팔은 어깨관절, 팔꿈치관절, 손목관절을 말하고, 다리는 고관절, 무릎관절, 발목관절을 말한다.\n\nⅢ. 합산의 원칙\n1. 같은 팔 또는 다리의 여러 관절에 기능장해가 있으면 합산한다.\n2. 한쪽 팔과 그 손가락의 지급률은 합산하되 60퍼센트를 한도로 한다.\n3. 같은 부위에 성질이 다른 장해가 있으면 높은 지급률 하나만 인정한다.\n\nⅣ. 산정의 예\n한쪽 다리에 고관절의 심한 장해 20퍼센트와 무릎관절의 약간의 장해 5퍼센트가 있으면 합산하여 25퍼센트가 되고, 같은 다리에 가관절 20퍼센트가 있더라도 높은 25퍼센트만 인정한다.\n\nⅤ. 기왕장해\n한쪽 다리를 동일부위로 보아 기존 장해지급률을 공제한다.\n\nⅥ. 결론\n관절 기능장해는 합산, 성질이 다른 장해는 최고치, 상지는 60퍼센트 한도라는 세 규칙이 핵심이다.`},
      {q:"외모의 추상장해와 그 판정을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n외모에 뚜렷한 흉터나 변형이 남아 미용상의 장해가 있는 상태를 말한다.\n\nⅡ. 외모의 범위\n얼굴, 머리, 목 등 일상적으로 노출되는 부위를 말한다.\n\nⅢ. 지급률\n1. 외모에 뚜렷한 추상이 남은 때 — 15퍼센트\n2. 외모에 약간의 추상이 남은 때 — 5퍼센트\n\nⅣ. 판정의 기준\n흉터의 길이와 면적, 함몰이나 결손의 정도, 색조의 변화 등을 종합하여 판단하며 약관이 정한 크기 기준을 적용한다.\n\nⅤ. 판정의 시기\n반흔이 성숙되어 더 이상의 변화가 없는 상태에서 평가하며 통상 수상 후 상당 기간이 지난 후에 판정한다.\n\nⅥ. 실무상 유의점\n1. 성형수술로 개선이 가능한 경우에도 현재의 상태를 기준으로 평가한다.\n2. 노출되지 아니하는 부위의 흉터는 추상장해에 해당하지 아니한다.\n3. 진단은 성형외과나 피부과 전문의가 담당한다.\n\nⅦ. 결론\n뚜렷한 추상 15퍼센트와 약간의 추상 5퍼센트의 구별은 크기 기준에 따르며, 반흔의 성숙 후에 평가하여야 한다.`},
      {q:"장해상태별 지급률을 산정하는 사례를 들어 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 산정의 절차\n1. 부위별로 장해상태를 확정한다.\n2. 각 부위의 지급률을 장해분류표에서 찾는다.\n3. 동일부위 원칙과 합산의 예외를 적용한다.\n4. 파생장해의 처리원칙을 적용한다.\n5. 기왕장해를 공제한다.\n6. 한시장해이면 20퍼센트를 적용한다.\n7. 담보별 가입금액에 최종 지급률을 곱한다.\n8. 보험가입금액의 한도와 기지급액의 공제를 적용한다.\n\nⅡ. 산정의 예\n안구적출로 한 눈이 멀어 50퍼센트, 외모에 약간의 추상이 남아 5퍼센트, 한 귀의 청력에 약간의 장해가 남아 5퍼센트, 약간의 간질발작으로 10퍼센트가 인정되는 경우 부위가 모두 다르므로 합산하여 70퍼센트가 된다.\n\nⅢ. 또 다른 예\n코의 결손과 외모의 추상이 각 5퍼센트, 척추의 심한 운동장해 40퍼센트, 한 다리의 관절 기능장해 30퍼센트가 인정되면 합계는 80퍼센트가 된다. 기왕장해로 5퍼센트가 있었다면 보험금은 가입금액에 80퍼센트를 곱한 금액에서 가입금액에 5퍼센트를 곱한 금액을 공제하여 산출한다.\n\nⅣ. 담보별 적용\n일반상해후유장해와 교통상해후유장해에 모두 가입되어 있으면 각 담보의 가입금액에 같은 지급률을 곱하여 각각 지급한다. 80퍼센트 이상 후유장해 담보는 요건을 충족하는 경우에만 지급한다.\n\nⅤ. 결론\n부위 확정, 원칙 적용, 공제, 담보별 산출의 순서를 지키면 누락 없이 계산할 수 있다.`}

      {h:"입원과 통원 — 한도와 공제가 다르다", freq:F(3,[41,43,44,45]),
       body:`<div class="scroller"><table class="mini">

       <tr><td>공제</td><td><b>정률만</b>(급여 20% / 비급여 30%)</td><td><b>MAX[정액, 정률]</b></td></tr>
       <tr><td>한도</td><td>연간 보험가입금액(통상 5,000만원)</td><td>회당 한도(통상 20만원~25만원)</td></tr>
       <tr><td>정액공제</td><td>없음</td><td>의원 1만원 / 병원·종합병원 2만원 / 상급종합 2만원</td></tr>
       </table></div>
       <div class="warn"><b>구세대의 200만원 규정</b> — 입원의료비의 <b>자기부담금(20%)이 연간 200만원을 초과</b>하면 그 초과분은 <b>보험가입금액을 한도로 전액</b> 보상한다. 41·43회 계산의 핵심이다.<br>
       43회에서 ①~⑤ 입원의 자기부담금 누계가 400만원(160만 + 240만)이 되어 <b>200만원을 초과한 200만원</b>을 추가 보상한 것이 이 규정이다.</div>

       <div class="calcbox"><b>44회 예시</b><br>
       M50(경추 추간판장애) 같은 날 병원과 약국 이용<br>
       (10만원 + 10만원) + (2만원 + 5만원) − MAX[2만원, 1만원, 20만원 × 20%, 7만원 × 20%]<br>

       body:`<div class="calcbox"><b>산식</b><br>
       각 계약의 보상책임액 =<br>
       (각 계약의 <b>보장대상의료비 중 최고액</b> − 각 계약의 <b>피보험자 부담 공제금액 중 최소액</b>)<br>
       × <b>각 계약별 보장책임액</b> ÷ <b>각 계약별 보장책임액의 합계</b></div>
       <p><b>적용 요건</b> — 각 계약의 보장책임액을 합한 금액이 <b>(보장대상의료비 최고액 − 공제금액 최소액)을 초과</b>하는 경우에 적용한다. 초과하지 않으면 안분하지 않는다.</p>
       <div class="calcbox"><b>48회 6번 — 3세대 A와 4세대 B</b><br>
       <b>급여 통원</b><br>
       A(3세대) 10만원 − MAX[1.5만원, 10만원×20%] = <b>8만원</b><br>
       B(4세대) 10만원 − MAX[1만원, 10만원×20%] = <b>8만원</b><br>
       안분 — A = (10만원 − 2만원) × 8/(8+8) = <b>4만원</b>, B = <b>4만원</b><br><br>
       <b>MRI</b><br>
       A 50만원 − MAX[2만원, 50만원×30%] = <b>35만원</b> / B 50만원 − MAX[3만원, 50만원×30%] = <b>35만원</b><br>
       안분 — A = (50만원 − 15만원) × 35/(35+35) = <b>17.5만원</b>, B = <b>17.5만원</b><br><br>
       <b>도수치료</b> — A는 3세대라 횟수 확인 규정이 없어 <b>14만원</b> 지급, B는 4세대 횟수 요건 미충족으로 <b>0원</b><br><br>
       <b>최종</b> — A = 4 + 14 + 17.5 = <b>35.5만원</b> / B = 4 + 17.5 = <b>21.5만원</b></div>
       <div class="warn"><b>정액담보는 안분하지 않는다.</b> 진단비·수술비·입원일당은 각 계약에서 <b>전액</b> 지급된다. 실손의료비만 비례분담한다.</div>`,
       mnemo:{key:"최고액 − 최소공제 → 책임액 비율", how:"분자는 <b>보장대상의료비 최고액 − 공제금액 최소액</b>, 비율은 <b>각자 보장책임액 ÷ 합계</b>.<br>세대가 다르면 <b>보장책임액도 다르다</b>."}}
    ],

      {f:"본인부담상한제 환급금의 처리는?", b:"실손의료보험에서 보상하지 않는 금액이므로 먼저 차감한 후 공제와 보상률을 적용한다."},

      {f:"다수보험 비례분담의 산식은?", b:"(보장대상의료비 최고액 − 공제금액 최소액) × 각 계약별 보장책임액 ÷ 보장책임액 합계."},

      {f:"5세대 급여 통원의 공제는?", b:"MAX[1만원, 20%, 건강보험 본인부담률]."},
      {f:"5세대 비중증 질병비급여의 공제는?", b:"MAX[5만원, 50%]. 비중증 질환의 증식치료 등은 보상하지 않는다."}
