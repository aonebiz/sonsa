    quiz:[
      {q:"다중이용업소 화재배상책임보험의 의의와 특징을 설명하고, 다른 의무보험과 중복되는 경우의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n다중이용업소의 안전관리에 관한 특별법에 따라 다중이용업주에게 가입이 강제되는 의무보험으로, 화재·폭발로 인하여 타인이 사망하거나 부상하거나 재산상 손해를 입은 경우의 배상책임을 담보한다.\n\nⅡ. 특징\n1. 피해자 보호를 목적으로 하므로 피보험자의 고의가 있는 경우에도 피해자에게 보험금을 지급하고 가해자에게 구상한다.\n2. 법령이 정한 최저 보상한도 이상으로 가입하여야 하며, 사망·부상·재산피해별로 한도가 정해진다.\n3. 보상한도는 법령 개정에 따라 변동되므로 계약의 책임개시일을 확인하여야 한다.\n\nⅢ. 다른 의무보험과 중복되는 경우\n1. 신체손해배상특약부 화재보험, 재난배상책임보험, 가스사고배상책임보험 등과 담보가 중복될 수 있다.\n2. 각 보험자의 독립책임액을 산정한 후, 그 합계가 손해액을 초과하면 독립책임액 비율로 안분한다.\n3. 독립책임액은 손해배상금에서 자기부담금을 공제한 금액과 보상한도액 중 작은 금액이다.\n\nⅣ. 결론\n의무보험 중복 사안은 한도와 자기부담금을 정확히 읽고 안분 여부를 판단하는 것이 핵심이다.`},
      {q:"신체손해배상특약부 화재보험의 '타인'과 다중이용업소 화재배상책임보험의 '타인'을 비교하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 신체손해배상특약부 화재보험의 '타인'\n1. 근거 — 화재로 인한 재해보상과 보험가입에 관한 법률\n2. 범위 — 특수건물의 소유자와 그 배우자 및 직계가족을 제외한 자를 말한다.\n3. 취지 — 소유자 본인과 그 가족은 배상의 상대방이 될 수 없으므로 제외한다.\n4. 책임의 성질 — 소유자는 화재의 과실 유무를 묻지 않고 배상책임을 진다.\n\nⅡ. 다중이용업소 화재배상책임보험의 '타인'\n1. 근거 — 다중이용업소의 안전관리에 관한 특별법\n2. 범위 — 다중이용업주와 그 배우자·직계가족 등을 제외한 자로서, 주로 이용객과 인근 주민이 해당한다.\n3. 종업원의 지위 — 업주의 근로자인 종업원은 산재보험과 근재보험의 영역이므로 별도로 검토하여야 한다.\n\nⅢ. 비교\n1. 두 보험 모두 피보험자 본인과 가족을 '타인'에서 제외한다는 점은 같다.\n2. 적용 대상 건물과 사고 원인의 범위가 다르다. 전자는 특수건물의 화재, 후자는 다중이용업소의 화재·폭발이다.\n3. 두 보험이 함께 적용되는 경우 독립책임액 비율로 분담한다.\n\nⅣ. 결론\n'타인'의 범위는 피보험자와의 인적 관계로 결정되므로, 피해자의 지위를 먼저 확정하여야 한다.`},
      {q:"중대재해처벌법의 주요 내용과 중대재해 배상책임보험의 담보범위를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 중대재해처벌법의 구조\n1. 중대산업재해 — 사망자 1명 이상, 동일한 사고로 6개월 이상 치료가 필요한 부상자 2명 이상, 동일한 유해요인으로 급성중독 등 직업성 질병자가 1년 이내 3명 이상 발생한 경우\n2. 중대시민재해 — 특정 원료나 제조물, 공중이용시설 또는 공중교통수단의 설계·제조·설치·관리상의 결함으로 발생한 재해\n3. 의무주체 — 사업주와 경영책임자등이 안전보건확보의무를 부담한다.\n\nⅡ. 제재\n1. 형사처벌 — 사망 시 1년 이상의 징역 또는 벌금 등\n2. 징벌적 손해배상 — 고의 또는 중대한 과실로 안전보건확보의무를 위반하여 중대재해를 발생하게 한 경우 손해액의 5배를 넘지 아니하는 범위에서 배상책임을 진다.\n\nⅢ. 중대재해 배상책임보험의 담보범위\n1. 담보 — 경영책임자 등이 부담하는 법률상 손해배상책임\n2. 면책 — 벌금·과태료 등 제재적 금원과 징벌적 손해배상금은 일반적으로 면책한다.\n3. 형사방어비용의 담보 여부는 약관에 따른다.\n\nⅣ. 근재보험과의 관계\n같은 사고에서 근로자에 대한 사용자의 배상책임은 근재보험이, 경영책임자 개인의 책임은 중대재해 배상책임보험이 담보하여 층위가 다르다.\n\nⅤ. 결론\n두 보험은 담보 주체와 책임 근거가 다르므로 함께 설계하여야 위험이 온전히 이전된다.`},
      {q:"선원법상 재해보상의 종류와 근로기준법상 재해보상과의 차이를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 선원법상 재해보상의 종류\n1. 요양보상 — 선박소유자가 직무상 부상·질병에 대하여 요양을 시키거나 요양비를 지급한다.\n2. 상병보상 — 요양 중인 선원에게 일정 기간 통상임금에 상당하는 금액을 지급한다.\n3. 장해보상 — 장해등급에 따라 승선평균임금의 일정 일수를 지급한다.\n4. 유족보상 — 승선평균임금의 1,300일분\n5. 장례비 — 승선평균임금의 120일분\n6. 행방불명보상, 소지품 유실보상 등 선원 특유의 보상\n\nⅡ. 근로기준법과의 차이\n1. 기준 임금 — 선원법은 승선평균임금, 근로기준법은 평균임금\n2. 보상 수준 — 유족보상 1,300일분(근로기준법 1,000일분), 장례비 120일분(근로기준법 90일분)으로 더 두텁다.\n3. 상병보상 — 선원법은 통상임금 상당액을 지급하여 휴업보상보다 유리하다.\n4. 수급권자의 순위 — 선원법 시행령이 별도로 정하므로 근로기준법과 다를 수 있다.\n\nⅢ. 실무상 유의\n선원 사안임이 드러나면 근로기준법 기준을 그대로 적용하여서는 안 되며, 승선평균임금과 선원법 일수를 적용하여야 한다.\n\nⅣ. 결론\n선원의 직무 특수성과 위험도를 반영하여 근로기준법보다 두터운 보호를 제공하는 것이 선원법의 취지이다.`},
      {q:"가스사고배상책임보험의 담보내용과 액화석유가스 소비자보장 특약을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 가스사고배상책임보험\n1. 근거 — 도시가스사업법, 액화석유가스의 안전관리 및 사업법 등에 따라 가스공급자·판매자·저장자 등에게 가입이 강제된다.\n2. 담보 — 가스의 제조·저장·판매·공급 및 사용 과정에서 발생한 사고로 타인의 신체 또는 재산에 손해를 입혀 부담하는 법률상 배상책임\n3. 보상한도 — 법령이 정한 최저한도 이상으로 가입하여야 하며 1인당·1사고당 한도가 함께 설정된다.\n\nⅡ. 액화석유가스 소비자보장 특약\n1. 의의 — 공급자의 시설뿐 아니라 소비자의 시설에서 발생한 가스사고까지 담보범위를 확장하는 특약이다.\n2. 취지 — 소비자 시설의 사고에 대하여도 피해자가 보상을 받을 수 있도록 하여 피해자 보호를 강화한다.\n3. 실무 — 사고 발생 지점이 공급자 시설인지 소비자 시설인지에 따라 담보 여부가 달라지므로 사고 지점의 특정이 중요하다.\n\nⅢ. 다른 보험과의 관계\n화재배상책임보험, 영업배상책임보험 등과 중복되면 독립책임액 비율로 분담한다.\n\nⅣ. 결론\n가스사고는 피해 규모가 크고 복수의 의무보험이 관련되는 경우가 많으므로 담보 경계와 분담을 함께 검토하여야 한다.`},
      {q:"의무보험에서 피보험자의 고의로 인한 사고를 어떻게 처리하는지 설명하고, 그 취지를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 원칙과 예외\n1. 원칙 — 보험은 우연한 사고를 담보하므로 피보험자의 고의는 면책사유이다.\n2. 의무보험의 예외 — 피해자 보호를 목적으로 하는 의무보험에서는 피보험자의 고의가 있더라도 피해자에게 보험금을 지급한다.\n\nⅡ. 처리방법\n1. 보험자는 피해자에게 보험금을 지급한다.\n2. 지급 후 고의로 사고를 일으킨 자에게 그 금액을 구상한다.\n3. 근거는 개별 법령과 약관의 규정이다.\n\nⅢ. 취지\n1. 피해자는 가해자의 고의 여부와 무관하게 손해를 입었으므로, 가해자의 사정으로 피해자가 구제받지 못하는 것은 부당하다.\n2. 의무보험은 배상자력의 확보가 제도의 목적이므로 피해자에 대한 지급을 우선한다.\n3. 동시에 고의 가해자에게 구상함으로써 도덕적 위험을 차단한다.\n\nⅣ. 유사 제도\n자동차보험 대인배상Ⅰ에서도 같은 구조를 취하며, 음주·무면허 사고에서는 사고부담금 제도로 회수한다.\n\nⅤ. 결론\n'먼저 지급하고 나중에 회수한다'는 구조가 의무보험의 공통된 설계원리이다.`},
      {q:"복수의 의무보험이 동일한 사고를 담보하는 경우의 처리방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 문제의 소재\n하나의 사고에 다중이용업소 화재배상책임보험, 신체손해배상특약부 화재보험, 가스사고배상책임보험 등 복수의 의무보험이 적용되는 경우 각 보험자의 부담을 어떻게 정할 것인지가 문제된다.\n\nⅡ. 처리 원칙\n1. 각 보험이 동일한 피보험이익과 동일한 사고를 담보하면 중복보험에 해당한다.\n2. 약관의 '다른 보험과의 관계 및 보험금 분담' 조항에 따라 처리한다.\n3. 일반적으로 독립책임액 분담방식을 적용한다.\n\nⅢ. 독립책임액 분담방식\n1. 각 보험자의 독립책임액 = min(손해배상금 − 자기부담금, 보상한도액)\n2. 독립책임액의 합계가 손해액을 초과하는 경우에만 안분한다.\n3. 안분액 = 손해액 × (각 독립책임액 ÷ 독립책임액 합계)\n4. 합계가 손해액에 미달하면 각자의 독립책임액을 그대로 지급한다.\n\nⅣ. 실무상 유의\n1. 각 보험의 보상한도와 자기부담금이 다르므로 정확히 확인하여야 한다.\n2. 보상한도는 법령 개정에 따라 변동되므로 계약의 책임개시일을 확인한다.\n3. 담보 대상이 서로 다르면(예: 신체손해와 재산손해) 중복보험이 아니므로 각각 지급한다.\n\nⅤ. 결론\n중복 여부의 판단과 독립책임액의 정확한 산정이 분담의 전제이다.`},
      {q:"화재사고에서 실화책임법과 특수건물 소유자의 책임을 비교하여 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 실화책임에 관한 법률\n1. 내용 — 실화로 인하여 화재가 발생한 경우 연소로 인한 부분에 대하여는 손해배상액의 경감을 청구할 수 있다.\n2. 취지 — 화재는 연소 확대로 손해가 거대해질 수 있으므로 경실화자의 부담을 완화한다.\n3. 적용 — 실화자의 경과실이 있는 경우에 적용되며, 중과실이나 고의인 경우에는 경감되지 않는다.\n\nⅡ. 특수건물 소유자의 책임\n1. 근거 — 화재로 인한 재해보상과 보험가입에 관한 법률\n2. 내용 — 특수건물의 소유자는 그 건물의 화재로 타인이 사망하거나 부상한 경우 과실 유무를 묻지 않고 손해를 배상할 책임을 진다.\n3. 실화책임법의 배제 — 무과실책임이므로 실화책임법에 따른 경감을 주장할 수 없다.\n4. 보험가입 강제 — 신체손해배상특약부 화재보험 가입이 의무화되어 있다.\n\nⅢ. 비교\n1. 책임의 성질 — 실화책임법은 과실책임의 완화, 특수건물 책임은 무과실책임\n2. 적용 대상 — 실화책임법은 일반 실화, 특수건물 책임은 법령이 정한 특수건물\n3. 배상 범위 — 특수건물 책임은 신체손해에 관하여 경감 없이 전액 배상\n\nⅣ. 결론\n특수건물에 해당하는지 여부가 책임의 성질을 좌우하므로 건물의 용도와 규모를 먼저 확인하여야 한다.`},
      {q:"임원배상책임보험(D&O)의 담보내용과 특징을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 의의\n회사의 이사·감사 등 임원이 그 업무를 수행하는 과정에서 부담하는 법률상 손해배상책임을 담보하는 전문직업배상책임보험의 일종이다.\n\nⅡ. 담보내용\n1. 임원 개인이 부담하는 손해배상금과 방어비용\n2. 회사가 임원에게 보상한 금액(Company Reimbursement)\n3. 약관에 따라 회사 자체의 증권 관련 배상책임을 담보하기도 한다.\n\nⅢ. 특징\n1. 담보기준 — 배상청구기준(Claims-made)이 원칙이며 소급담보일자와 ERP가 수반된다.\n2. 손해의 성격 — 신체·재물 손해가 아니라 순수 재산상 손해(경제적 손실)를 담보한다.\n3. 방어비용의 비중이 매우 높다.\n\nⅣ. 주요 면책\n1. 임원의 고의적 부정행위, 사적 이익의 취득\n2. 벌금·과태료 및 징벌적 손해배상금\n3. 신체장해 및 재물손해(다른 보험의 영역)\n4. 보험개시 전에 이미 알고 있던 청구\n\nⅤ. 결론\n중대재해처벌법 시행 이후 경영책임자의 책임이 강화되면서 D&O와 중대재해 배상책임보험의 관계를 함께 설계할 필요가 커졌다.`},
      {q:"의무보험의 보상한도액이 법령 개정으로 변경된 경우 어느 기준을 적용할지 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 문제의 소재\n의무보험의 법정 최저 보상한도는 법령 개정으로 상향되는 경우가 많은데, 개정 전에 체결된 계약에 어느 한도를 적용할 것인지가 문제된다.\n\nⅡ. 적용의 원칙\n1. 보험계약의 내용은 계약 체결 당시의 약관과 법령에 따른다.\n2. 따라서 개정 전에 책임이 개시된 계약에는 개정 전 한도가, 개정 후 책임이 개시된 계약에는 개정 후 한도가 적용된다.\n3. 법령이 소급 적용을 명시한 경우에는 그에 따른다.\n\nⅢ. 실무상 확인사항\n1. 계약의 책임개시일과 보험기간\n2. 사고일자와 계약의 갱신 여부\n3. 갱신 시점에 한도가 자동 상향되었는지\n\nⅣ. 계산에 미치는 영향\n한도가 달라지면 독립책임액이 달라지고, 그 결과 중복보험 안분 결과도 달라진다. 경우에 따라서는 독립책임액의 합계가 손해액에 미달하여 안분 자체가 필요 없게 되기도 한다.\n\nⅤ. 결론\n문제에서 한도가 제시되면 제시된 값을 사용하고, 제시되지 않으면 책임개시일을 기준으로 적용 한도를 특정한 후 그 근거를 답안에 밝혀야 한다.`},

      {q:"법정 의무보험을 열거하고, 급별 보상한도액의 구조와 한도 결합 규칙을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의무보험의 열거\n자동차보험 대인배상Ⅰ, 신체손해배상특약부 화재보험, 가스사고배상책임보험, 다중이용업소 화재배상책임보험, 재난배상책임보험, 체육시설업자 배상책임보험, 유·도선사업자 배상책임보험, 낚시어선업자 배상책임보험, 청소년수련시설 배상책임보험, 어린이놀이시설 배상책임보험, 야영장 배상책임보험, 승강기사고 배상책임보험, 맹견 배상책임보험, 옥외광고사업자 배상책임보험, 기계식주차장 사고 배상책임보험 등이 있다.\n\nⅡ. 한도의 유형\n1. 가입금액 한도형 — 법령이 별도의 급별 기준을 두지 아니하고 자동차손해배상보장법 시행령이 정한 금액 이상으로 가입하도록 하는 유형\n2. 급수별 한도형 — 사망·후유장해·부상의 등급별 금액을 법령이 직접 정한 유형\n\nⅢ. 급별 보상한도 3그룹\n1. 8,000만원군 — 사망 8,000만원, 후유장해 8,000만원부터 500만원, 부상 1,500만원부터 20만원\n2. 1억원군 — 사망 1억원, 후유장해 1억원부터 630만원, 부상 2,000만원부터 80만원\n3. 1.5억원군 — 사망 1.5억원, 후유장해 1.5억원부터 1,000만원, 부상 3,000만원부터 50만원\n\nⅣ. 한도의 결합\n1. 부상과 사망이 함께 발생한 경우 재난·옥외광고물은 합산액 1억 8천만원의 범위에서 지급하고, 그 밖의 보험은 각각 한도를 적용한 후 합산한다.\n2. 후유장해와 사망이 함께 발생한 경우 재난·옥외광고물은 사망액에서 장해액 중 사망일 이후 기간분을 차감하고, 그 밖의 보험은 사망액에서 장해액을 차감한다.\n\nⅤ. 결론\n보상한도는 법령 개정으로 자주 변동되므로 문제에 제시된 금액을 우선하고, 제시되지 아니한 경우에는 책임개시일을 기준으로 특정한 후 근거를 밝혀야 한다.`},
      {q:"의무보험의 부상등급 조정규칙을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n급수별 한도형 의무보험에서 상해의 성상에 따라 등급을 상향 또는 하향 조정하여 보상한도를 정하는 규칙이다.\n\nⅡ. 조정규칙\n1. 제2급부터 제11급까지의 상해 중 개방성 골절은 1등급 상위의 금액을 적용한다.\n2. 단순 선상골절이나 전위가 없는 골절은 1등급 하위를 적용한다.\n3. 2가지 이상의 상해가 중복된 경우에는 최고등급으로부터 하위 3등급 이내에 해당할 때에만 1등급을 상향한다.\n4. 일반외상과 치과보철이 함께 있는 경우에는 각각 산정하되 제1급 금액을 초과하지 아니하는 범위에서 합산한다.\n5. 하나의 상해에 조정요인이 둘 이상 있는 경우에는 폭이 큰 요인으로 1회만 조정한다. 다만 상향요인과 하향요인이 함께 있으면 각각 1회씩 적용한다.\n6. 만 13세 미만의 소아에 대하여는 별도의 기준을 적용한다.\n7. 피판술이나 피부이식의 경우 안면부는 1등급 상향하고 수부와 족부는 1등급 하향한다.\n\nⅢ. 실무상 유의점\n문제에 개방성이라는 표현이 있으면 상향을, 선상골절이나 전위 없는 골절이라는 표현이 있으면 하향을 먼저 검토하여야 한다.\n\nⅣ. 결론\n등급 조정은 보상한도를 직접 바꾸므로 계산의 첫 단계에서 확정하여야 한다.`},
      {q:"선원법상 재해보상의 종류를 조문별로 설명하고, 승무 중 직무 외 재해의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 재해보상의 종류\n1. 요양보상(제94조) — 직무상 재해는 필요한 요양 또는 요양비 전액을 지급한다.\n2. 상병보상(제96조) — 직무상 재해는 4개월까지 통상임금의 100퍼센트, 그 이후에는 통상임금의 70퍼센트를 지급한다.\n3. 장해보상(제97조) — 승선평균임금을 기준으로 등급별 일수를 지급하며 제1급은 1,474일분이다.\n4. 일시보상(제98조) — 승선평균임금 1,474일분\n5. 유족보상(제99조) — 직무상 사망은 1,300일분, 직무 외 사망은 1,000일분\n6. 장제비(제100조) — 승선평균임금 120일분\n7. 행방불명보상(제101조) — 통상임금 1개월분과 승선평균임금 3개월분을 지급하고, 1개월이 지나면 유족보상과 장제비를 지급한다.\n\nⅡ. 승무 중 직무 외 재해\n1. 요양보상은 3개월의 범위에서 지급하며, 건강보험의 대상이 되는 경우에는 본인부담액을 지급한다.\n2. 상병보상은 3개월의 범위에서 통상임금의 70퍼센트를 지급한다.\n3. 유족보상은 승무 중 직무 외의 사고로 사망하거나 요양보상 기간 중에 사망한 경우에 한하여 지급한다.\n\nⅢ. 실무상 쟁점\n요양보상 기간이 경과한 후에 사망한 경우에는 유족보상의 요건을 충족하지 못하여 유족보상이 지급되지 아니하고 장제비만 지급된다.\n\nⅣ. 결론\n선원법 사안은 직무상인지 직무 외인지, 승무 중인지를 먼저 가려야 하며 기준임금이 승선평균임금이라는 점을 놓쳐서는 안 된다.`},
      {q:"신체손해배상특약부 화재보험에서 손해액을 산정하는 방법과 그 특칙을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 책임의 성질\n화재로 인한 재해보상과 보험가입에 관한 법률에 따라 특수건물의 소유자는 화재로 타인이 사망하거나 부상한 경우 과실의 유무를 묻지 아니하고 배상책임을 진다.\n\nⅡ. 손해액의 산정\n1. 사망 — 월급액·월실수입액 또는 평균임금에 장래의 취업가능기간에 해당하는 개월수를 곱한 금액에 장례비를 더한다. 장례비는 남자 평균임금 100일분으로 한다.\n2. 부상 — 치료에 드는 모든 비용\n3. 후유장애 — 노동력 상실의 정도에 따른 금액\n\nⅢ. 특칙\n1. 위자료를 산정하지 아니한다.\n2. 과실상계를 하지 아니한다.\n3. 중간이자를 공제하지 아니하므로 호프만계수를 사용하지 아니하고 취업가능 개월수를 그대로 곱한다.\n\nⅣ. 타인의 범위\n특수건물의 소유자와 주거를 같이하는 직계가족을 제외한 자를 말하며, 법인의 경우에는 이사와 업무집행기관을 제외한다.\n\nⅤ. 결론\n이 보험의 손해액 산정은 법률이 정한 정형적 방식이므로 일반 손해배상의 계산방법을 그대로 적용하여서는 안 된다.`}
    ],

      {r:44,u:"l7",t:"선원법상 수급권자와 각 상속인의 상속비율을 기재하시오.", ref:"l7#3"},
      {r:42,u:"l7",t:"의무보험 9가지 및 1인당 지급가능한 보험금액을 약술하시오. (10점)", a:`Ⅰ. 의의\n의무보험이란 피해자 보호를 위하여 법령이 가입을 강제하는 배상책임보험을 말한다.\n\nⅡ. 주요 의무보험\n1. 자동차손해배상보장법에 따른 자동차보험 대인배상Ⅰ 및 대물배상\n2. 다중이용업소의 안전관리에 관한 특별법에 따른 화재배상책임보험\n3. 화재로 인한 재해보상과 보험가입에 관한 법률에 따른 신체손해배상특약부 화재보험\n4. 재난 및 안전관리 기본법에 따른 재난배상책임보험\n5. 도시가스사업법 및 액화석유가스법에 따른 가스사고배상책임보험\n6. 승강기 안전관리법에 따른 승강기사고 배상책임보험\n7. 체육시설의 설치·이용에 관한 법률에 따른 체육시설 배상책임보험\n8. 유선 및 도선 사업법에 따른 유·도선 사업자 배상책임보험\n9. 원자력 손해배상법에 따른 원자력손해배상책임보험\n\nⅢ. 공통 특징\n1. 법령이 최저 보상한도액을 정한다.\n2. 피보험자의 고의로 인한 사고라도 피해자에게 보험금을 지급하고 피보험자에게 구상한다.\n3. 1인당 한도와 1사고당 한도가 함께 설정되는 경우가 많다.\n\nⅣ. 유의사항\n1인당 지급가능 금액은 법령 개정에 따라 변동되므로, 문제에 한도가 제시되면 제시된 값을 적용하고 제시되지 아니한 경우에는 계약의 책임개시일을 기준으로 적용 한도를 특정하여야 한다.\n\nⅤ. 결론\n의무보험은 피해자 보호를 목적으로 하는 제도이므로 담보의 강제성과 구상 구조를 함께 이해하여야 한다.`}

      {h:"Claims-made의 3종 세트 — 소급담보일자·보고기간연장·통지", freq:F(3,[43,47]),

      {h:"출제되는 영문 조항 10선", freq:F(3,[41,43,46,47,48]),

       <tr><td><b>Claims Cooperation Clause</b><br>(보험금청구 협조조항)</td><td>통제까지는 아니고 <b>협의·협조</b> 의무만 부담한다. Control보다 약한 조항. <b>둘의 차이가 출제 포인트.</b></td></tr>
       <tr><td><b>Waiver of Subrogation</b><br>(대위권 포기)</td><td>보험자가 특정인(발주자, 원청, 계열사 등)에 대한 <b>구상권을 미리 포기</b>. 계약상 요구로 삽입되며, 피보험자가 임의로 포기하면 상법상 보험자 면책 사유가 되므로 특약으로 명시한다.</td></tr>
       <tr><td><b>Additional Insured</b><br>(추가피보험자)</td><td>기명피보험자 외의 자를 피보험자에 추가. 발주자·임대인·원청이 요구한다. <b>Vendors Endorsement</b>는 생산물배상에서 <b>판매자(유통업자)</b>를 추가피보험자로 넣는 특별약관.</td></tr>
       <tr><td><b>Cross Liability</b><br>(교차책임)</td><td>공동피보험자가 여럿일 때 <b>서로를 제3자로 보아</b> 상호간 배상책임을 담보. 없으면 피보험자 상호간 손해는 면책된다.</td></tr>
       <tr><td><b>Severability of Interests</b><br>(피보험자별 개별적용)</td><td>면책·고지의무 등을 <b>피보험자별로 따로</b> 적용. 한 피보험자의 고의가 다른 피보험자의 담보를 깨뜨리지 않는다.</td></tr>
       <tr><td><b>Other Insurance Clause</b><br>(타보험조항)</td><td>중복보험 시 처리 방식 — <b>Primary</b>(우선), <b>Excess</b>(초과), <b>Contribution</b>(분담), <b>Escape</b>(면책).</td></tr>
       <tr><td><b>Deductible / SIR</b><br>(공제금액 / 자기부담보유액)</td><td><b>Deductible</b>은 보험자가 전액 지급 후 피보험자에게 회수, 방어의무는 보험자에게 있다. <b>SIR</b>은 피보험자가 먼저 부담하고 그 초과분부터 보험자 책임이며 <b>방어의무도 SIR 소진 전까지 피보험자</b>에게 있다.</td></tr>
       <tr><td><b>Aggregate Limit</b><br>(총보상한도액)</td><td>보험기간 중 지급의 <b>누적 상한</b>. 1사고당 한도와 별개로 소진되면 담보가 끝난다.</td></tr>
       <tr><td><b>CCC 면책</b><br>(Care, Custody &amp; Control)</td><td>피보험자가 <b>보호·관리·통제</b>하는 재물의 손해는 면책. 배상책임이 아니라 재물보험의 영역이기 때문이다. 임차자배상책임 특약으로 별도 담보한다.</td></tr>
       </table></div>`,
       mnemo:{key:"통·협 / 포·추 / 교·개 / 타·공 / 총·관", how:"영문조항 10선을 2개씩 5쌍으로.<br><b>통</b>제(Claims Control)–<b>협</b>조(Claims Cooperation) → 세기 차이<br><b>포</b>기(Waiver of Subrogation)–<b>추</b>가(Additional Insured) → 남을 위한 조항<br><b>교</b>차책임(Cross Liability)–<b>개</b>별적용(Severability) → 피보험자가 여럿일 때<br><b>타</b>보험조항–<b>공</b>제(Deductible/SIR) → 돈 나누기<br><b>총</b>보상한도–<b>관</b>리재물면책(CCC) → 한계 긋기"}},

      {h:"Deductible과 SIR — 표로 구별", freq:F(2,[46]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>비교</th><th>Deductible (공제금액)</th><th>SIR (자기부담보유액)</th></tr>
       <tr><td>지급 흐름</td><td>보험자가 <b>전액 지급</b> 후 피보험자에게 공제액 회수</td><td>피보험자가 <b>먼저 지급</b>, 초과분만 보험자 지급</td></tr>
       <tr><td>보상한도와의 관계</td><td>한도 <b>내</b>에서 공제 (한도가 줄어드는 효과)</td><td>SIR <b>위에</b> 한도가 얹힘</td></tr>
       <tr><td>방어의무</td><td>보험자가 처음부터 부담</td><td>SIR 소진 전까지 <b>피보험자</b>가 부담</td></tr>
       <tr><td>손해사정 주도</td><td>보험자</td><td>피보험자 (그래서 대기업이 선호)</td></tr>
       </table></div>
       <div class="warn">계산문제에서 "자기부담금 500만원"이 나오면 <b>독립책임액 = min(보상한도액, 손해배상금 − 자기부담금)</b>으로 처리한다. 순서를 바꾸면(먼저 한도를 씌우고 나중에 공제) 답이 달라진다.</div>`},

      {h:"중복보험의 보험금 분담", freq:F(3,[41,45,48,49]),
       body:`<p>같은 손해에 대해 <b>여러 배상책임보험</b>이 걸리는 사안은 책임근재의 단골 계산문제다.</p>
       <p><b>1단계 — 각 보험의 독립책임액 산정</b><br>
       독립책임액 = 그 보험 <b>혼자만 있었다면</b> 지급했을 금액<br>
       = min( 보상한도액 , 그 보험이 담보하는 손해액 − 자기부담금 )</p>
       <p><b>2단계 — 합계와 손해액 비교</b><br>
       독립책임액 합계 ≤ 손해액 → <b>각자 독립책임액 전액</b> 지급 (안분 불필요)<br>
       독립책임액 합계 &gt; 손해액 → <b>안분</b></p>
       <p><b>3단계 — 안분</b><br>
       각 보험자 부담액 = 손해액 × ( 그 보험의 독립책임액 ÷ 독립책임액 합계 )</p>
       <div class="why"><span class="h">왜 이런 순서인가</span>
       중복보험의 목적은 <b>피해자에게 손해액 전액을, 보험자들에게 공평하게</b>다. 그래서 먼저 "혼자라면 얼마?"를 각각 구하고(독립책임액), 합쳐서 손해액을 넘으면 <b>넘는 만큼만 비율로 깎는다</b>. 넘지 않으면 깎을 이유가 없으므로 그대로 준다.</div>
       <div class="warn">담보하는 <b>손해의 범위가 다르면</b> 애초에 중복이 아니다. 예를 들어 근재보험은 <b>사용자배상책임(초과손해)</b>을, 가스사고배상책임보험은 <b>제3자 손해</b>를 담보하므로, 같은 사고라도 <b>피해자별로</b> 어느 보험이 걸리는지 먼저 나눠야 한다. 49회 복합 사례가 정확히 이 구조였다.</div>`,
       mnemo:{key:"독 → 비교 → 안분", how:"① <b>독</b>립책임액 각각 = min(한도, 손해−자기부담금)<br>② 합계와 손해액 <b>비교</b><br>③ 넘으면 손해액 × (자기 독립책임액 / 합계)로 <b>안분</b>, 안 넘으면 전액."}},

      {h:"구상과 대위 — 근재보험의 특수성", freq:F(2,[41,47]),
       body:`<p><b>보험자대위(상법 제682조)</b> — 보험자가 보험금을 지급하면 그 한도에서 <b>피보험자가 제3자에 대해 가지는 권리</b>를 취득한다.</p>
       <p><b>배상책임보험에서의 구상 구조</b></p>
       <ul><li><b>공동불법행위자에 대한 구상</b> — 피보험자가 전액 배상한 후 다른 가해자의 <b>부담부분</b>을 구상. 보험자는 대위로 이를 행사한다.</li>
       <li><b>의무보험의 구상</b> — 피보험자의 고의사고라도 <b>피해자에게는 지급</b>하고 피보험자에게 구상한다(피해자 보호).</li>
       <li><b>하도급 관계</b> — 원청의 근재보험이 지급한 후 하청(실제 가해자)에게 구상할 수 있으나, <b>추가피보험자·대위권 포기 특약</b>이 있으면 차단된다.</li></ul>
       <p><b>산재보험과의 관계 — 근재보험 고유 논점</b></p>
       <ul><li>근로복지공단이 산재급여를 지급하면 <b>제3자(가해자)에 대해 구상</b>한다(산재보험법 제87조).</li>
       <li>다만 <b>사업주(사용자)는 제3자가 아니다.</b> 사용자에 대한 구상은 원칙적으로 인정되지 않는다.</li>
       <li>근재보험(사용자배상책임)은 <b>산재급여를 초과하는 손해</b>만 담보하므로, 산재급여는 손익상계로 공제된 뒤의 금액이 근재보험의 지급대상이 된다.</li></ul>
       <div class="warn">순서 함정 — 산재급여 공제는 <b>손익상계</b>이고, 판례는 산재보험급여에 한하여 <b>"공제 후 과실상계"</b>를 인정한다. 그러나 <b>약관상 일반 순서는 기왕증 → 과실상계 → 손익상계</b>다. 문제에 산재급여가 등장하면 어느 순서를 쓸지 <b>답안에 근거를 밝히고</b> 계산하라.</div>`,
       mnemo:{key:"사업주는 제3자가 아니다", how:"산재 구상의 핵심 한 줄. 공단은 <b>제3자</b>에게 구상하지만 <b>사업주</b>에게는 구상하지 않는다. 그래서 사용자책임은 <b>근재보험</b>이 받아준다."}},

      {h:"비용의 인정 기준 — 한도 밖인가 안인가", freq:F(3,[43,46,47]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>비용</th><th>처리</th></tr>
       <tr><td>손해방지·경감비용</td><td rowspan="3"><b>보상한도액을 초과</b>하여 인정</td></tr>
       <tr><td>대위권 보전·행사 비용</td></tr>
       <tr><td>회사의 요구에 따른 협력비용</td></tr>
       <tr><td>소송비용(변호사보수 등)</td><td rowspan="2"><b>보상한도액 내</b>에서 인정</td></tr>
       <tr><td>공탁보증보험료</td></tr>
       </table></div>
       <div class="warn"><b>근재보험 사용자배상책임 특약은 약관이 두 갈래</b>다.<br>
       ① <b>비례보상형</b> — 소송비용과 협력비용만 규정하고, 손해배상금이 보상한도를 초과하면 <b>보상한도액 ÷ 손해배상액</b> 비율로 비용을 보상한다.<br>
       ② <b>국문영업배상형</b> — 위 표와 같은 방식을 그대로 적용한다.</div>
       <div class="calcbox"><b>비례보상 예시</b><br>
       보상한도 2억원, 손해배상액 4억원, 소송비용 600만원, 협력비용 100만원<br>
       소송비용 = 600만원 × (2억 ÷ 4억) = 300만원<br>
       협력비용 = 100만원 (전액)<br>
       <b>비용 합계 = 400만원</b></div>`,
       mnemo:{key:"손 · 대 · 협은 밖 / 소 · 공은 안", how:"한도를 <b>넘어서</b> 주는 것 — <b>손</b>해방지 · <b>대</b>위권보전 · <b>협</b>력비용.<br>한도 <b>안에서</b> 주는 것 — <b>소</b>송비용 · <b>공</b>탁보증보험료."}},

      {h:"CGL 추가지급조항 (Supplementary Payments) 7항목", freq:F(3,[43,46,47]),
       body:`<ol><li>회사가 지출한 <b>모든 비용</b></li>
       <li><b>보석보증보험료</b> — <b>250달러</b> 한도</li>
       <li><b>차압해제 보증보험료</b> — 보상한도액 범위 내</li>
       <li>피보험자가 회사에 협조하는 데 든 비용 및 <b>1일 100달러</b> 한도의 소득 상실</li>
       <li>피보험자에게 부과된 <b>모든 소송비용</b></li>
       <li><b>예비판결 이자</b> — 회사가 지급을 통지한 이후의 기간은 제외</li>
       <li><b>판결 확정 후의 이자</b></li></ol>
       <div class="warn"><b>원칙은 한도 초과 지급</b>이다. 그러나 증권에 <b>"All Costs &amp; Expenses are included within the L.O.L."</b> 문구가 있으면 <b>보상한도액 내</b>에서 처리한다. 문제에서 이 문구를 주면 계산이 통째로 바뀐다.</div>`,
       mnemo:{key:"250 / 100", how:"두 숫자만 외운다. 보석보증보험료 <b>$250</b>, 협조 소득상실 <b>1일 $100</b>.<br>그리고 원칙은 <b>한도 밖</b>, 예외는 증권의 L.O.L. 포함 문구."}},

      {h:"국문 약관과 영문 약관의 지급보험금 산출 순서", freq:F(3,[45,46,48]),
       body:`<div class="calcbox"><b>국문 약관</b><br>
       지급보험금 = Min[ (손해배상금 − 자기부담금) , 보상한도액 ]<br><br>
       <b>영문 약관</b><br>
       A = Min[ 손해배상금 , 보상한도액 ]<br>
       지급보험금 = A − 자기부담금</div>
       <div class="why"><span class="h">차이가 왜 생기나</span>
       국문은 <b>먼저 빼고 나중에 한도</b>, 영문은 <b>먼저 한도 걸고 나중에 뺀다</b>.<br>
       손해배상금이 한도를 넘는 경우, 국문은 보상한도액 <b>전액</b>이 나갈 수 있지만 영문은 <b>보상한도액 − 자기부담금</b>이 최대다. 즉 영문에서는 <b>보상한도액 전액이 지급되는 일이 없다</b>.</div>
       <div class="calcbox"><b>예</b> — 손해배상금 3억, 보상한도 2억, 자기부담금 2천만원<br>
       국문 = Min[3억 − 2천만, 2억] = <b>2억원</b><br>
       영문 = Min[3억, 2억] − 2천만 = <b>1억 8천만원</b></div>
       <p><b>독립책임액 산정 시</b>에도 이 순서를 그대로 따른다. 순서를 바꾸면 독립책임액이 달라지고, 그 결과 중복보험 안분 결과도 달라진다.</p>
       <div class="warn"><b>손해분담 특별약관</b>이 붙어 있으면 자기부담금을 뺀 뒤 <b>분담비율만큼 한 번 더</b> 공제한다. 예: (3,000만 − 100만) × (1 − 10%) = 2,610만원.</div>`,
       mnemo:{key:"국문은 빼고 씌우고 · 영문은 씌우고 뺀다", how:"이 한 문장이 전부다. 국문 <b>Min(손해−Ded, 한도)</b> / 영문 <b>Min(손해, 한도) − Ded</b>.<br>영문은 한도 전액이 나갈 수 없다는 결론까지 함께 외운다."}}
    ],
    cards:[
      {f:"CGL Coverage A·B·C는?", b:"A=Bodily Injury & Property Damage(신체·재물), B=Personal & Advertising Injury(인격·광고침해), C=Medical Payments(법률상 책임 불문 소액 치료비)."},
      {f:"Supplementary Payments의 특징은?", b:"방어비용·보석보증료·소송비용·판결이자 등을 보상한도액과 별도로 지급한다."},
      {f:"Occurrence와 Claims-made의 차이는?", b:"Occurrence는 보험기간 중 사고 발생이 기준, Claims-made는 보험기간 중 청구 제기가 기준."},
      {f:"Retroactive Date란?", b:"소급담보일자. 이 날짜 이후 발생한 사고에 대한 청구만 담보하며, 그 이전 사고는 보험기간 중 청구되어도 면책."},
      {f:"ERP(Discovery Period)란?", b:"보고기간 연장 담보. 보험기간 종료 후 일정기간 내 제기된 청구를 보험기간 중 청구로 간주한다."},
      {f:"Claims Control과 Claims Cooperation의 차이는?", b:"Control은 재보험자가 손해사정·합의·소송을 직접 통제(동의 없는 합의 불가), Cooperation은 협의·협조 의무만 부담. Control이 더 강하다."},
      {f:"Waiver of Subrogation이란?", b:"보험자가 특정인에 대한 대위(구상)권을 미리 포기하는 특약. 발주자·원청이 계약상 요구한다."},
      {f:"Vendors Endorsement란?", b:"생산물배상책임에서 판매자(유통업자)를 추가피보험자로 편입하는 특별약관."},
      {f:"Cross Liability Clause란?", b:"공동피보험자 상호간을 제3자로 보아 서로에 대한 배상책임을 담보하는 교차책임조항."},
      {f:"Severability of Interests란?", b:"면책·고지의무 등을 피보험자별로 개별 적용. 한 피보험자의 고의가 다른 피보험자 담보를 깨지 않는다."},
      {f:"Other Insurance Clause의 4유형은?", b:"Primary(우선), Excess(초과), Contribution(분담), Escape(면책)."},
      {f:"Deductible과 SIR의 방어의무 차이는?", b:"Deductible은 보험자가 처음부터 방어의무 부담, SIR은 소진 전까지 피보험자가 부담한다."},
      {f:"Aggregate Limit이란?", b:"보험기간 중 지급의 누적 총한도. 소진되면 1사고당 한도가 남아 있어도 담보가 종료된다."},
      {f:"CCC 면책이란?", b:"Care, Custody & Control — 피보험자가 보호·관리·통제하는 재물의 손해는 면책. 임차자배상책임 특약으로 별도 담보."},
      {f:"독립책임액 공식은?", b:"min(보상한도액, 담보손해액 − 자기부담금)."},
      {f:"중복보험 분담 3단계는?", b:"① 독립책임액 각각 산정 ② 합계와 손해액 비교 ③ 초과하면 손해액 × (독립책임액/합계)로 안분."},
      {f:"독립책임액 합계가 손해액 이하이면?", b:"안분하지 않고 각자 독립책임액 전액을 지급한다."},
      {f:"산재보험 구상에서 사업주의 지위는?", b:"사업주는 산재보험법상 '제3자'가 아니므로 원칙적으로 구상 대상이 아니다."},
      {f:"근재보험이 담보하는 손해의 범위는?", b:"산재보험급여를 초과하는 사용자의 법률상 배상책임 손해."},
      {f:"의무보험에서 고의사고의 처리는?", b:"피해자에게는 보험금을 지급하고, 고의의 피보험자에게 구상한다."},

      {f:"보상한도액을 초과하여 인정되는 비용 3가지는?", b:"손해방지·경감비용, 대위권 보전·행사 비용, 회사 요구에 따른 협력비용."},
      {f:"보상한도액 내에서 인정되는 비용은?", b:"소송비용(변호사보수 등)과 공탁보증보험료."},
      {f:"근재 사용자배상책임 특약의 비례보상 방식은?", b:"손해배상금이 보상한도를 초과하면 비용을 (보상한도액 ÷ 손해배상액) 비율로 보상한다."},
      {f:"CGL 추가지급조항의 보석보증보험료 한도는?", b:"250달러."},
      {f:"CGL 추가지급조항의 협조 소득상실 한도는?", b:"1일 100달러."},
      {f:"추가지급조항이 한도 내로 처리되는 경우는?", b:"증권에 'All Costs & Expenses are included within the L.O.L.' 문구가 있을 때."},
      {f:"국문 약관의 지급보험금 산식은?", b:"Min[(손해배상금 − 자기부담금), 보상한도액]."},
      {f:"영문 약관의 지급보험금 산식은?", b:"Min[손해배상금, 보상한도액] − 자기부담금. 보상한도액 전액이 지급되는 일이 없다."},
      {f:"손해분담 특별약관의 처리는?", b:"자기부담금을 공제한 후 분담비율만큼 추가로 공제한다."}
    ],
    quiz:[
      {q:"영문 배상책임보험약관의 Claims Control Clause와 Claims Cooperation Clause를 비교 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n두 조항 모두 사고 발생 시 손해사정과 합의·소송의 수행에 관하여 재보험자(또는 보험자)와 피보험자·출재사의 관계를 정하는 조항이다.\n\nⅡ. Claims Control Clause (보험금청구 통제조항)\n1. 내용 — 재보험자가 손해사정, 합의, 소송의 수행을 직접 통제한다.\n2. 효과 — 피보험자·출재사는 재보험자의 사전 동의 없이 책임을 인정하거나 합의할 수 없다.\n3. 위반 시 — 동의 없는 합의는 재보험자에 대하여 대항할 수 없고 보상이 거절될 수 있다.\n\nⅢ. Claims Cooperation Clause (보험금청구 협조조항)\n1. 내용 — 사고를 즉시 통지하고 처리 과정에서 협의·협조할 의무를 부담한다.\n2. 효과 — 통제권까지는 이전되지 않으며 처리 주체는 여전히 원보험자·피보험자이다.\n3. 위반 시 — 협조의무 위반으로 인한 손해의 범위에서 책임이 조정된다.\n\nⅣ. 비교\n1. 권한의 강도 — Control이 Cooperation보다 강하다.\n2. 합의권 — Control은 사전 동의가 필수, Cooperation은 협의로 족하다.\n3. 실무 — 고액·복잡 위험이나 신뢰가 충분하지 않은 계약에서 Control이 요구된다.\n\nⅤ. 결론\n양 조항은 통제와 협조라는 강도의 차이에 본질이 있으며, 위반의 효과도 그 강도에 대응한다.`},
      {q:"Claims-made Basis 약관에서 소급담보일자(Retroactive Date)와 보고기간연장담보(ERP)의 의의와 기능을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. Claims-made Basis의 의의\n보험기간 중에 피보험자에게 손해배상청구가 제기된 것을 담보 요건으로 하는 담보기준으로, 생산물배상책임과 전문직업배상책임에서 주로 사용된다.\n\nⅡ. 소급담보일자\n1. 의의 — 담보되는 사고의 발생 시점의 하한을 정하는 날짜이다.\n2. 기능 — 소급담보일자 이후에 발생한 사고에 대한 청구만 담보하므로, 그 이전 사고는 보험기간 중 청구되어도 면책된다.\n3. 실무상 쟁점 — 보험자 교체나 담보기준 변경 시 소급담보일자가 갱신일로 재설정되면 과거 사고가 무담보 상태가 되므로 이를 유지하는 것이 중요하다.\n\nⅢ. 보고기간연장담보(ERP)\n1. 의의 — 보험기간 종료 후 일정 기간 내에 제기된 청구를 보험기간 중 제기된 것으로 간주하는 담보이다.\n2. 유형 — 단기간 자동 연장과 추가보험료를 납입하는 선택 연장이 있다.\n3. 기능 — 보험기간 종료로 인한 담보 공백을 메운다.\n\nⅣ. 양자의 관계\n소급담보일자는 담보의 시간적 하한을, 보고기간연장은 상한을 정한다. 두 장치가 함께 있어야 담보기간이 완결된다.\n\nⅤ. 결론\nClaims-made 약관의 실질적 담보범위는 소급담보일자와 ERP에 의하여 결정되므로 계약 인수와 사정 모두 이 두 요소를 먼저 확인하여야 한다.`},
      {q:"Deductible(공제금액)과 SIR(자기부담보유액)의 차이를 설명하고, 손해사정 실무상 차이를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n둘 다 피보험자가 스스로 부담하는 자기부담 부분을 정하는 장치이나 작동 방식이 다르다.\n\nⅡ. Deductible\n1. 보험자가 손해액 전액을 지급한 후 피보험자로부터 공제금액을 회수한다.\n2. 보상한도액 내에서 공제되므로 한도가 실질적으로 감소하는 효과가 있다.\n3. 방어의무와 손해사정의 주도권은 처음부터 보험자에게 있다.\n\nⅢ. SIR\n1. 피보험자가 먼저 자기부담보유액을 지급하고 이를 초과하는 부분부터 보험자가 책임진다.\n2. 보상한도액은 SIR 위에 얹히므로 총 지급가능액이 그만큼 커진다.\n3. SIR이 소진되기 전까지는 방어의무와 손해사정도 피보험자가 수행한다.\n\nⅣ. 실무상 차이\n1. 소액 사고의 처리 주체가 달라진다.\n2. 손해사정 기록과 합의권의 귀속이 달라진다.\n3. 독립책임액 산정 시 자기부담 부분을 먼저 공제한 후 한도를 적용하여야 한다.\n\nⅤ. 결론\n대기업은 사고 처리의 자율성과 보험료 절감을 위하여 SIR을 선호하며, 계산문제에서는 공제와 한도 적용의 순서를 정확히 지켜야 한다.`},
      {q:"CGL의 Coverage A, B, C와 Supplementary Payments의 담보내용을 약술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. Coverage A — Bodily Injury and Property Damage Liability\n피보험자가 제3자의 신체장해 또는 재물손해에 대하여 부담하는 법률상 배상책임을 담보하는 기본담보이다.\n\nⅡ. Coverage B — Personal and Advertising Injury Liability\n명예훼손, 사생활 침해, 불법 침입·퇴거, 광고상의 저작권 침해 등 인격적 이익의 침해로 인한 배상책임을 담보한다. 신체나 재물의 손해가 없어도 담보된다는 점에 특징이 있다.\n\nⅢ. Coverage C — Medical Payments\n피보험자의 법률상 배상책임 유무를 묻지 아니하고 피보험자의 구내 등에서 발생한 사고의 치료비를 소액 한도에서 지급한다. 분쟁의 조기 종결을 목적으로 한다.\n\nⅣ. Supplementary Payments\n방어비용, 보석보증료, 소송비용, 판결이자, 피보험자의 협조에 소요된 비용 등을 담보하며, 원칙적으로 보상한도액과 별도로 지급된다.\n\nⅤ. 결론\nCoverage A와 B는 책임의 유무를 전제로 하는 배상책임 담보이나 Coverage C는 책임을 묻지 않는 예외적 담보라는 점이 구별의 핵심이다.`},
      {q:"Cross Liability Clause와 Severability of Interests Clause의 의의와 차이를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 문제의 소재\n피보험자가 복수인 계약에서 피보험자 상호간의 손해와 개별 피보험자의 사정을 어떻게 취급할 것인지가 문제된다.\n\nⅡ. Cross Liability Clause (교차책임조항)\n1. 의의 — 각 피보험자를 서로에 대하여 제3자로 취급한다.\n2. 효과 — 공동피보험자 상호간의 배상책임도 담보된다. 이 조항이 없으면 피보험자 상호간 손해는 담보 대상이 아니다.\n3. 다만 총 보상한도액이 증액되는 것은 아니다.\n\nⅢ. Severability of Interests Clause (피보험자별 개별적용조항)\n1. 의의 — 약관의 면책조항, 고지·통지의무 등을 피보험자별로 개별적으로 적용한다.\n2. 효과 — 한 피보험자의 고의나 고지의무 위반이 다른 선의의 피보험자의 담보를 상실시키지 아니한다.\n\nⅣ. 차이\n1. Cross Liability는 담보의 대상을 확장하는 조항이다.\n2. Severability는 면책의 적용 범위를 제한하는 조항이다.\n3. 양자는 병존하며 서로를 대체하지 아니한다.\n\nⅤ. 결론\n공동피보험자 구조의 계약에서는 두 조항의 존부를 모두 확인하여야 담보 여부를 정확히 판단할 수 있다.`},
      {q:"중복보험에서 독립책임액 분담방식에 의한 보험금 산정방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n동일한 손해에 대하여 수 개의 책임보험계약이 존재하는 경우 각 보험자가 공평하게 분담하도록 하는 방식이다.\n\nⅡ. 산정 절차\n1. 독립책임액의 산정\n각 보험자가 단독으로 존재하였다면 지급하였을 금액을 산정한다.\n독립책임액 = min(보상한도액, 담보대상 손해배상금 − 자기부담금)\n2. 합계와 손해액의 비교\n독립책임액의 합계가 손해액 이하이면 각자 독립책임액 전액을 지급하고 분담은 문제되지 아니한다.\n3. 안분\n합계가 손해액을 초과하면 다음과 같이 안분한다.\n각 보험자 부담액 = 손해액 × (해당 보험자의 독립책임액 ÷ 독립책임액 합계)\n\nⅢ. 유의사항\n1. 담보하는 손해의 범위가 다르면 그 범위에서는 중복이 아니므로 피해자별·손해항목별로 먼저 구분하여야 한다.\n2. 자기부담금은 한도 적용 전에 공제한다.\n3. 타보험조항이 초과보험 방식으로 규정된 경우에는 안분이 아니라 순차 적용이 된다.\n\nⅣ. 결론\n중복보험 문제는 독립책임액의 정확한 산정에서 승부가 나며, 담보범위의 구분이 선행되어야 한다.`},
      {q:"보험자대위의 의의와 배상책임보험에서의 적용을 설명하고, 대위권 포기특약(Waiver of Subrogation)의 효과를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 보험자대위의 의의\n상법 제682조에 따라 보험자가 보험금을 지급한 때에는 그 지급한 금액의 한도에서 피보험자가 제3자에 대하여 가지는 권리를 취득한다. 피보험자의 이중이득을 방지하고 최종 책임자에게 손해를 귀속시키는 데 취지가 있다.\n\nⅡ. 배상책임보험에서의 적용\n1. 공동불법행위 사안에서 피보험자가 전액 배상한 후 다른 가해자의 부담부분에 대하여 구상권을 행사할 수 있고 보험자가 이를 대위한다.\n2. 의무보험에서는 피보험자의 고의사고라도 피해자에게 지급한 후 피보험자에게 구상한다.\n3. 원·하도급 관계에서는 실제 가해자인 하수급인에 대한 구상이 문제된다.\n\nⅢ. 대위권 포기특약의 효과\n1. 보험자가 특정인에 대한 구상권을 미리 포기하는 특약이다.\n2. 발주자, 원수급인, 계열회사 등이 계약상 요구하는 경우가 많다.\n3. 피보험자가 임의로 권리를 포기하면 그 범위에서 보험자가 면책될 수 있으므로 특약으로 명시하여야 한다.\n4. 포기 대상자에 대하여는 구상이 차단되므로 보험자의 최종 부담이 증가한다.\n\nⅣ. 결론\n대위권 포기특약은 계약관계에서 위험을 보험자에게 최종 귀속시키는 장치이므로 인수 단계에서 요율에 반영하여야 한다.`},
      {q:"산업재해보상보험법상 근로복지공단의 구상권과 근로자재해보상책임보험의 관계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 공단의 구상권\n1. 근거 — 산업재해보상보험법 제87조\n2. 내용 — 제3자의 행위로 재해가 발생하여 보험급여를 지급한 경우 공단은 그 급여액의 한도에서 제3자에 대한 손해배상청구권을 대위한다.\n3. 한계 — 사업주는 여기서 말하는 제3자에 해당하지 아니하므로 원칙적으로 사업주에 대한 구상은 인정되지 아니한다.\n\nⅡ. 근재보험과의 관계\n1. 근재보험 중 사용자배상책임 담보는 산재보험급여를 초과하는 사용자의 법률상 손해배상책임을 담보한다.\n2. 따라서 손해배상액을 산정할 때 산재보험급여는 손익상계로 공제되고 그 잔액이 근재보험의 지급대상이 된다.\n3. 공단이 사업주에게 구상할 수 없는 결과 사용자의 초과 책임은 근재보험이 담당하게 된다.\n\nⅢ. 실무상 유의점\n1. 공제 대상 급여의 항목별 대응관계를 지켜야 한다. 요양급여는 치료비에서, 휴업·장해급여는 일실수익에서 공제한다.\n2. 위자료에서는 공제하지 아니한다.\n3. 판례는 산재보험급여에 한하여 과실상계 후 공제가 아니라 공제 후 과실상계를 인정하므로 계산 순서를 명시하여야 한다.\n\nⅣ. 결론\n산재보험과 근재보험은 중복이 아니라 층을 이루는 관계이며, 공제의 항목별 대응과 순서가 실무의 핵심이다.`},
      {q:"Additional Insured 특약과 Vendors Endorsement의 의의 및 실무상 필요성을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. Additional Insured 특약\n1. 의의 — 기명피보험자 외의 자를 피보험자에 추가하여 그가 부담하는 배상책임까지 담보하는 특약이다.\n2. 대상 — 발주자, 임대인, 원수급인, 관리주체 등\n3. 필요성 — 계약상 상대방이 자신의 책임을 상대방 보험으로 담보할 것을 요구하는 경우 이에 응하기 위한 장치이다.\n4. 효과 — 추가피보험자에 대한 구상이 차단되고 담보범위가 확장된다.\n\nⅡ. Vendors Endorsement\n1. 의의 — 생산물배상책임보험에서 제조업자의 생산물을 판매하는 유통업자를 추가피보험자로 편입하는 특별약관이다.\n2. 필요성 — 생산물 사고에서 피해자는 판매자에게도 청구할 수 있으므로 유통망 전체의 위험을 제조업자의 보험으로 흡수한다.\n3. 한계 — 판매자가 생산물을 변경·가공하거나 별도의 표시를 한 경우, 판매자 고유의 과실로 인한 손해는 담보되지 아니한다.\n\nⅢ. 실무상 유의점\n1. 추가되는 자의 범위를 명확히 기재하여야 한다.\n2. 보상한도액은 공유되므로 한도 소진의 위험을 고려하여야 한다.\n3. 대위권 포기특약과 함께 요구되는 경우가 많다.\n\nⅣ. 결론\n양 특약은 계약관계상 위험을 하나의 보험으로 집중시키는 장치이며, 담보범위와 한도 공유의 효과를 함께 검토하여야 한다.`},
      {q:"CCC(Care, Custody and Control) 면책조항의 의의와 이를 담보하는 방법을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 의의\n피보험자가 보호, 관리 또는 통제하는 재물에 입은 손해에 대한 배상책임을 면책하는 조항이다.\n\nⅡ. 취지\n1. 자신의 지배 아래 있는 재물의 손해는 배상책임보험이 아니라 재물보험이 담보할 영역이다.\n2. 피보험자의 관리 아래 있는 재물은 도덕적 위험이 크고 손해의 우연성 판단이 어렵다.\n\nⅢ. 적용 사례\n1. 임차한 건물의 손해\n2. 수탁받아 수리 중인 물건의 손해\n3. 주차대행업자가 보관 중인 차량의 손해\n\nⅣ. 담보하는 방법\n1. 임차자배상책임 특약 — 임차한 부동산의 손해를 담보한다.\n2. 수탁물배상책임 특약 — 보관·수리 중인 동산의 손해를 담보한다.\n3. 주차장배상책임, 창고업자배상책임 등 업종별 특약을 부가한다.\n\nⅤ. 결론\nCCC 면책은 배상책임보험과 재물보험의 경계를 긋는 조항이며, 실무에서는 업종별 특약의 부가 여부를 반드시 확인하여야 한다.`},

      {q:"배상책임보험에서 비용의 인정 기준을 설명하고, 근로자재해보상책임보험의 특수성을 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 비용의 종류와 처리\n1. 보상한도액을 초과하여 인정되는 비용\n가. 손해의 방지 또는 경감을 위하여 지출한 비용\n나. 제3자에 대한 권리의 보전과 행사를 위하여 지출한 비용\n다. 보험회사의 요구에 따라 협력하기 위하여 지출한 비용\n2. 보상한도액의 범위에서 인정되는 비용\n가. 소송비용과 변호사보수\n나. 공탁보증보험료\n\nⅡ. 법적 근거\n상법 제680조는 손해방지비용을, 제720조는 방어비용을 보험자가 부담하도록 정한다.\n\nⅢ. 근로자재해보상책임보험의 특수성\n1. 사용자배상책임 특별약관은 소송비용과 협력비용만을 규정하는 약관과 국문영업배상책임보험과 동일한 방식을 따르는 약관이 병존한다.\n2. 전자의 경우 손해배상금이 보상한도액을 초과하면 보상한도액을 손해배상액으로 나눈 비율에 따라 비용을 비례보상한다.\n3. 재해보상책임 담보에는 보상한도액이 설정되지 아니하는 것이 일반적이다.\n\nⅣ. 계산 예\n보상한도 2억원, 손해배상액 4억원, 소송비용 600만원, 협력비용 100만원인 경우 소송비용은 600만원에 2억원을 4억원으로 나눈 비율을 곱한 300만원, 협력비용은 100만원으로 합계 400만원이 된다.\n\nⅤ. 결론\n비용은 담보 여부와 별개로 지급되는 경우가 많으므로 약관이 어느 방식을 취하는지를 먼저 확인하여야 한다.`},
      {q:"국문 배상책임보험약관과 영문약관의 지급보험금 산출방법의 차이를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 국문 약관\n지급보험금은 손해배상금에서 자기부담금을 공제한 금액과 보상한도액 중 적은 금액이다. 즉 자기부담금을 먼저 공제한 후 보상한도액을 적용한다.\n\nⅡ. 영문 약관\n먼저 손해배상금과 보상한도액 중 적은 금액을 산정한 후, 그 금액에서 자기부담금을 공제한다.\n\nⅢ. 차이의 효과\n1. 손해배상금이 보상한도액을 초과하는 경우, 국문 약관에서는 보상한도액 전액이 지급될 수 있으나 영문 약관에서는 보상한도액에서 자기부담금을 뺀 금액이 최대가 된다.\n2. 예컨대 손해배상금 3억원, 보상한도액 2억원, 자기부담금 2천만원인 경우 국문은 2억원, 영문은 1억 8천만원이 된다.\n\nⅣ. 독립책임액에의 영향\n중복보험에서 독립책임액을 산정할 때에도 같은 순서를 적용하므로, 순서를 잘못 적용하면 안분 결과 전체가 달라진다.\n\nⅤ. 손해분담 특별약관\n이 특약이 부가된 경우에는 자기부담금을 공제한 후 분담비율에 해당하는 금액을 추가로 공제한다.\n\nⅥ. 결론\n자기부담금과 보상한도액의 적용 순서는 금액을 직접 바꾸므로 답안에 순서를 명시하고 계산하여야 한다.`},
      {q:"C.G.L.의 추가지급조항(Supplementary Payments)의 내용과 보상한도액과의 관계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n손해배상금 자체는 아니나 사고의 처리 과정에서 발생하는 비용을 별도로 담보하는 조항이다.\n\nⅡ. 내용\n1. 회사가 지출한 모든 비용\n2. 보석보증보험료로서 250달러를 한도로 하는 금액\n3. 차압해제를 위한 보증보험료로서 보상한도액의 범위 내의 금액\n4. 피보험자가 회사에 협조하는 데 소요된 비용 및 1일 100달러를 한도로 하는 소득의 상실\n5. 피보험자에게 부과된 모든 소송비용\n6. 예비판결에 따른 이자. 다만 회사가 지급을 통지한 이후의 기간은 제외한다.\n7. 판결이 확정된 후의 이자\n\nⅢ. 보상한도액과의 관계\n1. 원칙적으로 보상한도액을 초과하여 지급한다.\n2. 다만 증권에 모든 비용이 보상한도액에 포함된다는 취지의 문구가 기재된 경우에는 보상한도액의 범위에서 처리한다.\n\nⅣ. 실무상 유의점\n계산문제에서 증권상의 문구를 반드시 확인하여야 하며, 그에 따라 지급총액이 달라진다.\n\nⅤ. 결론\n추가지급조항은 담보의 실질적 범위를 넓히는 조항이므로 그 한도 처리 방식을 함께 검토하여야 한다.`}

  {
    id:"l9", name:"9. 기출 총정리와 답안 훈련", freq:F(3,[41,42,43,44,45,46,47,48,49]),
    sections:[
      {h:"9개년(41~49회) 출제 지도",
       body:`<div class="scroller"><table class="mini">
       <tr><th>영역</th><th>출제 회차</th><th>배점 비중</th><th>비고</th></tr>
       <tr><td><b>재해보상·근재보험 계산</b></td><td>41·42·43·45·47·49</td><td>매우 높음</td><td>가장 확실한 득점원. 평균임금·복합장해율·일실퇴직금</td></tr>
       <tr><td><b>손해배상 법리(750·756·758)</b></td><td>41·42·44·46·48</td><td>높음</td><td>약술 10점으로 반복</td></tr>
       <tr><td><b>영업배상책임보험</b></td><td>42·44·46·47·49</td><td>높음</td><td>시설·보관·도급·임차</td></tr>
       <tr><td><b>생산물·전문직업배상</b></td><td>43·45·46·48</td><td>보통</td><td>제조물책임법 3요건, 3배 배상</td></tr>
       <tr><td><b>특수·의무보험</b></td><td>42·44·45·48·49</td><td>보통</td><td>다중이용업소·신체손배특약부화재·가스·선원법</td></tr>
       <tr><td><b>영문약관·중복보험·구상</b></td><td>41·43·45·46·47·48</td><td>보통</td><td>조항 10선만 외우면 방어 가능</td></tr>
       </table></div>
       <div class="why"><span class="h">60점 전략 — 이 과목은 계산에서 갈린다</span>
       책임근재는 자동차보험보다 <b>계산 비중이 훨씬 높다</b>. 30점짜리 종합 사례가 거의 매년 나오고, 그 안에 재해보상 계산이나 손해배상액 산정이 들어 있다.<br>
       ① <b>계산(단원 3·4)을 완전히 잡으면 30~40점</b>이 확보된다.<br>
       ② 법리 약술(단원 1)과 영업배상(단원 5)에서 각 10점씩 방어.<br>
       ③ 영문약관(단원 8)은 <b>조항 이름 + 한 줄 뜻</b>만으로도 부분점수가 나온다. 버리지 말 것.</div>`},

      {h:"답안 작성의 기본 틀",
       body:`<p><b>약술형(10점) — 5분 안에, A4 반쪽</b></p>
       <ol><li><b>Ⅰ. 의의</b> — 정의 한두 문장. 근거 법조문을 반드시 적는다.</li>
       <li><b>Ⅱ. 요건</b> 또는 <b>Ⅱ. 내용</b> — 번호를 매겨 3~4개.</li>
       <li><b>Ⅲ. 효과</b> 또는 <b>Ⅲ. 실무상 쟁점</b></li>
       <li><b>Ⅳ. 결론</b> — 한 문장. 없으면 감점.</li></ol>
       <p><b>사례형(20~30점) — 반드시 이 순서</b></p>
       <ol><li><b>Ⅰ. 논점의 정리</b> — 무엇을 묻는지 한 문단으로 되짚는다.</li>
       <li><b>Ⅱ. 관련 법리</b> — 근거 조문·판례.</li>
       <li><b>Ⅲ. 사안의 적용</b> — 사실관계를 법리에 대입.</li>
       <li><b>Ⅳ. 계산</b> — 항목별로 식을 쓰고 답을 낸다.</li>
       <li><b>Ⅴ. 결론</b> — "따라서 지급보험금은 ○○○원이다."</li></ol>
       <div class="warn"><b>부분점수의 원리</b> — 채점자는 답안에 있는 <b>키워드와 식</b>에 점수를 준다. 최종 답이 틀려도 중간 식이 맞으면 점수가 나온다. 그러므로 <b>암산 금지, 반드시 식을 쓴다.</b> 반대로 답만 적고 식이 없으면 맞아도 점수가 깎인다.</div>`,
       mnemo:{key:"의·요·효·결 / 논·법·적·계·결", how:"약술형은 <b>의</b>의–<b>요</b>건–<b>효</b>과–<b>결</b>론.<br>사례형은 <b>논</b>점–<b>법</b>리–<b>적</b>용–<b>계</b>산–<b>결</b>론.<br>시험장에서 문제를 읽자마자 답안지 여백에 이 목차부터 쓴다."}},

      {h:"계산 답안의 표준 서식",
       body:`<p>계산문제는 <b>서식이 곧 점수</b>다. 다음 형식을 그대로 외워 쓴다.</p>
       <div class="calcbox"><b>1. 일실수익</b><br>
       월평균임금 3,000,000원 × 노동능력상실률 45% × 호프만계수 180.0000<br>
       = 243,000,000원<br><br>
       <b>2. 위자료</b> … 원<br>
       <b>3. 치료비·개호비</b> … 원<br>
       <b>4. 손해액 합계</b> (1+2+3) = … 원<br>
       <b>5. 기왕증 공제</b> 합계 × (1 − 기여도) = … 원<br>
       <b>6. 과실상계</b> 5 × (1 − 과실률) = … 원<br>
       <b>7. 손익상계</b> 6 − 산재급여 등 = … 원<br>
       <b>8. 지급보험금</b> min(7, 보상한도액) − 자기부담금 = <b>… 원</b></div>
       <div class="why"><span class="h">세 가지 습관</span>
       ① <b>단위를 끝까지 원으로</b> 쓴다(만원 단위 혼용이 실수의 주범).<br>
       ② 소수점 처리 기준(원 미만 절사 등)을 <b>답안 첫 줄에 밝힌다</b>.<br>
       ③ 문제에서 준 수치는 <b>준 대로</b> 쓴다. 호프만계수·감액비율·한도를 자기 기억으로 바꾸지 않는다.</div>`},

      {h:"시간 배분과 시험장 운영",
       body:`<div class="scroller"><table class="mini">
       <tr><th>구성</th><th>배점</th><th>배정 시간</th><th>요령</th></tr>
       <tr><td>약술 10점 × 4</td><td>40점</td><td>각 8분 = 32분</td><td>아는 것부터 먼저. 목차 먼저 쓰고 살 붙이기</td></tr>
       <tr><td>중형 20점</td><td>20점</td><td>18분</td><td>법리와 적용을 분리해서 쓴다</td></tr>
       <tr><td>사례 30점</td><td>30점</td><td>35분</td><td><b>가장 먼저 손댄다.</b> 계산은 시간이 걸린다</td></tr>
       <tr><td>예비</td><td>—</td><td>5분</td><td>빈칸 메우기, 결론 문장 보완</td></tr>
       </table></div>
       <div class="warn"><b>과락 방어의 철칙</b> — 40점 미만이면 다른 과목이 아무리 높아도 불합격이다. 모르는 문제도 <b>백지로 두지 말고</b> 의의 한 줄, 관련 조문 하나라도 적는다. 책임근재는 배점이 큰 사례문제가 있어서 그것을 통째로 비우면 곧바로 과락 위험이 된다.</div>`},

       <tr><td>19</td><td>일실퇴직금</td><td>정년까지 퇴직금 현가 − 이미 수령·수령예정 퇴직금</td></tr>

      {h:"자주 하는 실수 12가지",
       body:`<ol>
       <li>손해액 합계를 내기 전에 과실상계를 먼저 해버린다.</li>
       <li>기왕증 기여도를 <b>곱하는 방향</b>을 반대로 쓴다(기여도 40%면 ×0.6).</li>
       <li>산재급여를 위자료에서까지 공제한다.</li>
       <li>근로기준법 보상과 손해배상액을 <b>더한다</b>(재해보상은 손해배상액에서 공제 대상).</li>
       <li>선원법 사안에 근로기준법 일수(1,000일·90일)를 쓴다.</li>
       <li>복합장해율을 단순 합산한다.</li>
       <li>호프만계수를 240 초과로 쓴다.</li>
       <li>자기부담금을 보상한도 적용 <b>후에</b> 공제한다.</li>
       <li>독립책임액 합계가 손해액 이하인데 안분한다.</li>
       <li>피해자별로 걸리는 보험을 구분하지 않고 한꺼번에 계산한다.</li>
       <li>결론 문장("따라서 지급보험금은 ○○원")을 빠뜨린다.</li>
       <li>단위(원/만원)를 섞어 쓴다.</li>
       </ol>
       <div class="warn">이 12개만 피해도 계산문제에서 10점 이상 차이가 난다. 시험 전날 이 목록만 다시 읽어라.</div>`}
    ],
    cards:[
      {f:"약술형 답안의 4단 구성은?", b:"Ⅰ.의의 Ⅱ.요건(내용) Ⅲ.효과(쟁점) Ⅳ.결론."},
      {f:"사례형 답안의 5단 구성은?", b:"Ⅰ.논점의 정리 Ⅱ.관련 법리 Ⅲ.사안의 적용 Ⅳ.계산 Ⅴ.결론."},

      {f:"과락 기준은?", b:"매 과목 40점 미만이면 불합격. 백지 답안을 만들지 않는다."},

      {f:"시험장에서 가장 먼저 손댈 문제는?", b:"배점이 큰 사례·계산 문제. 시간이 오래 걸리기 때문이다."}

    quiz:[
      {q:"근로자가 업무상 재해로 사망한 경우 사용자가 부담하는 근로기준법상 재해보상과 민사상 손해배상책임의 관계를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 양 책임의 성질\n1. 재해보상 — 근로기준법에 따른 무과실 정액보상책임이다.\n2. 손해배상 — 민법상 불법행위 또는 안전배려의무 위반에 따른 과실책임이며 실손해를 전보한다.\n\nⅡ. 양자의 관계\n1. 병존 — 재해보상을 받았다고 하여 손해배상청구권이 소멸하지 아니한다.\n2. 조정 — 근로기준법 제87조에 따라 같은 사유에 대하여 재해보상을 받으면 그 가액의 한도에서 사용자는 손해배상책임을 면한다.\n3. 산재보험급여를 받은 경우에도 같은 취지로 손해배상액에서 공제된다.\n\nⅢ. 공제의 방법\n1. 항목별 대응 — 요양급여는 치료비에서, 휴업·장해·유족급여는 일실수익에서 공제한다.\n2. 위자료에서는 공제하지 아니한다.\n3. 순서 — 판례는 산재보험급여에 관하여 과실상계 후 공제가 아니라 공제 후 과실상계를 인정한다.\n\nⅣ. 근재보험의 지위\n근로자재해보상책임보험의 사용자배상책임 담보는 위와 같이 공제한 후에도 남는 초과 손해를 담보한다.\n\nⅤ. 결론\n재해보상과 손해배상은 병존하되 이중전보를 막기 위하여 조정되며, 그 잔액이 근재보험의 대상이 된다.`},
      {q:"근로자재해보상책임보험의 담보구조를 설명하고, 각 담보의 지급요건과 보상범위를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 담보구조\n근재보험은 재해보상책임 담보와 사용자배상책임 담보로 구성된다.\n\nⅡ. 재해보상책임 담보\n1. 지급요건 — 근로기준법상 업무상 재해에 해당하면 사용자의 과실을 요하지 아니한다.\n2. 보상범위 — 요양보상, 휴업보상, 장해보상, 유족보상, 장례비 등 법정 보상금\n3. 산재보험에 가입한 사업장에서는 산재보험이 우선하므로 실무상 비중이 작다.\n\nⅢ. 사용자배상책임 담보\n1. 지급요건 — 사용자에게 민법상 불법행위책임 또는 안전배려의무 위반에 따른 배상책임이 있을 것\n2. 보상범위 — 법률상 손해배상액에서 산재보험급여 등을 공제한 초과 손해\n3. 위자료가 포함되며, 과실상계와 기왕증 감액이 적용된다.\n\nⅣ. 양 담보의 관계\n재해보상은 정액·무과실, 사용자배상은 실손해·과실책임이라는 점에서 성질이 다르며 서로 보완한다.\n\nⅤ. 결론\n근재보험 사안은 먼저 산재보험 급여액을 확정하고, 그 초과분에 대하여 사용자배상책임 담보를 적용하는 순서로 처리한다.`},
      {q:"손해배상액 산정에서 기왕증 기여도 공제, 과실상계, 손익상계의 적용순서를 설명하고 그 근거를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 각 제도의 의의\n1. 기왕증 기여도 공제 — 손해 중 기존 질환이 기여한 부분을 손해액에서 제외한다.\n2. 과실상계 — 피해자의 과실을 참작하여 배상액을 감액한다.\n3. 손익상계 — 같은 사유로 얻은 이익을 공제한다.\n\nⅡ. 일반적 적용순서\n손해액 확정 → 기왕증 기여도 공제 → 과실상계 → 손익상계의 순서로 적용한다. 약관과 실무의 일반 원칙이다.\n\nⅢ. 근거\n1. 기왕증 부분은 애초에 사고와 인과관계가 없으므로 손해액 자체에서 제외되어야 한다.\n2. 과실상계는 확정된 손해액에 대한 책임의 분담 문제이다.\n3. 손익상계는 배상액이 정해진 후 이중전보를 방지하는 조정이다.\n\nⅣ. 예외\n산업재해보상보험급여에 관하여 판례는 공제 후 과실상계, 즉 손해액에서 급여를 먼저 공제하지 아니하고 과실상계를 한 후 공제하는 방식이 아니라 급여의 성질을 고려한 별도의 처리를 인정한 사례가 있으므로, 문제에 산재급여가 등장하면 적용할 순서와 근거를 답안에 명시하여야 한다.\n\nⅤ. 결론\n순서가 달라지면 결과가 달라지므로 계산 전에 순서를 선언하고 그 근거를 밝히는 것이 답안의 핵심이다.`},
      {q:"평균임금의 의의와 산정방법을 설명하고, 통상임금과의 관계를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n평균임금이란 산정사유가 발생한 날 이전 3개월 동안 그 근로자에게 지급된 임금의 총액을 그 기간의 총일수로 나눈 금액을 말한다.\n\nⅡ. 산정방법\n1. 산정사유 발생일 이전 3개월간의 임금총액을 구한다.\n2. 그 기간의 총일수로 나눈다.\n3. 상여금과 연차수당은 연간 지급액의 3개월분을 산입한다.\n4. 수습기간, 업무상 부상 요양기간, 사용자 귀책의 휴업기간 등은 기간과 임금 모두에서 제외한다.\n\nⅢ. 통상임금과의 관계\n1. 통상임금은 소정근로에 대하여 정기적·일률적·고정적으로 지급되는 금액이다.\n2. 평균임금이 통상임금보다 적은 경우에는 통상임금을 평균임금으로 한다.\n3. 이는 근로자 보호를 위한 최저 보장이다.\n\nⅣ. 실무상 유의점\n평균임금은 재해보상액의 기준이 되므로 산입·제외 항목을 정확히 판단하여야 하며, 선원의 경우에는 승선평균임금이 기준이 된다.\n\nⅤ. 결론\n평균임금의 산정은 재해보상 계산의 출발점이며, 통상임금과의 비교를 통한 최저 보장을 반드시 확인하여야 한다.`},
      {q:"영업배상책임보험의 주요 담보 특별약관 4가지를 들고 각각의 담보내용을 약술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 시설소유관리자 특별약관\n피보험자가 소유·사용·관리하는 시설 및 그 시설의 용도에 따른 업무의 수행으로 인하여 타인에게 입힌 손해를 담보한다. 시설의 구조상 결함과 관리상 하자가 판단의 중심이다.\n\nⅡ. 보관자(수탁물)배상책임 특별약관\n피보험자가 보관·관리하는 타인의 재물에 입힌 손해를 담보한다. 기본약관의 관리재물 면책을 보완하는 특약이다.\n\nⅢ. 도급업자 특별약관\n피보험자가 수행하는 도급공사 중에 발생한 사고로 타인에게 입힌 손해를 담보한다. 공사 완성 후 인도된 목적물로 인한 사고는 생산물배상책임의 영역이다.\n\nⅣ. 임차자배상책임 특별약관\n피보험자가 임차한 부동산에 입힌 손해에 대한 임대인에 대한 배상책임을 담보한다.\n\nⅤ. 결론\n영업배상책임보험은 기본약관에 어떤 특약을 부가하였는지에 따라 담보 여부가 결정되므로 사고 유형과 특약의 대응관계를 먼저 확인하여야 한다.`},
      {q:"제조물책임법상 결함의 유형과 제조업자의 면책사유를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 결함의 유형\n1. 제조상의 결함 — 제조상 주의의무의 이행 여부와 관계없이 설계와 다르게 제조·가공되어 안전하지 못하게 된 경우\n2. 설계상의 결함 — 합리적인 대체설계를 채용하지 아니하여 손해를 줄이거나 피할 수 있었음에도 그러하지 아니한 경우\n3. 표시상의 결함 — 합리적인 설명·지시·경고 등을 하지 아니한 경우\n\nⅡ. 면책사유\n1. 제조업자가 해당 제조물을 공급하지 아니한 사실\n2. 공급한 때의 과학·기술 수준으로는 결함의 존재를 발견할 수 없었다는 사실(개발위험의 항변)\n3. 공급한 때의 법령이 정하는 기준을 준수함으로써 결함이 발생하였다는 사실\n4. 원재료나 부품의 경우 그 제조물 제조업자의 설계 또는 제작에 관한 지시로 인하여 결함이 발생하였다는 사실\n\nⅢ. 면책의 제한\n제조업자가 제조물을 공급한 후 결함의 존재를 알거나 알 수 있었음에도 그 손해의 발생을 방지하기 위한 적절한 조치를 하지 아니한 경우에는 면책을 주장할 수 없다.\n\nⅣ. 징벌적 손해배상\n제조업자가 결함을 알면서도 필요한 조치를 하지 아니하여 생명 또는 신체에 중대한 손해를 입힌 경우 손해의 3배를 넘지 아니하는 범위에서 배상책임을 진다.\n\nⅤ. 결론\n결함의 유형별 판단기준과 면책사유의 제한을 함께 서술하여야 완결된 답안이 된다.`},
      {q:"민법 제756조 사용자책임의 요건과 면책 가능성을 설명하고, 근로자재해보상책임보험과의 관계를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 요건\n1. 사용관계의 존재 — 실질적인 지휘·감독 관계가 있으면 족하며 고용계약에 한정되지 아니한다.\n2. 사무집행에 관하여 — 외형상 사무집행으로 보이면 인정된다(외형이론).\n3. 피용자의 불법행위 성립\n4. 면책사유의 부존재\n\nⅡ. 면책 가능성\n사용자가 피용자의 선임 및 그 사무감독에 상당한 주의를 하였거나 상당한 주의를 하여도 손해가 있을 경우에는 면책되나, 판례는 이를 거의 인정하지 아니하여 사실상 무과실책임에 가깝게 운용된다.\n\nⅢ. 구상\n사용자는 피용자에게 구상할 수 있으나 신의칙상 상당한 범위로 제한된다.\n\nⅣ. 근재보험과의 관계\n1. 근로자가 피해자인 경우 사용자의 책임은 안전배려의무 위반 또는 제750조·제756조에 따른 책임이며, 이는 근재보험의 사용자배상책임 담보 대상이다.\n2. 제3자가 피해자인 경우에는 영업배상책임보험의 영역이 된다.\n3. 산재보험급여는 손해배상액에서 공제되고 그 초과분이 근재보험의 지급대상이 된다.\n\nⅤ. 결론\n사용자책임은 피해자가 누구인지에 따라 적용 보험이 달라지므로 사안에서 피해자를 먼저 특정하여야 한다.`},
      {q:"동일한 사고에 대하여 산업재해보상보험, 근로자재해보상책임보험, 영업배상책임보험이 각각 문제되는 경우 각 보험의 적용관계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 문제의 소재\n하나의 사고로 근로자와 제3자가 함께 피해를 입은 경우 어느 보험이 어느 손해를 담보하는지를 구분하여야 한다.\n\nⅡ. 피해자별 구분\n1. 피해자가 소속 근로자인 경우\n가. 산재보험이 법정 급여를 우선 지급한다.\n나. 그 급여를 초과하는 사용자의 법률상 배상책임은 근재보험의 사용자배상책임 담보가 부담한다.\n다. 영업배상책임보험은 통상 피보험자의 근로자에 대한 배상책임을 면책한다.\n2. 피해자가 제3자인 경우\n가. 산재보험과 근재보험은 적용되지 아니한다.\n나. 영업배상책임보험 또는 해당 의무보험이 담보한다.\n\nⅢ. 담보 중복의 처리\n같은 손해에 대하여 복수의 배상책임보험이 걸리는 경우에는 각 보험의 독립책임액을 산정하고 그 합계가 손해액을 초과하면 독립책임액 비율로 안분한다.\n\nⅣ. 구상관계\n근로복지공단은 제3자에게 구상할 수 있으나 사업주는 제3자가 아니므로 구상 대상이 되지 아니한다.\n\nⅤ. 결론\n복합 사고는 피해자별로 적용 보험을 먼저 나눈 후 각 보험 내부에서 지급액을 산정하는 순서로 접근하여야 한다.`},
      {q:"신체손해사정 실무에서 노동능력상실률의 판단방법과 복합장해의 처리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 노동능력상실률의 의의\n장해로 인하여 종전의 노동능력을 상실한 비율을 말하며, 일실수익 산정의 핵심 요소이다.\n\nⅡ. 판단방법\n1. 의학적 장해평가 기준(맥브라이드표, AMA 기준 등)에 따라 신체장해의 정도를 평가한다.\n2. 피해자의 연령, 교육 정도, 직업의 성질과 경력, 기능 숙련 정도 등 사회적·경제적 조건을 종합적으로 고려한다.\n3. 후유장해가 영구적인지 한시적인지를 구분하고, 한시장해는 그 기간에 한하여 적용한다.\n\nⅢ. 복합장해의 처리\n1. 여러 부위에 장해가 남은 경우 단순 합산하지 아니한다.\n2. 상실률이 큰 장해부터 순차적으로 적용한다.\n조합상실률 = A + (1 − A) × B, 이후 같은 방식으로 반복한다.\n3. 합계가 100퍼센트를 넘지 아니하도록 한다.\n\nⅣ. 기왕증이 있는 경우\n기왕증의 기여도를 판단하여 손해액에서 그 부분을 공제한다.\n\nⅤ. 결론\n노동능력상실률은 의학적 평가와 사회적 조건의 종합판단이며, 복합장해는 반드시 순차 적용 공식을 사용하여야 한다.`},

       a:`Ⅰ. 의의\n방어비용이란 피해자의 청구에 대응하기 위하여 피보험자가 지출하는 소송비용, 변호사보수, 중재·화해 비용 등을 말한다.\n\nⅡ. 법적 근거\n상법 제720조는 피보험자가 제3자의 청구를 방어하기 위하여 지출한 재판상 또는 재판 외의 필요비용을 보험자가 부담하도록 정한다.\n\nⅢ. 처리의 원칙\n1. 보험자의 지시에 따라 지출한 비용은 보상한도액을 초과하더라도 보험자가 부담한다.\n2. 영문약관에서는 Supplementary Payments로 규정되어 보상한도액과 별도로 지급되는 것이 일반적이다.\n3. 국내 약관에서는 손해방지비용 또는 소송비용으로 규정되며, 한도 내 포함 여부는 약관에 따른다.\n\nⅣ. 유의사항\n1. 배상책임이 인정되지 아니한 경우에도 방어비용은 지급될 수 있다.\n2. SIR 방식에서는 자기부담보유액이 소진되기 전까지 피보험자가 방어의무를 부담한다.\n3. 피보험자가 보험자의 동의 없이 합의한 경우에는 비용의 보상이 제한될 수 있다.\n\nⅤ. 결론\n방어비용은 담보 여부와 별개로 보험자의 부담이 되는 경우가 많으므로 약관의 규정 방식을 먼저 확인하여야 한다.`}

    quiz:[
      {q:"손해사정 실무에서 의학지식이 필요한 이유를 설명하고, 상해와 질병의 구분이 문제되는 대표적 상병을 열거하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의학지식이 필요한 이유\n1. 인과관계의 판단 — 사고와 상병 사이에 상당인과관계가 있는지를 판단하려면 손상기전과 병태생리를 알아야 한다.\n2. 기왕증 기여도의 판단 — 퇴행성 변화가 있는 부위의 손상에서 사고가 기여한 부분을 가려야 한다.\n3. 치료의 적정성 판단 — 치료기간, 고정기간, 수술의 필요성을 판단한다.\n4. 후유장해의 평가 — 노동능력상실률과 장해등급의 근거가 되는 의학적 소견을 검토한다.\n\nⅡ. 상해와 질병의 구분이 문제되는 상병\n1. 회전근개 파열 — 40세 이후 퇴행성 변화가 흔하다.\n2. 반월상 연골 파열 — 외상성은 20대 전후, 퇴행성은 40대 이후에 많다.\n3. 추간판탈출증 — 퇴행성 변화를 기초로 한다.\n4. 후종인대 골화증 — 40세 이후의 질병성 병변이다.\n5. 골다공증성 압박골절 — 경미한 외력으로도 발생한다.\n\nⅢ. 판단의 자료\n1. 손상기전과 외력의 정도\n2. 영상소견상 퇴행성 변화의 존부\n3. 반대측과의 비교\n4. 주치의의 소견과 골밀도 검사 결과\n\nⅣ. 결론\n의학지식은 그 자체가 목적이 아니라 인과관계와 장해 판단의 근거를 확보하기 위한 수단이므로, 손상기전과 합병증의 연결을 중심으로 학습하여야 한다.`},
      {q:"골절의 명명과 분류에 사용되는 기본 용어를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 부위에 따른 명명\n1. 골간(간부) — 긴뼈의 몸통 부분\n2. 골간단 — 몸통과 끝 사이로 해면골이 많은 부분\n3. 골단 — 관절을 이루는 끝 부분\n4. 골단판 — 골단과 골간단 사이의 성장판으로 소아에만 존재한다.\n\nⅡ. 골절선의 모양에 따른 분류\n1. 횡골절 — 장축에 직각인 골절선\n2. 사선골절 — 비스듬한 골절선\n3. 나선골절 — 염전력에 의하여 생기며 골절선이 길고 끝이 예각이다.\n4. 분쇄골절 — 골절선이 2개 이상이고 독립된 골편이 3개 이상인 경우\n5. 분절골절 — 하나의 뼈에 별개의 완전한 골절이 두 군데 존재하는 경우\n\nⅢ. 연부조직 손상 여부에 따른 분류\n1. 폐쇄성 골절\n2. 개방성 골절 — 골절부가 외부와 통하여 감염 위험이 높다.\n\nⅣ. 관절 침범 여부\n관절내 골절은 관절면의 부정합으로 외상성 관절염을 초래하므로 해부학적 정복이 요구된다.\n\nⅤ. 결론\n골절의 명명은 부위, 골절선의 모양, 연부조직 손상, 관절 침범의 네 축으로 이루어지며, 이 분류가 치료방침과 합병증을 결정한다.`},
      {q:"정복술의 종류를 설명하고 각각의 적응을 기술하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 도수정복술\n1. 의의 — 피부를 절개하지 아니하고 손으로 견인과 조작을 가하여 전위된 골편을 정복하는 방법\n2. 적응 — 전위가 크지 아니한 골절, 소아 골절, 탈구\n3. 정복 후에는 석고나 부목으로 고정한다.\n\nⅡ. 비관혈적 정복술\n1. 의의 — 피부를 절개하지 아니하고 영상장비의 유도 아래 경피적으로 강선 등을 삽입하여 고정하는 방법\n2. 적응 — 도수정복으로 정복은 되나 고정이 불안정한 경우\n\nⅢ. 관혈적 정복술\n1. 의의 — 골절부를 절개하여 직접 보면서 정복하고 금속판이나 골수강 내 금속정으로 내고정하는 방법\n2. 적응 — 관절내 골절, 전위나 분쇄가 심한 골절, 도수정복이 실패한 경우, 개방성 골절, 혈관·신경 손상이 동반된 경우\n\nⅣ. 선택의 기준\n관절면의 해부학적 복원이 필요한지, 정복 후 고정이 유지되는지, 조기 관절운동이 필요한지를 기준으로 한다.\n\nⅤ. 결론\n손해사정에서는 시행된 정복술의 종류가 손상의 중증도와 치료의 적정성을 판단하는 지표가 되므로, 각 방법의 적응을 정확히 알아야 한다.`},
      {q:"손해사정 실무에서 영상검사를 선택하는 기준을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 단순 방사선검사(X-ray)\n1. 골절과 탈구의 1차 진단에 사용한다.\n2. 관절 간격의 협소, 골극, 연골하골 경화 등 퇴행성 변화를 확인할 수 있다.\n3. 한계 — 연부조직 병변과 초기 미세골절은 확인하기 어렵다.\n\nⅡ. 전산화단층촬영(CT)\n1. 골절선의 주행과 분쇄 정도, 관절면 침범 여부를 정확히 본다.\n2. 두부 외상의 출혈 감별에 필수적이다.\n\nⅢ. 자기공명영상(MRI)\n1. 인대, 건, 연골, 추간판, 척수 등 연부조직 병변을 본다.\n2. 급성 골절과 진구성 골절의 감별, 초기 무혈성 괴사의 확인에 유용하다.\n\nⅣ. 초음파\n건과 인대의 손상 확인에 사용하며 실시간 검사가 가능하다.\n\nⅤ. 골스캔\n급성 골절과 진구성 골절의 감별, 미세골절의 확인에 유용하다.\n\nⅥ. 관절내시경\n인대 손상을 가장 정확하게 확인할 수 있으며 진단과 치료를 동시에 할 수 있다.\n\nⅦ. 결론\n골절과 탈구는 X선과 CT, 연부조직 손상은 초음파와 MRI라는 원칙을 세우고, 제출된 검사자료가 상병에 대응하는지를 검토하여야 한다.`},
      {q:"의학이론 답안을 작성할 때의 원칙을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 형식\n1. 문제의 소문항 번호를 답안에 그대로 옮겨 적어 대응관계를 명확히 한다.\n2. 나열은 번호를 붙여 명칭과 한 줄 설명의 형태로 기재한다.\n3. 해부학적 명칭은 국문과 영문을 병기한다.\n\nⅡ. 분량\n1. 배점 2점의 소문항은 키워드 한 줄로 충분하다.\n2. 배점 10점의 나열형은 문제가 요구한 개수를 정확히 채운다.\n3. 배점 10점의 서술형은 정의 한두 줄에 항목별 두세 줄을 더한다.\n\nⅢ. 내용\n1. 검사 방법을 묻는 경우 검사의 명칭뿐 아니라 자세와 동작을 함께 기재한다.\n2. 수치 기준이 있는 항목은 반드시 수치를 적는다.\n3. 요구 개수보다 적게 쓰면 그만큼 감점되므로 확실한 항목부터 채운다.\n\nⅣ. 유의사항\n확신이 없더라도 상위 개념이나 인접 개념을 적으면 부분점수를 받을 수 있으나, 명백히 범주가 다른 답은 오답이 된다.\n\nⅤ. 결론\n의학이론은 나열형이 대부분이므로 정확한 명칭과 개수를 채우는 것이 득점의 핵심이다.`},
      {q:"외상 후 관절강직이 발생하는 기전과 예방방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 기전\n1. 관절내 요인 — 관절내 골절로 인한 관절면의 부정합, 관절내 유착, 연골 손상\n2. 관절외 요인 — 관절 주위 연부조직의 반흔과 유착, 근육의 구축, 이소성 골화\n3. 장기간의 고정 — 고정 기간이 길어질수록 관절낭과 인대가 단축된다.\n\nⅡ. 호발 상황\n1. 가동관절에 근접한 관절내 골절\n2. 주관절 탈구 후 장기 고정\n3. 개방성 골절로 치료가 장기화된 경우\n\nⅢ. 예방\n1. 해부학적 정복과 견고한 내고정으로 조기 관절운동을 가능하게 한다.\n2. 고정기간을 필요 최소한으로 한다. 주관절 후방탈구는 정복 후 2주 이내의 부목 고정 후 조기 능동운동을 시행한다.\n3. 이소성 골화의 예방을 위하여 조기 능동운동과 부드러운 수동운동을 병행한다.\n\nⅣ. 손해사정에서의 의의\n고정기간이 과도하게 길었다면 강직장해의 일부가 치료과정에 기인한 것일 수 있으므로 치료의 적정성을 검토하여야 한다.\n\nⅤ. 결론\n강직은 조기 운동으로 예방되는 합병증이므로, 치료기간의 적정성과 장해의 인과관계를 함께 판단하여야 한다.`},
      {q:"골절 치유에 영향을 미치는 인자를 10가지 이상 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 국소 요인\n1. 골절부의 혈액공급 정도\n2. 골편 사이의 간격과 접촉면의 크기\n3. 고정의 안정성\n4. 분쇄의 정도\n5. 연부조직 손상의 정도와 골막의 보존 여부\n6. 감염의 유무\n7. 관절내 골절 여부\n8. 골절부에 가해지는 하중과 운동\n\nⅡ. 전신 요인\n9. 연령 — 소아일수록 치유가 빠르다.\n10. 영양 상태와 단백질·칼슘·비타민의 공급\n11. 흡연 — 치유를 지연시킨다.\n12. 당뇨병, 만성 신부전 등 전신질환\n13. 스테로이드, 비스테로이드성 소염제 등 약물\n14. 호르몬 상태\n\nⅢ. 치유가 빠른 조건\n혈액공급이 풍부하고, 골편이 잘 접촉하며, 고정이 안정적이고, 연부조직 손상이 적으며, 감염이 없고, 환자가 젊고 영양상태가 좋을수록 치유가 빠르다.\n\nⅣ. 결론\n국소 요인과 전신 요인으로 나누어 기술하면 요구 개수를 안정적으로 채울 수 있다.`},
      {q:"지연유합, 불유합, 부정유합을 구별하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 지연유합\n1. 의의 — 해당 골절에서 통상 예상되는 기간 내에 골유합이 이루어지지 아니하였으나 치유가 진행 중인 상태\n2. 처치 — 고정의 보강, 하중 조절, 원인 제거로 유합을 기대할 수 있다.\n\nⅡ. 불유합\n1. 의의 — 골유합의 진행이 멈추어 더 이상 치유가 기대되지 아니하는 상태\n2. 원인 — 혈액공급 부족, 불안정한 고정, 골편 간 간격, 감염, 연부조직 개재\n3. 처치 — 골이식과 재고정 등 수술적 치료가 필요하다.\n\nⅢ. 부정유합\n1. 의의 — 골유합은 이루어졌으나 각형성, 회전변형, 단축 등 변형이 남은 상태\n2. 결과 — 외견상 변형, 인접 관절의 부하 이상, 외상성 관절염, 기능장해\n3. 기준의 예 — 상완골 간부 골절에서 전방 20도 이하 또는 내측 30도 이하의 각형성과 3센티미터 이하의 단축은 외견상 이상을 초래하지 아니하여 부정유합으로 보지 아니한다.\n\nⅣ. 손해사정에서의 의의\n세 가지는 후유장해의 종류와 정도를 달리하므로, 영상소견과 경과기간을 대조하여 구별하여야 한다.\n\nⅤ. 결론\n지연유합은 시간의 문제, 불유합은 치유의 중단, 부정유합은 형태의 문제라는 점이 구별의 핵심이다.`},
      {q:"개방성 골절의 치료원칙을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n골절부가 창상을 통하여 외부와 교통하는 골절로, 세균 오염이 불가피하여 감염의 위험이 매우 높다.\n\nⅡ. 치료원칙\n1. 응급처치 — 생명을 위협하는 손상을 먼저 처치하고, 창상은 멸균 거즈로 덮으며 출혈을 지혈한다.\n2. 항생제의 조기 투여\n3. 파상풍 예방\n4. 철저한 세척과 변연절제술 — 오염물질과 실활조직을 제거한다. 가능한 한 빨리 시행한다.\n5. 골절의 안정된 고정 — 외고정장치 또는 내고정\n6. 창상의 처리 — 일차봉합은 신중히 하고 필요시 개방한 채 두었다가 지연봉합한다.\n7. 연부조직의 피복과 재건\n8. 반복적인 변연절제와 경과 관찰\n\nⅢ. 합병증\n감염과 골수염, 불유합, 골 결손에 의한 단축장해, 장기 치료로 인한 강직장해\n\nⅣ. 손해사정에서의 의의\n개방성 골절은 치료기간이 길고 후유장해의 가능성이 높으므로, 감염 여부와 재수술 경과를 확인하여야 한다.\n\nⅤ. 결론\n개방성 골절의 치료는 감염의 예방이 최우선이며, 세척과 변연절제의 시행 여부가 예후를 결정한다.`},
      {q:"골절에 대한 부목고정의 장점을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n부목고정은 골절부를 일시적 또는 지속적으로 고정하여 안정시키는 방법이다.\n\nⅡ. 장점\n1. 골절부의 움직임을 막아 통증을 감소시킨다.\n2. 골편의 추가 전위를 방지한다.\n3. 날카로운 골편에 의한 혈관, 신경, 연부조직의 이차 손상을 예방한다.\n4. 출혈과 부종을 감소시킨다.\n5. 근육의 연축을 완화한다.\n6. 폐쇄성 골절이 개방성 골절로 진행하는 것을 방지한다.\n7. 환자의 이송을 용이하게 한다.\n8. 석고고정과 달리 부종의 증가에 대응할 수 있어 구획증후군의 위험이 낮다.\n\nⅢ. 유의사항\n1. 인접 관절을 포함하여 고정한다.\n2. 지나치게 조이면 혈류장애와 구획증후군을 초래할 수 있다.\n3. 고정이 장기화되면 관절강직을 유발한다.\n\nⅣ. 결론\n부목고정은 추가 손상의 방지와 통증 감소가 주된 목적이며, 부종에 대응할 수 있다는 점에서 초기 처치로 선호된다.`}

      {h:"부정유합의 세 얼굴 — 각형성·회전·단축", freq:F(3,[41,42,46,47]),
       body:`<p>47회는 대퇴골 간부 분쇄골절에서 <b>"어떤 변형이 예상되는가 5가지"</b>를 물었다. 근육의 견인 방향으로 답한다.</p>

       body:`<div class="scroller"><table class="mini">
       <tr><th>비교</th><th>구획증후군</th><th>볼크만 허혈성 구축</th></tr>
       <tr><td>부위</td><td><b>하지</b>(대퇴·종아리), 상지</td><td><b>상지(전완부)</b></td></tr>
       <tr><td>원인</td><td>대퇴골·경골 골절, 석고고정</td><td>상완골 <b>과상골절</b>, 주관절 탈구, 동물 물림, 석고고정, 구획증후군의 진행</td></tr>
       <tr><td>기전</td><td>부종 → 구획 내압 상승 → 근육·혈관·신경 압박과 괴사</td><td>전완부 동·정맥 압박 → 혈액공급 차단 → 근육 구축·괴사</td></tr>
       <tr><td>징후</td><td><b>5P</b> — 통증, 창백, 감각이상, 마비, 무맥</td><td><b>6P</b> — 5P + 부풀음(puffiness), <b>갈퀴손 변형</b></td></tr>
       <tr><td>신경</td><td>구획에 따라 다름</td><td><b>정중·척골신경</b>(요골은 드묾)</td></tr>
       <tr><td>치료</td><td>지체 거상, 석고 제거, <b>조직내압 30mmHg 이상이면 근막절개술</b></td><td>초기 근막절개술, 후기에는 반흔 절제·유착박리·신경박리·전완골 단축술·근육전이술</td></tr>
       </table></div>
       <div class="why"><span class="h">둘의 관계</span>
       구획증후군은 <b>급성 응급 상황</b>이고, 볼크만 구축은 그것을 방치했을 때 남는 <b>영구적 후유증</b>이다. 즉 <b>원인과 결과</b> 관계다.</div>`,
       mnemo:{key:"5P 구획 / 6P 볼크만", how:"<b>P</b>ain · <b>P</b>allor · <b>P</b>aresthesia · <b>P</b>aralysis · <b>P</b>ulselessness.<br>볼크만은 여기에 <b>P</b>uffiness를 더해 6P, 그리고 <b>갈퀴손</b>."}},

      {h:"정형외과적 응급 — 수술을 미룰 수 없는 것들", freq:F(2,[47]),
       body:`<ol><li><b>개방성 골절</b> — 감염 예방을 위해 즉시 세척·변연절제</li>
       <li><b>구획증후군</b> — 근막절개술</li>
       <li><b>혈관 손상을 동반한 골절·탈구</b> — 사지 생존이 걸린다</li>
       <li><b>고관절 탈구</b> — <b>24시간 내</b> 정복해야 무혈성 괴사를 줄인다</li>
       <li><b>견관절 탈구</b> — 액와신경 손상 방지를 위해 가능한 한 빨리 정복</li>
       <li><b>대퇴 경부 골절(젊은 층)</b> — 무혈성 괴사 방지</li>
       <li><b>척수 압박을 동반한 척추 손상 · 마미증후군</b></li>
       <li><b>화농성 관절염·급성 골수염</b></li>
       <li><b>절단·불완전 절단</b> — 재접합</li></ol>
       <div class="warn">공통점은 <b>시간이 지나면 되돌릴 수 없다</b>는 것이다. 혈류가 끊기거나(구획·혈관·무혈성괴사), 감염이 번지거나(개방성·화농성), 신경이 눌린다(마미).</div>`,
       mnemo:{key:"피 · 균 · 신경", how:"응급의 이유는 셋뿐 — <b>피</b>가 안 통하거나, <b>균</b>이 들어갔거나, <b>신경</b>이 눌린 경우."}},

      {h:"소아 골절 — 어른과 무엇이 다른가", freq:F(3,[41,42,48,49]),
       body:`<p><b>소아 뼈의 5대 특징</b></p>
       <ol><li>미성숙 골격</li>
       <li><b>두꺼운 골막</b> — 골편을 붙잡아 준다</li>
       <li><b>재성형력(remodeling power)</b> — 남은 변형을 스스로 교정한다</li>
       <li><b>빠른 치유력</b></li>
       <li><b>골단판(성장판)</b>이 존재한다</li></ol>
       <div class="why"><span class="h">과성장과 총검형 중첩</span>
       소아는 골절 후 <b>과성장</b>하여 다친 쪽이 더 길어질 수 있다. 대퇴골·경골은 1~2년 사이 약 <b>1.5cm</b> 과성장한다. 그래서 치료할 때 일부러 <b>약 2cm 중첩</b>시켜 붙이는 <b>총검형 중첩</b>을 시행한다.<br>
       42회가 6세 남아의 경골 부정유합(전방 7도 각변형)에서 <b>치료와 그 이유</b>를 물은 것이 이 논점이다. 답은 <b>보존적 관찰 — 재성형력으로 자연 교정되기 때문</b>이다.</div>
       <p><b>소아 특유의 골절 3종</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>명칭</th><th>특징</th></tr>
       <tr><td><b>소성 변형</b><br>(plastic deformation)</td><td>골막이 두껍고 뼈가 유연해 <b>휘어지기만</b> 한다. 골절선이 보이지 않는다. 보존적 치료, 각변형·관절운동제한이 남으면 교정술.</td></tr>
       <tr><td><b>융기 골절</b><br>(torus/buckle)</td><td>골간단 해면골과 간부 치밀골의 이행부가 <b>찌그러지는</b> 불완전골절. 주로 요골. 확실한 골절선이 없다.</td></tr>
       <tr><td><b>녹색줄기 골절</b><br>(greenstick)</td><td><b>한쪽 피질골만</b> 부러지고 반대측 피질골과 골막은 온전하다. 한쪽 면에서만 골절선이 보인다.</td></tr>
       </table></div>
       <p><b>Salter-Harris 골단판 손상 분류</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>형</th><th>손상 부위</th><th>예후·치료</th></tr>
       <tr><td>Ⅰ형</td><td>성장판 자체의 분리(골간단-골단 분리)</td><td>수지골·족지골. 예후 좋음</td></tr>
       <tr><td>Ⅱ형</td><td>성장판 + 골간단</td><td><b>가장 흔하다.</b> 요골 원위·경비골 원위. 예후 좋음</td></tr>
       <tr><td><b>Ⅲ형</b></td><td>성장판 + 골단(관절면 침범)</td><td><b>수술 필요</b></td></tr>
       <tr><td><b>Ⅳ형</b></td><td>관절면에서 시작해 성장판을 가로질러 골간단까지</td><td>상완골·경골 원위. <b>수술 필요</b></td></tr>
       <tr><td>Ⅴ형</td><td>성장판의 압박</td><td>매우 드물고 <b>예후가 매우 나쁘다</b></td></tr>
       </table></div>
       <div class="warn">Ⅲ·Ⅳ형은 <b>관절면을 침범</b>하므로 수술이 필요하고, Ⅴ형은 성장판이 으스러져 <b>성장정지</b>가 온다. 손해사정에서는 성장판 침범이 <b>하지 단축·각변형 장해</b>로 이어진다는 점이 핵심이다.</div>`,
       mnemo:{key:"소 · 융 · 녹 / SALTR", how:"소아 골절 3종 — <b>소</b>성변형 · <b>융</b>기골절 · <b>녹</b>색줄기골절.<br>Salter-Harris는 영문 첫 글자로 — <b>S</b>lip(Ⅰ, 성장판만) · <b>A</b>bove(Ⅱ, 골간단 쪽) · <b>L</b>ower(Ⅲ, 골단 쪽) · <b>T</b>hrough(Ⅳ, 관통) · <b>R</b>ammed(Ⅴ, 압박)."}},

      {h:"무혈성 괴사 — 세 군데를 외운다", freq:F(3,[41,42,46])  ,
       body:`<p><b>정의</b> — 뼈에 혈액공급이 차단되어 골조직이 괴사하는 것. 골절·탈구로 영양혈관이 끊기면 발생한다.</p>
       <p><b>외상 후 호발 3부위</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>부위</th><th>이유</th></tr>
       <tr><td><b>대퇴골두</b></td><td>대퇴 경부 골절·고관절 탈구로 대퇴골두로 가는 혈류가 끊긴다</td></tr>
       <tr><td><b>수근부 주상골</b></td><td>요골동맥이 원위부에서 들어와 근위부로 역행하므로 근위 골편이 굶는다</td></tr>
       <tr><td><b>거골 체부</b></td><td>표면의 60%가 관절연골이라 혈관이 들어올 자리가 좁다. <b>탈구를 동반하면 100%</b> 괴사</td></tr>
       </table></div>
       <p>그 밖에 상완골두(4분 골절), 월상골(키엔벡병)도 알려져 있다.</p>
       <p><b>비외상성 원인</b> — 46회가 5개를 물었다.</p>
       <ol><li>과도한 음주·만성 알코올 중독</li>
       <li>고용량·장기간 <b>스테로이드</b> 사용(천식, 류마티스 관절염, 전신홍반루푸스)</li>
       <li>흡연</li>
       <li>잠수병(감압병)</li>
       <li>겸상적혈구병 등 혈액질환</li>
       <li>골수증식성 장애, 방사선 조사</li>
       <li>만성 간질환, 크론병</li>
       <li>동맥 색전증·혈전증</li></ol>
       <div class="warn"><b>영상 소견</b> — 단순방사선 초기에는 <b>Crescent 징후</b>(연골하 골절선), 진행하면 골두 함몰·납작해짐·관절간격 협소. MRI는 초기 무증상 괴사와 <b>이중선 징후</b>를 보여준다. <b>Patrick 검사 양성</b>, 특히 <b>외전과 내회전</b> 제한.</div>`,
       mnemo:{key:"대 · 주 · 거", how:"무혈성 괴사 3대 부위 — <b>대</b>퇴골두 · <b>주</b>상골 · <b>거</b>골.<br>비외상성 원인은 <b>술 · 스테로이드 · 담배 · 잠수</b> 넷만 먼저 외우고 나머지를 붙인다."}},

      {h:"지방색전증후군 — 장관골 골절 후 갑자기 숨이 차면", freq:F(2,[49]),
       body:`<p>49회 1번이 그대로 나왔다. <b>3일 전 양측 대퇴골 골절 → 갑자기 호흡곤란 + 의식저하 + 흉부 점상출혈</b>. 답은 <b>지방색전증후군</b>이다.</p>
       <ul><li><b>발생</b> — 장관골(특히 대퇴골) 골절 및 수술, 화상 후. 수상 <b>24~72시간</b> 사이에 많다.</li>
       <li><b>3대 증상</b> — <b>호흡부전, 의식장애(뇌 증상), 점상출혈</b>(주로 상흉부·결막·구강점막)</li>
       <li><b>Gurd &amp; Wilson 진단기준</b> — 주증상 1개 이상 + 부증상 4개 이상 + 지방 고분자글로불린혈증<br>
       · 주증상 — 호흡부전(<b>PaO₂ &lt; 60mmHg</b>), 뇌 증상, 점상출혈<br>
       · 부증상 — 빈맥(<b>분당 110회 이상</b>), 발열(<b>38.5℃ 초과</b>), 망막 변화, 황달, 신기능 이상, 혈소판 감소, 적혈구용적률 감소</li>
       <li><b>초기 치료</b> — <b>산소 공급</b>이 핵심이다. 필요시 기계환기, 수액과 전해질 교정, 골절부의 조기 안정화, 대증적 치료. 스테로이드는 예방 목적으로 거론된다.</li></ul>
       <div class="warn">폐색전증(혈전)과 혼동하면 안 된다. <b>지방색전</b>은 골절 직후 며칠 내, <b>점상출혈</b>이 특징. <b>폐색전</b>은 심부정맥혈전이 떨어져 나간 것으로 장기 침상안정 후에 많다.</div>`,
       mnemo:{key:"숨 · 정신 · 점", how:"지방색전 3대 증상 — <b>숨</b>이 차고, <b>정신</b>이 흐려지고, <b>점</b>상출혈.<br>장관골 골절 후 <b>2~3일째</b>면 거의 이것이다. 초기 치료는 <b>산소</b>."}}
    ],
    cards:[
      {f:"골절 치유의 4단계는?", b:"염증기 → 연성 가골기 → 경성 가골기 → 재형성기."},
      {f:"일차 골유합과 이차 골유합의 차이는?", b:"일차는 금속판 압박고정으로 가골 없이 직접 유합, 이차는 가골을 거쳐 유합한다."},
      {f:"대퇴골 간부 골절의 변형 5가지는?", b:"전방 각형성(장요근), 외반 각형성(외전근), 내반 각형성(내전근), 회전 변형, 단축."},
      {f:"상완골 간부에서 부정유합으로 보지 않는 기준은?", b:"전방 20도 이하 또는 내측 30도 이하 각형성, 3cm 이하 단축."},
      {f:"중수골 골절 후 손가락이 교차하는 원인은?", b:"회전 변형에 의한 부정유합. 주먹을 쥐어야 확인된다."},
      {f:"구획증후군의 5P는?", b:"Pain(통증), Pallor(창백), Paresthesia(감각이상), Paralysis(마비), Pulselessness(무맥)."},
      {f:"근막절개술의 기준 압력은?", b:"조직내압 30mmHg 이상."},
      {f:"볼크만 허혈성 구축의 부위와 원인은?", b:"전완부. 상완골 과상골절, 주관절 탈구, 석고고정, 구획증후군의 진행."},
      {f:"볼크만 구축에서 손상되는 신경은?", b:"정중신경과 척골신경(요골신경은 드묾). 갈퀴손 변형이 특징."},
      {f:"고관절 탈구는 언제까지 정복해야 하나?", b:"24시간 이내. 무혈성 괴사를 줄이기 위해서다."},
      {f:"소아 뼈의 5대 특징은?", b:"미성숙 골격, 두꺼운 골막, 재성형력, 빠른 치유력, 골단판의 존재."},
      {f:"소아 골절 후 과성장의 정도는?", b:"대퇴골·경골은 1~2년 사이 약 1.5cm. 그래서 약 2cm 총검형 중첩을 시행한다."},
      {f:"소아 특유의 골절 3종은?", b:"소성 변형, 융기 골절, 녹색줄기 골절."},
      {f:"녹색줄기 골절이란?", b:"한쪽 피질골만 부러지고 반대측 피질골과 골막은 온전한 불완전골절."},
      {f:"Salter-Harris 분류에서 가장 흔한 형은?", b:"Ⅱ형(성장판 + 골간단). 요골 원위·경비골 원위에 많다."},
      {f:"Salter-Harris에서 수술이 필요한 형은?", b:"Ⅲ형과 Ⅳ형. 관절면을 침범하기 때문이다."},
      {f:"Salter-Harris Ⅴ형의 특징은?", b:"성장판의 압박. 매우 드물고 예후가 매우 나쁘다(성장정지)."},
      {f:"무혈성 괴사의 3대 호발부위는?", b:"대퇴골두, 수근부 주상골, 거골 체부."},
      {f:"거골 탈구가 동반되면 무혈성 괴사율은?", b:"족관절 또는 거골하관절 탈구 동반 시 100%."},

    quiz:[
      {q:"대퇴골 간부 분쇄골절에서 치료가 적절하지 않은 경우 예상되는 골 변형을 5가지 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 변형이 생기는 기전\n대퇴골 간부가 골절되면 골절의 위치에 따라 근위 골편과 원위 골편에 작용하는 근육의 견인 방향이 달라져 여러 양상의 변형이 나타난다.\n\nⅡ. 예상되는 변형\n1. 전방 각형성 변형 — 장요근이 근위 골편을 굴곡시켜 발생한다.\n2. 외반 각형성 변형 — 중둔근 등 외전근이 근위 골편을 외전시켜 발생한다.\n3. 내반 각형성 변형 — 내전근이 원위 골편을 내측으로 견인하여 발생한다.\n4. 회전 변형 — 근위 골편의 외회전이 흔하다.\n5. 단축 변형 — 대퇴사두근과 햄스트링의 동시 수축, 골 결손, 분쇄에 의한다.\n6. 그 밖에 지연유합과 불유합, 감염이 동반될 수 있다.\n\nⅢ. 손해사정에서의 의의\n각형성과 단축은 영상으로 계측하고, 회전 변형은 주먹을 쥐거나 보행을 관찰하여 확인한다. 단축은 스캐노그램으로 건측과 비교하여 계측한다.\n\nⅣ. 결론\n변형의 방향은 근육의 견인으로 설명되므로, 골절 부위와 부착 근육을 함께 기술하여야 완결된 답안이 된다.`},
      {q:"구획증후군과 볼크만 허혈성 구축을 비교하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 구획증후군\n1. 부위 — 주로 하지의 대퇴부와 종아리, 상지에도 발생한다.\n2. 원인 — 대퇴골·경골 골절, 석고고정에 의한 압박\n3. 기전 — 부종으로 구획 내압이 상승하여 근육, 혈관, 신경이 압박되고 괴사에 이른다.\n4. 징후 — 통증, 창백, 감각이상, 마비, 무맥의 5P\n5. 치료 — 지체를 심장보다 높게 하고 석고를 제거하며, 조직내압이 30밀리미터수은주 이상이면 근막절개술을 시행한다.\n\nⅡ. 볼크만 허혈성 구축\n1. 부위 — 상지의 전완부\n2. 원인 — 상완골 과상골절, 주관절 탈구, 석고고정, 구획증후군의 진행\n3. 기전 — 전완부 동정맥의 압박으로 혈액공급이 차단되어 근육의 구축과 괴사가 일어난다.\n4. 징후 — 5P에 부풀음을 더한 6P와 갈퀴손 변형. 정중신경과 척골신경이 손상되며 요골신경 손상은 드물다.\n5. 치료 — 초기에는 근막절개술, 후기에는 반흔조직 절제술, 유착박리술, 신경박리술, 전완골 단축술, 근육전이술\n\nⅢ. 양자의 관계\n구획증후군은 급성기의 응급 상황이고 볼크만 허혈성 구축은 이를 적시에 처치하지 못한 결과 남는 영구적 후유증이다.\n\nⅣ. 결론\n부위, 징후의 수, 손상되는 신경이 구별의 핵심이며, 손해사정에서는 초기 처치의 적정성이 쟁점이 된다.`},
      {q:"소아 골절의 특징적인 골절 형태를 기술하고, 성인 골절과의 차이를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 소아 뼈의 특징\n1. 미성숙 골격\n2. 두꺼운 골막\n3. 재성형력이 있어 잔존 변형을 스스로 교정한다.\n4. 치유력이 빠르다.\n5. 골단판이 존재한다.\n\nⅡ. 소아 특유의 골절 형태\n1. 소성 변형 — 골막이 두껍고 뼈가 유연하여 골절선 없이 휘어지기만 한다.\n2. 융기 골절 — 골간단과 골간의 이행부가 압박으로 찌그러지는 불완전골절로 주로 요골에 발생하며 확실한 골절선이 없다.\n3. 녹색줄기 골절 — 한쪽 피질골만 부러지고 반대측 피질골과 골막은 온전하다.\n\nⅢ. 성인 골절과의 차이\n1. 재성형력이 있어 어느 정도의 각변형은 보존적 치료로 교정된다.\n2. 치유가 빨라 고정기간이 짧고 관절강직이 드물다.\n3. 골단판 손상 시 성장장애가 발생할 수 있다.\n4. 과성장이 일어나 대퇴골과 경골은 1~2년 사이 약 1.5센티미터가 더 자랄 수 있으므로 치료 시 약 2센티미터의 총검형 중첩을 시행한다.\n\nⅣ. 결론\n소아 골절은 성인과 달리 자연 교정을 기대할 수 있으나 성장판 손상은 영구적 장해로 이어지므로 구별하여 접근하여야 한다.`},
      {q:"Salter-Harris 골단판 손상 분류를 설명하고, 각 형의 예후와 치료를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n소아의 골단판 손상을 손상 부위에 따라 다섯 가지로 나눈 분류이다.\n\nⅡ. 분류\n1. 제1형 — 골단판 자체가 분리되어 골단과 골간단이 분리된다. 수지골과 족지골에 흔하며 예후가 좋다.\n2. 제2형 — 골단판과 골간단이 함께 손상된다. 가장 흔하며 요골 원위부와 경비골 원위부에 발생하고 예후가 좋다.\n3. 제3형 — 골단판과 골단이 손상되어 관절면을 침범한다. 수술적 치료가 필요하다.\n4. 제4형 — 관절면에서 시작하여 골단판을 가로질러 골간단까지 연장된다. 상완골과 경골 원위부에 발생하며 수술적 치료가 필요하다.\n5. 제5형 — 골단판이 압박되는 손상으로 매우 드물고 예후가 매우 나쁘다.\n\nⅢ. 예후를 가르는 요소\n관절면의 침범 여부와 골단판의 혈류 손상 정도가 결정적이다. 제3형과 제4형은 해부학적 정복이 필요하고 제5형은 성장정지가 초래된다.\n\nⅣ. 손해사정에서의 의의\n골단판 손상은 성장장애로 이어져 하지 단축이나 각변형 장해를 남길 수 있으므로 성장이 끝난 후 재평가가 필요하다.\n\nⅤ. 결론\n제3형 이상은 수술이 필요하고 제5형은 예후가 가장 나쁘다는 점이 분류의 실익이다.`},
      {q:"무혈성 괴사의 정의와 골절 후 외상성 무혈성 괴사가 흔히 발생하는 부위를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 정의\n뼈에 대한 혈액공급이 차단되어 골세포와 골수가 괴사하는 상태를 말한다. 골절이나 탈구로 영양혈관이 손상되면 발생한다.\n\nⅡ. 외상성 무혈성 괴사의 호발부위\n1. 대퇴골두 — 대퇴 경부 골절이나 고관절 탈구로 대퇴골두로 가는 혈류가 차단된다.\n2. 수근부 주상골 — 영양혈관이 원위부로 들어와 근위부로 역행하므로 근위 골편의 혈류가 끊긴다.\n3. 거골 체부 — 표면의 상당 부분이 관절연골로 덮여 혈관이 들어올 부위가 좁으며, 족관절이나 거골하관절 탈구가 동반되면 거의 전부에서 발생한다.\n4. 그 밖에 상완골두의 사분 골절, 월상골\n\nⅢ. 임상 경과\n초기에는 증상이 없거나 경미하고, 진행하면 통증과 관절운동 제한이 나타나며 특히 외전과 내회전이 제한된다.\n\nⅣ. 영상소견\n단순방사선에서 초기에는 연골하 골절선인 초승달 징후가 보이고, 진행하면 골두의 함몰과 관절간격의 협소가 나타난다. 자기공명영상은 초기 병변과 이중선 징후를 보여준다.\n\nⅤ. 결론\n무혈성 괴사는 골절 당시가 아니라 수개월에서 수년 후에 나타나므로, 장해 평가 시점의 결정에 유의하여야 한다.`},
      {q:"대퇴골두 무혈성 괴사의 비외상성 원인을 5가지 이상 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 비외상성 원인\n1. 과도한 음주와 만성 알코올 중독\n2. 고용량의 스테로이드를 장기간 사용한 경우. 천식, 류마티스 관절염, 전신홍반루푸스의 치료에서 문제된다.\n3. 흡연\n4. 잠수병(감압병)\n5. 겸상적혈구병 등 혈액질환\n6. 골수증식성 장애\n7. 만성 간질환\n8. 크론병\n9. 동맥 색전증과 혈전증\n10. 방사선 조사\n\nⅡ. 호발 연령과 성별\n비교적 젊은 30대에서 50대에 많고 남성에게 더 많이 발생한다.\n\nⅢ. 손해사정에서의 의의\n비외상성 원인이 확인되면 사고와의 인과관계가 부정되거나 기여도가 낮게 평가될 수 있으므로, 음주력, 스테로이드 복용력, 기왕 질환을 반드시 확인하여야 한다.\n\nⅣ. 결론\n대퇴골두 무혈성 괴사는 외상성과 비외상성의 감별이 곧 인과관계 판단이므로, 원인 목록을 정확히 알고 병력을 조사하여야 한다.`},
      {q:"장관골 골절 후 갑작스러운 호흡곤란, 의식저하, 흉부 점상출혈이 발생한 경우의 질환명과 초기 치료를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 질환명\n지방색전증후군이다.\n\nⅡ. 발생 기전\n장관골 특히 대퇴골의 골절이나 수술로 골수의 지방이 혈류로 유입되어 폐를 비롯한 여러 장기의 모세혈관을 막고, 유리지방산에 의한 염증반응이 일어난다. 수상 후 24시간에서 72시간 사이에 발생하는 경우가 많다.\n\nⅢ. 3대 증상\n1. 호흡부전 — 저산소혈증\n2. 뇌 증상 — 의식저하, 혼돈, 불안\n3. 점상출혈 — 상흉부, 액와부, 결막, 구강점막\n\nⅣ. 진단\nGurd와 Wilson의 기준에 따라 주증상 1개 이상, 부증상 4개 이상, 지방 고분자글로불린혈증을 확인한다. 주증상의 호흡부전은 동맥혈 산소분압 60밀리미터수은주 미만을 기준으로 하고, 부증상에는 분당 110회 이상의 빈맥, 섭씨 38.5도를 넘는 발열, 망막 변화, 황달, 신기능 이상, 혈소판 감소, 적혈구용적률 감소가 있다.\n\nⅤ. 초기 치료\n1. 산소 공급이 가장 중요하며 필요시 기계환기를 시행한다.\n2. 수액과 전해질을 교정하고 순환을 유지한다.\n3. 골절부를 조기에 안정화하여 지방의 추가 유입을 막는다.\n4. 대증적 치료를 병행한다.\n\nⅥ. 결론\n장관골 골절 후 수일 내 호흡곤란과 점상출혈이 나타나면 지방색전증후군을 의심하고 즉시 산소 공급을 시작하여야 한다.`},
      {q:"정형외과적 손상 중 응급 처치 및 수술을 요하는 경우를 열거하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 응급을 요하는 손상\n1. 개방성 골절 — 감염 예방을 위한 조기 세척과 변연절제\n2. 급성 구획증후군 — 근막절개술\n3. 주요 혈관 손상을 동반한 골절 또는 탈구\n4. 고관절 탈구 — 무혈성 괴사를 줄이기 위하여 24시간 이내에 정복한다.\n5. 견관절 탈구 — 액와신경 손상을 막기 위하여 가능한 한 빨리 정복한다.\n6. 젊은 환자의 대퇴 경부 골절 — 무혈성 괴사의 예방\n7. 척수 압박을 동반한 척추 손상\n8. 마미증후군\n9. 화농성 관절염과 급성 골수염\n10. 절단 또는 불완전 절단 — 재접합\n11. 소아의 상완골 과상골절에서 혈관 손상이 의심되는 경우\n\nⅡ. 공통된 이유\n혈류의 차단, 감염의 확산, 신경의 압박은 시간이 지나면 회복이 불가능하므로 시간이 예후를 결정한다.\n\nⅢ. 결론\n응급의 기준은 손상의 크기가 아니라 지연으로 인한 비가역적 손상의 위험이다.`},
      {q:"지연유합, 불유합, 부정유합의 원인과 처치를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 지연유합\n1. 의의 — 통상의 치유기간 내에 유합되지 아니하였으나 치유가 진행 중인 상태\n2. 원인 — 불충분한 고정, 과도한 하중, 혈액공급의 저하, 흡연과 영양불량\n3. 처치 — 고정의 보강, 원인의 제거, 경과 관찰로 유합을 기대한다.\n\nⅡ. 불유합\n1. 의의 — 유합의 진행이 정지하여 더 이상 치유가 기대되지 아니하는 상태\n2. 원인 — 골편 간의 간격, 연부조직의 개재, 감염, 혈액공급의 차단, 불안정한 고정\n3. 처치 — 골이식과 견고한 재고정, 감염이 있으면 감염의 제거가 선행되어야 한다.\n\nⅢ. 부정유합\n1. 의의 — 유합은 되었으나 각형성, 회전, 단축의 변형이 남은 상태\n2. 원인 — 부적절한 정복, 고정의 소실, 조기 하중\n3. 처치 — 기능장해나 외견상 문제가 있으면 교정 절골술을 시행한다.\n\nⅣ. 손해사정에서의 의의\n세 가지는 후유장해의 성질이 다르다. 불유합은 가관절에 의한 기능장해, 부정유합은 변형과 인접 관절의 이차 변화로 이어진다.\n\nⅤ. 결론\n경과기간과 영상소견을 대조하여 어느 상태인지 확정한 후 장해를 평가하여야 한다.`},
      {q:"관절 내 골절에 의한 부정유합으로 진행되는 질환과 그 치료방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 진행되는 질환\n관절내 골절이 해부학적으로 정복되지 아니한 채 유합되면 관절면의 부정합이 남아 외상성 관절염으로 진행한다. 관절연골의 마모, 관절 간격의 협소, 연골하골의 경화, 골극의 형성이 나타나고 통증과 관절운동 제한이 생긴다.\n\nⅡ. 임상 경과\n수상 후 6개월에서 1년 정도가 지나 증상이 뚜렷해지는 경우가 많다.\n\nⅢ. 치료방법\n1. 보존적 치료 — 활동 조절, 소염진통제, 물리치료, 관절내 주사, 보조기\n2. 관절경적 변연절제술과 세척\n3. 교정 절골술 — 하중선을 이동시켜 관절면의 부하를 분산한다.\n4. 관절 유합술 — 통증은 없어지나 운동은 소실된다. 종골하 관절 등에서 시행한다.\n5. 인공관절 치환술 — 고령이거나 관절 파괴가 심한 경우\n\nⅣ. 손해사정에서의 의의\n외상성 관절염은 강직장해와 기능장해로 이어지며, 관절 유합술을 시행한 경우에는 운동장해가 확정된다.\n\nⅤ. 결론\n관절내 골절은 해부학적 정복이 원칙이며, 부정유합이 남으면 외상성 관절염을 예정한 것과 같다.`}

    past:[
      {r:47,u:"m1",t:"50세 성인 남자가 교통사고로 우측 대퇴골의 간부에 분쇄 골절이 있어 수술적 치료를 하였다. 치료가 적절하지 않아서 골 변형이 생겼다. 어떤 변형이 예상되는지 5가지를 기술하시오. (10점)", ref:"m1#0"},
      {r:49,u:"m1",t:"3일 전 교통사고로 양측 대퇴골 골절로 입원한 60세 남자 환자가 갑자기 호흡곤란, 의식 저하 및 흉부 점상 출혈이 발생하였다. (1) 질환명 (2) 초기 치료 (각 5점)", ref:"m1#6"},
      {r:48,u:"m1",t:"성인에서 발생하는 골절과 차별되는 소아 골절의 특징적인 골절 형태를 2가지 이상 나열하시오. (10점)", ref:"m1#2"},
      {r:46,u:"m1",t:"외상으로 급성 구획증후군이 발생하였다. 전형적인 증상 5개를 기술하세요. (10점)", ref:"m1#1"},
      {r:46,u:"m1",t:"대퇴골두 괴사는 대퇴골 경부골절의 합병증으로 일어날 수 있다. 그 밖에 비외상성으로 대퇴골두 무혈성 괴사를 일으킬 수 있는 것은 무엇이 있는가요? 5개 기술하시오. (10점)", ref:"m1#5"},
      {r:46,u:"m1",t:"다음 그림은 연부 조직에 손상 없이 제4중수골 골절 후 유합이 되었으나 손가락을 굽힐 때 손가락이 교차하게 되었다. 원인은 무엇인가? (10점)",
       a:`Ⅰ. 원인\n회전 변형에 의한 부정유합이다.\n\nⅡ. 설명\n1. 중수골 경부 골절은 중수골 골절 중 가장 흔하며 주먹을 쥔 상태에서 중수지관절이 가격되어 발생한다.\n2. 정복이 불충분하거나 고정 중 회전이 교정되지 아니한 채 유합되면 회전 변형이 남는다.\n3. 회전 변형은 손가락을 편 상태에서는 드러나지 아니하고 주먹을 쥐어 굴곡시킬 때 손가락이 겹치거나 교차하는 형태로 나타난다.\n\nⅢ. 감별\n연부조직 손상이 없다고 하였으므로 건 유착이나 신경 손상에 의한 변형은 배제된다. 각형성 변형은 주로 배측 각형성으로 나타나며 손가락의 교차를 일으키지 아니한다.\n\nⅣ. 치료\n기능장해가 있으면 교정 절골술을 시행한다.\n\nⅤ. 결론\n중수골 골절 후 손가락의 교차는 회전 변형의 전형적인 소견이며, 이는 영상만으로는 확인되지 아니하고 주먹을 쥐게 하여 진찰하여야 한다.`},
      {r:42,u:"m1",t:"6세 남아가 우측 경골 간부에 골절 후 부정 유합으로 7도 정도의 전방 각 변형이 형성되었다. 향후 치료(5점)와 그 이유(5점)는?",
       a:`Ⅰ. 향후 치료\n수술적 교정을 하지 아니하고 경과를 관찰하는 보존적 치료를 시행한다.\n\nⅡ. 이유\n1. 소아는 골막이 두껍고 성장이 진행 중이므로 재성형력을 가진다.\n2. 재성형은 나이가 어릴수록, 성장판에 가까울수록, 변형의 방향이 인접 관절의 운동면과 일치할수록 잘 이루어진다.\n3. 6세는 성장이 많이 남은 연령이고 7도의 전방 각변형은 경미하므로 성장 과정에서 자연히 교정될 것으로 기대된다.\n\nⅢ. 경과 관찰 시 확인사항\n1. 각변형의 진행 여부를 정기적으로 촬영하여 확인한다.\n2. 하지 길이의 차이와 회전 변형의 동반 여부를 확인한다.\n3. 회전 변형은 재성형으로 교정되지 아니하므로 별도로 판단하여야 한다.\n\nⅣ. 수술을 고려하는 경우\n변형이 진행하거나 성장이 얼마 남지 아니한 연령이거나 관절운동에 제한을 초래하는 경우에는 교정 절골술을 고려한다.\n\nⅤ. 결론\n소아의 경미한 각변형은 재성형력에 의하여 교정되므로 관찰이 원칙이나, 회전 변형은 교정되지 아니한다는 점에 유의하여야 한다.`},
      {r:42,u:"m1",t:"불안정성 골절이란 무엇인가? (10점)",
       a:`Ⅰ. 의의\n정복 후에도 외력이나 근육의 견인에 의하여 전위가 재발할 가능성이 높아, 외고정만으로는 정복 상태를 유지할 수 없는 골절을 말한다.\n\nⅡ. 판단 기준\n1. 골절선의 모양 — 사선골절, 나선골절, 분쇄골절\n2. 골편의 수와 전위의 정도\n3. 연부조직과 인대의 손상 정도\n4. 척추의 경우 삼주 이론에 따라 두 개 이상의 주가 손상된 경우\n5. 골간단부보다 관절내 침범이 있는 경우\n\nⅢ. 임상적 의의\n불안정성 골절은 관혈적 정복과 내고정 또는 외고정장치에 의한 안정화가 필요하다.\n\nⅣ. 예\n1. 척추의 방출성 골절 중 전주와 중주가 파괴되고 후주까지 파열된 경우\n2. 골반의 수직 전단 손상\n3. 전위된 삼과 골절\n\nⅤ. 결론\n안정성 여부의 판단이 치료방법을 결정하므로, 골절선의 모양과 손상된 구조물의 범위를 함께 기술하여야 한다.`},
      {r:41,u:"m1",t:"무혈성괴사의 정의(4점) 및 골절 후 외상성 무혈성괴사가 흔히 발생하는 부위 3가지 이상(6점)을 쓰시오.", ref:"m1#4"},

       <tr><td>기전</td><td><b>외전 + 외회전</b> (럭비, 테니스, 투구)</td><td>굴곡·내회전 상태의 직접외력, <b>전기충격·간질발작</b></td></tr>
       <tr><td>동반병변</td><td><b>방카르트 병변</b>(전하방 관절와순 파열)<br><b>힐삭스 병변</b>(상완골두 후측 함몰)</td><td>영상에서 <b>전구 징후</b>(light bulb sign)</td></tr>
       </table></div>
       <div class="warn"><b>가능한 한 빨리 정복</b>해야 한다. <b>액와신경 손상</b>을 막기 위해서다. 합병증은 액와동맥·액와신경 손상, 재발성 탈구, 회전근개 파열, 삼각근 위축으로 인한 <b>외전 제한</b>.</div><div class="qfig"><div class="qrd">기출 44회 1번 (10점)</div><div class="qt">상지의 구조 — 뼈와 관절의 이름</div><div class="qq">(1) ①~⑤ 각 숫자에 해당하는 <b>뼈</b>의 이름을 쓰시오. (5점)<br>
    (2) 점선으로 표시된 ⑥·⑦·⑧에 해당하는 <b>관절</b>의 이름을 쓰시오. <span class="hint">(견관절·완관절이 아닌 구체적 명칭)</span> (3점)<br>

      {h:"회전근개 파열과 어깨충돌증후군 — 기왕증 판단의 핵심", freq:F(3,[43,49]),
       body:`<p><b>회전근개 4근육</b> — 견갑하근(Subscapularis), 극상근(Supraspinatus), 극하근(Infraspinatus), 소원근(Teres minor). 상완골두를 관절와에 눌러 붙여 <b>견관절 안정성</b>을 만든다.</p>
       <ul><li><b>가장 많이 손상되는 근육 — 극상근</b></li>
       <li>진행 순서 — 부분파열 → 전층파열, 소파열 → 대파열, <b>극상근 → 극하근·견갑하근 → 소원근</b></li>
       <li>증상 — <b>40세 이후</b> 시작, 어깨 전방통, <b>특히 120~160도</b>에서 팔 올리기 어려움, 누우면 심해지는 <b>야간통</b></li>
       <li>진단 — <b>Jobe 검사(Empty Can Test)</b>, 영상은 <b>MRI</b>와 <b>초음파</b>(관절내시경이 가장 정확)</li>
       <li>치료 — 부분파열은 보존적, 전층파열은 건봉합술·견봉성형술, 고령·광범위 파열은 인공관절 치환술</li></ul>
       <div class="why"><span class="h">충돌증후군과 무엇이 다른가</span>
       <b>어깨충돌증후군</b>은 견봉과 상완골 사이가 좁아져 <b>극상근건이 견봉에 부딪혀</b> 염증이 생긴 것이다. 팔을 드는 <b>중간에는 안 아프다가 완전히 올라갈 때</b> 아프다. 교사·도배공처럼 팔을 위로 쓰는 직업에 많다.<br>
       <b>회전근개 파열</b>은 건 자체가 찢어진 것이라 <b>들어올리면 아프고 동시에 근력이 약하다</b>.<br>
       이 구분이 곧 <b>기왕증(퇴행성) vs 외상</b>의 판단이다. 40대 이후의 회전근개 파열은 퇴행성 변화가 바탕에 있는 경우가 많다.</div><div class="qfig"><div class="qrd">기출 예상</div><div class="qt">회전근개 — 네 개의 근육</div><div class="qq">(1) 회전근개를 이루는 ①~④ 근육의 이름을 쓰시오.<br>
    (2) 이 중 <b>파열이 가장 흔한 것</b>과, 그 파열을 확인하는 이학적 검사 이름을 쓰시오.<br>
    (3) 어깨충돌증후군에서 통증이 심해지는 <b>각도 범위</b>를 쓰시오.</div><svg viewBox="0 0 560 320" role="img" aria-label="회전근개 문제 그림">

</svg><details class="ansbox"><summary>정답 보기</summary><div class="ansb"><b>(1)</b> ① 극상근(supraspinatus) ② 극하근(infraspinatus) ③ 소원근(teres minor) ④ 견갑하근(subscapularis)<br>
 <b>(2)</b> 파열이 가장 흔한 것은 <b>극상근</b> — 견봉 아래 좁은 공간을 지나 반복 마찰을 받기 때문. 검사는 <b>Jobe 검사(empty can test)</b>, 낙상 징후(drop arm sign)<br>
 <b>(3)</b> 외전 <b>60°~120°</b> 구간에서 통증이 심해진다 (painful arc)</div><div class="qtip"><span class="h">여기서 갈린다</span><b>극상·극하·소원근은 뒤, 견갑하근만 앞</b>이다. 그래서 앞의 견갑하근만 <b>내회전</b>을 담당하고 나머지는 외전·외회전이다. 파열은 거의 항상 <b>극상근</b>에서 시작한다 — 기왕증 다툼이 가장 많은 부위이기도 하다.</div></details></div>`,
       mnemo:{key:"견 · 극상 · 극하 · 소원", how:"회전근개 4근육 — <b>견</b>갑하근 · <b>극상</b>근 · <b>극하</b>근 · <b>소원</b>근. 파열은 <b>극상근</b>부터.<br>충돌증후군은 <b>끝까지 올릴 때</b> 아프고, 파열은 <b>들면서 아프고 힘도 없다</b>."}},

      {h:"상완골 골절과 주관절", freq:F(3,[41,42,47,49]),
       body:`<p><b>상완골 근위부 골절</b> — <b>고령·여성·골다공증</b>에서 많다. 골편 수로 비전위·2분·3분·4분 골절로 나눈다. <b>4분 골절은 인공관절(상완골두) 치환술</b>이 원칙인데, 골다공증과 무혈성 괴사로 내고정이 유지되지 않기 때문이다.</p>
       <p><b>상완골 간부 골절 → 요골신경 손상</b></p>
       <ul><li>원인 — 상완골 간부·과상부 골절, 목발 등 장기 압박, <b>허니문 마비·토요일밤 마비</b></li>
       <li>증상 — <b>수근하수(wrist drop)</b>, <b>제1물갈퀴 공간 배측 감각소실</b></li>
       <li>부정유합 불인정 기준 — 전방 20도 이하·내측 30도 이하 각형성, 3cm 이하 단축</li></ul>
       <p><b>주관절</b> — 3개의 관절이 한 주머니에 들어 있다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>관절</th><th>구성</th><th>종류·운동</th></tr>
       <tr><td>상완척골관절</td><td>상완골 활차 – 척골 활차절흔</td><td>경첩관절 / 굴곡·신전</td></tr>
       <tr><td>상완요골관절</td><td>상완골 소두 – 요골두</td><td>절구관절 / 굴곡·신전</td></tr>
       <tr><td>근위요척관절</td><td>요골두 – 척골 요골절흔</td><td>차축관절 / <b>회외·회내</b></td></tr>
       </table></div>
       <div class="warn"><b>척골신경</b>이 주관절과 가장 가깝다. 상완골 내과 골절, 주관절 탈구, 외과골절 부정유합에 의한 외반변형에서 손상된다. 증상은 <b>손가락 벌리기 제한, 갈퀴손 변형, 프로멘트 징후, 제5지·제4지 내측 감각소실</b>. <b>주관증후군</b>은 주관절을 굽힐 때 주관이 좁아져 생기는 압박성 신경병증이다.<br>
       변형의 방향도 외운다 — <b>내·외과 골절은 외반주, 과상골절은 내반주</b>.</div>
       <p><b>주관절 후방탈구</b> — 골단 유합기인 <b>11~15세</b>에 호발, <b>후방탈구가 80~90%</b>. 치료는 도수정복 후 <b>100~110도 굴곡 상태에서 2주 이내 부목 고정</b> 후 <b>조기 능동운동</b>. 고정이 길어지면 <b>신전 제한</b>이 남는다.</p>
       <p><b>전완골 골절 2대 명칭</b> — <b>몬테지아</b>(척골 근위부 골절 + 요골두 탈구, 성인은 반드시 수술), <b>갈레아찌</b>(요골 간부 골절 + 원위 요척관절 탈구, 매우 불안정해 수술이 꼭 필요해 '필요골절'이라 불린다).</p>`,
       mnemo:{key:"간부→요골 / 내과→척골 / 과상→정중", how:"상완골 <b>간</b>부는 <b>요</b>골신경(수근하수), <b>내</b>과는 <b>척</b>골신경(갈퀴손), <b>과</b>상부는 볼크만과 <b>정중</b>신경.<br>몬테지아=<b>척</b>골+<b>요</b>골두탈구, 갈레아찌=<b>요</b>골+원위<b>요척</b>관절탈구. 이름 순서가 반대다."}},

      {h:"원위 요골 골절과 완관절", freq:F(2,[44,47]),
       body:`<p><b>신체에서 가장 흔한 골절</b>(전체 골절의 <b>15~20%</b>). 60세 이상·여성·골다공증에서 저에너지 손상으로, 젊은 층은 스포츠 고에너지 손상으로 발생한다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>명칭</th><th>전위 방향</th><th>변형</th></tr>
       <tr><td><b>콜레스 골절</b></td><td>원위 골편이 <b>후(배)방</b></td><td><b>Dinner fork(만찬 포크) 변형</b>, 후방 분쇄·요골 단축</td></tr>
       <tr><td><b>스미스 골절</b></td><td>원위 골편이 <b>전(장)방</b></td><td><b>정원삽 변형</b>, 전방 분쇄</td></tr>
       <tr><td>바톤 골절</td><td colspan="2">관절 변연부 골절 + 수근골 탈구·아탈구 — <b>관절내 골절</b></td></tr>
       <tr><td>운전기사 골절</td><td colspan="2">요골 경상돌기 견열 + 수근골 전위 — <b>관절내 골절</b></td></tr>
       <tr><td>월상골 부하 골절</td><td colspan="2">월상골와 후방측 함몰 — <b>관절내 골절</b></td></tr>
       </table></div>
       <div class="warn">뒤의 세 가지는 <b>모두 관절내 골절</b>이므로 해부학적 정복이 필요하다. 합병증은 완관절·수부 강직, 외상성 관절염, 그리고 <b>정중신경 손상·수근관 증후군·CRPS</b>.</div>
       <p><b>삼각섬유연골 복합체(TFCC)</b> 병변은 <b>원위 요척관절</b>에서 발생한다(44회 출제).</p>`},

      {h:"수근관 증후군과 CRPS", freq:F(3,[47]),
       body:`<p><b>수근관 증후군</b> — 손목에서 <b>정중신경</b>이 눌리는 것으로 <b>상지에서 가장 흔한 신경압박 질환</b>이다.</p>
       <ul><li>호발 — <b>40~60대 중년 여성</b>, 비만·당뇨·혈액투석</li>
       <li>증상 — <b>밤에 심해지는</b> 저림, <b>1·2·3수지와 4수지 요측</b>의 감각이상, 장기화되면 <b>단무지외전근·무지대립근 위축</b></li>
       <li>검사 — <b>팔렌 검사, 티넬 징후</b>, 확진은 <b>근전도·신경전도 검사</b></li>
       <li>수술 적응 — 무지구근 위축, <b>50세 이상</b>, 수지 무감각 지속, 증상이 심하거나 <b>10개월 이상</b> 지속, <b>팔렌검사 30초 이내 양성</b></li></ul>
       <p><b>복합부위 통증 증후군(CRPS)</b> — 손상 정도에 비해 훨씬 심한 통증이 손상이 나은 뒤에도 지속되는 만성 신경병성 통증.</p>
       <div class="scroller"><table class="mini">
       <tr><th>형</th><th>과거 명칭</th><th>신경손상</th></tr>
       <tr><td><b>제1형</b></td><td>반사성 교감신경 이영양증</td><td>명백한 신경손상의 증거가 <b>없다</b></td></tr>
       <tr><td><b>제2형</b></td><td>작열통(causalgia)</td><td>증명 가능한 <b>신경손상이 있다</b></td></tr>
       </table></div>
       <ul><li>호발 — <b>40~60세</b>(소아는 거의 없음), <b>여성 &gt; 남성</b>, <b>상지 &gt; 하지</b></li>
       <li>증상 — 감각과민, 통각과민(마약성 진통제가 잘 듣지 않음), <b>이질통</b>(옷·바람·머리카락에 닿아도 극심한 통증), 체온·발한·피부색 이상, 부종, <b>신경분포와 무관한</b> 통증</li>
       <li>경과 — 1단계 국소 통증 → 2단계 통증 악화·부종 확대·관절운동제한·골다공증·피부색 변화 → 3단계 전신 확산·관절강직·근위축</li>
       <li><b>진단 — Budapest criteria</b>: <b>3범주 이상에서 각 1개 이상의 증상</b> + <b>2범주에서 각 1개 이상의 징후</b>. <b>증상은 환자의 주관적 호소, 징후는 의사가 관찰한 객관적 소견</b>이다.</li>
       <li>치료 — 약물(NSAIDs, 항우울제, 세포막 안정제, GABA 작용제), 중재적 통증치료(신경차단술, 척수자극기, 척수내 약물주입기), 심리치료</li></ul>
       <div class="warn">CRPS는 손해사정에서 가장 다투어지는 상병이다. <b>객관적 징후</b>의 존부, 사고와의 시간적 근접성, 기왕의 정신과적 요인을 함께 검토한다.</div>`,
       mnemo:{key:"1형=신경손상 없음 / 2형=있음", how:"CRPS는 <b>번호가 낮을수록 증거가 없다</b>고 외운다.<br>Budapest는 <b>증상 3범주 · 징후 2범주</b> — <b>3과 2</b>."}},

      {h:"수부의 나머지 — 주상골·복서골절·방아쇠수지·드퀘르벵", freq:F(3,[49]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>질환</th><th>핵심</th></tr>
       <tr><td><b>주상골 골절</b></td><td>수상 직후 <b>손목 염좌로 오인</b>되기 쉽다. 초기 방사선에서 골절선이 안 보여 <b>보통 2주 후 재촬영</b>하거나 CT·MRI로 확인. 혈류 구조상 <b>무혈성 괴사와 불유합</b>이 문제이며, 방치되면 중수근 관절염·주상골 불유합 진행성 붕괴로 간다.</td></tr>
       <tr><td><b>중수골 경부 골절<br>(복서 골절)</b></td><td>중수골 골절 중 <b>가장 흔하다</b>. 주먹을 쥔 상태로 중수지관절을 가격해 발생하며 <b>항상 후방(배측) 각형성</b>, 제4·5수지 호발. 합병증은 <b>부정유합(각형성 또는 회전변형)</b>.</td></tr>
       <tr><td><b>방아쇠 수지</b></td><td>건의 염증·부종이 <b>A1 활차</b>에 걸려 통과가 어려워진다. 당뇨·류마티스 관절염·아밀로이드증과 관련. 스테로이드 국소주사 또는 수술.</td></tr>
       <tr><td><b>드퀘르벵 병</b></td><td>신전건 <b>제1구획</b>의 협착성 건막염. 침범 건은 <b>장무지외전건과 단무지신전건</b>. <b>30~60대 여성, 임신 말기·수유기</b>에 호발. 검사는 <b>핑켈스테인 검사</b>(엄지를 손바닥에 넣고 주먹을 쥔 뒤 척측 편위 → 요골 경상돌기 통증). <b>보존적 치료 6개월</b> 후에도 심하거나 재발하면 수술. 합병증은 표재 요골신경 손상.</td></tr>
       </table></div>
       <div class="warn">49회 5번이 드퀘르벵을 그대로 물었다 — <b>침범 건 2가지 + 특징적 증상 + 대표 검사명</b>. 세 가지를 묶어서 외운다.</div>`,
       mnemo:{key:"장외 · 단신 / 핑켈스테인", how:"드퀘르벵 = 제1구획 = <b>장</b>무지<b>외</b>전건 + <b>단</b>무지<b>신</b>전건.<br>검사는 <b>핑켈스테인</b>. 주상골은 <b>2주 후 재촬영</b>."}}
    ],
    cards:[
      {f:"인체에서 가장 흔하게 부러지는 뼈는?", b:"쇄골. 중간 1/3(간부) 골절이 가장 흔하다."},
      {f:"쇄골 골절에서 수술이 필요한 경우는?", b:"개방성 골절, 불유합, 신경·혈관 손상, 심한 전위, 쇄골-견갑골 경부 동반골절(부유 견관절), 다발성 손상."},
      {f:"늑쇄증후군이란?", b:"제1늑골과 쇄골 사이 간격이 좁아져 신경·혈관이 압박되는 것. 쇄골 골절의 합병증."},
      {f:"견관절 전방탈구의 기전은?", b:"외전 + 외회전. 럭비·테니스·투구 동작."},
      {f:"견관절 전방탈구의 동반병변 2가지는?", b:"방카르트 병변(전하방 관절와순 파열), 힐삭스 병변(상완골두 후측 함몰)."},
      {f:"견관절 후방탈구의 빈도와 영상소견은?", b:"2~4%로 드물고 전구 징후(light bulb sign)를 보인다. 전기충격·간질발작이 원인."},
      {f:"견관절 탈구를 빨리 정복해야 하는 이유는?", b:"액와신경 손상을 막기 위해서."},
      {f:"회전근개를 이루는 4개 근육은?", b:"견갑하근, 극상근, 극하근, 소원근."},

      {f:"회전근개 파열의 통증 각도는?", b:"120~160도에서 팔 올리기가 어렵고, 누우면 심해지는 야간통이 있다."},
      {f:"회전근개 파열의 대표 신체검사는?", b:"Jobe 검사(Empty Can Test)."},
      {f:"어깨충돌증후군과 회전근개 파열의 차이는?", b:"충돌증후군은 팔이 완전히 올라갈 때 통증, 파열은 들어올리면서 통증 + 근력 약화."},
      {f:"상완골 4분 골절의 치료는?", b:"인공관절(상완골두) 치환술. 골다공증과 무혈성 괴사로 내고정 유지가 어렵기 때문."},
      {f:"상완골 간부 골절의 대표 합병증은?", b:"요골신경 손상 → 수근하수(wrist drop)와 제1물갈퀴 공간 배측 감각소실."},
      {f:"주관절을 이루는 3개 관절은?", b:"상완척골관절(경첩), 상완요골관절(절구), 근위요척관절(차축, 회외·회내)."},
      {f:"척골신경 손상의 증상은?", b:"손가락 벌리기 제한, 갈퀴손 변형, 프로멘트 징후, 제5지·제4지 내측 감각소실."},
      {f:"상완골 내·외과 골절과 과상골절의 변형은?", b:"내·외과 골절은 외반주, 과상골절은 내반주."},
      {f:"주관절 후방탈구의 고정 방법은?", b:"도수정복 후 100~110도 굴곡에서 2주 이내 부목 고정, 조기 능동운동. 길어지면 신전 제한."},
      {f:"몬테지아 골절과 갈레아찌 골절은?", b:"몬테지아 = 척골 근위부 골절 + 요골두 탈구. 갈레아찌 = 요골 간부 골절 + 원위 요척관절 탈구('필요골절')."},
      {f:"신체에서 가장 흔한 골절은?", b:"원위 요골 골절. 전체 골절의 15~20%."},
      {f:"콜레스 골절과 스미스 골절의 차이는?", b:"콜레스는 후방 전위로 만찬포크 변형, 스미스는 전방 전위로 정원삽 변형."},
      {f:"관절내 골절에 해당하는 원위 요골 골절 3가지는?", b:"바톤 골절, 운전기사 골절, 월상골 부하 골절."},
      {f:"TFCC 병변이 발생하는 관절은?", b:"원위 요척관절."},
      {f:"수근관 증후군의 압박 신경과 감각이상 부위는?", b:"정중신경. 1·2·3수지와 4수지 요측."},
      {f:"수근관 증후군의 수술 적응은?", b:"무지구근 위축, 50세 이상, 수지 무감각 지속, 10개월 이상 지속, 팔렌검사 30초 이내 양성."},
      {f:"CRPS 제1형과 제2형의 차이는?", b:"제1형(과거 반사성 교감신경 이영양증)은 명백한 신경손상이 없고, 제2형(과거 작열통)은 신경손상이 있다."},
      {f:"CRPS의 진단기준은?", b:"Budapest criteria — 3범주 이상에서 각 1개 이상 증상 + 2범주에서 각 1개 이상 징후."},
      {f:"이질통(allodynia)이란?", b:"옷·바람·머리카락처럼 통증을 유발하지 않는 자극에도 극심한 통증을 느끼는 것."},
      {f:"주상골 골절의 진단상 함정은?", b:"손목 염좌로 오인되기 쉽고 초기 방사선에 안 보인다. 보통 2주 후 재촬영하거나 CT·MRI."},

      {f:"드퀘르벵 병에서 침범되는 건은?", b:"신전건 제1구획의 장무지외전건과 단무지신전건."},
      {f:"드퀘르벵 병의 대표 검사는?", b:"핑켈스테인 검사. 요골 경상돌기 부근의 통증이 증가한다."}
