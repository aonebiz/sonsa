    quiz:[
      {q:"제4세대 실손의료보험의 보상구조를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 구조의 개관\n제4세대 실손의료보험은 급여를 보장하는 기본형과 비급여를 보장하는 특별약관으로 분리하여 운영한다.\n\nⅡ. 급여의 보상\n1. 입원은 급여 의료비의 100분의 80을 보상한다.\n2. 통원은 급여 의료비에서 1만원 또는 2만원의 정액공제와 100분의 20의 정률공제 중 큰 금액을 공제한 후 보상한다. 의원은 1만원, 병원과 종합병원 및 상급종합병원은 2만원을 적용한다.\n\nⅢ. 비급여의 보상\n1. 비급여 의료비의 100분의 70을 보상한다.\n2. 통원의 경우 3만원과 100분의 30 중 큰 금액을 공제한다.\n\nⅣ. 3대 비급여 특약\n1. 도수치료, 체외충격파치료, 증식치료 — 연간 350만원, 50회 한도\n2. 비급여 주사료 — 연간 250만원, 50회 한도\n3. 비급여 자기공명영상진단 — 연간 300만원 한도\n각 특약의 공제는 3만원과 100분의 30 중 큰 금액이다.\n\nⅤ. 횟수 확인 절차\n도수치료, 체외충격파치료, 증식치료는 각 치료의 횟수를 합산하여 최초 10회를 보장하고, 이후에는 증상의 개선과 병변의 호전 등이 확인된 경우에 한하여 10회 단위로 연간 50회까지 보상한다.\n\nⅥ. 보험료의 할인·할증\n비급여의 이용량에 따라 보험료가 할인되거나 할증된다.\n\nⅦ. 결론\n급여 80퍼센트, 비급여 70퍼센트, 3대 비급여 3만원 또는 30퍼센트 공제라는 세 기준이 제4세대의 골격이다.`},
      {q:"실손의료보험에서 다수보험의 비례분담 방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 취지\n실손의료보험은 실제로 부담한 의료비를 보상하는 것이므로, 다수의 계약이 있더라도 실제 부담액을 초과하여 보상할 수 없다. 이에 각 보험자가 공평하게 분담하도록 한다.\n\nⅡ. 적용요건\n각 계약의 보장책임액을 합한 금액이, 각 계약의 보장대상의료비 중 최고액에서 각 계약의 피보험자 부담 공제금액 중 최소액을 차감한 금액을 초과하는 경우에 적용한다.\n\nⅢ. 산식\n각 계약의 보상책임액은 다음과 같다.\n(각 계약의 보장대상의료비 중 최고액 − 각 계약의 피보험자 부담 공제금액 중 최소액) × 각 계약별 보장책임액 ÷ 각 계약별 보장책임액을 합한 금액\n\nⅣ. 산출의 순서\n1. 각 계약이 단독으로 존재하였다면 지급하였을 금액, 즉 보장책임액을 세대별 약관에 따라 산출한다.\n2. 보장대상의료비 중 최고액과 공제금액 중 최소액을 확인한다.\n3. 산식에 따라 안분한다.\n4. 각 계약의 회당 한도와 연간 한도를 적용한다.\n\nⅤ. 유의사항\n1. 세대가 다르면 공제방식이 달라 보장책임액이 달라진다.\n2. 어느 한 계약에서만 보장되는 담보는 안분의 대상이 아니다. 예컨대 제3세대에서만 보상되는 도수치료는 그 계약에서 전액을 지급한다.\n3. 진단비, 수술비, 입원일당 등 정액담보는 안분하지 아니한다.\n\nⅥ. 결론\n보장책임액의 산출이 선행되어야 하며, 담보별로 안분 대상인지를 먼저 가려야 한다.`},
      {q:"본인부담상한제와 실손의료보험의 관계를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 본인부담상한제의 의의\n국민건강보험법에 따라 1년간 피보험자가 부담한 급여 본인부담금이 소득분위별로 정해진 상한액을 초과하는 경우 그 초과금액을 공단이 환급하여 주는 제도이다.\n\nⅡ. 실손의료보험에서의 취급\n환급받는 금액은 피보험자가 실제로 부담한 의료비가 아니므로 실손의료보험에서 보상하지 아니한다.\n\nⅢ. 계산의 순서\n1. 해당 연도의 급여 본인부담금 총액을 확인한다.\n2. 소득분위별 상한액을 적용하여 환급 예상액을 산출한다.\n3. 보장대상의료비에서 환급 예상액을 먼저 차감한다.\n4. 그 잔액에 공제와 보상률을 적용한다.\n\nⅣ. 계산의 예\n상한액이 400만원이고 해당 연도의 본인부담금이 500만원이면 환급액은 100만원이다. 이번 입원의 급여 본인부담금이 200만원이라면 100만원을 차감한 100만원에 100분의 80을 곱하여 80만원을 보상한다.\n\nⅤ. 실무상 쟁점\n1. 환급액은 다음 해에 확정되므로 지급 시점에는 예상액으로 처리하고 사후 정산하는 방식이 사용된다.\n2. 환급액의 귀속과 반환을 둘러싼 분쟁이 발생할 수 있다.\n\nⅥ. 결론\n환급금은 보상하지 아니하는 금액이므로 계산의 가장 앞에서 차감하여야 한다.`},
      {q:"실손의료보험의 통원의료비 산정방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 공제방식\n통원의료비는 정액공제와 정률공제 중 큰 금액을 공제한 후 보상한다.\n\nⅡ. 정액공제의 기준\n의료기관의 종별에 따라 다르다. 제4세대 기준으로 의원은 1만원, 병원과 종합병원 및 상급종합병원은 2만원이며, 비급여 특약은 3만원이다.\n\nⅢ. 정률공제\n급여는 100분의 20, 비급여는 100분의 30을 적용한다.\n\nⅣ. 회당 한도\n약관이 정한 회당 한도를 적용하며 통상 20만원에서 25만원이다.\n\nⅤ. 하루에 2회 이상 통원한 경우\n1회의 외래로 간주하여 보상하며, 공제금액은 중복하여 방문한 의료기관 중 가장 높은 공제금액을 적용한다.\n\nⅥ. 산정의 예\n같은 날 병원에서 급여 10만원과 비급여 10만원, 약국에서 급여 2만원과 비급여 5만원이 발생한 경우, 급여 12만원과 비급여 15만원을 구분하여 각각 공제를 적용하고 회당 한도를 적용한다.\n\nⅦ. 결론\n정액과 정률 중 큰 금액의 공제, 종별 정액의 차이, 회당 한도의 적용이 통원의료비 산정의 세 단계이다.`},
      {q:"실손의료보험에서 상급병실료 차액의 보상과 입원의료비의 한도를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 상급병실료 차액\n1. 비급여 병실료의 100분의 50을 보상한다.\n2. 1일 평균금액 10만원을 한도로 한다.\n3. 1일 평균금액은 입원기간 동안의 비급여 병실료 전체를 총 입원일수로 나누어 산출한다.\n4. 산식은 비급여 병실료의 50퍼센트와 10만원에 입원일수를 곱한 금액 중 작은 금액이다.\n\nⅡ. 입원의료비의 공제\n제4세대는 급여의 100분의 80, 비급여의 100분의 70을 보상하며 통원과 달리 정액공제가 없다.\n\nⅢ. 구세대의 200만원 규정\n입원의료비의 자기부담금이 연간 200만원을 초과하는 경우 그 초과금액은 보험가입금액을 한도로 전액 보상한다.\n\nⅣ. 연간 한도\n계약에서 정한 보험가입금액을 한도로 하며, 통상 연간 5,000만원 또는 1억원이다. 비급여 특약은 별도의 한도를 가진다.\n\nⅤ. 산정의 예\n비급여 병실료가 600만원이고 입원일수가 25일이면 600만원의 50퍼센트인 300만원과 10만원에 25일을 곱한 250만원 중 작은 250만원을 보상한다.\n\nⅥ. 결론\n상급병실료는 50퍼센트와 1일 10만원의 두 기준 중 작은 금액이며, 입원은 정률공제만 적용된다는 점이 핵심이다.`},
      {q:"실손의료보험에서 정신질환의 보상범위를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n정신 및 행동장애에 관하여는 원칙적으로 급여에 해당하는 부분만 보상한다.\n\nⅡ. 보상하는 경우\n1. 우울증, 조현병, 불안장애 등 다수의 정신질환은 요양급여에 해당하는 의료비를 보상한다.\n2. 기질성 정신장애도 요양급여에 해당하는 부분을 보상한다.\n\nⅢ. 보상하지 아니하는 경우\n1. 식사장애와 같이 약관이 명시적으로 제외한 질환은 전부 보상하지 아니한다.\n2. 비급여에 해당하는 상담이나 검사는 보상하지 아니한다.\n\nⅣ. 계산에서의 처리\n1. 질병분류코드를 확인하여 해당 질환이 어느 유형인지 판단한다.\n2. 의료비를 급여와 비급여로 구분한 후 급여 부분에만 공제와 보상률을 적용한다.\n3. 전부 면책인 질환은 0원으로 처리하되 면책의 근거를 기재한다.\n\nⅤ. 산정의 예\n기질성 정신장애로 통원하여 급여 5만원과 비급여 1만원이 발생한 경우, 급여 부분만 대상으로 하여 공제를 적용한다.\n\nⅥ. 결론\n정신질환은 코드의 확인과 급여·비급여의 구분이 계산의 출발점이며, 전부 면책인 질환을 별도로 기억하여야 한다.`},
      {q:"실손의료보험의 도수치료 등 3대 비급여 특약을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 3대 비급여 특약의 구성\n1. 도수치료, 체외충격파치료, 증식치료\n2. 비급여 주사료\n3. 비급여 자기공명영상진단\n\nⅡ. 공제와 보상\n제4세대 기준으로 3만원과 100분의 30 중 큰 금액을 공제한 후 보상한다. 제3세대는 2만원과 100분의 30 중 큰 금액을 공제한다.\n\nⅢ. 한도\n1. 도수치료 등 — 연간 350만원, 50회\n2. 비급여 주사료 — 연간 250만원, 50회\n3. 비급여 자기공명영상진단 — 연간 300만원\n\nⅣ. 횟수 확인 절차\n제4세대는 도수치료, 체외충격파치료, 증식치료의 횟수를 합산하여 최초 10회를 보장하고, 이후에는 증상의 개선과 병변의 호전 등이 확인된 경우에 한하여 10회 단위로 연간 50회까지 보상한다. 제3세대에는 이러한 절차 규정이 없다.\n\nⅤ. 산정의 예\n도수치료 20만원에 대하여 제4세대는 3만원과 6만원 중 큰 6만원을 공제하여 14만원을 보상한다.\n\nⅥ. 실무상 쟁점\n1. 치료의 필요성과 적정성에 관한 의학적 판단\n2. 횟수 요건의 충족 여부와 그 증명\n3. 세대가 다른 계약 간의 처리\n\nⅦ. 결론\n공제금액, 연간 한도, 횟수 요건의 세 요소를 세대별로 구분하여 적용하여야 한다.`},
      {q:"실손의료보험에서 보상하지 않는 의료비를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 다른 제도에서 보상받은 의료비\n1. 자동차보험이나 산업재해보상보험에서 보상받은 의료비. 다만 본인부담의료비는 보상한다.\n2. 제3자로부터 배상받은 의료비\n3. 국민건강보험의 본인부담상한제로 환급받는 금액\n\nⅡ. 치료 목적이 아닌 비용\n1. 외모 개선을 목적으로 한 성형수술\n2. 치료와 무관한 영양제와 비타민제\n3. 건강검진 비용. 다만 검사 결과 이상소견으로 추가 검사를 시행한 경우는 보상한다.\n4. 진료와 무관한 제증명료\n\nⅢ. 약관이 정한 특정 질환\n1. 요실금 등\n2. 식사장애 등 일부 정신질환\n3. 비만 관련 비용\n4. 인공유산 등\n\nⅣ. 기간의 제한이 있는 경우\n불임 관련 진료 등 일정 기간이 지난 후부터 보상하는 항목이 있다.\n\nⅤ. 의료기관이 임의로 감면한 금액\n실제로 부담한 것이 아니므로 보상하지 아니한다. 다만 법령에 따른 감면인 경우에는 예외가 인정된다.\n\nⅥ. 결론\n보상하지 아니하는 의료비는 다른 제도에서의 전보, 치료 목적의 결여, 약관의 명시적 제외라는 세 유형으로 정리된다.`},
      {q:"제3세대 실손의료보험과 제4세대 실손의료보험의 차이를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 구조의 차이\n1. 제3세대는 급여와 비급여를 합산한 기본형에 3대 비급여를 특약으로 분리하였다.\n2. 제4세대는 급여를 기본형으로 하고 비급여 전체를 특약으로 분리하였다.\n\nⅡ. 보상률의 차이\n1. 제3세대는 급여와 비급여를 합산하여 100분의 80을 보상한다.\n2. 제4세대는 급여 100분의 80, 비급여 100분의 70을 보상한다.\n\nⅢ. 공제의 차이\n1. 통원의 정액공제는 제3세대가 1만원, 1만5천원, 2만원이고 제4세대는 1만원과 2만원이다.\n2. 3대 비급여 특약의 정액공제는 제3세대가 2만원, 제4세대가 3만원이다.\n\nⅣ. 횟수 요건\n제4세대는 도수치료 등에 대하여 최초 10회 이후 증상의 개선이 확인된 경우에만 10회 단위로 보상하는 절차를 두었으나 제3세대에는 이러한 규정이 없다.\n\nⅤ. 보험료의 할인·할증\n제4세대는 비급여 이용량에 따른 보험료 차등제를 도입하였다.\n\nⅥ. 실무상 의의\n두 세대의 계약이 함께 있는 사안에서는 각 계약의 보장책임액이 달라지므로 비례분담의 결과도 달라진다.\n\nⅦ. 결론\n비급여의 분리와 보상률의 차등, 횟수 요건의 도입이 제4세대의 핵심적 변화이다.`},
      {q:"제5세대 실손의료보험의 주요 특징을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 급여의 공제\n급여 의료비에서 1만원, 100분의 20, 그리고 국민건강보험의 본인부담률 중 가장 큰 금액을 공제한다. 본인부담률이 공제 기준에 추가된 점이 특징이다.\n\nⅡ. 비급여의 구분\n비급여를 중증과 비중증으로 구분하여 보장을 달리한다.\n1. 비중증 질병비급여는 5만원과 100분의 50 중 큰 금액을 공제한다.\n2. 비중증 질환에 대한 증식치료 등은 보상하지 아니한다.\n3. 비중증 비급여는 1일당 한도를 두는 등 보장이 축소되었다.\n\nⅢ. 취지\n비급여 의료의 과다한 이용을 억제하고 중증 질환에 대한 보장을 강화하기 위한 것이다.\n\nⅣ. 산정의 예\n급여 8만원이고 국민건강보험 본인부담률이 40퍼센트인 경우, 1만원과 1만6천원 및 3만2천원 중 가장 큰 3만2천원을 공제하여 4만8천원을 보상한다.\n비중증 질병비급여가 5만원이면 5만원과 2만5천원 중 큰 5만원을 공제하여 보상액이 0원이 된다.\n\nⅤ. 실무상 의의\n세대가 진행될수록 자기부담이 커지므로, 계약의 세대 확인이 더욱 중요해졌다.\n\nⅥ. 결론\n본인부담률의 공제 기준 편입과 중증·비중증의 구분이 제5세대의 두 축이다.`}

      {id:"tc1", title:"41회형 — 후유장해 지급률과 담보별 보험금", freq:F(3,[41,43]),
       setup:`<b>사례 (제41회 기출)</b><ul>
       <li>보험가입 <b>전</b> 1차 사고로 <b>척추 기왕장해 15%</b></li>
       <li>2차 사고 장해 — 추상 <b>5%</b>, 척추 <b>30%</b>, 체간골 <b>15%</b>, 고관절 <b>20%</b>, 슬관절 <b>20%</b></li>
       <li>가입담보 — <b>일반상해후유장해 2억원</b>, <b>교통상해후유장해 1억원</b></li>
       <li>눈과 족관절은 장해 해당 없음</li></ul>`,
       steps:[
       {t:"① 부위별 지급률 확정", b:"추상 5% / 척추 30% / 체간골 15% / 고관절 20% / 슬관절 20%\n고관절과 슬관절은 <b>같은 다리의 관절 기능장해</b>이면 합산하나, 문제에서 각각 별개 부위로 제시되었으므로 그대로 적용한다."},
       {t:"② 기왕장해의 공제 — 척추만", b:"척추는 <b>경추~제1천추</b>가 동일부위이므로 기왕장해 15%를 공제한다.\n다른 부위(추상·체간골·고관절·슬관절)는 <b>공제하지 않는다</b>."},
       {t:"③ 일반상해후유장해 (가입금액 2억원)", b:"추상 5% × 2억 = <span class=\"num\">1,000만원</span>\n척추 (30% × 2억) − (15% × 2억) = <span class=\"num\">3,000만원</span>\n체간골 15% × 2억 = <span class=\"num\">3,000만원</span>\n고관절 20% × 2억 = <span class=\"num\">4,000만원</span>\n슬관절 20% × 2억 = <span class=\"num\">4,000만원</span>\n합계 = <span class=\"num\">1억 5,000만원</span>"},
       {t:"④ 교통상해후유장해 (가입금액 1억원)", b:"추상 5% × 1억 = 500만원\n척추 (30% × 1억) − (15% × 1억) = 1,500만원\n체간골 15% × 1억 = 1,500만원\n고관절 20% × 1억 = 2,000만원\n슬관절 20% × 1억 = 2,000만원\n합계 = <span class=\"num\">7,500만원</span>"}],
       final:`일반상해후유장해 <b>1억 5,000만원</b> · 교통상해후유장해 <b>7,500만원</b> (합계 2억 2,500만원)`,
       trap:`<b>자주 틀리는 곳</b>
① <b>기왕장해를 전체 지급률에서 한 번에 빼는 것</b> — 기왕장해는 <b>같은 부위에서만</b> 공제한다. 여기서는 척추에서만 뺀다.
② <b>담보를 하나만 계산하는 것</b> — 일반상해와 교통상해는 <b>별개 담보</b>로 각각 지급한다.
③ <b>지급률을 합산한 뒤 가입금액을 곱하는 것</b> — 결과는 같지만, 기왕장해 공제가 부위별이므로 <b>부위별로 계산</b>해야 실수가 없다.
④ 해당 없는 부위(눈·족관절)를 억지로 넣는 것 — <b>"해당 없음"이라고 적는 것</b>도 점수다.`,
       mnemo:{key:"부위별로 · 담보별로", how:"장해 계산의 두 축. <b>부위별</b>로 지급률을 내고 <b>담보별</b>로 가입금액을 곱한다. 기왕장해는 <b>같은 부위에서만</b>."}},

      {id:"tc2", title:"49회형 — 파생장해와 가입금액 한도", freq:F(3,[45,49]),
       setup:`<b>사례 (제49회 기출)</b><ul>
       <li><b>1차 장해</b> — 척추 뚜렷한 기형 <b>30%</b> + 신경계 ADLs <b>23%</b></li>
       <li><b>2차 장해</b> — 경추척수증으로 ADLs <b>53%</b>, 그로부터 파생된 좌측 손가락 <b>15%</b>, 우측 손가락 <b>30%</b>, 우측 팔 <b>45%</b></li>
       <li>가입금액 <b>1억원</b> (일반상해후유장해)</li></ul>`,
       steps:[
       {t:"① 1차 장해보험금", b:"척추 30% + ADLs 23% = <span class=\"num\">53%</span>\n1억원 × 53% = <span class=\"num\">5,300만원</span>"},
       {t:"② 2차 — 파생장해의 합산", b:"우측 상지는 <b>1상지 60% 한도</b>가 적용된다.\n우측 손가락 30% + 우측 팔 45% = 75% → <b>60%</b>로 제한\n좌측 손가락 15% + 우측 60% = <span class=\"num\">75%</span>"},
       {t:"③ 최초 장해와 비교 (파생장해 제3원칙)", b:"최초 장해(경추척수증 ADLs) <b>53%</b>\nvs 파생장해 합산 <b>75%</b>\n→ 높은 쪽인 <span class=\"num\">75%</span>를 적용한다."},
       {t:"④ 척추 기형과 합산", b:"척추 기형 30%는 별개 부위이므로 더한다.\n30% + 75% = <span class=\"num\">105%</span>"},
       {t:"⑤ 가입금액 한도와 기지급액 공제", b:"하나의 상해로 인한 후유장해보험금은 <b>보험가입금액을 한도</b>로 한다.\n105%이나 1억원이 한도이므로 1억원.\n1억원 − 5,300만원(1차 기지급) = <span class=\"num\">4,700만원</span>"}],
       final:`1차 <b>5,300만원</b> 기지급 · 2차 <b>4,700만원</b> (합계 1억원 = 가입금액)`,
       trap:`<b>자주 틀리는 곳</b>
① <b>1상지 60% 한도를 적용하지 않는 것</b> — 우측 손가락 30% + 우측 팔 45% = 75%를 그대로 쓰면 틀린다. <b>60%</b>로 잘라야 한다.
② <b>파생장해와 최초 장해를 더하는 것</b> — 더하지 않고 <b>비교</b>해서 높은 쪽 하나만 쓴다.
③ <b>105%를 그대로 곱하는 것</b> — 보험가입금액이 한도다.
④ <b>1차 기지급액을 공제하지 않는 것</b> — 같은 상해이면 반드시 뺀다.`,
       mnemo:{key:"60 한도 → 비교 → 한도 → 공제", how:"네 단계. 상지는 <b>60%</b>로 자르고, 파생 합산과 최초를 <b>비교</b>하고, 가입금액 <b>한도</b>를 씌우고, 기지급액을 <b>공제</b>한다."}},

      {id:"tc3", title:"45회형 — 4세대 실손 통원 계산", freq:F(3,[45,47,49]),
       setup:`<b>사례 (제45회형, 4세대 실손)</b><ul>
       <li>③④ 의원 급여 1만 + 1만 + 1만 = <b>3만원</b>, 도수치료 <b>20만원</b></li>
       <li>⑤ 병원 급여 1만 + 1만 = <b>2만원</b>, 도수치료 <b>40만원</b></li>
       <li>⑥ 병원 급여 <b>3만원</b></li>
       <li>⑦ 의원 급여 1만 + 1만 = <b>2만원</b>, 도수치료 <b>30만원</b></li>
       <li>⑧ 입원 급여 20만 + 10만 = <b>30만원</b>, MRI <b>30만원</b>, 도수치료 <b>30만원 × 14회</b></li></ul>`,
       steps:[
       {t:"③④ 급여 통원 + 도수치료", b:"급여 = 30,000 − MAX[1만원(의원), 30,000×20%=6,000] = 30,000 − 10,000 = <span class=\"num\">10,000원</span>\n도수 = 200,000 − MAX[3만원, 200,000×30%=60,000] = 200,000 − 60,000 = <span class=\"num\">140,000원</span>"},
       {t:"⑤ 병원 급여 + 도수치료", b:"급여 = 20,000 − MAX[2만원(병원), 20,000×20%=4,000] = 20,000 − 20,000 = <span class=\"num\">0원</span>\n도수 = 400,000 − MAX[3만원, 400,000×30%=120,000] = 400,000 − 120,000 = <span class=\"num\">280,000원</span>"},
       {t:"⑥ 병원 급여", b:"30,000 − MAX[2만원, 30,000×20%=6,000] = 30,000 − 20,000 = <span class=\"num\">10,000원</span>"},
       {t:"⑦ 의원 급여 + 도수치료", b:"급여 = 20,000 − MAX[1만원, 20,000×20%=4,000] = 20,000 − 10,000 = <span class=\"num\">10,000원</span>\n도수 = 300,000 − MAX[3만원, 300,000×30%=90,000] = 300,000 − 90,000 = <span class=\"num\">210,000원</span>"},
       {t:"⑧ 입원과 MRI, 도수치료의 한도", b:"급여 입원 = (200,000 + 100,000) × 80% = <span class=\"num\">240,000원</span>\nMRI = 300,000 − MAX[3만원, 300,000×30%=90,000] = <span class=\"num\">210,000원</span>\n도수 = (300,000 − 90,000) × 14회 = 210,000 × 14 = 2,940,000원\n<b>연간 한도 확인</b> — 14만 + 28만 + 21만 + 294만 = <b>357만원 > 350만원</b>\n→ 초과 7만원을 차감하여 294만 − 7만 = <span class=\"num\">2,870,000원</span>"}],
       final:`도수치료 연간 한도 350만원에 걸려 마지막 회차에서 7만원을 차감한다.`,
       trap:`<b>자주 틀리는 곳</b>
① <b>의원과 병원의 정액공제를 구별하지 않는 것</b> — 의원 <b>1만원</b>, 병원·종합병원 <b>2만원</b>이다.
② <b>정액과 정률 중 큰 쪽을 고르지 않는 것</b> — MAX다. 작은 쪽을 빼면 보험금이 부풀려진다.
③ <b>연간 누적 한도를 확인하지 않는 것</b> — 도수치료는 <b>350만원·50회</b>다. 회차가 쌓이면 반드시 누계를 표시한다.
④ <b>급여가 0원이 되는 경우를 빠뜨리는 것</b> — ⑤처럼 공제액이 의료비와 같으면 0원이다. <b>0원도 적는다.</b>
⑤ <b>횟수 요건을 무시하는 것</b> — 4세대는 최초 10회 이후 증상 개선이 확인되어야 10회 단위로 추가 보상된다.`,
       mnemo:{key:"의1 병2 · 3대는 3만 · MAX", how:"정액공제는 <b>의원 1만 · 병원 2만 · 3대 비급여 3만</b>. 항상 <b>MAX</b>로 뺀다.<br>마지막에 <b>연간 누계</b>를 확인한다."}},

      {id:"tc4", title:"46·48회형 — 다수보험 비례분담", freq:F(3,[42,46,48]),
       setup:`<b>사례 (제48회형)</b><ul>
       <li>A보험 — <b>3세대</b> 실손</li>
       <li>B보험 — <b>4세대</b> 실손</li>
       <li>급여 통원 의료비 <b>10만원</b>(병원)</li>
       <li>도수치료 <b>20만원</b></li>
       <li>비급여 MRI <b>50만원</b></li></ul>`,
       steps:[
       {t:"① 각 계약의 보장책임액 산출 — 급여 통원", b:"A(3세대) = 100,000 − MAX[15,000, 100,000×20%=20,000] = <span class=\"num\">80,000원</span>\nB(4세대) = 100,000 − MAX[10,000, 100,000×20%=20,000] = <span class=\"num\">80,000원</span>"},
       {t:"② 비례분담 — 급여 통원", b:"보장대상의료비 최고액 = 100,000원\n공제금액 최소액 = 20,000원\nA = (100,000 − 20,000) × 80,000 ÷ (80,000 + 80,000) = <span class=\"num\">40,000원</span>\nB = <span class=\"num\">40,000원</span>"},
       {t:"③ MRI의 보장책임액", b:"A(3세대) = 500,000 − MAX[20,000, 500,000×30%=150,000] = <span class=\"num\">350,000원</span>\nB(4세대) = 500,000 − MAX[30,000, 500,000×30%=150,000] = <span class=\"num\">350,000원</span>"},
       {t:"④ 비례분담 — MRI", b:"A = (500,000 − 150,000) × 350,000 ÷ 700,000 = <span class=\"num\">175,000원</span>\nB = <span class=\"num\">175,000원</span>"},
       {t:"⑤ 도수치료 — 안분하지 않는 경우", b:"A(3세대)는 횟수 확인 규정이 <b>없으므로</b> 200,000 − MAX[20,000, 60,000] = <span class=\"num\">140,000원</span>\nB(4세대)는 횟수 요건을 충족하지 못해 <span class=\"num\">0원</span>\n<b>한쪽만 보장하므로 안분 대상이 아니다.</b>"},
       {t:"⑥ 최종", b:"A = 40,000 + 140,000 + 175,000 = <span class=\"num\">355,000원</span>\nB = 40,000 + 175,000 = <span class=\"num\">215,000원</span>"}],
       final:`A보험 <b>355,000원</b> · B보험 <b>215,000원</b>`,
       trap:`<b>자주 틀리는 곳</b>
① <b>보장책임액을 구하지 않고 바로 안분하는 것</b> — 세대별 공제를 적용한 <b>보장책임액</b>이 먼저다.
② <b>분자에 각자의 공제액을 쓰는 것</b> — 분자는 <b>최고 의료비 − 최소 공제액</b>이다. 각자 것이 아니다.
③ <b>한쪽에서만 보장되는 담보를 안분하는 것</b> — 도수치료처럼 한쪽만 보장하면 <b>그 계약에서 전액</b> 지급한다.
④ <b>정액담보를 안분하는 것</b> — 진단비·수술비·입원일당은 <b>각 계약에서 전액</b>이다.`,
       mnemo:{key:"책임액 먼저 · 분자는 최고−최소", how:"안분의 두 원칙. <b>각자의 보장책임액</b>을 먼저 구하고, 분자는 <b>의료비 최고액 − 공제 최소액</b>."}},

      {id:"tc5", title:"43회형 — 구세대 실손과 연간 자기부담금 200만원", freq:F(3,[41,43]),
       setup:`<b>사례 (제43회형, 구세대 실손)</b><ul>
       <li>① 입원 — 급여 200만 + 비급여 800만, 그 중 <b>보상 제외 200만원</b></li>
       <li>③ 입원 — 급여 100만 + 비급여 300만, 보상 제외 100만원</li>
       <li>⑤ 입원 — 급여 200만 + 비급여 1,200만, 보상 제외 200만원</li>
       <li>비급여 주사제 특약 — 회당 10만원, 공제 MAX[2만원, 30%], 연간 350만원·50회</li>
       <li>질병입원일당 1만원(3일 초과분부터)</li></ul>`,
       steps:[
       {t:"① 입원 1", b:"(200만 + 800만 − 200만) × 80% = <span class=\"num\">640만원</span>\n자기부담금 = 800만 × 20% = <b>160만원</b> (200만원 미만이므로 추가보상 없음)\n특약 = (10만 − MAX[2만, 3만]) × 20회 = 7만 × 20 = <span class=\"num\">140만원</span>\n입원일당 = 1만 × (50일 − 3일) = <span class=\"num\">47만원</span>"},
       {t:"③ 입원 3", b:"(100만 + 300만 − 100만) × 80% = <span class=\"num\">240만원</span>\n자기부담금 = 300만 × 20% = 60만원\n특약 = (5만 − MAX[2만, 1.5만]) × 20회 = 3만 × 20 = <span class=\"num\">60만원</span>\n입원일당 = 1만 × (30일 − 3일) = <span class=\"num\">27만원</span>"},
       {t:"⑤ 입원 5 — 200만원 규정이 작동한다", b:"(200만 + 1,200만 − 200만) × 80% = <span class=\"num\">960만원</span>\n자기부담금 = 1,200만 × 20% = <b>240만원</b>\n<b>연간 누적 자기부담금</b> = 160만 + 240만 = <b>400만원</b>\n→ 200만원을 초과한 <b>200만원</b>을 추가 보상한다."},
       {t:"⑤ 특약과 일당", b:"특약 = 7만 × 5회 = 35만원 (누적 140 + 60 + 35 = <b>235만원</b> < 350만원 한도)\n입원일당 = 1만 × 43일 = <span class=\"num\">43만원</span>"},
       {t:"합계 정리", b:"입원의료비 640 + 240 + 960 + <b>200(자기부담금 초과분)</b> = <span class=\"num\">2,040만원</span>\n특약 140 + 60 + 35 = <span class=\"num\">235만원</span>\n입원일당 47 + 27 + 43 = <span class=\"num\">117만원</span>"}],
       final:`입원의료비 2,040만원 · 비급여주사제 특약 235만원 · 질병입원일당 117만원`,
       trap:`<b>자주 틀리는 곳</b>

    quiz:[
      {q:"후유장해보험금을 산정하는 절차를 단계별로 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 제1단계 — 적용 약관의 특정\n계약일을 확인하여 2018년 4월 1일 개정 전후의 장해분류표 중 어느 것을 적용할지 정한다.\n\nⅡ. 제2단계 — 평가 시기의 확인\n상해 발생일 또는 진단 확정일부터 180일이 경과하였는지, 신경계 12개월과 정신행동 18개월 등 부위별 유예기간이 충족되었는지 확인한다.\n\nⅢ. 제3단계 — 부위별 지급률의 확정\n각 신체부위의 장해상태를 장해분류표에 대입하여 지급률을 정하고, 그 근거를 간략히 기재한다.\n\nⅣ. 제4단계 — 원칙의 적용\n1. 동일부위는 높은 지급률 하나만 인정하되 같은 팔다리의 관절 기능장해는 합산한다.\n2. 한쪽 팔과 손가락은 60퍼센트를 한도로 한다.\n3. 파생장해는 합산과 최초 장해를 비교하여 높은 쪽을 적용한다.\n\nⅤ. 제5단계 — 기왕장해의 공제\n동일부위에 기존 장해가 있으면 그 지급률을 공제한다.\n\nⅥ. 제6단계 — 한시장해의 처리\n5년 이상 지속될 한시장해는 지급률의 20퍼센트를 적용한다.\n\nⅦ. 제7단계 — 담보별 보험금의 산출\n각 담보의 가입금액에 최종 지급률을 곱하고, 80퍼센트 이상 후유장해 등 조건부 담보의 요건 충족 여부를 판단한다.\n\nⅧ. 제8단계 — 한도와 공제\n하나의 상해에 대하여 보험가입금액을 한도로 하고 기지급액을 공제한다.\n\nⅨ. 결론\n여덟 단계를 순서대로 밟으면 누락과 중복을 피할 수 있으며, 각 단계의 근거를 답안에 명시하여야 한다.`},
      {q:"실손의료보험 보험금을 산정하는 절차를 단계별로 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 제1단계 — 계약의 세대 확정\n계약일을 확인하여 구세대, 제3세대, 제4세대, 제5세대 중 어느 약관이 적용되는지 정한다.\n\nⅡ. 제2단계 — 담보의 구분\n기본형과 특별약관, 급여와 비급여, 3대 비급여를 구분한다.\n\nⅢ. 제3단계 — 보상하지 않는 금액의 차감\n다른 제도에서 보상받은 의료비, 본인부담상한제 환급액, 면책 항목을 먼저 제외한다. 면책 항목은 0원으로 처리하되 근거를 기재한다.\n\nⅣ. 제4단계 — 공제의 적용\n입원은 정률공제만, 통원은 정액공제와 정률공제 중 큰 금액을 공제한다. 같은 날 여러 기관을 이용하였으면 1회로 보고 가장 높은 공제를 적용한다.\n\nⅤ. 제5단계 — 한도의 적용\n회당 한도, 연간 한도, 횟수 한도를 순서대로 적용하고 누적액을 표시한다. 구세대는 자기부담금의 연간 누계가 200만원을 초과하는지 확인한다.\n\nⅥ. 제6단계 — 다수보험의 비례분담\n각 계약의 보장책임액을 산출한 후 안분한다. 한쪽에서만 보장되는 담보와 정액담보는 안분하지 아니한다.\n\nⅦ. 제7단계 — 정액담보의 산출\n입원일당 등은 면책일수와 한도일수를 적용하여 별도로 산출한다.\n\nⅧ. 결론\n세대 확정에서 시작하여 안분으로 끝나는 일곱 단계이며, 일자별·항목별로 나누어 기재하여야 한다.`},
      {q:"장해지급률이 100퍼센트를 초과하는 경우의 보험금 산정을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 지급한도\n회사가 지급하여야 할 하나의 상해로 인한 후유장해보험금은 보험가입금액을 한도로 한다.\n\nⅡ. 100퍼센트 초과의 발생\n서로 다른 신체부위의 장해를 합산하거나 파생장해를 평가하는 과정에서 지급률의 합계가 100퍼센트를 초과할 수 있다.\n\nⅢ. 처리\n1. 지급률의 합계가 100퍼센트를 초과하더라도 보험가입금액을 한도로 지급한다.\n2. 동일한 상해로 이미 지급한 후유장해보험금이 있으면 이를 공제한다.\n\nⅣ. 산정의 예\n1차 평가에서 53퍼센트로 5,300만원을 지급하였고 2차 평가에서 합계가 105퍼센트가 된 경우, 보험가입금액 1억원을 한도로 하여 1억원에서 5,300만원을 공제한 4,700만원을 지급한다.\n\nⅤ. 다른 상해의 경우\n별개의 상해로 인한 장해는 각각 보험가입금액을 한도로 하므로 합산하여 한도를 적용하지 아니한다.\n\nⅥ. 담보별 처리\n일반상해후유장해와 교통상해후유장해 등 담보가 다르면 각 담보의 가입금액을 한도로 각각 산정한다.\n\nⅦ. 결론\n한도의 적용과 기지급액의 공제가 이 유형의 핵심이며, 상해의 동일성 판단이 선행되어야 한다.`},
      {q:"암 관련 보험금을 산정할 때 확인하여야 할 사항을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 진단의 확정\n1. 병리학적 진단이 원칙이며 조직검사나 혈액검사의 결과지를 확인한다.\n2. 병리학적 진단이 불가능한 경우에는 임상적 진단을 인정하는 약관의 규정을 확인한다.\n3. 진단 확정일이 언제인지를 특정한다.\n\nⅡ. 보장개시일\n계약일부터 90일이 지난 날의 다음 날부터 보장이 개시되는지 확인한다. 부활계약이면 부활일을 기준으로 다시 기산한다.\n\nⅢ. 감액기간\n보장개시일부터 1년 이내에 진단이 확정된 경우 보험금의 100분의 50을 지급하는 규정이 있는지 확인한다.\n\nⅣ. 암의 분류\n1. 일반암, 유사암(소액암), 고액암의 구분\n2. 한국표준질병사인분류의 분류번호와 행태코드\n3. 제자리암과 경계성 종양은 지급률이 다르다.\n\nⅤ. 담보별 산정\n진단비, 수술비, 입원일당을 각각 산정한다. 입원일당은 일당에 면책일수를 뺀 일수와 한도일수 중 작은 값을 곱한다.\n\nⅥ. 개정된 분류의 적용\n한국표준질병사인분류가 개정된 경우 계약일 당시의 분류를 적용할 것인지 진단일 당시의 분류를 적용할 것인지가 문제되며, 약관의 규정과 작성자 불이익의 원칙을 함께 검토한다.\n\nⅦ. 결론\n진단 확정일, 보장개시일, 감액기간, 암의 분류라는 네 가지가 확인의 핵심이다.`},
      {q:"실손의료보험 계산에서 자주 발생하는 오류를 지적하고 올바른 처리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 세대를 혼동하는 오류\n계약일을 확인하지 아니하고 공제방식을 적용하면 전체 계산이 어긋난다. 계약일을 먼저 확인하여 약관을 특정하여야 한다.\n\nⅡ. 정액공제와 정률공제 중 작은 금액을 공제하는 오류\n둘 중 큰 금액을 공제하여야 한다.\n\nⅢ. 의료기관의 종별을 구분하지 아니하는 오류\n의원은 1만원, 병원과 종합병원은 2만원의 정액공제가 적용된다.\n\nⅣ. 연간 누적 한도를 확인하지 아니하는 오류\n도수치료 등은 연간 350만원과 50회, 비급여 주사료는 250만원과 50회의 한도가 있으므로 회차마다 누계를 표시하여야 한다.\n\nⅤ. 구세대의 200만원 규정을 빠뜨리는 오류\n자기부담금의 연간 누계가 200만원을 초과하면 초과분을 전액 보상한다.\n\nⅥ. 면책 항목을 생략하는 오류\n지급액이 없더라도 면책의 근거를 기재하여야 배점을 받을 수 있다.\n\nⅦ. 다수보험에서 보장책임액을 산출하지 아니하고 안분하는 오류\n각 계약의 보장책임액을 먼저 산출한 후 안분하여야 하며, 한쪽에서만 보장되는 담보는 안분 대상이 아니다.\n\nⅧ. 본인부담상한제 환급액을 차감하지 아니하는 오류\n환급액은 보상하지 아니하는 금액이므로 가장 먼저 차감한다.\n\nⅨ. 결론\n세대 확정, 공제방식, 누적 한도, 면책 기재의 네 가지를 점검하면 대부분의 오류를 피할 수 있다.`},
      {q:"다수보험에서 안분의 대상이 되는 담보와 되지 않는 담보를 구별하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 안분의 대상이 되는 담보\n실손의료보험의 입원의료비와 통원의료비 등 실제 부담한 의료비를 보상하는 담보이다. 이득금지의 원칙이 적용되기 때문이다.\n\nⅡ. 안분의 대상이 되지 아니하는 담보\n1. 정액보상 담보 — 진단비, 수술비, 입원일당, 후유장해보험금, 사망보험금은 각 계약에서 전액 지급된다.\n2. 어느 한 계약에서만 보장되는 담보 — 예컨대 제3세대에서만 보상되는 항목은 그 계약에서 전액 지급한다.\n3. 각 계약의 보장책임액을 합한 금액이 보장대상의료비 최고액에서 공제금액 최소액을 차감한 금액을 초과하지 아니하는 경우\n\nⅢ. 안분의 산식\n(각 계약의 보장대상의료비 중 최고액 − 각 계약의 피보험자 부담 공제금액 중 최소액) × 각 계약별 보장책임액 ÷ 보장책임액의 합계\n\nⅣ. 적용의 순서\n1. 담보별로 안분 대상인지를 판단한다.\n2. 안분 대상이면 각 계약의 보장책임액을 산출한다.\n3. 산식에 따라 안분한 후 각 계약의 한도를 적용한다.\n\nⅤ. 유의사항\n세대가 다르면 공제방식이 달라 보장책임액이 달라지므로 안분 결과도 달라진다.\n\nⅥ. 결론\n실손은 안분하고 정액은 안분하지 아니한다는 원칙 위에서, 한쪽만 보장하는 담보의 예외를 기억하여야 한다.`},
      {q:"입원일당 등 정액담보의 산정방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 산정의 기본\n입원일당은 약정한 일당에 지급 대상 일수를 곱하여 산정한다.\n\nⅡ. 면책일수\n약관이 정한 면책일수를 공제한다. 예컨대 3일 초과분부터 지급하는 경우에는 입원일수에서 3일을 뺀다.\n\nⅢ. 한도일수\n약관이 정한 한도일수를 초과할 수 없다. 통상 120일 또는 180일이 사용된다.\n\nⅣ. 산식\n일당 × MIN[(입원일수 − 면책일수), 한도일수]\n\nⅤ. 산정의 예\n일당이 10만원이고 입원일수가 133일이며 면책 3일과 한도 120일이 적용되는 경우, 133에서 3을 뺀 130일과 120일 중 작은 120일을 적용하여 1,200만원을 지급한다.\n\nⅥ. 유의사항\n1. 동일한 질병으로 재입원한 경우 입원기간의 합산 여부를 약관으로 확인한다.\n2. 입원의 요건인 6시간 이상의 체류가 충족되었는지 확인한다.\n3. 면책질환에 해당하면 입원일당도 지급하지 아니한다.\n\nⅦ. 결론\n면책일수의 공제와 한도일수의 비교를 동시에 적용하는 것이 산정의 핵심이다.`},
      {q:"보험금 계산문제에서 면책 항목을 기재하여야 하는 이유와 방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 기재하여야 하는 이유\n1. 채점은 각 항목의 판단과 근거에 배점되어 있으므로, 지급액이 없더라도 면책의 판단 자체가 득점 요소이다.\n2. 손해사정서에도 지급하지 아니하는 이유를 기재하여야 하므로 실무의 요구와도 일치한다.\n3. 항목을 누락하면 검토하지 아니한 것으로 평가된다.\n\nⅡ. 기재의 방법\n1. 해당 항목을 빠뜨리지 아니하고 순서대로 기재한다.\n2. 지급액을 0원으로 표시한다.\n3. 면책의 근거를 한 줄로 기재한다. 예컨대 약관상 보상하지 아니하는 질환에 해당한다거나, 보장개시일이 도래하지 아니하였다거나, 기간 요건을 충족하지 못하였다는 것이다.\n\nⅢ. 기재의 예\n요실금은 약관상 보상하지 아니하는 질환에 해당하여 0원이다. 식사장애는 전부 면책이므로 0원이다. 기질성 정신장애는 급여에 해당하는 부분만 보상하므로 비급여는 0원이다.\n\nⅣ. 일부 보상되는 경우\n보상되는 부분만 계산하고 보상되지 아니하는 부분의 근거를 함께 기재한다.\n\nⅤ. 결론\n면책도 판단의 결과이므로 반드시 기재하여야 하며, 근거를 한 줄로 덧붙이는 것이 득점의 요령이다.`},
      {q:"두 개의 사고로 장해가 발생한 경우 2차 장해보험금의 산정을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 문제의 소재\n동일한 피보험자에게 시기를 달리하는 두 번의 사고가 있고 각 사고로 장해가 남은 경우, 2차 사고의 장해보험금을 어떻게 산정할지가 문제된다.\n\nⅡ. 동일부위의 판단\n1. 척추는 경추, 흉추, 요추 및 제1천추까지를 하나의 동일부위로 본다.\n2. 다리는 한쪽 다리를, 팔은 한쪽 팔과 그 손가락을 하나의 부위로 본다.\n\nⅢ. 동일부위인 경우\n2차 사고로 평가된 지급률에서 1차 사고의 지급률을 공제한다.\n\nⅣ. 다른 부위인 경우\n공제하지 아니하고 2차 사고의 지급률을 그대로 인정한다.\n\nⅤ. 산정의 예\n척추에 1차 사고로 뚜렷한 기형 30퍼센트가 있었고 2차 사고로 심한 기형 50퍼센트가 된 경우 50퍼센트에서 30퍼센트를 공제한 20퍼센트를 인정한다.\n한쪽 다리에 1차 사고로 가관절 20퍼센트가 있었고 2차 사고로 무릎 10퍼센트와 발목 10퍼센트의 관절 기능장해가 생긴 경우, 합산 20퍼센트에서 기존 20퍼센트를 공제하여 0퍼센트가 된다.\n따라서 2차 사고의 지급률은 20퍼센트가 되고, 가입금액이 1억원이면 2,000만원을 지급한다.\n\nⅥ. 유의사항\n동일한 상해로 인한 재평가인지 별개의 상해인지에 따라 가입금액 한도의 적용이 달라진다.\n\nⅦ. 결론\n부위의 동일성 판단이 먼저이고, 동일부위이면 공제, 다른 부위이면 그대로 인정한다.`},
      {q:"계산문제에서 연간 한도와 횟수 한도를 관리하는 방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 한도의 종류\n1. 회당 한도 — 통원의료비의 회당 20만원 또는 25만원\n2. 연간 한도 — 도수치료 등 350만원, 비급여 주사료 250만원, 비급여 자기공명영상진단 300만원\n3. 횟수 한도 — 도수치료 등 50회, 비급여 주사료 50회\n4. 보험가입금액 한도 — 입원의료비의 연간 한도\n\nⅡ. 관리의 방법\n1. 회차별로 산출한 금액을 기재한 후 그 아래에 누적액을 표시한다.\n2. 한도에 도달하는 회차에서는 한도까지만 지급하고 초과 사실을 기재한다.\n3. 횟수 한도는 지급한 횟수를 함께 표시한다.\n\nⅢ. 기재의 예\n도수치료의 누적액이 357만원이 되어 연간 한도 350만원을 초과하는 경우, 마지막 회차에서 7만원을 차감하여 지급하고 한도 초과로 인한 차감임을 기재한다.\n\nⅣ. 구세대의 자기부담금 누계\n입원의료비의 자기부담금이 연간 200만원을 초과하면 초과분을 전액 보상하므로, 회차마다 자기부담금의 누계를 별도로 관리한다.\n\nⅤ. 유의사항\n한도의 기산은 계약일 또는 계약해당일부터 1년 단위이므로 기간의 경계를 확인하여야 한다.\n\nⅥ. 결론\n회차별 금액과 누적액을 나란히 적는 습관이 한도 관리의 가장 확실한 방법이다.`}

       body:`<p><b>진단확정의 원칙</b> — 암의 진단확정은 <b>병리 또는 진단검사의학 전문의 자격증을 가진 자</b>에 의하여 내려져야 하며, <b>조직검사·미세바늘흡인검사 또는 혈액검사</b>에 대한 <b>현미경 소견</b>을 기초로 한다.</p>
       <div class="warn"><b>예외</b> — 병리학적 진단이 <b>가능하지 않은 경우</b>에는 피보험자가 암으로 진단 또는 치료를 받고 있음을 <b>진단서와 진료기록부 등 임상학적 소견</b>으로 증명할 수 있는 경우에 한하여 암으로 진단확정된 것으로 본다.<br>
       49회가 <b>"뇌졸중(추정)으로 사망한 경우에도 진단 확정으로 인정하여 진단비를 지급할 수 있는 경우"</b>를 물은 것이 같은 구조다. 사망 등으로 확진이 불가능하면 <b>임상적 진단</b>을 인정한다.</div>
       <p><b>보장개시일과 감액</b></p>
       <ul><li><b>보장개시일</b> — 계약일부터 그 날을 포함하여 <b>90일이 지난 날의 다음 날</b>. 유사암(기타피부암·갑상선암·제자리암·경계성종양)은 <b>계약일</b>부터 보장하는 것이 일반적이다</li>
       <li><b>감액</b> — 보장개시일부터 <b>1년 이내</b>에 암으로 진단확정된 경우 보험금의 <b>50%</b>를 지급한다</li>
       <li><b>부활</b>하면 <b>부활일 기준</b>으로 90일과 1년이 다시 시작된다</li></ul>
       <div class="calcbox"><b>46회 3-(1)</b><br>
       일반암 진단비 <b>3,000만원</b> / 유사암 <b>500만원 × 50%</b>(1년 이내) = <b>250만원</b></div>`,
       mnemo:{key:"90일 · 1년 50%", how:"암의 두 숫자. 보장개시는 <b>90일 지난 다음 날</b>, 1년 이내면 <b>50%</b>.<br>부활하면 <b>둘 다 리셋</b>."}},

      {h:"암의 분류와 KCD 개정", freq:F(3,[45,46,47]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>구분</th><th>행태코드</th><th>지급</th></tr>
       <tr><td><b>일반암</b></td><td>/3 (일차성 악성 신생물)</td><td>100%</td></tr>
       <tr><td><b>유사암(소액암)</b></td><td>기타피부암·갑상선암 /3, <b>제자리암 /2</b>, <b>경계성종양 /1</b></td><td>10~20% 등 약관에 따름</td></tr>
       <tr><td><b>전이암</b></td><td>/6 (이차성 악성 신생물)</td><td>원발암 기준으로 판단</td></tr>
       </table></div>
       <p><b>악성신생물 중 C코드가 아닌 D코드 (45회 출제)</b> — 한국표준질병사인분류에서 <b>D45 진성적혈구증가증, D46 골수형성이상증후군, D47.1 만성 골수증식성 질환, D47.3 본태성 혈소판증가증, D47.4 골수섬유증, D47.5 만성 호산구성 백혈병</b> 등은 <b>D코드</b>이면서 행태코드가 <b>/3</b>인 악성신생물이다.</p>
       <div class="warn"><b>KCD 개정과 적용 시점 (46회 출제)</b> — 한국표준질병사인분류가 제4차에서 제5차로 개정되면서 어떤 질병의 분류가 바뀐 경우, <b>계약일 당시의 분류</b>를 적용할지 <b>진단일 당시의 분류</b>를 적용할지가 문제된다.<br>
       약관은 통상 <b>"진단 당시 시행되고 있는 한국표준질병사인분류"</b>를 적용한다고 정한다. 다만 그 적용으로 <b>계약자에게 불리</b>해지는 경우에는 <b>작성자 불이익의 원칙</b>과 <b>설명의무</b>를 함께 검토해야 한다.</div>`,
       mnemo:{key:"C가 아니어도 /3이면 암", how:"<b>D45·D46·D47</b> 계열(혈액·골수 질환)은 <b>D코드인데 악성</b>이다. 코드의 앞 글자가 아니라 <b>행태코드 /3</b>을 본다."}},

      {h:"수술과 입원의 정의", freq:F(3,[41,45]),
       body:`<div class="calcbox"><b>수술의 정의</b><br>
       의사의 관리 하에 <b>기구를 사용</b>하여 생체에 <b>절단(특정 부위를 잘라내는 것)</b> 또는 <b>절제(특정 부위를 잘라 없애는 것)</b> 등의 <b>조작</b>을 가하는 것</div>
       <p><b>수술로 보지 않는 것</b> — 흡인(주사기 등으로 빨아들이는 것), 천자(바늘 또는 관을 꽂아 체액·조직을 뽑아내거나 약물을 주입하는 것), <b>신경 차단</b>, <b>미용 목적</b>의 처치, 피임 목적의 처치, 검사 및 진단을 위한 처치</p>
       <div class="warn"><b>41회의 논점</b> — 수술의 정의에 해당하는지가 수술비 지급을 가른다. <b>내시경적 시술, 색전술, 레이저 치료</b> 등이 수술에 해당하는지는 약관과 실무에서 다투어진다. 모범답안도 "간동맥색전술의 경우 시행할 때마다 수술비를 인정할 것인지에 대하여는 <b>논란의 여지가 있다</b>"고 밝혔다.</div>
       <p><b>말기 간질환(회복 불능 상태) — CI보험 (41회 출제)</b></p>
       <ul><li>간경변증이 진행되어 <b>회복이 불가능</b>한 상태로서 다음을 모두 충족</li>
       <li>① <b>황달</b>이 지속되는 경우 ② <b>난치성 복수</b>가 있는 경우 ③ <b>간성 뇌증</b>이 있는 경우 등 약관이 정한 요건</li>
       <li>진단은 <b>전문의</b>에 의하여야 하며 검사 수치(빌리루빈, 알부민, 프로트롬빈 시간)로 뒷받침되어야 한다</li></ul>`,
       mnemo:{key:"절단 · 절제 · 조작", how:"수술은 <b>기구로 잘라내거나 없애는 조작</b>. <b>흡인·천자·신경차단·미용·검사</b>는 수술이 아니다."}},

      {h:"뇌혈관질환과 장기요양", freq:F(3,[47,49]),
       body:`<p><b>뇌졸중 진단비와 뇌혈관질환 진단비 (49회 출제)</b></p>
       <div class="scroller"><table class="mini">
       <tr><th>담보</th><th>대상 분류</th><th>관계</th></tr>
       <tr><td><b>뇌혈관질환</b></td><td>I60~I69</td><td>가장 넓다</td></tr>
       <tr><td><b>뇌졸중</b></td><td>I60~I63, I65~I66</td><td>뇌혈관질환의 일부</td></tr>
       <tr><td>뇌출혈</td><td>I60~I62</td><td>가장 좁다</td></tr>
       </table></div>
       <div class="calcbox"><b>49회 2-(1)</b><br>
       뇌졸중 진단비 2,000만원 × 50%(1년 이내 감액) = <b>1,000만원</b><br>
       뇌혈관질환 진단비 1,000만원 × 50% = <b>500만원</b><br>
       → <b>두 담보가 모두 지급된다.</b> 뇌졸중은 뇌혈관질환에 포함되므로 두 담보의 요건을 모두 충족한다.</div>
       <div class="warn"><b>뇌졸중(추정)으로 사망한 경우 (49회 2-(2))</b> — 진단확정은 <b>영상검사(CT·MRI)와 임상 소견</b>을 기초로 하는 것이 원칙이나, 사망으로 확진이 불가능한 경우에는 <b>진료기록, 응급실 기록, 부검 결과, 임종 전 증상</b> 등 임상학적 소견으로 증명할 수 있으면 진단확정으로 인정할 수 있다.</div>
       <p><b>장기요양진단금 (47회 출제)</b> — 노인장기요양보험법에 따라 <b>장기요양 1등급 또는 2등급</b> 등의 판정을 받은 경우 지급한다.</p>
       <div class="warn"><b>47회의 함정 — 사망 후 등급판정</b>. 장기요양등급은 <b>생존 중의 상태</b>를 평가하여 판정하는 것이므로, 피보험자가 <b>사망한 후</b>에 등급판정이 이루어졌다면 지급사유가 발생한 시점이 언제인지가 문제된다. 신청일과 판정일, 사망일의 선후를 확인하고, 약관이 <b>"등급판정을 받았을 때"</b>를 지급사유로 정하고 있다면 사망 후 판정은 요건을 충족하지 못할 수 있다.</div>`,
       mnemo:{key:"뇌혈관 ⊃ 뇌졸중 ⊃ 뇌출혈", how:"범위가 <b>넓은 것부터 좁은 것</b>으로. I60~I69 ⊃ 뇌졸중 ⊃ 뇌출혈.<br>좁은 담보가 되면 <b>넓은 담보도 함께</b> 지급된다."}}
    ],
    cards:[
      {f:"암 진단확정의 원칙은?", b:"병리 또는 진단검사의학 전문의가 조직검사·미세바늘흡인검사·혈액검사의 현미경 소견을 기초로 진단한다."},
      {f:"병리학적 진단이 불가능한 경우는?", b:"진단서와 진료기록부 등 임상학적 소견으로 암으로 진단 또는 치료받고 있음을 증명하면 진단확정으로 본다."},
      {f:"암의 보장개시일은?", b:"계약일부터 그 날을 포함해 90일이 지난 날의 다음 날. 유사암은 계약일부터 보장하는 것이 일반적이다."},
      {f:"암보험금의 감액 규정은?", b:"보장개시일부터 1년 이내에 진단확정되면 보험금의 50%를 지급한다."},
      {f:"부활계약의 암 보장개시일은?", b:"부활일을 기준으로 90일과 1년이 다시 시작된다."},
      {f:"일반암과 유사암의 행태코드는?", b:"일반암은 /3, 유사암은 기타피부암·갑상선암(/3), 제자리암(/2), 경계성종양(/1)."},
      {f:"D코드인데 악성신생물인 예는?", b:"D45 진성적혈구증가증, D46 골수형성이상증후군, D47.1·D47.3·D47.4·D47.5 등 골수증식성 질환."},
      {f:"KCD 개정 시 적용 기준은?", b:"약관은 통상 진단 당시 시행되는 분류를 적용한다고 정한다. 계약자에게 불리하면 작성자 불이익의 원칙과 설명의무를 검토한다."},
      {f:"수술의 정의는?", b:"의사의 관리 하에 기구를 사용하여 생체에 절단 또는 절제 등의 조작을 가하는 것."},
      {f:"수술로 보지 않는 처치는?", b:"흡인, 천자, 신경 차단, 미용 목적의 처치, 피임 목적의 처치, 검사·진단을 위한 처치."},
      {f:"뇌혈관질환·뇌졸중·뇌출혈의 범위 관계는?", b:"뇌혈관질환(I60~I69) ⊃ 뇌졸중(I60~I63, I65~I66) ⊃ 뇌출혈(I60~I62)."},
      {f:"뇌졸중 진단비와 뇌혈관질환 진단비가 함께 가입된 경우는?", b:"뇌졸중은 뇌혈관질환에 포함되므로 두 담보의 요건을 모두 충족하여 각각 지급된다."},
      {f:"뇌졸중(추정)으로 사망한 경우의 진단확정은?", b:"영상검사가 원칙이나 사망으로 확진이 불가능하면 진료기록·응급실 기록·부검 결과 등 임상학적 소견으로 인정할 수 있다."},
      {f:"장기요양진단금의 지급사유는?", b:"노인장기요양보험법에 따라 장기요양 1등급 또는 2등급 등의 판정을 받은 때."},
      {f:"사망 후 장기요양 등급판정의 문제는?", b:"약관이 '등급판정을 받았을 때'를 지급사유로 정하면 사망 후 판정은 요건을 충족하지 못할 수 있다. 신청일·판정일·사망일의 선후를 확인한다."},
      {f:"말기 간질환(회복 불능)의 요건은?", b:"간경변증이 진행되어 회복이 불가능한 상태로 황달의 지속, 난치성 복수, 간성 뇌증 등 약관이 정한 요건을 충족할 것."}
    ],
    quiz:[
      {q:"암의 진단확정 방법과 예외를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n암의 진단확정은 병리과 또는 진단검사의학과 전문의 자격증을 가진 자에 의하여 내려져야 하며, 조직검사, 미세바늘흡인검사 또는 혈액검사에 대한 현미경 소견을 기초로 한다.\n\nⅡ. 예외\n병리학적 진단이 가능하지 아니한 경우에는 피보험자가 암으로 진단 또는 치료를 받고 있음을 진단서와 진료기록부 등 임상학적 소견으로 증명할 수 있는 때에 한하여 암으로 진단확정된 것으로 본다.\n\nⅢ. 예외가 적용되는 경우\n1. 종양의 위치상 조직을 채취할 수 없는 경우\n2. 환자의 상태가 검사를 감당할 수 없는 경우\n3. 사망 등으로 확진이 불가능하게 된 경우\n\nⅣ. 진단확정일\n1. 조직검사 보고서의 판독일 또는 발행일을 기준으로 하는 것이 일반적이다.\n2. 진단확정일은 보장개시일의 도래 여부와 감액기간의 적용을 결정하므로 정확히 특정하여야 한다.\n\nⅤ. 실무상 쟁점\n1. 임상적 진단의 인정 범위\n2. 영상검사만으로 진단한 경우의 처리\n3. 진단서의 상병명과 조직검사 결과의 불일치\n\nⅥ. 결론\n병리학적 진단이 원칙이고 임상적 진단은 예외이며, 진단확정일의 특정이 보험금 산정의 출발점이다.`},
      {q:"암보험의 보장개시일과 감액규정을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 보장개시일\n1. 암에 대한 보장개시일은 계약일부터 그 날을 포함하여 90일이 지난 날의 다음 날로 한다.\n2. 기타피부암, 갑상선암, 제자리암, 경계성종양 등 유사암은 계약일부터 보장하는 것이 일반적이다.\n3. 15세 미만자의 계약은 계약일부터 보장한다.\n\nⅡ. 취지\n계약 전에 이미 발생하였으나 발견되지 아니한 암에 대한 역선택을 방지하기 위한 것이다.\n\nⅢ. 감액규정\n보장개시일부터 1년 이내에 암으로 진단이 확정된 경우에는 해당 보험금의 100분의 50을 지급한다.\n\nⅣ. 부활의 경우\n부활은 새로운 계약의 체결에 준하므로 보장개시일과 감액기간이 부활일을 기준으로 다시 진행된다.\n\nⅤ. 산정의 예\n일반암 진단비가 3,000만원이고 보장개시일부터 1년이 지난 후 진단되었다면 3,000만원을 지급하고, 유사암 진단비 500만원이 1년 이내에 진단되었다면 50퍼센트인 250만원을 지급한다.\n\nⅥ. 결론\n90일과 1년이라는 두 기간이 핵심이며, 부활 시 재기산되는 점을 반드시 확인하여야 한다.`},
      {q:"한국표준질병사인분류의 개정이 암보험금 지급에 미치는 영향을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 문제의 소재\n계약 체결 당시의 분류와 진단 당시의 분류가 다른 경우 어느 것을 적용할지에 따라 일반암과 유사암의 구분이 달라지고 보험금이 달라진다.\n\nⅡ. 약관의 규정\n대부분의 약관은 진단 당시 시행되고 있는 한국표준질병사인분류를 적용한다고 정하고 있다.\n\nⅢ. 문제되는 상황\n개정으로 종전에 일반암으로 분류되던 질병이 유사암으로 이동하거나 그 반대의 경우가 발생할 수 있다.\n\nⅣ. 검토의 방향\n1. 약관의 문언이 명확하면 그에 따른다.\n2. 문언이 명확하지 아니하면 작성자 불이익의 원칙에 따라 계약자에게 유리하게 해석한다.\n3. 개정으로 보장이 축소되는 결과가 되는 경우 그 조항에 대한 설명의무가 이행되었는지를 검토한다.\n4. 계약자가 예상할 수 있었던 보장의 범위를 넘어 불이익하게 변경되는 것은 신의칙에 반할 수 있다.\n\nⅤ. 실무상 처리\n계약일 당시의 분류와 진단일 당시의 분류를 모두 확인하고, 어느 쪽을 적용하는지와 그 근거를 손해사정서에 명시한다.\n\nⅥ. 결론\n원칙은 진단 당시의 분류이나, 계약자에게 불리한 결과가 되는 경우에는 약관해석의 원칙과 설명의무를 함께 검토하여야 한다.`},
      {q:"약관상 수술의 정의와 수술로 보지 않는 처치를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 수술의 정의\n수술이란 의사의 관리 하에 기구를 사용하여 생체에 절단이나 절제 등의 조작을 가하는 것을 말한다. 절단은 특정 부위를 잘라내는 것이고 절제는 특정 부위를 잘라 없애는 것이다.\n\nⅡ. 요건\n1. 의사의 관리 하에 이루어질 것\n2. 기구를 사용할 것\n3. 생체에 절단이나 절제 등의 조작을 가할 것\n\nⅢ. 수술로 보지 아니하는 처치\n1. 흡인 — 주사기 등으로 빨아들이는 것\n2. 천자 — 바늘이나 관을 꽂아 체액이나 조직을 뽑아내거나 약물을 주입하는 것\n3. 신경 차단\n4. 미용을 목적으로 한 처치\n5. 피임을 목적으로 한 처치\n6. 검사 및 진단을 위한 처치\n\nⅣ. 실무상 쟁점\n1. 내시경적 시술, 색전술, 레이저 치료 등이 수술에 해당하는지\n2. 동일한 시술을 반복한 경우 회차마다 수술비를 인정할 것인지\n3. 수술의 분류등급에 따른 지급률의 적용\n\nⅤ. 판단의 방법\n시술의 명칭이 아니라 실제로 이루어진 조작의 내용을 기준으로 판단하며, 수술기록지와 시술 방법을 확인한다.\n\nⅥ. 결론\n기구에 의한 절단 또는 절제의 조작이 있었는지가 기준이며, 흡인과 천자 등은 명시적으로 제외된다.`},
      {q:"뇌혈관질환과 뇌졸중 담보의 관계를 설명하고, 진단비의 지급을 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 분류의 범위\n1. 뇌혈관질환은 한국표준질병사인분류의 I60부터 I69까지를 말하며 가장 넓다.\n2. 뇌졸중은 I60부터 I63까지와 I65, I66을 말하며 뇌혈관질환의 일부이다.\n3. 뇌출혈은 I60부터 I62까지로 가장 좁다.\n\nⅡ. 담보의 관계\n범위가 좁은 담보의 지급사유가 발생하면 넓은 담보의 지급사유도 함께 충족되므로, 각 담보에 모두 가입되어 있으면 각각 지급한다. 정액담보이므로 안분하지 아니한다.\n\nⅢ. 산정의 예\n뇌졸중 진단비 2,000만원과 뇌혈관질환 진단비 1,000만원에 가입한 피보험자가 보장개시일부터 1년 이내에 뇌경색으로 진단된 경우, 각 50퍼센트를 감액하여 1,000만원과 500만원을 합한 1,500만원을 지급한다.\n\nⅣ. 진단확정\n뇌 영상검사인 전산화단층촬영이나 자기공명영상과 임상 소견을 기초로 전문의가 진단한다.\n\nⅤ. 확진이 불가능한 경우\n사망 등으로 영상검사를 시행할 수 없었던 경우에는 진료기록, 응급실 기록, 부검 결과, 임종 전의 증상 등 임상학적 소견으로 증명되면 진단확정으로 인정할 수 있다.\n\nⅥ. 결론\n분류 범위의 포함관계를 먼저 확인하고, 각 담보를 별도로 산정하여야 한다.`},
      {q:"장기요양진단금의 지급요건과 사망 후 등급판정의 처리를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 지급요건\n노인장기요양보험법에 따라 장기요양등급 판정위원회에서 장기요양 1등급 또는 2등급 등 약관이 정한 등급의 판정을 받은 경우에 지급한다.\n\nⅡ. 등급판정의 절차\n1. 공단에 장기요양인정을 신청한다.\n2. 공단 직원의 방문조사와 의사소견서의 제출이 이루어진다.\n3. 등급판정위원회가 심의하여 등급을 판정한다.\n4. 장기요양인정서가 발급된다.\n\nⅢ. 사망 후 등급판정의 문제\n1. 장기요양등급은 생존 중의 심신 상태를 평가하여 판정하는 것이다.\n2. 약관이 지급사유를 등급판정을 받았을 때로 정하고 있다면, 피보험자가 사망한 후에 이루어진 판정은 지급요건을 충족하지 못한다고 볼 여지가 있다.\n3. 반면 신청과 조사가 생존 중에 이루어졌고 판정만 사후에 이루어진 경우에는 실질적으로 생존 중의 상태를 평가한 것이므로 인정할 수 있다는 견해도 가능하다.\n\nⅣ. 확인할 사항\n신청일, 방문조사일, 의사소견서 작성일, 등급판정일, 사망일의 선후관계를 확인한다.\n\nⅤ. 검토의 방향\n약관 문언이 명확하지 아니하면 작성자 불이익의 원칙에 따라 계약자에게 유리하게 해석할 수 있다.\n\nⅥ. 결론\n각 일자의 선후관계를 확정하고 약관 문언의 해석을 통하여 결론을 내려야 한다.`},
      {q:"악성신생물 중 분류번호가 C코드가 아닌 질병을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 문제의 소재\n악성신생물은 통상 C코드로 분류되나 일부 질병은 D코드로 분류되면서도 행태코드가 사선 삼에 해당하는 악성신생물이다.\n\nⅡ. 해당 질병\n1. D45 진성적혈구증가증\n2. D46 골수형성이상증후군\n3. D47.1 만성 골수증식성 질환\n4. D47.3 본태성 혈소판증가증\n5. D47.4 골수섬유증\n6. D47.5 만성 호산구성 백혈병\n\nⅢ. 공통점\n대부분 혈액과 골수의 증식성 질환으로, 임상경과가 악성에 준하여 행태코드가 사선 삼으로 부여되어 있다.\n\nⅣ. 보험실무상의 의의\n1. 약관이 일반암의 범위를 행태코드 사선 삼으로 정하고 있다면 이들 질병도 일반암에 해당한다.\n2. 약관이 분류번호를 C코드로 한정하고 있다면 해당하지 아니할 수 있으므로 약관의 문언을 확인하여야 한다.\n3. 약관에 따라 소액암이나 특정암으로 별도로 정하는 경우도 있다.\n\nⅴ. 판단의 방법\n조직검사 결과지의 형태코드와 진단서의 분류번호를 모두 확인하고 약관이 정한 암의 정의에 대입한다.\n\nⅥ. 결론\n분류번호의 앞 글자가 아니라 행태코드가 기준이며, 약관의 정의 규정을 반드시 확인하여야 한다.`},
      {q:"말기 간질환 등 중대한 질병(CI)의 진단요건을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 중대한 질병보험의 의의\n생명을 위협하는 중대한 질병이 발생한 경우 사망보험금의 일부를 미리 지급하는 보험으로, 약관이 각 질병의 요건을 엄격하게 정한다.\n\nⅡ. 말기 간질환의 요건\n간경변증이 진행되어 회복이 불가능한 상태로서 다음과 같은 소견을 충족하여야 한다.\n1. 황달이 지속되는 경우\n2. 난치성 복수가 있는 경우\n3. 간성 뇌증이 있는 경우\n그 밖에 검사 수치로 빌리루빈, 알부민, 프로트롬빈 시간 등이 약관이 정한 기준을 충족하여야 한다.\n\nⅢ. 진단의 주체\n해당 분야의 전문의가 진단하여야 하며 검사 결과로 뒷받침되어야 한다.\n\nⅣ. 다른 중대한 질병\n중대한 암, 중대한 급성심근경색증, 중대한 뇌졸중, 말기 신부전증, 말기 폐질환 등이 있으며 각각 별도의 엄격한 요건이 정해져 있다.\n\nⅤ. 실무상 쟁점\n1. 일반 진단명과 약관상 중대한 질병의 요건이 일치하지 아니하는 경우가 많다.\n2. 요건의 충족 여부에 관한 의학적 판단이 분쟁의 중심이 된다.\n3. 요건을 정한 조항에 대한 설명의무의 이행 여부도 문제된다.\n\nⅥ. 결론\n진단명만으로는 부족하고 약관이 정한 개별 요건의 충족 여부를 검사 결과로 확인하여야 한다.`},
      {q:"암 입원비의 산정방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 지급요건\n암으로 진단이 확정되고 그 치료를 직접적인 목적으로 입원한 경우에 지급한다.\n\nⅡ. 직접적인 치료의 의미\n암의 제거나 증식 억제를 직접 목적으로 하는 수술, 항암화학요법, 방사선치료 등을 말한다. 판례는 요양이나 면역력 증강을 위한 입원은 직접적인 치료로 보지 아니한다고 본다.\n\nⅢ. 산정의 방법\n1. 1일당 금액에 지급 대상 일수를 곱한다.\n2. 약관이 정한 면책일수를 공제한다.\n3. 약관이 정한 한도일수를 초과할 수 없다.\n4. 산식은 일당에 입원일수에서 면책일수를 뺀 값과 한도일수 중 작은 값을 곱하는 것이다.\n\nⅣ. 산정의 예\n암진단비 2,000만원의 100분의 0.5에 해당하는 10만원을 일당으로 하고, 입원일수가 133일이며 3일 초과분부터 120일을 한도로 하는 경우, 133에서 3을 뺀 130일과 120일 중 작은 120일을 곱하여 1,200만원을 지급한다.\n\nⅤ. 실무상 쟁점\n1. 요양병원 입원의 직접치료 해당 여부\n2. 동일한 암으로 여러 차례 입원한 경우 일수의 합산\n3. 전이암이나 재발암의 처리\n\nⅥ. 결론\n직접적인 치료 목적의 판단과 면책일수·한도일수의 동시 적용이 산정의 핵심이다.`},
      {q:"질병보험에서 계약 전 알릴의무 위반과 인과관계의 판단을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 문제의 소재\n계약 전 알릴의무를 위반한 경우에도 알리지 아니한 사실과 보험사고 사이에 인과관계가 없으면 보험금을 지급하여야 하므로, 인과관계의 판단이 실무의 쟁점이 된다.\n\nⅡ. 인과관계의 의미\n알리지 아니한 질병이나 병력이 현재의 보험사고에 영향을 미쳤는지를 말하며, 의학적 인과관계를 기초로 판단한다.\n\nⅢ. 판단의 자료\n1. 알리지 아니한 질병과 이번 상병의 의학적 관련성\n2. 진료기록상 치료의 연속성\n3. 주치의와 자문의의 소견\n4. 발병 시기와 경과\n\nⅣ. 효과\n1. 인과관계가 인정되면 계약을 해지하고 보험금을 지급하지 아니한다.\n2. 인과관계가 인정되지 아니하면 계약은 해지하되 해당 보험금은 지급한다.\n3. 해지권이 제한되는 경우에는 해지할 수 없고 보험금도 지급하여야 한다.\n\nⅴ. 증명책임\n고지의무 위반과 인과관계의 존재는 보험자가 증명하여야 한다.\n\nⅥ. 답안의 순서\n위반 여부, 해지 가능 여부, 인과관계, 보험금 지급 여부의 네 단계로 나누어 결론을 내린다.\n\nⅦ. 결론\n해지와 보험금 지급은 별개의 문제이므로 반드시 나누어 판단하여야 한다.`}
    ],

       a:`Ⅰ. 제1단계 — 계약의 확인\n계약일, 보험기간, 가입담보와 가입금액, 적용 약관의 판과 세대, 특약의 부가 여부를 확인한다.\n\nⅡ. 제2단계 — 지급사유의 발생\n상해나 질병의 요건이 충족되었는지, 진단이 확정되었는지, 보장개시일이 도래하였는지를 확인한다.\n\nⅢ. 제3단계 — 면책사유의 검토\n고의, 약관이 정한 보상하지 아니하는 질병과 비용, 위험한 활동 등을 검토한다.\n\nⅣ. 제4단계 — 고지·통지의무의 검토\n계약 전 알릴의무와 계약 후 알릴의무의 위반 여부, 해지 가능 여부, 인과관계를 순서대로 검토한다.\n\nⅤ. 제5단계 — 보험금의 산정\n담보별로 지급률과 의료비를 산정하고 공제와 한도를 적용한다. 면책 항목은 0원과 근거를 기재한다.\n\nⅥ. 제6단계 — 다수보험의 처리\n실손담보는 보장책임액을 산출한 후 안분하고, 정액담보는 각 계약에서 전액을 지급한다.\n\nⅦ. 제7단계 — 수익자의 확정\n사망보험금은 수익자를 확정하고 상속분에 따라 배분하며, 수익자의 고의는 개별적으로 적용한다.\n\nⅧ. 결론\n계약 확인에서 시작하여 수익자 확정으로 끝나는 일곱 단계를 지키면 어떤 사례든 누락 없이 처리할 수 있다.`},
      {q:"제3보험 계산문제에서 면책과 한도를 처리하는 방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 면책의 처리\n1. 지급액이 없더라도 항목을 생략하지 아니한다.\n2. 지급액을 0원으로 표시하고 면책의 근거를 한 줄로 기재한다.\n3. 일부만 보상되는 경우에는 보상되는 부분만 계산하고 나머지의 근거를 밝힌다.\n\nⅡ. 한도의 종류\n1. 회당 한도 — 통원의료비\n2. 연간 한도 — 3대 비급여 특약, 입원의료비의 보험가입금액\n3. 횟수 한도 — 도수치료 등 50회, 비급여 주사료 50회\n4. 담보 한도 — 후유장해보험금의 보험가입금액\n\nⅢ. 한도의 적용방법\n1. 산출한 금액이 한도를 초과하면 한도까지만 지급한다.\n2. 초과 사실과 차감액을 답안에 기재한다.\n3. 회차별 금액과 누적액을 나란히 표시한다.\n\nⅣ. 구세대의 특칙\n입원의료비의 자기부담금이 연간 200만원을 초과하면 초과분을 보험가입금액 한도로 전액 보상하므로 자기부담금의 누계를 별도로 관리한다.\n\nⅴ. 후유장해의 한도\n하나의 상해로 인한 후유장해보험금은 보험가입금액을 한도로 하고 기지급액을 공제한다.\n\nⅥ. 결론\n면책은 근거와 함께 0원으로, 한도는 초과 사실과 함께 기재하는 것이 배점을 지키는 방법이다.`},

       a:`Ⅰ. 출제의 경향\n1. 9개년의 소문항을 분류하면 계산문제가 31개, 보험일반이론이 30개로 두 영역이 전체의 대부분을 차지한다.\n2. 실손의료보험 계산은 9개 회차 전부에서 출제되었고 후유장해 계산은 8개 회차에서 출제되었다.\n\nⅡ. 학습전략\n1. 실손의료보험의 세대별 보장구조를 표로 정리하여 완전히 암기한다.\n2. 장해분류표의 총론인 동일부위, 파생장해, 기왕장해, 판정시기를 먼저 익히고 각론의 지급률을 외운다.\n3. 보험계약 일반은 고지의무, 통지의무, 승낙 전 사고, 부활, 약관해석의 다섯 논점을 중심으로 정리한다.\n4. 기출 계산문제를 반복하여 풀되 식과 근거를 함께 쓰는 연습을 한다.\n\nⅢ. 답안 작성의 원칙\n1. 계산은 담보별, 일자별, 부위별로 쪼개어 식과 금액과 근거를 반복한다.\n2. 면책 항목도 0원과 근거를 기재한다.\n3. 한도 적용 사실과 누적액을 표시한다.\n4. 사례형은 의의, 관련 규정, 문제에의 적용, 결론의 네 단계로 구성한다.\n5. 결론 문장으로 마무리한다.\n\nⅣ. 시간 배분\n계산문제에 시간이 많이 소요되므로 배점이 큰 계산문제를 먼저 처리하고 약술형을 나중에 쓰는 것이 안전하다.\n\nⅤ. 결론\n제3보험은 계산에서 승부가 나며, 세대와 원칙의 정확한 적용이 득점의 전부이다.`},
      {q:"제3보험 계산문제에서 자주 발생하는 오류를 지적하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 실손 관련 오류\n1. 계약일을 확인하지 아니하여 세대를 혼동한다.\n2. 통원 공제에서 정액과 정률 중 작은 금액을 공제한다. 큰 금액을 공제하여야 한다.\n3. 의료기관의 종별에 따른 정액공제의 차이를 반영하지 아니한다.\n4. 구세대의 자기부담금 연간 200만원 초과분 전액보상 규정을 빠뜨린다.\n5. 3대 비급여 특약의 연간 한도와 횟수의 누계를 확인하지 아니한다.\n6. 본인부담상한제 환급액을 차감하지 아니한다.\n\nⅡ. 다수보험 관련 오류\n7. 각 계약의 보장책임액을 산출하지 아니하고 바로 안분한다.\n8. 정액담보를 안분한다.\n9. 한쪽 계약에서만 보장되는 담보를 안분한다.\n\nⅢ. 장해 관련 오류\n10. 기왕장해를 전체 지급률에서 한 번에 공제한다. 동일부위에서만 공제하여야 한다.\n11. 한쪽 팔과 손가락의 60퍼센트 한도를 적용하지 아니한다.\n12. 파생장해를 최초 장해와 합산한다. 비교하여 높은 쪽을 적용하여야 한다.\n13. 보험가입금액의 한도와 기지급액의 공제를 적용하지 아니한다.\n\nⅣ. 정액담보 관련 오류\n14. 입원일당에서 면책일수와 한도일수를 동시에 적용하지 아니한다.\n15. 암의 보장개시일과 감액기간을 확인하지 아니한다.\n\nⅤ. 결론\n세대의 확정, 공제방식, 누적 한도, 동일부위 판단의 네 가지를 점검하면 대부분의 오류를 피할 수 있다.`}
    ],
    past:[
      {r:49,u:"t9",t:"49회 전체 — 실손(4·5세대), 후유장해(파생장해), 계약 무효, 통지의무, 수익자 상속", ref:"t9#0"},
      {r:48,u:"t9",t:"48회 전체 — 소멸시효 기산점, 실손 예외규정, 치아 결손, 실종선고, 금소법, 장해지급률, 다수보험", ref:"t9#3"},
      {r:47,u:"t9",t:"47회 전체 — 상해의 정의와 분류, 사망 직전 장해, 추가검사, 통지의무, 장기요양, 실손 계산, 공사보험 비교", ref:"t9#0"},
      {r:46,u:"t9",t:"46회 전체 — 중요한 사항, 승낙전 사고, 부활, 장해지급률, KCD 개정, 실손 계산, 다수보험, 중대사유 해지", ref:"t9#0"},
      {r:45,u:"t9",t:"45회 전체 — 입원의 정의, 청약철회 예외, 판정기준, 보험나이, 암 진단확정, 실손 계산, 후유장해 1·2차", ref:"t9#3"}
    ]
  }
  ]
};

const SUBJECTS = [AUTO, LIAB, MED, THIRD];
</script>

<script>
/* ---------- state ---------- */
let dbNS=null, askClaude=null;
const progress={cards:{},quiz:{}};
const generated={};
const chatHist={};
let curSub="home";
const curMode={}, curUnit={};
SUBJECTS.forEach(s=>{ curUnit[s.id]=s.units[0].id; curMode[s.id]="book"; });

const esc=t=>{const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;};
const plain=h=>String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
const findUnit=(s,id)=>s.units.find(u=>u.id===id)||s.units[0];

function likBadge(n){
  if(!n) return "";
  const cls = n>=3?"l3":n===2?"l2":"l1";
  const label = n>=3?"기출가능성 높음":n===2?"기출가능성 보통":"기출가능성 낮음";
  return `<span class="lik ${cls}">${"★".repeat(n)}${"☆".repeat(3-n)} ${label}</span>`;
}
function freqBadge(f){
  if(!f||!f.n) return "";
  const cls=f.n>=3?"f3":f.n===2?"f2":"f1";
  const stars="★".repeat(f.n)+"☆".repeat(3-f.n);
  const r=(f.rounds&&f.rounds.length)?" "+f.rounds.join("·")+"회":"";
  return `<span class="freq ${cls}">${stars}${esc(r)}</span>`;
}

/* ---------- capabilities ---------- */
const LSKEY="shsjs-progress-v1";
async function boot(){
  try{
    const raw=localStorage.getItem(LSKEY);
    if(raw){ const d=JSON.parse(raw)||{}; progress.cards=d.cards||{}; progress.quiz=d.quiz||{}; }
  }catch(e){}
  paint();
}
const saveProgress=()=>{ try{ localStorage.setItem(LSKEY,JSON.stringify({cards:progress.cards,quiz:progress.quiz,at:Date.now()})); }catch(e){} };
const saveGen=id=>{};

/* ---------- shell ---------- */
const tabsEl=document.getElementById("tabs"), panelsEl=document.getElementById("panels");
function buildShell(){
  const mk=(id,l)=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.dataset.sub=id;return b;};
  tabsEl.appendChild(mk("home","홈"));
  SUBJECTS.forEach(s=>tabsEl.appendChild(mk(s.id,s.session+" "+s.name)));
  tabsEl.addEventListener("click",e=>{const b=e.target.closest("button"); if(b){curSub=b.dataset.sub;window.scrollTo(0,0);paint();}});
  const h=document.createElement("section"); h.className="panel"; h.id="p-home"; panelsEl.appendChild(h);
  SUBJECTS.forEach(s=>{const p=document.createElement("section");p.className="panel";p.id="p-"+s.id;panelsEl.appendChild(p);});
}
function paint(){
  [...tabsEl.children].forEach(b=>b.classList.toggle("active",b.dataset.sub===curSub));
  document.querySelectorAll("section.panel").forEach(p=>p.classList.remove("active"));
  const el=document.getElementById("p-"+curSub); if(!el) return;
  el.classList.add("active");
  if(curSub==="home") renderHome(el); else renderSubject(el,SUBJECTS.find(s=>s.id===curSub));
}

/* ---------- home ---------- */
function renderHome(el){
  let blocks="",tc=0,kc=0,tq=0,kq=0;
  SUBJECTS.forEach(s=>{
    let c=0,ck=0,q=0,qk=0;
    s.units.forEach(u=>{
      (u.cards||[]).forEach((_,i)=>{c++; if(progress.cards[u.id+"#"+i]==="know")ck++;});
      (u.quiz||[]).forEach((_,i)=>{q++; if(progress.quiz[u.id+"#"+i]==="ok")qk++;});
      (generated[u.id]||[]).forEach((_,i)=>{q++; if(progress.quiz[u.id+"#g"+i]==="ok")qk++;});
    });
    tc+=c;kc+=ck;tq+=q;kq+=qk;
    const pct=c?Math.round(ck/c*100):0;
    blocks+=`<div class="statblock"><div class="stat"><b>${esc(s.session)} ${esc(s.name)}</b><span>암기 ${ck}/${c} · 문제 ${qk}/${q}</span></div><div class="bar"><div style="width:${pct}%"></div></div></div>`;
  });
  const nCalc=SUBJECTS.reduce((a,s)=>a+s.units.reduce((b,u)=>b+(u.calcs||[]).length,0),0);
  el.innerHTML=`
    <div class="card"><h3>진행 현황</h3>${blocks}
    <p class="note">암기카드 ${kc}/${tc} · 예상문제 ${kq}/${tq} · 계산예제 ${nCalc}개 — 진도 기록은 이 기기의 브라우저에 저장됩니다(기기마다 따로).</p></div>
    <div class="card"><h3>이 노트를 쓰는 법</h3>
      <ul>
        <li><b>처음이라면 4교시 자동차보험 → 0단원부터</b> 순서대로 읽으세요. 용어 정리와 답안 형식이 먼저 나옵니다.</li>
        <li><b>교재</b> — 제목 옆 <span class="freq f3">★★★</span> 배지는 44~49회 출제 빈도이고 숫자가 실제 출제 회차입니다. 초록 상자는 암기법, 파란 상자는 초보자 설명입니다.</li>
        <li><b>계산</b> — 기출 사례를 단계별로 푸는 곳입니다. <b>여기가 합격을 가릅니다.</b> 각 예제 끝에 자주 틀리는 함정이 정리돼 있습니다.</li>
        <li><b>암기카드</b> — 눌러서 뒤집고 안다/모른다를 체크하면 진도에 반영됩니다.</li>
        <li><b>예상문제</b> — 문항마다 <span class="lik l3">★★★ 기출가능성 높음</span> 배지가 붙어 있어 우선순위를 알 수 있습니다. 모범답안을 보고 스스로 채점합니다.</li>
      </ul>
    </div>
    <div class="warn"><b>수치는 원문 대조 필수.</b> 약관 지급기준·한도·사고부담금 금액은 개정됩니다. 이 노트의 수치는 44~49회 기출 답안에서 실제 적용된 값이므로, 시험 전 최신 표준약관·자배법 시행령으로 반드시 확인하세요.</div>`;
}

/* ---------- subject ---------- */
function renderSubject(el,s){
  const uid=curUnit[s.id], mode=curMode[s.id], u=findUnit(s,uid);
  const hasCalc=s.units.some(x=>(x.calcs||[]).length);
  const modes=[["book","교재"]].concat(hasCalc?[["calc","계산"]]:[]).concat([["cards","암기카드"],["quiz","예상문제"],["past","기출문제"]]);
  el.innerHTML=`
    <div class="toolbar" data-role="mode">${modes.map(([k,l])=>`<button type="button" data-m="${k}" class="${mode===k?'active':''}">${l}</button>`).join("")}</div>
    <div class="unitlist" data-role="units">${s.units.map((x,i)=>`<button type="button" data-u="${x.id}" class="${x.id===uid?'active':''}"><span class="n">${i}</span><span>${esc(x.name.replace(/^\d+\.\s*/,""))}</span>${freqBadge(x.freq)}</button>`).join("")}</div>
    <div data-role="body"></div>`;
  el.querySelector("[data-role=mode]").addEventListener("click",e=>{const b=e.target.closest("button"); if(b){curMode[s.id]=b.dataset.m;paint();}});
  el.querySelector("[data-role=units]").addEventListener("click",e=>{const b=e.target.closest("button"); if(b){curUnit[s.id]=b.dataset.u;paint();}});
  const body=el.querySelector("[data-role=body]");
  ({book:renderBook,calc:renderCalc,cards:renderCards,quiz:renderQuiz,past:renderPast,chat:(b,s2)=>renderChat(b,s2)}[mode]||renderBook)(body,s,u);
}

/* ---------- 교재 ---------- */
function renderBook(el,s,u){
  const html=(u.sections||[]).map(sec=>{
    let out=`<h2>${esc(sec.h)}${freqBadge(sec.freq)}</h2>`;
    if(sec.body) out+=sec.body;
    if(sec.terms) out+=`<div class="terms">${sec.terms.map(t=>`<div class="term"><b>${esc(t.t)} ${t.en?`<span class="en">${esc(t.en)}</span>`:""}</b><span>${esc(t.d)}</span></div>`).join("")}</div>`;
    if(sec.mnemo) out+=`<div class="mnemo"><span class="h">이렇게 외우세요</span><span class="key">${sec.mnemo.key}</span><br>${sec.mnemo.how}</div>`;
    return out;
  }).join("");
  const nQ=(u.quiz||[]).length+(generated[u.id]||[]).length;
  const nC=(u.calcs||[]).length;
  let foot="";
  if(nC) foot+=`<div class="endquiz"><div><b>이 단원 계산예제 ${nC}개</b><br><span>기출 사례를 단계별로 풀어봅니다.</span></div><button class="btn" type="button" data-go="calc">계산 보기</button></div>`;
  if(nQ) foot+=`<div class="endquiz"><div><b>이 단원 예상문제 ${nQ}문항</b><br><span>풀고 스스로 채점하면 진도에 반영됩니다.</span></div><button class="btn" type="button" data-go="quiz">예상문제 풀기</button></div>`;
  el.innerHTML=`<article class="book">${html}${foot}</article>`;
  el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{curMode[s.id]=b.dataset.go;window.scrollTo(0,0);paint();}));
}

/* ---------- 계산 ---------- */
function renderCalc(el,s,u){
  const list=u.calcs||[];
  if(!list.length){ el.innerHTML=`<p class="empty">이 단원에는 계산예제가 없습니다. <b>4. 계산 실전</b> 단원을 확인하세요.</p>`; return; }
  el.innerHTML=list.map((c,ci)=>`
    <div class="calc">
      <h3>${esc(c.title)}${freqBadge(c.freq)}</h3>
      <div class="setup">${c.setup}</div>
      <button class="peek" type="button" data-ci="${ci}">풀이 단계 보기 · 먼저 스스로 풀어보세요</button>
      <div class="steps hidden" data-steps="${ci}">
        ${c.steps.map((st,i)=>`<div class="step"><span class="dot">${i+1}</span><div class="st">${esc(st.t)}</div><div class="sb">${st.b}</div></div>`).join("")}
      </div>
      <div class="final hidden" data-final="${ci}">정답 — ${esc(c.final).replace(/\n/g,"<br>")}</div>
      ${c.trap?`<div class="trap hidden" data-trap="${ci}">${c.trap.replace(/\n/g,"<br>")}</div>`:""}
    </div>`).join("");
  el.querySelectorAll(".peek").forEach(b=>{
    b.addEventListener("click",()=>{
      const ci=b.dataset.ci;
      const st=el.querySelector(`[data-steps="${ci}"]`), fi=el.querySelector(`[data-final="${ci}"]`), tr=el.querySelector(`[data-trap="${ci}"]`);
      const open=!st.classList.contains("hidden");
      st.classList.toggle("hidden",open);
      fi.classList.toggle("hidden",open);
      if(tr) tr.classList.toggle("hidden",open);
      b.textContent=open?"풀이 단계 보기 · 먼저 스스로 풀어보세요":"풀이 접기";
    });
  });
}

/* ---------- 암기카드 ---------- */
function renderCards(el,s,u){
  const cards=u.cards||[];
  if(!cards.length){el.innerHTML=`<p class="empty">이 단원의 암기카드가 없습니다.</p>`;return;}
  const known=cards.filter((_,i)=>progress.cards[u.id+"#"+i]==="know").length;
  el.innerHTML=`<div class="stat"><b>${esc(u.name)}</b><span>${known}/${cards.length} 외움</span></div>
    <div class="bar"><div style="width:${Math.round(known/cards.length*100)}%"></div></div>
    <div class="deck">${cards.map((c,i)=>{const k=progress.cards[u.id+"#"+i];return `<div class="cardslot">
      <div class="flip" data-i="${i}" role="button" tabindex="0"><div class="flip-inner">
        <div class="face front">${c.f}</div><div class="face back">${c.b}</div></div></div>
      <div class="marks">
        <button type="button" data-i="${i}" data-v="know" class="${k==='know'?'on-know':''}">안다</button>
        <button type="button" data-i="${i}" data-v="unk" class="${k==='unk'?'on-unk':''}">모른다</button>
      </div></div>`;}).join("")}</div>`;
  el.querySelectorAll(".flip").forEach(f=>{
    const t=()=>f.classList.toggle("on");
    f.addEventListener("click",t);
    f.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});
  });
  el.querySelectorAll(".marks button").forEach(b=>b.addEventListener("click",()=>{
    const key=u.id+"#"+b.dataset.i,v=b.dataset.v;
    if(progress.cards[key]===v) delete progress.cards[key]; else progress.cards[key]=v;
    saveProgress();paint();
  }));
}

/* ---------- 예상문제 ---------- */
function renderQuiz(el,s,u){
  const base=(u.quiz||[]).map((q,i)=>({q,key:u.id+"#"+i,gen:false}));
  const gen=(generated[u.id]||[]).map((q,i)=>({q,key:u.id+"#g"+i,gen:true}));
  const all=base.concat(gen);
  el.innerHTML=`<div class="stat"><b>${esc(u.name)}</b><span>${all.filter(x=>progress.quiz[x.key]==="ok").length}/${all.length} 맞음</span></div>
    ${all.map((x,n)=>`<div class="qcard" data-key="${x.key}">
      <div class="qhead"><span>문제 ${n+1}${x.gen?' <span class="gen">생성</span>':''}${likBadge(x.q.lik)}</span><span>${x.q.pts||10}점</span></div>
      <div class="qtext">${esc(x.q.q)}</div>
      <button class="btn ghost" type="button" data-role="reveal">모범답안 보기</button>
      <div class="ans">${esc(x.q.a)}
        <div class="selfcheck">
          <button type="button" data-v="ok" class="${progress.quiz[x.key]==='ok'?'on-ok':''}">맞았다</button>
          <button type="button" data-v="no" class="${progress.quiz[x.key]==='no'?'on-no':''}">틀렸다</button>
        </div></div></div>`).join("")||`<p class="empty">이 단원에는 예상문제가 없습니다.</p>`}
    <div class="endquiz"><div><b>문제가 부족한가요?</b><br><span>이 단원 내용으로 새 예상문제를 만들어 드립니다.</span></div>
      <button class="btn" type="button" data-role="more">문제 더 만들기</button></div>
    <p class="note" data-role="msg"></p>`;
  el.querySelectorAll(".qcard").forEach(c=>{
    c.querySelector("[data-role=reveal]").addEventListener("click",()=>c.classList.toggle("open"));
    c.querySelectorAll(".selfcheck button").forEach(b=>b.addEventListener("click",()=>{
      const key=c.dataset.key,v=b.dataset.v;
      if(progress.quiz[key]===v) delete progress.quiz[key]; else progress.quiz[key]=v;
      saveProgress();paint();
    }));
  });
  const mb=el.querySelector("[data-role=more]"),msg=el.querySelector("[data-role=msg]");
  if(!askClaude){mb.disabled=true;msg.textContent="문제 생성은 claude.ai에서 이 페이지를 열었을 때 사용할 수 있습니다.";}
  else mb.addEventListener("click",()=>makeMore(s,u,mb,msg));
}
async function makeMore(s,u,btn,msg){
  btn.disabled=true;msg.textContent="새 문제를 만드는 중입니다… (20~60초)";
  const asked=(u.quiz||[]).map(q=>q.q).concat((generated[u.id]||[]).map(q=>q.q)).join("\n");
  const prompt=`당신은 한국 신체손해사정사 제2차시험 출제위원입니다.
과목: ${s.full}
단원: ${u.name}

[이 단원의 핵심 내용]
${(u.sections||[]).map(x=>x.h+": "+plain(x.body||"")).join("\n").slice(0,4000)}

[이미 출제된 문제 — 중복 금지]
${asked.slice(0,2000)}

위 단원에서 실제 2차시험에 나올 법한 주관식(논술형) 예상문제 3개를 새로 만드세요.
오직 아래 형식의 JSON 배열로만 답하세요.
[{"q":"문제 지문 (배점 표기 포함)","pts":15,"a":"모범답안"}]
- pts는 5~30 사이 정수
- a는 실제 답안지처럼 "Ⅰ. 의의 / Ⅱ. 요건 또는 유형 / Ⅲ. 결론" 구조로 번호를 매겨 8~15줄
- 법령·약관 조문은 확실한 것만 인용하고, 불확실하면 조문 번호를 적지 말 것`;
  try{
    const arr=await askClaude.json(prompt,{modelTier:"default"});
    const items=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.q&&x.a).map(x=>({q:String(x.q),pts:Number(x.pts)||10,a:String(x.a)}));
    if(!items.length) throw{code:"empty"};
    generated[u.id]=(generated[u.id]||[]).concat(items);
    saveGen(u.id);
    msg.textContent=items.length+"문항이 추가되었습니다.";
    paint();
  }catch(e){
    const m={not_granted:"Claude 사용에 동의하지 않으셨습니다.",rate_limited:"사용량 제한입니다. 잠시 후 다시 시도해 주세요.",invalid_json:"응답 형식이 맞지 않았습니다. 다시 시도해 주세요."};
    msg.textContent=m[e&&e.code]||"문제를 만들지 못했습니다. 다시 시도해 주세요.";
    btn.disabled=false;
  }
}

/* ---------- 기출 ---------- */
function resolveRef(s,ref){
  if(!ref) return null;
  const [uid,i]=ref.split("#");
  const uu=s.units.find(x=>x&&x.id===uid);
  const q=uu&&uu.quiz&&uu.quiz[+i];
  return q?q.a:null;
}
function renderPast(el,s,u){
  const list=(u.past||[]).slice().sort((a,b)=>b.r-a.r);
  if(!list.length){ el.innerHTML=`<p class="empty">이 단원으로 분류된 기출 문항이 없습니다.</p>`; return; }
  const withAns=list.filter(p=>p.a||p.ref).length;
  el.innerHTML=`<p class="note">"${esc(u.name.replace(/^\d+\.\s*/,""))}" 단원의 실제 출제 문항 ${list.length}건 · 모범답안 ${withAns}건</p>`+
    list.map(p=>{
      const ans=p.a||resolveRef(s,p.ref);
      return `<div class="pq">
        <div class="meta">제${p.r}회</div>${esc(p.t)}
        ${ans?`<button class="btn ghost" type="button" data-role="pr" style="margin-top:10px;">모범답안 보기</button>
        <div class="ans">${esc(ans)}</div>`:`<div class="note" style="margin-top:6px;">회차 구성 안내 — 개별 문항의 답안은 해당 단원에서 확인하세요.</div>`}
      </div>`;
    }).join("");
  el.querySelectorAll("[data-role=pr]").forEach(b=>b.addEventListener("click",()=>{
    const box=b.parentElement;
    box.classList.toggle("open");
    b.textContent=box.classList.contains("open")?"답안 접기":"모범답안 보기";
  }));
}

/* ---------- 챗봇 ---------- */
function ctxFor(s){
  return `당신은 한국 신체손해사정사 제2차시험 수험생을 돕는 학습 도우미입니다. 상대는 이 분야를 처음 공부하는 초보 수험생이므로, 전문용어를 쓸 때는 짧게 풀어서 설명해 주세요.

[답변 형식 — 반드시 지킬 것]
답변은 주관식(논술형) 시험 답안처럼 작성합니다.
Ⅰ. 의의(개념 정의) → Ⅱ. 본론(요건·유형·효과를 1. 2. 3. 번호로) → Ⅲ. 결론(사례 적용 또는 소결)
- 각 항목은 두괄식으로 결론을 먼저 쓰고 근거를 붙입니다.
- 배점이 언급되면 분량을 맞춥니다(10점=반 페이지, 20점=1페이지 수준).
- 계산을 요구하면 산식과 단계를 반드시 보여줍니다.
- 법령·약관 조문은 확실한 것만 인용하고, 불확실하면 "정확한 조문·최신 수치는 원문 확인이 필요합니다"라고 밝힙니다.
- 단순한 확인 질문이나 잡담에는 이 형식을 강요하지 말고 짧게 답합니다.

[현재 과목] ${s.full}

[이 과목의 정리 내용]
${s.units.map(u=>u.name+" — "+(u.sections||[]).map(x=>x.h+": "+plain(x.body||"")).join(" / ")).join("\n").slice(0,12000)}`;
}
function renderChat(el,s){
  if(!chatHist[s.id]) chatHist[s.id]=[];
  const u=findUnit(s,curUnit[s.id]);
  el.innerHTML=`<div class="chatwrap">
    <div class="chatlog" data-role="log"></div>
    <div class="chips">
      <button class="chip" type="button">${esc(u.name.replace(/^\d+\.\s*/,""))} 핵심을 답안 형식으로 정리해줘</button>
      <button class="chip" type="button">이 단원에서 자주 틀리는 함정은?</button>
      <button class="chip" type="button">20점짜리 답안 목차만 잡아줘</button>
    </div>
    <div class="chatform">
      <textarea id="chat-${s.id}" data-role="in" placeholder="궁금한 내용을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button class="btn" type="button" data-role="send">전송</button>
    </div></div>`;
  const log=el.querySelector("[data-role=log]"),inp=el.querySelector("[data-role=in]"),send=el.querySelector("[data-role=send]");
  const draw=()=>{
    log.innerHTML=chatHist[s.id].length
      ?chatHist[s.id].map(m=>`<div class="bubble ${m.role==="user"?"user":"bot"}">${esc(m.content)}</div>`).join("")
      :`<p class="note">${askClaude?"답변은 주관식 답안 형식(Ⅰ. 의의 / Ⅱ. 본론 / Ⅲ. 결론)으로 나옵니다. 첫 질문 시 Claude 사용 동의가 한 번 필요합니다.":"챗봇은 claude.ai에서 이 페이지를 열었을 때 사용할 수 있습니다."}</p>`;
    log.scrollTop=log.scrollHeight;
  };
  draw();
  async function go(text){
    if(!text.trim()||!askClaude) return;
    chatHist[s.id].push({role:"user",content:text.trim()});
    chatHist[s.id].push({role:"assistant",content:"답안을 작성하는 중…"});
    draw(); inp.value=""; send.disabled=true;
    const turns=[{role:"user",content:ctxFor(s)}].concat(chatHist[s.id].slice(0,-1).slice(-8));
    try{
      const res=await askClaude(turns,{cache:false,onText:({text})=>{
        chatHist[s.id][chatHist[s.id].length-1]={role:"assistant",content:text}; draw();
      }});
      chatHist[s.id][chatHist[s.id].length-1]={role:"assistant",content:res.text};
    }catch(e){
      const m={not_granted:"Claude 사용에 동의하지 않으셨습니다.",rate_limited:"사용량 제한입니다. 잠시 후 다시 시도해 주세요.",cancelled:"중단되었습니다."};
      chatHist[s.id][chatHist[s.id].length-1]={role:"assistant",content:(e&&e.text)||m[e&&e.code]||"답변을 가져오지 못했습니다."};
    }
    draw(); send.disabled=false;
  }
  send.addEventListener("click",()=>go(inp.value));
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go(inp.value);}});
  el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>go(c.textContent)));
}

buildShell(); paint(); boot();
</script>
