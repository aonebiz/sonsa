       a:`Ⅰ. 책임제한 요소의 의의\n1. 과실상계 — 피해자 측의 주의의무 위반이 손해의 발생이나 확대에 기여한 경우 공평의 원칙에 따라 배상액을 감경하는 제도이다. 여기의 과실은 불법행위 성립요건인 타인에 대한 의무위반과 달리, 신의칙상 인정되는 자기의 불이익을 방지하기 위한 주의의무 위반을 의미한다.\n2. 기왕증 공제 — 사고 이전의 기왕증이나 체질적 요인이 손해의 발생 또는 확대에 기여한 경우 이를 참작하여 손해액을 감액하는 제도이다. 대법원은 상당인과관계 자체는 인정하되 손해의 공평한 분담을 위하여 과실상계 규정을 유추적용하여 참작한다.\n3. 손익상계 — 동일한 불법행위 원인으로 피해자가 이익을 얻은 경우 실손해 전보 원칙에 따라 손해액에서 이를 공제하는 제도이다. 명문의 규정은 없으나 손해배상 제도의 형평 이념상 당연히 인정된다.\n\nⅡ. 적용 순서\n기왕증(기여도) 공제 → 과실상계 → 손익상계\n\nⅢ. 이유\n순수하게 이번 사고로 인한 손해액을 확정하기 위하여 기왕증을 먼저 공제하고, 확정된 사고 손해액에 대하여 피해자의 과실비율을 적용하여 과실상계를 수행하며, 마지막으로 과실상계 후 남은 최종 배상액 범위 내에서 이득을 공제하여야 손해분담의 형평성에 부합하기 때문이다.\n\nⅣ. 유의\n산재보험급여의 경우 판례는 재해근로자 보호를 위하여 공제 후 과실상계 방식을 채택하므로 별도로 검토하여야 한다.`},
      {q:"총 손해액 1억원, 기왕증 기여도 20%, 피해자 과실비율 30%, 피해자가 수령한 타 보험금(손익상계 대상) 2,000만원인 경우 피해자가 최종적으로 청구할 수 있는 손해배상금을 산출하시오. (3점)", pts:3, lik:3,
       a:`Ⅰ. 적용 순서\n기왕증 공제 → 과실상계 → 손익상계\n\nⅡ. 산출\n1. 기왕증 공제 — 100,000,000원 × (1 − 0.2) = 80,000,000원\n2. 과실상계 — 80,000,000원 × (1 − 0.3) = 56,000,000원\n3. 손익상계 — 56,000,000원 − 20,000,000원 = 36,000,000원\n\nⅢ. 결론\n피해자 A가 최종적으로 청구할 수 있는 손해배상금은 36,000,000원이다.`},
      {q:"사용자의 근로자에 대한 '안전배려의무'의 개념과 위반 시 효과에 대하여 약술하시오. (5점)", pts:5, lik:3,
       a:`Ⅰ. 개념\n사용자는 근로계약에 수반되는 신의칙상의 부수의무로서, 근로자가 노무를 제공하는 과정에서 생명·신체·건강을 해치는 일이 없도록 물적 환경을 정비하고 필요한 조치를 강구할 의무를 진다.\n\nⅡ. 법적 성질\n근로계약상 부수의무이므로 위반 시 채무불이행책임이 성립하며, 불법행위의 요건을 갖추면 민법 제750조의 불법행위책임도 성립하여 두 청구권이 경합한다.\n\nⅢ. 위반 시 효과\n1. 근로자는 산재보험 급여로 전보되지 않는 손해(위자료, 초과 일실수익 등)에 대하여 손해배상을 청구할 수 있다.\n2. 채무불이행으로 구성하면 사용자가 무과실을 입증하여야 하고 소멸시효가 10년이므로 근로자에게 유리하다.\n3. 이 손해배상책임이 근재보험 사용자배상책임 특별약관의 담보 대상이 된다.`},
      {q:"민법상 공작물책임(제758조)의 요건과 책임주체를 설명하고, 배상책임보험에서의 의의를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n공작물의 설치 또는 보존의 하자로 타인에게 손해를 가한 경우 점유자 또는 소유자가 지는 책임으로, 위험책임의 법리에 기초한 특수 불법행위책임이다.\n\nⅡ. 요건\n1. 공작물의 존재 — 인공적 작업에 의하여 만들어진 물건\n2. 설치 또는 보존의 하자 — 공작물이 통상 갖추어야 할 안전성을 결여한 상태\n3. 손해의 발생과 인과관계\n\nⅢ. 책임주체의 2단 구조\n1. 1차적으로 점유자가 책임을 진다. 다만 점유자가 손해 방지에 필요한 주의를 해태하지 아니하였음을 입증하면 면책된다.\n2. 점유자가 면책되는 경우 2차적으로 소유자가 책임을 지며, 소유자에게는 면책 입증이 허용되지 않는 무과실책임이다.\n\nⅣ. 배상책임보험에서의 의의\n1. 영업배상책임보험 시설소유관리자 특별약관은 시설의 소유·사용·관리에 기인하는 사고를 담보하므로 공작물책임과 직결된다.\n2. 소유자의 무과실책임이 인정되므로 시설 관련 사고에서는 배상책임의 성립이 비교적 쉽게 인정되고, 실무상 면책사유와 손해액이 주된 쟁점이 된다.\n\nⅤ. 결론\n시설 사고 사례에서는 점유자와 소유자를 구분하여 각자의 책임을 검토하여야 한다.`},
      {q:"민법 제759조 동물점유자의 책임에 관하여 발생요건과 배상책임자를 설명하고 사례에 적용하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 발생요건\n동물을 점유하는 자 또는 점유자에 갈음하여 동물을 보관하는 자는 그 동물이 타인에게 손해를 가한 경우 손해배상책임을 진다. 이 경우의 동물은 그 종류를 묻지 않으며 소유자가 누구인지도 묻지 않는다.\n\nⅡ. 면책사유\n1. 동물의 종류와 성질에 따라 그 보관에 상당한 주의를 해태하지 아니한 경우\n2. 피해자가 그 동물을 자극하여 손해를 자초한 경우\n\nⅢ. 배상책임자\n1. 점유자 — 동물을 사실상 지배하는 자\n2. 보관자 — 점유자에 갈음하여 동물을 보관하는 자\n3. 간접점유자 또는 점유보조자는 배상책임을 부담하지 않는다.\n\nⅣ. 사례의 적용\n반려견의 소유자라도 사고 당시 동물을 사실상 지배하지 않았다면 점유자에 해당하지 않아 책임을 지지 않는다. 사고 당시 개목줄을 잡고 있던 자가 직접 점유자에 해당하며, 목줄을 놓쳐 사고가 발생하였다면 상당한 주의를 다하였다고 볼 수 없으므로 제759조의 책임을 진다.\n\nⅤ. 결론\n소유 여부가 아니라 사고 당시의 사실상 지배 여부로 책임주체를 정한다.`},
      {q:"민법 제756조 사용자책임의 요건을 설명하고, 근로자재해보상책임보험과의 관계를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 요건\n1. 사용관계의 존재 — 실질적인 지휘·감독 관계가 있으면 족하고 고용계약의 형식을 요하지 않는다.\n2. 사무집행에 관하여 — 외형상 사무집행으로 보이는 행위를 포함한다(외형이론).\n3. 피용자의 불법행위 — 피용자에게 제750조의 요건이 갖추어져야 한다.\n4. 면책 — 사용자가 선임 및 사무감독에 상당한 주의를 하였음을 입증하면 면책되나 실무상 거의 인정되지 않는다.\n\nⅡ. 근재보험과의 관계\n1. 피해자가 제3자인 경우 — 사용자책임은 영업배상책임보험 등에서 담보된다.\n2. 피해자가 자기 근로자인 경우 — 영업배상책임보험은 근로자의 신체장해를 면책으로 정하므로, 근로자재해보상책임보험의 사용자배상책임 특별약관이 담보한다.\n\nⅢ. 구상관계\n사용자가 배상한 경우 피용자에게 구상할 수 있으나, 판례는 신의칙상 상당한 범위로 제한한다.\n\nⅣ. 결론\n동일한 사용자책임이라도 피해자가 근로자인지 제3자인지에 따라 적용 보험이 달라지므로 피해자의 지위를 먼저 확정하여야 한다.`},
      {q:"공동불법행위와 부진정연대책임에 관하여 설명하고, 보험자 간 정산방법을 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 공동불법행위\n민법 제760조에 따라 여러 사람이 공동의 불법행위로 타인에게 손해를 가한 때에는 연대하여 그 손해를 배상할 책임이 있다. 객관적 관련공동성이 있으면 성립하며 의사의 공동을 요하지 않는다.\n\nⅡ. 부진정연대채무\n1. 의의 — 각자가 피해자에 대하여 손해 전부를 배상할 의무를 지되, 채무자 사이에 주관적 공동관계가 없는 관계를 말한다.\n2. 효과 — 피해자는 공동불법행위자 중 누구에게나 손해 전액을 청구할 수 있다.\n\nⅢ. 내부적 구상\n배상을 한 자는 다른 공동불법행위자에게 각자의 과실비율에 따른 부담부분의 범위에서 구상할 수 있다.\n\nⅣ. 보험자 간 정산\n1. 가해자별로 보험자가 다른 경우 — 각 가해자의 부담부분에 따라 정산하며, 한 보험자가 전액을 지급하였다면 다른 보험자에게 구상한다.\n2. 동일한 피보험이익에 복수의 보험이 있는 경우 — 중복보험의 분담 문제로서 각 보험자의 독립책임액 비율로 안분한다.\n\nⅤ. 결론\n사례에서는 각자의 법률상 책임 → 부진정연대 → 보험사별 분담의 순서로 서술한다.`},
      {q:"손해배상에서 위자료의 산정과 과실상계의 관계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 위자료의 의의\n불법행위로 인한 정신적 고통에 대한 배상으로, 재산적 손해와 달리 액수를 객관적으로 산정하기 어려워 법원의 재량에 맡겨진다.\n\nⅡ. 산정의 기준\n1. 피해의 정도(사망·후유장해의 정도), 피해자와 가해자의 사정, 사고의 경위, 가해행위의 비난가능성 등을 종합적으로 참작한다.\n2. 실무에서는 정형화된 기준표를 기초로 하되 개별 사정을 반영한다.\n\nⅢ. 과실상계와의 관계\n1. 원칙 — 위자료도 손해배상의 일부이므로 과실상계의 대상이 된다.\n2. 실무 — 위자료는 산정 단계에서 이미 제반 사정을 참작하므로, 과실비율을 그대로 곱하지 않고 일부만 반영하는 방식이 사용되기도 한다. 예컨대 과실비율의 6/10만을 반영하여 감액하는 방식이 그러하다.\n\nⅣ. 손익상계와의 관계\n위자료는 재산적 손해와 성질이 다르므로 산재보험급여 등 손해전보성 급부를 위자료에서 공제하지 않는다.\n\nⅤ. 결론\n위자료는 과실상계의 대상이 되나 그 반영 방식은 재산적 손해와 다를 수 있고, 손익상계의 대상은 아니라는 점이 실무의 핵심이다.`},
      {q:"업무상 재해에서 사용자의 책임 근거를 채무불이행과 불법행위로 나누어 비교하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 채무불이행책임(안전배려의무 위반)\n1. 근거 — 근로계약상 신의칙상 부수의무의 위반\n2. 입증책임 — 사용자가 자신에게 귀책사유가 없음을 입증하여야 한다.\n3. 소멸시효 — 10년\n4. 위자료 — 인정된다.\n\nⅡ. 불법행위책임(민법 제750조·제756조)\n1. 근거 — 사용자 또는 그 피용자의 고의·과실\n2. 입증책임 — 근로자가 사용자의 고의·과실을 입증하여야 한다.\n3. 소멸시효 — 손해 및 가해자를 안 날부터 3년, 불법행위일부터 10년\n4. 위자료 — 인정된다.\n\nⅢ. 양자의 관계\n두 청구권은 경합하므로 근로자는 유리한 쪽을 선택하여 행사할 수 있다. 입증책임과 소멸시효 면에서 채무불이행 구성이 근로자에게 유리하다.\n\nⅣ. 보험실무상 의의\n어느 구성을 취하든 사용자가 부담하는 손해배상책임은 근재보험 사용자배상책임 특별약관의 담보 대상이 되므로, 보험자는 책임의 성립 여부와 손해액을 함께 검토한다.`},
      {q:"배상책임보험에서 피해자의 '기왕증'과 '기왕장애'를 구별하고, 손해액 산정에 미치는 영향을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 개념의 구별\n1. 기왕증 — 당해 사고 전에 이미 가지고 있던 증상으로서 특이체질 및 병적 소인 등을 말한다.\n2. 기왕장애 — 당해 사고와 무관하게 이미 존재하던 장애를 말한다.\n\nⅡ. 손해액 산정에 미치는 영향\n1. 기왕증 — 손해의 발생 또는 확대에 기여한 정도(기여도)만큼 손해액에서 공제한다. 대법원은 상당인과관계는 인정하되 과실상계 규정을 유추적용하여 참작한다.\n2. 기왕장애 — 이번 사고로 인한 장해와 구별하여야 하며, 복합장해율 산정 시 기왕장애분을 제외한 순수한 사고 기여분만 인정한다.\n\nⅢ. 적용 순서\n기왕증 공제는 손해액 확정 단계의 조정이므로 과실상계와 손익상계보다 먼저 적용한다.\n\nⅣ. 실무상 판단\n1. 기여도는 의학적 감정에 따르며 손해사정사가 임의로 정할 수 없다.\n2. 판정에 다툼이 있으면 제3의 전문의료기관 전문의에게 의뢰한다.\n3. 근로기준법상 재해보상에서는 기왕증을 이유로 요양보상을 공제할 수 없다는 것이 판례의 태도이다.\n\nⅤ. 결론\n기왕증은 손해액 자체를 줄이는 조정이고 과실상계는 확정된 손해액을 나누는 조정이라는 점에서 층위가 다르다.`},

      {q:"민법 제757조 도급인의 책임에 관하여 원칙과 예외를 설명하고, 노무도급의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 원칙\n도급인은 수급인이 그 일에 관하여 제3자에게 가한 손해를 배상할 책임이 없다. 수급인은 독립하여 일을 완성하는 자이기 때문이다.\n\nⅡ. 예외\n도급 또는 지시에 관하여 도급인에게 중대한 과실이 있는 때에는 도급인도 배상책임을 진다.\n\nⅢ. 노무도급의 처리\n1. 노무도급은 형식은 도급이나 실질은 도급인이 노무자를 지휘·감독하는 관계이다.\n2. 판례는 이 경우 도급인과 수급인 사이에 사용관계가 있다고 보아 민법 제756조 사용자책임을 적용한다.\n3. 따라서 도급인은 제757조의 원칙적 면책을 주장할 수 없다.\n\nⅣ. 보험과의 연결\n1. 수급인의 책임은 도급업자 배상책임 특별약관으로 담보한다.\n2. 도급인의 책임은 발주자 미필적 배상책임 특별약관 등으로 담보한다.\n3. 노무도급으로 평가되면 근로자재해보상책임보험의 사용자배상책임 담보가 문제될 수 있다.\n\nⅤ. 결론\n도급 사안은 계약의 명칭이 아니라 지휘·감독의 실질로 판단하여야 하며, 그 결과에 따라 적용 조문과 적용 보험이 모두 달라진다.`},
      {q:"불법행위책임과 채무불이행책임을 비교하고, 업무상 재해에서 양 책임의 경합을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 비교\n1. 근거 — 불법행위책임은 민법 제750조의 일반적 의무 위반, 채무불이행책임은 민법 제390조의 계약상 의무 위반\n2. 입증책임 — 불법행위는 피해자가 가해자의 과실을 입증하고, 채무불이행은 채무자가 귀책사유 없음을 입증한다.\n3. 소멸시효 — 불법행위는 안 날부터 3년, 불법행위를 한 날부터 10년. 채무불이행은 10년이며 안전배려의무 위반은 상사채권으로 5년이 적용될 수 있다.\n\nⅡ. 업무상 재해에서의 경합\n1. 사용자는 근로계약에 수반하는 신의칙상 안전배려의무를 부담하므로 그 위반은 채무불이행책임이 된다.\n2. 동시에 사용자의 과실은 민법 제750조 또는 제756조의 불법행위책임을 구성한다.\n3. 양 청구권은 경합하며 피해자는 선택하여 행사할 수 있다.\n\nⅢ. 실익\n1. 입증책임의 분배가 근로자에게 유리한 채무불이행 구성이 실무상 선호된다.\n2. 소멸시효의 기산점과 기간이 달라 청구 가능 여부가 갈릴 수 있다.\n\nⅣ. 보험에서의 의의\n근로자재해보상책임보험의 사용자배상책임 담보는 위 어느 구성에 의하든 사용자가 부담하는 법률상 배상책임을 담보한다.\n\nⅤ. 결론\n답안에서는 두 책임을 병렬로 서술한 후 사안에서 어느 구성이 유리한지를 밝히는 것이 바람직하다.`},
      {q:"국가배상법상 영조물의 설치·관리 하자로 인한 책임을 민법 제758조 공작물책임과 비교하여 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 영조물책임\n1. 근거 — 국가배상법 제5조\n2. 요건 — 공공의 영조물일 것, 설치 또는 관리에 하자가 있을 것, 그로 인하여 타인에게 손해가 발생하였을 것\n3. 책임주체 — 국가 또는 지방자치단체\n\nⅡ. 공작물책임과의 비교\n1. 공통점 — 물건의 하자로 인한 위험책임이라는 점\n2. 차이점 — 민법 제758조는 점유자가 손해의 방지에 필요한 주의를 다하였음을 입증하면 면책되고 소유자가 무과실책임을 지나, 국가배상법 제5조에는 점유자의 면책규정이 없다.\n\nⅢ. 보험과의 연결\n지방자치단체 등이 부담하는 영조물 관련 배상책임은 영조물배상책임보험으로 담보한다. 민간 시설의 경우에는 시설소유관리자 특별약관이 적용된다.\n\nⅣ. 실무상 유의점\n사안의 시설이 공공의 영조물인지 민간 시설인지에 따라 적용 법률과 적용 보험이 달라지므로 이를 먼저 특정하여야 한다.\n\nⅤ. 결론\n영조물책임은 면책규정이 없다는 점에서 공작물책임보다 책임이 무겁다.`}

       a:`1. 피보험자의 고의로 생긴 손해\n2. 계약에 의하여 가중된 배상책임 — 법률상 부담하는 책임을 초과하여 약정으로 인수한 책임\n3. 전쟁, 혁명, 내란, 사변, 폭동, 소요 및 이와 유사한 사태로 생긴 손해\n4. 핵연료물질 또는 방사선에 기인한 손해\n5. 피보험자와 근로계약관계에 있지 아니한 자가 입은 신체장해 — 영업배상책임보험 등의 담보 영역이다.\n6. 근로자의 업무 외의 재해 — 비업무상 재해 확장 추가 특별약관에 가입하지 아니한 경우\n7. 벌금, 과태료, 징벌적 손해배상금 등 제재적 성격의 금원\n8. 티끌, 먼지, 석면 등에 의한 직업성 질병 중 약관이 정한 제외 사유에 해당하는 손해`},
      {q:"근로자재해보상책임보험과 산업재해보상보험의 관계를 손해 항목별로 설명하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 산재보험의 특징\n업무상 재해에 대하여 사용자의 과실을 묻지 않고 법정 급여를 지급하나, 급여가 정률·정액이고 위자료가 없다.\n\nⅡ. 손해 항목별 관계\n1. 치료비 — 산재보험 요양급여로 전액 전보되므로 근재보험의 실익이 크지 않다.\n2. 휴업손해 — 산재보험 휴업급여는 평균임금의 70%이므로, 나머지 부분이 근재보험의 담보 대상이 된다.\n3. 상실수익액 — 산재보험 장해급여·유족급여는 정률이므로 실제 손해와의 차액을 근재보험이 담보한다.\n4. 위자료 — 산재보험에는 위자료가 없으므로 전액이 근재보험의 고유 영역이다.\n5. 개호비·일실퇴직금 — 산재보험 간병급여가 일부를 전보하나 부족분은 근재보험이 담보한다.\n\nⅢ. 공제의 방법\n항목 대응 원칙에 따라 동일 성질의 항목에서만 공제하며, 위자료에서는 공제하지 않는다. 산재보험급여에 대하여는 판례가 공제 후 과실상계 방식을 채택한다.\n\nⅣ. 구상관계\n근로복지공단은 지급한 급여의 범위에서 제3자에 대한 재해근로자의 손해배상청구권을 대위 취득한다.\n\nⅤ. 결론\n근재보험은 산재보험의 보충적 지위에 있으며, 위자료와 초과손해가 핵심 담보 대상이다.`},
      {q:"해외근로자재해보상보험의 특징과 요양보상 산정 시 유의사항을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n해외에 파견된 근로자가 업무상 재해를 입은 경우 사용자가 부담하는 재해보상 및 손해배상책임을 담보하는 보험이다.\n\nⅡ. 특징\n1. 국내 근재보험과 담보구조는 같으나 해외 현지 사정을 반영한 규정을 둔다.\n2. 산재보험은 해외파견자에 대하여 임의가입 대상인 경우가 있으므로 가입 여부를 먼저 확인하여야 한다.\n3. 현지 법령에 따른 배상책임이 문제될 수 있으므로 약관의 준거법 조항을 확인한다.\n\nⅢ. 요양보상 산정 시 유의사항\n1. 현지에서 발생한 치료비도 요양보상에 포함한다.\n2. 국외에서 국내로 이송하는 비용은 약관이 정한 한도(예: 500만원) 범위에서 인정한다.\n3. 호송인 비용은 어떠한 경우에도 인정하지 않는다.\n4. 환율 적용 시점과 기준을 확인하여야 한다.\n\nⅣ. 결론\n해외근재는 이송비 한도와 호송인 비용 불인정이 반복 출제되는 논점이므로 반드시 기억하여야 한다.`},
      {q:"근로자재해보상책임보험 사례에서 '법률상 배상책임'과 '약관상 보상책임'을 검토하는 순서와 내용을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 법률상 배상책임의 검토\n1. 근거의 특정 — 사용자의 안전배려의무 위반(채무불이행) 또는 민법 제750조·제756조\n2. 요건의 충족 — 업무상 재해 해당 여부, 사용자의 귀책사유, 인과관계\n3. 피해자의 지위 — 근로계약관계에 있는 근로자인지 확인한다.\n\nⅡ. 약관상 보상책임의 검토\n1. 가입 특별약관의 확인 — 사용자배상책임, 재해보상책임, 비업무상 재해 확장, 간병보상 추가 등\n2. 보상하는 손해 해당 여부 — 보험기간 중 업무수행 중의 신체장해인지\n3. 면책사유 — 고의, 계약가중책임, 근로계약관계 없는 자, 업무 외 재해 등\n4. 보상한도액과 자기부담금의 확인\n\nⅢ. 두 단계를 구분하는 이유\n법률상 책임이 있어도 약관상 면책이면 보험금은 지급되지 않고, 반대로 재해보상책임 특별약관은 과실 없는 법정 의무를 담보하므로 법률상 배상책임과 범위가 다르다.\n\nⅣ. 결론\n답안은 반드시 두 목차를 분리하여 각각의 결론을 제시하여야 한다.`},
      {q:"근로자가 업무상 재해로 사망한 경우 근재보험 사용자배상책임 특별약관에 따른 지급보험금 산정순서를 설명하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 법률상 배상책임의 성립\n사용자의 안전배려의무 위반 또는 민법 제750조·제756조에 따른 손해배상책임이 성립하는지 검토한다.\n\nⅡ. 약관상 보상책임\n사용자배상책임 특별약관의 담보범위에 해당하는지, 면책사유는 없는지 확인한다.\n\nⅢ. 손해배상금의 산정\n1. 적극손해 — 치료비, 장례비\n2. 소극손해 — 요양기간 중 일실수익과 요양 이후 상실수익액. 사망은 생계비를 공제한다.\n3. 일실퇴직금 — 예상퇴직금을 현가화한 후 기수령 퇴직금을 공제한다.\n4. 위자료\n\nⅣ. 공제와 상계\n1. 기왕증이 있으면 기여도만큼 먼저 공제한다.\n2. 과실상계를 적용한다.\n3. 산재보험급여를 항목 대응 원칙에 따라 손익상계한다. 다만 산재보험급여에 대하여는 공제 후 과실상계 방식이 적용되며, 사망사고에서는 상속 후 공제가 선행한다. 위자료에서는 공제하지 않는다.\n\nⅤ. 지급보험금의 확정\n자기부담금을 공제하고 보상한도액을 적용한다. 중복보험이면 독립책임액 비율로 안분한다.\n\nⅥ. 결론\n법률상 책임 → 약관상 보상책임 → 손해배상금 → 공제·상계 → 지급보험금의 순서를 지킨다.`},
      {q:"근재보험에서 '업무상 재해'의 인정기준을 유형별로 약술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 업무상 재해의 의의\n업무상의 사유에 따른 근로자의 부상·질병·장해 또는 사망을 말하며, 업무수행성과 업무기인성을 요건으로 한다.\n\nⅡ. 유형별 인정기준\n1. 업무상 사고\n  ① 근로계약에 따른 업무나 그에 따르는 행위를 하던 중 발생한 사고\n  ② 사업주가 제공한 시설물 등을 이용하던 중 그 관리상 하자로 발생한 사고\n  ③ 사업주가 주관하거나 지시에 따라 참여한 행사나 행사준비 중 발생한 사고\n  ④ 휴게시간 중 사업주의 지배관리 아래 있다고 볼 수 있는 행위로 발생한 사고\n  ⑤ 그 밖에 업무와 관련하여 발생한 사고\n\n2. 업무상 질병\n  ① 업무수행 과정에서 유해·위험요인을 취급하거나 그에 노출되어 발생한 질병\n  ② 업무상 부상이 원인이 되어 발생한 질병\n  ③ 직장 내 괴롭힘, 고객의 폭언 등으로 인한 업무상 정신적 스트레스가 원인이 되어 발생한 질병\n\n3. 출퇴근 재해\n  ① 사업주가 제공한 교통수단이나 그에 준하는 방법으로 출퇴근하는 중 발생한 사고\n  ② 그 밖에 통상적인 경로와 방법으로 출퇴근하는 중 발생한 사고. 일탈·중단이 있으면 원칙적으로 제외되나 일상생활에 필요한 행위 등은 예외이다.\n\nⅢ. 제외\n근로자의 고의·자해행위나 범죄행위 또는 그것이 원인이 되어 발생한 부상·질병·장해 또는 사망은 업무상 재해로 보지 않는다.`},
      {q:"근재보험에서 피보험자와 피해자의 범위를 설명하고, 영업배상책임보험과의 담보 경계를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 근재보험의 피보험자\n보험증권에 기재된 사업주(사용자)가 피보험자이며, 사업의 종류와 사업장을 특정하여 인수한다.\n\nⅡ. 근재보험의 피해자\n피보험자와 근로계약관계에 있는 근로자로서 업무수행 중 신체장해를 입은 자이다. 하수급인의 근로자에 대하여는 도급인의 지위와 특약의 내용에 따라 결론이 달라진다.\n\nⅢ. 영업배상책임보험과의 경계\n1. 영업배상책임보험은 피보험자의 근로자가 입은 신체장해를 면책사유로 정하고 있다.\n2. 따라서 피해자가 근로자이면 근재보험, 제3자이면 영업배상책임보험이 담보한다.\n3. 이는 두 보험의 담보영역이 중복되는 것을 방지하고 각 보험의 요율 산출 근거를 유지하기 위함이다.\n\nⅣ. 실무상 유의\n1. 피해자의 근로계약관계 유무를 반드시 확인한다.\n2. 파견근로자, 하수급인 근로자, 특수형태근로종사자의 경우 사용사업주와 파견사업주 중 누가 사용자인지가 쟁점이 된다.\n\nⅤ. 결론\n피해자의 지위 확정이 담보 종목을 결정하므로 사례의 첫 단계로 삼아야 한다.`},
      {q:"근재보험에서 '보상하는 손해'의 요건인 업무수행성과 업무기인성을 설명하고, 그 판단이 문제되는 사례를 들어 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 두 요건의 의의\n1. 업무수행성 — 근로자가 사업주의 지배·관리 아래에서 업무를 수행하는 상태에 있었는지를 말한다.\n2. 업무기인성 — 그 업무와 재해 사이에 상당인과관계가 있는지를 말한다.\n\nⅡ. 양자의 관계\n원칙적으로 두 요건을 모두 갖추어야 업무상 재해로 인정되나, 업무수행성이 인정되면 업무기인성이 추정되는 것으로 보는 경향이 있다.\n\nⅢ. 판단이 문제되는 사례\n1. 휴게시간 중의 사고 — 사업주의 지배·관리 아래 있다고 볼 수 있는 행위인지에 따라 결론이 달라진다.\n2. 회식 중의 사고 — 사업주가 주관하거나 지시한 행사인지, 참석이 사실상 강제되었는지를 본다.\n3. 출장 중의 사고 — 출장 목적과 무관한 사적 행위 중의 사고는 제외된다.\n4. 출퇴근 중의 사고 — 통상적인 경로와 방법이었는지, 일탈·중단이 있었는지를 본다.\n5. 업무상 질병 — 유해요인 노출 정도와 기간, 개인적 소인의 기여도를 종합한다.\n\nⅣ. 실무상 판단\n산재 승인 여부가 유력한 판단자료가 되나 보험자가 이에 구속되는 것은 아니므로, 약관상 담보요건을 별도로 검토하여야 한다.`}

    sections:[
      {h:"평균임금 — 모든 계산의 출발점", freq:F(3,[46,49]),
       body:`<div class="lawbox"><span class="src">근로기준법 제2조</span>평균임금 = 산정사유 발생일 이전 <b>3개월간</b> 지급된 <b>임금총액</b> ÷ 그 기간의 <b>총일수</b></div>
       <div class="why"><span class="h">가장 많이 틀리는 곳</span>
       분모는 <b>총일수</b>이지 <b>근무일수</b>가 아니다. 3개월이면 대략 <b>89~92일</b>이다. 근무일수(예: 60일)로 나누면 금액이 완전히 달라진다.</div>
       <div class="scroller"><table class="mini">
       <tr><th>산정 제외기간</th><th>산정 제외임금</th></tr>
       <tr><td>수습사용 중의 기간(3개월 이내)</td><td>임시로 지급된 임금 및 수당</td></tr>
       <tr><td>사용자의 귀책사유로 인한 휴업기간</td><td>통화 외의 것으로 지급된 임금 중<br>법령·단체협약에 근거가 없는 것</td></tr>
       <tr><td>출산전후휴가 및 육아휴직 기간</td><td rowspan="3">—</td></tr>
       <tr><td>업무상 부상·질병으로 인한 요양기간</td></tr>
       <tr><td>쟁의행위 기간, 병역·예비군·민방위 의무이행 기간</td></tr>
       </table></div>
       <p><b>제외의 방법</b> — 해당 기간과 <b>그 기간 중에 지급된 임금을 모두</b> 산정에서 뺀다. 일시적·우연적 사정으로 평균임금이 부당하게 낮아지는 것을 방지하기 위함이다.</p>
       <p><b>최저보장</b> — 산출된 평균임금이 <b>통상임금보다 적으면 통상임금을 평균임금으로 한다.</b></p>`,
       mnemo:{key:"3개월 ÷ 총일수", how:"분모는 <b>총일수</b>다. 근무일수가 아니다.<br>제외기간은 <b>수·휴·출·요·쟁</b> — <b>수</b>습, <b>휴</b>업, <b>출</b>산·육아, <b>요</b>양, <b>쟁</b>의행위.<br>기간과 <b>그 기간의 임금을 함께</b> 뺀다. 통상임금보다 적으면 통상임금."}},

      {h:"근로기준법상 재해보상 5종", freq:F(3,[43,49]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>보상</th><th>내용</th><th>기준</th></tr>
       <tr><td><b>요양보상</b></td><td>필요한 요양을 행하거나 요양비를 부담</td><td><b>치료비 전액</b>(간병비 포함)</td></tr>
       <tr><td><b>휴업보상</b></td><td>요양 중 근로하지 못한 기간의 보상</td><td>요양 중 일수 × 평균임금 × <b>70%</b></td></tr>
       <tr><td><b>장해보상</b></td><td>치유 후 장해가 남은 경우</td><td>장해등급별 <b>일수</b> × 평균임금</td></tr>
       <tr><td><b>유족보상</b></td><td>사망한 경우 유족에게</td><td>평균임금 <b>1,000일분</b></td></tr>
       <tr><td><b>장례비</b></td><td>장례를 지낸 자에게</td><td>평균임금 <b>90일분</b></td></tr>
       </table></div>
       <p><b>요양보상의 7항목</b>(근로기준법 시행령 별표) — ① 진찰 ② 약제 또는 진료 재료의 지급 ③ 의지(義肢) 또는 그 밖의 보조기의 지급 ④ 처치·수술 그 밖의 치료 ⑤ 입원 ⑥ 간병 ⑦ 이송</p>
       <div class="why"><span class="h">출제자가 노리는 함정 두 개</span>
       <b>① 근로기준법 일수 → 산재보험법 일수 환산</b><br>
       문제에서 주어진 장해보상 일시금 일수가 <b>근로기준법 기준</b>이면 <b>110%를 곱해</b> 산재보험법 기준 일수로 환산한다. 43회 해설이 "출제위원이라면 한번쯤 함정으로 낼 부분"이라고 짚은 지점이다.<br><br>
       <b>② 기왕증을 이유로 요양보상을 공제할 수 없다</b><br>
       장해등급 판정 시 기왕증 기여도 공제에 관한 기준은 없다. 대법원 판례에 따르면 기왕증이 존재한다는 이유로 <b>요양보상을 공제할 수 없다.</b></div>`,
       mnemo:{key:"요 · 휴 · 장 · 유 · 장", how:"<b>요</b>양(전액) · <b>휴</b>업(70%) · <b>장</b>해(등급 일수) · <b>유</b>족(1,000일) · <b>장</b>례비(90일).<br>함정 둘 — <b>근기법 일수 × 110% = 산재법 일수</b>, <b>기왕증으로 요양보상 공제 불가</b>."}},

      {h:"장해등급의 조정과 병합", freq:F(3,[49]),
       body:`<p>장해가 둘 이상일 때 등급을 어떻게 정하는지가 계산의 핵심이다.</p>
       <ul><li><b>제13급 이상</b>의 장해가 둘 이상이면 <b>중한 장해등급을 1개 등급 상향</b></li>
       <li><b>제8급 이상</b>의 장해가 둘 이상이면 <b>중한 장해등급을 2개 등급 상향</b></li>
       <li><b>제5급 이상</b>의 장해가 둘 이상이면 <b>중한 장해등급을 3개 등급 상향</b></li>
       <li>조정 결과가 <b>제1급을 초과</b>하면 <b>제1급으로 한다</b>(상한).</li></ul>
       <p>49회 사례에서 제8급 이상 장해가 2개이므로 최상위 등급(2급)에서 2등급을 상향하여 <b>1급(1,474일분)</b>을 적용했다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>장해등급</th><th>장해보상일시금(산재법)</th></tr>
       <tr><td>제1급</td><td><b>1,474일분</b></td></tr>
       <tr><td>제2급</td><td>1,309일분</td></tr>
       <tr><td>제3급</td><td>1,155일분</td></tr>
       <tr><td>제8급</td><td>495일분</td></tr>
       </table></div>
       <div class="warn">일수표는 문제에서 제시되는 경우가 많다. 제시되면 <b>제시된 표</b>를 그대로 쓰고, 그 표가 근로기준법 기준인지 산재보험법 기준인지를 반드시 확인하라.</div>`,
       mnemo:{key:"13급 1 · 8급 2 · 5급 3", how:"둘 이상 장해의 등급 상향 — <b>13급 이상이면 1등급, 8급 이상이면 2등급, 5급 이상이면 3등급</b> 올린다.<br>올려도 <b>1급이 상한</b>. 1급은 <b>1,474일분</b>."}},

      {h:"복합장해율(병합)", freq:F(3,[42]),
       body:`<div class="lawbox"><span class="src">복합장해율 산식</span>복합장해율 = A + (100 − A) × B<br>(A = 높은 장해율, B = 낮은 장해율)</div>
       <p>장해가 둘 이상일 때 단순히 더하면 100%를 넘어버리므로, <b>남은 능력에 대해서만</b> 두 번째 장해율을 적용한다.</p>
       <p><b>예</b> — 우측 상하지 강직성 부전편마비 50%, 기질성 인격장해 20%<br>
       → 50% + (100 − 50) × 20% = 50% + 10% = <b>60%</b></p>
       <p>장해가 셋이면 같은 방법을 반복한다. 순서는 <b>높은 것부터</b> 적용한다.</p>`,
       mnemo:{key:"A + (100−A) × B", how:"단순히 더하지 않는다. <b>남은 능력에만</b> 두 번째를 곱한다.<br>50과 20이면 <b>50 + 50×0.2 = 60</b>. 셋이면 60에 대해 다시 반복."}},

      {h:"평균임금 — 제외기간 8종과 산입 실무", freq:F(3,[43,46,49]),
       body:`<div class="calcbox"><b>평균임금 = 산정사유 발생일 이전 3개월간의 임금총액 ÷ 그 기간의 총일수</b><br>
       ※ 산정사유 발생일 <b>당일은 포함하지 않는다</b>.</div>
       <p><b>근로기준법 시행령 제2조 — 기간과 임금 모두에서 빼는 8가지</b></p>
       <ol><li>수습 사용 중인 기간(3개월 이내)</li>
       <li>사용자의 귀책사유로 휴업한 기간</li>
       <li>출산전후휴가 기간</li>
       <li>업무상 부상·질병으로 요양하기 위하여 휴업한 기간</li>
       <li>육아휴직 기간</li>
       <li>적법한 쟁의행위 기간</li>
       <li>병역·예비군·민방위 의무 이행 기간(임금을 받은 경우는 제외)</li>
       <li>사용자의 승인을 받아 업무 외의 사유로 휴업한 기간</li></ol>
       <div class="scroller"><table class="mini">
       <tr><th>항목</th><th>산입 방법</th></tr>
       <tr><td><b>상여금</b></td><td>1년 이상 근무자는 <b>연간 지급액</b>을 기준으로 3개월분에 해당하는 금액을 산입한다. 3개월 미만 근무자는 실지급액을 근무일수로 나눈다.</td></tr>
       <tr><td><b>연차수당</b></td><td>전년도 발생분 중 3개월분을 산입한다.</td></tr>
       <tr><td><b>가족수당</b></td><td>가족 수와 무관하게 <b>일률적으로 지급되는 부분만</b> 산입한다.</td></tr>
       <tr><td><b>통상임금과의 관계</b></td><td>산정된 평균임금이 통상임금보다 <b>적으면 통상임금을 평균임금으로</b> 한다(근로기준법 제2조 제2항).</td></tr>
       </table></div>
       <div class="warn"><b>총일수와 근무일수를 혼동하면 안 된다.</b> 분모는 <b>달력상 총일수</b>다. 89일인지 92일인지에 따라 답이 달라지므로 3개월의 실제 일수를 세어야 한다.</div>`,
       mnemo:{key:"수 · 휴 · 산 · 요 / 육 · 쟁 · 병 · 승", how:"평균임금 제외기간 8 — <b>수</b>습 · 사용자귀책 <b>휴</b>업 · 출<b>산</b>전후 · <b>요</b>양 / <b>육</b>아휴직 · <b>쟁</b>의행위 · <b>병</b>역 · <b>승</b>인받은 업무외 휴업.<br>공통점 하나 — 모두 <b>근로자 탓이 아닌 저임금 기간</b>이라 빼준다."}},

      {h:"근로기준법 vs 산업재해보상보험법 — 보상 일수 대조표", freq:F(3,[43,45,47,49]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>보상</th><th>근로기준법</th><th>산업재해보상보험법</th></tr>
       <tr><td>요양</td><td>필요한 요양비 전액</td><td>요양급여(치료비 전액)</td></tr>
       <tr><td>휴업</td><td>평균임금의 <b>60%</b></td><td>평균임금의 <b>70%</b></td></tr>
       <tr><td>장해</td><td>1급 <b>1,340일</b> ~ 14급 <b>50일</b></td><td>1급 <b>1,474일</b> ~ 14급 <b>55일</b></td></tr>
       <tr><td>유족</td><td>평균임금 <b>1,000일분</b></td><td>평균임금 <b>1,300일분</b>(일시금)</td></tr>
       <tr><td>장례(장의)</td><td>평균임금 <b>90일분</b></td><td>평균임금 <b>120일분</b></td></tr>
       <tr><td>일시보상</td><td>평균임금 <b>1,340일분</b></td><td>제도 없음</td></tr>
       </table></div>
       <div class="why"><span class="h">110% 환산의 정체</span>
       위 표를 보면 산재법 일수는 근기법 일수의 <b>정확히 1.1배</b>다. 1,340×1.1=1,474, 450×1.1=495, 50×1.1=55.<br>
       그래서 문제가 <b>근기법 기준 일수</b>만 주고 산재법 기준 보상을 물으면 <b>110%를 곱해</b> 환산한다. 반대로 문제가 이미 산재법 표를 줬다면 그대로 쓴다. <b>어느 기준의 표인지 먼저 확인하는 것</b>이 요령이다.</div>
       <div class="warn"><b>선원법</b>은 또 다르다 — 기준임금이 <b>승선평균임금</b>이고, 직무상 사망 <b>1,300일</b>, <b>직무 외 사망 1,000일</b>, 장제비 <b>120일</b>, 일시보상 <b>1,474일</b>, 장해 1급 1,474일~14급 55일.</div>`},

      {h:"장해급여의 지급방식과 일시보상", freq:F(2,[45,47]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>등급</th><th>지급방식</th><th>선급</th></tr>
       <tr><td><b>제1급 ~ 제3급</b></td><td><b>연금만</b> 지급</td><td>1~4년분의 <b>2분의 1</b> 선급 가능</td></tr>
       <tr><td><b>제4급 ~ 제7급</b></td><td>일시금 또는 연금 <b>선택</b></td><td>연금 선택 시 2년분의 <b>2분의 1</b> 선급 가능</td></tr>
       <tr><td><b>제8급 ~ 제14급</b></td><td><b>일시금만</b> 지급</td><td>—</td></tr>
       </table></div>
       <div class="warn"><b>손해배상 계산에서 가장 중요한 한 줄</b> — 사용자배상책임(E.L.) 산정 시 피재자가 <b>연금으로 받고 있더라도 일시금으로 환산하여 손익상계</b>한다. 1급이면 <b>1,474일 × 평균임금</b>으로 환산하는 식이다. 연금이라고 공제를 빠뜨리면 손해액이 부풀려진다.</div>
       <p><b>일시보상</b> — 요양을 시작한 지 <b>2년</b>이 지나도 부상·질병이 완치되지 않고 폐질등급에 해당하면, 근로기준법상 평균임금 <b>1,340일분</b>의 일시보상을 하여 이후의 보상책임을 면할 수 있다. 선원법은 승선평균임금 <b>1,474일분</b>이며, 산재보험법에는 이 제도가 없다(상병보상연금이 대신한다).</p>`,
       mnemo:{key:"1~3 연금 · 4~7 선택 · 8~14 일시금", how:"중할수록 <b>연금</b>, 가벼울수록 <b>일시금</b>.<br>그리고 <b>E.L.에서는 무조건 일시금으로 환산해 공제</b> — 이 한 줄이 계산 배점을 지킨다."}}
    ],
    cards:[
      {f:"평균임금 산정식은?", b:"산정사유 발생일 이전 3개월간 임금총액 ÷ 그 기간의 총일수. 분모는 근무일수가 아니라 총일수다."},
      {f:"평균임금 산정 제외기간 5가지는?", b:"수습기간 · 사용자 귀책 휴업기간 · 출산전후휴가/육아휴직 · 업무상 요양기간 · 쟁의행위/병역 기간. (수·휴·출·요·쟁)"},

    quiz:[
      {q:"평균임금의 개념과 산정에서 제외되는 기간 및 임금에 대하여 기재하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 평균임금의 개념\n근로기준법 제2조에 따라 산정사유 발생일 이전 3개월간 그 근로자에게 지급된 임금총액을 그 기간의 총일수로 나눈 금액을 말한다. 산재보험급여와 근로기준법상 재해보상의 산정 기초가 된다.\n\nⅡ. 산정 제외기간\n1. 수습사용 중의 기간(3개월 이내)\n2. 사용자의 귀책사유로 인한 휴업기간\n3. 출산전후휴가 및 육아휴직 기간\n4. 업무상 부상 또는 질병으로 인한 요양기간\n5. 쟁의행위 기간\n6. 병역법·예비군법·민방위기본법에 따른 의무이행 기간(임금을 지급받은 경우는 제외)\n7. 업무 외 부상·질병 등으로 사용자의 승인을 받아 휴업한 기간\n※ 해당 기간과 그 기간 중에 지급된 임금을 모두 산정에서 제외한다.\n\nⅢ. 산정 제외임금\n1. 임시로 지급된 임금 및 수당\n2. 통화 외의 것으로 지급된 임금 중 법령 또는 단체협약에 근거가 없는 것\n\nⅣ. 최저보장\n산출된 평균임금이 통상임금보다 적으면 통상임금을 평균임금으로 한다.\n\nⅤ. 취지\n일시적·우연적 사정으로 평균임금이 부당하게 낮아지는 것을 방지하여 근로자의 통상적 생활수준을 반영하기 위함이다.`},
      {q:"근로기준법상 재해보상의 종류와 각각의 지급기준을 약술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 요양보상\n근로자가 업무상 부상 또는 질병에 걸리면 사용자는 그 비용으로 필요한 요양을 행하거나 필요한 요양비를 부담한다. 시행령은 진찰, 약제 또는 진료 재료의 지급, 의지 또는 그 밖의 보조기의 지급, 처치·수술 그 밖의 치료, 입원, 간병, 이송의 7항목을 정하고 있다.\n\nⅡ. 휴업보상\n요양 중에 있는 근로자에게 요양 중 평균임금의 100분의 60(산재보험 휴업급여는 100분의 70)을 지급한다. 실무와 기출에서는 약관과 문제의 전제에 따라 70%를 적용하는 경우가 많다.\n\nⅢ. 장해보상\n치유 후 신체에 장해가 남은 경우 장해등급에 따른 일수에 평균임금을 곱하여 지급한다. 장해가 둘 이상이면 등급 조정 규정을 적용한다.\n\nⅣ. 유족보상\n근로자가 업무상 사망한 경우 유족에게 평균임금 1,000일분을 지급한다.\n\nⅤ. 장례비\n장례를 지낸 자에게 평균임금 90일분을 지급한다.\n\nⅥ. 유의사항\n문제에서 제시된 일수가 근로기준법 기준인지 산재보험법 기준인지 확인하여야 하며, 근로기준법 기준 일수는 110%를 곱하여 산재보험법 기준으로 환산한다.`},
      {q:"장해등급이 둘 이상인 경우의 조정 규정을 설명하고, 제8급 이상 장해가 2개인 경우의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 조정의 필요성\n장해가 둘 이상 남은 경우 각 등급을 단순히 합산하면 실제 노동능력 상실 정도를 초과하게 되므로, 중한 등급을 기준으로 일정 등급을 상향하는 방식으로 조정한다.\n\nⅡ. 조정 규정\n1. 제13급 이상의 장해가 둘 이상 있는 경우 — 중한 장해등급을 1개 등급 상향\n2. 제8급 이상의 장해가 둘 이상 있는 경우 — 중한 장해등급을 2개 등급 상향\n3. 제5급 이상의 장해가 둘 이상 있는 경우 — 중한 장해등급을 3개 등급 상향\n4. 조정된 등급이 제1급을 초과하는 경우 제1급으로 한다.\n\nⅢ. 제8급 이상 장해가 2개인 경우\n중한 등급에서 2개 등급을 상향한다. 예컨대 중한 등급이 제2급이면 2등급을 올려 제1급이 되고, 제1급의 장해보상일시금인 1,474일분에 평균임금을 곱하여 산정한다.\n\nⅣ. 유의사항\n1. 조정 대상이 아닌 경우(예: 8급과 14급)에는 중한 등급 그대로 적용한다.\n2. 기왕장애가 있는 경우 이번 사고로 악화된 부분만 인정한다.\n\nⅤ. 결론\n등급 조정은 계산의 출발점이므로 조정 여부를 먼저 판단하여야 한다.`},
      {q:"복합장해율(노동능력상실률)의 산정방법을 설명하고, 우측 상하지 강직성 부전편마비 50%와 기질성 인격장해 20%인 경우를 계산하시오. (5점)", pts:5, lik:3,
       a:`Ⅰ. 산정방법\n장해가 둘 이상인 경우 단순 합산하면 실제 상실 정도를 초과하므로, 잔존 노동능력에 대하여만 다음 장해율을 적용한다.\n복합장해율 = A + (100 − A) × B (A는 높은 장해율, B는 낮은 장해율)\n\nⅡ. 계산\n① 우측 상하지 강직성 부전편마비 : 50%\n② 기질성 인격장해 : 20%\n③ 복합장해율 = 50% + (100 − 50) × 20% = 50% + 10% = 60%\n\nⅢ. 유의사항\n장해가 셋 이상이면 높은 것부터 순차적으로 같은 방법을 반복하며, 결과가 100%를 초과할 수 없다.`},
      {q:"업무상 재해로 요양 중인 근로자에게 지급할 요양보상금과 휴업보상금을 산정하는 방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 요양보상금\n1. 지급기준 — 근로자가 업무상 부상 또는 질병에 걸리면 사용자는 그 비용으로 필요한 요양을 행하거나 필요한 요양비를 부담한다. 간병비를 포함한다.\n2. 구성 — 요양치료비, 간병비, 이송비\n3. 이송비 — 국외에서 국내로 이송하는 경우 약관이 정한 한도(예: 500만원) 내에서 인정하며, 호송인 비용은 인정하지 않는다.\n4. 산정 — 각 항목의 실제 발생액을 합산한다.\n\nⅡ. 휴업보상금\n1. 지급기준 — 요양 중에 있는 근로자에게 요양 중 평균임금의 일정 비율(산재보험 휴업급여는 100분의 70)을 지급한다.\n2. 산정 — 요양 일수 × 평균임금 × 지급률\n3. 평균임금 — 산정사유 발생일 이전 3개월간 임금총액 ÷ 그 기간의 총일수\n\nⅢ. 유의사항\n1. 기왕증이 있더라도 이를 이유로 요양보상을 공제할 수 없다는 것이 판례의 태도이다.\n2. 요양기간은 평균임금 산정에서 제외되는 기간이므로 평균임금 산정 시 주의하여야 한다.`},
      {q:"근로기준법상 재해보상과 산업재해보상보험법상 보험급여의 관계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 근로기준법상 재해보상\n사용자가 업무상 재해를 입은 근로자에게 과실 유무를 묻지 않고 부담하는 법정 보상책임으로, 요양·휴업·장해·유족보상과 장례비가 있다.\n\nⅡ. 산업재해보상보험법상 보험급여\n국가가 운영하는 사회보험으로 요양급여, 휴업급여, 장해급여, 유족급여, 간병급여, 상병보상연금, 장례비 등을 지급한다.\n\nⅢ. 양자의 관계\n1. 면책 — 산재보험급여가 지급되면 사용자는 그 범위에서 근로기준법상 재해보상 책임을 면한다.\n2. 급여수준 — 산재보험 급여가 근로기준법상 재해보상보다 대체로 유리하므로, 근로기준법상 재해보상은 산재보험 미적용 사업장 등에서 기능한다.\n3. 일수의 차이 — 근로기준법 기준 일수에 110%를 곱하면 산재보험법 기준 일수가 된다.\n\nⅣ. 근재보험에서의 의의\n재해보상책임 특별약관은 근로기준법상 재해보상 의무를 담보하므로, 산재보험 적용 여부에 따라 이 특약의 실익이 달라진다.\n\nⅤ. 결론\n사례에서는 산재보험 적용 여부를 먼저 확인하고, 제시된 일수의 법적 근거를 확인하여야 한다.`},
      {q:"평균임금 산정 시 '총일수'와 '근무일수'를 혼동하면 안 되는 이유를 설명하고, 실무상 확인사항을 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 산정식\n평균임금 = 산정사유 발생일 이전 3개월간 임금총액 ÷ 그 기간의 총일수\n\nⅡ. 총일수와 근무일수의 차이\n1. 총일수는 달력상의 날 수로서 3개월이면 통상 89일에서 92일이 된다.\n2. 근무일수는 실제 근로를 제공한 날로서 주휴일과 휴무일이 제외되므로 총일수보다 훨씬 적다.\n3. 근무일수로 나누면 평균임금이 과대 산정되어 모든 후속 계산이 잘못된다.\n\nⅢ. 혼동하면 안 되는 이유\n평균임금은 근로자의 통상적 생활수준을 반영하기 위한 개념이므로, 실제 근로 여부와 무관하게 달력상의 기간을 기준으로 한다. 반면 통상임금은 소정근로에 대한 대가이므로 산정 기준이 다르다.\n\nⅣ. 실무상 확인사항\n1. 산정사유 발생일의 특정 — 사고일 또는 진단 확정일\n2. 3개월 기간에 제외기간이 포함되어 있는지\n3. 임금총액에 제외임금이 포함되어 있는지\n4. 산출된 평균임금이 통상임금보다 적은지(적으면 통상임금 적용)\n5. 일용근로자 등 특수한 경우의 별도 산정방법 적용 여부`},
      {q:"근재보험 계산에서 장해보상금을 산정할 때 확인하여야 할 사항을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 장해등급의 확정\n1. 치유 후 증상이 고정된 시점에 판정한다.\n2. 장해가 둘 이상이면 조정 규정(13급 이상 1등급, 8급 이상 2등급, 5급 이상 3등급 상향)을 적용하고 1급을 상한으로 한다.\n3. 조정 대상이 아닌 조합(예: 8급과 14급)은 중한 등급을 그대로 적용한다.\n\nⅡ. 일수의 확인\n1. 제시된 일수표가 근로기준법 기준인지 산재보험법 기준인지 확인한다.\n2. 근로기준법 기준이면 110%를 곱하여 산재보험법 기준으로 환산한다.\n\nⅢ. 평균임금의 확인\n제외기간과 제외임금을 반영하여 정확히 산정하였는지 확인한다.\n\nⅣ. 기왕장애의 처리\n1. 이번 사고로 악화된 부분만 인정한다.\n2. 다만 기왕증을 이유로 요양보상을 공제할 수는 없다.\n\nⅤ. 산정\n장해보상금 = 조정된 등급의 일수 × 평균임금\n\nⅥ. 결론\n등급 조정과 일수 환산 두 가지가 이 항목의 핵심 함정이다.`},
      {q:"업무상 재해로 사망한 근로자의 유족에게 지급할 유족보상과 장례비의 산정방법 및 수급권자를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 유족보상\n1. 산정 — 평균임금의 1,000일분\n2. 성격 — 사용자의 무과실 법정보상책임\n3. 산재보험 — 유족급여는 연금 또는 일시금으로 지급되며, 일시금은 평균임금의 1,300일분이다.\n\nⅡ. 장례비\n1. 산정 — 평균임금의 90일분\n2. 수급자 — 장례를 지낸 자\n\nⅢ. 수급권자의 범위와 순위\n1. 근로기준법 시행령은 유족보상의 수급권자를 배우자(사실혼 포함), 자녀, 부모, 손자녀, 조부모의 순으로 정하고, 근로자 사망 당시 그에 의하여 부양되고 있던 자를 우선한다.\n2. 같은 순위자가 여럿이면 균분한다.\n3. 선원법이 적용되는 경우에는 선원법이 정한 수급권자와 순위에 따른다.\n\nⅣ. 손해배상과의 관계\n유족보상은 민법상 손해배상과 성질이 같은 부분에서 손익상계의 대상이 되며, 위자료에서는 공제하지 않는다. 사망사고에서는 상속 후 공제 방식이 적용된다.\n\nⅤ. 결론\n수급권자의 확정과 상속인의 확정은 별개이므로, 유족보상의 배분과 손해배상금의 상속을 구분하여 처리하여야 한다.`},
      {q:"근재보험 계산문제에서 자주 발생하는 오류 다섯 가지를 지적하고 올바른 처리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 평균임금의 분모를 근무일수로 계산하는 오류\n분모는 그 기간의 총일수이다. 근무일수로 나누면 평균임금이 과대 산정된다.\n\nⅡ. 장해등급 조정을 누락하는 오류\n8급 이상 장해가 둘 이상이면 2등급을 상향하여야 한다. 조정을 누락하면 보상일수가 크게 달라진다.\n\nⅢ. 일수의 법적 근거를 확인하지 않는 오류\n문제에서 제시된 일수가 근로기준법 기준이면 110%를 곱하여 산재보험법 기준으로 환산하여야 한다.\n\nⅣ. 복합장해율을 단순 합산하는 오류\nA + (100 − A) × B로 계산하여야 하며 단순 합산하면 과대 산정된다.\n\nⅤ. 공제·상계의 순서를 혼동하는 오류\n기왕증 공제 → 과실상계 → 손익상계의 순서를 지킨다. 다만 산재보험급여는 판례에 따라 공제 후 과실상계로 처리한다.\n\nⅥ. 그 밖에\n자기부담금 공제와 보상한도액 적용을 빠뜨리거나, 중복보험에서 독립책임액 안분을 누락하는 경우가 많다.`},

      {q:"평균임금의 산정에서 제외되는 기간과 임금에 대하여 기재하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 평균임금의 의의\n산정하여야 할 사유가 발생한 날 이전 3개월 동안에 그 근로자에게 지급된 임금의 총액을 그 기간의 총일수로 나눈 금액을 말한다. 사유 발생일 당일은 산정기간에 포함하지 아니한다.\n\nⅡ. 제외되는 기간과 그 기간에 지급된 임금\n근로기준법 시행령 제2조는 다음 기간과 그 기간에 지급된 임금을 산정기간과 임금총액에서 각각 제외하도록 한다.\n1. 수습 사용 중인 기간\n2. 사용자의 귀책사유로 휴업한 기간\n3. 출산전후휴가 기간\n4. 업무상 부상 또는 질병으로 요양하기 위하여 휴업한 기간\n5. 육아휴직 기간\n6. 적법한 쟁의행위 기간\n7. 병역법·예비군법·민방위기본법에 따른 의무 이행 기간. 다만 그 기간 중 임금을 지급받은 경우에는 제외하지 아니한다.\n8. 사용자의 승인을 받아 업무 외의 부상이나 질병 등으로 휴업한 기간\n\nⅢ. 취지\n위 기간은 근로자의 귀책에 의하지 아니하고 임금이 감소하는 기간이므로, 이를 그대로 산입하면 평균임금이 부당하게 낮아져 보상액이 감소한다.\n\nⅣ. 임금총액에서 제외되는 임금\n임시로 지급된 임금과 실비변상적 금품은 임금총액에 산입하지 아니한다. 상여금과 연차수당은 연간 지급액을 기준으로 3개월분에 해당하는 금액을 산입하며, 가족수당은 가족 수와 무관하게 일률적으로 지급되는 부분만 산입한다.\n\nⅤ. 최저 보장\n산정된 평균임금이 통상임금보다 적은 경우에는 통상임금을 평균임금으로 한다.\n\nⅥ. 결론\n평균임금은 모든 재해보상의 기초가 되므로 제외기간과 산입임금의 판단을 정확히 하여야 하며, 분모는 근무일수가 아니라 달력상 총일수임에 유의하여야 한다.`},
      {q:"근로기준법상 재해보상과 산업재해보상보험법상 보험급여의 기준을 비교하고, 일수 환산방법을 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 비교\n1. 휴업 — 근로기준법은 평균임금의 100분의 60, 산업재해보상보험법은 100분의 70\n2. 장해 — 근로기준법은 제1급 1,340일분부터 제14급 50일분까지, 산업재해보상보험법은 제1급 1,474일분부터 제14급 55일분까지\n3. 유족 — 근로기준법 1,000일분, 산업재해보상보험법 1,300일분\n4. 장례 — 근로기준법 90일분, 산업재해보상보험법 120일분\n5. 일시보상 — 근로기준법 1,340일분, 산업재해보상보험법에는 제도가 없고 상병보상연금이 이를 대신한다.\n\nⅡ. 일수의 환산\n산업재해보상보험법의 일수는 근로기준법 일수의 100분의 110에 해당한다. 따라서 문제가 근로기준법 기준 일수만 제시하고 산업재해보상보험법 기준의 보상을 요구하는 경우에는 제시된 일수에 110퍼센트를 곱하여 환산한다.\n\nⅢ. 주의사항\n1. 문제에 제시된 일수표가 어느 법의 기준인지를 먼저 확인하여야 한다.\n2. 이미 산업재해보상보험법 기준으로 제시되었다면 환산하지 아니한다.\n3. 선원법은 승선평균임금을 기준으로 하며 일수 체계가 또 다르므로 별도로 적용한다.\n\nⅣ. 결론\n기준의 혼동은 계산 전체를 무너뜨리므로, 답안 첫머리에 적용 기준을 명시하고 시작하여야 한다.`},
      {q:"장해급여의 지급방식을 등급별로 설명하고, 손해배상액 산정 시의 처리를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 등급별 지급방식\n1. 제1급부터 제3급까지는 장해보상연금으로만 지급하며, 1년분부터 4년분까지의 2분의 1을 선급할 수 있다.\n2. 제4급부터 제7급까지는 장해보상일시금과 장해보상연금 중에서 선택할 수 있으며, 연금을 선택한 경우 2년분의 2분의 1을 선급할 수 있다.\n3. 제8급부터 제14급까지는 장해보상일시금으로만 지급한다.\n\nⅡ. 손해배상액 산정에서의 처리\n1. 사용자배상책임을 산정할 때에는 피재자가 연금으로 수령하고 있더라도 일시금으로 환산하여 손익상계한다.\n2. 예컨대 제1급이라면 평균임금에 1,474일을 곱한 금액을 공제한다.\n3. 공제는 항목별로 대응시켜야 하므로 장해급여는 치료종결 이후의 일실수익에서 공제한다.\n\nⅢ. 유의사항\n1. 현실적으로 아직 수령하지 아니하였더라도 장래에 지급이 예정된 금원은 공제 대상이 된다.\n2. 위자료에서는 공제하지 아니한다.\n\nⅣ. 결론\n연금 형태의 급여를 공제에서 빠뜨리면 손해액이 과다 산정되므로, 반드시 일시금으로 환산하여 대응 항목에서 공제하여야 한다.`}

      {h:"이 과목은 계산이 절반이다",
       body:`<div class="why"><span class="h">여기가 합격을 가른다</span>
       9개년 전 회차에서 <b>"산출과정을 기재하시오"</b> 유형이 빠진 적이 없다. 배점으로는 매년 <b>30~60점</b>이다. 답만 쓰면 대부분의 배점을 잃으므로 <b>산식과 단계를 반드시 남긴다.</b></div>
       <div class="tmpl"><b>[근재 계산 5단계]</b>
① <b>법률상 배상책임</b>   민법 조문 특정, 안전배려의무 검토
② <b>약관상 보상책임</b>   가입 특약 확인, 면책 검토
③ <b>손해배상금</b>      적극·소극손해·위자료 항목별 산정
④ <b>공제·상계</b>       기왕증 → 과실상계 → 손익상계(산재급여)
⑤ <b>지급보험금</b>      자기부담금 공제 → 보상한도 → 중복보험 안분</div>`,
       mnemo:{key:"법 · 약 · 손 · 공 · 지", how:"다섯 글자를 문제지 여백에 세로로 적고 시작하라.<br>배점이 잘게 쪼개져 있으므로 <b>각 소문항이 몇 단계를 묻는지</b> 먼저 구분하는 것이 시간관리의 핵심이다."}},

      {h:"계산에 쓰는 공식 모음",
       body:`<div class="scroller"><table class="mini">
       <tr><th colspan="2">기초</th></tr>
       <tr><td>평균임금</td><td>3개월 임금총액 ÷ 그 기간의 <b>총일수</b></td></tr>
       <tr><td>복합장해율</td><td>A + (100 − A) × B</td></tr>
       </table></div>
       <div class="scroller"><table class="mini">
       <tr><th colspan="2">근로기준법상 재해보상</th></tr>
       <tr><td>요양보상</td><td>치료비 + 간병비 + 이송비(국외→국내 500만 한도, 호송인 제외)</td></tr>
       <tr><td>휴업보상</td><td>요양일수 × 평균임금 × <b>70%</b></td></tr>
       <tr><td>장해보상</td><td>조정등급 일수 × 평균임금 (근기법 일수면 <b>×110%</b>)</td></tr>
       <tr><td>유족보상 / 장례비</td><td>평균임금 <b>1,000일분</b> / <b>90일분</b></td></tr>
       <tr><td>간병보상</td><td>기간 × 고시 일당 (수시간병은 상시의 <b>2/3</b>)</td></tr>
       </table></div>
       <div class="scroller"><table class="mini">
       <tr><th colspan="2">민법상 손해배상</th></tr>
       <tr><td>일실수익(장해)</td><td>월소득 × 노동능력상실률 × 호프만계수 × (1 − 과실률)</td></tr>
       <tr><td>정년 이후</td><td>(일용노임 × 일수) × 상실률 × 잔여계수 × (1 − 과실률)</td></tr>
       <tr><td>일실수익(사망)</td><td>월소득 × 호프만계수 × <b>(1 − 1/3 생계비)</b> × (1 − 과실률)</td></tr>
       <tr><td>일실퇴직금</td><td>[정년시 예상퇴직금 현가 − 기수령 퇴직금] × 상실률 × (1 − 과실률)<br>현가화 = 예상퇴직금 × 1/(1 + 0.05 × 잔여연수)</td></tr>
       <tr><td>개호비</td><td>(일용노임 × 일수) × 개호인 수 × 호프만계수 × (1 − 과실률)</td></tr>
       <tr><td>위자료</td><td>기준금액 × [1 − (과실률 × <b>6/10</b>)] ※ 실무례</td></tr>
       </table></div>
       <div class="scroller"><table class="mini">
       <tr><th colspan="2">지급보험금</th></tr>
       <tr><td>독립책임액</td><td>min(손해배상금 − 자기부담금, 보상한도액)</td></tr>
       <tr><td>중복보험 안분</td><td>손해액 × (각 독립책임액 ÷ 독립책임액 합계)<br>※ 독립책임액 합계가 손해액을 <b>초과할 때만</b> 안분</td></tr>
       </table></div>
       <div class="warn">계수·단가·한도는 문제에서 제시되는 경우가 대부분이다. <b>제시된 값을 그대로</b> 쓰고, 제시되지 않은 것만 위 기준을 적용하라.</div>`},

      {h:"손익상계의 항목별 대응 — 아무 데서나 빼면 안 된다", freq:F(3,[45,47,49]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>공제하는 급여</th><th>공제 대상 손해항목</th></tr>
       <tr><td>요양급여</td><td>치료비(적극손해)</td></tr>
       <tr><td>휴업급여</td><td><b>요양기간</b>의 일실수익</td></tr>
       <tr><td>장해급여 · 유족급여</td><td><b>치료종결 이후</b>의 일실수익</td></tr>
       <tr><td>간병급여</td><td>개호비</td></tr>
       <tr><td>—</td><td><b>위자료에서는 공제하지 않는다</b></td></tr>
       </table></div>
       <div class="warn"><b>대응 항목이 음수가 되면 그 항목은 0원</b>으로 처리하고, 남는 급여를 다른 항목으로 넘기지 않는다. 이것이 항목별 대응의 핵심이다.</div>
       <p><b>과실상계와의 순서</b></p>
       <ul><li>원칙 — 기왕증 공제 → 과실상계 → 손익상계</li>
       <li>예외 — <b>제3자의 과실이 경합</b>하는 산재 사안에서는 판례가 <b>공제 후 과실상계</b>를 인정한다. 어느 쪽을 쓰든 <b>답안에 근거를 밝힌다</b>.</li></ul>
       <p><b>사망 사안의 상속 후 공제</b></p>
       <ul><li>일실수익 등 손해배상채권을 먼저 <b>상속분대로 분배</b>(배우자 1.5 : 직계비속 1.0)한 뒤, 각 상속인의 몫에서 <b>그 사람이 실제로 받은 급여만</b> 공제한다.</li>
       <li>산재 유족급여는 생계를 같이한 유족에게 집중 지급되므로, 급여를 받지 못한 상속인의 몫에서는 공제하지 않는다.</li>
       <li><b>수급권자와 상속권자가 같으면</b> 상속 후 공제나 공제 후 상속이나 결과가 같다. 그래서 실무는 <b>"사망사고는 상속 후 공제로 풀면 틀리지 않는다"</b>고 한다.</li></ul>
       <div class="warn"><b>현실적으로 아직 받지 않았어도 장래에 받을 것이 확실한 금원은 공제</b>한다. 연금으로 받는 장해급여도 일시금으로 환산해 공제한다.</div>`,
       mnemo:{key:"요→치 · 휴→요양기간 · 장유→종결후 · 간→개호 · 위자료는 건드리지 않는다", how:"손익상계는 <b>같은 성질끼리</b>만 만난다. 다섯 줄을 표로 외우고, 마지막 줄 <b>위자료 불공제</b>를 반드시 답안에 쓴다."}}
    ],
    calcs:[
      {id:"lc1", title:"42회형 — 복합장해율·일실수익·일실퇴직금·개호비 종합", freq:F(3,[42]),
       setup:`<b>사례 (제42회 기출)</b><ul>
       <li>월소득 300만원, 사고 당시 6년 근무, <b>정년 60세</b></li>
       <li>장해 ① 우측 상하지 강직성 부전편마비 50% ② 기질성 인격장해 20%</li>
       <li>피해자 과실 <b>30%</b></li>
       <li>호프만계수 — 치료종결~정년 <b>30</b>, 정년~가동기간 종료 <b>50</b>(=100−50), 개호 <b>160</b>(=180−20)</li>
       <li>일용노임 90,000원(월 30일 기준), 개호인 1인(8시간)</li>
       <li>보상한도 1인당 <b>2억원</b></li></ul>
       <b>물음</b> — 복합장해율·일실수익·일실퇴직금·개호비·지급보험금을 각각 산출하시오.`,
       steps:[
        {t:"① 복합장해율", b:`단순 합산이 아니라 잔존 능력에만 적용한다.\n50% + (100 − 50) × 20% = <span class="num">60%</span>`},
        {t:"② 일실수익 — 치료종결 ~ 정년", b:`3,000,000원 × 60%(상실률) × 30(계수) × (1 − 30%)\n= <span class="num">37,800,000원</span>`},
        {t:"③ 일실수익 — 정년 이후 ~ 가동기간 종료", b:`정년 이후에는 일용노임을 기준으로 한다.\n(90,000원 × 30일) × 60% × 50(계수) × (1 − 30%)\n= <span class="num">56,700,000원</span>`},
        {t:"④ 일실수익 소계", b:`37,800,000원 + 56,700,000원 = <span class="num">94,500,000원</span>`},
        {t:"⑤ 일실퇴직금", b:`60세가 정년이므로 총 11년 근무 가능(사고 시점 6년 + 잔여 5년)\n\n㉠ 정년시 예상퇴직금 = 3,000,000원 × 11년 = 33,000,000원\n㉡ 현가화 = 33,000,000원 × 1/(1 + 0.05 × 5년) = <span class="num">26,400,000원</span>\n㉢ 기수령 퇴직금 = 3,000,000원 × 6년 = 18,000,000원\n㉣ 일실퇴직금 = (26,400,000 − 18,000,000) × 60% × (1 − 30%)\n = <span class="num">3,528,000원</span>\n\n※ 사망이 아니라 장해로 퇴직한 것이므로 <b>장해율만큼</b> 산정한다.`},
        {t:"⑥ 개호비", b:`(90,000원 × 30일) × 1인(8시간) × 160(계수) × (1 − 30%)\n= <span class="num">302,400,000원</span>`},
        {t:"⑦ 지급보험금", b:`94,500,000원(일실수익) + 3,528,000원(일실퇴직금) + 302,400,000원(개호비)\n= 400,428,000원\n\n1인당 보상한도 2억원을 초과하므로\n→ 지급보험금 <span class="num">200,000,000원</span>`}
       ],
       final:`복합장해율 60% · 일실수익 94,500,000원 · 일실퇴직금 3,528,000원 · 개호비 302,400,000원\n합계 400,428,000원 → 보상한도 적용하여 지급보험금 2억원`,
       trap:`<b>자주 틀리는 곳</b>\n① <b>복합장해율을 단순 합산</b>(50+20=70)하면 틀린다. A + (100−A)×B로 계산해야 60%다.\n② <b>정년 전후를 나누지 않는 것</b> — 정년까지는 월소득, 정년 이후는 일용노임 기준이다.\n③ <b>일실퇴직금에 상실률을 곱하지 않는 것</b> — 사망이 아니라 장해이므로 장해율만큼만 인정한다. 현가화 공식도 반드시 쓴다.\n④ <b>보상한도 적용을 빠뜨리는 것</b> — 합계가 4억이어도 한도가 2억이면 2억이다.`},

      {id:"lc2", title:"49회형 — 재해보상 4종 산출", freq:F(3,[43,49]),
       setup:`<b>사례 (제49회 기출)</b><ul>
       <li>평균임금 <b>100,000원</b>, 요양기간 <b>300일</b></li>
       <li>요양치료비 36,000,000원 / 간병비 9,000,000원 / 이송비 4,000,000원(호송인 비용 별도 발생)</li>
       <li>장해 — <b>제8급 이상 장해가 2개</b>, 최상위 등급 제2급</li>
       <li>제1급 장해보상일시금 <b>1,474일분</b></li>
       <li>간병보상 — 수시간병 대상, 고시 일당 30,000원, 기대여명 100일</li></ul>
       <b>물음</b> — 보상항목별 지급기준과 함께 지급보험금을 산출하시오.`,
       steps:[
        {t:"① 요양보상금", b:`지급기준 — 업무상 부상·질병 시 필요한 요양을 행하거나 요양비를 부담(간병비 포함). 국외→국내 이송 시 이송비는 500만원 한도.\n\n치료비 36,000,000원 + 간병비 9,000,000원 + 이송비 4,000,000원\n= <span class="num">49,000,000원</span>\n\n※ <b>호송인 비용은 제외</b>한다.`},
        {t:"② 휴업보상금", b:`지급기준 — 요양 중에 있는 근로자에게 요양 중 평균임금의 100분의 70을 지급\n\n300일 × 100,000원 × 70% = <span class="num">21,000,000원</span>`},
        {t:"③ 장해보상금 — 등급 조정", b:`제8급 이상 장해가 2개이므로 <b>중한 등급에서 2등급 상향</b>한다.\n최상위 제2급 → 2등급 상향 → <b>제1급</b> (1급 한도 적용)\n\n1,474일 × 100,000원 = <span class="num">147,400,000원</span>`},
        {t:"④ 간병보상금", b:`지급기준 — 수시간병(신경계통의 뚜렷한 장애가 남아 수시간호가 필요한 상태) 대상, 고시 기준 일당을 기대여명 기간 동안 지급\n\n100일 × 30,000원 = <span class="num">3,000,000원</span>`},
        {t:"⑤ 지급보험금", b:`49,000,000원(요양) + 21,000,000원(휴업) + 147,400,000원(장해) + 3,000,000원(간병)\n= <span class="num">220,400,000원</span>`}
       ],
       final:`요양 49,000,000 + 휴업 21,000,000 + 장해 147,400,000 + 간병 3,000,000 = 220,400,000원`,
       trap:`<b>이 문제의 채점 포인트</b>\n문제가 <b>"보상항목별 지급기준과 함께 기재하라"</b>고 요구했다. 산식과 총액만 쓰면 <b>감점된다.</b> 각 항목마다 지급기준 한 줄을 반드시 붙여라.\n\n<b>함정 세 개</b>\n① <b>호송인 비용 제외</b> — 이송비에 포함시키면 틀린다.\n② <b>장해등급 조정</b> — 8급 이상 2개면 2등급 상향. 조정 없이 2급으로 계산하면 틀린다.\n③ <b>근기법 일수인지 확인</b> — 제시된 일수가 근로기준법 기준이면 110%를 곱해 산재법 기준으로 환산해야 한다.`},

      {id:"lc3", title:"42회형 — 사망 손해배상액과 중복보험 안분", freq:F(3,[42,45,48]),
       setup:`<b>사례 (제42회 기출)</b><ul>

       <li>정년 이후 일용노임 90,000원 × 22일</li>

       steps:[
        {t:"① 치료비", b:`문제에서 별도 발생 치료비 언급이 없으므로 <span class="num">0원</span>`},
        {t:"② 일실수익 — 사고일 ~ 정년", b:`사망이므로 생계비 1/3을 공제한다.\n3,000,000원 × 100% × 40(계수) × (1 − 1/3) × (1 − 20%)\n= <span class="num">64,000,000원</span>`},
        {t:"③ 일실수익 — 정년 ~ 가동기간 종료", b:`(90,000원 × 22일) × 100% × 50(계수) × 2/3 × 80%\n= <span class="num">52,800,000원</span>`},
        {t:"④ 일실수익 소계", b:`64,000,000원 + 52,800,000원 = <span class="num">116,800,000원</span>`},
        {t:"⑤ 장례비", b:`4,000,000원 × (1 − 20%) = <span class="num">3,200,000원</span>`},
        {t:"⑥ 위자료", b:`위자료는 과실비율을 전부 반영하지 않고 <b>6/10만</b> 참작하는 실무례에 따른다.\n100,000,000원 × 100% × [1 − (20% × 6/10)]\n= 100,000,000원 × 0.88 = <span class="num">88,000,000원</span>`},
        {t:"⑦ 손해배상책임액 합계", b:`116,800,000원 + 3,200,000원 + 88,000,000원 = <span class="num">208,000,000원</span>`},
        {t:"⑧ A보험사 독립책임액", b:`손해배상금 − 자기부담금 = 208,000,000 − 10,000,000 = 198,000,000원\n보상한도 − 자기부담금 = 100,000,000 − 10,000,000 = 90,000,000원\n작은 쪽을 취한다 → <span class="num">90,000,000원</span>`},
        {t:"⑨ B보험사 독립책임액", b:`손해배상금 − 자기부담금 = 208,000,000 − 0 = 208,000,000원\n보상한도 = 150,000,000원\n작은 쪽을 취한다 → <span class="num">150,000,000원</span>`},
        {t:"⑩ 안분", b:`독립책임액 합계 = 90,000,000 + 150,000,000 = 240,000,000원\n240,000,000원 > 손해액 208,000,000원 이므로 <b>안분한다.</b>\n\nA = 208,000,000 × (0.9억 / 2.4억) = <span class="num">78,000,000원</span>\nB = 208,000,000 × (1.5억 / 2.4억) = <span class="num">130,000,000원</span>`}
       ],
       final:`법률상 손해배상책임액 208,000,000원\nA보험사 78,000,000원 · B보험사 130,000,000원`,
       trap:`<b>자주 틀리는 곳</b>\n① <b>위자료에 과실률을 그대로 곱하는 것</b> — 실무례는 과실비율의 6/10만 참작한다. 문제에 별도 지시가 없으면 이 방식을 밝히고 쓴다.\n② <b>독립책임액에서 자기부담금을 빼지 않는 것</b> — 손해배상금과 보상한도 모두에서 자기부담금을 고려한다.\n③ <b>독립책임액 합계가 손해액보다 작으면 안분하지 않는다</b> — 그때는 각자의 독립책임액을 그대로 지급한다.\n④ 사망 일실수익의 <b>생계비 1/3 공제</b>를 빠뜨리지 않는다.`},

      {id:"lc4", title:"49회형 — 기왕증·과실상계·손익상계 순서", freq:F(3,[49]),
       setup:`<b>사례 (제49회 기출)</b><ul>
       <li>피해자 A의 총 손해액 <b>1억원</b></li>
       <li>기왕증 기여도 <b>20%</b></li>
       <li>피해자 A의 과실비율 <b>30%</b></li>
       <li>피해자가 수령한 타 보험금(손익상계 대상) <b>2,000만원</b></li></ul>
       <b>물음</b> — A가 최종적으로 청구할 수 있는 손해배상금을 산출하시오.`,
       steps:[
        {t:"① 적용 순서의 확인", b:`대법원 판례상 순서는\n<b>기왕증(기여도) 공제 → 과실상계 → 손익상계</b>\n\n이유 — 순수하게 이번 사고로 인한 손해액을 확정하고(기왕증), 그 손해액에 피해자의 과실을 반영하며(과실상계), 마지막으로 남은 배상액에서 이득을 공제(손익상계)하여야 형평에 부합한다.`},
        {t:"② 기왕증 공제", b:`100,000,000원 × (1 − 0.2) = <span class="num">80,000,000원</span>`},
        {t:"③ 과실상계", b:`80,000,000원 × (1 − 0.3) = <span class="num">56,000,000원</span>`},
        {t:"④ 손익상계", b:`56,000,000원 − 20,000,000원 = <span class="num">36,000,000원</span>`}
       ],
       final:`피해자 A가 최종적으로 청구할 수 있는 손해배상금 36,000,000원`,
       trap:`<b>순서를 바꾸면 금액이 달라진다</b>\n· 올바른 순서(기왕증 → 과실 → 손익) : <b>3,600만원</b>\n· 손익을 먼저 빼면 : (1억 − 2,000만) × 0.8 × 0.7 = 4,480만원\n· 과실을 먼저 하면 : (1억 × 0.7) × 0.8 − 2,000만 = 3,600만원 (우연히 같으나 항상 같지는 않다)\n\n<b>산재보험급여는 예외</b> — 판례는 재해근로자 보호를 위해 <b>공제 후 과실상계</b>를 채택한다. 사망사고라면 그 앞에 <b>상속 후 공제</b>가 붙는다. 답안에는 원칙과 예외를 <b>모두</b> 밝혀라.`},

      {id:"lc5", title:"43회형 — 근로기준법 일수의 산재법 환산", freq:F(2,[43]),
       setup:`<b>사례 (제43회 기출 변형)</b><ul>
       <li>10일간 임금 총액 2,000,000원 → 평균임금 산정</li>
       <li>요양기간 200일</li>
       <li>장해등급 <b>제8급과 제14급</b></li>
       <li>제시된 장해보상일시금 <b>450일분</b> — 단, 이 일수는 <b>근로기준법 기준</b></li></ul>
       <b>물음</b> — 휴업보상과 장해보상을 산출하시오.`,
       steps:[
        {t:"① 평균임금", b:`2,000,000원 ÷ 10일 = <span class="num">200,000원</span>\n※ 실제 시험에서는 3개월 임금총액 ÷ 총일수로 산정한다. 문제에서 기간과 총액을 제시하면 그대로 나눈다.`},
        {t:"② 휴업보상", b:`지급기준 — 요양 중 평균임금의 70%\n200일 × 200,000원 × 70% = <span class="num">28,000,000원</span>`},
        {t:"③ 장해등급 조정 여부", b:`제8급과 제14급이다.\n조정 규정은 <b>8급 이상 장해가 2개 이상</b>일 때 적용되는데, 14급은 8급 이상이 아니다.\n→ <b>조정 대상이 아니므로</b> 제8급을 그대로 적용한다.`},
        {t:"④ 근기법 일수 → 산재법 일수 환산", b:`주어진 450일분은 <b>근로기준법 기준</b>이므로 <b>110%</b>를 곱해 산재보험법 기준으로 환산한다.\n450일 × 110% = <span class="num">495일</span>`},
        {t:"⑤ 장해보상", b:`495일 × 200,000원 = <span class="num">99,000,000원</span>`},
        {t:"⑥ 기왕증의 처리", b:`장해급수 판정 시 기왕증 기여도 공제에 관한 기준은 없다.\n대법원 판례에 따르면 기왕증이 존재한다는 이유로 <b>요양보상을 공제할 수 없다.</b>`}
       ],
       final:`휴업보상 28,000,000원 · 장해보상 99,000,000원(495일 × 200,000원)`,
       trap:`<b>이 문제가 노린 함정</b>\n① <b>근기법 일수를 그대로 쓰는 것</b> — 450일 × 200,000 = 9,000만원으로 계산하면 틀린다. <b>110%를 곱해 495일</b>로 환산해야 9,900만원이다. 43회 해설이 "출제위원이라면 한번쯤 함정으로 낼 부분"이라고 명시했다.\n② <b>등급 조정을 잘못 적용하는 것</b> — 8급과 14급은 조정 대상이 아니다. 8급 이상이 <b>2개 이상</b>이어야 상향한다.\n③ <b>기왕증으로 요양보상을 깎는 것</b> — 판례상 공제할 수 없다.`},

      {id:"lc6", title:"향후치료비의 현가 — 경과년수표와 월계수 차액", freq:F(2,[46,47]),
       setup:`<b>사례</b><ul>
       <li>치아 보철 <b>500,000원</b>을 <b>매년 1회씩 5년간</b> 지출 예정. 경과년수 계수 1 / 0.6666 / 0.5 / 0.4 / 0.3334</li>
       <li>내고정물 제거술 <b>2,000,000원</b>을 <b>3년 후 1회</b> 지출 예정. 월계수 19.6(현재), 20.5(3년 후)</li>
       <li>성형수술 <b>5,000,000원</b>을 <b>일정 시점 1회</b> 지출 예정. 월계수 52.6 → 53.4</li>
       <li>피해자 과실 <b>20%</b></li></ul>`,
       steps:[
       {t:"① 반복 지출의 현가 — 경과년수 계수 합산", b:"매년 지출하는 경우에는 각 연도의 경과년수 계수를 모두 더한 값을 곱한다.\n1 + 0.6666 + 0.5 + 0.4 + 0.3334 = <span class=\"num\">2.9</span>\n500,000원 × 2.9 = <span class=\"num\">1,450,000원</span>"},
       {t:"② 1회성 지출의 현가 — 월계수의 차액", b:"특정 시점에 한 번 지출하는 비용은 <b>그 시점까지의 월계수에서 직전 구간의 월계수를 뺀 차액</b>을 곱한다.\n내고정물 = 2,000,000원 × (20.5 − 19.6) = 2,000,000 × 0.9 = <span class=\"num\">1,800,000원</span>"},
       {t:"③ 같은 방법으로 성형수술", b:"5,000,000원 × (53.4 − 52.6) = 5,000,000 × 0.8 = <span class=\"num\">4,000,000원</span>"},
       {t:"④ 향후치료비 합계", b:"1,450,000 + 1,800,000 + 4,000,000 = <span class=\"num\">7,250,000원</span>"},
       {t:"⑤ 과실상계", b:"7,250,000원 × (1 − 20%) = <span class=\"num\">5,800,000원</span>"}],
       final:`향후치료비 7,250,000원 → 과실상계 후 <b>5,800,000원</b>`,
       trap:`<b>자주 틀리는 곳</b>
① <b>반복 지출에 월계수 차액을 쓰는 것</b> — 매년 반복이면 <b>경과년수 계수를 합산</b>한다.
② <b>1회성 지출에 계수를 통째로 곱하는 것</b> — 그 시점의 계수가 아니라 <b>차액</b>을 곱해야 한다.
③ <b>초회를 이미 실시했는데 계수 1을 포함시키는 것</b> — 15년 주기로 3회 남았고 초회는 이미 했다면 0.7 + 0.4 + 0.3처럼 남은 회차만 더한다.`,
       mnemo:{key:"반복은 합, 1회는 차", how:"매년 <b>반복</b>이면 경과년수 계수를 <b>합</b>산, 특정 시점 <b>1회</b>면 월계수의 <b>차</b>액."}},

      {id:"lc7", title:"여명이 단축된 경우의 일실수익 — 2구간으로 나눈다", freq:F(2,[46,48]),
       setup:`<b>사례</b><ul>
       <li>월소득 <b>3,000,000원</b>, 노동능력상실률 <b>80%</b></li>
       <li>사고로 여명이 단축되어 <b>여명까지 계수 100</b>, <b>여명 이후 가동기간 종료까지 계수 60</b></li>
       <li>피해자 과실 <b>20%</b></li></ul>`,
       steps:[
       {t:"① 왜 두 구간인가", b:"여명까지는 <b>살아서 일할 수 있었던 기간</b>이므로 노동능력상실률을 적용한다.\n여명 이후 가동기간 종료까지는 <b>사망한 것과 같은 상태</b>이므로 사망 사안처럼 <b>생활비 1/3을 공제</b>한다."},
       {t:"② 여명까지 — 상실률 적용", b:"3,000,000원 × 80% × 100 = <span class=\"num\">240,000,000원</span>"},
       {t:"③ 여명 이후 ~ 가동기간 종료 — 생활비 공제", b:"3,000,000원 × (1 − 1/3) × 60 = 3,000,000 × 2/3 × 60 = <span class=\"num\">120,000,000원</span>"},
       {t:"④ 소계", b:"240,000,000 + 120,000,000 = <span class=\"num\">360,000,000원</span>"},
       {t:"⑤ 과실상계", b:"360,000,000원 × (1 − 20%) = <span class=\"num\">288,000,000원</span>"}],
       final:`일실수익 360,000,000원 → 과실상계 후 <b>288,000,000원</b>`,
       trap:`<b>자주 틀리는 곳</b>
① <b>여명 이후 기간을 아예 빼버리는 것</b> — 사고가 없었다면 가동기간 종료까지 벌었을 것이므로 반드시 산정한다.
② <b>여명 이후에도 상실률을 곱하는 것</b> — 그 구간은 사망과 같으므로 <b>생활비 1/3 공제</b>가 맞다.
③ <b>계수 합계가 240을 넘는 것</b> — 호프만계수는 240이 상한이다.`,
       mnemo:{key:"여명까지는 상실률, 여명 뒤는 생활비", how:"한 사람의 손해를 <b>산 기간</b>과 <b>죽은 기간</b>으로 잘라서 계산한다고 생각하면 헷갈리지 않는다."}},

      {id:"lc8", title:"항목별 손익상계와 상속 후 공제 (사망 사안)", freq:F(3,[45,47,49]),
       setup:`<b>사례</b><ul>
       <li>업무상 재해로 근로자 사망. 유족은 <b>배우자, 아들, 딸</b></li>
       <li>손해배상액 — 치료비 2,000만원, 일실수익 3억원, 위자료 8,000만원</li>
       <li>산재 급여 — 요양급여 1,800만원, 유족급여 1억 5,000만원(<b>생계를 같이한 아들이 전액 수령</b>)</li>
       <li>피해자 과실 <b>20%</b></li></ul>`,
       steps:[
       {t:"① 과실상계 (기왕증 없음)", b:"치료비 2,000만 × 0.8 = <span class=\"num\">1,600만원</span>\n일실수익 3억 × 0.8 = <span class=\"num\">2억 4,000만원</span>\n위자료 8,000만 × 0.8 = <span class=\"num\">6,400만원</span>"},
       {t:"② 치료비에서 요양급여 공제", b:"1,600만원 − 1,800만원 = △200만원 → <b>0원</b>\n음수는 0으로 처리하고 남는 200만원을 다른 항목으로 넘기지 않는다."},
       {t:"③ 일실수익을 상속분대로 분배", b:"배우자 1.5 : 아들 1 : 딸 1 = 3.5\n배우자 2억 4,000만 × 1.5/3.5 = <span class=\"num\">102,857,142원</span>\n아들 2억 4,000만 × 1/3.5 = <span class=\"num\">68,571,428원</span>\n딸 = <span class=\"num\">68,571,428원</span>"},
       {t:"④ 유족급여는 받은 사람에게서만 공제", b:"아들 68,571,428원 − 150,000,000원 = △81,428,572원 → <b>0원</b>\n배우자와 딸은 급여를 받지 않았으므로 <b>공제하지 않는다</b>."},
       {t:"⑤ 위자료는 공제하지 않는다", b:"위자료 6,400만원은 그대로 상속분대로 분배한다.\n배우자 27,428,571원 / 아들 18,285,714원 / 딸 18,285,714원"},
       {t:"⑥ 유족별 최종 배상액", b:"배우자 102,857,142 + 27,428,571 = <span class=\"num\">130,285,713원</span>\n아들 0 + 18,285,714 = <span class=\"num\">18,285,714원</span>\n딸 68,571,428 + 18,285,714 = <span class=\"num\">86,857,142원</span>"}],
       final:`배우자 130,285,713원 · 아들 18,285,714원 · 딸 86,857,142원`,
       trap:`<b>자주 틀리는 곳</b>
① <b>유족급여를 전체 손해액에서 한꺼번에 빼는 것</b> — 상속으로 나눈 뒤 <b>받은 사람의 몫에서만</b> 뺀다.
② <b>위자료에서 유족급여를 공제하는 것</b> — 성질이 달라 공제하지 않는다.
③ <b>요양급여가 치료비를 초과한 차액을 일실수익에서 빼는 것</b> — 항목별 대응이 원칙이므로 넘기지 않는다.
④ <b>상속분을 1:1:1로 나누는 것</b> — 배우자는 5할 가산이므로 1.5다.`,
       mnemo:{key:"상속 먼저, 공제는 받은 사람만", how:"사망 사안은 <b>① 과실상계 → ② 상속분 분배 → ③ 받은 사람에게서만 공제</b> 순서다. 수급권자와 상속권자가 같으면 순서를 바꿔도 결과가 같다."}},

      {id:"lc9", title:"국문·영문 지급보험금과 의무보험 중복 — 순차와 안분", freq:F(3,[45,48,49]),
       setup:`<b>사례</b><ul>
       <li>손해배상금 <b>2억 8,000만원</b></li>
       <li>A보험 — 의무보험, 보상한도 <b>1억 2,000만원</b></li>
       <li>B보험 — 의무보험, 보상한도 <b>8,000만원</b></li>

       steps:[
       {t:"① 순서 — 의무보험이 먼저다", b:"의무보험은 법정 강제보험이므로 <b>먼저 보상</b>하고, 임의보험은 그 <b>초과분</b>을 담보한다."},
       {t:"② 의무보험끼리는 독립책임액 안분", b:"A 독립책임액 = Min(1억 2,000만, 2억 8,000만) = 1억 2,000만원\nB 독립책임액 = Min(8,000만, 2억 8,000만) = 8,000만원\n합계 2억원 ≤ 손해액 2억 8,000만원 → <b>안분하지 않고 각자 전액</b>"},
       {t:"③ 만약 합계가 손해액을 넘었다면", b:"예컨대 손해액이 1억 6,000만원이었다면\nA = 1억 6,000만 × (1.2억 ÷ 2억) = <span class=\"num\">9,600만원</span>\nB = 1억 6,000만 × (0.8억 ÷ 2억) = <span class=\"num\">6,400만원</span>"},
       {t:"④ 임의보험의 초과분", b:"2억 8,000만원 − 2억원(의무보험 지급) = <span class=\"num\">8,000만원</span>"},
       {t:"⑤ C보험 지급보험금 — 국문 약관", b:"Min(8,000만 − 2,000만, 2억) = <span class=\"num\">6,000만원</span>"},
       {t:"⑥ 영문 약관이었다면", b:"Min(8,000만, 2억) − 2,000만 = <span class=\"num\">6,000만원</span>\n이 사례에서는 같으나, 손해가 한도를 넘으면 결과가 달라진다.\n예: 초과분 2억 5,000만원 → 국문 Min(2.3억, 2억) = 2억원 / 영문 Min(2.5억, 2억) − 2,000만 = 1억 8,000만원"}],
       final:`A 1억 2,000만원 · B 8,000만원 · C 6,000만원 (합계 2억 6,000만원)`,
       trap:`<b>자주 틀리는 곳</b>
① <b>의무보험과 임의보험을 한꺼번에 안분하는 것</b> — 의무보험 먼저, 임의보험은 초과분이다.
② <b>독립책임액 합계가 손해액 이하인데 안분하는 것</b> — 안분하지 않고 각자 전액이다.
③ <b>자기부담금을 한도 적용 뒤에 빼는 것</b>(국문) — 국문은 빼고 나서 한도를 씌운다.
④ <b>총보상한도(a.g.g.)가 이미 일부 소진된 것을 무시하는 것</b> — 기지급 3억 5,000만원, a.g.g. 5억원이면 이번 사고는 <b>1억 5,000만원</b>이 상한이다.`,
       mnemo:{key:"의무 먼저 · 넘으면 안분 · 초과분은 임의", how:"세 줄 순서만 지키면 된다. 그리고 <b>국문은 빼고 씌우고, 영문은 씌우고 뺀다</b>."}}
    ],
    cards:[
      {f:"근재 계산 5단계는?", b:"법률상 배상책임 → 약관상 보상책임 → 손해배상금 → 공제·상계 → 지급보험금. (법·약·손·공·지)"},
      {f:"일실수익(장해)의 산식은?", b:"월소득 × 노동능력상실률 × 호프만계수 × (1 − 과실률). 정년 이후는 일용노임 기준으로 별도 계산."},
      {f:"일실수익(사망)의 산식은?", b:"월소득 × 호프만계수 × (1 − 1/3 생계비) × (1 − 과실률)."},
      {f:"일실퇴직금의 산식은?", b:"[정년시 예상퇴직금 현가 − 기수령 퇴직금] × 노동능력상실률 × (1 − 과실률)."},
      {f:"예상퇴직금의 현가화 방법은?", b:"예상퇴직금 × 1/(1 + 0.05 × 잔여연수)."},
      {f:"일실퇴직금에 상실률을 곱하는 이유는?", b:"사망이 아니라 장해로 퇴직한 것이므로 장해율만큼만 산정한다."},
      {f:"개호비의 산식은?", b:"(일용노임 × 일수) × 개호인 수 × 호프만계수 × (1 − 과실률)."},
      {f:"위자료에 과실을 반영하는 실무례는?", b:"과실비율을 전부 반영하지 않고 6/10만 참작한다. 예: 과실 20%면 [1 − (0.2 × 6/10)] = 0.88."},
      {f:"독립책임액의 산정방법은?", b:"min(손해배상금 − 자기부담금, 보상한도액). 자기부담금이 있으면 보상한도에서도 공제한다."},
      {f:"중복보험 안분은 언제 하는가?", b:"각 보험사 독립책임액의 합계가 손해액을 초과할 때만. 미달하면 각자 독립책임액을 그대로 지급한다."},
      {f:"중복보험 안분 산식은?", b:"손해액 × (각 독립책임액 ÷ 독립책임액 합계)."},
      {f:"기왕증·과실상계·손익상계의 순서는?", b:"기왕증 공제 → 과실상계 → 손익상계. 단 산재보험급여는 공제 후 과실상계."},
      {f:"근기법 장해일수를 산재법 기준으로 바꾸려면?", b:"110%를 곱한다. 450일 → 495일."},
      {f:"8급과 14급 장해는 조정 대상인가?", b:"아니다. 8급 이상 장해가 2개 이상이어야 2등급 상향한다. 8급과 14급이면 8급을 그대로 적용."},
      {f:"계산문제에서 반드시 해야 할 것은?", b:"산출과정을 남긴다. 항목별 지급기준을 함께 요구하면 각 항목에 근거 한 줄을 붙인다."},

      {f:"손익상계의 항목별 대응은?", b:"요양급여→치료비, 휴업급여→요양기간 일실수익, 장해·유족급여→치료종결 후 일실수익, 간병급여→개호비. 위자료는 공제하지 않는다."},
      {f:"대응 항목이 음수가 되면?", b:"그 항목은 0원으로 처리하고 남는 급여를 다른 항목으로 넘기지 않는다."},
      {f:"사망 사안의 공제 순서는?", b:"과실상계 → 상속분 분배 → 각자 받은 급여만 공제(상속 후 공제)."},
      {f:"수급권자와 상속권자가 같으면?", b:"상속 후 공제와 공제 후 상속의 결과가 같다."},
      {f:"반복 지출 향후치료비의 현가는?", b:"각 연도의 경과년수 계수를 합산하여 곱한다."},
      {f:"1회성 지출 향후치료비의 현가는?", b:"그 시점의 월계수에서 직전 구간 월계수를 뺀 차액을 곱한다."},
      {f:"여명이 단축된 경우 일실수익은?", b:"여명까지는 노동능력상실률 적용, 여명 이후 가동기간 종료까지는 생활비 1/3 공제."},
      {f:"의무보험과 임의보험이 함께 있으면?", b:"의무보험이 먼저 보상하고 임의보험은 그 초과분을 담보한다."},
      {f:"총보상한도(a.g.g.)가 일부 소진되었다면?", b:"잔여 한도가 이번 사고의 상한이 된다. 기지급 3.5억, a.g.g. 5억이면 1.5억이 상한."}
    ],
    quiz:[
      {q:"복합장해율 60%, 월소득 300만원, 과실 30%, 치료종결~정년 호프만계수 30, 정년~가동기간 종료 계수 50, 정년 이후 일용노임 90,000원(월 30일)일 때 일실수익을 산출하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 산정구조\n장해로 인한 일실수익은 정년까지와 정년 이후를 나누어 산정한다. 정년까지는 실제 소득을, 정년 이후는 일용노임을 기준으로 한다.\n\nⅡ. 치료종결일 이후 정년까지\n3,000,000원 × 60%(노동능력상실률) × 30(호프만계수) × (1 − 30%) = 37,800,000원\n\nⅢ. 정년 이후 가동기간 종료까지\n(90,000원 × 30일) × 60% × 50(호프만계수) × (1 − 30%) = 56,700,000원\n\nⅣ. 소계\n37,800,000원 + 56,700,000원 = 94,500,000원\n\nⅤ. 유의사항\n1. 장해의 경우 생계비를 공제하지 않는다. 생계비 공제는 사망에만 적용된다.\n2. 호프만계수는 문제에서 제시된 값을 사용하며, 제시되지 않으면 240을 상한으로 한다.`},
      {q:"월소득 300만원, 사고 당시 6년 근무, 정년 60세(잔여 5년), 노동능력상실률 60%, 과실 30%인 경우 일실퇴직금을 산출하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 산정구조\n일실퇴직금은 정년까지 근무하였다면 받을 수 있었던 퇴직금의 현가에서 이미 수령한 퇴직금을 공제한 후, 노동능력상실률과 과실상계를 반영하여 산정한다.\n\nⅡ. 산출\n1. 총 근무가능기간 — 사고 시점 6년 + 잔여 5년 = 11년\n2. 정년시 예상퇴직금 = 3,000,000원 × 11년 = 33,000,000원\n3. 현가화 = 33,000,000원 × 1/(1 + 0.05 × 5년) = 26,400,000원\n4. 기수령 퇴직금 = 3,000,000원 × 6년 = 18,000,000원\n5. 일실퇴직금 = (26,400,000원 − 18,000,000원) × 60% × (1 − 30%) = 3,528,000원\n\nⅢ. 유의사항\n사망이 아니라 장해로 인하여 퇴직한 경우이므로 노동능력상실률만큼만 산정한다. 사망의 경우에는 상실률 100%를 적용한다.`},
      {q:"평균임금 100,000원, 요양기간 300일, 제8급 이상 장해 2개(최상위 제2급), 제1급 장해보상일시금 1,474일분인 경우 휴업보상금과 장해보상금을 산출하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 휴업보상금\n1. 지급기준 — 요양 중에 있는 근로자에게 요양 중 평균임금의 100분의 70을 지급한다.\n2. 산출 — 300일 × 100,000원 × 70% = 21,000,000원\n\nⅡ. 장해보상금\n1. 등급 조정 — 제8급 이상의 장해가 둘 이상 있는 경우 중한 장해등급을 2개 등급 상향한다. 최상위가 제2급이므로 2등급을 올려 제1급이 되며, 제1급이 상한이다.\n2. 지급기준 — 장해등급 제1급에 해당하는 1,474일분의 평균임금을 지급한다.\n3. 산출 — 1,474일 × 100,000원 = 147,400,000원\n\nⅢ. 유의사항\n제시된 일수가 근로기준법 기준이면 110%를 곱하여 산재보험법 기준으로 환산하여야 한다.`},
      {q:"총 손해액 1억원, 기왕증 기여도 20%, 과실비율 30%, 손익상계 대상 보험금 2,000만원인 경우 최종 손해배상금을 산출하고, 순서를 바꾸면 어떻게 되는지 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 적용 순서\n대법원 판례에 따라 기왕증(기여도) 공제 → 과실상계 → 손익상계의 순서로 적용한다.\n\nⅡ. 산출\n1. 기왕증 공제 — 100,000,000원 × (1 − 0.2) = 80,000,000원\n2. 과실상계 — 80,000,000원 × (1 − 0.3) = 56,000,000원\n3. 손익상계 — 56,000,000원 − 20,000,000원 = 36,000,000원\n\nⅢ. 순서를 바꾼 경우\n손익상계를 먼저 하면 (100,000,000 − 20,000,000) × 0.8 × 0.7 = 44,800,000원이 되어 피해자에게 유리하게 산정된다. 이는 이미 전보받은 이익에 대하여도 과실상계를 하지 않는 결과가 되어 부당하다.\n\nⅣ. 순서의 이유\n순수하게 이번 사고로 인한 손해액을 확정하기 위하여 기왕증을 먼저 공제하고, 확정된 손해액에 피해자의 과실을 반영하며, 마지막으로 남은 배상액 범위에서 이득을 공제하여야 손해분담의 형평성에 부합한다.\n\nⅤ. 예외\n산재보험급여의 경우에는 판례가 공제 후 과실상계 방식을 채택한다.`},
      {q:"손해배상금 208,000,000원, A보험사(보상한도 1억원, 자기부담금 1,000만원)와 B보험사(보상한도 1억 5,000만원, 자기부담금 없음)가 중복보험 관계에 있을 때 각 보험사의 지급보험금을 산출하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 독립책임액의 산정\n각 보험자가 단독으로 부담하였을 금액을 산정한다. 손해배상금에서 자기부담금을 공제한 금액과 보상한도액 중 작은 금액이 독립책임액이 된다.\n\n1. A보험사\n  손해배상금 − 자기부담금 = 208,000,000 − 10,000,000 = 198,000,000원\n  보상한도액 − 자기부담금 = 100,000,000 − 10,000,000 = 90,000,000원\n  → 독립책임액 90,000,000원\n\n2. B보험사\n  손해배상금 − 자기부담금 = 208,000,000 − 0 = 208,000,000원\n  보상한도액 = 150,000,000원\n  → 독립책임액 150,000,000원\n\nⅡ. 안분 여부의 판단\n독립책임액의 합계 = 90,000,000 + 150,000,000 = 240,000,000원\n합계가 손해액 208,000,000원을 초과하므로 안분한다.\n\nⅢ. 안분 계산\nA보험사 = 208,000,000 × (90,000,000 / 240,000,000) = 78,000,000원\nB보험사 = 208,000,000 × (150,000,000 / 240,000,000) = 130,000,000원\n\nⅣ. 유의사항\n독립책임액의 합계가 손해액에 미달하는 경우에는 안분할 것이 없고 각자의 독립책임액을 그대로 지급한다.`},
      {q:"사망자의 월소득 300만원, 과실 20%, 사고일~정년 호프만계수 40, 정년 이후 계수 50, 정년 이후 일용노임 90,000원×22일, 장례비 400만원, 위자료 기준액 1억원인 경우 법률상 손해배상책임액을 산출하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 치료비\n문제에서 별도 발생 치료비의 언급이 없으므로 0원으로 한다.\n\nⅡ. 일실수익\n1. 사고일부터 정년까지 — 사망이므로 생계비 1/3을 공제한다.\n  3,000,000원 × 100% × 40 × (1 − 1/3) × (1 − 20%) = 64,000,000원\n2. 정년 이후 가동기간 종료까지\n  (90,000원 × 22일) × 100% × 50 × 2/3 × 80% = 52,800,000원\n3. 소계 — 116,800,000원\n\nⅢ. 장례비\n4,000,000원 × (1 − 20%) = 3,200,000원\n\nⅣ. 위자료\n위자료는 과실비율을 전부 반영하지 않고 6/10만 참작하는 실무례에 따른다.\n100,000,000원 × [1 − (20% × 6/10)] = 88,000,000원\n\nⅤ. 합계\n116,800,000원 + 3,200,000원 + 88,000,000원 = 208,000,000원\n\nⅥ. 유의사항\n사망 일실수익의 생계비 공제(1/3)와 위자료의 과실 반영 방식이 다르다는 점에 주의하여야 한다.`},
      {q:"평균임금 200,000원, 요양기간 200일, 장해등급 제8급과 제14급, 제시된 장해보상일시금 450일분(근로기준법 기준)인 경우 휴업보상과 장해보상을 산출하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 휴업보상\n1. 지급기준 — 요양 중 평균임금의 70%\n2. 산출 — 200일 × 200,000원 × 70% = 28,000,000원\n\nⅡ. 장해등급의 조정 여부\n장해등급 조정은 제8급 이상의 장해가 둘 이상 있는 경우에 적용된다. 본 사안은 제8급과 제14급이므로 조정 대상이 아니고, 제8급을 그대로 적용한다.\n\nⅢ. 일수의 환산\n제시된 450일분은 근로기준법 기준이므로 110%를 곱하여 산업재해보상보험법 기준 일수로 환산한다.\n450일 × 110% = 495일\n\nⅣ. 장해보상\n495일 × 200,000원 = 99,000,000원\n\nⅤ. 기왕증의 처리\n장해급수 판정 시 기왕증 기여도 공제에 관한 기준은 없으며, 대법원 판례에 따르면 기왕증이 존재한다는 이유로 요양보상을 공제할 수 없다.`},
      {q:"근재보험에서 개호비를 산정하는 방법과 인정기준을 설명하고, 일용노임 90,000원(월 30일), 개호인 1인, 호프만계수 160, 과실 30%인 경우를 계산하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 개호비의 의의\n후유장해로 인하여 일상생활에 필요한 동작을 스스로 할 수 없어 타인의 조력이 필요한 경우 그 비용을 말한다.\n\nⅡ. 인정기준\n1. 의학적으로 개호의 필요성이 인정되어야 한다.\n2. 개호인의 수와 개호시간은 의사의 소견에 따른다.\n3. 개호기간은 여명기간을 기준으로 하되 한시적 개호인 경우 그 기간에 한한다.\n4. 개호인 임금은 통상 일용근로자 임금을 적용한다.\n\nⅢ. 산정식\n(일용노임 × 월 일수) × 개호인 수 × 호프만계수 × (1 − 과실률)\n\nⅣ. 계산\n(90,000원 × 30일) × 1인 × 160 × (1 − 30%) = 302,400,000원\n\nⅤ. 유의사항\n1. 일시금으로 지급하므로 중간이자를 공제한 호프만계수를 적용한다.\n2. 개호비는 금액이 매우 크므로 개호 필요성과 개호인 수에 관한 의학적 자료를 반드시 확보하여야 한다.`},
      {q:"근재보험 지급보험금을 산정할 때 자기부담금과 보상한도액을 적용하는 순서와 방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 산정의 순서\n1. 법률상 손해배상금을 확정한다.\n2. 기왕증 공제 → 과실상계 → 손익상계를 순서대로 적용한다.\n3. 자기부담금을 공제한다.\n4. 보상한도액과 비교하여 작은 금액을 지급한다.\n5. 중복보험이면 독립책임액 비율로 안분한다.\n\nⅡ. 자기부담금\n1. 1사고당 피보험자가 스스로 부담하기로 한 금액으로, 손해배상금에서 먼저 공제한다.\n2. 취지는 소액사고의 처리비용 절감과 손해방지 노력의 유도이다.\n\nⅢ. 보상한도액\n1. 1인당 한도, 1사고당 한도, 보험기간 총한도 등으로 정해진다.\n2. 어느 한도가 적용되는지 확인하여야 하며, 1인당 한도가 있는 경우 피해자별로 적용한다.\n\nⅣ. 독립책임액과의 관계\n독립책임액은 '손해배상금 − 자기부담금'과 '보상한도액' 중 작은 금액이며, 자기부담금이 있는 경우 보상한도액에서도 이를 고려한다.\n\nⅤ. 결론\n순서를 지키지 않으면 금액이 달라지므로, 조정 → 자기부담금 → 한도 → 안분의 순서를 고정하여 적용한다.`},
      {q:"근재보험 계산문제에서 '항목별 지급기준을 함께 기재하라'는 요구가 있는 경우의 답안 작성방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 요구의 취지\n손해사정 실무에서는 금액뿐 아니라 그 근거를 제시하여야 하므로, 각 보상항목마다 어떤 규정에 따라 얼마를 지급하는지를 밝히도록 요구하는 것이다.\n\nⅡ. 작성방법\n각 항목마다 다음 세 줄을 갖춘다.\n1. 항목명\n2. 지급기준 — 근거 규정의 요지를 한 줄로 기재\n3. 산출 — 산식과 결과\n\nⅢ. 예시\n1. 요양보상금\n  지급기준 — 근로자가 업무상 부상 또는 질병에 걸리면 사용자는 그 비용으로 필요한 요양을 행하거나 요양비를 부담(간병비 포함)하며, 국외에서 국내로의 이송비는 한도 내에서 지급한다.\n  산출 — 치료비 + 간병비 + 이송비 = 금액\n2. 휴업보상금\n  지급기준 — 요양 중 평균임금의 100분의 70을 지급한다.\n  산출 — 요양일수 × 평균임금 × 70% = 금액\n\nⅣ. 유의사항\n산식과 총액만 기재하면 감점되므로, 시간이 부족하더라도 각 항목의 지급기준을 한 줄씩은 반드시 붙여야 한다.\n\nⅤ. 결론\n'기준 한 줄 + 산식 한 줄'을 항목마다 반복하는 것이 이 유형의 만점 답안 형식이다.`},

      {q:"손익상계에서 보험급여와 손해항목의 대응관계를 설명하고, 대응 항목이 급여액에 미달하는 경우의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 항목별 대응의 원칙\n손익상계는 같은 성질의 손해와 급여 사이에서만 이루어진다.\n1. 요양급여는 치료비에서 공제한다.\n2. 휴업급여는 요양기간에 해당하는 일실수익에서 공제한다.\n3. 장해급여와 유족급여는 치료종결 이후의 일실수익에서 공제한다.\n4. 간병급여는 개호비에서 공제한다.\n5. 위자료에서는 공제하지 아니한다.\n\nⅡ. 대응 항목이 급여액에 미달하는 경우\n1. 해당 항목의 배상액은 0원으로 처리한다.\n2. 초과하는 급여액을 다른 손해항목으로 이월하여 공제하지 아니한다.\n3. 이는 급여의 목적이 항목별로 특정되어 있기 때문이다.\n\nⅢ. 과실상계와의 순서\n원칙은 기왕증 공제, 과실상계, 손익상계의 순서이나, 제3자의 과실이 경합하는 산업재해에서는 판례가 공제 후 과실상계를 인정하므로 적용한 순서와 근거를 답안에 밝혀야 한다.\n\nⅣ. 장래 급여의 처리\n아직 수령하지 아니하였더라도 장래에 지급이 예정된 급여는 공제하며, 연금으로 지급되는 급여는 일시금으로 환산하여 공제한다.\n\nⅤ. 결론\n항목별 대응을 지키지 아니하면 배상액이 부당하게 축소되므로, 계산 답안에서는 항목과 급여를 표로 대응시켜 서술하는 것이 안전하다.`},
      {q:"업무상 재해로 사망한 근로자의 유족에게 지급할 손해배상액을 산정할 때 상속과 손익상계의 순서를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 문제의 소재\n산업재해보상보험의 유족급여는 생계를 같이한 특정 유족에게 집중하여 지급되는 반면 손해배상채권은 상속분에 따라 분할되므로, 공제의 순서에 따라 유족별 배상액이 달라진다.\n\nⅡ. 상속 후 공제설\n1. 손해배상채권을 먼저 상속분에 따라 분할한다. 배우자는 직계비속의 상속분에 5할을 가산한다.\n2. 각 상속인의 몫에서 그 상속인이 실제로 수령한 보험급여만을 공제한다.\n3. 급여를 수령하지 아니한 상속인의 몫에서는 공제하지 아니한다.\n\nⅢ. 공제 후 상속설\n손해배상액에서 급여를 먼저 공제한 후 잔액을 상속분에 따라 분할한다. 이 경우 급여를 받지 아니한 상속인의 몫도 감소한다.\n\nⅣ. 실무의 처리\n수급권자와 상속권자가 일치하는 경우에는 두 방식의 결과가 같다. 일치하지 아니하는 경우에는 상속 후 공제가 수급권자별 형평에 부합하므로 실무는 이를 따른다.\n\nⅤ. 유의사항\n위자료에서는 보험급여를 공제하지 아니하므로 상속분에 따라 그대로 분할한다.\n\nⅥ. 결론\n사망사고는 과실상계, 상속분 분배, 수령자별 공제의 순서로 처리하는 것이 안전하다.`},
      {q:"향후치료비의 현가 산정방법을 설명하고, 반복 지출과 일회성 지출의 차이를 기술하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n향후치료비는 장래에 지출될 비용이므로 중간이자를 공제하여 사고 당시의 현재가치로 환산하여야 한다.\n\nⅡ. 반복 지출의 경우\n1. 매년 또는 일정 주기로 반복하여 지출되는 비용은 각 지출 시점의 경과년수 계수를 모두 합산한 값을 곱한다.\n2. 예컨대 5년간 매년 지출하는 경우 1, 0.6666, 0.5, 0.4, 0.3334를 합한 2.9를 곱한다.\n3. 초회 지출이 이미 이루어진 경우에는 잔여 회차의 계수만 합산한다.\n\nⅢ. 일회성 지출의 경우\n1. 특정 시점에 한 번만 지출되는 비용은 그 시점까지의 월계수에서 직전 시점까지의 월계수를 뺀 차액을 곱한다.\n2. 예컨대 3년 후 1회 지출이라면 20.5에서 19.6을 뺀 0.9를 곱한다.\n\nⅣ. 과실상계\n산정된 향후치료비도 손해액의 일부이므로 피해자의 과실비율만큼 상계한다.\n\nⅤ. 결론\n반복 지출은 계수의 합, 일회성 지출은 계수의 차라는 구별이 계산의 핵심이다.`}

      {h:"의사 및 병원 배상책임보험", freq:F(2,[45,46]),
       body:`<p>전문직업배상책임보험의 대표 종목으로, 46회가 담보위험을 10점으로 물었다.</p>

      {f:"보관자 특약이 보상하지 않는 손해는?", b:"재물의 자연소모, 고유하자, 전기적·기계적 사고, 도난(별도 특약), 위탁 목적 외 사용."},

    quiz:[
      {q:"영업배상책임보험 시설소유관리자 특별약관의 '보상하는 손해'와 '보상하지 않는 손해'를 설명하시오. (15점)", pts:15, lik:3,
       a:`Ⅰ. 보상하는 손해\n피보험자가 소유·사용·관리하는 시설 및 그 시설의 용도에 따른 업무수행 중 발생한 우연한 사고로 타인의 신체에 장해를 입히거나 재물을 망가뜨려 부담하는 법률상의 배상책임을 보상한다.\n\nⅡ. 보상하지 않는 손해\n1. 피보험자의 고의로 생긴 손해\n2. 계약에 의하여 가중된 배상책임 — 법률상 책임을 초과하여 약정으로 인수한 책임\n3. 전쟁·혁명·내란 및 핵연료물질로 인한 손해\n4. 피보험자의 근로자가 업무에 종사하는 중 입은 신체장해 — 근로자재해보상책임보험의 담보영역이다.\n5. 피보험자가 소유·점유·임차·사용하거나 관리하는 재물에 입은 손해 — 보관자 특별약관으로 담보한다.\n6. 티끌, 먼지, 소음, 악취 등 점진적 오염으로 인한 손해\n7. 지하매설물에 입힌 손해 및 그로 인한 손해\n8. 벌과금 및 징벌적 손해배상금\n\nⅢ. 면책의 취지\n다른 보험의 고유 영역과 중복을 피하고, 우연성이 결여된 손해나 인수하기 어려운 위험을 배제하기 위한 것이다.`},
      {q:"영업배상책임보험 보관자 특별약관의 담보내용과 법적 근거를 설명하고, 시설소유관리자 특별약관과 비교하시오. (15점)", pts:15, lik:2,
       a:`Ⅰ. 보관자 특별약관의 담보내용\n피보험자가 보관·관리하는 타인의 재물이 손해를 입어 그 소유자에게 부담하는 법률상 배상책임을 보상한다.\n\nⅡ. 법적 근거\n1. 임치계약상 수치인의 선량한 관리자의 주의의무(민법 제374조, 제695조)\n2. 위반 시 채무불이행책임이 성립하며, 수치인이 주의의무를 다하였음을 입증하여야 면책된다.\n\nⅢ. 시설소유관리자 특별약관과의 비교\n1. 담보 대상 — 보관자는 피보험자가 보관 중인 타인의 재물, 시설소유관리자는 제3자의 신체와 재물\n2. 보통약관과의 관계 — 보통약관은 피보험자가 소유·점유·관리하는 재물을 면책하므로, 보관자 특약은 그 면책의 예외를 만드는 특약이다.\n3. 책임의 성질 — 보관자는 계약책임(채무불이행), 시설소유관리자는 주로 불법행위책임\n4. 입증책임 — 보관자는 피보험자가 무과실을 입증, 시설소유관리자는 피해자가 과실을 입증(다만 공작물책임이 적용되면 전환)\n\nⅣ. 보상하지 않는 손해\n재물의 자연소모, 고유하자, 전기적·기계적 사고, 도난(별도 특약), 위탁 목적 외 사용 등\n\nⅤ. 결론\n주차장·세탁소·창고업 등 타인의 물건을 맡는 업종은 보관자 특약이 반드시 필요하다.`},
      {q:"의사 및 병원 배상책임보험약관의 담보위험에 대하여 약술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n의료기관과 의료인이 의료행위 및 병원 운영과 관련하여 부담하는 법률상 배상책임을 담보하는 전문직업배상책임보험이다.\n\nⅡ. 담보위험\n1. 의사 배상책임 — 피보험자인 의사가 의료행위를 수행함에 있어 과실로 환자의 신체에 장해를 입히거나 사망에 이르게 한 경우의 배상책임\n2. 병원 배상책임 — 병원 시설의 소유·사용·관리 및 병원 업무 수행 중 발생한 사고에 대한 배상책임으로, 의료과실 외에 시설사고, 원내감염, 급식 사고, 의약품 관리 사고 등을 포함한다.\n3. 담보 대상자 — 기명피보험자인 의료기관과 그에 소속된 의료인 및 종사자\n\nⅢ. 담보기준\n배상청구기준(Claims-made)이 원칙이며, 소급담보일자 이후에 발생한 사고로서 보험기간 중에 배상청구가 제기된 것을 담보한다.\n\nⅣ. 주요 면책\n1. 무면허 또는 자격정지 중의 의료행위\n2. 미용·성형 목적 시술의 결과에 대한 불만\n3. 계약에 의하여 가중된 배상책임\n4. 고의 또는 의료법 위반행위\n5. 피보험자의 근로자가 입은 신체장해\n\nⅤ. 결론\n의료사고는 사고와 청구 사이 시차가 크므로 담보기준과 소급담보일자의 확인이 실무의 출발점이다.`},
      {q:"영업배상책임보험에서 '우연한 사고'의 의미와 그 판단기준을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n보험사고의 요건으로서, 피보험자의 의사에 기하지 아니한 우발적인 사고를 말한다. 보험제도가 예측하지 못한 위험을 인수하는 것이므로 우연성은 본질적 요건이다.\n\nⅡ. 판단기준\n1. 피보험자의 고의가 없을 것 — 고의는 우연성을 배제한다.\n2. 사고의 발생이 예견되지 않았을 것 — 점진적·계속적으로 진행되어 예견 가능한 손해는 우연성이 부정될 수 있다.\n3. 급격성 — 점진적 오염과 같이 서서히 진행되는 손해는 별도 특약이 없으면 면책된다.\n\nⅢ. 관련 면책조항\n1. 고의 면책\n2. 티끌·먼지·소음·악취 등 점진적 오염으로 인한 손해의 면책\n3. 계약에 의하여 가중된 배상책임의 면책 — 이는 우연성이 아니라 인수위험의 범위 문제이다.\n\nⅣ. 입증책임\n우연성의 존재는 보험금을 청구하는 자가, 고의는 면책을 주장하는 보험자가 입증한다는 것이 일반적 견해이다.\n\nⅤ. 결론\n우연성 판단은 고의 여부와 손해의 진행 형태를 함께 살펴야 한다.`},
      {q:"영업배상책임보험에서 '계약에 의하여 가중된 배상책임'을 면책으로 하는 이유와 그 판단방법을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 의의\n피보험자가 법률상 부담하는 배상책임을 초과하여 계약이나 약정으로 인수한 책임을 말한다.\n\nⅡ. 면책으로 하는 이유\n1. 보험자는 법률상 배상책임을 전제로 위험을 인수하고 요율을 산출하였으므로, 당사자의 약정으로 위험이 확대되는 것을 인수할 수 없다.\n2. 피보험자가 임의로 책임을 확대하여 보험자에게 전가하는 도덕적 위험을 방지한다.\n\nⅢ. 판단방법\n1. 법률상 책임의 범위를 먼저 확정한다.\n2. 계약서·약정서의 내용을 검토하여 법률상 책임을 초과하는 부분이 있는지 확인한다.\n3. 초과 부분만 면책되고 법률상 책임 부분은 담보된다.\n\nⅣ. 실무상 사례\n1. 도급계약에서 수급인이 무과실책임을 부담하기로 약정한 경우\n2. 임대차계약에서 임차인이 화재 원인을 불문하고 배상하기로 약정한 경우\n3. 손해배상액을 미리 정액으로 정한 경우\n\nⅤ. 결론\n계약서의 배상책임 조항을 확인하지 않으면 면책 범위를 잘못 판단하게 되므로, 손해사정 시 계약서 검토가 필수적이다.`},
      {q:"영업배상책임보험에서 피보험자의 근로자가 입은 신체장해를 면책으로 하는 이유와, 그 판단이 문제되는 경우를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 면책의 이유\n1. 근로자의 업무상 재해는 산업재해보상보험과 근로자재해보상책임보험이 담보하는 고유 영역이다.\n2. 담보의 중복을 방지하고 각 보험의 요율 산출 기초를 유지하기 위함이다.\n\nⅡ. 판단이 문제되는 경우\n1. 하수급인의 근로자 — 도급인의 영업배상책임보험에서 하수급인 근로자가 '피보험자의 근로자'에 해당하는지가 문제된다. 도급인과 직접 근로계약관계가 없으면 면책되지 않는다는 견해와, 실질적 지휘·감독 관계를 기준으로 보는 견해가 대립한다.\n2. 파견근로자 — 사용사업주와 파견사업주 중 누가 사용자인지에 따라 결론이 달라진다.\n3. 특수형태근로종사자 — 근로자성 인정 여부가 쟁점이 된다.\n4. 업무 외 시간의 사고 — 업무에 종사하는 중의 사고가 아니면 면책조항이 적용되지 않을 수 있다.\n\nⅢ. 실무상 처리\n1. 근로계약서, 4대보험 가입내역, 도급계약서, 실제 지휘·감독 관계를 확인한다.\n2. 근재보험 가입 여부를 함께 확인하여 담보 공백이 생기지 않도록 안내한다.\n\nⅣ. 결론\n피해자의 근로자성 판단이 담보 종목을 결정하므로 사례의 첫 단계로 삼아야 한다.`},
      {q:"도급업자 배상책임보험의 담보내용과 도급인·수급인의 책임관계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 담보내용\n피보험자가 수행하는 도급공사 및 그 공사를 위한 시설의 소유·사용·관리로 인하여 발생한 우연한 사고로 타인의 신체 또는 재물에 손해를 입혀 부담하는 법률상 배상책임을 보상한다.\n\nⅡ. 도급인의 책임\n1. 원칙 — 민법 제757조에 따라 도급인은 수급인이 그 일에 관하여 제3자에게 가한 손해를 배상할 책임이 없다.\n2. 예외 — 도급 또는 지시에 관하여 도급인에게 중대한 과실이 있는 경우에는 책임을 진다.\n3. 실질적 지휘·감독 — 도급인이 수급인을 실질적으로 지휘·감독하였다면 민법 제756조의 사용자책임이 성립할 수 있다.\n\nⅢ. 수급인의 책임\n수급인은 자신의 과실로 제3자에게 손해를 가한 경우 민법 제750조의 불법행위책임을, 자신의 피용자의 행위에 대하여는 제756조의 사용자책임을 진다.\n\nⅣ. 보험처리\n1. 피보험자가 도급인인지 수급인인지에 따라 담보 범위가 달라진다.\n2. 추가피보험자 특약으로 도급인을 피보험자에 포함시키는 경우가 많다.\n3. 근로자 재해는 면책되므로 근재보험으로 처리한다.\n\nⅤ. 결론\n도급관계 사고는 지휘·감독의 실질을 확인하여 책임주체를 먼저 확정하여야 한다.`},
      {q:"영업배상책임보험에서 '점진적 오염으로 인한 손해'를 면책으로 하는 취지와 환경오염 관련 담보의 필요성을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 면책조항의 내용\n티끌, 먼지, 석면, 소음, 악취, 매연 등이 서서히 축적되어 발생한 손해는 보상하지 않는다.\n\nⅡ. 면책의 취지\n1. 우연성의 결여 — 점진적으로 진행되는 손해는 예견 가능하므로 보험사고의 우연성 요건을 갖추기 어렵다.\n2. 손해액의 거대성과 장기성 — 환경오염 손해는 규모가 크고 발현 시점이 늦어 통상의 배상책임보험 요율로는 인수하기 어렵다.\n3. 손해 발생 시점의 특정 곤란 — 담보기준(사고발생기준)을 적용하기 어렵다.\n\nⅢ. 예외적 담보\n1. 급격하고 우연한 오염사고 — 갑작스러운 유출사고 등은 담보하는 경우가 있다.\n2. 환경오염배상책임보험 — 환경오염피해 배상책임 및 구제에 관한 법률에 따라 일정 시설에 가입이 의무화되어 별도로 담보한다.\n\nⅣ. 실무상 유의\n사고의 급격성 여부, 오염물질의 노출 기간, 손해의 발현 시점을 확인하여 면책 여부를 판단하여야 한다.\n\nⅤ. 결론\n점진적 오염은 통상의 배상책임보험이 아니라 전용 상품으로 담보하여야 하는 위험이다.`},
      {q:"영업배상책임보험 사례에서 특별약관별로 보상책임을 검토하는 순서를 설명하고, 복수의 특약이 관련되는 경우의 처리를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 검토 순서\n1. 사고의 유형 파악 — 시설사고인지, 보관 중인 재물의 손해인지, 공사 중 사고인지 확인한다.\n2. 가입 특별약관의 확인 — 보험증권상 가입된 특약을 모두 확인한다.\n3. 특약별 담보위험 해당 여부 — 각 특약의 담보위험에 해당하는지 개별적으로 판단한다.\n4. 면책사유 검토 — 보통약관과 각 특약의 면책조항을 적용한다.\n5. 보상한도액과 자기부담금의 확인\n\nⅡ. 복수의 특약이 관련되는 경우\n1. 담보 대상이 다르면 각각 적용한다. 예컨대 매장에서 손님이 넘어져 다치고 맡긴 물건이 파손되었다면, 신체손해는 시설소유관리자 특약, 재물손해는 보관자 특약으로 처리한다.\n2. 동일한 손해에 복수 특약이 중복 적용되는 경우 약관의 '다른 보험과의 관계' 조항에 따라 처리한다.\n3. 하나의 특약에서 면책이더라도 다른 특약에서 담보될 수 있으므로 모든 특약을 검토하여야 한다.\n\nⅢ. 답안 작성\n피해자별·손해항목별로 표를 만들어 어느 특약에서 얼마를 지급하는지 정리하면 명확하다.\n\nⅣ. 결론\n특약별로 나누어 검토하지 않으면 담보를 누락하게 되므로, 가입 특약을 모두 나열하고 하나씩 대입하는 것이 안전하다.`},
      {q:"영업배상책임보험의 보상한도액 설정방식과 자기부담금의 종류를 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 보상한도액의 설정방식\n1. 1인당 한도(Per Person) — 피해자 1인에 대한 최대 보상액\n2. 1사고당 한도(Per Occurrence) — 하나의 사고에 대한 최대 보상액\n3. 연간 총한도(Aggregate) — 보험기간 중 지급하는 보험금의 총액 한도\n4. 대인·대물 구분 — 신체손해와 재물손해에 각각 별도의 한도를 두는 방식\n\nⅡ. 자기부담금의 종류\n1. 공제방식(Deductible) — 손해액에서 일정액을 공제하고 초과분만 지급\n2. 프랜차이즈(Franchise) — 손해액이 일정액을 초과하면 전액 지급, 미달하면 지급하지 않음\n3. 1사고당 자기부담금과 연간 총자기부담금(Aggregate Deductible)\n\nⅢ. 적용 순서\n손해배상금 확정 → 자기부담금 공제 → 보상한도액 적용\n\nⅣ. 중복보험에서의 의의\n독립책임액은 '손해배상금 − 자기부담금'과 '보상한도액' 중 작은 금액이므로, 자기부담금과 한도의 설정방식이 안분 결과에 직접 영향을 미친다.\n\nⅤ. 결론\n보험증권상 한도의 종류와 자기부담금의 방식을 정확히 읽는 것이 계산의 전제이다.`}

       body:`<p><b>담보</b> — 피보험자가 제조·판매·공급한 <b>생산물</b>의 결함이나 <b>완성된 작업</b>의 하자로 타인의 신체나 재물에 손해를 입혀 부담하는 법률상 배상책임</p>

      {h:"제조물책임법", freq:F(3,[44,47]),
       body:`<p><b>Ⅰ. 결함의 3유형</b></p>
       <ol><li><b>제조상 결함</b> — 제조업자가 제조·가공상의 주의의무를 이행하였는지에 관계없이 제조물이 <b>원래 의도한 설계와 다르게</b> 제조·가공되어 안전하지 못하게 된 경우</li>
       <li><b>설계상 결함</b> — <b>합리적인 대체설계</b>를 채용하였더라면 피해나 위험을 줄이거나 피할 수 있었음에도 대체설계를 채용하지 아니하여 안전하지 못하게 된 경우</li>
       <li><b>표시상 결함</b> — 합리적인 <b>설명·지시·경고</b> 또는 그 밖의 표시를 하였더라면 피해나 위험을 줄이거나 피할 수 있었음에도 이를 하지 아니한 경우</li></ol>
       <p><b>Ⅱ. 징벌적 손해배상</b>(제3조의2) — 제조업자가 결함을 <b>알면서도</b> 그 결함에 대하여 필요한 조치를 취하지 아니하여 생명 또는 신체에 <b>중대한 손해</b>를 입은 자가 있는 경우, 그 손해의 <b>3배를 넘지 아니하는 범위</b>에서 배상책임을 진다.</p>
       <p>배상액 산정 시 고려사항 — 고의성의 정도, 손해의 정도, 제조업자가 취득한 경제적 이익, 형사처벌·행정처분의 정도, 제조물 공급 기간과 수량, 재산상태, 피해구제 노력의 정도</p>
       <p><b>Ⅲ. 면책사유</b>(제4조)</p>
       <ul><li>제조업자가 해당 제조물을 <b>공급하지 아니하였다는</b> 사실</li>
       <li>제조물을 공급한 당시의 <b>과학·기술 수준으로는 결함의 존재를 발견할 수 없었다</b>는 사실 (<b>개발위험의 항변</b>)</li>
       <li>제조물의 결함이 제조업자가 해당 제조물을 공급한 당시의 <b>법령에서 정하는 기준을 준수</b>함으로써 발생하였다는 사실</li>
       <li>원재료·부품의 경우 그 결함이 <b>완성품 제조업자의 설계 또는 제작에 관한 지시</b>로 인하여 발생하였다는 사실</li></ul>
       <p>다만 제조업자가 결함의 존재를 알면서도 필요한 조치를 하지 아니한 경우에는 <b>면책을 주장할 수 없다.</b></p>`,
       mnemo:{key:"제 · 설 · 표 / 3배 / 공·개·법·지", how:"결함 3유형 — <b>제</b>조상 · <b>설</b>계상 · <b>표</b>시상.<br>징벌적 손배 — <b>알면서 방치</b>하면 <b>3배</b> 이내.<br>면책 4가지 — <b>공</b>급 안 함 · <b>개</b>발위험 · <b>법</b>령기준 준수 · 완성품업자 <b>지</b>시."}},

    quiz:[
      {q:"제조물의 결함의 의미와 징벌적 손해배상책임에 대하여 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 결함의 의미\n제조물이 통상적으로 기대할 수 있는 안전성을 결여한 상태를 말하며, 제조물책임법은 다음 3유형으로 구분한다.\n1. 제조상 결함 — 제조업자가 제조·가공상의 주의의무를 이행하였는지에 관계없이 제조물이 원래 의도한 설계와 다르게 제조·가공되어 안전하지 못하게 된 경우\n2. 설계상 결함 — 합리적인 대체설계를 채용하였더라면 피해나 위험을 줄이거나 피할 수 있었음에도 대체설계를 채용하지 아니하여 안전하지 못하게 된 경우\n3. 표시상 결함 — 합리적인 설명·지시·경고 또는 그 밖의 표시를 하였더라면 피해나 위험을 줄이거나 피할 수 있었음에도 이를 하지 아니한 경우\n\nⅡ. 징벌적 손해배상책임 (제3조의2)\n1. 요건 — 제조업자가 결함을 알면서도 그 결함에 대하여 필요한 조치를 취하지 아니한 결과로 생명 또는 신체에 중대한 손해를 입은 자가 있을 것\n2. 효과 — 그 손해의 3배를 넘지 아니하는 범위에서 배상책임을 진다.\n3. 고려사항 — 고의성의 정도, 손해의 정도, 제조업자가 취득한 경제적 이익, 형사처벌이나 행정처분의 정도, 공급 기간과 수량, 재산상태, 피해구제 노력의 정도\n\nⅢ. 보험과의 관계\n징벌적 손해배상금은 제재적 성격을 가지므로 배상책임보험에서 면책하는 것이 일반적이다.`},
      {q:"제조물책임법에서 규정하고 있는 제조업자의 면책사유를 약술하시오. (5점)", pts:5, lik:3,
       a:`1. 제조업자가 해당 제조물을 공급하지 아니하였다는 사실\n2. 제조업자가 해당 제조물을 공급한 당시의 과학·기술 수준으로는 결함의 존재를 발견할 수 없었다는 사실 — 개발위험의 항변\n3. 제조물의 결함이 제조업자가 해당 제조물을 공급한 당시의 법령에서 정하는 기준을 준수함으로써 발생하였다는 사실\n4. 원재료나 부품의 경우에는 그 원재료나 부품을 사용한 제조물 제조업자의 설계 또는 제작에 관한 지시로 인하여 결함이 발생하였다는 사실\n\n※ 다만 제조업자가 제조물을 공급한 후에 그 제조물에 결함이 존재한다는 사실을 알거나 알 수 있었음에도 그 결함으로 인한 손해의 발생을 방지하기 위한 적절한 조치를 하지 아니한 경우에는 위 2호부터 4호까지의 면책을 주장할 수 없다.`},
      {q:"생산물배상책임보험의 담보내용과 보상하지 않는 손해를 설명하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 담보내용\n피보험자가 제조·판매·공급한 생산물의 결함이나 완성된 작업의 하자로 인하여 타인의 신체에 장해를 입히거나 재물을 망가뜨려 부담하는 법률상 배상책임을 보상한다.\n\nⅡ. 담보의 범위\n1. 확대손해만 담보한다. 즉 결함 있는 생산물로 인하여 사람이 다치거나 다른 재산이 손해를 입은 경우를 담보한다.\n2. 담보기준은 사고발생기준 또는 배상청구기준으로 정할 수 있으며, 수출 관련 계약에서는 청구기준이 일반적이다.\n\nⅢ. 보상하지 않는 손해\n1. 생산물 자체의 손해 — 하자담보책임(계약책임)의 문제이다.\n2. 생산물의 수리·교환·회수에 소요되는 비용 — 리콜비용은 별도 특약으로 담보한다.\n3. 생산물의 성능이나 품질에 대한 보증 불이행으로 인한 손해\n4. 피보험자의 고의, 계약에 의하여 가중된 배상책임\n5. 벌과금 및 징벌적 손해배상금\n\nⅣ. 결론\n'물건 자체의 손해는 담보하지 않는다'는 원칙이 이 보험의 핵심이며, 리콜 위험은 별도 상품으로 관리하여야 한다.`},
      {q:"배상책임보험의 담보기준인 사고발생기준과 배상청구기준을 비교하고, 청구기준에서 소급담보일자와 보고기간 연장의 의의를 설명하시오. (15점)", pts:15, lik:2,
       a:`Ⅰ. 사고발생기준(Occurrence Basis)\n1. 내용 — 보험기간 중에 사고가 발생한 건을 담보한다. 청구 시점은 묻지 않는다.\n2. 장점 — 피보험자에게 담보 범위가 명확하고 담보 공백이 없다.\n3. 단점 — 보험자가 장기간 책임을 부담하므로 준비금 산정이 어렵다.\n\nⅡ. 배상청구기준(Claims-made Basis)\n1. 내용 — 보험기간 중에 피보험자에게 배상청구가 제기된 건을 담보한다.\n2. 장점 — 보험자가 보험기간 종료 후의 책임에서 벗어나 장기 리스크 관리가 용이하다.\n3. 단점 — 계약을 갱신하지 않으면 담보 공백이 생긴다.\n\nⅢ. 소급담보일자(Retroactive Date)\n1. 의의 — 그 날짜 이후에 발생한 사고에 대한 청구만 담보한다는 기준일이다.\n2. 기능 — 계약 이전의 미지의 사고까지 담보하는 것을 방지한다.\n3. 실무 — 계약을 갱신할 때 소급담보일자를 최초 가입일로 유지하여야 담보 공백이 생기지 않는다.\n\nⅣ. 보고기간 연장(ERP, Extended Reporting Period)\n1. 의의 — 계약 종료 후 일정 기간 내에 제기된 청구까지 담보하는 장치이다.\n2. 기능 — 청구기준의 담보 공백을 보완한다.\n3. 종류 — 자동으로 부여되는 단기 연장과 추가 보험료로 매입하는 장기 연장이 있다.\n\nⅤ. 결론\n의료·생산물·환경 등 사고와 청구 사이 시차가 큰 Long-tail 위험에는 청구기준이 사용되며, 소급담보일자와 ERP를 함께 확인하여야 담보 여부를 정확히 판단할 수 있다.`},
      {q:"생산물배상책임보험에서 '리콜비용'의 담보 여부와 리콜보험의 필요성을 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 리콜비용의 의의\n제조물에 결함이 발견되어 이를 회수·검사·수리·교환·폐기하는 데 소요되는 비용을 말한다.\n\nⅡ. 생산물배상책임보험에서의 담보 여부\n1. 원칙적으로 면책이다. 생산물배상책임보험은 결함으로 인하여 제3자에게 발생한 확대손해를 담보하는 것이지, 생산물 자체의 문제를 해결하는 비용을 담보하지 않는다.\n2. 회수·수리·교환 비용은 하자담보책임의 이행비용으로서 손해배상책임과 구별된다.\n\nⅢ. 리콜보험의 필요성\n1. 리콜비용은 사고가 발생하기 전 예방 단계에서 지출되며 금액이 매우 크다.\n2. 리콜을 지연하면 확대손해가 발생하고 징벌적 손해배상의 요건이 될 수 있으므로, 신속한 리콜을 재정적으로 뒷받침할 필요가 있다.\n3. 브랜드 신뢰 회복 비용, 매출 감소 손실 등도 담보 대상이 될 수 있다.\n\nⅣ. 담보 항목\n회수·운송·보관·폐기 비용, 통지 비용, 임시 인력 비용, 컨설팅 비용 등\n\nⅤ. 결론\n생산물배상책임보험과 리콜보험은 담보 국면이 다르므로 함께 설계하여야 위험을 온전히 이전할 수 있다.`},
      {q:"제조물책임에서 '제조업자'의 범위와 공급자의 책임을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 제조업자의 범위\n1. 제조물의 제조·가공 또는 수입을 업으로 하는 자\n2. 제조물에 성명·상호·상표 또는 그 밖에 식별 가능한 기호 등을 사용하여 자신을 제조업자로 표시한 자 또는 제조업자로 오인하게 할 수 있는 표시를 한 자 — 이른바 표시제조업자\n\nⅡ. 공급자의 책임\n1. 원칙 — 단순한 판매업자 등 공급자는 제조업자가 아니므로 제조물책임을 지지 않는다.\n2. 예외 — 피해자가 제조업자를 알 수 없는 경우, 공급자가 상당한 기간 내에 제조업자 또는 자신에게 제조물을 공급한 자를 피해자에게 알려주지 아니한 때에는 손해를 배상하여야 한다.\n3. 취지 — 피해자가 배상책임자를 찾지 못하여 구제받지 못하는 것을 방지하기 위함이다.\n\nⅢ. 보험실무상 의의\n1. 판매업자도 공급자 책임을 질 수 있으므로 생산물배상책임보험 가입이 필요하다.\n2. 제조자의 보험에 판매인을 추가피보험자로 편입하는 Additional Insured(Vendors) 특약이 활용된다.\n\nⅣ. 결론\n제조업자의 범위와 공급자 책임을 확인하여야 배상책임자와 담보 관계를 정확히 특정할 수 있다.`},
      {q:"전문직업배상책임보험의 특징을 일반 배상책임보험과 비교하여 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 담보 대상\n1. 일반 배상책임보험 — 시설·업무수행 등으로 인한 신체·재물 손해\n2. 전문직업배상책임보험 — 전문직업인의 업무상 과실로 인한 손해로서, 재산상 손해(경제적 손실)도 담보 대상이 되는 경우가 많다.\n\nⅡ. 담보기준\n1. 일반 — 사고발생기준이 원칙\n2. 전문직업 — 배상청구기준이 원칙이며 소급담보일자와 ERP가 수반된다.\n\nⅢ. 과실의 판단\n전문직업인에게는 그 직업에 요구되는 고도의 주의의무가 적용되므로 일반인의 주의의무보다 높은 기준으로 판단한다.\n\nⅣ. 손해의 특성\n1. 사고와 청구 사이 시차가 크다(Long-tail).\n2. 손해액이 크고 분쟁이 장기화되는 경향이 있다.\n3. 방어비용의 비중이 높아 소송비용 담보가 중요하다.\n\nⅤ. 주요 종목\n의사·병원, 변호사, 회계사, 건축사, 감정평가사, 임원배상책임(D&O) 등\n\nⅥ. 결론\n담보기준과 주의의무 수준의 차이가 두 보험을 구분하는 핵심이다.`},
      {q:"제조물책임 사례에서 피해자가 입증하여야 할 사항과 입증책임 완화 법리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 피해자의 입증사항\n1. 제조물에 결함이 존재하였다는 사실\n2. 손해가 발생하였다는 사실\n3. 결함과 손해 사이의 인과관계\n※ 제조업자의 고의·과실은 입증할 필요가 없다(무과실책임).\n\nⅡ. 입증의 어려움\n제조물의 구조와 제조공정은 제조업자의 지배영역에 있어 피해자가 결함을 직접 입증하기 어렵다.\n\nⅢ. 입증책임 완화 법리\n1. 판례는 제조물이 정상적으로 사용되는 상태에서 사고가 발생하였고, 그 사고가 제조업자의 배타적 지배영역에서 발생한 것임을 증명하면 결함과 인과관계를 추정한다.\n2. 제조물책임법은 정상적으로 사용되는 상태에서 손해가 발생하였고 그 손해가 제조업자의 실질적 지배영역에 속한 원인으로부터 초래되었으며 통상적으로 결함 없이는 발생하지 않는다는 사실을 증명하면 결함과 인과관계를 추정하는 규정을 두고 있다.\n\nⅣ. 제조업자의 반증\n제조업자는 그 손해가 결함이 아닌 다른 원인으로 발생하였음을 증명하면 추정을 번복할 수 있다.\n\nⅤ. 결론\n입증책임 완화로 피해자 보호가 강화되었으므로, 보험실무에서는 사고 경위와 사용 상태에 관한 자료 확보가 중요하다.`},
      {q:"영업배상책임보험과 생산물배상책임보험의 담보 경계를 사례를 들어 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 담보의 기본 구분\n1. 영업배상책임보험 — 피보험자의 시설이나 업무수행 자체로 인한 사고\n2. 생산물배상책임보험 — 피보험자의 손을 떠난 생산물이나 완성된 작업으로 인한 사고\n\nⅡ. 구분의 기준\n1. 사고의 원인이 시설·업무 수행 중에 있었는지, 아니면 공급이 완료된 생산물에 있었는지\n2. 시간적으로 피보험자의 점유·관리 하에 있었는지, 아니면 이미 인도되었는지\n\nⅢ. 사례\n1. 음식점에서 손님이 미끄러져 다친 경우 — 시설사고이므로 영업배상책임보험(시설소유관리자 특약)\n2. 음식점에서 제공한 음식으로 식중독이 발생한 경우 — 제공된 생산물의 결함이므로 생산물배상책임보험. 다만 영업배상책임보험에 음식물배상책임 특약이 부가되어 있으면 그 특약으로 처리한다.\n3. 공사 중 낙하물로 행인이 다친 경우 — 도급업자 특약(영업배상책임)\n4. 완성된 건물의 하자로 사고가 난 경우 — 완성작업 위험으로서 생산물배상책임의 영역\n\nⅣ. 실무상 유의\n두 보험 모두 가입한 경우 어느 담보가 적용되는지에 따라 보상한도와 자기부담금이 달라지므로 사고 원인의 특정이 중요하다.\n\nⅤ. 결론\n'인도 전인가 인도 후인가'가 가장 실용적인 구분 기준이다.`},
      {q:"제조물책임보험에서 '완성작업 위험'의 의의와 담보 여부를 설명하시오. (10점)", pts:10, lik:1,
       a:`Ⅰ. 완성작업 위험의 의의\n피보험자가 수행한 작업이 완료되어 발주자에게 인도된 후, 그 작업의 하자로 인하여 타인에게 손해가 발생할 위험을 말한다.\n\nⅡ. 생산물배상책임보험에서의 지위\n생산물배상책임보험은 생산물의 결함뿐 아니라 완성된 작업의 하자로 인한 배상책임도 함께 담보하는 것이 일반적이다. 두 위험 모두 '피보험자의 지배를 떠난 후'에 발생한다는 공통점이 있다.\n\nⅢ. 도급업자 배상책임보험과의 구분\n1. 도급업자 특약 — 공사 <b>수행 중</b>의 사고\n2. 완성작업 위험 — 공사 <b>완료 후</b>의 사고\n3. 따라서 작업의 완료 시점이 담보 구분의 기준이 된다.\n\nⅣ. 담보에서 제외되는 것\n완성된 작업 자체의 하자를 보수하는 비용은 하자담보책임의 이행이므로 담보하지 않는다. 그 하자로 인하여 발생한 확대손해만 담보한다.\n\nⅤ. 결론\n작업 완료 시점의 확정과, 손해가 작업 자체의 손해인지 확대손해인지의 구별이 실무의 핵심이다.`}
    ],

      {h:"신체손해배상특약부 화재보험", freq:F(2,[44]),
       body:`<p><b>근거</b> — 화재로 인한 재해보상과 보험가입에 관한 법률. <b>특수건물</b>의 소유자는 그 건물의 화재로 타인이 사망하거나 부상한 경우의 손해를 배상할 책임을 지며, 이를 담보하는 보험 가입이 강제된다.</p>
       <ul><li><b>특수건물</b> — 국유건물, 학교, 병원, 공장, 공연장, 백화점, 시장, 다중이용시설 등 법령이 정한 일정 규모 이상의 건물</li>
       <li><b>책임의 성질</b> — 소유자는 화재의 <b>과실 유무를 묻지 않고</b> 배상책임을 진다(실화책임법의 적용 배제).</li>
       <li><b>'타인'의 범위</b> — 건물의 소유자와 그 배우자·직계가족을 제외한 자. 44회가 이 '타인'의 범위를 물었다.</li>
       <li>다중이용업소 화재배상책임보험의 '타인'과 비교하는 문제가 44회에 출제되었다.</li></ul>`},

      {h:"중대재해처벌법과 배상책임", freq:F(3,[48,49]),
       body:`<p><b>중대재해처벌법의 구조</b></p>
       <ul><li><b>중대산업재해</b> — 사망자 1명 이상, 동일한 사고로 6개월 이상 치료가 필요한 부상자 2명 이상, 동일한 유해요인으로 급성중독 등 직업성 질병자 1년 이내 3명 이상</li>
       <li><b>중대시민재해</b> — 특정 원료·제조물, 공중이용시설, 공중교통수단의 결함으로 인한 재해</li>
       <li><b>의무주체</b> — 사업주와 <b>경영책임자등</b>. 안전보건확보의무를 부담한다.</li>
       <li><b>제재</b> — 형사처벌(징역·벌금)과 함께, 고의 또는 중대한 과실로 의무를 위반하여 중대재해를 발생시킨 경우 손해액의 <b>5배를 넘지 않는 범위</b>에서 <b>징벌적 손해배상</b>책임을 진다.</li></ul>
       <p><b>중대재해 배상책임보험</b> — 경영책임자 등이 부담하는 손해배상책임을 담보한다. 다만 <b>벌금·과태료와 징벌적 손해배상금은 면책</b>하는 것이 일반적이며, 형사방어비용 담보 여부는 약관에 따른다.</p>
       <div class="lead">근재보험과의 관계 — 같은 사고에서 근로자에 대한 배상책임은 <b>근재보험(사용자배상책임)</b>이, 경영책임자 개인의 책임은 <b>중대재해 배상책임보험</b>이 담보하여 층위가 다르다.</div>`,
       mnemo:{key:"1 · 2 · 3 / 5배", how:"중대산업재해 기준 — 사망 <b>1</b>명, 6개월 이상 부상 <b>2</b>명, 직업성 질병 <b>3</b>명.<br>징벌적 손해배상은 <b>5배</b> 이내(제조물책임의 3배와 구별).<br>벌금·징벌적 손배는 보험에서 <b>면책</b>."}},

      {h:"선원법상 재해보상", freq:F(2,[44]),
       body:`<p>선원의 직무상 재해에 대하여는 근로기준법이 아니라 <b>선원법</b>이 적용된다. 44회가 선원법상 수급권자와 상속비율을 물었다.</p>
       <ul><li><b>요양보상</b> — 선박소유자는 직무상 부상·질병에 대하여 요양을 시키거나 요양비를 지급한다.</li>
       <li><b>상병보상</b> — 요양 중인 선원에게 <b>통상임금의 100%</b>(4개월 범위) 등 근로기준법보다 두터운 보상을 한다.</li>
       <li><b>장해보상</b> — 장해등급에 따른 <b>승선평균임금</b>의 일정 일수</li>
       <li><b>유족보상</b> — 승선평균임금의 <b>1,300일분</b></li>
       <li><b>장례비</b> — 승선평균임금의 <b>120일분</b></li>
       <li><b>수급권자의 순위</b> — 선원법 시행령이 배우자, 자녀, 부모, 손, 조부모 등의 순위를 정하며, 근로기준법과 순위·비율이 다를 수 있으므로 <b>선원법 기준</b>을 적용한다.</li></ul>
       <div class="warn">보상 일수와 임금 기준(승선평균임금)은 근로기준법과 다르다. 문제에서 선원법 사안임이 드러나면 <b>근로기준법 기준을 그대로 쓰면 안 된다.</b></div>`,
       mnemo:{key:"선원은 더 두텁다", how:"선원법은 근로기준법보다 <b>보상이 두텁다</b> — 유족 <b>1,300일</b>(근기법 1,000일), 장례비 <b>120일</b>(근기법 90일).<br>기준 임금도 <b>승선평균임금</b>으로 다르다."}},

      {h:"가스사고 배상책임보험", freq:F(2,[48]),
       body:`<p>도시가스사업법·액화석유가스의 안전관리 및 사업법에 따라 가스공급자 등에게 가입이 강제되는 의무보험이다.</p>
       <ul><li><b>담보</b> — 가스의 제조·저장·판매·공급 및 사용 과정에서 발생한 사고로 타인의 신체나 재산에 손해를 입혀 부담하는 배상책임</li>
       <li><b>액화석유가스 소비자보장 특약</b> — 소비자의 시설에서 발생한 사고까지 담보범위를 확장한다. 48회 사례에 등장했다.</li>
       <li><b>보상한도</b> — 법령이 정한 최저한도 이상으로 가입하여야 하며 1인당·1사고당 한도가 함께 설정된다.</li>

      {h:"법정 의무보험 전체 지도 — 4종이 아니라 15종이다", freq:F(3,[42,44,45,48,49]),

      {h:"급별 보상한도 3그룹", freq:F(3,[42,48,49]),
       body:`<div class="scroller"><table class="mini">
       <tr><th>그룹</th><th>사망</th><th>후유장해</th><th>부상</th><th>해당 보험</th></tr>
       <tr><td><b>8,000만원군</b></td><td>8,000만원</td><td>8,000만 ~ 500만원</td><td>1,500만 ~ 20만원</td><td>승강기, 맹견 등</td></tr>
       <tr><td><b>1억원군</b></td><td>1억원</td><td>1억 ~ 630만원</td><td>2,000만 ~ 80만원</td><td>어린이놀이시설, 야영장(최저 2,000만원) 등</td></tr>
       <tr><td><b>1.5억원군</b></td><td>1.5억원</td><td>1.5억 ~ 1,000만원</td><td>3,000만 ~ 50만원</td><td>가스사고, 다중이용업소(14급 80만원), 재난, 청소년수련시설(최저 2,000만원) 등</td></tr>
       </table></div>
       <div class="warn"><b>한도는 계속 바뀐다.</b> 어린이놀이시설은 8,000만원군에서 1억원군으로, 가스사고는 1.5억원군으로 상향됐다. <b>문제에 한도가 제시되면 제시된 값을 쓰고</b>, 없으면 계약의 책임개시일 기준으로 특정한 뒤 그 근거를 답안에 밝힌다.</div>
       <p><b>한도의 결합 규칙</b></p>
       <ul><li><b>부상 + 사망</b> — 재난·옥외광고물은 <b>합산액 1억 8천만원 범위</b> 내에서 지급. 신배책·다중이용업소 등은 각각 한도를 적용한 뒤 합산.</li>
       <li><b>후유장해 + 사망</b> — 재난·옥외광고물은 사망액에서 장해액 중 <b>사망일 이후분</b>을 차감. 나머지는 <b>사망액 − 장해액</b>.</li></ul>`},

      {h:"부상등급 조정 7규칙", freq:F(3,[45,48,49]),
       body:`<p>재난·야영장·수련시설 등 급수별 한도형 의무보험에 공통으로 적용되는 조정 규칙이다. 계산문제의 함정이 여기 숨는다.</p>
       <ol><li><b>개방성 골절</b> — 2급 ~ 11급 중 개방성 골절은 <b>1등급 상위</b> 금액을 적용</li>
       <li><b>단순 선상골절, 전위 없는 골절</b> — <b>1등급 하위</b></li>
       <li><b>2가지 이상 중복</b> — 최고등급부터 <b>하위 3등급 이내</b>일 때에만 1등급 상향(병급)</li>
       <li><b>일반외상 + 치과보철</b> — 각각 산정하되 <b>1급 금액을 초과하지 않는 범위</b>에서 합산</li>
       <li><b>조정요인이 2개 이상</b>이면 <b>큰 폭으로 1회만</b> 조정. 상향요인과 하향요인이 함께 있으면 각각 1회씩</li>
       <li><b>만 13세 미만 소아</b>는 별도 기준을 적용</li>
       <li><b>피판술·피부이식</b> — 안면부는 1등급 상향, 수부·족부는 1등급 하향</li></ol>
       <div class="warn">"개방성"이라는 단어가 문제에 나오면 무조건 <b>1등급 위</b>를 본다. "선상골절", "전위 없는"이 나오면 <b>1등급 아래</b>다. 이 두 단어만 챙겨도 배점을 지킨다.</div>`,
       mnemo:{key:"개↑ 선↓ · 3등급 병급 · 1회만", how:"<b>개</b>방성은 위로, <b>선</b>상은 아래로.<br>중복은 <b>하위 3등급 이내</b>일 때만 병급.<br>조정요인이 여럿이어도 <b>큰 폭 1회만</b>."}},

      {h:"선원법 재해보상 — 조문별 정리", freq:F(3,[44,48,49]),

      {f:"부상등급 병급 요건은?", b:"2가지 이상 중복 시 최고등급부터 하위 3등급 이내일 때만 1등급 상향."},
