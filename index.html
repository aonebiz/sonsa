       <b>물음</b> — 지급보험금을 산출하고, 순서를 바꾸면 어떻게 달라지는지 비교하시오.`,
       steps:[
        {t:"① 판례가 정한 순서", b:`산재보험급여와 같은 성질의 손해액에서 <b>먼저 보험급여를 공제</b>한 다음 <b>과실상계</b>를 한다.\n이를 <b>「공제 후 과실상계」</b>라 한다.`},
        {t:"② 올바른 계산 (공제 후 과실상계)", b:`(1억원 − 3,000만원) × 70% = <span class="num">4,900만원</span>`},
        {t:"③ 틀린 계산 (과실상계 후 공제)", b:`(1억원 × 70%) − 3,000만원 = <span class="num">4,000만원</span>`},
        {t:"④ 차이와 이유", b:`두 방식의 차이는 <span class="num">900만원</span>이다.\n\n「공제 후 과실상계」가 피해자에게 유리하며, 판례는 재해근로자 보호를 위해 이 방식을 취한다. 답안에는 반드시 <b>"공제 후 과실상계"</b>라는 용어를 그대로 써라.`}
       ],
       final:`지급보험금 4,900만원 — 반드시 「공제 후 과실상계」`,
       trap:`<b>함께 외울 것</b> — 사망사고에서 산재 유족급여가 지급된 경우에는 그 앞에 한 단계가 더 붙는다. <b>「상속 후 공제」</b> — 손해배상채권을 먼저 법정상속분대로 상속시킨 뒤, 유족급여를 <b>실제 수령한 수급권자의 상속분에서만</b> 공제한다. 수급권자가 아닌 다른 공동상속인의 몫에서는 공제하지 않는다(귀속주체가 달라 상호보완관계를 인정할 수 없기 때문). 전체 순서는 <b>상속 → 공제 → 과실상계</b>.`},

      {id:"c3", title:"47회형 — 가족면책·혼동·대습상속 종합", freq:F(3,[47]),
       setup:`<b>사례 (제47회 기출)</b><ul>
       <li>기명피보험자 A가 아내 B를 태우고 휴가 중 운전부주의로 추락, B 현장 사망</li>
       <li>A는 적법 면허, 음주 아님. B는 안전벨트 미착용</li>
       <li>가입: 대인배상Ⅰ, 대인배상Ⅱ(무한), 자기신체사고(사망 1억원, 수익자 미지정)</li>
       <li>유족: 배우자 A, 아버지 C, 시아버지 D, 사위 F, 외손녀 G(미성년)<br>※ 외동딸 E는 F와 결혼해 G를 낳았으나 <b>이 사고 전에 사망</b></li>
       <li>손해액 4억원 (동승자감액·과실상계 전)</li>
       <li>동승자 감액 및 과실상계 비율 <b>50%</b></li></ul>
       <b>물음</b> — 담보별 보상책임을 설명하고 유족별 지급보험금을 계산하시오. (25점)`,
       steps:[
        {t:"① 책임 — A의 운행자책임", b:`A는 운행지배와 운행이익을 가진 운행자이므로 자배법 제3조의 책임을 진다. 동시에 사고 당사자로서 민법상 불법행위책임도 진다.\nB는 운행자·운전자가 아니므로 <b>타인</b>에 해당한다.`},
        {t:"② 담보 — 세 담보를 각각 판단", b:`· <b>대인배상Ⅰ</b> : B는 타인 → <b>보상</b>\n· <b>대인배상Ⅱ</b> : B는 기명피보험자의 <b>배우자</b> → <b>가족면책</b>으로 면책\n· <b>자기신체사고</b> : B는 기명피보험자의 배우자로서 피보험자 → 면책사유 없음 → <b>보상</b>`},
        {t:"③ 손해액 조정", b:`4억원 × 50%(동승자감액 및 과실상계) = <span class="num">2억원</span>`},
        {t:"④ 대인배상Ⅰ 한도 적용", b:`조정 후 손해액 2억원 > 사망 한도 1억 5,000만원\n→ 대인배상Ⅰ 지급액 <span class="num">1억 5,000만원</span>`},
        {t:"⑤ 상속관계 정리", b:`· 상속 1순위는 직계비속(딸 E), 배우자 A는 공동상속하며 5할 가산 → <b>A 1.5 : E 1</b>\n· E는 상속개시 전 사망 → <b>대습상속</b>으로 E의 배우자 F와 자녀 G가 E의 지위를 승계\n· 아버지 C, 시아버지 D는 직계비속이 있으므로 상속인이 아니다`},
        {t:"⑥ 대인배상Ⅰ 유족별 배분", b:`1억 5,000만원을 1.5 : 1로 나눈다.\nA = 1억 5,000만 × 1.5/2.5 = <span class="num">9,000만원</span>\nE 몫 = 1억 5,000만 × 1/2.5 = <span class="num">6,000만원</span>\n\n<b>혼동</b> — A는 가해자이면서 상속인이므로 A의 상속분 9,000만원은 <b>혼동으로 소멸</b>한다.\n\nE 몫 6,000만원을 F : G = 1.5 : 1로 대습상속\nF = <span class="num">3,600만원</span>, G = <span class="num">2,400만원</span>\n(G는 미성년이므로 법정대리인 F가 수령)`},
        {t:"⑦ 자기신체사고 계산", b:`지급보험금 = 실제손해액 + 비용 − 공제액\n4억원 − 1억 5,000만원(대인배상Ⅰ 수령액) = 2억 5,000만원\n→ 사망 가입금액 <span class="num">1억원</span> 한도로 지급`},
        {t:"⑧ 자기신체사고 배분 — 혼동 없음", b:`자기신체사고는 <b>배상책임이 아니므로 혼동이 발생하지 않는다.</b> A도 받는다.\nA = 1억 × 1.5/2.5 = <span class="num">6,000만원</span>\nE 몫 = 4,000만원 → F <span class="num">2,400만원</span>, G <span class="num">1,600만원</span>`}
       ],
       final:`대인배상Ⅰ — A 0원(혼동 소멸) · F 3,600만원 · G 2,400만원\n자기신체사고 — A 6,000만원 · F 2,400만원 · G 1,600만원`,
       trap:`<b>이 문제의 핵심 함정 3개</b>\n① <b>가족면책은 대인배상Ⅱ에만</b> — 아내가 타인이라 대인Ⅰ은 나가는데 대인Ⅱ는 막힌다는 점을 놓치면 통째로 틀린다.\n② <b>혼동은 대인배상Ⅰ에만</b> — 자기신체사고는 배상책임이 아니므로 가해자 A도 받는다. 이 대비가 출제 포인트다.\n③ <b>대습상속</b> — 딸이 먼저 죽었다는 사실을 흘려보내면 사위와 외손녀를 빠뜨린다. 아버지·시아버지는 직계비속이 있어 상속인이 아니라는 점도 함께.`},

      {id:"c4", title:"44회형 — 사고부담금·손익상계·형사합의", freq:F(3,[44,45]),
       setup:`<b>사례 (제44회 기출)</b><ul>
       <li>기명피보험자 A의 직원 B가 업무지시로 운행 중, <b>면허정지 상태에서 음주운전</b>, 신호위반으로 횡단보도 보행자 C를 충격</li>
       <li>B는 현장 사망, C는 치료 중 사망</li>
       <li>A는 B의 면허정지는 몰랐으나, 음주에 대해서는 <b>간접적으로 승인·방조</b></li>
       <li>가입: 대인배상Ⅰ, 대인배상Ⅱ(무한), 자기신체사고(사망 1억원), 산재보험</li>
       <li>B — 자손 규정상 실제손해액 3억원 / 대인배상 손해방지비용 300만원 / 산재보험금 <b>예상액</b> 2억원(미지급)</li>
       <li>C — 부상보험금 3,000만원, 사망보험금 3억원 / 공무원연금 유족보상금 1억 5,000만원 수령 / 형사합의금 5,000만원 수령 후 <b>채권양도</b> 통지 완료</li></ul>
       <b>물음</b> — 사고부담금과 B·C에 대한 지급보험금을 산출하시오.`,
       steps:[
        {t:"① B에 대한 자기신체사고 — 공제액 판단", b:`자기신체사고의 공제 대상은 <b>배상의무자 이외의 제3자로부터 보상받은 금액</b>이다.\n산재보험금 2억원은 "예상액"일 뿐 <b>아직 지급받지 않았으므로 공제하지 않는다.</b>\n→ <b>공제액이 없다</b>`},
        {t:"② B의 지급보험금", b:`자기신체사고는 공제액이 없을 때 <b>비용을 지급하지 않고</b> 보험증권에 기재된 가입금액을 지급한다.\n→ 사망 가입금액 <span class="num">1억원</span>\n(손해방지비용 300만원은 지급하지 않는다)`},
        {t:"③ C의 부상보험금", b:`부상보험금 산정액 <span class="num">3,000만원</span>\n신호위반·횡단보도 사고이므로 피해자 무과실로 계산하며, 치료 중 사망이므로 상해 1급으로 본다.`},
        {t:"④ C의 사망보험금 — 손익상계", b:`공무원연금법상 유족보상금은 <b>손해의 전보를 목적</b>으로 지급되므로 손익상계 대상이다.\n형사합의금은 <b>채권양도</b>가 이루어졌으므로 피해자의 지급보험금 산정에 영향을 주지 않는다.\n\n3억원 − 1억 5,000만원(공무원연금) − 0원(채권양도) = <span class="num">1억 5,000만원</span>`},
        {t:"⑤ 대인배상Ⅰ 한도 확인", b:`C는 부상 후 사망 → 한도 합산 <span class="num">1억 8,000만원</span>\n실제 지급액 = 부상 3,000만 + 사망 1억 5,000만 = 1억 8,000만원\n→ <b>전액 대인배상Ⅰ에서 지급</b>되고 대인배상Ⅱ로 넘어가지 않는다.`},
        {t:"⑥ 사고부담금 (44회 당시 기준)", b:`대인배상Ⅰ에서만 지급되었으므로 대인배상Ⅰ의 사고부담금만 발생한다.\n무면허와 음주가 중복되었으나 <b>높은 금액 하나만</b> 납부한다.\n→ 음주 <span class="num">1,000만원</span> (개정 전 기준)\n\n<b>현행(2022.7.28. 이후 계약) 기준이라면</b> 대인배상Ⅰ 사고부담금은 <b>지급보험금 전액</b>이므로 <span class="num">1억 8,000만원</span>이 된다.`},
        {t:"⑦ 납부의무자", b:`피보험자 본인, 그리고 <b>기명피보험자의 명시적·묵시적 승인</b>이 있었다면 기명피보험자도 납부의무가 있다.\n\n묵시적 승인의 판단기준 — 소유자가 취해온 태도, 운전자와의 관계, 평소 차량의 운전·관리상황, 당해 운전이 가능하게 된 경위, 운전의 목적 등 제반 사정\n\n사례에서 A는 음주운전을 간접적으로 승인·방조하였으므로 <b>A에게도 납부의무</b>가 있다.`}
       ],
       final:`B — 자기신체사고 1억원 (비용 300만원 미지급)\nC — 대인배상Ⅰ 1억 8,000만원 (부상 3,000만 + 사망 1억 5,000만)\n사고부담금 — 개정 전 1,000만원 / 현행 기준 대인Ⅰ 지급보험금 전액`,
       trap:`<b>이 문제의 핵심 함정 3개</b>\n① <b>"예상액"은 공제하지 않는다</b> — 산재보험금 2억원을 덜컥 빼면 틀린다. 실제 수령해야 공제 대상이다.\n② <b>공제액이 없으면 비용도 없다</b> — 자기신체사고의 이 규칙을 모르면 300만원을 더해버린다.\n③ <b>채권양도된 형사합의금은 영향 없음</b> — 형사합의금 5,000만원을 빼면 틀린다. 채권양도 통지가 완료되었기 때문이다.`},

      {id:"c5", title:"49회형 — 무단운전·한정특약·자손 급별표", freq:F(3,[49]),
       setup:`<b>사례 (제49회 기출, 요약)</b><ul>
       <li>갑의 아들 A(만18세)가 아버지 주머니에서 열쇠를 몰래 꺼내 차를 반출</li>
       <li><b>무면허</b>인 친구 B가 운전, A와 C를 태우고 고속도로 과속 중 가드레일·D차량 충격</li>
       <li>A·B 부상, C·D 사망</li>
       <li>가입: <b>가족운전자 한정운전 특약 + 26세 이상 한정운전 특약</b><br>대인배상Ⅰ·Ⅱ(무한) / 자기신체사고 사망 5,000만·부상 3,000만·후유장해 5,000만</li>
       <li>자손 급별표: 부상 2급 1,600만 / 3급 1,500만 / 4급 1,400만 / 5급 1,000만<br>후유장해 10급 900만 / 11급 700만 / 12급 500만</li>
       <li>A — 부상 4급 + 부상 5급, 총 치료비 2,000만원, 후유장해 10급</li>
       <li>C — 사망, 실제손해액 6억원, <b>동승자 감액비율 50%</b></li>
       <li>D — 사망, 실제손해액 5억원, 무과실</li></ul>
       <b>물음</b> — 담보별 보상책임과 지급보험금을 산출하시오.`,
       steps:[
        {t:"① 한정운전 특약 위반 여부", b:`운전자를 가족 및 26세 이상으로 한정했는데 <b>B(가족 아님·미성년 추정)가 운전</b>했으므로 특약 위반이다.\n→ <b>대인배상Ⅰ을 제외한 모든 담보 면책</b>이 원칙\n\n다만 <b>도난당한 경우</b>는 예외이고, 판례는 도난에 <b>무단운전도 포함</b>된다고 본다.\n※ 갑의 입장에서는 '도난당한 것'이지만, 무단반출한 A의 입장에서는 '도난한 것'이므로 A에게는 예외가 적용되지 않는다는 것이 출제자의 논리다.`},
        {t:"② 피보험자 지위 확정", b:`· 갑 — 기명피보험자\n· A — 기명피보험자와 동거하는 친족으로서 차를 사용·관리 → <b>친족피보험자</b>로 볼 여지\n· B — 승낙이 없는 <b>무단운전자</b> → <b>피보험자가 아니다</b>`},

    quiz:[
 {q:"기명피보험자 A가 아내 B를 태우고 운행하다 사고로 B가 사망하였다. 손해액 4억원, 동승자감액 및 과실상계 비율 50%, 대인배상Ⅰ·Ⅱ(무한)·자기신체사고(사망 1억원) 가입. 유족은 배우자 A와 사위 F, 외손녀 G(외동딸 E는 사고 전 사망)이다. 담보별 보상책임과 유족별 지급보험금을 산출하시오. (25점)", pts:25, lik:3,
  a:`Ⅰ. 보험회사의 보상책임\n1. 대인배상Ⅰ — A는 운행자로서 자배법 제3조의 책임을 지고 B는 타인이므로 보상한다.\n2. 대인배상Ⅱ — B는 기명피보험자의 배우자이므로 가족면책조항에 해당하여 면책된다.\n3. 자기신체사고 — B는 기명피보험자의 배우자로서 피보험자에 해당하고 면책사유가 없으므로 보상한다.\n\nⅡ. 대인배상Ⅰ 지급보험금\n1. 손해액 조정 — 4억원 × 50% = 2억원\n2. 한도 적용 — 사망 한도 1억 5,000만원을 지급한다.\n3. 상속관계 — 1순위 직계비속인 딸 E와 배우자 A가 1.5 : 1로 공동상속하나, E는 상속개시 전 사망하였으므로 대습상속에 의하여 배우자 F와 자녀 G가 승계한다.\n4. 배분 — A 9,000만원, E 몫 6,000만원\n  ① A의 상속분은 가해자가 상속인이 되는 경우로서 혼동에 의하여 소멸한다.\n  ② E 몫 6,000만원은 F 3,600만원, G 2,400만원으로 대습상속되며, G는 미성년자이므로 법정대리인 F가 수령한다.\n\nⅢ. 자기신체사고 지급보험금\n1. 지급보험금 = 실제손해액 + 비용 − 공제액 = 4억원 − 1억 5,000만원 = 2억 5,000만원\n2. 사망 가입금액 1억원 한도로 지급한다.\n3. 자기신체사고는 배상책임이 아니므로 혼동이 발생하지 않아 A도 수령한다.\n  A 6,000만원, F 2,400만원, G 1,600만원\n\nⅣ. 결론\n대인배상Ⅰ에서 F 3,600만원·G 2,400만원(A는 혼동으로 소멸), 자기신체사고에서 A 6,000만원·F 2,400만원·G 1,600만원을 지급한다.`},
 {q:"음주 및 무면허 상태의 운전으로 사고가 발생하여 대인배상Ⅰ에서 부상 3,000만원과 사망 1억 5,000만원을 지급하였다. 사고부담금을 산출하고 납부의무자를 설명하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 사고부담금의 의의\n음주·무면허·뺑소니 등 중대 법규위반 사고에서 보험회사가 피해자에게 보험금을 먼저 지급하되 그 중 일정액을 피보험자에게 부담시키는 제도이다.\n\nⅡ. 산출\n1. 현행 기준(2022.7.28. 이후 계약) — 대인배상Ⅰ은 지급보험금 전액이 사고부담금이므로 1억 8,000만원이다.\n2. 무면허와 음주가 중복된 경우 가장 높은 금액 하나만 납부한다.\n3. 1사고당 기준이므로 피해자가 여럿이어도 사고 단위로 산정한다.\n\nⅢ. 납부의무자\n1. 원칙 — 음주·무면허 운전을 한 피보험자 본인\n2. 확장 — 기명피보험자의 명시적·묵시적 승인이 있었다면 기명피보험자도 납부의무를 진다.\n3. 묵시적 승인의 판단기준 — 소유자가 그동안 취해온 태도, 해당 운전자와의 관계, 평소 차량의 운전 및 관리상황, 당해 운전이 가능하게 된 경위, 운전의 목적 등 제반 사정\n\nⅣ. 관련 문제\n무단운전자와 같이 피보험자가 아닌 자라도 자배법 제29조의 '법률상 손해배상책임이 있는 자'에 해당하면 구상할 수 있다.`},
 {q:"업무 중 자동차사고로 손해액 1억원이 발생하였고 피해자 과실은 30%이며 산재보험 휴업급여 3,000만원을 수령하였다. 지급보험금 산정 시 공제와 과실상계의 순서를 설명하고 금액을 산출하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 쟁점\n산재보험급여의 공제와 과실상계의 적용 순서\n\nⅡ. 판례의 태도 — 공제 후 과실상계\n산재보험법에 따라 보험급여를 받은 재해근로자가 제3자를 상대로 손해배상을 청구할 때 그 손해 발생에 재해근로자의 과실이 경합된 경우에는, 보험급여와 같은 성질의 손해액에서 먼저 보험급여를 공제한 다음 과실상계를 하는 '공제 후 과실상계' 방식으로 산정하여야 한다.\n\nⅢ. 산정\n1. 공제 후 과실상계 — (1억원 − 3,000만원) × 70% = 4,900만원\n2. 과실상계 후 공제(잘못된 방식) — (1억원 × 70%) − 3,000만원 = 4,000만원\n3. 차액 900만원만큼 공제 후 과실상계가 피해자에게 유리하다.\n\nⅣ. 사망사고의 경우\n유족급여가 지급된 때에는 '상속 후 공제'가 선행한다. 손해배상채권을 법정상속분에 따라 먼저 상속시킨 뒤 유족급여를 실제 수령한 수급권자의 상속분에서만 공제하며, 수급권자가 아닌 공동상속인의 상속분에서는 공제하지 않는다.\n\nⅤ. 결론\n지급보험금은 4,900만원이며, 전체 순서는 상속 → 공제 → 과실상계이다.`},
 {q:"만 40세 남성이 사고로 즉시 사망하였다. 월평균 현실소득 400만원, 가동연한 65세, 피해자 과실 20%, 대인배상Ⅰ·Ⅱ(무한) 가입. 손해액과 담보별 지급보험금을 산출하시오. (20점)", pts:20, lik:3,
  a:`Ⅰ. 손해 항목의 구성\n사망사고이므로 장례비, 사망 위자료, 상실수익액으로 구성된다.\n\nⅡ. 항목별 산정\n1. 장례비 — 약관 지급기준상 500만원\n2. 사망 위자료 — 사망 당시 40세로 65세 미만이므로 8,000만원\n3. 상실수익액\n  ① 생계비 공제 — 400만원 × 2/3 = 월 266만 6,667원\n  ② 취업가능기간 — 65세까지 25년, 300개월이나 호프만계수는 240을 상한으로 한다.\n  ③ 상실수익액 = 266만 6,667원 × 240 ≒ 6억 4,000만원\n\nⅢ. 손해액 합계\n500만원 + 8,000만원 + 6억 4,000만원 = 7억 2,500만원\n\nⅣ. 과실상계\n7억 2,500만원 × 80% = 5억 8,000만원\n\nⅤ. 담보별 배분\n1. 대인배상Ⅰ — 사망 한도 1억 5,000만원\n2. 대인배상Ⅱ — 5억 8,000만원 − 1억 5,000만원 = 4억 3,000만원\n\nⅥ. 결론\n총 5억 8,000만원을 지급하며, 대인배상Ⅰ에서 1억 5,000만원, 대인배상Ⅱ에서 4억 3,000만원을 부담한다.`},
 {q:"자동차보험 계산문제에서 <기왕증 공제>·<동승자 감액>·<과실상계>·<손익상계>의 적용 순서를 쓰고, 산재보험급여가 개입된 경우와 어떻게 다른지 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 약관상 일반적 적용순서\n1. 기왕증 공제 — 기왕증 관여도를 반영하여 피해자의 실제손해액을 확정한다.\n2. 동승자 감액 — 무상동승의 경우 유형별 감액비율을 적용한다.\n3. 과실상계 — 피해자의 과실비율만큼 감액한다.\n4. 손익상계 — 손해전보 목적의 이익이 있으면 마지막으로 공제한다.\n\nⅡ. 각 단계의 성질\n1. 기왕증 공제와 동승자 감액은 손해액 자체를 확정하는 단계이다.\n2. 과실상계는 확정된 손해액에서 피해자의 기여분을 제외하는 단계이다.\n3. 손익상계는 중복전보를 방지하기 위한 최종 조정이다.\n\nⅢ. 산재보험급여가 개입된 경우\n1. 판례는 재해근로자 보호를 위하여 '공제 후 과실상계' 방식을 채택한다. 즉 보험급여와 같은 성질의 손해액에서 보험급여를 먼저 공제한 다음 과실상계한다.\n2. 사망사고에서는 그 앞에 '상속 후 공제'가 선행하여, 전체 순서는 상속 → 공제 → 과실상계가 된다.\n\nⅣ. 결론\n일반적인 손익상계는 과실상계 후에 하지만, 산재보험급여에 대하여는 판례가 공제를 먼저 하도록 하고 있으므로 두 경우를 구별하여 적용하여야 한다.`},
 {q:"음주운전 중 사고를 일으켜 대인배상Ⅰ에서 부상 3,000만원, 사망 1억 5,000만원을 지급하고 대인배상Ⅱ에서 2억원을 지급하였다. 개정 전후의 사고부담금을 각각 계산하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 개정 전 기준\n1. 대인배상Ⅰ — 1사고당 300만원, 음주운전의 경우 1,000만원\n2. 대인배상Ⅱ — 1사고당 1억원\n3. 합계 — 1,000만원 + 1억원 = 1억 1,000만원\n\nⅡ. 개정 후 기준(2022.7.28. 이후 계약)\n1. 대인배상Ⅰ — 지급보험금 전액이므로 1억 8,000만원\n2. 대인배상Ⅱ — 1사고당 1억원\n3. 합계 — 1억 8,000만원 + 1억원 = 2억 8,000만원\n\nⅢ. 유의사항\n1. 1사고당을 기준으로 하므로 피해자가 여럿이어도 사고 단위로 산정한다.\n2. 무면허와 음주가 중복되는 경우 가장 높은 금액 하나만 적용한다.\n3. 계약일자를 확인하여 개정 전후 어느 기준을 적용할지 결정하여야 한다.\n\nⅣ. 결론\n개정으로 부담금이 대폭 상향되어 사실상 구상에 준하는 수준이 되었다.`},
 {q:"피보험자 B가 자기신체사고 규정상 실제손해액 3억원의 손해를 입고 사망하였다. 산재보험금 예상액 2억원은 아직 지급받지 않았고, 대인배상에서 손해방지비용 300만원이 발생하였다. 자기신체사고 가입금액이 사망 1억원일 때 지급보험금을 산출하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 공제액의 판단\n자기신체사고의 공제 대상은 배상의무자 이외의 제3자로부터 보상받은 금액이다. 산재보험금 2억원은 예상액에 불과하고 아직 실제로 지급받지 않았으므로 공제하지 않는다. 따라서 공제액이 없다.\n\nⅡ. 비용의 처리\n자기신체사고는 공제액이 발생하지 않는 경우 비용을 지급하지 않는다. 따라서 손해방지비용 300만원은 지급하지 않는다.\n\nⅢ. 지급보험금\n공제액이 없으므로 보험증권에 기재된 사망 가입금액 1억원을 지급한다.\n\nⅣ. 결론\n지급보험금은 1억원이며, 산재보험금을 실제로 수령한 후에는 별도의 정산 문제가 발생할 수 있다.`},
 {q:"피해자 C가 사망보험금 산정액 3억원의 손해를 입었고, 공무원연금법상 유족보상금 1억 5,000만원을 수령하였으며, 가해자로부터 형사합의금 5,000만원을 손해배상금의 일부라는 뜻을 명확히 하여 지급받고 자동차보험금청구권을 채권양도받아 통지가 완료되었다. 지급보험금을 산출하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 손익상계의 대상 판단\n1. 공무원연금법상 유족보상금 — 손해의 전보를 목적으로 지급되는 급부이므로 손익상계의 대상이 된다.\n2. 형사합의금 — 손해배상금의 일부라는 뜻을 명확히 하여 지급된 경우 원칙적으로 공제 대상이나, 가해자가 보험회사에 대한 보험금청구권을 피해자에게 채권양도하고 통지가 완료된 경우에는 피해자의 지급보험금 산정에 영향을 주지 않는다.\n\nⅡ. 채권양도의 의미\n피보험자(가해자)가 형사합의금을 보험회사에 청구하는 것을 예방하고자 자신의 보험금청구권을 피해자에게 양도하는 것으로, 이 경우 피해자는 형사합의금과 보험금을 모두 확보하게 된다.\n\nⅢ. 산정\n3억원 − 1억 5,000만원(공무원연금) − 0원(채권양도된 형사합의금) = 1억 5,000만원\n\nⅣ. 결론\n지급보험금은 1억 5,000만원이며, 형사합의금을 공제하면 오산이 된다.`},
 {q:"무단반출된 차량을 무면허자가 운전하여 동승자와 상대차량 운전자가 사망하였다. 무단운전자에 대한 사고부담금 부과와 보험자대위의 가부를 논하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 쟁점\n무단운전자는 승낙피보험자가 아니어서 피보험자에 해당하지 않는데, 그에게 사고부담금을 부과하거나 구상할 수 있는지가 문제된다.\n\nⅡ. 사고부담금의 부과\n1. 약관상 사고부담금은 피보험자를 대상으로 한다. 무단운전자는 기명피보험자의 승낙이 없어 피보험자가 아니므로 약관만으로는 부과 근거가 부족하다.\n2. 그러나 자배법 제29조는 음주운전, 무면허운전, 마약·약물운전, 사고발생 시 조치의무 위반 사고에서 보험회사가 '법률상 손해배상책임이 있는 자'에게 구상할 수 있다고 규정한다. 무단운전자는 민법상 불법행위자로서 이에 해당하므로 부담 의무가 인정된다.\n\nⅢ. 보험자대위\n1. 상법 제682조에 따라 보험금을 지급한 보험자는 그 한도에서 제3자에 대한 피보험자의 권리를 취득한다.\n2. 무단운전자는 피보험자도 아니고 기명피보험자와 생계를 같이하는 동거가족도 아니므로 대위권 행사가 제한되지 않는다.\n3. 따라서 사고부담금에 그치지 않고 지급보험금 전체에 대하여 구상할 수 있다.\n\nⅣ. 동거가족의 경우\n무단반출한 자가 기명피보험자와 생계를 같이하는 동거가족이라면, 그에 대한 구상은 실질적으로 피보험자에 대한 구상이 되므로 보험자대위가 제한된다.\n\nⅤ. 결론\n무단운전자에 대하여는 자배법 제29조를 근거로 부담을 지우고, 나아가 보험자대위로 전체 구상이 가능하다.`},
 {q:"자기신체사고에서 피보험자가 동일한 사고로 부상 4급과 부상 5급의 상해를 함께 입고 총 치료비 2,000만원이 발생하였으며 후유장해 10급으로 평가되었다. 급별 가입금액표가 부상 3급 1,500만원, 4급 1,400만원, 5급 1,000만원, 후유장해 10급 900만원일 때 지급보험금을 산출하시오. (10점)", pts:10, lik:3,

4. 무과실 피해자에게는 감액 없이 대인배상Ⅰ·Ⅱ에서 전액 보상한다.

Ⅲ. 사고부담금과 구상권
1. 무면허운전 사고이므로 사고부담금이 발생한다.
2. 납부의무자 — 피보험자 본인, 기명피보험자의 명시적·묵시적 승인이 있으면 기명피보험자도 부담한다.
3. 무단운전자는 피보험자가 아니어서 약관상 부담의무가 없어 보이나, 자배법 제29조의 '법률상 손해배상책임이 있는 자'에 해당하므로 부담한다.
4. 나아가 무단운전자가 동거가족이 아니라면 보험자대위로 지급보험금 전체를 구상할 수 있다.

Ⅳ. 결론
등장인물마다 지위를 확정하고, 담보별 보상 → 조정 → 한도 → 구상의 순서로 정리한다.`},
 {r:48,u:"a4",t:"손익상계의 개념 (5점) / 사망자의 손해배상액 산정 방법 (15점)",ref:"a3#4"},
 {r:47,u:"a4",t:"담보별 보상책임을 설명하고 유족별 지급보험금을 계산하시오. (25점)",a:`Ⅰ. 보상책임의 검토
1. 대인배상Ⅰ — 운행자책임이 성립하고 피해자가 타인이면 보상한다.
2. 대인배상Ⅱ — 피해자가 피보험자의 부모·배우자·자녀이면 가족면책으로 면책된다.
3. 자기신체사고 — 피보험자 본인과 그 가족이 상해를 입은 때 보상하며, 면책사유가 없어야 한다.

Ⅱ. 손해액의 조정
1. 무상동승이면 동승자 감액을 적용한다.
2. 피해자 과실이 있으면 과실상계한다.
3. 기왕증이 있으면 관여도를 반영한다.

Ⅲ. 담보별 지급보험금
1. 대인배상Ⅰ — 조정된 손해액에 대하여 사망 한도 1억 5,000만원(부상 후 사망은 1억 8,000만원)을 적용한다.
2. 자기신체사고 — 실제손해액에서 대인배상으로 수령한 금액을 공제하고 가입금액 한도로 지급한다.

Ⅳ. 유족별 배분
1. 법정상속분(배우자 1.5 : 자녀 각 1)에 따라 배분한다.
2. 가해자가 상속인이면 대인배상Ⅰ의 그 상속분은 혼동으로 소멸한다.
3. 자기신체사고는 배상책임이 아니므로 혼동이 발생하지 않아 가해자도 수령한다.
4. 상속인이 될 자가 상속개시 전 사망하였다면 대습상속을 적용한다.

Ⅴ. 결론
담보별 보상 여부를 먼저 확정하고, 조정 → 한도 → 배분의 순서로 산출한다.`},
 {r:45,u:"a4",t:"약관 규정에 따라 구분하여 A가 부담할 사고부담금을 각각 계산하시오. (10점)",a:`Ⅰ. 사고부담금의 산출 구조
약관은 담보별로 사고부담금을 따로 정하므로, 대인배상Ⅰ·대인배상Ⅱ·대물배상으로 나누어 계산한다.

Ⅱ. 개정 전 기준
1. 대인배상Ⅰ — 1사고당 300만원, 음주운전의 경우 1,000만원
2. 대인배상Ⅱ — 1사고당 1억원
3. 대물배상 — 1사고당 100만원, 음주운전의 경우 500만원

Ⅲ. 개정 후 기준(2022.7.28. 이후 계약)
1. 대인배상Ⅰ — 지급보험금 전액
2. 대인배상Ⅱ — 1사고당 1억원
3. 대물배상 — 의무보험 가입금액 이하 손해는 전액, 초과손해는 1사고당 5,000만원

Ⅳ. 계산 시 유의사항
1. 1사고당을 기준으로 하므로 피해자가 여럿이어도 사고 단위로 산정한다.
2. 무면허와 음주가 중복되면 가장 높은 금액 하나만 적용한다.
3. 대인배상Ⅰ의 한도 내에서만 지급되었다면 대인배상Ⅱ의 사고부담금은 발생하지 않는다.
4. 계약일자를 확인하여 개정 전후 어느 기준을 적용할지 먼저 결정한다.

Ⅴ. 결론
지급보험금이 어느 담보에서 얼마씩 나갔는지를 먼저 확정한 뒤 담보별 부담금을 합산한다.`},
 {r:44,u:"a4",t:"사고부담금을 산출하고 납부의무자를 설명하시오. (10점) / B와 C에 대한 지급보험금을 산출하고 근거를 설명하시오. (10점)",ref:"a4#1"},
 {r:43,u:"a4",t:"다음 사례에서 대인배상 지급기준에 따라 A에게 지급한 보험금을 계산하시오. (15점)",a:`Ⅰ. 지급기준에 따른 산정 순서
1. 손해를 적극손해·소극손해·위자료로 구분한다.
2. 부상은 치료관계비·휴업손해·간병비, 사망은 장례비·위자료·상실수익액으로 산정한다.
3. 후유장해가 있으면 노동능력상실률을 반영한 상실수익액과 후유장해 위자료를 산정한다.

Ⅱ. 상실수익액
현실소득액 × 노동능력상실률 × 취업가능월수 호프만계수로 산정하며, 사망의 경우 생계비로 소득의 3분의 1을 공제한다. 호프만계수는 240을 한도로 한다.

Ⅲ. 조정
기왕증 공제 → 동승자 감액 → 과실상계 → 손익상계의 순서로 적용한다. 산재보험급여가 있는 경우에는 공제 후 과실상계에 따른다.

Ⅳ. 한도 적용
대인배상Ⅰ의 부상 3,000만원, 후유장해·사망 각 1억 5,000만원 한도를 적용하고, 초과분을 대인배상Ⅱ에서 지급한다. 부상 후 사망 또는 부상과 후유장해가 병존하면 한도를 합산한다.

Ⅴ. 결론
문제에서 제시된 지급기준표와 급별 금액을 그대로 적용하되, 산식과 단계를 반드시 답안에 남긴다.`},
 {r:42,u:"a4",t:"C 및 D에 대한 각 보험사의 담보별 지급보험금을 산출하고, 보험자의 권리를 설명하시오. (15점)",a:`Ⅰ. 담보별 지급보험금의 산출
1. 피해자별로 어느 담보가 적용되는지 확정한다.
2. 대인배상Ⅰ — 지급기준에 따른 손해액을 산정하고 한도를 적용한다.

4. 자기신체사고 — 실제손해액에서 제3자로부터 보상받은 금액을 공제하고 가입금액 한도로 지급하되, 공제액이 없으면 비용을 지급하지 않고 가입금액을 지급한다.
5. 다른자동차 운전담보가 적용되는 경우 그 특약에 따른 보상범위를 검토한다.

Ⅱ. 보험자의 권리
1. 보험자대위 — 상법 제682조에 따라 지급한 보험금의 한도에서 제3자에 대한 피보험자의 권리를 취득한다.
2. 자배법 제29조 — 음주·무면허·마약·조치의무 위반 사고에서 '법률상 손해배상책임이 있는 자'에게 구상할 수 있다.
3. 사고부담금 — 피보험자 및 승인한 기명피보험자에게 부과한다.
4. 구상의 제한 — 생계를 같이하는 동거가족에 대해서는 대위권 행사가 제한된다.

Ⅲ. 결론
지급과 회수를 함께 검토하여야 하며, 회수 근거를 약관과 법률로 나누어 제시한다.`},
 {r:41,u:"a4",t:"A에 대한 갑·을 보험사의 담보별 지급보험금을 산출하고, 보험자대위권 행사에 관하여 설명하시오. (10점)",a:`Ⅰ. 담보별 지급보험금
1. 대인배상Ⅰ — 운행자책임이 성립하고 피해자가 타인이면 지급기준에 따라 산정한 후 급별 한도를 적용한다. 부상과 후유장해가 병존하면 한도를 합산한다.
2. 자기신체사고 — 실제손해액에서 배상의무자 이외의 제3자로부터 보상받은 금액을 공제하고 급별 가입금액 한도로 지급한다.
3. 무보험자동차에 의한 상해 — 가해차량이 무보험자동차에 해당하면 실제 손해액 기준으로 보상한다.
4. 자기신체사고와 무보험차상해가 경합하면 약관의 공제규정을 적용하되, 특약 보험금 청구를 포기하면 공제하지 않는다.

Ⅱ. 과실상계
대인배상과 무보험차상해는 과실상계를 적용하나, 자기신체사고는 정액급부이므로 적용하지 않는다.

Ⅲ. 보험자대위권의 행사
1. 근거 — 상법 제682조의 청구권대위
2. 무보험차상해를 지급한 보험자는 가해자에 대하여 대위권을 행사한다.
3. 범위 — 지급한 보험금의 한도 내에서, 피보험자의 권리를 해하지 않는 범위
4. 제한 — 생계를 같이하는 동거가족에 대해서는 제한된다.

Ⅳ. 결론
담보별로 산정방식과 과실상계 적용 여부가 다르므로 표로 정리하여 제시하는 것이 유리하다.`}

    id:"a5", name:"5. 과실상계·손익상계·산재조정", freq:F(3,[41,42,46,47,48,49]),
    sections:[
      {h:"조정의 적용 순서 — 순서가 금액을 바꾼다", freq:F(3,[41,48]),
       body:`<div class="why"><span class="h">가장 중요한 규칙</span>
       손해액을 구한 뒤 깎는 절차가 네 개 있다. <b>기왕증 공제 · 동승자 감액 · 과실상계 · 손익상계</b>. 이 넷을 어떤 순서로 적용하느냐에 따라 최종 금액이 달라진다. 41회가 이 순서를 <b>15점</b>짜리 단독 문제로 냈다.</div>
       <div class="tmpl"><b>[약관상 일반 순서]</b>
① <b>기왕증 공제</b>   기왕증 관여도를 반영해 실제손해액을 확정
② <b>동승자 감액</b>   무상동승이면 유형별 감액비율 적용
③ <b>과실상계</b>     피해자 과실비율만큼 감액
④ <b>손익상계</b>     손해전보성 이익을 마지막에 공제</div>
       <div class="why"><span class="h">단 하나의 예외 — 산재보험급여</span>
       위 순서는 <b>약관상 일반 산출 순서</b>다. 그런데 <b>산재보험급여</b>가 개입된 경우에는 판례가 재해근로자 보호를 위해 <b>「공제 후 과실상계」</b>를 채택했다. 즉 산재급여는 <b>과실상계보다 먼저</b> 공제한다.<br><br>
       사망사고라면 그 앞에 한 단계가 더 붙는다 — <b>「상속 후 공제」</b>. 손해배상채권을 먼저 상속시키고, 유족급여를 <b>실제 수령한 수급권자의 상속분에서만</b> 공제한다.<br><br>
       정리하면 <b>일반 = 기왕증 → 동승자 → 과실 → 손익</b>, <b>산재 = (상속 →) 공제 → 과실</b>.</div>
       <div class="scroller"><table class="mini">
       <tr><th>구분</th><th>순서</th><th>근거</th></tr>
       <tr><td>약관상 일반</td><td>기왕증 → 동승자감액 → 과실상계 → <b>손익상계</b></td><td>약관 지급기준</td></tr>
       <tr><td>산재보험급여</td><td><b>공제</b> → 과실상계</td><td>판례(공제 후 과실상계)</td></tr>
       <tr><td>산재 + 사망</td><td>상속 → <b>공제</b> → 과실상계</td><td>판례(상속 후 공제)</td></tr>
       </table></div>`,
       mnemo:{key:"기 · 동 · 과 · 손", how:"일반 순서 — <b>기</b>왕증 · <b>동</b>승자감액 · <b>과</b>실상계 · <b>손</b>익상계.<br>산재가 끼면 뒤집힌다 — <b>공제 후 과실상계</b>. 사망이면 그 앞에 <b>상속</b>이 붙는다.<br>답안에는 두 순서를 <b>모두</b> 쓰고 \"산재는 예외\"라고 밝히면 만점이다."}},
      {h:"과실상계 — 피해자 잘못만큼 깎는다", freq:F(3,[46]),
       body:`<div class="why"><span class="h">쉽게 말하면</span>
       무단횡단하다 차에 치였다면 운전자만 잘못한 게 아니다. 피해자 잘못이 30%면 <b>배상액의 70%만</b> 준다. 이것이 과실상계이고, 근거는 <b>손해의 공평한 분담</b>이다.</div>
       <ul><li><b>법적 근거</b> — 민법 제396조(채무불이행), 제763조에 의한 불법행위 준용</li>
       <li><b>성질</b> — 법원의 <b>직권조사사항</b>이다. 다만 피해자 과실의 존재는 가해자가 주장·입증한다.</li>
       <li><b>피해자측 과실</b> — 피해자 본인뿐 아니라 <b>신분상·생활관계상 일체를 이루는 자</b>(배우자, 미성년 자녀의 부모 등)의 과실도 피해자측 과실로 참작한다. 46회가 이 논점을 물었다.</li>
       <li><b>자동차보험의 운용</b> — 약관은 <b>「자동차사고 과실비율의 인정기준」</b>을 두고 사고유형별 기본 과실비율에 가산·감산 수정요소를 적용한다. 분쟁은 손해보험협회 <b>과실비율분쟁심의위원회</b>에서 조정한다.</li>
       <li><b>적용 제외</b> — 자기신체사고는 정액급부이므로 과실상계를 하지 않는다.</li></ul>`},

      {h:"손익상계 — 같은 성질만 뺀다", freq:F(3,[48,49]),
       body:`<div class="why"><span class="h">핵심 한 줄</span>
       내가 <b>보험료를 내고 받은 돈</b>(생명보험금·상해보험금)은 빼지 않는다. <b>손해를 메우려고 나온 돈</b>(산재보험금·유족연금)만 뺀다. 이 기준 하나로 거의 모든 문제가 갈린다.</div>
       <div class="scroller"><table class="mini">
       <tr><th>공제 O (동일 성질)</th><th>공제 X (별개 원인)</th></tr>
       <tr><td>산재보험 급여 (요양·휴업·장해·유족급여)</td><td>생명보험금·상해보험금 등 별도 계약 급부</td></tr>
       <tr><td>공무원연금·국민연금 유족급여</td><td>위문금·조위금 등 증여적 성격의 금품</td></tr>
       <tr><td>피해자가 지출을 면한 비용</td><td>형사합의금 중 <b>채권양도</b>된 부분</td></tr>
       </table></div>
       <p><b>항목 대응 원칙</b> — 같은 항목끼리 맞춰서 공제한다. 요양급여는 치료비에서, 휴업급여는 휴업손해에서, 유족·장해급여는 상실수익액에서 공제하며, <b>위자료에서는 공제하지 않는다.</b></p>
       <p><b>형사합의금</b> — 손해배상금의 일부라는 뜻을 명확히 하여 지급하면 원칙적으로 공제 대상이나, 가해자가 보험회사에 대한 청구권을 피해자에게 <b>채권양도</b>하고 통지가 완료되었다면 피해자의 지급보험금 산정에 영향을 주지 않는다.</p>`,
       mnemo:{key:"내 보험료로 받은 건 안 뺀다", how:"생명·상해보험금 = 내가 보험료 내고 받은 것 → <b>공제 X</b><br>산재·연금 = 손해를 메우려고 나온 것 → <b>공제 O</b><br>그리고 <b>항목끼리</b> — 휴업급여는 휴업손해에서, 유족급여는 상실수익액에서. <b>위자료에서는 절대 빼지 않는다.</b>"}},

      {h:"산재보험금과의 조정 — 상속 후 공제, 공제 후 과실상계", freq:F(3,[47,48]),
       body:`<p>사망사고에서 산재 유족급여가 지급된 경우 처리순서는 판례로 확립되어 있고, 48회에서 정면으로 출제되었다.</p>
       <ol><li><b>상속 후 공제</b> — 손해배상채권을 법정상속분에 따라 먼저 상속시킨 다음, 유족급여를 <b>실제 수령한 수급권자의 상속분에서만</b> 공제한다. 근로복지공단이 수급권자에게 유족급여를 지급했더라도, 수급권자가 아닌 다른 공동상속인이 상속한 손해배상채권과 유족급여 수급권은 <b>귀속주체가 서로 달라</b> 상호보완적 관계를 인정할 수 없으므로, 다른 공동상속인에 대한 배상책임까지 당연히 소멸하지는 않는다.</li>
       <li><b>공제 후 과실상계</b> — 보험급여와 같은 성질의 손해액에서 <b>먼저 보험급여를 공제</b>한 다음 <b>과실상계</b>를 한다.</li></ol>
       <div class="lead">전체 순서는 <b>상속 → 공제 → 과실상계</b>. 답안에 이 세 단어를 순서대로 쓰는 것만으로도 점수가 붙는다.</div>`,
       mnemo:{key:"상속 → 공제 → 과실", how:"<b>상속</b> 먼저 나누고, 실제 <b>받은 사람</b> 몫에서만 <b>공제</b>하고, 마지막에 <b>과실</b>상계.<br>\"공제 후 과실상계\"는 판례 용어이므로 그대로 쓴다."}},

      {h:"산재와 자동차보험의 담보별 관계", freq:F(2,[47]),
       body:`<p>47회는 <b>출퇴근 중 자동차사고</b>를 소재로 산재보상과 자동차보험 담보의 관계를 20점으로 물었다.</p>
       <p><b>출퇴근 재해의 산재 인정요건</b> — 사업주가 제공한 교통수단이나 그에 준하는 방법으로 출퇴근하던 중 발생한 사고, 또는 <b>통상적인 경로와 방법</b>으로 출퇴근하던 중 발생한 사고일 것. 통상적 경로를 벗어난 일탈·중단 중의 사고는 원칙적으로 제외되나, 일상생활에 필요한 행위 등은 예외가 인정된다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>담보</th><th>산재보상을 받을 때의 영향</th></tr>
       <tr><td>대인배상Ⅰ</td><td>영향 없이 보상. 지급 후 근로복지공단과의 구상 관계 정리</td></tr>
       <tr><td>대인배상Ⅱ</td><td>피용자가 산재보상을 받을 수 있는 경우 <b>면책</b>(약관 면책조항)</td></tr>
       <tr><td>자기신체사고</td><td>배상의무자 이외의 제3자로부터 받은 금액이므로 <b>공제</b> 대상</td></tr>
       </table></div>`},

      {h:"기왕증 감액", freq:F(2,[47,48]),
       body:`<p>사고 전부터 있던 질환·장해가 손해의 발생·확대에 기여했다면 그 기여도만큼 배상액에서 뺀다.</p>
       <ul><li>과실상계는 피해자의 <b>귀책사유</b>를 따지지만, 기왕증 감액은 피해자의 <b>신체적 소인</b>을 따진다. 근거는 같은 손해의 공평한 분담이다.</li>
       <li>기여도는 <b>의학적 감정</b>에 따르며, 실무상 치료비와 상실수익액에 기여도를 곱해 감액한다.</li>
       <li><b>한시장애</b>는 일정 기간 후 회복되는 장애로, 영구장애와 구분하여 그 기간만 인정한다.</li></ul>`},

      {h:"치료관계비의 과실책임주의와 그 예외", freq:F(2,[46,48]),
       body:`<p>원칙은 <b>과실책임주의</b>다. 치료비도 피해자 과실만큼 깎는다. 다만 약관은 예외를 둔다.</p>
       <div class="why"><span class="h">예외 — 경상 운전자의 치료비</span>
       상해급별 <b>12급 ~ 14급</b>에 해당하는 <b>차량 운전자</b>가 입은 상해로서, <b>과실상계 전</b>의 치료관계비가 대인배상Ⅰ 한도를 초과하는 경우에는, <b>과실상계 없이 우선 보상</b>하고 그 초과액에 대하여 피해자측 과실비율에 해당하는 금액을 <b>따로 청구</b>한다.<br>
       대상 차량에서 <b>이륜자동차는 제외</b>된다.</div>
       <div class="warn">경상(12~14급) 환자의 과잉진료를 막기 위해 도입된 규정이다. 사안에 "12급", "14급", "운전자"가 동시에 나오면 이 조항을 의심한다.</div>`},

      {h:"피해자측 과실과 신뢰의 원칙", freq:F(3,[45,47,49]),
       body:`<p><b>피해자측 과실</b>이란 피해자 본인의 과실이 아니지만 피해자와 <b>신분상·생활관계상 일체를 이루는 자</b>의 과실을 피해자의 과실로 보아 참작하는 것이다.</p>
       <p><b>인정되는 2가지 유형</b></p>
       <ol><li><b>사리변식 능력이 없는 자</b>(유아 등)의 사고에서 <b>감독의무자</b>(부모 등)의 과실</li>
       <li>상대 차량 탑승자가 그 <b>운전자와 경제적 일체의 신분관계</b>에 있거나, 그 탑승자가 <b>운행자책임을 부담하는</b> 경우</li></ol>
       <div class="why"><span class="h">왜 인정하는가</span>
       피해자가 가족의 과실로 다쳤는데 가해자에게 전액을 받고, 가해자가 다시 가족에게 구상하면 <b>결국 같은 주머니에서 나가고 들어오는 순환</b>이 된다. 이 무익한 순환을 처음부터 막는 장치다. 그래서 <b>경제적 일체성</b>이 기준이 된다.</div>
       <p><b>신뢰의 원칙</b> — 교통규칙을 지킨 운전자는 다른 교통참여자도 규칙을 지킬 것이라고 신뢰해도 되며, 상대방의 규칙 위반까지 예상하여 방어할 의무는 없다는 원칙이다. 다만 상대방의 위반을 <b>이미 인식했거나 인식할 수 있었던 경우</b>에는 적용되지 않는다.</p>`,
       mnemo:{key:"유아는 부모, 동승자는 한 주머니", how:"피해자측 과실 2유형 — ① 사리변식 못하는 <b>유아</b>의 감독의무자 과실 ② 상대차 탑승자가 운전자와 <b>경제적 일체</b>이거나 운행자책임을 지는 경우.<br>이유는 하나 — <b>구상의 순환을 막는다</b>."}}
    ],
    cards:[
      {f:"과실상계의 법적 근거는?", b:"민법 제396조, 제763조에 의한 불법행위 준용. 법원의 직권조사사항이다."},

 {q:"현행 자동차보험 약관상 <과실상계>, <손익상계>, <동승자에 대한 감액>, <기왕증 공제>에 관하여 설명하고, 그 적용 순서를 쓰시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 과실상계\n불법행위로 인한 손해배상에서 피해자의 과실이 손해의 발생 또는 확대에 기여한 경우, 손해의 공평한 분담을 위하여 손해배상금 산정 시 피해자의 과실만큼 참작하는 것을 말한다.\n\nⅡ. 손익상계\n손해배상청구권자가 손해를 본 동일한 원인에 의하여 이익도 얻은 경우 손해에서 그 이익을 공제한 잔액을 배상하여야 한다는 것으로, 피해자에게 손해 이상의 이득이 생기는 것을 방지하는 데 근거가 있다. 따라서 손해전보성 금액이 아닌 것은 공제 대상이 될 수 없다.\n\nⅢ. 동승자에 대한 감액\n무상동승자에 대한 운행자의 책임을 정할 때 동승의 목적, 인적관계, 동승의 경위 등에 비추어 운행자에게 100% 책임을 묻는 것이 손해의 공평한 분담 원칙에 어긋날 때 손해배상액을 일정 부분 감액하는 것이다. 약관은 동승의 유형 및 운행목적에 따라 0~100%를 규정하며, 승용차 함께타기 실시차량은 제외하고 동승 과정에 과실이 있으면 10~20%를 가산한다.\n\nⅣ. 기왕증 공제\n당해 사고 전에 이미 가지고 있던 증상으로 특이체질·병적 소인 등을 말한다. 사고로 통상 발생하는 손해만 가해자에게 부담시키는 것이 공평하므로, 판례는 기왕증이 기여한 정도에 상응하는 손해액을 감한 나머지만 부담시킨다. 약관은 기왕증 관여도를 반영하여 보상하되 해당 과목 전문의가 판정한 비율에 따라 공제하고, 다툼이 있으면 제3의 전문의료기관 전문의에게 판정을 의뢰할 수 있도록 하고 있다.\n\nⅤ. 적용 순서\n먼저 기왕증을 감안한 피해자의 실제손해액을 구한 후, 동승자 감액을 적용하고, 과실상계를 하여 보험금을 산출한다. 마지막으로 손익상계할 대상이 있으면 손익상계를 함으로써 최종적인 손해배상금을 산출한다.\n\nⅥ. 유의사항\n산재보험급여가 개입된 경우에는 판례가 '공제 후 과실상계' 방식을 채택하므로, 일반적 순서와 달리 공제가 과실상계에 선행한다.`},
 {q:"과실상계의 법리와 현행 자동차보험 제도상 과실상계의 운용에 관하여 설명하시오. (25점)", pts:25, lik:3,
  a:`Ⅰ. 과실상계의 법리\n1. 의의 — 피해자에게 손해의 발생 또는 확대에 관한 과실이 있는 경우 이를 참작하여 배상액을 감액하는 제도이다(민법 제396조, 제763조 준용).\n2. 취지 — 손해의 공평한 분담\n3. 성질 — 법원의 직권조사사항이며, 피해자 과실의 존재는 가해자가 주장·입증한다.\n4. 과실의 의미 — 가해자의 과실과 달리 사회통념상 요구되는 약한 부주의를 말한다.\n5. 피해자측 과실 — 피해자와 신분상·생활관계상 일체를 이루는 자(배우자, 미성년자의 부모 등)의 과실도 피해자측 과실로 참작한다.\n\nⅡ. 자동차보험 제도상 운용\n1. 「자동차사고 과실비율의 인정기준」 — 사고유형별 기본 과실비율을 정하고 가산·감산 수정요소를 적용하여 정형화하였다.\n2. 적용 순서 — 기왕증 공제 → 동승자 감액 → 과실상계 → 손익상계. 다만 산재보험급여가 있는 경우에는 '공제 후 과실상계'에 따른다.\n3. 담보별 차이 — 대인배상은 과실상계를 하나, 자기신체사고는 정액급부이므로 하지 않는다. 무보험차상해는 가해자에 대한 배상청구권을 전제로 하므로 과실을 반영한다.\n4. 분쟁조정 — 손해보험협회 과실비율분쟁심의위원회를 통하여 조정한다.\n\nⅢ. 결론\n과실상계는 손해의 공평한 분담을 실현하는 제도이며, 자동차보험에서는 인정기준을 통해 정형화하여 신속한 보상처리를 도모한다.`},
 {q:"자동차보험 대인배상 담보에서 손익상계의 유형과 방법에 대하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 의의 및 근거\n피해자가 손해를 발생시킨 것과 동일한 원인으로 이익을 얻은 경우 그 이익을 배상액에서 공제하는 것으로, 이득금지 원칙에 근거한다.\n\nⅡ. 손익상계의 대상\n1. 대상이 되는 경우 — 산재보험 급여(요양·휴업·장해·유족급여), 공무원연금법·국민연금법상 유족급여 등 손해의 전보를 목적으로 지급되는 급부, 피해자가 지출을 면한 비용\n2. 대상이 아닌 경우 — 생명보험금·상해보험금 등 피보험자가 보험료를 부담한 별개 계약의 급부, 조위금·위문금 등 증여적 성격의 금품, 채권양도가 이루어진 형사합의금, 위자료\n\nⅢ. 공제방법\n1. 항목 대응 — 손해와 성질이 동일하여 상호보완관계에 있는 항목끼리 공제한다. 요양급여는 치료비에서, 휴업급여는 휴업손해에서, 유족·장해급여는 상실수익액에서 공제하며 위자료에서는 공제하지 않는다.\n2. 상속 후 공제 — 사망사고에서는 상속분을 먼저 확정한 후 실제 수급권자의 상속분에서만 공제한다.\n3. 공제 후 과실상계 — 산재보험급여의 경우 동일 성질의 손해액에서 보험급여를 먼저 공제한 다음 과실상계한다.\n\nⅣ. 결론\n손익상계는 중복전보를 방지하는 제도로, 공제 대상 여부의 판단과 공제 순서의 정확한 적용이 실무의 핵심이다.`},
 {q:"산재보험 유족급여를 배우자가 수령한 사망사고에서, 자동차보험 대인배상 보험금 산정 시 공제와 과실상계의 순서를 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 쟁점\n유족급여의 공제 범위와 과실상계의 적용 순서\n\nⅡ. 상속 후 공제\n1. 손해배상채권을 법정상속분(배우자 1.5 : 자녀 각 1)에 따라 먼저 상속시킨다.\n2. 유족급여를 실제 수령한 배우자의 상속분에서만 공제한다.\n3. 근로복지공단이 수급권자에게 유족급여를 지급하였더라도, 수급권자가 아닌 망인의 공동상속인들이 상속한 손해배상채권과 유족급여 수급권은 그 귀속주체가 서로 상이하여 상호보완적 관계를 인정할 수 없으므로, 수급권자가 아닌 다른 공동상속인에 대한 배상책임까지 당연히 소멸한다고 할 수 없다.\n\nⅢ. 공제 후 과실상계\n보험급여와 같은 성질의 손해액에서 먼저 보험급여를 공제한 다음 피해자의 과실비율만큼 과실상계한다.\n\nⅣ. 결론\n순서는 상속 → 공제 → 과실상계이며, 순서를 바꾸면 최종 지급액이 달라지므로 실무상 매우 중요하다.`},
 {q:"근로자가 출퇴근 중에 자동차사고를 당한 경우, 산업재해보상보험법에 의한 재해보상을 받을 수 있는 요건과, 재해보상을 받을 때 자동차보험 담보별 보상에 미치는 영향을 설명하시오. (20점)", pts:20, lik:3,
  a:`Ⅰ. 출퇴근 재해의 산재 인정요건\n1. 사업주가 제공한 교통수단이나 그에 준하는 방법으로 출퇴근하던 중 발생한 사고일 것\n2. 또는 통상적인 경로와 방법으로 출퇴근하던 중 발생한 사고일 것\n3. 출퇴근 경로의 일탈 또는 중단이 있는 경우에는 원칙적으로 제외되나, 일상생활에 필요한 행위로서 대통령령이 정하는 사유에 해당하면 예외적으로 인정된다.\n4. 업무와 재해 사이에 상당인과관계가 있을 것\n\nⅡ. 자동차보험 담보별 영향\n1. 대인배상Ⅰ — 의무보험이므로 산재보상 여부와 관계없이 보상한다. 지급 후 근로복지공단과의 구상관계를 정리한다.\n2. 대인배상Ⅱ — 약관은 피보험자의 피용자로서 산재보상을 받을 수 있는 사람에 대한 손해를 면책사유로 정하고 있으므로, 산재보상을 받을 수 있는 경우 면책된다. 다만 산재보상 범위를 초과하는 손해에 대해서는 보상 여부를 별도로 검토한다.\n3. 자기신체사고 — 배상의무자 이외의 제3자로부터 보상받은 금액을 공제하므로, 실제 수령한 산재보험금은 공제 대상이 된다. 다만 아직 수령하지 않은 예상액은 공제하지 않는다.\n4. 무보험차상해 — 실제 손해액을 기준으로 하므로 산재보험금을 손익상계한다.\n\nⅢ. 손해액 산정에서의 처리\n산재보험급여는 항목 대응 원칙에 따라 동일 성질의 손해에서만 공제하며, 공제 후 과실상계 방식을 적용한다.\n\nⅣ. 결론\n출퇴근 재해는 산재와 자동차보험이 경합하는 대표적 사안이므로, 담보별로 면책 여부와 공제 여부를 나누어 검토하여야 한다.`},
 {q:"현행 자동차보험 약관 [자동차사고 과실비율 인정기준]의 '수정요소'에 관하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 인정기준의 구조\n사고유형별로 기본 과실비율을 정한 후, 개별 사안의 구체적 사정을 반영하는 수정요소를 가산·감산하여 최종 과실비율을 산정한다.\n\nⅡ. 수정요소의 유형\n1. 장소적 요소 — 횡단보도, 교차로, 보호구역, 진로변경 금지장소 등\n2. 시간적·시야 요소 — 야간, 기상 악화, 시야장애 장소\n3. 당사자의 속성 — 어린이, 고령자, 장애인 등 교통약자\n4. 운전자의 과실 정도 — 현저한 과실과 중대한 과실\n\nⅢ. 현저한 과실과 중대한 과실\n1. 현저한 과실 — 한눈팔기 등 전방주시 태만, 음주운전(혈중알코올농도 기준 미만), 핸들·브레이크 조작 부적절, 10km/h 이상 20km/h 미만 과속 등\n2. 중대한 과실 — 음주운전(기준 이상), 무면허운전, 20km/h 이상 과속, 졸음운전, 신호위반, 중앙선 침범 등\n\nⅣ. 적용상 유의사항\n1. 수정요소는 중복 적용될 수 있으나 과도한 중복은 제한된다.\n2. 보행자의 경우 교통약자에 해당하면 감산하고, 급진입·음주보행 등은 가산한다.\n3. 최종 과실비율은 인정기준을 기초로 하되 개별 사안의 특수성을 반영한다.\n\nⅤ. 결론\n수정요소는 정형화된 기본비율의 경직성을 보완하는 장치로, 사고 조사 시 이를 뒷받침할 객관적 자료의 확보가 중요하다.`},
 {q:"'피해자측 과실'의 법리를 설명하고, 그 인정범위를 사례를 들어 기술하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 의의\n과실상계에서 참작하는 과실은 피해자 본인의 과실뿐 아니라, 피해자와 신분상 또는 생활관계상 일체를 이루는 자의 과실도 포함한다는 법리이다.\n\nⅡ. 인정근거\n1. 손해의 공평한 분담 — 피해자와 경제적·생활적 일체를 이루는 자의 과실로 발생한 손해를 가해자에게 전부 부담시키는 것은 형평에 반한다.\n2. 구상관계의 순환 방지 — 가해자가 전액 배상한 뒤 피해자측 관계인에게 구상하면 결국 같은 가계 내에서 돈이 순환하는 불합리가 생긴다.\n\nⅢ. 인정범위\n1. 인정되는 경우 — 부부 사이, 미성년 자녀에 대한 부모의 감독과실, 피용자의 과실에 대한 사용자, 동일 가계를 구성하는 가족\n2. 부정되는 경우 — 단순한 친족관계에 불과하거나 생활공동체를 이루지 않는 경우, 우연히 동승한 지인의 과실\n\nⅣ. 사례\n1. 미성년 자녀가 부모의 손을 놓고 도로에 뛰어들어 사고를 당한 경우, 부모의 감독소홀이 피해자측 과실로 참작된다.\n2. 남편이 운전하는 차에 동승한 아내가 다친 경우, 남편의 운전상 과실이 아내의 피해자측 과실로 참작될 수 있다.\n\nⅤ. 결론\n피해자측 과실은 신분상·생활관계상 일체성을 기준으로 판단하며, 형식적 친족관계만으로 인정되지 않는다.`},
 {q:"손익상계의 대상이 되는 이익과 되지 않는 이익을 구별하는 기준을 설명하고, 각각의 예를 들어 기술하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 구별기준\n1. 손해전보성 — 그 급부가 손해를 메우기 위한 목적으로 지급되는 것인지 여부\n2. 상호보완관계 — 손해배상과 성질이 동일하여 서로 대체할 수 있는 관계에 있는지 여부\n3. 급부의 재원 — 피해자가 스스로 대가(보험료)를 지급하고 취득한 권리인지 여부\n\nⅡ. 손익상계의 대상이 되는 이익\n1. 산재보험 급여 — 요양급여, 휴업급여, 장해급여, 유족급여\n2. 공무원연금법·국민연금법상 유족급여\n3. 피해자가 사망으로 지출을 면하게 된 생계비\n4. 손해배상금의 일부로 지급된 형사합의금(채권양도가 없는 경우)\n\nⅢ. 손익상계의 대상이 되지 않는 이익\n1. 생명보험금·상해보험금 — 피해자가 보험료를 부담한 별개 계약의 급부로서 손해전보를 목적으로 하지 않는다.\n2. 조위금·위문금 — 증여적 성격의 금품\n3. 채권양도가 이루어진 형사합의금\n4. 유족의 근로소득 등 사고와 무관한 소득\n\nⅣ. 위자료에서의 공제 금지\n손익상계는 항목 대응 원칙에 따르므로 재산적 손해에서만 공제하며, 정신적 손해인 위자료에서는 공제하지 않는다.\n\nⅤ. 결론\n'내가 보험료를 내고 받은 돈은 빼지 않고, 손해를 메우려고 나온 돈만 뺀다'는 기준으로 정리할 수 있다.`},
 {q:"자동차보험에서 기왕증 감액과 과실상계의 공통점과 차이점을 설명하시오. (10점)", pts:10, lik:2,
  a:`Ⅰ. 공통점\n1. 근거 — 두 제도 모두 손해의 공평한 분담을 근거로 한다.\n2. 효과 — 가해자가 배상할 금액을 감액하는 효과를 가진다.\n3. 입증 — 감액을 주장하는 가해자 측이 입증책임을 진다.\n\nⅡ. 차이점\n1. 대상 — 과실상계는 피해자의 귀책사유(부주의)를 문제 삼으나, 기왕증 감액은 피해자의 신체적 소인을 문제 삼는다. 기왕증은 피해자에게 책임을 물을 수 있는 사정이 아니다.\n2. 판단방법 — 과실상계는 사고 경위와 법규 위반 등 사실관계를 토대로 하고, 기왕증 감액은 의학적 감정에 따른 관여도로 판단한다.\n3. 적용 순서 — 기왕증 공제가 먼저 이루어져 실제손해액을 확정한 후 과실상계를 한다.\n4. 담보별 적용 — 자기신체사고에는 과실상계를 하지 않으나 기왕증은 손해액 확정 단계의 문제로서 별도 검토가 필요하다.\n\nⅢ. 결론\n두 제도는 감액이라는 결과는 같으나 근거와 판단방법이 다르므로 답안에서 층위를 구별하여야 한다.`},
 {q:"자동차보험에서 산재보험과의 관계에서 문제되는 '구상관계'를 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 문제의 소재\n업무상 재해에 해당하는 자동차사고에서 근로복지공단이 산재보험급여를 지급하고 보험회사가 대인배상 보험금을 지급하는 경우, 양자 사이의 정산이 문제된다.\n\nⅡ. 근로복지공단의 구상\n1. 근로복지공단은 산재보험급여를 지급한 범위에서 재해근로자가 제3자에 대하여 가지는 손해배상청구권을 대위 취득한다.\n2. 따라서 공단은 가해차량의 보험회사에 대하여 구상할 수 있다.\n3. 구상 범위는 급여와 동일한 성질의 손해액에 한하며, 위자료는 포함되지 않는다.\n\nⅢ. 보험회사의 처리\n1. 피해자에게 지급할 때에는 이미 지급된 산재보험급여를 손익상계로 공제한다.\n2. 아직 지급되지 않은 급여는 공제하지 않으므로, 이중지급을 피하기 위하여 공단의 급여 지급내역을 확인하여야 한다.\n\nⅣ. 과실이 있는 경우\n판례는 '공제 후 과실상계' 방식을 채택하므로, 공단의 구상 범위도 이 방식에 따라 산정된 금액을 기준으로 정한다.\n\nⅤ. 사망사고의 특수문제\n유족급여는 수급권자에게만 지급되므로, 상속 후 공제 방식에 따라 수급권자의 상속분에서만 공제하고 공단의 구상도 그 범위에서 인정된다.\n\nⅥ. 결론\n구상관계는 손익상계와 동전의 양면이므로, 공제 여부와 구상 범위를 함께 검토하여야 한다.`},

      {q:"피해자측 과실의 의의와 인정범위를 설명하고, 그 근거를 기술하시오. (10점)", pts:10, lik:3,
       a:`Ⅰ. 의의\n피해자 본인의 과실은 아니나 피해자와 신분상 또는 생활관계상 일체를 이루는 자의 과실을 피해자의 과실로 보아 과실상계에서 참작하는 것을 말한다.\n\nⅡ. 인정범위\n1. 사리변식 능력이 없는 유아 등의 사고에서 감독의무자인 부모 등의 과실\n2. 상대 차량에 탑승한 자가 그 운전자와 경제적으로 일체를 이루는 신분관계에 있거나, 그 탑승자 자신이 운행자책임을 부담하는 경우\n\nⅢ. 근거\n1. 가해자가 피해자에게 전액을 배상한 후 피해자와 일체를 이루는 자에게 구상하면 결국 같은 경제적 주체 사이에서 급부가 순환하게 된다.\n2. 이러한 무익한 순환을 방지하고 손해의 공평한 분담을 실현하기 위한 것이다.\n\nⅣ. 한계\n1. 단순한 동승이나 친분관계만으로는 인정되지 아니한다.\n2. 경제적 일체성 또는 운행자책임의 부담이 인정되어야 한다.\n\nⅤ. 결론\n피해자측 과실은 예외적 제도이므로 신분관계의 실질과 경제적 일체성을 구체적으로 검토하여 답안에 적시하여야 한다.`},
      {q:"자동차보험 약관상 치료관계비의 과실상계 원칙과 그 예외를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 원칙\n치료관계비도 손해배상액의 일부이므로 피해자의 과실비율만큼 상계한 후 지급함이 원칙이다.\n\nⅡ. 예외\n1. 요건\n가. 상해급별 12급부터 14급까지에 해당하는 상해일 것\n나. 피해자가 차량의 운전자일 것. 다만 이륜자동차는 제외된다.\n다. 과실상계 전의 치료관계비가 대인배상Ⅰ의 보상한도를 초과할 것\n2. 효과\n과실상계를 하지 아니하고 치료관계비를 우선 보상한 후, 그 초과액에 대하여 피해자측 과실비율에 해당하는 금액을 따로 청구한다.\n\nⅢ. 취지\n경상 환자의 과잉진료를 억제하는 한편, 치료의 지연으로 인한 피해 확대를 방지하기 위한 것이다.\n\nⅣ. 실무상 유의점\n1. 상해등급의 확정이 선행되어야 한다.\n2. 이륜자동차 운전자는 대상에서 제외된다.\n3. 초과액에 대한 청구권의 행사 시기와 방법을 확인하여야 한다.\n\nⅤ. 결론\n사안에 12급 내지 14급의 운전자가 등장하면 이 예외규정의 적용 여부를 먼저 검토하여야 한다.`}

      {h:"보험자대위(구상권)", freq:F(3,[45,46,49]),
       body:`<div class="lawbox"><span class="src">상법 제682조 (청구권대위)</span>손해가 제3자의 행위로 인하여 생긴 경우에 보험금을 지급한 보험자는 그 지급한 금액의 한도에서 그 제3자에 대한 보험계약자 또는 피보험자의 권리를 취득한다.</div>
       <div class="lawbox"><span class="src">자배법 제29조</span>음주운전, 무면허운전, 마약·약물운전, 사고발생 시 조치의무 위반 사고에서 보험회사는 <b>「법률상 손해배상책임이 있는 자」</b>에게 구상할 수 있다.</div>
       <p><b>구상 사유</b> — 사고부담금 미납, 보험금청구권을 상실한 피보험자에 대한 구상, 무단운전자·절취운전자에 대한 구상, 공동불법행위자 간 부담부분 구상</p>
       <div class="why"><span class="h">49회가 물은 논점</span>
       무단운전자는 피보험자가 아니므로 사고부담금 납부의무가 없어 보인다. 그런데 <b>자배법 제29조</b>는 대상을 '피보험자'가 아니라 <b>'법률상 손해배상책임이 있는 자'</b>로 정하고 있다. 무단운전자는 여기에 해당하므로 부담한다. 나아가 피보험자도 동거가족도 아니므로, 보험회사는 사고부담금에 그치지 않고 <b>보험자대위로 지급보험금 전체</b>를 구상할 수 있다.</div>
       <p><b>구상의 제한</b> — 피보험자와 <b>생계를 같이하는 동거가족</b>에 대해서는 보험자대위가 제한된다. 가족에게 구상하면 결국 피보험자에게 구상하는 것과 같아지기 때문이다.</p>`,
       mnemo:{key:"제682조는 제3자, 제29조는 법률상 책임자", how:"상법 <b>682조</b> = 일반 보험자대위(제3자에 대한 권리 취득)<br>자배법 <b>29조</b> = 음주·무면허·마약·뺑소니 시 <b>'법률상 손해배상책임이 있는 자'</b>에게 구상<br>대상이 '피보험자'가 아니라는 점이 무단운전자 구상의 열쇠다.<br>단 <b>동거가족에게는 구상하지 않는다.</b>"}},

      {h:"정부보장사업", freq:F(1,[]),
       body:`<p>뺑소니나 무보험차 사고처럼 <b>피해자가 어디에서도 보상받을 수 없는 경우</b> 정부가 대신 보상하는 최후의 안전망이다.</p>
       <ul><li><b>적용요건</b> — ① 자동차 보유자를 알 수 없는 사고(뺑소니)이거나 무보험자동차 사고일 것 ② 피해자가 다른 방법으로 배상받을 수 없을 것(<b>보충성</b>)</li>
       <li><b>보상범위</b> — <b>대인배상Ⅰ 한도 내의 인적손해</b>에 한한다. 대물손해는 제외된다.</li>
       <li><b>구상</b> — 정부는 보상 후 가해자에게 구상한다.</li>
       <li><b>피해지원사업</b> — 재활보조비, 유자녀의 생계유지비와 학비 지원, 피부양가족의 생계비 등을 별도로 정한 기준금액에 따라 지원하며 재원을 감안하여 가감할 수 있다.</li></ul>`,
       mnemo:{key:"보충성 · 대인Ⅰ 한도 · 인적손해만", how:"정부보장사업의 세 가지 한계.<br>다른 데서 받을 수 있으면 <b>안 나오고</b>(보충성), 나와도 <b>대인배상Ⅰ 한도</b>까지, 그리고 <b>사람 손해만</b>(대물 제외)."}},
      {h:"피해자의 직접청구권", freq:F(3,[41,43]),
       body:`<div class="lawbox"><span class="src">약관 제29조 · 상법 제724조 · 자배법 제10조</span>피보험자가 법률상 손해배상책임을 지는 사고가 생긴 경우, 손해배상청구권자는 보험회사에 직접 손해배상금을 청구할 수 있다.</div>
       <p><b>Ⅰ. 세 가지 특징</b></p>
       <ul><li><b>독립성</b> — 피보험자의 보험금청구권과 독립된 권리이므로 피보험자의 협력 없이 행사할 수 있다.</li>
       <li><b>배타성</b> — 피해자만 행사할 수 있고, 자배법은 그 <b>압류 또는 양도를 금지</b>한다.</li>
       <li><b>강행성</b> — 약관으로 법률 규정보다 불이익하게 변경할 수 없다.</li></ul>
       <p><b>Ⅱ. 인정근거와 법적 성질</b> — 인정근거는 책임보험본질설·계약당사자 의사설이 있으나 통설·판례는 <b>법규정효과설</b>. 법적 성질은 보험금청구권설이 있으나 판례는 <b>손해배상청구권설</b>을 취한다.</p>
       <p><b>Ⅲ. 보험자의 항변권</b> — 보험자는 ① 피보험자가 피해자에게 갖는 항변사유(과실상계·손익상계·동승자감액 등)와 ② 보험자가 피보험자에게 갖는 항변사유(계약상 하자·면책사유 등)로 피해자에게 대항할 수 있다.</p>
       <p><b>Ⅳ. 약관상 유의사항 — 청구권 경합</b></p>
       <ol><li>손해배상청구권자가 배상을 받기 전에는 <b>피보험자에게 지급하지 않는다.</b></li>
       <li>피보험자가 피해자에게 지급한 손해배상액을 <b>초과하여</b> 피보험자에게 지급하지 않는다.</li>
       <li>양 청구가 경합하면 <b>손해배상청구권자에게 우선</b>하여 지급한다.</li>
       <li>피해자에게 직접 지급한 때에는 그 한도에서 피보험자에게 지급한 것으로 본다.</li>
       <li><b>착오지급</b> 시 판례는 직접청구에 따른 보험금을 지급하고 피보험자를 상대로 <b>부당이득반환</b>을 구하도록 한다.</li></ol>
       <p><b>Ⅴ. 절차</b> — 청구를 받으면 지체 없이 피보험자에게 <b>통지</b>하고, 피보험자는 증거확보·권리보전에 <b>협력의무</b>를 진다. 정당한 이유 없이 협력하지 않아 늘어난 손해는 보상하지 않는다. 지급액은 약관상 보험회사가 피보험자에게 지급책임을 지는 금액을 한도로 한다.</p>`,
       mnemo:{key:"독 · 배 · 강", how:"직접청구권 3특징 — <b>독</b>립성 · <b>배</b>타성 · <b>강</b>행성.<br>학설은 <b>법규정효과설</b>(인정근거) + <b>손해배상청구권설</b>(법적 성질) 두 개만 외우면 된다.<br>약관 핵심은 한 줄 — <b>\"피해자에게 먼저, 우선하여\"</b>."}},

      {h:"가불금 · 우선지급금 · 가지급금 — 세 가지를 구별한다", freq:F(3,[44,46,48]),
       body:`<p>이름이 비슷해서 헷갈리는 3종 세트다. <b>근거법이 다르면 다른 제도</b>라고 생각하면 정리된다.</p>
       <div class="scroller"><table class="mini">
       <tr><th>구분</th><th>가불금</th><th>우선지급금</th><th>가지급금</th></tr>
       <tr><td><b>근거</b></td><td>자동차손해배상보장법</td><td>교통사고처리특례법</td><td>자동차보험 약관</td></tr>
       <tr><td><b>청구권자</b></td><td>피해자(손해배상청구권자)</td><td>피해자</td><td>피보험자 또는 손해배상청구권자</td></tr>
       <tr><td><b>적용담보</b></td><td>대인배상Ⅰ(의무보험)</td><td>대인배상Ⅰ·Ⅱ</td><td>전 담보</td></tr>
       <tr><td><b>범위</b></td><td>치료비 전액, 그 밖의 손해는 대인Ⅰ 한도의 <b>50% 범위</b></td><td>치료비 전액과 손해배상금 중 일정 비율</td><td>지급보험금 추정액의 <b>50% 범위</b></td></tr>
       <tr><td><b>성격</b></td><td>법정 청구권</td><td>법정 청구권</td><td>약관상 선급</td></tr>
       </table></div>
       <div class="why"><span class="h">왜 있는가</span>
       과실비율이 정해지려면 시간이 걸린다. 그 사이 피해자는 치료비를 못 낸다. 그래서 <b>최종 정산 전에 미리 준다</b>. 나중에 확정된 보험금에서 <b>정산</b>하고, 과지급이면 반환받는다.</div>
       <div class="warn">셋 다 <b>가지급 → 최종 정산</b> 구조다. 답안에는 반드시 "추후 확정된 보험금에서 정산하며 초과 지급분은 반환을 청구한다"를 넣는다.</div>`,
       mnemo:{key:"가불=자배법 / 우선=교특법 / 가지급=약관", how:"근거법으로 외운다. <b>가</b>불금은 <b>자</b>배법, <b>우</b>선지급금은 교특법(형사), <b>가지급금</b>은 <b>약관</b>.<br>범위는 가불금과 가지급금 모두 <b>50%</b>가 열쇠 숫자."}}
    ],

 {q:"자동차보험 사고부담금 제도에 대하여 부과사유·금액·납부의무자·미납 시 처리를 포함하여 설명하시오. (20점)", pts:20, lik:3,
  a:`Ⅰ. 의의 및 취지\n음주·무면허·뺑소니 등 중대 법규위반 사고에서 보험회사가 피해자에게 보험금을 먼저 지급하되 그 중 일정액을 피보험자에게 부담시키는 제도로, 피해자 보호와 도덕적 해이 방지를 함께 도모한다.\n\nⅡ. 부과사유\n음주운전, 무면허운전, 사고발생 시 조치의무 위반(뺑소니), 마약·약물운전\n\nⅢ. 금액 (2022.7.28. 이후 계약)\n1. 대인배상Ⅰ — 지급보험금 전액\n2. 대인배상Ⅱ — 1사고당 1억원\n3. 대물배상 — 의무보험 가입금액 이하 손해는 전액, 초과손해는 1사고당 5,000만원\n※ 1사고당을 기준으로 하며, 무면허와 음주가 중복되면 가장 높은 금액 하나만 적용한다.\n※ 개정 전에는 대인배상Ⅰ 300만원(음주 1,000만원), 대물 100만원(음주 500만원)이었다.\n\nⅣ. 납부의무자\n1. 원칙 — 사고를 일으킨 피보험자\n2. 확장 — 기명피보험자의 명시적·묵시적 승인이 있었다면 기명피보험자도 부담한다.\n3. 묵시적 승인의 판단 — 소유자가 취해온 태도, 운전자와의 관계, 평소 차량의 운전 및 관리상황, 당해 운전이 가능하게 된 경위, 운전의 목적 등 제반 사정\n\nⅤ. 미납 시 처리\n보험회사는 피해자에게 먼저 보험금을 지급한 후 구상권을 행사하여 회수한다. 피보험자가 아닌 무단운전자 등에 대해서도 자배법 제29조의 '법률상 손해배상책임이 있는 자'에 해당하면 구상할 수 있다.\n\nⅥ. 결론\n개정으로 부담금이 대폭 상향되어 사실상 구상에 준하는 수준이 되었으므로, 손해사정 시 위반사실과 계약일자를 반드시 확인하여야 한다.`},
 {q:"자동차보험 제도에 있어서 피해자의 직접청구권에 대하여 설명하고, 약관상 유의사항을 기술하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 직접청구권의 의의\n피보험자가 법률상 손해배상책임을 지는 사고가 생긴 경우, 손해배상청구권자인 피해자가 보험회사에 직접 손해배상금을 청구할 수 있는 권리를 말한다(약관 제29조, 상법 제724조, 자배법 제10조).\n\nⅡ. 특징\n1. 독립성 — 피보험자의 보험금청구권과는 독립된 권리이므로 피해자는 피보험자의 협력 없이 행사할 수 있다.\n2. 배타성 — 피해자만이 행사할 수 있는 권리로서 자배법은 그 압류 또는 양도를 금지하고 있다.\n3. 강행성 — 상법 제724조 제2항과 자배법 제10조가 규정하고 있으므로 약관으로 이보다 불이익하게 변경할 수 없다.\n\nⅢ. 인정근거와 법적 성질\n1. 인정근거 — 책임보험본질설, 계약당사자 의사설이 있으나 통설과 판례는 법규정효과설을 취한다.\n2. 법적 성질 — 보험금청구권설이 있으나 판례는 손해배상청구권설을 취한다.\n\nⅣ. 보험자의 항변권\n보험자는 피보험자가 피해자에게 갖는 항변사유(과실상계, 손익상계, 동승자 감액 등)와 보험자가 피보험자에게 갖는 항변사유(계약상의 하자, 면책사유 등)로써 피해자에게 대항할 수 있다.\n\nⅤ. 약관상 유의사항 — 청구권의 경합\n1. 보험회사는 손해배상청구권자가 손해배상을 받기 전에는 보험금의 전부 또는 일부를 피보험자에게 지급하지 않으며, 피보험자가 손해배상청구권자에게 지급한 손해배상액을 초과하여 지급하지 않는다.\n2. 피보험자의 보험금청구가 손해배상청구권자의 직접청구와 경합하는 때에는 보험회사가 손해배상청구권자에게 우선하여 지급한다.\n3. 보험회사가 손해배상청구권자에게 직접 지급한 때에는 그 금액의 한도에서 피보험자에게 보험금을 지급한 것으로 본다.\n4. 착오지급 시 판례는 손해배상청구권자의 직접청구에 따른 보험금을 지급하고 피보험자를 상대로 부당이득반환청구권을 행사하도록 한다.\n\nⅥ. 청구 절차상 유의사항\n1. 보험회사가 손해배상청구권자의 청구를 받았을 때에는 지체 없이 피보험자에게 통지하며, 피보험자는 증거확보·권리보전 등에 협력하여야 한다. 정당한 이유 없이 협력하지 않아 늘어난 손해는 보상하지 않는다.\n2. 지급하는 손해배상금은 약관에 의하여 보험회사가 피보험자에게 지급책임을 지는 금액을 한도로 한다.`},
 {q:"보험자대위(구상권)의 근거와 자동차보험에서의 구상 사유 및 그 제한에 대하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 의의 및 근거\n1. 상법 제682조 — 손해가 제3자의 행위로 생긴 경우 보험금을 지급한 보험자는 지급한 금액의 한도에서 제3자에 대한 피보험자의 권리를 취득한다(청구권대위).\n2. 취지 — 피보험자의 이중이득 방지와 가해자의 책임 실현\n\nⅡ. 자동차보험에서의 구상 사유\n1. 사고부담금 미납\n2. 자배법 제29조 — 음주·무면허·마약·조치의무 위반 사고에서 '법률상 손해배상책임이 있는 자'에 대한 구상\n3. 보험금청구권을 상실한 피보험자에 대한 구상\n4. 무단운전자·절취운전자에 대한 구상\n5. 고의사고에서 대인배상Ⅰ을 지급한 후 가해자에 대한 구상\n6. 공동불법행위자 간 부담부분 구상\n7. 무보험차상해를 지급한 후 가해자에 대한 구상\n\nⅢ. 구상의 제한\n1. 피보험자와 생계를 같이하는 동거가족에 대해서는 보험자대위가 제한된다. 가족에게 구상하면 실질적으로 피보험자에게 구상하는 결과가 되어 보험의 목적에 반하기 때문이다.\n2. 지급한 보험금의 한도 내에서만, 피보험자의 권리를 해하지 않는 범위에서 행사한다.\n\nⅣ. 결론\n무단운전자와 같이 피보험자가 아닌 자에 대해서도 자배법 제29조를 근거로 구상이 가능하며, 이 경우 사고부담금에 그치지 않고 지급보험금 전체에 대한 보험자대위가 가능하다.`},
 {q:"정부보장사업의 의의와 적용요건 및 한계를 설명하시오. (10점)", pts:10, lik:2,
  a:`Ⅰ. 의의\n뺑소니 또는 무보험자동차 사고로 피해를 입었으나 어디에서도 배상받을 수 없는 피해자에게, 정부가 대인배상Ⅰ의 한도 내에서 손해를 보상하는 제도이다.\n\nⅡ. 적용요건\n1. 자동차의 보유자를 알 수 없는 사고(뺑소니)이거나 무보험자동차에 의한 사고일 것\n2. 피해자가 다른 방법으로 배상받을 수 없을 것 — 보충성\n\nⅢ. 한계\n1. 대인배상Ⅰ 한도 내의 인적손해에 한하며 대물손해는 제외된다.\n2. 다른 배상이나 보험으로 보상받을 수 있는 범위에서는 적용되지 않는다.\n3. 정부는 보상 후 가해자에게 구상한다.\n\nⅣ. 관련 제도\n재활보조비, 유자녀의 생계유지비와 학비대출 또는 장학금, 피부양가족의 생계비 등을 지원하는 피해지원사업이 함께 운영되며, 별도로 정한 기준금액에 따르되 재원을 감안하여 가감할 수 있다.`},
 {q:"사고부담금의 납부의무자를 판단할 때 '기명피보험자의 명시적·묵시적 승인'의 의미와 판단기준을 설명하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 의의\n사고부담금은 원칙적으로 음주·무면허 운전을 한 피보험자 본인이 부담하나, 기명피보험자가 그 운전을 명시적 또는 묵시적으로 승인한 경우에는 기명피보험자도 납부의무를 진다.\n\nⅡ. 명시적 승인\n기명피보험자가 말이나 행동으로 음주·무면허 운전을 허용한 경우를 말한다.\n\nⅢ. 묵시적 승인의 판단기준\n1. 소유자가 그동안 음주·무면허 운전자의 운전에 관하여 취해온 태도\n2. 해당 운전자와의 관계\n3. 평소 차량의 운전 및 관리상황\n4. 당해 운전이 가능하게 된 경위\n5. 운전의 목적\n이러한 제반 사정을 종합하여 판단한다.\n\nⅣ. 실무상 적용\n음주 사실을 알면서 차량 열쇠를 건네주거나 동승한 경우, 회식 후 운전을 방조한 경우 등은 묵시적 승인이 인정될 가능성이 높다. 반면 운전자가 몰래 차량을 반출한 경우에는 승인이 부정된다.\n\nⅤ. 결론\n승인의 존부는 사고부담금의 귀속을 결정하므로, 손해사정 시 사고 경위와 당사자 관계를 구체적으로 조사하여야 한다.`},
 {q:"고의로 인한 자동차사고에서 대인배상Ⅰ·Ⅱ 및 자기신체사고의 처리를 설명하고, 보험자의 구상 근거를 기술하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 고의사고의 의의\n피보험자가 손해의 발생을 인식하고 이를 용인하면서 행한 행위로 인한 사고를 말한다. 보험의 우연성 요건에 반하므로 원칙적으로 면책사유이다.\n\nⅡ. 담보별 처리\n1. 대인배상Ⅰ — 의무보험으로서 피해자 보호가 목적이므로, 피보험자의 고의라도 피해자에게 보험금을 지급한다.\n2. 대인배상Ⅱ — 면책된다.\n3. 자기신체사고 — 피보험자 본인의 고의는 면책되나, 피보험자 개별적용에 따라 고의와 무관한 다른 피보험자에 대해서는 보상 여부를 별도로 판단한다.\n\nⅢ. 구상의 근거\n1. 자배법 — 보험회사는 피해자에게 지급한 보험금의 한도에서 고의로 사고를 일으킨 자에게 구상할 수 있다.\n2. 상법 제682조 — 제3자에 대한 청구권대위\n\nⅣ. 입증책임\n고의의 존재는 면책을 주장하는 보험자가 입증하여야 하며, 단순한 중과실은 고의에 해당하지 않는다.\n\nⅤ. 결론\n고의사고에서도 대인배상Ⅰ은 지급하고 사후에 구상하는 구조를 취함으로써 피해자 보호와 가해자 책임을 동시에 실현한다.`},
 {q:"자배법 제29조에 따른 보험회사의 구상과 상법 제682조의 보험자대위를 비교하여 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 자배법 제29조\n1. 내용 — 음주운전, 무면허운전, 마약·약물운전, 사고발생 시 조치의무 위반 사고에서 보험회사는 '법률상 손해배상책임이 있는 자'에게 구상할 수 있다.\n2. 대상 — 피보험자에 한정되지 않고 법률상 배상책임을 지는 자 전부이므로, 무단운전자와 같이 피보험자가 아닌 자도 포함된다.\n3. 취지 — 중대 법규위반자의 책임을 실현하면서도 피해자에게는 먼저 보상한다.\n\nⅡ. 상법 제682조\n1. 내용 — 손해가 제3자의 행위로 생긴 경우 보험금을 지급한 보험자는 지급한 금액의 한도에서 제3자에 대한 피보험자의 권리를 취득한다.\n2. 대상 — 손해를 야기한 제3자\n3. 취지 — 피보험자의 이중이득 방지와 가해자 책임 실현\n\nⅢ. 비교\n1. 근거 — 전자는 특별법상 명문 규정, 후자는 보험법의 일반 원칙\n2. 대상의 범위 — 전자는 중대 법규위반 사고에 한정되나 대상자가 넓고, 후자는 일반적으로 적용되나 '제3자'에 한정된다.\n3. 실무 — 무단운전자에 대해서는 자배법 제29조로 부담을 지우고, 나아가 상법 제682조로 지급보험금 전체를 구상할 수 있다.\n\nⅣ. 공통된 제한\n생계를 같이하는 동거가족에 대해서는 구상이 제한된다.`},
 {q:"자동차보험에서 '가불금'과 '가지급금' 제도를 설명하시오. (10점)", pts:10, lik:1,
  a:`Ⅰ. 가불금 (자배법상 제도)\n1. 의의 — 자동차사고 피해자가 손해배상액이 확정되기 전에 치료비 등을 우선 지급받을 수 있도록 보험회사에 청구할 수 있는 금액을 말한다.\n2. 취지 — 피해자가 치료비 부담으로 적시에 치료받지 못하는 것을 방지한다.\n3. 성격 — 손해배상액의 선급이므로 최종 정산 시 공제된다.\n\nⅡ. 가지급금 (약관상 제도)\n1. 의의 — 보험회사가 손해액 확정 전에 피보험자 또는 손해배상청구권자의 청구에 따라 지급하는 금액을 말한다.\n2. 범위 — 약관이 정한 비율의 한도 내에서 지급한다.\n3. 성격 — 최종 지급보험금에서 공제된다.\n\nⅢ. 공통점과 차이점\n1. 공통점 — 손해액 확정 전 선지급으로 피해자를 보호하고, 최종 정산 시 공제된다.\n2. 차이점 — 가불금은 자배법에 근거한 법정 제도이고, 가지급금은 약관에 근거한 계약상 제도이다.\n\nⅣ. 결론\n두 제도 모두 피해자 보호를 위한 선지급 장치로서, 실무에서는 치료 지속과 분쟁 완화에 중요한 기능을 한다.`},
 {q:"보험회사가 피해자에게 보험금을 착오로 지급하였거나 피보험자와 피해자의 청구가 경합한 경우의 처리를 설명하시오. (10점)", pts:10, lik:2,

4. 자기신체사고 — 실제손해액에서 제3자로부터 보상받은 금액을 공제하고 가입금액 한도로 지급하되, 공제액이 없으면 비용을 지급하지 않고 가입금액을 지급한다.
5. 다른자동차 운전담보가 적용되는 경우 그 특약에 따른 보상범위를 검토한다.

Ⅱ. 보험자의 권리
1. 보험자대위 — 상법 제682조에 따라 지급한 보험금의 한도에서 제3자에 대한 피보험자의 권리를 취득한다.
2. 자배법 제29조 — 음주·무면허·마약·조치의무 위반 사고에서 '법률상 손해배상책임이 있는 자'에게 구상할 수 있다.
3. 사고부담금 — 피보험자 및 승인한 기명피보험자에게 부과한다.
4. 구상의 제한 — 생계를 같이하는 동거가족에 대해서는 대위권 행사가 제한된다.

Ⅲ. 결론
지급과 회수를 함께 검토하여야 하며, 회수 근거를 약관과 법률로 나누어 제시한다.`},
 {r:41,u:"a6",t:"A에 대한 담보별 지급보험금 산출과 보험자대위권 행사에 관하여 설명하시오. (10점)",a:`Ⅰ. 담보별 지급보험금
1. 대인배상Ⅰ — 운행자책임이 성립하고 피해자가 타인이면 지급기준에 따라 산정한 후 급별 한도를 적용한다. 부상과 후유장해가 병존하면 한도를 합산한다.
2. 자기신체사고 — 실제손해액에서 배상의무자 이외의 제3자로부터 보상받은 금액을 공제하고 급별 가입금액 한도로 지급한다.
3. 무보험자동차에 의한 상해 — 가해차량이 무보험자동차에 해당하면 실제 손해액 기준으로 보상한다.
4. 자기신체사고와 무보험차상해가 경합하면 약관의 공제규정을 적용하되, 특약 보험금 청구를 포기하면 공제하지 않는다.

Ⅱ. 과실상계
대인배상과 무보험차상해는 과실상계를 적용하나, 자기신체사고는 정액급부이므로 적용하지 않는다.

Ⅲ. 보험자대위권의 행사
1. 근거 — 상법 제682조의 청구권대위
2. 무보험차상해를 지급한 보험자는 가해자에 대하여 대위권을 행사한다.
3. 범위 — 지급한 보험금의 한도 내에서, 피보험자의 권리를 해하지 않는 범위
4. 제한 — 생계를 같이하는 동거가족에 대해서는 제한된다.

Ⅳ. 결론
담보별로 산정방식과 과실상계 적용 여부가 다르므로 표로 정리하여 제시하는 것이 유리하다.`}
    ]

      {h:"혼동 — 가해자가 상속인일 때", freq:F(3,[47]),
       body:`<div class="lawbox"><span class="src">민법상 혼동</span>동일인에게 채권과 채무가 귀속한 때에는 채무의 범위 내에서 채권이 소멸한다.</div>
       <p>남편이 운전하다 아내가 사망한 경우, 남편은 <b>배상할 의무가 있는 사람</b>이면서 동시에 <b>배상받을 권리를 상속받는 사람</b>이 된다. 판례는 이런 <b>'가해자가 피해자의 상속인이 되는 등 특별한 경우'</b>에 혼동이 발생하여 그 상속분이 소멸한다고 본다.</p>
       <div class="why"><span class="h">시험이 노리는 대비</span>
       혼동은 <b>배상책임 담보에서만</b> 일어난다.<br>· <b>대인배상Ⅰ</b> → 손해배상채권이므로 혼동으로 <b>소멸</b><br>· <b>자기신체사고</b> → 배상책임이 아니라 보험계약상 급부청구권이므로 <b>혼동과 무관, 가해자도 받는다</b><br>47회는 정확히 이 대비를 물었다.</div>`,
       mnemo:{key:"대인Ⅰ은 소멸 · 자손은 받는다", how:"가해자가 상속인이면 <b>대인배상Ⅰ 상속분은 혼동으로 소멸</b>.<br>하지만 <b>자기신체사고는 배상이 아니라 내 보험금</b>이라 혼동이 없다 — 가해자도 받는다.<br>이 한 줄이 47회 25점 문제의 승부처였다."}},

      {h:"치료관계비", freq:F(2,[47]),

      {h:"개인형이동장치(PM)와 신유형", freq:F(2,[47]),
       body:`<p><b>PM</b>은 전동킥보드, 전동이륜평행차, 전동기 동력 자전거 등 도로교통법상 개인형이동장치를 말한다.</p>

      {h:"청약철회와 다른자동차 운전담보", freq:F(1,[46,48]),
       body:`<ul><li><b>청약철회</b> — 보험계약자는 보험증권을 받은 날부터 일정 기간(청약일부터 30일 이내) 청약을 철회할 수 있다. 다만 <b>의무보험은 철회가 제한</b>되며 진단계약·단체계약 등도 제외된다. 철회 시 보험료를 반환하고 지연되면 이자를 가산한다.</li>

      {h:"교통사고 형사처벌특례", freq:F(2,[42]),
       body:`<p>42회가 <b>15점</b>으로 출제했다. 교통사고처리 특례법의 구조를 묻는 문제다.</p>

       <li><b>종합보험 가입 특례</b> — 종합보험 또는 공제에 가입된 경우에도 공소를 제기할 수 없다.</li></ul>
       <p><b>Ⅲ. 특례가 적용되지 않는 경우</b></p>
       <ul><li>사망사고</li>
       <li>도주(뺑소니) 및 유기 후 도주, 음주측정 거부</li>
       <li><b>12대 중과실</b> — 신호위반, 중앙선 침범, 제한속도 20km/h 초과, 앞지르기 방법 위반, 철길건널목 통과방법 위반, 횡단보도 보행자 보호의무 위반, 무면허운전, 음주운전, 보도 침범, 개문발차, 어린이보호구역 안전운전의무 위반, 화물 고정조치 위반</li>
       <li>중상해가 발생한 경우</li></ul>
       <p><b>Ⅳ. 손해사정과의 연결</b> — 형사처벌 가능성은 <b>형사합의금</b>의 지급 여부와 규모에 영향을 준다. 형사합의금이 손해배상금의 일부로 지급되면 손익상계 대상이 되나, <b>채권양도</b>가 이루어지면 피해자의 지급보험금에 영향을 주지 않는다.</p>`,
       mnemo:{key:"사 · 도 · 12 · 중", how:"특례 배제 사유 — <b>사</b>망 · <b>도</b>주(음주측정거부 포함) · <b>12</b>대 중과실 · <b>중</b>상해.<br>12대 중과실은 \"신·중·속·앞·철·횡·무·음·보·개·어·화\"로 첫 글자만 이어 외운다."}},

      {h:"청구권의 경합 — 약관 제26조", freq:F(2,[47]),
       body:`<p>피해자의 <b>직접청구권</b>과 피보험자의 <b>보험금청구권</b>이 같은 사고에 대해 동시에 존재할 수 있다. 약관은 그 우열을 정한다.</p>
       <ul><li><b>제26조 ④항</b> — 보험회사는 손해배상청구권자가 <b>배상을 받기 전</b>에는 피보험자에게 보험금을 지급하지 아니한다. 또한 피보험자가 <b>실제로 지급한 배상액을 초과</b>하여 지급하지 아니한다.</li>
       <li><b>제26조 ⑤항</b> — 직접청구와 보험금청구가 경합하는 경우 <b>손해배상청구권자에게 우선</b>하여 지급한다.</li></ul>
       <div class="why"><span class="h">왜 피해자가 우선인가</span>
       책임보험금은 실질적으로 <b>피해자에게 돌아가야 할 돈</b>이다. 피보험자에게 먼저 주면 그 돈이 피해자에게 도달하지 않을 위험이 있다. 그래서 약관이 순서를 못 박았다.</div>

    quiz:[
 {q:"자동차보험 대인배상Ⅰ과 자기신체사고에서 '혼동'의 적용 여부를 비교하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 혼동의 의의\n동일인에게 채권과 채무가 귀속한 때에 채무의 범위 내에서 채권이 소멸하는 것을 말한다. 판례는 가해자가 피해자의 상속인이 되는 등 특별한 경우에 혼동이 발생한다고 본다.\n\nⅡ. 대인배상Ⅰ에서의 적용\n1. 대인배상Ⅰ은 피보험자의 법률상 손해배상책임을 담보하므로 피해자가 가지는 권리는 손해배상채권이다.\n2. 가해자인 피보험자가 피해자의 상속인이 되면 배상채무자와 배상채권자가 동일인이 되어 그 상속분은 혼동으로 소멸한다.\n3. 따라서 그 상속분에 해당하는 금액은 지급되지 않는다.\n\nⅢ. 자기신체사고에서의 적용\n1. 자기신체사고는 배상책임 담보가 아니라 피보험자가 보험자에 대하여 가지는 보험계약상 급부청구권이다.\n2. 채권과 채무가 동일인에게 귀속하는 관계가 성립하지 않으므로 혼동이 발생하지 않는다.\n3. 따라서 가해자인 피보험자도 자기신체사고 보험금을 수령할 수 있다.\n\nⅣ. 결론\n혼동은 배상책임 담보에만 적용되는 법리이며, 같은 사고에서 대인배상Ⅰ의 상속분은 소멸하되 자기신체사고 보험금은 지급된다는 점이 실무상 핵심이다.`},
 {q:"현행 자동차보험 약관상 '치료관계비'의 지급기준을 요약하고, 손해사정 시 유의할 사항을 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 치료관계비의 의의\n대인배상 지급기준상 적극손해로서, 사고로 인한 상해의 치료에 실제로 소요되는 비용을 말한다.\n\nⅡ. 지급기준\n1. 진료비 — 자동차보험진료수가에 관한 기준에 따른 금액\n2. 입원료 — 기준병실 사용료가 원칙이며, 상급병실은 의학적 필요성이 인정되는 경우 등에 한한다.\n3. 응급치료·호송·진단비 등 부대비용을 포함한다.\n4. 간병비 — 의사가 인정한 범위에서 지급한다.\n5. 향후치료비 — 일시금으로 지급하는 경우 호프만식에 따라 중간이자를 공제한다.\n\nⅢ. 손해사정 시 유의사항\n1. 사고와 상해 사이의 인과관계 확인\n2. 기왕증 및 기왕장애의 관여도 판단과 감액\n3. 과잉진료·부당청구 여부 검토\n4. 치료의 필요성과 상당성 판단\n5. 자동차보험진료수가 기준 적합성 확인\n6. 상급병실 사용의 의학적 필요성 확인\n\nⅣ. 결론\n치료관계비는 분쟁이 가장 빈번한 항목이므로 의학적 판단과 약관 기준을 함께 검토하고, 필요한 경우 제3의 전문의료기관에 자문을 구한다.`},
 {q:"자동차사고 과실비율의 인정기준에서 '자동차와 보행자 사고' 시 보행자의 과실비율을 수정하는 요소에 관하여 설명하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 인정기준의 구조\n사고유형별 기본 과실비율을 정한 후 수정요소를 가산·감산하여 최종 과실비율을 산정한다.\n\nⅡ. 보행자 과실 가산요소\n1. 장소 — 횡단보도가 아닌 곳에서의 횡단, 횡단금지구역에서의 횡단\n2. 시간·시야 — 야간, 시야장애 장소\n3. 보행자의 행태 — 도로에의 급진입, 음주보행, 횡단 중 진로 변경, 차량 직전·직후 횡단\n\nⅢ. 보행자 과실 감산요소\n1. 보행자의 특성 — 어린이, 고령자, 장애인 등 교통약자\n2. 장소 — 어린이·노인 보호구역, 횡단보도 위\n3. 운전자 측 사정 — 현저한 과실 또는 중대한 과실(음주·과속·신호위반 등)\n\nⅣ. 결론\n수정요소는 장소·시간·보행자·운전자의 네 축으로 정리하면 누락 없이 서술할 수 있다.`},
 {q:"업무상 과실 또는 중대한 과실로 교통사고를 일으킨 운전자에 대한 형사처벌특례에 관하여 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 교통사고처리 특례법의 취지\n교통사고로 인한 업무상과실치사상죄는 원칙적으로 형사처벌의 대상이나, 신속한 피해 회복과 운전자의 과도한 형사처벌 방지를 위하여 일정한 경우 공소를 제기할 수 없도록 하는 특례를 두고 있다.\n\nⅡ. 특례의 내용\n1. 반의사불벌 — 업무상과실·중과실치상죄와 도로교통법상 재물손괴죄는 피해자의 명시적 의사에 반하여 공소를 제기할 수 없다.\n2. 종합보험 가입 특례 — 교통사고를 일으킨 차가 종합보험 또는 공제에 가입된 경우에도 공소를 제기할 수 없다.\n\nⅢ. 특례가 적용되지 않는 경우\n1. 사망사고\n2. 도주(뺑소니) 및 유기 후 도주\n3. 음주측정 거부\n4. 12대 중과실 — 신호위반, 중앙선 침범, 제한속도 20km/h 초과, 앞지르기 방법 위반, 철길건널목 통과방법 위반, 횡단보도 보행자 보호의무 위반, 무면허운전, 음주운전, 보도 침범, 개문발차, 어린이보호구역 안전운전의무 위반, 화물 고정조치 위반\n5. 중상해가 발생한 경우\n\nⅣ. 손해사정 실무와의 관계\n1. 형사처벌 여부는 형사합의금 지급 여부와 규모에 영향을 미치므로 손해액 산정과 연결된다.\n2. 형사합의금이 손해배상금의 일부로 지급되면 손익상계 대상이 되나, 채권양도가 이루어지면 피해자의 지급보험금에 영향을 주지 않는다.\n\nⅤ. 결론\n특례의 적용 여부는 보험 가입 여부와 위반 유형에 따라 결정되며, 손해사정 시 형사절차의 진행 상황을 함께 확인하여야 한다.`},
 {q:"민법상 상속순위와 상속분을 설명하고, 자동차보험 사망사고에서 유족별 보험금 배분에 어떻게 적용되는지 기술하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 상속순위\n1. 제1순위 — 피상속인의 직계비속\n2. 제2순위 — 피상속인의 직계존속\n3. 제3순위 — 피상속인의 형제자매\n4. 제4순위 — 4촌 이내의 방계혈족\n5. 배우자 — 제1순위 또는 제2순위 상속인과 공동상속하며, 그들이 없으면 단독상속한다.\n\nⅡ. 상속분\n1. 동순위 상속인이 여럿이면 균분한다.\n2. 배우자는 직계비속 또는 직계존속의 상속분에 5할을 가산한다. 따라서 배우자와 자녀 2인이면 1.5 : 1 : 1이 된다.\n\nⅢ. 대습상속\n상속인이 될 직계비속 또는 형제자매가 상속개시 전에 사망하거나 결격자가 된 경우, 그 직계비속이 있으면 그 자의 순위에 갈음하여 상속인이 되며 배우자도 포함된다.\n\nⅣ. 자동차보험에의 적용\n1. 사망 손해배상금은 상속재산이므로 법정상속분에 따라 유족에게 배분한다.\n2. 가해자가 상속인인 경우 그 상속분은 혼동으로 소멸한다(대인배상Ⅰ).\n3. 자기신체사고는 배상책임이 아니므로 혼동이 발생하지 않는다.\n4. 미성년 상속인의 몫은 법정대리인이 수령한다.\n\nⅤ. 결론\n계산문제의 마지막 단계가 배분이므로, 상속관계를 먼저 정리한 뒤 혼동과 대습상속을 검토하여야 한다.`},
 {q:"개인형이동장치(PM)의 정의 및 종류를 기술하고, PM 사고에서 자동차보험의 적용 문제를 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 정의\n도로교통법상 개인형이동장치란 원동기장치자전거 중 최고속도 25km/h 미만, 총중량 30kg 미만인 것으로서 행정안전부령으로 정하는 것을 말한다.\n\nⅡ. 종류\n1. 전동킥보드\n2. 전동이륜평행차\n3. 전동기의 동력만으로 움직일 수 있는 자전거\n\nⅢ. 자배법 적용 여부\nPM은 원칙적으로 자배법상 '자동차'에 해당하지 않으므로 운행자책임이 성립하지 않고, 민법 제750조의 불법행위책임으로 처리된다.\n\nⅣ. 자동차보험의 적용 문제\n1. PM 이용자가 확인된 경우 — 그 이용자에 대한 손해배상청구, 이용자가 가입한 배상책임보험이나 공유업체의 보험을 검토한다.\n2. PM 이용자가 확인되지 않는 경우 — 피해자 본인의 자동차보험 무보험자동차에 의한 상해 담보의 적용 여부가 쟁점이 된다. 다만 PM이 약관상 '무보험자동차'에 해당하는지에 관하여 다툼이 있을 수 있다.\n3. 보행자가 PM에 충격당한 경우 — 자동차보험의 보행 중 사고 관련 담보나 특약의 적용 여부를 검토한다.\n\nⅤ. 결론\nPM은 자동차와 보행자의 중간에 위치하는 신유형 위험으로, 담보의 공백이 생기기 쉬우므로 가입 담보와 특약을 꼼꼼히 확인하여야 한다.`},
 {q:"자동차보험계약의 청약철회에 대하여 설명하시오. (10점)", pts:10, lik:2,
  a:`Ⅰ. 의의\n보험계약자가 일정 기간 내에 아무런 불이익 없이 청약을 철회하여 계약의 효력을 소급적으로 소멸시킬 수 있는 권리를 말한다. 소비자 보호를 위한 제도이다.\n\nⅡ. 행사기간\n보험증권을 받은 날부터 15일 이내에 철회할 수 있으며, 청약일부터 30일이 지나면 철회할 수 없다.\n\nⅢ. 제한 및 예외\n1. 의무보험 — 대인배상Ⅰ 등 법률에 따라 가입이 강제되는 보험은 철회가 제한된다.\n2. 보험기간이 1년 미만인 단기계약\n3. 진단계약, 단체계약 등\n4. 이미 보험금 지급사유가 발생한 경우\n\nⅣ. 효과\n1. 보험회사는 청약철회를 접수한 날부터 3영업일 이내에 받은 보험료를 반환한다.\n2. 반환이 지연된 경우 지연이자를 더하여 지급한다.\n3. 철회 전에 보험금 지급사유가 발생하였으나 계약자가 그 사실을 모르고 철회한 경우에는 철회의 효력이 발생하지 않는다.\n\nⅤ. 결론\n청약철회는 계약 초기의 숙려 기회를 보장하는 제도이나, 의무보험에는 적용되지 않는다는 점이 자동차보험의 특징이다.`},
 {q:"자동차보험 사망사고에서 '혼동'이 발생하는 경우와 그 효과를 사례를 들어 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 혼동의 의의와 요건\n동일인에게 채권과 채무가 귀속하면 채무의 범위 내에서 채권이 소멸한다. 자동차사고에서는 가해자가 피해자의 상속인이 되는 경우에 문제된다.\n\nⅡ. 발생하는 경우\n1. 남편이 운전하다 아내가 사망하여 남편이 상속인이 되는 경우\n2. 부모가 운전하다 자녀가 사망하여 부모가 상속인이 되는 경우\n3. 자녀가 운전하다 부모가 사망하여 자녀가 상속인이 되는 경우\n\nⅢ. 효과\n1. 가해자의 상속분에 해당하는 손해배상채권은 소멸하므로 그 부분의 보험금은 지급되지 않는다.\n2. 다른 상속인의 상속분은 영향을 받지 않는다.\n3. 대인배상Ⅰ에만 적용되며, 자기신체사고는 배상책임이 아니므로 혼동이 발생하지 않는다.\n\nⅣ. 사례\n손해액 조정 후 1억 5,000만원, 유족이 배우자(가해자)와 자녀 1인인 경우, 상속분은 배우자 9,000만원 자녀 6,000만원이다. 배우자의 9,000만원은 혼동으로 소멸하고 자녀에게 6,000만원만 지급된다. 반면 자기신체사고 보험금은 배우자도 상속분대로 수령한다.\n\nⅤ. 결론\n혼동은 담보의 성질에 따라 적용 여부가 달라지므로, 계산문제에서는 담보별로 나누어 검토하여야 한다.`},
 {q:"자동차보험에서 '향후치료비'와 '개호비(가정간호비)'의 인정기준과 산정방법을 설명하시오. (10점)", pts:10, lik:1,
  a:`Ⅰ. 향후치료비\n1. 의의 — 치료 종결 후에도 계속하여 필요한 치료에 소요될 비용을 말한다.\n2. 인정기준 — 의학적으로 향후치료의 필요성이 인정되고 그 내용과 비용이 구체적으로 특정되어야 한다.\n3. 산정방법 — 일시금으로 지급하는 경우 호프만식에 따라 중간이자를 공제한다.\n\nⅡ. 개호비(가정간호비)\n1. 의의 — 후유장해로 인하여 일상생활에 타인의 조력이 필요한 경우 그 비용을 말한다.\n2. 인정기준 — 의사가 인정한 개호의 필요성과 정도(개호인 수, 개호 기간)에 따른다.\n3. 산정방법 — 개호인 임금(통상 일용근로자 임금)에 개호 기간을 곱하며, 일시금으로 지급하는 경우 중간이자를 공제한다.\n\nⅢ. 손해사정 시 유의사항\n1. 향후치료의 필요성에 관한 의학적 소견의 신뢰성\n2. 개호의 정도가 과다하게 인정되지 않았는지\n3. 기왕증의 관여도\n4. 실제 개호가 이루어지고 있는지\n\nⅣ. 결론\n두 항목 모두 장래 손해이므로 중간이자공제가 적용되며, 의학적 자료의 확보가 산정의 관건이다.`},
 {q:"자동차보험에서 미성년자가 상속인인 경우 보험금 수령과 관련한 실무상 유의사항을 설명하시오. (10점)", pts:10, lik:1,
  a:`Ⅰ. 문제의 소재\n사망사고에서 미성년 자녀가 상속인이 되는 경우, 보험금의 수령 주체와 절차가 문제된다.\n\nⅡ. 법정대리인에 의한 수령\n1. 미성년자는 행위능력이 제한되므로 법정대리인인 친권자가 대리하여 수령한다.\n2. 부모가 공동친권자인 경우 원칙적으로 공동으로 대리한다.\n\nⅢ. 이해상반행위의 문제\n1. 가해자인 부모가 자녀를 대리하여 보험금을 수령하는 경우 이해상반행위에 해당할 수 있다.\n2. 이 경우 특별대리인의 선임이 필요할 수 있으므로 가정법원의 절차를 확인하여야 한다.\n\nⅣ. 실무상 유의사항\n1. 가족관계증명서, 기본증명서 등으로 상속인과 친권자를 확인한다.\n2. 상속포기나 한정승인 여부를 확인한다.\n3. 대습상속이 있는 경우 그 관계를 명확히 정리한다.\n4. 미성년자 몫의 보험금이 실제로 미성년자를 위하여 사용되도록 지급 방식을 검토한다.\n\nⅤ. 결론\n미성년 상속인이 있는 사안은 수령 권한과 이해상반 여부를 먼저 정리하여야 분쟁을 예방할 수 있다.`},

      {q:"피해자의 직접청구권과 피보험자의 보험금청구권이 경합하는 경우의 처리를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 양 청구권의 성질\n1. 직접청구권은 피해자가 보험자에 대하여 가지는 고유의 권리로서 손해배상청구권의 성질을 가진다.\n2. 보험금청구권은 피보험자가 보험계약에 기하여 가지는 권리이다.\n\nⅡ. 약관의 규정\n1. 보험회사는 손해배상청구권자가 배상을 받기 전에는 피보험자에게 보험금을 지급하지 아니한다.\n2. 피보험자가 실제로 지급한 배상액을 초과하여 지급하지 아니한다.\n3. 양 청구가 경합하는 경우에는 손해배상청구권자에게 우선하여 지급한다.\n\nⅢ. 취지\n책임보험금은 실질적으로 피해자에게 귀속되어야 할 금원이므로, 피보험자에게 먼저 지급되어 피해자에게 도달하지 못할 위험을 방지하기 위한 것이다.\n\nⅣ. 착오 지급의 처리\n보험자가 착오로 피보험자에게 먼저 지급하였더라도 직접청구권자에게 다시 지급하여야 하며, 피보험자에 대하여는 부당이득의 반환을 청구할 수 있다.\n\nⅤ. 결론\n피해자 우선의 원칙이 관철되며, 보험자의 착오는 피해자의 권리를 축소시키지 못한다.`},
      {q:"손해배상 합의 후에 발생한 후발손해에 대한 추가청구의 요건을 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 문제의 소재\n합의에는 부제소 합의가 수반되는 것이 통상이나, 합의 당시 예상하지 못한 손해가 나타난 경우에도 그 효력이 미치는지가 문제된다.\n\nⅡ. 판례의 태도\n합의의 효력은 당사자가 예상한 손해에 한하여 미치는 것으로 해석하여, 다음 요건을 갖춘 후발손해에 대하여는 추가청구를 허용한다.\n1. 손해의 범위를 확인하기 곤란한 상황에서 서둘러 이루어진 합의일 것\n2. 합의 당시 예상할 수 없었던 손해일 것\n3. 그 손해가 중대하여 합의금과 비교할 때 현저히 균형을 잃을 것\n\nⅢ. 판단 자료\n1. 합의 시점과 치료 경과의 관계\n2. 합의금의 액수와 후발손해의 규모\n3. 피해자의 지식과 교섭력\n\nⅣ. 실무상 유의점\n합의서에 향후 치료비의 처리와 예상 범위를 구체적으로 기재하여 두면 분쟁을 줄일 수 있다.\n\nⅤ. 결론\n후발손해의 추가청구는 예외적으로 허용되므로, 세 요건을 사안에 대입하여 구체적으로 논증하여야 한다.`}

 {r:48,u:"a7",t:"자동차보험계약의 청약철회에 대하여 설명하시오. (10점)",ref:"a7#6"},
 {r:47,u:"a7",t:"혼동·대습상속을 적용한 유족별 지급보험금 계산 (25점 중)",a:`Ⅰ. 상속관계의 정리
1. 상속순위 — 제1순위 직계비속, 제2순위 직계존속, 제3순위 형제자매, 제4순위 4촌 이내 방계혈족
2. 배우자 — 제1순위 또는 제2순위와 공동상속하며 5할을 가산한다.
3. 대습상속 — 상속인이 될 직계비속이 상속개시 전에 사망한 경우 그 직계비속과 배우자가 그 순위에 갈음하여 상속인이 된다.

Ⅱ. 혼동
1. 동일인에게 채권과 채무가 귀속하면 채무의 범위 내에서 채권이 소멸한다.
2. 판례는 가해자가 피해자의 상속인이 되는 등 특별한 경우에 혼동이 발생한다고 본다.
3. 대인배상Ⅰ은 손해배상채권이므로 가해자의 상속분은 혼동으로 소멸한다.
4. 자기신체사고는 보험계약상 급부청구권이므로 혼동이 발생하지 않아 가해자도 수령한다.

Ⅲ. 계산의 순서
1. 손해액을 조정(동승자 감액·과실상계)하여 확정한다.
2. 대인배상Ⅰ 한도를 적용한다.
3. 법정상속분에 따라 유족별로 배분한다.
4. 가해자의 상속분은 혼동으로 소멸시키고, 먼저 사망한 상속인의 몫은 대습상속인에게 배분한다.
5. 자기신체사고는 실제손해액에서 대인배상 수령액을 공제하고 가입금액 한도로 지급한 뒤, 혼동 없이 상속분대로 배분한다.

Ⅳ. 결론
같은 사고에서 대인배상Ⅰ은 가해자 몫이 소멸하고 자기신체사고는 소멸하지 않는다는 점이 이 유형의 핵심이다.`},

    quiz:[
 {q:"자동차사고의 손해배상에 있어, 노동능력상실률 평가에 관하여 설명하시오. (20점)", pts:20, lik:3,
  a:`Ⅰ. 노동능력상실률의 의의\n부상에 대한 치료를 마친 후 더 이상의 치료효과를 기대할 수 없고 증상이 고정된 상태에서, 그 부상이 원인이 되어 신체의 장애가 생긴 경우 종전에 비하여 상실된 노동능력의 비율을 말한다. 상실수익액 산정의 핵심 요소이다.\n\nⅡ. 평가방법\n1. 맥브라이드식 — 자동차보험 약관 지급기준이 채택하고 있다. 일반의 옥내 또는 옥외 근로자를 기준으로 하며, 장해 부위별 항목에 직업계수를 반영한다.\n2. 국가배상법 시행령 별표 — 법원 실무에서 보조적으로 사용된다.\n3. AMA 방식 — 미국의학협회 기준으로 일부 활용된다.\n\nⅢ. 평가의 주체\n실질적으로 부상 치료·진단을 실시한 의사 또는 해당 과목 전문의가 진단·판정한 타당한 노동능력상실률을 적용한다. 판정에 다툼이 있는 경우 보험금청구권자와 보험회사가 협의하여 정한 제3의 전문의료기관 전문의에게 판정을 의뢰할 수 있다.\n\nⅣ. 평가 시 검토사항\n1. 증상의 고정 여부 — 치료 종결 시점의 적정성\n2. 기왕증·기왕장애의 관여도 — 중복장애 산정방식 적용\n3. 한시장애 여부 — 영구장애와 구분하여 인정기간 확정\n4. 사고와의 인과관계\n5. 직업계수 적용의 타당성\n6. 진료기록의 일관성 — 초진기록과 후유장해진단서의 정합성\n\nⅤ. 복합장해의 처리\n두 개 이상의 장해가 있는 경우 각각의 상실률을 단순 합산하지 않고 병합 산정방식을 적용하여 100%를 넘지 않도록 조정한다.\n\nⅥ. 결론\n노동능력상실률은 손해액에 미치는 영향이 가장 크고 분쟁 가능성이 높으므로, 의학적 자료의 확보와 평가 방법의 적정성 검토가 손해사정의 핵심이다.`},
 {q:"자동차보험사고 피해자의 후유장애(노동능력상실률) 유무 및 그 정도의 적정한 평가를 위하여 손해사정사가 조사 및 검토할 사항을 기술하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 후유장애의 의의\n부상에 대한 치료를 마친 후 더 이상의 치료효과를 기대할 수 없고 그 증상이 고정된 상태에서, 그 부상이 원인이 되어 신체의 장애가 생긴 경우를 말한다.\n\nⅡ. 자동차보험 지급기준\n맥브라이드식 후유장애 평가방법에 따라 일반의 옥내 또는 옥외 근로자를 기준으로, 실질적으로 부상 치료·진단을 실시한 의사 또는 해당 과목 전문의가 진단·판정한 타당한 노동능력상실률을 적용한다. 다툼이 있는 경우 협의하여 정한 제3의 전문의료기관 전문의에게 판정을 의뢰할 수 있다.\n\nⅢ. 조사 및 검토할 사항\n1. 기왕증 및 기왕장애 — 사고 전 병력, 특이체질·병적 소인, 이미 있던 장애를 확인하고 중복장애 산정방식에 따라 관여도를 판단한다.\n2. 증상 고정 여부 — 치료 종결 시점이 적정한지, 추가 치료로 개선 가능성이 있는지 검토한다.\n3. 한시장애 여부 — 영구장애인지 일정 기간 후 회복되는 한시장애인지 구분하고 인정기간을 확정한다.\n4. 평가의 적정성 — 맥브라이드 평가표의 항목 적용과 직업계수 적용이 타당한지 검토한다.\n5. 사고와의 인과관계 — 해당 장해가 이 사고로 인한 것인지 확인한다.\n6. 진료기록의 일관성 — 초진기록과 후유장해진단서의 정합성, 객관적 검사 결과와 호소 증상의 일치 여부를 확인한다.\n\nⅣ. 결론\n의학적 자료를 충분히 확보하고 필요한 경우 제3의 전문의료기관 자문을 활용하여야 한다.`},
 {q:"다음 사례에서 보험금지급채무의 존재 또는 부존재를 가리기 위해 손해사정사가 착안·검토하여야 할 사항을 대인배상Ⅰ과 대인배상Ⅱ로 나누어 기술하시오. (20점)", pts:20, lik:3,
  a:`Ⅰ. 대인배상Ⅰ\n1. 보상책임의 발생요건\n  ① 운행자성 — 운행지배와 운행이익의 존부, 무단운전·절취운전 여부\n  ② 운행 — 자동차를 용법에 따라 사용하였는지\n  ③ 타인성 — 피해자가 운행자·운전자가 아닌지\n  ④ 인과관계 — 운행과 사상 사이의 상당인과관계\n2. 착안 및 검토사항\n  ① 면책 3요건의 충족 여부 — 승객인지 승객이 아닌지를 먼저 구분한다.\n  ② 의무보험 가입 여부와 보험기간\n  ③ 피보험자동차의 양도 여부와 승인\n  ④ 사고부담금 부과사유(음주·무면허·뺑소니)의 존부\n  ⑤ 대인배상Ⅰ은 고의·음주·무면허에도 지급하므로 지급 후 구상·부담금을 검토한다.\n\nⅡ. 대인배상Ⅱ\n1. 보상책임의 발생요건\n  ① 피보험자 지위 — 기명·친족·승낙·사용·운전피보험자 중 어디에 해당하는지\n  ② 법률상 손해배상책임의 존부\n  ③ 대인배상Ⅰ의 지급액을 초과하는 손해의 존재\n2. 착안 및 검토사항\n  ① 면책사유 — 고의사고, 가족면책, 피용자의 산재 대상 재해, 유상운송, 한정운전 특약 위반\n  ② 피보험자 개별적용의 적용 여부 — 다만 유상운송 중 사고는 개별적용을 하지 않는다.\n  ③ 무면허운전의 경우 그 운전에 대한 기명피보험자의 명시적·묵시적 승인 여부\n  ④ 사고부담금의 부과와 납부의무자\n\nⅢ. 공통 검토사항\n손해액의 적정성(치료의 필요성, 기왕증, 소득 입증), 과실비율, 손익상계 대상 급부의 존부\n\nⅣ. 결론\n대인배상Ⅰ은 '지급을 전제로 회수를 검토'하고, 대인배상Ⅱ는 '면책 여부를 먼저 확정'한다는 점에서 검토의 방향이 다르다.`},
 {q:"동일방향으로 진행하던 1차량이 차로를 변경하다 2차량을 충격하였다. 1차량 운전자는 무면허였고, 2차량 운전자는 음주가 의심된다. 1차량 조수석 동승자(운전자의 동생, 17세)가 부상하였다. 손해사정사가 착안하여야 할 사항과 그 조사방법 및 보상처리 시 유의할 점을 기술하시오. (25점)", pts:25, lik:3,
  a:`Ⅰ. 과실관계\n1. 착안사항 — 동일방향 진행 중 차로변경 사고이므로 기본 과실비율과 수정요소의 확정이 필요하다.\n2. 조사방법 — 진로변경 시 신호 불이행·지연 여부, 진로변경 금지장소 여부, 속도위반·음주 등 현저한 과실 또는 중대한 과실의 존부를 조사한다. 블랙박스·CCTV 영상과 경찰 조사기록을 확보한다.\n3. 유의할 점 — 2차량 운전자의 음주가 확인되면 과실비율이 변동될 수 있으므로 음주측정 기록을 반드시 확인한다.\n\nⅡ. 무단운전 여부\n1. 착안사항 — 무면허 운전이므로 보유자의 허락 없는 무단운전일 가능성이 높다.\n2. 조사방법 — 차량과 열쇠의 관리상태, 보유자와 운전자의 평소 관계, 무단운전의 예견가능성, 반환의사, 운행의 목적과 거리를 조사한다.\n3. 유의할 점 — 무단운전이라도 보유자의 운행지배가 완전히 배제되지 않으면 운행자책임이 유지되므로 객관적 자료를 확보한다.\n\nⅢ. 피보험자 지위와 담보 적용\n1. 착안사항 — 동승자가 운전자의 동생이므로 가족면책과 피보험자 지위가 문제된다.\n2. 조사방법 — 주민등록·가족관계등록부로 동거 및 생계 동일 여부를 확인하고, 한정운전 특약 등 특약사항을 확인한다.\n3. 유의할 점 — 가입 담보의 구성을 먼저 확정하여야 검토 범위가 정해진다.\n\nⅣ. 사고부담금\n1. 착안사항 — 무면허운전이므로 사고부담금이 발생한다.\n2. 조사방법 — 운전면허 조회, 기명피보험자의 명시적·묵시적 승인 여부를 조사한다.\n3. 유의할 점 — 계약일자를 확인하여 개정 전후 어느 기준을 적용할지 결정한다.\n\nⅤ. 손해액\n1. 착안사항 — 경추염좌 등 경상의 경우 치료의 필요성과 상당성이 쟁점이 된다.\n2. 조사방법 — 진료기록 열람, 자동차보험진료수가 기준 대조, 미성년자이므로 통계소득 적용 여부를 검토한다.\n3. 유의할 점 — 과잉진료 판단은 의료자문 절차를 거쳐 신중히 한다.`},
 {q:"손해사정사가 자동차사고 현장에서 확인하여야 할 사항과 그 방법을 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 사고 사실의 확인\n1. 확인사항 — 사고 일시·장소, 사고 유형, 충돌 부위와 손상 정도, 진행 방향과 속도\n2. 방법 — 현장 사진 촬영, 노면 흔적(스키드마크) 확인, 블랙박스·CCTV 영상 확보, 경찰 조사기록 열람\n\nⅡ. 과실 판단 자료\n1. 확인사항 — 신호기 작동 상태, 도로 표지와 노면 표시, 시야 확보 상태, 차량 등화 상태\n2. 방법 — 현장 실측, 도로관리청 자료 조회, 목격자 진술 확보\n\nⅢ. 운전자와 차량 관계\n1. 확인사항 — 실제 운전자, 운전면허 유무, 음주 여부, 차량 소유관계와 사용 경위\n2. 방법 — 운전면허 조회, 음주측정 결과 확인, 자동차등록원부 확인, 관계인 면담\n\nⅣ. 피해자 관련\n1. 확인사항 — 피해자의 지위(보행자·동승자·상대차량 탑승자), 안전벨트 착용 여부, 상해 정도\n2. 방법 — 초진기록 확보, 응급실 기록 확인, 피해자 면담\n\nⅤ. 보험 관계\n1. 확인사항 — 가입 담보와 특약, 보험기간, 피보험자 지위\n2. 방법 — 보험증권 확인, 계약 사항 조회\n\nⅥ. 결론\n현장 조사는 시간이 지날수록 자료가 소멸되므로 신속성이 중요하며, 확보한 자료는 이후 과실비율과 손해액 산정의 근거가 된다.`},
 {q:"자동차보험에서 '과잉진료' 여부를 판단하기 위한 조사·검토 방법을 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 과잉진료의 의의\n사고로 인한 상해의 치료에 필요하고 상당한 범위를 넘어서는 진료를 말하며, 자동차보험진료수가 기준에 부합하지 않는 진료를 포함한다.\n\nⅡ. 판단기준\n1. 필요성 — 해당 상해의 치료에 의학적으로 필요한 진료인지\n2. 상당성 — 상해 정도에 비추어 진료의 종류·횟수·기간이 적정한지\n3. 인과관계 — 해당 진료가 이 사고로 인한 상해와 관련되는지\n\nⅢ. 조사방법\n1. 진료기록 열람 — 초진기록, 경과기록, 검사 결과, 처방 내역을 확인한다.\n2. 상해 정도와 치료기간의 비교 — 동일 상해급별 통상 치료기간과 대조한다.\n3. 자동차보험진료수가 기준 대조 — 인정되지 않는 항목이나 산정 기준 초과 여부를 확인한다.\n4. 의료자문 — 해당 과목 전문의의 의견을 구한다.\n5. 입원의 적정성 — 통원치료가 가능한 상태에서의 입원 여부, 입원 중 외출·외박 기록 확인\n\nⅣ. 처리 시 유의사항\n1. 과잉진료 판단은 피해자와의 분쟁 소지가 크므로 객관적 근거를 확보한 후 통보한다.\n2. 자동차보험진료수가분쟁심의회 등 분쟁조정 절차를 활용할 수 있다.\n3. 기왕증이 관여한 경우 과잉진료 문제와 구별하여 관여도로 처리한다.\n\nⅤ. 결론\n과잉진료 판단은 의학적 근거와 약관 기준을 함께 갖추어야 하며, 일방적 삭감은 분쟁을 키운다.`},
 {q:"자동차사고에서 소득 입증자료의 종류와 그 검토방법을 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 현실소득액 산정의 원칙\n피해자의 신분과 소득 입증 가능 여부에 따라 유직자·무직자·기술직·학생·군복무자 등으로 나누어 산정한다.\n\nⅡ. 소득 입증자료의 종류\n1. 근로소득자 — 근로소득 원천징수영수증, 급여명세서, 재직증명서, 국민연금·건강보험 납부내역\n2. 사업소득자 — 종합소득세 신고서, 부가가치세 신고서, 사업자등록증, 장부와 증빙\n3. 일용근로자 — 노임단가 적용 또는 근로 사실 확인서\n4. 기술직 종사자 — 자격증, 경력증명서, 직종별 임금 실태조사 보고서\n\nⅢ. 검토방법\n1. 자료의 진정성 — 발급기관 확인, 신고 시점과 사고 시점의 관계\n2. 계속성 — 사고 직전 일정 기간의 계속적 소득인지, 일시적 소득이 아닌지\n3. 사업소득의 경우 — 자본적 수익과 노무의 대가를 구분하고, 본인의 노무 기여도를 평가한다.\n4. 입증이 곤란한 경우 — 정부 노임단가 또는 통계법에 따른 조사기관의 직종별 임금 실태조사 보고서상 임금을 적용한다.\n\nⅣ. 유의사항\n사고 직전에 급격히 증가한 소득 신고, 가족 간 급여 지급 등은 신중히 검토하여야 한다.\n\nⅤ. 결론\n소득은 상실수익액의 기초가 되어 손해액에 직접 영향을 미치므로, 자료의 진정성과 계속성 확인이 핵심이다.`},
 {q:"자동차사고 손해사정에서 '인과관계' 판단이 문제되는 국면을 열거하고 각각의 검토방법을 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 운행과 사고 사이의 인과관계\n1. 문제 국면 — 자배법 제3조의 '운행으로 인하여'에 해당하는지\n2. 검토방법 — 자동차의 고유장치를 용법에 따라 사용하였는지, 사고 발생 경위와 자동차의 관여 정도를 확인한다.\n\nⅡ. 사고와 상해 사이의 인과관계\n1. 문제 국면 — 호소하는 증상이 이 사고로 인한 것인지\n2. 검토방법 — 초진기록상 최초 호소 증상, 사고 충격의 정도와 상해의 부위·정도의 정합성, 치료 개시 시점, 기왕증의 존부를 확인한다.\n\nⅢ. 상해와 후유장해 사이의 인과관계\n1. 문제 국면 — 남은 장해가 이 사고의 상해에서 비롯된 것인지\n2. 검토방법 — 객관적 검사 결과와 호소 증상의 일치 여부, 기왕장애와의 구별, 제3의 전문의료기관 자문\n\nⅣ. 사고와 사망 사이의 인과관계\n1. 문제 국면 — 치료 중 사망한 경우 사고와의 관련성\n2. 검토방법 — 사망진단서상 직접사인과 선행사인, 부검 결과, 기왕 질환의 관여도\n\nⅤ. 결론\n인과관계는 각 국면마다 판단 대상과 자료가 다르므로, 어느 단계의 인과관계가 문제되는지 특정한 후 그에 맞는 자료를 확보하여야 한다.`},
 {q:"실무형 답안(착안사항·조사방법·유의점)의 작성 요령을 설명하고, 쟁점을 도출하는 방법을 기술하시오. (10점)", pts:10, lik:2,
  a:`Ⅰ. 답안의 표준 형식\n사례에서 쟁점을 3~5개 도출하고, 각 쟁점마다 착안사항 → 조사방법 → 보상처리 시 유의할 점의 세 단계로 서술한다.\n\nⅡ. 각 단계의 내용\n1. 착안사항 — 무엇이 문제인지를 한두 문장으로 특정한다.\n2. 조사방법 — 어떤 자료를 어떻게 확보할 것인지 구체적으로 열거한다.\n3. 유의할 점 — 보상처리 과정에서 주의할 사항이나 분쟁 소지를 지적한다.\n\nⅢ. 쟁점 도출 방법\n1. 계산 6단계를 훑는다 — 책임, 담보, 손해액, 조정, 한도, 배분의 각 단계에서 확인할 것이 곧 쟁점이다.\n2. 문제의 사실관계에서 길게 설명된 부분을 주목한다. 출제자가 강조한 사실은 쟁점의 단서이다.\n3. 등장인물마다 지위(운행자·타인·피보험자)를 붙여본다.\n\nⅣ. 유의사항\n분량 조절이 중요하므로 쟁점당 배분할 분량을 먼저 정하고, 모든 쟁점을 균등하게 다루기보다 배점이 큰 쟁점에 비중을 둔다.\n\nⅤ. 결론\n실무형 문제는 실무 경험이 없어도 형식과 체크리스트를 익히면 안정적으로 득점할 수 있다.`},
 {q:"자동차보험 손해사정에서 '기왕증 관여도'를 판단하기 위한 조사·검토 사항을 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 기왕증 관여도의 의의\n당해 사고 전에 이미 존재하던 증상이나 소인이 현재의 손해에 기여한 정도를 말하며, 그 비율만큼 배상액에서 공제한다.\n\nⅡ. 약관 규정\n기왕증으로 인한 손해는 보상하지 않되, 당해 자동차사고로 기왕증이 악화된 경우에는 기왕증이 손해에 관여한 정도를 반영하여 보상한다. 기왕증은 해당 과목 전문의가 판정한 비율에 따라 공제하며, 다툼이 있으면 협의하여 정한 제3의 전문의료기관 전문의에게 판정을 의뢰할 수 있다.\n\nⅢ. 조사 및 검토사항\n1. 과거 병력 — 건강보험 요양급여 내역, 과거 진료기록, 건강검진 결과\n2. 영상자료 — 사고 직후 촬영한 영상에서 퇴행성 변화 등 기왕 소견의 존부\n3. 초진기록 — 최초 호소 증상과 진단명, 기왕증 기재 여부\n4. 연령과 직업 — 연령에 따른 퇴행성 변화의 통상적 정도\n5. 의료자문 — 해당 과목 전문의의 관여도 판정\n6. 중복장애 산정 — 기왕장애가 있는 경우 병합 산정방식 적용\n\nⅣ. 유의사항\n1. 관여도 판단은 의학적 감정에 따르므로 손해사정사가 임의로 정할 수 없다.\n2. 기왕증이 없었다면 발생하지 않았을 손해와, 사고로 악화된 부분을 구분하여야 한다.\n3. 과실상계와는 층위가 다르므로 별도로 적용한다.\n\nⅤ. 결론\n기왕증 관여도는 손해액 확정 단계에서 가장 먼저 적용되는 조정이며, 의학적 근거의 확보가 관건이다.`}

    quiz:[
 {q:"[41회 재현] 고소작업차 임차인 A가 작업대에서 추락하여 중상을 입었다. 임대인 B의 고용운전자 C가 작업대를 조종하고 있었고 과실이 인정된다. A에 대한 손해배상책임의 주체와 그 법률상 근거를 약술하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 쟁점\n고소작업차의 작업대 조종 중 사고에서 배상책임의 주체와 A의 타인성\n\nⅡ. 운행 해당 여부\n고소작업차는 자동차관리법상 특수자동차이고 작업대는 그 고유장치이므로, 정차 중이라도 작업대를 용법에 따라 사용하던 중의 사고는 자배법상 '운행'에 해당한다.\n\nⅢ. 배상책임의 주체\n1. B — 고소작업차의 임대업자로서 고용운전자를 통해 차량을 관리·조종하게 하였으므로 운행지배와 운행이익을 보유한 운행자이다. 따라서 자배법 제3조의 책임을 진다. 아울러 민법 제756조의 사용자책임도 성립한다.\n2. C — 현실적으로 작업대를 조종한 자로서 운전상 과실이 인정되므로 민법 제750조의 불법행위책임을 진다.\n\nⅣ. A의 타인성\nA는 차량을 임차하였으나 차량의 조종은 임대인의 고용운전자가 하였고 A는 작업만 수행하였으므로, 사고 당시 구체적·직접적 운행지배는 B에게 있었다. 따라서 A는 자배법상 '다른 사람'에 해당한다.\n\nⅤ. 결론\nB는 자배법 제3조 및 민법 제756조, C는 민법 제750조에 따라 A에 대하여 손해배상책임을 진다.`},
 {q:"[49회 재현] 무단반출된 차량을 무면허자가 운전하여 동승자 C와 상대차량 운전자 D가 사망하였다. 가족한정·26세 이상 한정운전 특약에 가입되어 있다. 담보별 보상책임을 설명하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 한정운전 특약 위반\n운전자를 가족 및 26세 이상으로 한정하였는데 조건에 맞지 않는 B가 운전하였으므로 특약 위반이다. 원칙적으로 대인배상Ⅰ을 제외한 모든 담보가 면책된다. 다만 피보험자동차를 도난당한 경우는 예외이고, 판례는 도난에 무단운전도 포함된다고 본다.\n\nⅡ. 피보험자 지위\n1. 갑 — 기명피보험자\n2. A — 기명피보험자와 동거하는 친족으로서 차를 사용·관리하였다면 친족피보험자로 볼 여지가 있다.\n3. B — 승낙이 없는 무단운전자로서 피보험자가 아니다.\n\nⅢ. 피해자별 보상책임\n1. A — 자기신체사고는 한정운전 특약 위반의 예외인 '도난당한 경우'에 해당하지 않는다. A 자신이 도난한 것이므로 면책된다. (다만 갑의 입장에서는 도난당한 것이므로 부책 의견도 가능하다.)\n2. B — 대인배상Ⅰ은 타인이 아니므로 면책되고, 나머지 담보는 한정운전 특약 위반으로 면책된다.\n3. C — A를 친족피보험자로 본다면 대인배상Ⅰ에서 보상한다.\n4. D — 갑에게 법률상 배상책임이 있고 무단운전은 특약 위반의 예외이므로 대인배상Ⅰ·Ⅱ에서 보상한다.\n\nⅣ. 결론\n무단운전과 한정운전 특약의 관계는 청구 주체별로 결론이 달라지므로, 각 피해자마다 지위를 확정하여 검토하여야 한다.`},
 {q:"[44회 재현] 직원 B가 업무지시로 운행 중 면허정지 상태에서 음주운전하여 보행자 C를 충격, B는 현장 사망하고 C는 치료 중 사망하였다. 기명피보험자 A는 음주를 간접적으로 승인·방조하였다. 사고부담금을 산출하고 납부의무자를 설명하시오. (10점)", pts:10, lik:3,
  a:`Ⅰ. 사고부담금의 산출\n1. C는 부상 후 사망하였으므로 대인배상Ⅰ의 한도는 부상 3,000만원과 사망 1억 5,000만원을 합산한 1억 8,000만원이다.\n2. 지급보험금이 이 한도 내에서 대인배상Ⅰ으로 처리되면 대인배상Ⅱ의 사고부담금은 발생하지 않는다.\n3. 개정 후 기준으로는 대인배상Ⅰ의 사고부담금이 지급보험금 전액이므로, 대인배상Ⅰ에서 지급한 금액 전부가 사고부담금이 된다.\n4. 무면허와 음주가 중복되었으나 가장 높은 금액 하나만 납부한다.\n\nⅡ. 납부의무자\n1. 판단기준 — 피보험자 본인, 그리고 기명피보험자의 명시적·묵시적 승인이 있는 경우 기명피보험자도 납부의무를 진다.\n2. 묵시적 승인의 판단 — 소유자가 취해온 태도, 운전자와의 관계, 평소 차량의 운전 및 관리상황, 당해 운전이 가능하게 된 경위, 운전의 목적 등 제반 사정\n3. 사례의 적용 — 운전피보험자 B는 사망하였으므로 그 상속인이 승계하며, 기명피보험자 A는 음주운전을 간접적으로 승인·방조하였으므로 납부의무가 있다.\n\nⅢ. 결론\nA와 B의 상속인이 사고부담금의 납부의무를 부담한다.`},
 {q:"[43회 재현] 자동차보험 제도에 있어서 피해자의 직접청구권에 대하여 설명하고, 약관상 유의사항을 기술하시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 직접청구권의 의의\n피보험자가 법률상 손해배상책임을 지는 사고가 생긴 경우, 피해자가 보험회사에 직접 손해배상금을 청구할 수 있는 권리이다(약관 제29조, 상법 제724조, 자배법 제10조).\n\nⅡ. 특징\n1. 독립성 — 피보험자의 보험금청구권과 독립된 권리로서 피보험자의 협력 없이 행사할 수 있다.\n2. 배타성 — 피해자만 행사할 수 있으며 자배법은 압류·양도를 금지한다.\n3. 강행성 — 약관으로 법률 규정보다 불이익하게 변경할 수 없다.\n\nⅢ. 인정근거와 법적 성질\n인정근거는 통설·판례가 법규정효과설을 취하고, 법적 성질은 판례가 손해배상청구권설을 취한다.\n\nⅣ. 보험자의 항변권\n피보험자가 피해자에게 갖는 항변사유(과실상계·손익상계·동승자감액 등)와 보험자가 피보험자에게 갖는 항변사유(계약상 하자·면책사유 등)로 피해자에게 대항할 수 있다.\n\nⅤ. 약관상 유의사항\n1. 손해배상청구권자가 손해배상을 받기 전에는 피보험자에게 보험금을 지급하지 않는다.\n2. 청구권이 경합하면 손해배상청구권자에게 우선하여 지급한다.\n3. 직접 지급한 때에는 그 한도에서 피보험자에게 지급한 것으로 본다.\n4. 착오지급 시 판례는 직접청구에 따른 보험금을 지급하고 피보험자에게 부당이득반환을 구하도록 한다.\n5. 청구를 받으면 지체 없이 피보험자에게 통지하며, 피보험자는 협력의무를 진다.`},
 {q:"[42회 재현] 자동차사고의 손해배상에 있어 노동능력상실률 평가에 관하여 설명하시오. (20점)", pts:20, lik:3,
  a:`Ⅰ. 의의\n치료 종결 후 증상이 고정된 상태에서 그 부상이 원인이 되어 신체의 장애가 생긴 경우 상실된 노동능력의 비율을 말하며, 상실수익액 산정의 핵심 요소이다.\n\nⅡ. 평가방법\n1. 맥브라이드식 — 자동차보험 약관 지급기준이 채택. 일반의 옥내 또는 옥외 근로자를 기준으로 하고 직업계수를 반영한다.\n2. 국가배상법 시행령 별표 — 법원 실무에서 보조적으로 사용\n3. AMA 방식 — 일부 활용\n\nⅢ. 평가의 주체와 절차\n실질적으로 부상 치료·진단을 실시한 의사 또는 해당 과목 전문의가 판정한 상실률을 적용하며, 다툼이 있으면 청구권자와 보험회사가 협의하여 정한 제3의 전문의료기관 전문의에게 판정을 의뢰할 수 있다.\n\nⅣ. 평가 시 검토사항\n1. 증상 고정 여부와 치료 종결 시점의 적정성\n2. 기왕증·기왕장애의 관여도와 중복장애 산정\n3. 한시장애와 영구장애의 구분 및 인정기간\n4. 사고와 장해 사이의 인과관계\n5. 직업계수 적용의 타당성\n6. 진료기록의 일관성과 객관적 검사 결과의 정합성\n\nⅤ. 복합장해의 처리\n두 개 이상의 장해는 단순 합산하지 않고 병합 산정방식으로 조정하여 100%를 넘지 않도록 한다.\n\nⅥ. 결론\n노동능력상실률은 손해액에 미치는 영향이 가장 크므로 의학적 자료 확보와 평가 적정성 검토가 손해사정의 핵심이다.`},
 {q:"[41회 재현] 현행 자동차보험 약관상 <과실상계>, <손익상계>, <동승자에 대한 감액>, <기왕증 공제>에 관하여 설명하고, 그 적용 순서를 쓰시오. (15점)", pts:15, lik:3,
  a:`Ⅰ. 과실상계\n피해자의 과실이 손해의 발생 또는 확대에 기여한 경우 손해의 공평한 분담을 위하여 손해배상금 산정 시 피해자의 과실만큼 참작하는 것이다.\n\nⅡ. 손익상계\n손해를 본 동일한 원인에 의하여 이익도 얻은 경우 손해에서 그 이익을 공제한 잔액을 배상하여야 한다는 것으로, 손해 이상의 이득 방지에 근거가 있다. 손해전보성 금액이 아닌 것은 대상이 될 수 없다.\n\nⅢ. 동승자에 대한 감액\n무상동승자에 대한 운행자의 책임을 정할 때 동승의 목적·인적관계·경위에 비추어 100% 책임을 묻는 것이 공평의 원칙에 어긋날 때 손해배상액을 감액하는 것이다. 약관은 유형별로 0~100%를 규정하고, 승용차 함께타기 실시차량은 제외하며, 동승 과정의 과실이 있으면 10~20%를 가산한다.\n\nⅣ. 기왕증 공제\n사고 전부터 가지고 있던 증상으로 특이체질·병적 소인 등을 말한다. 판례는 기왕증이 기여한 정도에 상응하는 손해액을 감한 나머지만 가해자에게 부담시킨다. 약관은 관여도를 반영하여 보상하되 해당 과목 전문의의 판정 비율에 따라 공제하고, 다툼이 있으면 제3의 전문의료기관에 의뢰할 수 있도록 한다.\n\nⅤ. 적용 순서\n기왕증을 감안한 실제손해액을 먼저 구한 후, 동승자 감액을 적용하고, 과실상계를 하여 보험금을 산출하며, 마지막으로 손익상계할 대상이 있으면 손익상계하여 최종 손해배상금을 산출한다.\n\nⅥ. 예외\n산재보험급여가 개입된 경우에는 판례가 '공제 후 과실상계'를 채택하므로 공제가 과실상계에 선행한다.`},
 {q:"[종합] 9개년(41~49회) 자동차보험 출제 경향을 분석하고, 60점 확보를 위한 학습 우선순위를 제시하시오. (15점)", pts:15, lik:1,
  a:`Ⅰ. 출제 구조\n매년 100점을 4~6문항으로 구성하며, 사례형 계산이 15~55점을 차지한다. 나머지는 약술형 15~25점 문항으로 배분된다.\n\nⅡ. 반복 출제 영역\n1. 자배법 제3조와 운행자책임·타인성 — 41·43·45·46·48·49회\n2. 사례형 계산(담보별 지급보험금) — 41·42·43·44·47·49회\n3. 사고부담금 — 44·45·46·49회\n4. 과실상계·손익상계·적용순서 — 41·42·46·48·49회\n5. 손해사정사 조사·검토(실무형) — 42·46·48회\n6. 손해액 산정 요소(위자료·중간이자·동승자감액·현실소득액) — 41·43·44·48회\n\nⅢ. 단발 출제 영역\n직접청구권(43회), 유상운송 면책(43회), 피보험자동차 양도(43회), 형사처벌특례(42회), PM(47회), 청약철회(48회), 피해자 보호제도(41회)\n\nⅣ. 학습 우선순위\n1순위 — 계산 실전(4단원). 매년 최대 배점이며 이론만으로는 접근할 수 없다.\n2순위 — 자배법과 운행자책임(1단원). 모든 사례의 출발점이다.\n3순위 — 과실상계·손익상계·적용순서(5단원). 계산의 필수 부품이다.\n4순위 — 담보 구조와 면책(2단원). 계산의 두 번째 단계이다.\n5순위 — 사고부담금·구상(6단원)과 실무 조사(8단원). 형식만 익히면 가성비가 높다.\n\nⅤ. 결론\n1~4순위만 확실히 하여도 매년 55~65점 범위가 확보되며, 5순위를 더하면 65~75점까지 기대할 수 있다.`},
 {q:"[종합] 자동차보험 사례형 계산문제에서 자주 발생하는 오류 다섯 가지를 지적하고 각각의 올바른 처리를 설명하시오. (15점)", pts:15, lik:2,
  a:`Ⅰ. 조정의 순서를 혼동하는 오류\n기왕증 공제 → 동승자 감액 → 과실상계 → 손익상계의 순서를 지켜야 한다. 다만 산재보험급여는 판례에 따라 공제 후 과실상계로 처리한다.\n\nⅡ. 한도를 먼저 적용하는 오류\n대인배상Ⅰ 한도는 조정을 모두 마친 손해액에 적용한다. 손해액에 바로 한도를 씌우면 금액이 달라진다.\n\nⅢ. 아직 받지 않은 급부를 공제하는 오류\n자기신체사고의 공제 대상은 실제로 보상받은 금액이다. '예상액'에 불과한 산재보험금은 공제하지 않으며, 공제액이 없으면 비용도 지급하지 않고 가입금액을 지급한다.\n\nⅣ. 채권양도된 형사합의금을 공제하는 오류\n가해자가 보험금청구권을 피해자에게 양도하고 통지가 완료된 경우 피해자의 지급보험금 산정에 영향을 주지 않는다.\n\nⅤ. 담보의 성질을 혼동하는 오류\n1. 자기신체사고에 과실상계를 적용하는 오류\n2. 자기신체사고에 혼동을 적용하는 오류\n3. 대인배상Ⅰ에 가족면책을 적용하는 오류\n세 가지 모두 '배상책임 담보인가 자기를 위한 담보인가'를 구분하면 방지할 수 있다.\n\nⅥ. 결론\n계산문제의 오류는 대부분 순서와 담보 성질의 혼동에서 비롯되므로, 6단계 틀을 문제지 여백에 먼저 적고 시작하는 것이 안전하다.`},
 {q:"[종합] 90분 100점의 시험에서 시간 배분과 답안 작성 전략을 설명하시오. (10점)", pts:10, lik:1,
  a:`Ⅰ. 시간 배분의 원칙\n1점당 약 50초를 기준으로 한다. 30점 25분, 25점 21분, 20점 17분, 15점 13분, 10점 9분, 5점 5분이 목표이다.\n\nⅡ. 시험 시작 후 5분\n전체 문항과 배점을 확인하고 작성 순서를 정한다. 확실히 아는 약술형을 먼저 처리하여 점수를 확보한 뒤 사례형 계산에 남은 시간을 쓴다.\n\nⅢ. 답안 작성 전략\n1. 목차 먼저 — 여백에 Ⅰ·Ⅱ·Ⅲ 목차를 적고 시작하면 항목 누락을 막을 수 있다.\n2. 두괄식 — 각 항목의 결론을 먼저 쓰고 근거를 붙인다.\n3. 계산은 과정을 남긴다 — 답만 쓰면 부분점수가 없다.\n4. 표의 활용 — 피해자별·담보별 금액은 표로 정리하면 채점자가 한눈에 파악한다.\n\nⅣ. 시간이 모자랄 때\n문장을 줄이지 말고 목차와 핵심 키워드를 모두 채운다. 채점이 키워드 단위로 이루어지기 때문이다.\n\nⅤ. 형식 규정\n흑색 또는 청색 필기구 한 종류만 사용하고, 정정은 두 줄로 긋고 다시 쓴다. 수정테이프는 사용하지 않는다. 신체손해사정사는 전 과목 계산기 사용이 불가하다.`},

       a:`Ⅰ. 피해자가 근로자인 경우\n1. 적용 보험 — 근로자재해보상책임보험(사용자배상책임 특별약관 등)\n2. 근거 — 사용자의 안전배려의무 위반 또는 민법 제750조·제756조\n3. 산재보험과의 조정 — 산재 급여를 손익상계로 공제하며, 공제 후 과실상계 방식에 따른다.\n4. 영업배상책임보험에서는 피보험자의 근로자가 입은 신체장해를 <b>면책</b>으로 정하고 있어 중복이 배제된다.\n\nⅡ. 피해자가 제3자인 경우\n1. 적용 보험 — 영업배상책임보험(시설소유관리자 특별약관 등), 생산물배상책임보험, 각종 의무보험\n2. 근거 — 민법 제750조, 제756조, 제758조(공작물책임), 제759조(동물점유자책임)\n3. 산재보험과 무관하므로 손익상계 대상이 다르다.\n\nⅢ. 실무상 의의\n동일한 사고라도 피해자의 지위에 따라 적용 보험과 면책조항이 달라지므로, 사례에서 피해자마다 지위를 먼저 확정하여야 한다.`},

       a:`Ⅰ. 적극손해\n1. 내용 — 치료비(요양비), 개호비, 장례비, 의료보조기 비용 등 실제 지출한 비용\n2. 실무 — 영수증 등 증빙으로 확인하며, 향후치료비와 개호비는 일시금 지급 시 중간이자를 공제한다.\n\nⅡ. 소극손해\n1. 내용 — 일실수익(휴업손해 및 상실수익액), 일실퇴직금\n2. 실무 — 현실소득액 × 노동능력상실률 × 가동기간(중간이자공제)으로 산정하며, 사망은 생계비를 공제한다. 일실퇴직금은 예상퇴직금을 현가화한 후 기수령액을 공제한다.\n\nⅢ. 위자료\n1. 내용 — 정신적 고통에 대한 배상\n2. 실무 — 법원 기준 또는 약관 기준에 따라 산정하며, 과실상계 시 과실비율을 전부 반영하지 않고 일부만 참작하는 실무례가 있다.\n\nⅣ. 손익상계와의 관계\n산재 요양급여는 치료비에서, 휴업급여는 요양기간 일실수익에서, 장해·유족급여는 요양 이후 일실수익에서 공제하며 위자료에서는 공제하지 않는다.`},

      {q:"근재보험 사례에서 '법률상 배상책임'과 '약관상 보상책임'을 구분하여 검토하여야 하는 이유를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 두 개념의 구별\n1. 법률상 배상책임 — 피보험자가 피해자에 대하여 민법 등에 따라 부담하는 책임으로, 책임의 성립 여부와 범위를 결정한다.\n2. 약관상 보상책임 — 그 법률상 책임 중 보험자가 인수한 부분으로, 담보 여부와 지급 범위를 결정한다.\n\nⅡ. 구분이 필요한 이유\n1. 법률상 책임이 있어도 약관상 면책이면 보험금은 지급되지 않는다. 예컨대 근로자의 신체장해는 영업배상책임보험에서 면책이다.\n2. 반대로 약관이 법률상 책임보다 넓게 담보하는 경우도 있다(재해보상책임 특별약관은 과실 없는 재해보상 의무를 담보한다).\n3. 자기부담금·보상한도액은 약관상 문제이므로 법률상 책임액과 지급보험금이 달라진다.\n\nⅢ. 답안 구성\n반드시 'Ⅰ. 법률상 배상책임 → Ⅱ. 약관상 보상책임'의 순서로 목차를 잡고, 각각의 결론을 따로 제시하여야 한다.\n\nⅣ. 결론\n두 단계를 섞어 서술하면 논리가 무너지므로 층위를 분리하는 것이 이 과목 답안의 기본이다.`},
      {q:"업무상 재해로 근로자가 사망한 경우 유족이 청구할 수 있는 급부의 종류를 열거하고 상호관계를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 청구 가능한 급부\n1. 산재보험 — 유족급여, 장의비, 요양급여, 휴업급여\n2. 근로기준법상 재해보상 — 산재보험 미적용 사업장인 경우 유족보상, 장례비\n3. 민법상 손해배상 — 사용자의 안전배려의무 위반 또는 불법행위에 따른 손해배상(위자료 포함)\n4. 근재보험 — 위 민법상 배상책임을 담보\n5. 제3자가 있는 경우 그 제3자에 대한 손해배상청구\n\nⅡ. 상호관계\n1. 산재보험과 근로기준법상 재해보상 — 산재보험 급여가 지급되면 사용자는 근로기준법상 재해보상 책임을 면한다.\n2. 산재보험과 민법상 손해배상 — 동일 성질의 항목에서 손익상계로 공제하며, 위자료는 공제하지 않는다.\n3. 근로복지공단의 구상 — 공단은 지급한 급여의 범위에서 제3자에 대한 청구권을 대위한다.\n\nⅢ. 결론\n중복전보를 방지하기 위하여 항목 대응 원칙에 따라 공제하되, 위자료 부분은 산재보험이 전보하지 않으므로 근재보험의 고유 영역이 된다.`},
      {q:"책임보험에서 '보상하는 손해'와 '보상하지 않는 손해'를 검토하는 실무상 순서를 설명하시오. (10점)", pts:10, lik:2,
       a:`Ⅰ. 검토 순서\n1. 담보 종목과 특별약관의 확정 — 사고 유형과 피해자 지위로 적용 약관을 특정한다.\n2. 보상하는 손해 해당 여부 — 약관이 정한 담보위험(시설의 소유·사용·관리, 업무수행, 생산물 등)에 해당하는지 확인한다.\n3. 우연성 — 예견되지 않은 사고인지 확인한다.\n4. 면책사유 — 고의, 계약에 의해 가중된 책임, 전쟁·핵연료, 근로자의 신체장해, 피보험자가 소유·점유·관리하는 재물 등에 해당하는지 확인한다.\n5. 보험기간과 담보기준 — 사고발생기준인지 배상청구기준인지 확인한다.\n\nⅡ. 유의사항\n1. '보상하는 손해'에 해당하더라도 면책사유가 있으면 지급하지 않는다.\n2. 면책조항은 제한적으로 해석하는 것이 원칙이나, 다른 보험의 고유 영역과 중복을 피하기 위한 면책(근로자 신체장해 등)은 그 취지를 고려하여 판단한다.\n\nⅢ. 결론\n담보 확정 → 담보위험 해당 → 면책 검토의 순서를 지켜야 누락 없이 결론을 낼 수 있다.`}
    ],
    past:[]
  },

      {h:"책임제한 3요소와 적용 순서", freq:F(3,[49]),
       body:`<div class="why"><span class="h">49회가 7점으로 물은 핵심</span>
       손해배상금을 정할 때 공평한 분담을 위해 세 가지를 깎는다. <b>기왕증 공제 · 과실상계 · 손익상계</b>. 대법원이 정한 순서가 있고, 순서를 바꾸면 금액이 달라진다.</div>
       <p><b>Ⅰ. 각 제도의 의의</b></p>
       <ol><li><b>과실상계</b> — 피해자 측의 주의의무 위반이 손해의 발생·확대에 기여한 경우 공평의 원칙에 따라 배상액을 감경하는 제도. 여기의 과실은 불법행위 성립요건인 '타인에 대한 의무위반'과 달리, 신의칙상 인정되는 <b>'자기의 불이익을 방지하기 위한 주의의무 위반'</b>을 의미한다.</li>
       <li><b>기왕증 공제</b> — 사고 이전의 기왕증이나 체질적 요인이 손해의 발생·확대에 기여한 경우 이를 참작하여 손해액을 감액하는 제도. 대법원은 상당인과관계 자체는 인정하되 <b>과실상계 규정을 유추적용</b>하여 참작한다.</li>
       <li><b>손익상계</b> — 동일한 원인으로 피해자가 이익을 얻은 경우 실손해 전보 원칙에 따라 손해액에서 공제하는 제도. <b>명문 규정은 없으나</b> 손해배상 제도의 형평 이념상 당연히 인정된다.</li></ol>
       <div class="tmpl"><b>[대법원 판례상 적용 순서]</b>
① <b>기왕증(기여도) 공제</b>  → ② <b>과실상계</b> → ③ <b>손익상계</b>

이유 — 순수하게 이번 사고로 인한 손해액을 확정하기 위해 기왕증을 먼저 공제하고,
확정된 사고 손해액에 피해자의 과실비율을 적용하며,
마지막으로 남은 배상액 범위 내에서 이득을 공제하여야 형평에 부합한다.</div>
       <div class="scroller"><table class="mini">
       <tr><th>단계</th><th>계산 (예: 손해 1억, 기왕증 20%, 과실 30%, 타 보험금 2,000만)</th></tr>
       <tr><td>① 기왕증 공제</td><td>1억 × (1 − 0.2) = <b>8,000만원</b></td></tr>
       <tr><td>② 과실상계</td><td>8,000만 × (1 − 0.3) = <b>5,600만원</b></td></tr>
       <tr><td>③ 손익상계</td><td>5,600만 − 2,000만 = <b>3,600만원</b></td></tr>
       </table></div>`,
       mnemo:{key:"기 · 과 · 손", how:"<b>기</b>왕증 → <b>과</b>실상계 → <b>손</b>익상계.<br>이유도 한 줄로 — \u201c내 사고 손해만 남기고(기왕증), 네 몫을 빼고(과실), 이미 받은 걸 뺀다(손익)\u201d.<br>단 <b>산재보험급여</b>는 판례가 <b>공제 후 과실상계</b>를 채택하므로 별도로 언급한다."}},

      {h:"공동불법행위와 부진정연대책임", freq:F(2,[42,45,48]),
       body:`<p><b>공동불법행위</b>(민법 제760조) — 여러 사람이 공동의 불법행위로 타인에게 손해를 가한 때에는 <b>연대하여</b> 배상책임을 진다.</p>
       <ul><li><b>부진정연대채무</b> — 각자가 피해자에 대하여 손해 전부를 배상할 의무를 지되, 채무자 사이에 주관적 공동관계가 없는 관계를 말한다. 피해자는 누구에게나 전액을 청구할 수 있다.</li>
       <li><b>내부적 구상</b> — 배상한 자는 다른 공동불법행위자에게 <b>과실비율(부담부분)</b>에 따라 구상할 수 있다.</li>
       <li><b>보험자 간 처리</b> — 각 가해자의 보험자가 다르면 부담부분에 따라 정산하며, 동일한 피보험이익에 복수 보험이 있으면 <b>중복보험의 분담</b> 문제로 처리한다.</li></ul>
       <div class="lead">사례에서 가해자가 둘 이상이면 반드시 <b>① 각자의 법률상 책임 → ② 부진정연대 → ③ 보험사별 분담</b>의 순서로 서술한다.</div>`},

      {h:"민법 제755조 · 제757조 · 제760조 — 빠뜨리기 쉬운 세 조문", freq:F(3,[41,44,46,48]),
       body:`<div class="scroller"><table class="mini">
